<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Core Four Stats Lab</title><style>body{margin:0;background:#07101b;color:#fff;font:14px system-ui}.shell{max-width:1450px;margin:auto;padding:20px}.muted{color:#91a4bd}.error{color:#ff8d87}.tabs,.ctl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0}.card{background:#0e1928;border:1px solid #263a55;border-radius:12px;padding:12px}button,select,input{background:#132238;color:#fff;border:1px solid #345;border-radius:8px;padding:9px}button.active{background:#f4b400;color:#111;font-weight:800}.wrap{overflow:auto;margin-top:10px}table{border-collapse:collapse;width:100%;min-width:760px;background:#0e1928}th,td{padding:8px;border-bottom:1px solid #263a55;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.p{display:flex;align-items:center;gap:8px}.p img{width:34px;height:34px;border-radius:50%;object-fit:cover}.rank{font-weight:900;color:#ffd45c}.empty{padding:20px;border:1px dashed #345;border-radius:10px;color:#91a4bd}</style></head><body><main class="shell"><h1>Core Four Stats Lab</h1><div class="muted">NFL · NBA · MLB · NHL league leaders by year, category and team.</div><div id="sports" class="tabs"></div><div class="card ctl"><label>Season <select id="season"></select></label><label>Season Type <select id="type"><option value="2">Regular</option><option value="3">Playoffs</option></select></label><label>Scope <select id="scope"><option value="league">League</option><option value="team">Team</option></select></label><label id="teamWrap">Team <select id="team"></select></label><label>Category <select id="category"><option value="ALL">All categories</option></select></label><input id="search" placeholder="Filter player"><button id="load">Load</button></div><div id="status" class="muted"></div><div id="out" class="wrap"></div></main><script>
'use strict';
const CFG={NFL:{sport:'football',league:'nfl'},NBA:{sport:'basketball',league:'nba'},MLB:{sport:'baseball',league:'mlb'},NHL:{sport:'hockey',league:'nhl'}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let sport=localStorage.getItem('statsSport')||'NFL',teams=[],rows=[];
async function get(url){const r=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function current(){const d=new Date();return sport==='MLB'?d.getFullYear():(d.getMonth()<6?d.getFullYear()-1:d.getFullYear())}
function tabs(){$('sports').innerHTML=Object.keys(CFG).map(s=>`<button data-s="${s}" class="${s===sport?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.setItem('statsSport',sport);tabs();setupYears();loadTeams()})}
function setupYears(){const y=current(),old=$('season').value;$('season').innerHTML=Array.from({length:27},(_,i)=>y-i).map(n=>`<option value="${n}">${sport==='NBA'||sport==='NHL'?n+'-'+String(n+1).slice(-2):n}</option>`).join('');if([...$('season').options].some(o=>o.value===old))$('season').value=old}
function refId(o){const r=o?.$ref||'';return (r.match(/\/(?:athletes|teams)\/(\d+)(?:\?|$)/)||[])[1]||''}
async function loadTeams(){try{const c=CFG[sport],j=await get(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams?limit=100`);teams=(j?.sports?.[0]?.leagues?.[0]?.teams||[]).map(x=>x.team||x).filter(x=>x?.id).sort((a,b)=>(a.displayName||'').localeCompare(b.displayName||''));$('team').innerHTML=teams.map(t=>`<option value="${t.id}">${esc(t.displayName||t.name)}</option>`).join('');await run()}catch(e){$('status').innerHTML=`<span class="error">Team list failed: ${esc(e.message)}</span>`}}
function rawRows(j){const cats=Array.isArray(j?.categories)?j.categories:Array.isArray(j?.leaders?.categories)?j.leaders.categories:[];const out=[];for(const cat of cats){for(let i=0;i<(cat?.leaders||[]).length;i++){const l=cat.leaders[i],a=l.athlete||{},t=l.team||{};out.push({category:cat.displayName||cat.name||'Stat',catKey:cat.name||cat.displayName||'Stat',rank:l.rank||i+1,value:l.displayValue??l.value??'',athleteId:a.id||refId(a),athleteName:a.displayName||a.fullName||'',head:a.headshot?.href||'',teamId:t.id||refId(t),team:t.abbreviation||''})}}return out}
async function hydrate(input){const c=CFG[sport],ath=new Map(),tm=new Map(teams.map(t=>[String(t.id),t]));const ids=[...new Set(input.filter(r=>!r.athleteName&&r.athleteId).map(r=>r.athleteId))].slice(0,120);await Promise.all(ids.map(async id=>{try{const a=await get(`https://sports.core.api.espn.com/v2/sports/${c.sport}/leagues/${c.league}/athletes/${id}`);ath.set(String(id),a)}catch{}}));return input.map(r=>{const a=ath.get(String(r.athleteId)),t=tm.get(String(r.teamId));return{...r,athleteName:r.athleteName||a?.displayName||a?.fullName||('Athlete '+r.athleteId),head:r.head||a?.headshot?.href||'',team:r.team||t?.abbreviation||''}})}
function categoryOptions(){const old=$('category').value,cats=[...new Map(rows.map(r=>[r.catKey,r.category])).entries()];$('category').innerHTML='<option value="ALL">All categories</option>'+cats.map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join('');if([...$('category').options].some(o=>o.value===old))$('category').value=old}
function render(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value,scope=$('scope').value,tid=$('team').value;let a=rows.filter(r=>(cat==='ALL'||r.catKey===cat)&&(!q||r.athleteName.toLowerCase().includes(q))&&(scope==='league'||String(r.teamId)===String(tid)));$('out').innerHTML=a.length?`<table><thead><tr><th>Player</th><th>Category</th><th>Rank</th><th>Team</th><th>Value</th></tr></thead><tbody>${a.map(r=>`<tr><td><div class="p"><img src="${esc(r.head)}" alt="" onerror="this.style.visibility='hidden'"><b>${esc(r.athleteName)}</b></div></td><td>${esc(r.category)}</td><td class="rank">${esc(r.rank)}</td><td>${esc(r.team)}</td><td><b>${esc(r.value)}</b></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No rows match this scope/category. Team scope filters the league-leader feed to that team.</div>'}
async function run(){$('status').textContent='Loading ESPN leaders…';$('out').innerHTML='';try{const c=CFG[sport],y=$('season').value,t=$('type').value;const urls=[`https://sports.core.api.espn.com/v2/sports/${c.sport}/leagues/${c.league}/seasons/${y}/types/${t}/leaders`,`https://site.api.espn.com/apis/site/v3/sports/${c.sport}/${c.league}/leaders?season=${y}&seasontype=${t}`];let found=[],last;for(const u of urls){try{const j=await get(u);found=rawRows(j);if(found.length)break}catch(e){last=e}}if(!found.length)throw last||Error('No leader categories returned');rows=await hydrate(found);categoryOptions();render();$('status').textContent=`${sport} ${y} · ${rows.length} leader rows across ${new Set(rows.map(r=>r.catKey)).size} categories.`}catch(e){rows=[];$('status').innerHTML=`<span class="error">Stats load failed: ${esc(e.message)}</span>`;$('out').innerHTML='<div class="empty">No statistics returned for this selection.</div>'}}
$('load').onclick=run;$('season').onchange=run;$('type').onchange=run;$('scope').onchange=()=>{$('teamWrap').style.display=$('scope').value==='team'?'':'none';render()};$('team').onchange=render;$('category').onchange=render;$('search').oninput=render;tabs();setupYears();$('teamWrap').style.display='none';loadTeams();
</script></body></html>
