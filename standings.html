<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standings Lab</title><style>:root{--bg:#07101b;--panel:#0e1928;--line:#263a55;--muted:#91a4bd;--gold:#f4b400}*{box-sizing:border-box}body{font-family:system-ui;background:var(--bg);color:#fff;margin:0;padding:18px}button,select,input{padding:9px;margin:3px;background:#132238;color:#fff;border:1px solid #345;border-radius:8px}button.active{background:var(--gold);color:#111}.tabs,.controls{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:8px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:12px}.wrap{overflow:auto;max-height:72vh}table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel)}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#132238;z-index:3}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#101d2e;z-index:2}th:first-child{z-index:4}.team{display:flex;align-items:center;gap:7px}.team img{width:26px;height:26px;object-fit:contain}.muted{color:var(--muted)}.hidden{display:none}.heat{font-weight:800;text-align:center!important;min-width:68px}.legend{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin:8px}.gradient{width:180px;height:12px;border-radius:6px;background:linear-gradient(90deg,#8f2222,#8b7621,#1f7a3b)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.stat{background:#101d2e;border:1px solid var(--line);padding:10px;border-radius:9px}.stat b{font-size:19px;display:block}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{padding:5px 8px;border:1px solid #345;border-radius:999px;font-size:12px}.pos{color:#7ee787}.neg{color:#ff7b72}h1{margin:0}</style></head><body><h1>Standings Lab</h1><div class="muted">Core Four standings + historical league performance</div><div id="sports" class="tabs"></div><div class="tabs"><button data-view="standings" class="active">Season Standings</button><button data-view="history">League History</button><button data-view="compare">Team Compare</button><button data-view="cross">Core Four</button></div><section id="standingsView"><div class="controls"><label>Season <select id="season"></select></label><label>Scope <select id="scope"><option value="division">Division</option><option value="conference">Conference</option><option value="league">League</option></select></label><input id="filter" placeholder="Filter team"><button id="refresh">Refresh</button></div><div id="status" class="muted"></div><div id="out" class="wrap"></div></section><section id="historyView" class="hidden"><div class="card"><div class="controls"><label>From <select id="fromYear"></select></label><label>To <select id="toYear"></select></label><label>Metric <select id="metric"><option value="rank">League Rank</option><option value="pct">Win / Points %</option><option value="wins">Wins</option><option value="diff">Differential</option></select></label><label>Teams <select id="teamMode"><option value="all">All in span</option><option value="current">Current only</option></select></label><button id="historyBtn">Build History</button></div><div class="legend"><span>Worse</span><div class="gradient"></div><span>Better</span></div></div><div id="historyStatus" class="muted"></div><div id="historySummary"></div><div id="historyOut" class="wrap"></div></section><section id="compareView" class="hidden"><div class="card"><div class="controls"><label>From <select id="cmpFrom"></select></label><label>To <select id="cmpTo"></select></label><label>Teams <select id="cmpTeams" multiple size="6" style="min-width:230px"></select></label><button id="cmpBtn">Compare Teams</button></div><div class="muted">Select multiple teams (Ctrl/Cmd-click). Shows season-by-season rank plus span aggregates.</div></div><div id="cmpStatus" class="muted"></div><div id="cmpOut" class="wrap"></div></section><section id="crossView" class="hidden"><div class="card"><div class="controls"><label>Season <select id="crossYear"></select></label><button id="crossBtn">Compare All Sports</button></div><div class="muted">Cross-sport comparison uses league percentile, not raw wins.</div></div><div id="crossStatus" class="muted"></div><div id="crossOut" class="wrap"></div></section><script>const S={NFL:'football/nfl',NBA:'basketball/nba',MLB:'baseball/mlb',NHL:'hockey/nhl'},$=x=>document.getElementById(x);let sport=localStorage.standingsSport||'NFL',data=[],cache={};function cur(sp=sport){let d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;return ['NFL','NBA','NHL'].includes(sp)&&m<7?y-1:y}function years(sp=sport){let a=[];for(let y=cur(sp);y>=2002;y--)a.push(y);return a}function label(y,sp=sport){return ['NBA','NHL'].includes(sp)?y+'-'+String(y+1).slice(-2):String(y)}function smap(e){let m={};(e.stats||[]).forEach(s=>{m[s.name]=s.displayValue??s.value;m[s.abbreviation]=s.displayValue??s.value;m['_'+s.name]=Number(s.value)});return m}function n(m,k,d=0){let v=m['_'+k];if(Number.isFinite(v))return v;v=parseFloat(m[k]);return Number.isFinite(v)?v:d}function flat(node,path=[]){let a=[];if(node?.standings?.entries)node.standings.entries.forEach(e=>a.push({e,path:[...path]}));(node.children||[]).forEach(c=>a=a.concat(flat(c,path.concat(c.name||c.abbreviation||'Group'))));return a}async function fetchSeason(sp,y){let k=sp+y;if(cache[k])return cache[k];let r=await fetch('https://site.api.espn.com/apis/v2/sports/'+S[sp]+'/standings?season='+y);if(!r.ok)throw Error(r.status);let j=await r.json();return cache[k]=flat({children:j.children||[]})}function pct(x,sp=sport){let m=smap(x.e);if(sp==='NHL'){let pp=n(m,'pointsPercentage',NaN);if(Number.isFinite(pp))return pp;let pts=n(m,'points'),gp=n(m,'gamesPlayed',n(m,'wins')+n(m,'losses')+n(m,'otLosses'));return pts/Math.max(1,2*gp)}let p=n(m,'winPercent',NaN);if(Number.isFinite(p))return p;let w=n(m,'wins'),l=n(m,'losses'),t=n(m,'ties');return (w+.5*t)/Math.max(1,w+l+t)}function diff(x){let m=smap(x.e);return n(m,'pointDifferential',n(m,'differential',n(m,'pointsFor')-n(m,'pointsAgainst')))}function points(x){return n(smap(x.e),'points')}function rw(x){let m=smap(x.e);return n(m,'regulationWins',n(m,'regulationWin',n(m,'RW')))}function row(x){let m=smap(x.e);return n(m,'regulationOvertimeWins',n(m,'ROW'))}function rankSort(sp){return(a,b)=>{let A=smap(a.e),B=smap(b.e);if(sp==='NHL')return points(b)-points(a)||pct(b,sp)-pct(a,sp)||rw(b)-rw(a)||row(b)-row(a)||n(B,'wins')-n(A,'wins')||diff(b)-diff(a);return pct(b,sp)-pct(a,sp)||diff(b)-diff(a)}}function heat(v){v=Math.max(0,Math.min(1,v));return'background:hsl('+(120*v)+' 55% 30%);color:white'}function org(x,scope){let p=x.path||[];if(scope==='league')return sport;if(scope==='division')return p.at(-1)||'Division';if(p.length>=2)return p[0];return p[0]||'Conference'}function cols(){if(sport==='NHL')return[['GP','gamesPlayed'],['W','wins'],['L','losses'],['OTL','otLosses'],['PTS','points'],['P%','pointsPercentage'],['RW','regulationWins'],['ROW','regulationOvertimeWins'],['GF','pointsFor'],['GA','pointsAgainst'],['DIFF','differential'],['STRK','streak']];if(sport==='NFL')return[['W','wins'],['L','losses'],['T','ties'],['PCT','winPercent'],['PF','pointsFor'],['PA','pointsAgainst'],['DIFF','pointDifferential'],['DIV','vsDiv'],['CONF','vsConf'],['STRK','streak']];if(sport==='NBA')return[['W','wins'],['L','losses'],['PCT','winPercent'],['GB','gamesBehind'],['HOME','home'],['AWAY','road'],['CONF','vsConf'],['PPG','avgPointsFor'],['OPP','avgPointsAgainst'],['DIFF','differential'],['STRK','streak']];return[['W','wins'],['L','losses'],['PCT','winPercent'],['GB','gamesBehind'],['HOME','home'],['AWAY','road'],['RS','pointsFor'],['RA','pointsAgainst'],['DIFF','differential'],['L10','lastTenGames'],['STRK','streak']]}function sportButtons(){$('sports').innerHTML=Object.keys(S).map(s=>'<button data-s="'+s+'" class="'+(s===sport?'active':'')+'">'+s+'</button>').join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.standingsSport=sport;sportButtons();fillYears();load()})}function fillYears(){let h=years().map(y=>'<option value="'+y+'">'+label(y)+'</option>').join('');['season','fromYear','toYear','cmpFrom','cmpTo'].forEach(id=>$(id).innerHTML=h);$('fromYear').value=$('cmpFrom').value=Math.max(2002,cur()-9);$('toYear').value=$('cmpTo').value=cur();$('crossYear').innerHTML=years('NFL').map(y=>'<option>'+y+'</option>').join('')}async function load(){$('status').textContent='Loading...';try{data=await fetchSeason(sport,+$('season').value);render();fillTeams();$('status').textContent=data.length+' teams · '+(sport==='NHL'?'NHL ordered by points, then available official-style tiebreak fields':'sport-specific standings order')}catch(e){$('status').textContent='Load failed: '+e.message}}function render(){let groups={},scope=$('scope').value,q=$('filter').value.toLowerCase();data.filter(x=>x.e.team.displayName.toLowerCase().includes(q)).forEach(x=>(groups[org(x,scope)]??=[]).push(x));let cs=cols();Object.values(groups).forEach(a=>a.sort(rankSort(sport)));$('out').innerHTML=Object.entries(groups).map(([g,a])=>'<h2>'+g+'</h2><table><thead><tr><th>Team</th><th>'+scope+' Rank</th>'+cs.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+a.map((x,i)=>{let m=smap(x.e),t=x.e.team,v=a.length>1?1-i/(a.length-1):1;return'<tr><td><div class="team"><img src="'+(t.logos?.[0]?.href||'')+'"><b>'+t.displayName+'</b></div></td><td class="heat" style="'+heat(v)+'">'+(i+1)+'/'+a.length+'</td>'+cs.map(c=>'<td>'+(m[c[1]]??m[c[0]]??'—')+'</td>').join('')+'</tr>'}).join('')+'</tbody></table>'}).join('')||'<p>No teams.</p>'}function fillTeams(){let a=[...data].sort((x,y)=>x.e.team.displayName.localeCompare(y.e.team.displayName));$('cmpTeams').innerHTML=a.map(x=>'<option value="'+x.e.team.id+'">'+x.e.team.displayName+'</option>').join('')}async function getSpan(a,b){if(a>b)[a,b]=[b,a];let ys=[];for(let y=a;y<=b;y++)ys.push(y);let packs=await Promise.all(ys.map(y=>fetchSeason(sport,y)));return{ys,packs}}function seasonRanks(d){let r=[...d].sort(rankSort(sport)),m=new Map();r.forEach((x,i)=>m.set(String(x.e.team.id),{x,rank:i+1,total:r.length,norm:r.length>1?1-i/(r.length-1):1}));return m}async function history(){let a=+$('fromYear').value,b=+$('toYear').value;$('historyStatus').textContent='Loading league history...';try{let{ys,packs}=await getSpan(a,b),maps=packs.map(seasonRanks),teams=new Map(),current=new Set(data.map(x=>String(x.e.team.id)));packs.flat().forEach(x=>teams.set(String(x.e.team.id),{name:x.e.team.displayName,logo:x.e.team.logos?.[0]?.href||''}));let ids=[...teams.keys()].filter(id=>$('teamMode').value==='all'||current.has(id)),metric=$('metric').value;function cell(z){if(!z)return null;let m=smap(z.x.e),raw=metric==='rank'?z.rank:metric==='pct'?pct(z.x):metric==='wins'?n(m,'wins'):diff(z.x);return{...z,raw}}ids.sort((a,b)=>{let A=maps.map(m=>m.get(a)).filter(Boolean),B=maps.map(m=>m.get(b)).filter(Boolean);return B.reduce((s,z)=>s+z.norm,0)/Math.max(1,B.length)-A.reduce((s,z)=>s+z.norm,0)/Math.max(1,A.length)});$('historyOut').innerHTML='<table><thead><tr><th>Team</th>'+ys.map(y=>'<th>'+label(y)+'</th>').join('')+'<th>Avg %ile</th><th>Best</th><th>Worst</th></tr></thead><tbody>'+ids.map(id=>{let t=teams.get(id),zs=maps.map(m=>cell(m.get(id))),v=zs.filter(Boolean),avg=v.reduce((s,z)=>s+z.norm,0)/Math.max(1,v.length),best=Math.min(...v.map(z=>z.rank)),worst=Math.max(...v.map(z=>z.rank));return'<tr><td><div class="team"><img src="'+t.logo+'"><b>'+t.name+'</b></div></td>'+zs.map(z=>z?'<td class="heat" style="'+heat(z.norm)+'" title="Rank '+z.rank+'/'+z.total+'">'+(metric==='pct'?(z.raw*100).toFixed(1)+'%':metric==='rank'?z.rank+'/'+z.total:Math.round(z.raw))+'</td>':'<td>—</td>').join('')+'<td class="heat" style="'+heat(avg)+'">'+Math.round(avg*100)+'%</td><td>'+best+'</td><td>'+worst+'</td></tr>'}).join('')+'</tbody></table>';$('historySummary').innerHTML='<div class="summary"><div class="stat"><span class="muted">Seasons</span><b>'+ys.length+'</b></div><div class="stat"><span class="muted">Teams/franchises</span><b>'+ids.length+'</b></div><div class="stat"><span class="muted">Ranking basis</span><b>'+(sport==='NHL'?'Points':'Record')+'</b></div></div>';$('historyStatus').textContent='Loaded'}catch(e){$('historyStatus').textContent='Failed: '+e.message}}async function compare(){let ids=[...$('cmpTeams').selectedOptions].map(o=>o.value);if(!ids.length)return $('cmpStatus').textContent='Select at least one team.';$('cmpStatus').textContent='Loading...';try{let{ys,packs}=await getSpan(+$('cmpFrom').value,+$('cmpTo').value),maps=packs.map(seasonRanks),names=new Map();packs.flat().forEach(x=>names.set(String(x.e.team.id),x.e.team.displayName));$('cmpOut').innerHTML='<table><thead><tr><th>Team</th>'+ys.map(y=>'<th>'+label(y)+'</th>').join('')+'<th>Avg Rank</th><th>Avg %ile</th><th>Best</th><th>Worst</th><th>Consistency</th></tr></thead><tbody>'+ids.map(id=>{let zs=maps.map(m=>m.get(id)),v=zs.filter(Boolean),avgRank=v.reduce((s,z)=>s+z.rank,0)/Math.max(1,v.length),avg=v.reduce((s,z)=>s+z.norm,0)/Math.max(1,v.length),variance=v.reduce((s,z)=>s+(z.norm-avg)**2,0)/Math.max(1,v.length),cons=Math.max(0,100-Math.sqrt(variance)*200);return'<tr><td><b>'+names.get(id)+'</b></td>'+zs.map(z=>z?'<td class="heat" style="'+heat(z.norm)+'">'+z.rank+'/'+z.total+'</td>':'<td>—</td>').join('')+'<td>'+avgRank.toFixed(1)+'</td><td>'+Math.round(avg*100)+'%</td><td>'+Math.min(...v.map(z=>z.rank))+'</td><td>'+Math.max(...v.map(z=>z.rank))+'</td><td>'+Math.round(cons)+'</td></tr>'}).join('')+'</tbody></table>';$('cmpStatus').textContent='Comparison loaded'}catch(e){$('cmpStatus').textContent='Failed: '+e.message}}async function cross(){let y=+$('crossYear').value;$('crossStatus').textContent='Loading four leagues...';try{let sports=Object.keys(S),packs=await Promise.all(sports.map(sp=>fetchSeason(sp,y))),rows=[];sports.forEach((sp,i)=>{let ranked=[...packs[i]].sort(rankSort(sp));ranked.forEach((x,j)=>rows.push({sp,x,rank:j+1,total:ranked.length,norm:ranked.length>1?1-j/(ranked.length-1):1}))});rows.sort((a,b)=>b.norm-a.norm);$('crossOut').innerHTML='<table><thead><tr><th>Team</th><th>Sport</th><th>League Rank</th><th>Percentile</th><th>Record metric</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><div class="team"><img src="'+(r.x.e.team.logos?.[0]?.href||'')+'"><b>'+r.x.e.team.displayName+'</b></div></td><td>'+r.sp+'</td><td class="heat" style="'+heat(r.norm)+'">'+r.rank+'/'+r.total+'</td><td>'+Math.round(r.norm*100)+'%</td><td>'+(r.sp==='NHL'?points(r.x)+' pts':(pct(r.x,r.sp)*100).toFixed(1)+'%')+'</td></tr>').join('')+'</tbody></table>';$('crossStatus').textContent=rows.length+' teams'}catch(e){$('crossStatus').textContent='Failed: '+e.message}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));['standings','history','compare','cross'].forEach(v=>$(v+'View').classList.toggle('hidden',v!==b.dataset.view))});sportButtons();fillYears();$('season').onchange=load;$('scope').onchange=render;$('filter').oninput=render;$('refresh').onclick=load;$('historyBtn').onclick=history;$('cmpBtn').onclick=compare;$('crossBtn').onclick=cross;load();</script></body></html>
