<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Betting Lab</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui}.w{max-width:1400px;margin:auto;padding:18px}.muted{color:#91a3ba}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}select,button{padding:8px;background:#101d31;color:#fff;border:1px solid #31445f;border-radius:8px}button{background:#1769c2;font-weight:900}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.card,.box,.progress{background:#0e192a;border:1px solid #26364d;border-radius:10px;padding:10px}.card b{font-size:20px;display:block}.box{overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #26364d;text-align:center;white-space:nowrap}.win{color:#72dfa2;font-weight:800}.loss{color:#ff8b8b}.push{color:#ffd45c}.err{color:#ff8b8b}.progress{display:none;margin:10px 0}.progress.on{display:block}.track{height:8px;background:#17243a;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#1769c2,#72dfa2);width:0;transition:width .25s}.spin{display:inline-block;width:13px;height:13px;border:2px solid #55708f;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class=w><h1>💰 NFL Betting Lab</h1><div class=muted>Analyze ESPN historical lines by week, season, or multi-year range. Team filters recalculate ATS from that team's side.</div><div class=controls><select id=scope><option value=season>Season</option><option value=week>Single Week</option><option value=range>Year Range</option></select><select id=year></select><select id=endYear style="display:none"></select><select id=type><option value=2>Regular</option><option value=3>Postseason</option><option value=ALL>Reg + Post</option></select><select id=week style="display:none"></select><select id=team><option value=ALL>All Teams</option></select><button id=go>Load Betting Results</button></div><div id=progress class=progress><span class=spin></span> <span id=phase>Preparing…</span><div class=track><div id=fill class=fill></div></div></div><div id=status class=muted>Ready.</div><div id=cards class=cards style="margin-top:12px"></div><div class=box><table id=tbl></table></div></div><script>'use strict';const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl',E=x=>document.getElementById(x),scope=E('scope'),year=E('year'),endYear=E('endYear'),type=E('type'),week=E('week'),team=E('team'),go=E('go'),status=E('status'),cards=E('cards'),tbl=E('tbl'),progress=E('progress'),phase=E('phase'),fill=E('fill');for(let y=new Date().getFullYear();y>=1999;y--){year.add(new Option(y,y));endYear.add(new Option(y,y))}for(let w=1;w<=18;w++)week.add(new Option('Week '+w,w));let data=[];async function J(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}function prog(t,n=0,d=1){progress.classList.add('on');phase.textContent=t;fill.style.width=`${Math.min(100,100*n/d)}%`}const norm=t=>({WAS:'WSH',LA:'LAR',JAC:'JAX'}[String(t||'').toUpperCase()]||String(t||'').toUpperCase());function weeks(y,t){return t===2?(y>=2021?18:17):5}function parseLine(od,home,away){let total=Number(od?.overUnder),details=String(od?.details||'').trim(),spread=Number(od?.spread),fav='',favSpread=NaN,m=details.match(/^([A-Z]{2,4})\s*([+-]?\d+(?:\.\d+)?)/i);if(m){fav=norm(m[1]);favSpread=Number(m[2])}if(!fav&&Number.isFinite(spread)&&spread!==0){fav=spread<0?home:away;favSpread=-Math.abs(spread)}let pts=Number.isFinite(favSpread)?Math.abs(favSpread):NaN;if(![home,away].includes(fav))return{total:Number.isFinite(total)?total:null,details,fav:'',pts:null};return{total:Number.isFinite(total)?total:null,details,fav,pts:Number.isFinite(pts)?pts:null}}function sideResult(g,t){if(!g.fav||g.pts==null)return'—';let score=t===g.home?g.hs:g.as,opp=t===g.home?g.as:g.hs,adj=score+(t===g.fav?-g.pts:g.pts);return adj>opp?'W':adj<opp?'L':'P'}function cls(x){return x==='W'||x==='O'?'win':x==='L'||x==='U'?'loss':x==='P'?'push':''}function render(){let selected=team.value,a=selected==='ALL'?data:data.filter(x=>x.away===selected||x.home===selected),w=0,l=0,p=0,o=0,u=0,op=0;for(const x of a){let ar=selected==='ALL'?x.favResult:sideResult(x,selected);if(ar==='W')w++;if(ar==='L')l++;if(ar==='P')p++;if(x.ou==='O')o++;if(x.ou==='U')u++;if(x.ou==='P')op++}let atsPct=w+l?100*w/(w+l):0,overPct=o+u?100*o/(o+u):0;cards.innerHTML=`<div class=card><b>${a.length}</b>Games with odds</div><div class=card><b>${w}-${l}-${p}</b>${selected==='ALL'?'Favorite':'Team'} ATS</div><div class=card><b>${atsPct.toFixed(1)}%</b>ATS win rate</div><div class=card><b>${o}-${u}-${op}</b>O-U-P</div><div class=card><b>${overPct.toFixed(1)}%</b>Over rate</div><div class=card><b>${a.filter(x=>x.total!=null&&x.pts!=null).length}</b>Full lines</div>`;tbl.innerHTML='<tr><th>Season</th><th>Week</th><th>Game</th><th>Score</th><th>Line</th><th>Total</th><th>ATS Side</th><th>ATS</th><th>O/U</th><th>Actual</th></tr>'+a.map(x=>{let side=selected==='ALL'?(x.fav||'—'):selected,ar=selected==='ALL'?x.favResult:sideResult(x,selected);return`<tr><td>${x.year}</td><td>${x.seasonType===3?'P':'W'}${x.week}</td><td>${x.away} @ ${x.home}</td><td>${x.as}-${x.hs}</td><td>${x.details||(x.fav&&x.pts!=null?`${x.fav} -${x.pts}`:'—')}</td><td>${x.total??'—'}</td><td>${side}</td><td class=${cls(ar)}>${ar}</td><td class=${cls(x.ou)}>${x.ou}</td><td>${x.hs+x.as}</td></tr>`}).join('')}go.onclick=async()=>{go.disabled=true;data=[];cards.innerHTML='';tbl.innerHTML='';try{let ys=scope.value==='range'?Array.from({length:Math.abs(+endYear.value-+year.value)+1},(_,i)=>Math.min(+year.value,+endYear.value)+i):[+year.value],types=type.value==='ALL'?[2,3]:[+type.value],teams=new Set,seen=new Set,fail=0,tasks=[];for(const y of ys)for(const st of types){let ws=scope.value==='week'?[+week.value]:Array.from({length:weeks(y,st)},(_,i)=>i+1);for(const w of ws)tasks.push({y,st,w})}for(let z=0;z<tasks.length;z++){let {y,st,w}=tasks[z];prog(`${y} ${st===2?'week':'post'} ${w}`,z,tasks.length);let s;try{s=await J(`${B}/scoreboard?limit=100&dates=${y}&seasontype=${st}&week=${w}`)}catch{fail++;continue}for(const e of s.events||[]){if(!e.status?.type?.completed||seen.has(e.id)||+e.season?.year!==y||+e.season?.type!==st)continue;seen.add(e.id);let c=e.competitions?.[0],od=c?.odds?.[0],h=c?.competitors?.find(x=>x.homeAway==='home'),a=c?.competitors?.find(x=>x.homeAway==='away');if(!h||!a)continue;let home=norm(h.team?.abbreviation),away=norm(a.team?.abbreviation),hs=Number(h.score),as=Number(a.score);if(!Number.isFinite(hs)||!Number.isFinite(as))continue;if(!od)try{let sm=await J(`${B}/summary?event=${e.id}`);od=sm?.odds?.[0]||sm?.header?.competitions?.[0]?.odds?.[0]}catch{}if(!od)continue;let line=parseLine(od,home,away),actual=hs+as,ou=line.total==null?'—':actual>line.total?'O':actual<line.total?'U':'P',g={year:y,week:w,seasonType:st,home,away,hs,as,...line,ou};g.favResult=g.fav?sideResult(g,g.fav):'—';data.push(g);teams.add(home);teams.add(away)}}team.innerHTML='<option value=ALL>All Teams</option>'+[...teams].sort().map(t=>`<option>${t}</option>`).join('');render();prog('Complete',1,1);status.textContent=`Loaded ${data.length} games with ESPN odds${fail?` • ${fail} request failures`:''}. Missing lines remain excluded.`;setTimeout(()=>progress.classList.remove('on'),700)}catch(e){status.innerHTML=`<span class=err>Failed: ${e.message}</span>`;progress.classList.remove('on')}finally{go.disabled=false}};scope.onchange=()=>{week.style.display=scope.value==='week'?'':'none';endYear.style.display=scope.value==='range'?'':'none'};team.onchange=render;</script></body></html>
