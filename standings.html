<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standings Lab</title><style>body{font-family:system-ui;background:#07101b;color:#fff;margin:0;padding:20px}button,select,input{padding:10px;margin:4px;background:#132238;color:#fff;border:1px solid #345;border-radius:8px}button.active{background:#f4b400;color:#111}table{width:100%;border-collapse:collapse;margin:15px 0;background:#0e1928}th,td{padding:9px;border-bottom:1px solid #263a55;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.wrap{overflow:auto}.team{display:flex;align-items:center;gap:8px}.team img{width:28px;height:28px;object-fit:contain}h1{margin-bottom:5px}.muted{color:#91a4bd}.group{margin-top:28px}</style></head><body><h1>Standings Lab</h1><div class="muted">NFL · NBA · MLB · NHL — current and historical seasons</div><div id="sports"></div><label>Season <select id="season"></select></label><input id="filter" placeholder="Filter team"><button id="refresh">Refresh</button><div id="status" class="muted"></div><div id="out" class="wrap"></div><script>const S={NFL:'football/nfl',NBA:'basketball/nba',MLB:'baseball/mlb',NHL:'hockey/nhl'};let sport=localStorage.standingsSport||'NFL',data=[];const $=x=>document.getElementById(x);function current(){let d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;return (sport==='NFL'||sport==='NBA'||sport==='NHL')&&m<7?y-1:y}function controls(){$('sports').innerHTML=Object.keys(S).map(x=>'<button data-s="'+x+'" class="'+(x===sport?'active':'')+'">'+x+'</button>').join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.standingsSport=sport;controls();seasons();load()})}function seasons(){let a=[],c=current();for(let y=c;y>=2002;y--)a.push('<option value="'+y+'">'+((sport==='NBA'||sport==='NHL')?y+'-'+String(y+1).slice(-2):y)+'</option>');$('season').innerHTML=a.join('')}function flat(n,path=[]){let a=[];if(n&&n.standings&&n.standings.entries)n.standings.entries.forEach(e=>a.push({e:e,g:path[path.length-1]||n.name||'League'}));(n.children||[]).forEach(c=>a=a.concat(flat(c,path.concat(c.name||c.abbreviation||'Group'))));return a}function map(e){let m={};(e.stats||[]).forEach(s=>{m[s.name]=s.displayValue||s.value;m[s.abbreviation]=s.displayValue||s.value});return m}function cols(){if(sport==='NFL')return [['W','wins'],['L','losses'],['T','ties'],['PCT','winPercent'],['PF','pointsFor'],['PA','pointsAgainst'],['DIFF','pointDifferential'],['HOME','home'],['AWAY','road'],['DIV','vsDiv'],['CONF','vsConf'],['STRK','streak']];if(sport==='NBA')return [['W','wins'],['L','losses'],['PCT','winPercent'],['GB','gamesBehind'],['HOME','home'],['AWAY','road'],['CONF','vsConf'],['DIV','vsDiv'],['PPG','avgPointsFor'],['OPP','avgPointsAgainst'],['DIFF','differential'],['STRK','streak']];if(sport==='MLB')return [['W','wins'],['L','losses'],['PCT','winPercent'],['GB','gamesBehind'],['HOME','home'],['AWAY','road'],['RS','pointsFor'],['RA','pointsAgainst'],['DIFF','differential'],['DIV','vsDiv'],['L10','lastTenGames'],['STRK','streak']];return [['W','wins'],['L','losses'],['OTL','otLosses'],['PTS','points'],['PCT','pointsPercentage'],['GF','pointsFor'],['GA','pointsAgainst'],['DIFF','differential'],['HOME','home'],['AWAY','road'],['DIV','vsDiv'],['STRK','streak']]}async function load(){$('status').textContent='Loading...';try{let u='https://site.api.espn.com/apis/v2/sports/'+S[sport]+'/standings?season='+$('season').value,r=await fetch(u),j=await r.json();data=flat({children:j.children||[],name:j.name});render();$('status').textContent=data.length+' teams loaded'}catch(e){$('out').innerHTML='<p>Could not load standings: '+e.message+'</p>'}}function render(){let q=$('filter').value.toLowerCase(),cs=cols(),rows=data.filter(x=>(x.e.team.displayName||'').toLowerCase().includes(q)),groups={};rows.forEach(x=>(groups[x.g]??=[]).push(x));$('out').innerHTML=Object.entries(groups).map(([g,a])=>'<div class="group"><h2>'+g+'</h2><table><thead><tr><th>Team</th>'+cs.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+a.map(x=>{let m=map(x.e),t=x.e.team;return '<tr><td><div class="team"><img src="'+(t.logos&&t.logos[0]?t.logos[0].href:'')+'"><b>'+t.displayName+'</b></div></td>'+cs.map(c=>'<td>'+(m[c[1]]??'—')+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>').join('')||'<p>No teams found.</p>'}controls();seasons();$('season').onchange=load;$('filter').oninput=render;$('refresh').onclick=load;load();</script></body></html>
