<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Game Log Explorer</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui}.w{max-width:1250px;margin:auto;padding:18px}h1{margin:0 0 4px}.muted{color:#91a3ba}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}select,input,button{background:#101d31;color:#fff;border:1px solid #31445f;border-radius:8px;padding:8px}button{background:#1769c2;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card,.table{background:#0e192a;border:1px solid #26364d;border-radius:10px;padding:10px}.card b{font-size:20px;display:block}.table{overflow:auto;margin-top:10px}table{border-collapse:collapse;width:100%}th,td{padding:7px;border-bottom:1px solid #26364d;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.name{text-align:left!important;font-weight:800}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="w"><h1>🏈 Player Game Log Explorer</h1><div class="muted">Search every NFL box score in a season, choose a player, then inspect game-by-game production.</div><div class="bar"><select id="year"></select><select id="pos"><option>ALL</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option></select><button id="load">Load Season</button><input id="q" placeholder="Search player…"><select id="player"><option>Load a season first</option></select></div><div id="status" class="muted">Ready.</div><div id="summary" class="cards" style="margin-top:12px"></div><div class="table"><table id="tbl"></table></div></div><script>const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl',Y=document.querySelector('#year');for(let y=new Date().getFullYear();y>=2002;y--)Y.add(new Option(y,y));let logs=new Map;const n=v=>{let x=Number(String(v??0).replace(/,/g,''));return isFinite(x)?x:0};async function j(u){let r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()}async function games(y){let a=[];for(let w=1;w<=(y>=2021?18:17);w++){status.textContent=`Scoreboards: week ${w}…`;let x=await j(`${B}/scoreboard?limit=100&dates=${y}&seasontype=2&week=${w}`);a.push(...(x.events||[]).filter(e=>e.status?.type?.completed))}return [...new Map(a.map(x=>[x.id,x])).values()]}function parse(s,e){for(const b of s.boxscore?.players||[])for(const cat of b.statistics||[]){let labels=cat.labels||[],name=(cat.name||'').toLowerCase();for(const r of cat.athletes||[]){let a=r.athlete;if(!a?.id)continue;let o={id:a.id,name:a.displayName,pos:a.position?.abbreviation||'',team:b.team?.abbreviation||'',date:e.date?.slice(0,10),opp:e.shortName||'',cat:name};labels.forEach((l,i)=>o[l]=r.stats?.[i]);let k=a.id,arr=logs.get(k)||[];arr.push(o);logs.set(k,arr)}}}async function load(){logs=new Map;let gs=await games(+Y.value),done=0;for(const e of gs){status.textContent=`Box scores ${++done}/${gs.length}…`;try{parse(await j(`${B}/summary?event=${e.id}`),e)}catch{}}let p=[...logs].map(([id,a])=>({id,a:a[0]})).filter(x=>pos.value==='ALL'||x.a.pos===pos.value).sort((a,b)=>a.a.name.localeCompare(b.a.name));player.innerHTML=p.map(x=>`<option value="${x.id}">${x.a.name} — ${x.a.pos} ${x.a.team}</option>`).join('');status.textContent=`Loaded ${gs.length} games • ${p.length} players`;render()}function render(){let a=logs.get(player.value)||[];if(!a.length)return;let rows=a.map(x=>{let pass=n(x.YDS),rush=n(x.YDS_2),rec=n(x.REC),td=n(x.TD);return {...x,pass,rush,rec,td}});summary.innerHTML=`<div class=card><b>${rows.length}</b><span>Game stat rows</span></div><div class=card><b>${Math.max(0,...rows.map(x=>x.pass))}</b><span>High YDS row</span></div><div class=card><b>${Math.max(0,...rows.map(x=>x.td))}</b><span>High TD row</span></div><div class=card><b>${rows[0]?.pos||'—'}</b><span>Position</span></div>`;tbl.innerHTML='<tr><th>Game</th><th>Category</th><th>Stats</th></tr>'+a.map(x=>`<tr><td class=name>${x.date} • ${x.opp}</td><td>${x.cat}</td><td>${Object.entries(x).filter(([k])=>!['id','name','pos','team','date','opp','cat'].includes(k)).map(([k,v])=>`${k}: ${v}`).join(' • ')}</td></tr>`).join('')}load.onclick=load;player.onchange=render;q.oninput=()=>{let s=q.value.toLowerCase();[...player.options].forEach(o=>o.hidden=!o.text.toLowerCase().includes(s))}</script></body></html>
