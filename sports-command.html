<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101b"><title>Sports Command Center</title>
<style>
:root{color-scheme:dark;--bg:#060b12;--panel:#0d1623;--panel2:#121e2e;--line:#26364b;--text:#f4f7fb;--muted:#94a3b8;--accent:#f4b400;--blue:#55a6ff;--green:#42d68b;--red:#ff7474;--nav:220px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,select,input{font:inherit;color:inherit}button{cursor:pointer}
body{background:radial-gradient(circle at 20% -10%,#173d6850,transparent 35%),var(--bg);overflow-x:hidden}
.top{position:sticky;top:0;z-index:40;height:64px;display:flex;align-items:center;gap:12px;padding:8px 16px;background:#07101bf2;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{font-size:18px;font-weight:950;white-space:nowrap}.brand span{color:var(--accent)}.leagues{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.league{border:1px solid var(--line);background:#101a28;border-radius:9px;padding:9px 12px;font-weight:850;white-space:nowrap}.league.active{background:var(--accent);border-color:var(--accent);color:#101010}.top .spacer{flex:1}.home{color:inherit;text-decoration:none;border:1px solid var(--line);padding:8px 10px;border-radius:9px}
.layout{display:block;min-height:calc(100vh - 64px)}
.side{position:fixed;z-index:70;left:0;top:64px;width:var(--nav);height:calc(100vh - 64px);padding:12px 10px;border-right:1px solid var(--line);background:#09111c;overflow:auto;transform:translateX(0);transition:transform .18s ease;box-shadow:18px 0 50px #0008}.side.collapsed{transform:translateX(-105%)}.sideShade{display:none;position:fixed;z-index:65;inset:64px 0 0;background:#0008}.sideShade.open{display:block}.sideHead{display:flex;align-items:center;justify-content:space-between;padding:5px 8px 10px;color:#91a2b8;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.sideClose{border:0;background:transparent;color:#cbd5e1;font-size:25px;line-height:1;padding:0 4px}.menuBtn{flex:0 0 auto;width:42px;height:42px;border:1px solid var(--line);background:#101a28;border-radius:9px;font-size:22px;display:grid;place-items:center}.leagues{flex:1}.side h3{margin:6px 9px 10px;color:#667a92;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.navbtn{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:10px 11px;border-radius:9px;text-align:left;color:#c9d4e3;font-weight:750}.navbtn:hover{background:#111e2e}.navbtn.active{background:#17263a;color:#fff;box-shadow:inset 3px 0 var(--accent)}.navbtn[hidden]{display:none}
.main{min-width:0;padding:18px}.head{display:flex;align-items:end;gap:10px;margin-bottom:13px}.head h1{margin:0;font-size:27px}.head p{margin:4px 0 0;color:var(--muted);font-size:12px}.head .actions{margin-left:auto;display:flex;gap:7px;align-items:center}.ctl{background:#101c2b;border:1px solid var(--line);border-radius:9px;padding:8px 10px}.refresh{background:var(--accent);border-color:var(--accent);color:#111;font-weight:900}.status{min-height:22px;color:var(--muted);font-size:12px}.error{color:#ff9696}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.metric{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:11px}.metric b{font-size:20px}.metric span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{background:linear-gradient(180deg,#121e2e,#0c1521);border:1px solid var(--line);border-radius:13px;padding:12px}.click{cursor:pointer}.click:hover{border-color:#4b6380;transform:translateY(-1px)}.teamrow,.playerrow{display:flex;align-items:center;gap:9px}.logo{width:36px;height:36px;object-fit:contain}.headshot{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#172335}.muted{color:var(--muted)}.small{font-size:11px}.score{font-size:22px;font-weight:950}.gameTeams{display:grid;gap:8px;margin:10px 0}.gameTeam{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center}.gameTeam img{width:28px;height:28px;object-fit:contain}.gameTop,.gameFoot{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}.gameFoot{border-top:1px solid #1d2a3c;padding-top:8px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:9px 10px;border-bottom:1px solid #1c2a3c;text-align:right;white-space:nowrap;font-size:12px}th{position:sticky;top:0;background:#111d2b;color:#b7c4d5;text-transform:uppercase;font-size:10px;letter-spacing:.04em}th:first-child,td:first-child{text-align:left}.rank{color:#ffd45c;font-weight:950}.entity{cursor:pointer}.entity:hover{background:#172538}.tabs{display:flex;gap:6px;overflow:auto;margin:8px 0 12px}.tab{border:1px solid var(--line);background:#101b29;border-radius:999px;padding:8px 11px;white-space:nowrap}.tab.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:900}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:15px;background:#02060bdc}.modal.open{display:flex}.dialog{width:min(1050px,100%);max-height:94vh;display:flex;flex-direction:column;background:#09121e;border:1px solid #344961;border-radius:16px;box-shadow:0 24px 80px #000a}.dialogHead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.dialogHead h2{margin:0;font-size:18px}.close{margin-left:auto;background:#121e2c;border:1px solid var(--line);border-radius:8px;padding:7px 10px}.dialogBody{padding:14px;overflow:auto}.hero{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:center}.hero img{width:90px;height:90px;object-fit:contain;background:#111c2a;border-radius:14px}.hero.player img{border-radius:50%;object-fit:cover}.hero h2{margin:0;font-size:25px}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:#cbd6e4}.section{margin-top:14px}.section h3{font-size:13px;margin:0 0 8px}.empty{padding:35px;text-align:center;border:1px dashed #33475e;border-radius:12px;color:var(--muted)}
@media(max-width:900px){:root{--nav:170px}.cards{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.top{height:58px;min-height:58px;padding:7px 9px;align-items:center}.side{top:58px;height:calc(100vh - 58px);width:min(82vw,290px);display:block;padding:12px 10px}.sideShade{inset:58px 0 0}.navbtn{width:100%;padding:11px;font-size:13px}.navbtn.active{box-shadow:inset 3px 0 var(--accent)}.main{padding:12px 10px}.head{align-items:flex-start}.head h1{font-size:21px}.head p{font-size:11px}.head .actions{flex-wrap:wrap;justify-content:flex-end}.cards{grid-template-columns:1fr}.metrics{gap:6px}.metric{padding:8px}.metric b{font-size:17px}.dialog{height:100dvh;max-height:100dvh;border-radius:0}.modal{padding:0}.hero{grid-template-columns:70px 1fr}.hero img{width:70px;height:70px}.hero h2{font-size:20px}.tablewrap{margin:0 -10px;border-radius:0}th,td{padding:8px 7px}}
 .boxTeamToggle{display:flex;gap:7px;align-items:center;margin:12px 0;overflow:auto}.boxTeamToggle button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#101a28;border-radius:9px;padding:8px 11px;white-space:nowrap}.boxTeamToggle button.active{background:var(--accent);color:#111;font-weight:900}.boxTeamToggle img{width:24px;height:24px;object-fit:contain}.boxTeamSection[hidden]{display:none}.boxPlayer{display:flex;align-items:center;gap:8px}.boxPlayer .headshot{width:34px;height:34px} .logo,.gameTeam img{background:#fff;border-radius:8px;padding:3px;box-shadow:inset 0 0 0 1px #d8dee8;box-sizing:border-box}.hero>img,.hero.player>img{background:#fff;border-radius:12px;padding:5px}.boxTeamToggle img.logo{background:#fff;padding:2px} </style></head><body>
<header class="top"><button class="menuBtn" id="menuBtn" aria-label="Open navigation" aria-expanded="false">☰</button><div class="leagues" id="leagues"></div></header><div class="sideShade" id="sideShade"></div>
<div class="layout"><aside class="side collapsed" id="side">
<div class="sideHead"><b>Explore</b><button class="sideClose" id="sideClose" aria-label="Close navigation">×</button></div>
<button class="navbtn active" data-view="schedule">▦ Schedule</button><button class="navbtn" data-view="standings">▤ Standings</button><button class="navbtn" data-view="teams">◉ Teams</button><button class="navbtn" data-view="teamstats">▥ Team Stats</button><button class="navbtn" data-view="players">♙ Player Stats</button><button class="navbtn" data-view="rankings">★ Rankings</button><button class="navbtn" data-view="news">☷ News</button>
</aside><main class="main"><div class="head"><div><h1 id="title">NFL Overview</h1><p id="subtitle">Live ESPN data</p></div><div class="actions"><button class="ctl step" id="prevPeriod" title="Previous">‹</button><select class="ctl" id="season"></select><select class="ctl" id="seasonTypeCtl" hidden><option value="1">Preseason</option><option value="2">Regular</option><option value="3">Postseason</option></select><select class="ctl" id="weekCtl" hidden></select><input class="ctl" id="dateCtl" type="date" hidden><button class="ctl step" id="nextPeriod" title="Next">›</button><button class="ctl refresh" id="refresh">↻</button></div></div><div id="status" class="status"></div><div id="metrics" class="metrics"></div><section id="content"></section></main></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialogHead"><h2 id="modalTitle">Details</h2><button class="close" id="close">Close</button></div><div class="dialogBody" id="modalBody"></div></div></div>
<script>
'use strict';
const LEAGUES={
 nfl:{name:'NFL',sport:'football',slug:'nfl',college:false},
 nba:{name:'NBA',sport:'basketball',slug:'nba',college:false},
 mlb:{name:'MLB',sport:'baseball',slug:'mlb',college:false},
 nhl:{name:'NHL',sport:'hockey',slug:'nhl',college:false},
 ncaaf:{name:'College Football',short:'NCAAF',sport:'football',slug:'college-football',college:true,group:80},
 ncaam:{name:'College Basketball',short:'NCAAM',sport:'basketball',slug:'mens-college-basketball',college:true,group:50}
};
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={league:'nfl',view:'schedule',cache:new Map(),season:new Date().getFullYear(),teams:[],week:null,seasonType:2,date:new Date().toISOString().slice(0,10),loadId:0};
function cfg(){return LEAGUES[state.league]} function base(){let c=cfg();return 'https://site.api.espn.com/apis/site/v2/sports/'+c.sport+'/'+c.slug} function qgroup(){return cfg().group?'&groups='+cfg().group:''}
async function api(url){if(state.cache.has(url))return state.cache.get(url);let p=fetch(url).then(r=>{if(!r.ok)throw Error('ESPN request failed ('+r.status+')');return r.json()}).catch(e=>{state.cache.delete(url);throw e});state.cache.set(url,p);return p}
async function parallelMap(items,worker,limit=10){let out=new Array(items.length),next=0;async function run(){while(true){let i=next++;if(i>=items.length)return;try{out[i]=await worker(items[i],i)}catch(e){out[i]=null}}}await Promise.all(Array.from({length:Math.min(limit,items.length)},run));return out}
function fanoutLimit(){return cfg().college?8:10}
const imageUrlCache=new Map();function logo(t){let id=t?.id,key='logo:'+state.league+':'+(id||t?.abbreviation||'');if(imageUrlCache.has(key))return imageUrlCache.get(key);let v=t?.logo||t?.logos?.[0]?.href||'';if(v)imageUrlCache.set(key,v);return v} function athleteImg(a){let id=a?.id,key='ath:'+state.league+':'+id;if(id&&imageUrlCache.has(key))return imageUrlCache.get(key);let h=a?.headshot?.href||a?.headshot||'';if(!h&&id)h='https://a.espncdn.com/i/headshots/'+cfg().slug+'/players/full/'+id+'.png';if(id&&h)imageUrlCache.set(key,h);return h} function imgTag(src,cls,alt=''){return src?'<img class="'+cls+'" src="'+esc(src)+'" alt="'+esc(alt)+'" loading="lazy" decoding="async" fetchpriority="low" onerror="this.style.display=\'none\'">':''} function seasonStartDate(){let y=state.season;if(state.league==='nba'||state.league==='nhl')return y+'-10-01';if(state.league==='mlb')return y+'-03-01';if(state.league==='ncaam')return y+'-11-01';return y+'-01-01'} function isFootball(){return cfg().sport==='football'} function ymd(d){return d.toISOString().slice(0,10)} function espnDate(){return state.date.replaceAll('-','')}
function init(){ $('leagues').innerHTML=Object.entries(LEAGUES).map(([k,v])=>'<button class="league '+(k===state.league?'active':'')+'" data-league="'+k+'">'+esc(v.short||v.name)+'</button>').join(''); let y=new Date().getFullYear();$('season').innerHTML=Array.from({length:12},(_,i)=>y-i).map(v=>'<option>'+v+'</option>').join('');$('season').value=state.season; bind();syncNav();syncPeriodControls();load()}
function bind(){const toggleMenu=open=>{let side=$('side'),shade=$('sideShade'),show=open??side.classList.contains('collapsed');side.classList.toggle('collapsed',!show);shade.classList.toggle('open',show);$('menuBtn').setAttribute('aria-expanded',String(show))};$('menuBtn').onclick=()=>toggleMenu();$('sideClose').onclick=()=>toggleMenu(false);$('sideShade').onclick=()=>toggleMenu(false);document.querySelectorAll('.league').forEach(b=>b.onclick=()=>{state.league=b.dataset.league;state.view='schedule';state.week=null;state.date=new Date().toISOString().slice(0,10);document.querySelectorAll('.league').forEach(x=>x.classList.toggle('active',x===b));syncNav();syncPeriodControls();load()});document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x===b));toggleMenu(false);syncPeriodControls();load()});$('season').onchange=()=>{state.season=+$('season').value;state.week=null;if(!isFootball())state.date=seasonStartDate();state.cache.clear();syncPeriodControls();load()};$('seasonTypeCtl').onchange=()=>{state.seasonType=+$('seasonTypeCtl').value;state.week=null;state.cache.clear();syncPeriodControls();load()};$('weekCtl').onchange=()=>{state.week=+$('weekCtl').value;state.cache.clear();load()};$('dateCtl').onchange=()=>{state.date=$('dateCtl').value;state.cache.clear();load()};$('prevPeriod').onclick=()=>shiftPeriod(-1);$('nextPeriod').onclick=()=>shiftPeriod(1);$('refresh').onclick=()=>{state.cache.clear();load()};$('close').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()})}
function syncPeriodControls(){let football=isFootball(),sched=state.view==='schedule';$('seasonTypeCtl').hidden=!(football&&sched);$('seasonTypeCtl').value=state.seasonType;$('weekCtl').hidden=!(football&&sched);$('dateCtl').hidden=football||!sched;$('prevPeriod').hidden=!sched;$('nextPeriod').hidden=!sched;$('dateCtl').value=state.date;if(football){let max=state.league==='ncaaf'?20:22;$('weekCtl').innerHTML=Array.from({length:max},(_,i)=>'<option value="'+(i+1)+'">Week '+(i+1)+'</option>').join('');if(state.week)$('weekCtl').value=state.week}} async function findGameDate(direction,startDate=state.date,includeStart=false){let cursor=new Date(startDate+'T12:00:00'),checked=0,batch=10;while(checked<400){let dates=[];for(let i=0;i<batch&&checked<400;i++,checked++){if(checked||!includeStart)cursor.setDate(cursor.getDate()+direction);dates.push(ymd(cursor))}let results=await Promise.all(dates.map(ds=>api(base()+'/scoreboard?limit=100&dates='+ds.replaceAll('-','')+qgroup()).catch(()=>null)));let ix=results.findIndex(j=>(j?.events||[]).length);if(ix>=0)return dates[ix]}return null}
async function shiftPeriod(n){if(isFootball()){state.week=Math.max(1,(state.week||1)+n);$('weekCtl').value=state.week;state.cache.clear();load();return}
 setStatus(n<0?'Finding previous game date…':'Finding next game date…');let hit=await findGameDate(n);if(hit){state.date=hit;$('dateCtl').value=hit;load()}else setStatus('No game date found nearby.',true)
} function syncNav(){document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view));document.querySelector('[data-view="rankings"]').hidden=!cfg().college}
function setStatus(s,err=false){$('status').textContent=s||'';$('status').className='status'+(err?' error':'')} function metrics(arr=[]){$('metrics').innerHTML=arr.map(x=>'<div class="metric"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join('')}
async function load(){let my=++state.loadId,c=cfg();$('title').textContent=c.name+' '+({standings:'Standings',schedule:'Schedule',teams:'Teams',teamstats:'Team Stats',players:'Player Stats',rankings:'Rankings',news:'News'}[state.view]||'');$('subtitle').textContent='ESPN data · '+state.season;setStatus('Loading…');$('content').innerHTML='';metrics();try{await ({standings,schedule,teams,teamstats,players,rankings,news}[state.view]||schedule)();if(my===state.loadId)setStatus('')}catch(e){if(my!==state.loadId)return;console.error(e);setStatus(e.message,true);$('content').innerHTML='<div class="empty">ESPN returned an error for this dataset. Try Refresh or another period.</div>'}} 
async function getScoreboard(){let url=base()+'/scoreboard?limit=100';if(isFootball()){url+='&season='+state.season+'&seasontype='+state.seasonType+(state.week?'&week='+state.week:'')+qgroup()}else url+='&dates='+espnDate()+qgroup();let d=await api(url);if(isFootball()&&!state.week&&d.week?.number){state.week=d.week.number;syncPeriodControls()}return d}
async function overview(){let [sb,tm]=await Promise.all([getScoreboard(),api(base()+'/teams?limit=500'+(cfg().group?'&groups='+cfg().group:''))]);let events=sb.events||[], teamsArr=tm.sports?.[0]?.leagues?.[0]?.teams||[];state.teams=teamsArr.map(x=>x.team);let live=events.filter(e=>e.status?.type?.state==='in').length;metrics([[teamsArr.length,'Teams'],[events.length,'Games Loaded'],[live,'Live Now'],[state.season,'Season']]);let games=events.slice(0,12);$('content').innerHTML='<div class="tabs"><button class="tab active">Games</button><button class="tab" onclick="switchView(\'standings\')">Standings</button><button class="tab" onclick="switchView(\'players\')">Leaders</button></div>'+(games.length?'<div class="cards">'+games.map(gameCard).join('')+'</div>':'<div class="empty">No games returned for this season/date context.</div>')}
function gameCard(e){let comp=e.competitions?.[0],cs=comp?.competitors||[],st=e.status?.type;return '<article class="card click" onclick="openGame(\''+esc(e.id)+'\')"><div class="gameTop"><b>'+esc(st?.shortDetail||st?.description||'')+'</b><span>'+new Date(e.date).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</span></div><div class="gameTeams">'+cs.map(x=>'<div class="gameTeam"><img src="'+esc(logo(x.team))+'"><b>'+esc(x.team?.shortDisplayName||x.team?.displayName)+'</b><span class="score">'+esc(x.score||'-')+'</span></div>').join('')+'</div><div class="gameFoot"><span>'+esc(comp?.venue?.fullName||'')+'</span><span>Details →</span></div></article>'}
async function schedule(){let sb=await getScoreboard(),ev=sb.events||[];
 if(!isFootball()&&!ev.length){let today=ymd(new Date());if(state.date===today){setStatus('No games today · finding most recent game date…');let hit=await findGameDate(-1,state.date);if(hit){state.date=hit;$('dateCtl').value=hit;sb=await getScoreboard();ev=sb.events||[]}}}
 metrics([[ev.length,'Games'],[ev.filter(x=>x.status?.type?.completed).length,'Final'],[ev.filter(x=>x.status?.type?.state==='in').length,'Live'],[isFootball()?'Week '+(state.week||'—'):state.date,'Period']]);$('content').innerHTML=ev.length?'<div class="cards">'+ev.map(gameCard).join('')+'</div>':'<div class="empty">No schedule returned.</div>'}
function flattenStandings(node,out=[],path=[]){let here=node?.name||node?.abbreviation||'',next=here?[...path,here]:path;if(node?.standings?.entries)node.standings.entries.forEach(x=>out.push({group:next.slice(-2).join(' · '),...x}));(node?.children||[]).forEach(c=>flattenStandings(c,out,next));return out}
async function standings(){let c=cfg(),url='https://site.api.espn.com/apis/v2/sports/'+c.sport+'/'+c.slug+'/standings?season='+state.season+(c.group?'&region=us&lang=en&contentorigin=espn&group='+c.group:'');let d=await api(url),rows=flattenStandings(d);metrics([[rows.length,'Teams'],[d.name||c.name,'Competition'],[state.season,'Season'],['ESPN','Source']]);let statNames=[];rows.forEach(r=>(r.stats||[]).forEach(x=>{if(x.name&&!statNames.includes(x.name))statNames.push(x.name)}));let groups=new Map();rows.forEach(r=>{let k=r.group||'Standings';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});$('content').innerHTML=rows.length?[...groups.entries()].map(([g,rs])=>'<div class="section"><h3>'+esc(g)+'</h3><div class="tablewrap"><table><thead><tr><th>Team</th>'+statNames.map(n=>'<th>'+esc(n.replace(/([A-Z])/g,' $1'))+'</th>').join('')+'</tr></thead><tbody>'+rs.map(r=>'<tr class="entity" onclick="openTeam(\''+esc(r.team?.id)+'\')"><td><div class="teamrow">'+imgTag(logo(r.team),'logo',r.team?.displayName)+'<div><b>'+esc(r.team?.displayName)+'</b></div></div></td>'+statNames.map(n=>'<td>'+esc((r.stats||[]).find(x=>x.name===n)?.displayValue||'-')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>').join(''):'<div class="empty">No standings returned.</div>'}
async function getTeams(){let d=await api(base()+'/teams?limit=500'+(cfg().group?'&groups='+cfg().group:''));return d.sports?.[0]?.leagues?.[0]?.teams?.map(x=>x.team)||[]}
async function teams(){let a=await getTeams();state.teams=a;metrics([[a.length,'Teams'],[state.season,'Season'],[cfg().college?'College':'Pro','Level'],['ESPN','Source']]);$('content').innerHTML='<div class="cards">'+a.map(t=>'<article class="card click" onclick="openTeam(\''+esc(t.id)+'\')"><div class="teamrow"><img class="logo" src="'+esc(logo(t))+'"><div><b>'+esc(t.displayName)+'</b><div class="small muted">'+esc(t.abbreviation||'')+'</div></div></div></article>').join('')+'</div>'}
function statTableFromCategories(cats){if(!cats?.length)return '<div class="empty">No statistics returned.</div>';return cats.map(cat=>{let names=cat.names||cat.labels||[],ath=cat.athletes||[];if(!ath.length)return '';return '<div class="section"><h3>'+esc(cat.displayName||cat.name||'Statistics')+'</h3><div class="tablewrap"><table><thead><tr><th>Player</th>'+names.map(n=>'<th>'+esc(n)+'</th>').join('')+'</tr></thead><tbody>'+ath.slice(0,100).map(row=>{let a=row.athlete||row;return '<tr class="entity" onclick="openPlayer(\''+esc(a.id)+'\')"><td><div class="playerrow">'+imgTag(athleteImg(a),'headshot',a.displayName||a.fullName)+'<b>'+esc(a.displayName||a.fullName)+'</b></div></td>'+(row.stats||[]).map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div></div>'}).join('')}
function playerPositionOptions(){let c=cfg();if(c.sport==='football')return ['ALL','QB','RB','WR','TE','OL','DL','LB','DB','K','P'];if(c.slug.includes('basketball'))return ['ALL','G','F','C'];if(c.sport==='baseball')return ['ALL','P','C','1B','2B','3B','SS','OF','DH'];if(c.sport==='hockey')return ['ALL','C','LW','RW','D','G'];return ['ALL']}
function positionMatch(a,pos){if(pos==='ALL')return true;let p=String(a.position?.abbreviation||a.position?.name||a.position?.displayName||'').toUpperCase();if(pos==='G'&&cfg().slug.includes('basketball'))return /GUARD|PG|SG|^G$/.test(p);if(pos==='F'&&cfg().slug.includes('basketball'))return /FORWARD|SF|PF|^F$/.test(p);if(pos==='DB')return /CB|S|DB/.test(p);if(pos==='DL')return /DE|DT|DL|NT/.test(p);return p===pos||p.includes(pos)}
async function players(){
 let c=cfg(),opts=playerPositionOptions(),bar='<div class="extraControls"><label><b>Position</b> <select id="playerPos">'+opts.map(x=>'<option>'+x+'</option>').join('')+'</select></label></div><div id="playerStatsPane"><div class="empty">Loading league statistics…</div></div>';$('content').innerHTML=bar;
 let urls=['https://site.web.api.espn.com/apis/common/v3/sports/'+c.sport+'/'+c.slug+'/statistics/byathlete?region=us&lang=en&contentorigin=espn&isqualified=true&limit=300&season='+state.season+'&seasontype='+state.seasonType,'https://site.api.espn.com/apis/site/v2/sports/'+c.sport+'/'+c.slug+'/statistics?region=us&lang=en&contentorigin=espn&isqualified=true&limit=300&season='+state.season+'&seasontype='+state.seasonType],cats=[];
 for(const u of urls){try{let x=await api(u),z=x?.categories||x?.splits?.categories||x?.stats?.categories||x?.statistics?.categories||[];if(z.length){cats=z;break}}catch(e){console.warn('Player stats endpoint failed',u,e)}}
 let teams=[],ath=[],rostersLoaded=false;
 async function loadRosterFallback(){if(rostersLoaded)return;rostersLoaded=true;try{teams=await getTeams()}catch(e){console.warn('Teams fallback failed',e);teams=[];return}let rosters=await parallelMap(teams,t=>api(base()+'/teams/'+t.id+'/roster?season='+state.season),fanoutLimit());rosters.forEach((r,i)=>(r?.athletes||[]).forEach(g=>(g.items||g.athletes||(g.id?[g]:[])).forEach(p=>ath.push({...p,_team:teams[i]}))))}

   if(cats.length){let filtered=cats.map(cat=>({...cat,athletes:(cat.athletes||[]).filter(row=>pos==='ALL'||positionMatch(row.athlete||row,pos))})).filter(cat=>cat.athletes?.length);if(filtered.length){$('playerStatsPane').innerHTML=statTableFromCategories(filtered);metrics([[filtered.length,'Categories'],[pos,'Position'],[state.season,'Season'],[c.name,'League']]);return}}
   await loadRosterFallback();let filtered=ath.filter(p=>positionMatch(p,pos));metrics([[filtered.length,'Players'],[pos,'Position'],[state.season,'Season'],[c.name,'League']]);$('playerStatsPane').innerHTML=filtered.length?'<div class="cards">'+filtered.map(p=>'<article class="card click" onclick="openPlayer(\''+esc(p.id)+'\')"><div class="playerrow">'+imgTag(athleteImg(p),'headshot',p.displayName||p.fullName)+'<div><b>'+esc(p.displayName||p.fullName)+'</b><div class="small muted">'+esc(p._team?.abbreviation||'')+' · '+esc(p.position?.abbreviation||p.position?.displayName||'')+'</div></div></div></article>').join('')+'</div>':'<div class="empty">ESPN did not return league statistics or roster data for '+esc(pos)+'.</div>'
 };

async function teamstats(){let teams=await getTeams(),scheds=await parallelMap(teams,t=>api(base()+'/teams/'+t.id+'/schedule?season='+state.season),fanoutLimit()),rows=[];scheds.forEach((d,i)=>{let t=teams[i],seen=new Set(),g=0,w=0,l=0,tie=0,pf=0,pa=0;(d?.events||[]).forEach(e=>{if(seen.has(e.id)||!e.status?.type?.completed)return;seen.add(e.id);let cs=e.competitions?.[0]?.competitors||[],me=cs.find(x=>String(x.team?.id)===String(t.id)),op=cs.find(x=>String(x.team?.id)!==String(t.id));if(!me||!op)return;g++;pf+=+me.score||0;pa+=+op.score||0;if(me.winner)w++;else if(op.winner)l++;else tie++});if(g)rows.push({t,g,w,l,tie,pf,pa})});rows.sort((a,b)=>(b.w/b.g-a.w/a.g)||((b.pf-b.pa)/b.g-(a.pf-a.pa)/a.g));metrics([[rows.length,'Teams'],[rows.reduce((n,r)=>n+r.g,0)/2,'Completed Games'],[state.season,'Season'],['Full schedules','Dataset']]);$('content').innerHTML=rows.length?'<div class="tablewrap"><table><thead><tr><th>Team</th><th>G</th><th>W</th><th>L</th><th>T</th><th>PF/G</th><th>PA/G</th><th>Diff/G</th></tr></thead><tbody>'+rows.map(r=>'<tr class="entity" onclick="openTeam(\''+r.t.id+'\')"><td><div class="teamrow">'+imgTag(logo(r.t),'logo',r.t.displayName)+'<b>'+esc(r.t.displayName)+'</b></div></td><td>'+r.g+'</td><td>'+r.w+'</td><td>'+r.l+'</td><td>'+r.tie+'</td><td>'+(r.pf/r.g).toFixed(1)+'</td><td>'+(r.pa/r.g).toFixed(1)+'</td><td>'+((r.pf-r.pa)/r.g).toFixed(1)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No completed season games were returned.</div>'}
async function rankings(){if(!cfg().college){$('content').innerHTML='<div class="empty">Rankings are available for college leagues.</div>';return}let d=await api(base()+'/rankings?limit=100&season='+state.season+(cfg().group?'&groups='+cfg().group:'')),r=d.rankings||[];metrics([[r.length,'Polls'],[state.season,'Season'],[cfg().name,'League'],['ESPN','Source']]);$('content').innerHTML=r.map(p=>'<div class="section"><h3>'+esc(p.name||p.shortName)+'</h3><div class="tablewrap"><table><thead><tr><th>Rank</th><th>Team</th><th>Record</th><th>Points</th><th>Trend</th></tr></thead><tbody>'+(p.ranks||[]).map(x=>'<tr class="entity" onclick="openTeam(\''+esc(x.team?.id)+'\')"><td class="rank">'+esc(x.current)+'</td><td><div class="teamrow"><img class="logo" src="'+esc(logo(x.team))+'"><b>'+esc(x.team?.displayName)+'</b></div></td><td>'+esc(x.recordSummary||'')+'</td><td>'+esc(x.points||'')+'</td><td>'+esc(x.trend||'')+'</td></tr>').join('')+'</tbody></table></div></div>').join('')||'<div class="empty">No rankings returned.</div>'}
async function news(){let d=await api(base()+'/news?limit=50'),a=d.articles||[];metrics([[a.length,'Stories'],[cfg().name,'League'],['ESPN','Source'],['Live','Feed']]);$('content').innerHTML='<div class="cards">'+a.map(x=>'<article class="card"><div class="small muted">'+esc(x.type||'News')+'</div><h3>'+esc(x.headline)+'</h3><p class="muted small">'+esc(x.description||'')+'</p>'+(x.links?.web?.href?'<a class="pill" target="_blank" rel="noopener" href="'+esc(x.links.web.href)+'">Read at ESPN</a>':'')+'</article>').join('')+'</div>'}
function switchView(v){state.view=v;document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.view===v));load()} window.switchView=switchView;
function showModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('open');document.body.style.overflow='hidden'} function closeModal(){$('modal').classList.remove('open');document.body.style.overflow=''}
function boxStatTable(st,team){
 let rows=st.athletes||[];return '<div class="section"><b>'+esc(st.displayName||st.name)+'</b><div class="tablewrap"><table><thead><tr><th>Player</th><th>Team</th>'+(st.labels||[]).map(l=>'<th>'+esc(l)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>{let p=r.athlete||{};return '<tr class="entity" onclick="openPlayer(\''+esc(p.id)+'\')"><td><div class="boxPlayer">'+imgTag(athleteImg(p),'headshot',p.displayName)+'<b>'+esc(p.displayName||p.shortName)+'</b></div></td><td>'+imgTag(logo(team),'logo',team?.displayName)+' '+esc(team?.abbreviation||'')+'</td>'+(r.stats||[]).map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div></div>'

function statNum(v){let n=parseFloat(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:-Infinity}
function primaryStatIndex(st){let labels=(st.labels||[]).map(x=>String(x).toUpperCase()),name=String(st.name||st.displayName||'').toLowerCase(),want=name.includes('pass')?['YDS','PASS YDS','C/ATT']:name.includes('rush')?['YDS','RUSH YDS','CAR']:name.includes('receiv')?['YDS','REC YDS','REC']:name.includes('def')?['TOT','TACKLES','SOLO']:name.includes('kick')?['PTS','FG','LONG']:name.includes('punt')?['AVG','YDS','LONG']:name.includes('return')?['YDS','AVG','LONG']:['YDS','PTS','TOTAL'];for(let w of want){let i=labels.indexOf(w);if(i>=0)return i}return Math.max(0,labels.length-1)}
function mergedBox(boxes){
 let cats=new Map();boxes.forEach(tp=>(tp.statistics||[]).forEach(st=>{let key=st.name||st.displayName||'stats',x=cats.get(key)||{name:st.name,displayName:st.displayName,labels:st.labels||[],rows:[]};(st.athletes||[]).forEach(r=>x.rows.push({r,team:tp.team}));cats.set(key,x)}));
 return [...cats.values()].map(st=>{let ix=primaryStatIndex(st);st.rows.sort((a,b)=>statNum(b.r.stats?.[ix])-statNum(a.r.stats?.[ix]));return '<div class="section"><b>'+esc(st.displayName||st.name)+'</b><div class="tablewrap"><table><thead><tr><th>Player</th><th>Team</th>'+st.labels.map(l=>'<th>'+esc(l)+'</th>').join('')+'</tr></thead><tbody>'+st.rows.map(x=>{let p=x.r.athlete||{};return '<tr class="entity" onclick="openPlayer(\''+esc(p.id)+'\')"><td><div class="boxPlayer">'+imgTag(athleteImg(p),'headshot',p.displayName)+'<b>'+esc(p.displayName||p.shortName)+'</b></div></td><td><div class="teamrow">'+imgTag(logo(x.team),'logo',x.team?.displayName)+'<b>'+esc(x.team?.abbreviation||'')+'</b></div></td>'+(x.r.stats||[]).map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div></div>'}).join('')
}
function singleTeamBox(tp){return (tp.statistics||[]).map(st=>boxStatTable(st,tp.team)).join('')}
async function openGame(id){showModal('Game','<div class="empty">Loading game details…</div>');try{

 let hero='<div class="cards" style="grid-template-columns:repeat(2,1fr)">'+cs.map(x=>'<div class="card"><div class="teamrow">'+imgTag(logo(x.team),'logo',x.team?.displayName)+'<div><b>'+esc(x.team?.displayName)+'</b><div class="score">'+esc(x.score||'')+'</div></div></div></div>').join('')+'</div>';
 let toggles=boxes.length?'<div class="boxTeamToggle"><button class="active" data-boxteam="all">Both</button>'+boxes.map(tp=>'<button data-boxteam="'+esc(tp.team?.id)+'">'+imgTag(logo(tp.team),'logo',tp.team?.displayName)+'<span>'+esc(tp.team?.abbreviation||tp.team?.shortDisplayName||'Team')+'</span></button>').join('')+'</div>':'';

async function openTeam(id){showModal('Team','<div class="empty">Loading team…</div>');try{
 let [pd,roster,sched]=await Promise.all([api(base()+'/teams/'+id).catch(()=>null),api(base()+'/teams/'+id+'/roster?season='+state.season).catch(()=>null),api(base()+'/teams/'+id+'/schedule?season='+state.season).catch(()=>null)]),t=pd?.team||pd||state.teams.find(x=>String(x.id)===String(id))||{};

 renderRoster();document.querySelectorAll('[data-teamtab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-teamtab]').forEach(x=>x.classList.toggle('active',x===btn));btn.dataset.teamtab==='roster'?renderRoster():renderSched()})
