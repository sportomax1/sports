<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101b"><title>Depth Chart Lab</title><style>
:root{color-scheme:dark;--bg:#07101b;--panel:#0e1928;--panel2:#132238;--line:#263a55;--text:#f7f9fc;--muted:#91a4bd;--gold:#f4b400;--good:#2ea44f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#18365d66,transparent 30%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif}.shell{width:min(1250px,calc(100% - 24px));margin:auto;padding:22px 0 40px}h1{font-size:38px;margin:0}.muted{color:var(--muted)}.tabs,.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0}button,select,input{background:var(--panel2);color:#fff;border:1px solid #345;border-radius:9px;padding:10px}button{cursor:pointer}button.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:800}.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#132238,#0e1928);border:1px solid var(--line);padding:16px;border-radius:15px;margin:12px 0}.hero img{width:76px;height:76px;object-fit:contain}.hero h2{font-size:26px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:11px}.unit{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}.unit h3{margin:0;padding:11px 13px;background:var(--panel2);border-bottom:1px solid var(--line)}.position{padding:10px 12px;border-bottom:1px solid #1b2c42}.position:last-child{border:0}.posname{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#ffd45c;margin-bottom:7px}.players{display:grid;gap:5px}.player{display:grid;grid-template-columns:28px 38px 1fr auto;gap:7px;align-items:center;padding:6px;background:#0a1421;border-radius:8px}.rank{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#1b2d45;font-weight:900}.rank.one{background:var(--good)}.head{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#17263a}.pname{font-weight:800}.meta{font-size:11px;color:var(--muted)}.badge{font-size:10px;border:1px solid #3b4c63;border-radius:99px;padding:3px 6px;color:#cbd5e1}.status{padding:10px 0;color:var(--muted)}.error{color:#ff9b96}.empty{padding:22px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}.search{min-width:220px}.source{font-size:11px;color:var(--muted);margin-top:15px}@media(max-width:600px){h1{font-size:30px}.hero img{width:58px;height:58px}.hero h2{font-size:21px}.player{grid-template-columns:26px 34px 1fr}.badge{display:none}}
</style></head><body><main class="shell"><h1>Depth Chart Lab</h1><div class="muted">NFL · NBA · MLB · NHL team depth charts powered by ESPN data</div><div id="sports" class="tabs"></div><div class="controls"><label>Team <select id="team"></select></label><input id="search" class="search" placeholder="Filter position or player"><button id="refresh">Refresh</button></div><div id="status" class="status"></div><div id="teamHero"></div><div id="out"></div><div class="source">Depth-chart availability and structure vary by league/team. If ESPN does not publish a depth chart, the app falls back to the active roster grouped by position and clearly labels it as a roster view.</div></main><script>
'use strict';
const L={NFL:{cat:'football',league:'nfl'},NBA:{cat:'basketball',league:'nba'},MLB:{cat:'baseball',league:'mlb'},NHL:{cat:'hockey',league:'nhl'}};
const $=id=>document.getElementById(id);let sport=localStorage.depthSport||'NFL',teams=[],raw=null,mode='depth';
async function json(url){const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sportButtons(){$('sports').innerHTML=Object.keys(L).map(s=>`<button data-s="${s}" class="${s===sport?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.depthSport=sport;sportButtons();loadTeams()})}
async function loadTeams(){const x=L[sport];$('status').textContent='Loading teams…';$('out').innerHTML='';$('teamHero').innerHTML='';try{const j=await json(`https://site.api.espn.com/apis/site/v2/sports/${x.cat}/${x.league}/teams?limit=100`);teams=(j.sports?.[0]?.leagues?.[0]?.teams||[]).map(z=>z.team).sort((a,b)=>a.displayName.localeCompare(b.displayName));$('team').innerHTML=teams.map(t=>`<option value="${t.id}">${esc(t.displayName)}</option>`).join('');const saved=localStorage.getItem('depthTeam:'+sport);if(saved&&teams.some(t=>String(t.id)===saved))$('team').value=saved;await loadDepth()}catch(e){$('status').innerHTML=`<span class="error">Teams failed: ${esc(e.message)}</span>`}}
async function loadDepth(){const id=$('team').value;if(!id)return;localStorage.setItem('depthTeam:'+sport,id);const t=teams.find(x=>String(x.id)===String(id)),x=L[sport];$('status').textContent='Loading depth chart…';$('out').innerHTML='';hero(t);try{const j=await json(`https://site.api.espn.com/apis/site/v2/sports/${x.cat}/${x.league}/teams/${id}/depthcharts`);if(hasDepth(j)){raw=j;mode='depth';renderDepth(j);$('status').textContent='ESPN depth chart loaded.';return}throw Error('No depth chart returned')}catch(e){try{const r=await json(`https://site.api.espn.com/apis/site/v2/sports/${x.cat}/${x.league}/teams/${id}/roster`);raw=r;mode='roster';renderRoster(r);$('status').textContent='ESPN depth chart unavailable — showing active roster grouped by position.'}catch(e2){$('status').innerHTML=`<span class="error">No depth chart or roster available: ${esc(e2.message)}</span>`;$('out').innerHTML='<div class="empty">No player data returned for this team.</div>'}}}
function hero(t){if(!t)return;$('teamHero').innerHTML=`<div class="hero"><img src="${esc(t.logos?.[0]?.href||'')}" alt=""><div><div class="muted">${sport} · ${esc(t.abbreviation||'')}</div><h2>${esc(t.displayName)}</h2><div class="muted">${esc(t.location||'')} ${esc(t.name||'')}</div></div></div>`}
function hasDepth(j){return Array.isArray(j.depthCharts)&&j.depthCharts.some(g=>g.positions&&Object.keys(g.positions).length)}
function athleteInfo(a){const x=a.athlete||a;return{id:x.id,name:x.displayName||x.fullName||'Unknown',head:x.headshot?.href||x.headshot||'',jersey:x.jersey||'',pos:x.position?.abbreviation||'',rank:a.rank||'',status:x.status?.name||x.status?.type||''}}
function playerHTML(a,i){const p=athleteInfo(a),rank=Number(a.rank)||i+1,head=p.head||`https://a.espncdn.com/i/headshots/${L[sport].league}/players/full/${p.id}.png`;return`<div class="player"><span class="rank ${rank===1?'one':''}">${rank}</span><img class="head" src="${esc(head)}" alt="" onerror="this.style.visibility='hidden'"><div><div class="pname">${esc(p.name)}</div><div class="meta">${p.jersey?'#'+esc(p.jersey)+' · ':''}${esc(p.pos)}</div></div>${rank===1?'<span class="badge">Starter</span>':'<span class="badge">Depth '+rank+'</span>'}</div>`}
function renderDepth(j){const q=$('search').value.trim().toLowerCase();let groups=(j.depthCharts||[]).map(g=>{let positions=Object.values(g.positions||{}).map(p=>({name:p.position?.name||p.position?.abbreviation||'Position',abbr:p.position?.abbreviation||'',athletes:p.athletes||[]})).filter(p=>!q||p.name.toLowerCase().includes(q)||p.abbr.toLowerCase().includes(q)||p.athletes.some(a=>(athleteInfo(a).name||'').toLowerCase().includes(q)));return{name:g.name||g.displayName||'Depth Chart',positions}}).filter(g=>g.positions.length);$('out').innerHTML=groups.length?`<div class="grid">${groups.map(g=>`<section class="unit"><h3>${esc(g.name)}</h3>${g.positions.map(p=>`<div class="position"><div class="posname">${esc(p.abbr||p.name)} · ${esc(p.name)}</div><div class="players">${p.athletes.map(playerHTML).join('')||'<div class="muted">No players</div>'}</div></div>`).join('')}</section>`).join('')}</div>`:'<div class="empty">No matching positions or players.</div>'}
function rosterGroups(j){let out=[];if(Array.isArray(j.athletes)){for(const g of j.athletes){if(Array.isArray(g.items))out.push({name:g.position||g.name||g.abbreviation||'Roster',items:g.items});else if(g.displayName||g.fullName)out.push({name:g.position?.name||g.position?.abbreviation||'Roster',items:[g]})}}if(!out.length&&Array.isArray(j.items)){const m={};for(const a of j.items){const k=a.position?.name||a.position?.abbreviation||'Roster';(m[k]??=[]).push(a)}out=Object.entries(m).map(([name,items])=>({name,items}))}return out}
function renderRoster(j){const q=$('search').value.trim().toLowerCase(),groups=rosterGroups(j).map(g=>({...g,items:g.items.filter(a=>!q||g.name.toLowerCase().includes(q)||(a.displayName||a.fullName||'').toLowerCase().includes(q))})).filter(g=>g.items.length);$('out').innerHTML=groups.length?`<div class="grid">${groups.map(g=>`<section class="unit"><h3>${esc(g.name)} <span class="muted">(${g.items.length})</span></h3><div class="position"><div class="players">${g.items.map((a,i)=>playerHTML(a,i)).join('')}</div></div></section>`).join('')}</div>`:'<div class="empty">No matching roster players.</div>'}
$('team').onchange=loadDepth;$('refresh').onclick=loadDepth;$('search').oninput=()=>{if(!raw)return;mode==='depth'?renderDepth(raw):renderRoster(raw)};sportButtons();loadTeams();
</script></body></html>
