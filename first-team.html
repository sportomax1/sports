<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>First Team</title>
<style>
:root{color-scheme:dark;--bg:#07101b;--panel:#0e1928;--panel2:#132238;--line:#263a55;--text:#f7f9fc;--muted:#91a4bd;--gold:#f4b400;--green:#4ade80;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif}.shell{max-width:1500px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}h1{margin:0;font-size:32px}.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.controls,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:12px 0}label{display:grid;gap:4px;font-size:11px;color:var(--muted);font-weight:700}button,select,input{background:var(--panel2);color:#fff;border:1px solid #34506e;border-radius:8px;padding:9px;min-height:38px}button{cursor:pointer;font-weight:800}button.primary,.tab.active{background:var(--gold);color:#111;border-color:var(--gold)}button:disabled{opacity:.45;cursor:not-allowed}.status{padding:8px 0}.progress{height:7px;background:#142238;border-radius:9px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:9px}.player{display:grid;grid-template-columns:48px 1fr auto;gap:9px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}.player img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#172438}.pos{font-size:10px;font-weight:900;color:#ffd45c}.score{font-size:20px;font-weight:900;text-align:right}.small{font-size:11px;color:var(--muted)}.section{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px;background:var(--panel)}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{cursor:pointer;color:#cbd5e1}.rank{color:#ffd45c;font-weight:900}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px;z-index:20}.modal.open{display:grid}.dialog{width:min(850px,100%);max-height:88vh;overflow:auto;background:#0d1826;border:1px solid #3a4e69;border-radius:15px;padding:16px}.dialogTop{display:flex;justify-content:space-between;gap:12px}.weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px}.weight{display:grid;grid-template-columns:1fr 75px;gap:6px;align-items:center}.slotrow{display:grid;grid-template-columns:1fr 90px 44px;gap:6px;margin:6px 0}.logbtn{font-size:11px}.log{font:11px ui-monospace,monospace;white-space:pre-wrap;background:#050a11;padding:10px;border-radius:9px;max-height:300px;overflow:auto}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;margin:2px;font-size:10px}.warn{color:#fbbf24}.error{color:#ff8d87}@media(max-width:600px){.shell{padding:12px}h1{font-size:27px}.player{grid-template-columns:42px 1fr auto}.player img{width:42px;height:42px}}
</style></head><body><main class="shell">
<div class="top"><div><h1>First Team</h1><div class="muted">Build data-driven NFL First, Second & Third Teams from ESPN box-score production.</div></div><button id="diagBtn" class="logbtn">Diagnostics <span id="logCount">0</span></button></div>
<div class="card controls">
<label>Season<select id="season"></select></label><label>Scope<select id="scope"><option value="week">Single Week</option><option value="through">Through Week</option><option value="season">Full Regular Season</option></select></label><label id="weekWrap">Week<select id="week"></select></label>
<label>Scoring<select id="preset"><option value="composite">Position Composite</option><option value="ppr">Fantasy PPR</option><option value="half">Fantasy Half-PPR</option><option value="standard">Fantasy Standard</option></select></label>
<button id="settings">⚙ Roster & Scoring</button><button id="generate" class="primary">Generate Teams</button></div>
<div id="status" class="status muted">Ready.</div><div class="progress"><i id="bar"></i></div>
<div class="tabs"><button class="tab active" data-view="1">First Team</button><button class="tab" data-view="2">Second Team</button><button class="tab" data-view="3">Third Team</button><button class="tab" data-view="rank">Position Rankings</button><button class="tab" data-view="clubs">Team Distribution</button></div>
<div id="out"><div class="card muted">Choose a season/scope and generate. Weekly data uses that week's ESPN game box scores; season scopes aggregate game-by-game production.</div></div>
</main>
<div class="modal" id="modal"><div class="dialog"><div class="dialogTop"><div id="modalTitle"></div><button id="closeModal">✕</button></div><div id="modalBody"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT_SLOTS=[['QB',1],['RB',1],['WR',3],['TE',1],['OT',2],['OG',2],['C',1],['EDGE',2],['DT',2],['LB',2],['CB',2],['S',2],['DEF FLEX',1]];
const ELIG={QB:['QB'],RB:['RB','FB'],WR:['WR'],TE:['TE'],OT:['OT','T','LT','RT'],OG:['OG','G','LG','RG'],C:['C'],EDGE:['DE','EDGE','OLB'],DT:['DT','NT','DL'],LB:['LB','ILB','MLB','OLB'],CB:['CB','DB'],S:['S','FS','SS','DB'],'DEF FLEX':['DE','EDGE','DT','NT','DL','LB','ILB','MLB','OLB','CB','DB','S','FS','SS']};
const DEFAULT_WEIGHTS={passingYards:.04,passingTouchdowns:4,interceptions:-2,rushingYards:.1,rushingTouchdowns:6,receptions:1,receivingYards:.1,receivingTouchdowns:6,fumblesLost:-2,totalTackles:1,soloTackles:.25,sacks:4,tacklesForLoss:2,passesDefended:2,interceptionsDefense:6,forcedFumbles:4,fumbleRecoveries:3,defensiveTouchdowns:6};
let slots=JSON.parse(localStorage.getItem('firstTeamSlots')||'null')||DEFAULT_SLOTS.map(x=>[...x]);
let weights=JSON.parse(localStorage.getItem('firstTeamWeights')||'null')||{...DEFAULT_WEIGHTS};
let players=[],teams={1:[],2:[],3:[]},view='1',logs=[],sortKey='score',sortDir=-1;
const DB='first-team-v1',STORE='responses';
function log(s){logs.push(new Date().toLocaleTimeString()+'  '+s);$('logCount').textContent=logs.length;console.log('[First Team]',s)}
function setStatus(s,cls='muted'){$('status').className='status '+cls;$('status').textContent=s}
function setBar(n){$('bar').style.width=Math.max(0,Math.min(100,n))+'%'}
function years(){let y=new Date().getFullYear();$('season').innerHTML=Array.from({length:25},(_,i)=>y-i).map(v=>'<option>'+v+'</option>').join('');$('week').innerHTML=Array.from({length:18},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'</option>').join('')}
function db(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function cached(url){let d=await db(),tx=d.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get(url),hit=await new Promise(r=>{req.onsuccess=()=>r(req.result);req.onerror=()=>r(null)});if(hit){log('CACHE '+url);return hit}log('GET '+url);let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+' '+url);let j=await r.json();d=await db();d.transaction(STORE,'readwrite').objectStore(STORE).put(j,url);return j}
async function mapLimit(items,limit,fn){let out=new Array(items.length),next=0;async function worker(){while(next<items.length){let i=next++;try{out[i]=await fn(items[i],i)}catch(e){log('WARN '+e.message);out[i]=null}}}await Promise.all(Array.from({length:Math.min(limit,items.length)},worker));return out}
function statKey(s){let n=(s.name||s.abbreviation||s.displayName||'').replace(/[^a-z0-9]/gi,'').toLowerCase();const m={passyds:'passingYards',passingyards:'passingYards,passtd:'passingTouchdowns',passingtouchdowns:'passingTouchdowns',int:'interceptions',interceptions:'interceptions',rushyds:'rushingYards',rushingyards:'rushingYards',rushtd:'rushingTouchdowns',rushingtouchdowns:'rushingTouchdowns',rec:'receptions',receptions:'receptions',recyds:'receivingYards',receivingyards:'receivingYards,rectd:'receivingTouchdowns',receivingtouchdowns:'receivingTouchdowns',tot:'totalTackles',totaltackles:'totalTackles',solo:'soloTackles',solotackles:'soloTackles',sacks:'sacks',tfl:'tacklesForLoss',tacklesforloss:'tacklesForLoss',pd:'passesDefended',passesdefended:'passesDefended',ff:'forcedFumbles',forcedfumbles:'forcedFumbles',fr:'fumbleRecoveries',fumblerecoveries:'fumbleRecoveries'};return m[n]||s.name||s.abbreviation||s.displayName}
function num(v){let n=parseFloat(String(v??0).replace(/,/g,''));return Number.isFinite(n)?n:0}
function parseSummary(j){let out=[];for(const group of j?.boxscore?.players||[]){let team=group.team||{};for(const block of group.statistics||[]){let labels=block.labels||[],names=block.names||[];for(const a of block.athletes||[]){let athlete=a.athlete||{},id=athlete.id;if(!id)continue;let row=out.find(x=>x.id===String(id));if(!row){row={id:String(id),name:athlete.displayName||athlete.fullName||'Player '+id,head:athlete.headshot?.href||'',team:team.abbreviation||'',teamId:String(team.id||''),pos:athlete.position?.abbreviation||athlete.position?.name||'',stats:{},games:1};out.push(row)}(a.stats||[]).forEach((v,i)=>{let key=statKey({name:names[i],displayName:labels[i],abbreviation:labels[i]});row.stats[key]=(row.stats[key]||0)+num(v)})}}}}return out}
function merge(all){let m=new Map();for(const game of all.filter(Boolean)){for(const p of game){let x=m.get(p.id);if(!x)m.set(p.id,JSON.parse(JSON.stringify(p)));else{Object.entries(p.stats).forEach(([k,v])=>x.stats[k]=(x.stats[k]||0)+v);x.games++}}}return [...m.values()]}
function fantasyWeights(mode){let w={passingYards:.04,passingTouchdowns:4,interceptions:-2,rushingYards:.1,rushingTouchdowns:6,receivingYards:.1,receivingTouchdowns:6,fumblesLost:-2};if(mode==='ppr')w.receptions=1;if(mode==='half')w.receptions=.5;return w}
function scorePlayers(arr){let mode=$('preset').value,w=mode==='composite'?weights:fantasyWeights(mode);for(const p of arr){p.raw=Object.entries(w).reduce((a,[k,v])=>a+(p.stats[k]||0)*v,0);p.score=p.raw}if(mode==='composite'){let byPos={};for(const p of arr)(byPos[p.pos]??=[]).push(p);for(const group of Object.values(byPos)){let vals=group.map(x=>x.raw),min=Math.min(...vals),max=Math.max(...vals);for(const p of group)p.score=max===min?(p.raw?50:0):100*(p.raw-min)/(max-min)}}return arr}
async function weekEvents(year,w){let url='https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=100&dates='+year+'&seasontype=2&week='+w,j=await cached(url);return (j.events||[]).map(e=>e.id)}
async function loadWeek(year,w,progressBase=0,progressSpan=100){let ids=await weekEvents(year,w);log('Week '+w+': '+ids.length+' games');let done=0,data=await mapLimit(ids,16,async id=>{let j=await cached('https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event='+id);done++;setBar(progressBase+progressSpan*done/Math.max(1,ids.length));return parseSummary(j)});return merge(data)}
async function generate(){try{$('generate').disabled=true;players=[];teams={1:[],2:[],3:[]};setBar(0);let y=+$('season').value,w=+$('week').value,scope=$('scope').value,weeks=scope==='week'?[w]:scope==='through'?Array.from({length:w},(_,i)=>i+1):Array.from({length:18},(_,i)=>i+1);setStatus('Loading '+weeks.length+' week'+(weeks.length>1?'s':'')+' of ESPN game data…');let all=[];for(let i=0;i<weeks.length;i++){let a=await loadWeek(y,weeks[i],100*i/weeks.length,100/weeks.length);all.push(a)}players=scorePlayers(merge(all));buildTeams();setBar(100);setStatus(players.length+' players scored from '+weeks.length+' week'+(weeks.length>1?'s':'')+'. '+selectedCount()+' roster spots per team.');render()}catch(e){setStatus('Load failed: '+e.message,'error');log('ERROR '+e.stack)}finally{$('generate').disabled=false}}
function eligible(p,slot){return (ELIG[slot]||[slot]).includes(p.pos)}
function buildTeams(){let used=new Set();for(let n=1;n<=3;n++){let picked=[];for(const [slot,count] of slots){for(let i=0;i<count;i++){let cand=players.filter(p=>!used.has(p.id)&&eligible(p,slot)).sort((a,b)=>b.score-a.score)[0];if(cand){let q={...cand,slot};picked.push(q);used.add(cand.id)}}}teams[n]=picked}}
function selectedCount(){return slots.reduce((a,x)=>a+(+x[1]||0),0)}
function playerCard(p){return '<div class="player" data-id="'+p.id+'"><img src="'+esc(p.head)+'" alt=""><div><div class="pos">'+esc(p.slot||p.pos)+'</div><b>'+esc(p.name)+'</b><div class="small">'+esc(p.team)+' · '+esc(p.pos)+' · '+p.games+' G</div></div><div><div class="score">'+p.score.toFixed(1)+'</div><div class="small">score</div></div></div>'}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='rank')return renderRanks();if(view==='clubs')return renderClubs();let arr=teams[+view]||[];let off=arr.filter(p=>['QB','RB','WR','TE','OT','OG','C'].includes(p.slot)),def=arr.filter(p=>!off.includes(p));$('out').innerHTML='<h3 class="section">Offense · '+off.length+'</h3><div class="grid">'+off.map(playerCard).join('')+'</div><h3 class="section">Defense · '+def.length+'</h3><div class="grid">'+def.map(playerCard).join('')+'</div>'+(arr.length<selectedCount()?'<div class="card warn" style="margin-top:12px">Some configured slots could not be filled from ESPN box-score player data. Offensive-line individual production is especially limited in ESPN box scores; change those slots if you want a fully stat-ranked 22.</div>':'');bindPlayers()}
function renderRanks(){let a=[...players].sort((x,y)=>sortDir*((num(x[sortKey]))-(num(y[sortKey]))));if(sortKey==='score')a=[...players].sort((x,y)=>sortDir*(x.score-y.score));$('out').innerHTML='<div class="wrap"><table><thead><tr><th data-k="name">Player</th><th>Pos</th><th>Team</th><th data-k="games">G</th><th data-k="score">Score</th><th>Raw</th></tr></thead><tbody>'+a.map((p,i)=>'<tr class="prow" data-id="'+p.id+'"><td><b>'+(i+1)+'. '+esc(p.name)+'</b></td><td>'+esc(p.pos)+'</td><td>'+esc(p.team)+'</td><td>'+p.games+'</td><td class="rank">'+p.score.toFixed(1)+'</td><td>'+p.raw.toFixed(2)+'</td></tr>').join('')+'</tbody></table></div>';document.querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{sortKey=h.dataset.k;sortDir*=-1;renderRanks()});bindPlayers()}
function renderClubs(){let m={};for(const n of [1,2,3])for(const p of teams[n]){m[p.team]??={1:0,2:0,3:0};m[p.team][n]++}let a=Object.entries(m).sort((x,y)=>(y[1][1]+y[1][2]+y[1][3])-(x[1][1]+x[1][2]+x[1][3]));$('out').innerHTML='<div class="wrap"><table><thead><tr><th>Team</th><th>First</th><th>Second</th><th>Third</th><th>Total</th></tr></thead><tbody>'+a.map(([t,v])=>'<tr><td><b>'+esc(t)+'</b></td><td>'+v[1]+'</td><td>'+v[2]+'</td><td>'+v[3]+'</td><td class="rank">'+(v[1]+v[2]+v[3])+'</td></tr>').join('')+'</tbody></table></div>'}
function bindPlayers(){document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>showPlayer(el.dataset.id))}
function showPlayer(id){let p=players.find(x=>x.id===id);if(!p)return;$('modalTitle').innerHTML='<h2 style="margin:0">'+esc(p.name)+'</h2><div class="muted">'+esc(p.team)+' · '+esc(p.pos)+'</div>';let w=$('preset').value==='composite'?weights:fantasyWeights($('preset').value),parts=Object.entries(w).map(([k,v])=>({k,v,n:p.stats[k]||0,pts:(p.stats[k]||0)*v})).filter(x=>x.n);$('modalBody').innerHTML='<p><b>Score '+p.score.toFixed(1)+'</b> · raw '+p.raw.toFixed(2)+' · '+p.games+' games</p><table><thead><tr><th>Metric</th><th>Value</th><th>Weight</th><th>Points</th></tr></thead><tbody>'+parts.map(x=>'<tr><td>'+esc(x.k)+'</td><td>'+x.n.toFixed(2)+'</td><td>'+x.v+'</td><td>'+x.pts.toFixed(2)+'</td></tr>').join('')+'</tbody></table>';$('modal').classList.add('open')}
function settings(){ $('modalTitle').innerHTML='<h2 style="margin:0">Roster & Scoring</h2><div class="muted">Configure roster slots and composite-stat weights.</div>';let slotHtml=slots.map((x,i)=>'<div class="slotrow"><select class="slotName" data-i="'+i+'>'+Object.keys(ELIG).map(k=>'<option '+(k===x[0]?'selected':'')+'>'+k+'</option>').join('')+'</select><input class="slotCount" data-i="'+i+'" type="number" min="0" max="10" value="'+x[1]+'"><button class="slotDel" data-i="'+i+'">✕</button></div>').join('');let weightHtml=Object.entries(weights).map(([k,v])=>'<label class="weight"><span>'+esc(k)+'</span><input class="wgt" data-k="'+esc(k)+'" type="number" step=".05" value="'+v+'"></label>').join('');$('modalBody').innerHTML='<h3>Roster · '+selectedCount()+' spots</h3><div id="slotBox">'+slotHtml+'</div><div class="actions"><button id="addSlot">+ Slot</button><button id="resetSlots">Reset 22</button></div><h3>Composite weights</h3><div class="weights">'+weightHtml+'</div><div class="actions"><button id="saveSettings" class="primary">Save Settings</button><button id="resetWeights">Reset Weights</button></div>';$('modal').classList.add('open');document.querySelectorAll('.slotDel').forEach(b=>b.onclick=()=>{slots.splice(+b.dataset.i,1);settings()});$('addSlot').onclick=()=>{slots.push(['WR',1]);settings()};$('resetSlots').onclick=()=>{slots=DEFAULT_SLOTS.map(x=>[...x]);settings()};$('resetWeights').onclick=()=>{weights={...DEFAULT_WEIGHTS};settings()};$('saveSettings').onclick=()=>{document.querySelectorAll('.slotName').forEach(s=>slots[+s.dataset.i][0]=s.value);document.querySelectorAll('.slotCount').forEach(s=>slots[+s.dataset.i][1]=Math.max(0,+s.value||0));document.querySelectorAll('.wgt').forEach(i=>weights[i.dataset.k]=+i.value||0);localStorage.setItem('firstTeamSlots',JSON.stringify(slots));localStorage.setItem('firstTeamWeights',JSON.stringify(weights));$('modal').classList.remove('open');if(players.length){scorePlayers(players);buildTeams();render()}}}
$('generate').onclick=generate;$('settings').onclick=settings;$('closeModal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('diagBtn').onclick=()=>{$('modalTitle').innerHTML='<h2 style="margin:0">Diagnostics</h2><div class="muted">Exact API/cache activity</div>';$('modalBody').innerHTML='<div class="log">'+esc(logs.join('\n')||'No requests yet.')+'</div>';$('modal').classList.add('open')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('scope').onchange=()=>{$('weekWrap').style.display=$('scope').value==='season'?'none':''};years();
</script></body></html>
