<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Roster Retention Matrix</title>
<style>
:root{color-scheme:dark;--bg:#07101b;--panel:#0e1928;--panel2:#132238;--line:#263a55;--muted:#91a4bd;--gold:#f4b400;--green:#7ee787;--red:#ff7b72;--blue:#58a6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px Inter,system-ui,sans-serif}.shell{max-width:1700px;margin:auto;padding:18px}h1{margin:0;font-size:34px}.sub{color:var(--muted);margin:4px 0 14px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.status{color:var(--muted)}.progress{height:8px;background:#172334;border-radius:999px;overflow:hidden;margin:-3px 0 12px}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold),var(--green));transition:width .2s ease}button,select{background:var(--panel2);color:#fff;border:1px solid #345;border-radius:8px;padding:8px 11px;min-height:38px}button{cursor:pointer}.matrixwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1250px}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}th{background:#101d2e;padding:10px;position:sticky;top:0;z-index:4;text-align:center}.teamhead{left:0;z-index:6;text-align:left;min-width:220px}.team{position:sticky;left:0;z-index:3;background:#101d2e;padding:8px 10px;min-width:220px}.teamrow{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:34px;height:34px;object-fit:contain}.cell{width:100%;min-width:105px;min-height:62px;border:0;border-radius:0;display:grid;place-items:center;gap:1px;font-weight:900;font-size:17px}.cell small{font-size:10px;font-weight:600;opacity:.9}.na{background:#172334;color:#71849c;cursor:default}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:18px;z-index:30}.hide{display:none}.dialog{width:min(950px,97vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.mhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.mhead h2{margin:0}.muted{color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button.active{background:var(--gold);color:#111;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}.player{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px}.playerbtn{cursor:pointer;width:100%;text-align:left;color:inherit}.playerbtn:hover{border-color:#58769d}.statsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}.statcard{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px}.statcard b{display:block;font-size:20px}.face{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#17253a}.badge{font-size:10px;border:1px solid #456;border-radius:999px;padding:3px 6px}.kept{color:var(--green)}.out{color:var(--red)}.in{color:var(--blue)}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:600px){.shell{padding:10px}h1{font-size:27px}.teamhead,.team{min-width:165px}.cell{min-width:92px}}
</style></head><body><main class="shell">
<h1>NFL Roster Retention Matrix</h1><div class="sub">Each year shows the percentage of the prior season's players who also appeared for that team in the selected season.</div>
<div class="bar"><label>From <select id="from"></select></label><label>Through <select id="to"></select></label><label>Cell display <select id="mode"><option value="pct">Retention %</option><option value="rank">Year rank</option></select></label><button id="reload">Reload matrix</button><span id="status" class="status">Starting…</span></div><div class="progress"><i id="progressFill"></i></div>
<div class="matrixwrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
</main>
<div id="playerModal" class="modal hide" style="z-index:40"><div class="dialog"><div class="mhead"><div><h2 id="ptitle"></h2><div id="psub" class="muted"></div></div><button id="pclose">Close</button></div><div id="pbody"><div class="empty">Loading…</div></div></div></div>
<div id="modal" class="modal hide"><div class="dialog"><div class="mhead"><div><h2 id="mtitle"></h2><div id="msub" class="muted"></div></div><button id="close">Close</button></div><div class="tabs"><button data-tab="kept" class="active">Retained</button><button data-tab="incoming">Incoming</button><button data-tab="outgoing">Outgoing</button></div><div id="players"></div></div></div>
<script>
'use strict';
const $=x=>document.getElementById(x), cache=new Map();
const TEAMS=[['1','Atlanta Falcons','atl'],['2','Buffalo Bills','buf'],['3','Chicago Bears','chi'],['4','Cincinnati Bengals','cin'],['5','Cleveland Browns','cle'],['6','Dallas Cowboys','dal'],['7','Denver Broncos','den'],['8','Detroit Lions','det'],['9','Green Bay Packers','gb'],['10','Tennessee Titans','ten'],['11','Indianapolis Colts','ind'],['12','Kansas City Chiefs','kc'],['13','Las Vegas Raiders','lv'],['14','Los Angeles Rams','lar'],['15','Miami Dolphins','mia'],['16','Minnesota Vikings','min'],['17','New England Patriots','ne'],['18','New Orleans Saints','no'],['19','New York Giants','nyg'],['20','New York Jets','nyj'],['21','Philadelphia Eagles','phi'],['22','Arizona Cardinals','ari'],['23','Pittsburgh Steelers','pit'],['24','Los Angeles Chargers','lac'],['25','San Francisco 49ers','sf'],['26','Seattle Seahawks','sea'],['27','Tampa Bay Buccaneers','tb'],['28','Washington Commanders','wsh'],['29','Carolina Panthers','car'],['30','Jacksonville Jaguars','jax'],['33','Baltimore Ravens','bal'],['34','Houston Texans','hou']];const TEAM_IDS=TEAMS.map(x=>+x[0]);
const current=new Date().getFullYear(), state={teams:[],data:new Map(),modal:null,tab:'kept',run:0,rankings:new Map()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let dbp=null;function db(){return dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open('nfl-retention-matrix',2);r.onupgradeneeded=()=>{if(r.result.objectStoreNames.contains('kv'))r.result.deleteObjectStore('kv');r.result.createObjectStore('kv')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
async function idbGet(k){try{const d=await db();return await new Promise(ok=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch{return null}}
async function idbSet(k,v){try{const d=await db();await new Promise(ok=>{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=ok;tx.onerror=ok})}catch{}}
async function json(url){if(cache.has(url))return cache.get(url);const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(r.status);const j=await r.json();cache.set(url,j);return j}
async function pool(items,n,fn){let i=0,out=new Array(items.length);async function worker(){while(i<items.length){const k=i++;try{out[k]=await fn(items[k],k)}catch(e){out[k]=null}}}await Promise.all(Array.from({length:Math.min(n,items.length||1)},worker));return out}
async function loadTeams(){state.teams=TEAMS.map(([id,name,abbr])=>({id,name,abbr:abbr.toUpperCase(),logo:'https://a.espncdn.com/i/teamlogos/nfl/500/'+abbr+'.png'})).sort((a,b)=>a.name.localeCompare(b.name))}
function years(){const a=+$('from').value,b=+$('to').value,out=[];for(let y=a;y<=b;y++)out.push(y);return out}
async function seasonGames(year){const key='G'+year;if(cache.has(key))return cache.get(key);const urls=[];for(let w=1;w<=18;w++)urls.push('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates='+year+'&seasontype=2&week='+w);const js=await pool(urls,5,u=>json(u));const games=[];for(const j of js)for(const e of j?.events||[]){const c=e?.competitions?.[0];if(!c)continue;for(const x of c.competitors||[])games.push({eventId:String(e.id),competitionId:String(c.id||e.id),teamId:String(x.id||x.team?.id||'')})}cache.set(key,games);return games}
async function hydratePlayer(p){if(!p?.id)return p;try{const j=await json('https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/athletes/'+p.id);const first=j?.firstName||'',last=j?.lastName||'',name=(first+' '+last).trim()||j?.fullName||j?.displayName||p.name;return{...p,name,pos:p.pos||j?.position?.abbreviation||'',jersey:p.jersey||j?.jersey||'',head:j?.headshot?.href||p.head}}catch{return p}}
async function gameRoster(g){const u='https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/'+g.eventId+'/competitions/'+g.competitionId+'/competitors/'+g.teamId+'/roster';const j=await json(u);return j?.entries||[]}
function athlete(e){const ref=e?.athlete?.$ref||'';const m=ref.match(/\/athletes\/(\d+)/);const id=String(e?.playerId||m?.[1]||e?.athlete?.id||'');if(!id)return null;const first=e?.athlete?.firstName||'',last=e?.athlete?.lastName||'',full=(first+' '+last).trim()||e?.athlete?.fullName||e?.athlete?.displayName||e?.displayName||('Player '+id);return{id,name:full,pos:e?.position?.abbreviation||e?.position?.name||'',jersey:e?.jersey||'',head:e?.athlete?.headshot?.href||'https://a.espncdn.com/i/headshots/nfl/players/full/'+id+'.png'}}
async function buildSeason(year){const saved=await idbGet('season-'+year);if(saved){for(const [tid,players] of Object.entries(saved))state.data.set(tid+'-'+year,players);return}const games=await seasonGames(year), byTeam=new Map(TEAM_IDS.map(id=>[String(id),new Map()]));const rosters=await pool(games,8,async g=>({g,entries:await gameRoster(g)}));for(const x of rosters){if(!x)continue;const m=byTeam.get(x.g.teamId);if(!m)continue;for(const e of x.entries||[]){const p=athlete(e);if(p&&!m.has(p.id))m.set(p.id,p)}}const packed={};for(const [tid,m] of byTeam){const raw=[...m.values()];const needs=raw.filter(p=>!p.name||p.name.startsWith('Player ')||!p.name.includes(' '));const hydrated=await pool(needs,8,hydratePlayer),fix=new Map(hydrated.filter(Boolean).map(p=>[p.id,p]));packed[tid]=raw.map(p=>fix.get(p.id)||p);state.data.set(tid+'-'+year,packed[tid])}await idbSet('season-'+year,packed)}
function compare(a,b){a=Array.isArray(a)?a:[];b=Array.isArray(b)?b:[];const A=new Map(a.map(p=>[p.id,p])),B=new Map(b.map(p=>[p.id,p]));return{kept:a.filter(p=>B.has(p.id)),outgoing:a.filter(p=>!B.has(p.id)),incoming:b.filter(p=>!A.has(p.id))}}
function color(p){const h=Math.max(0,Math.min(120,p*1.2));return 'hsl('+h+' 64% 34%)'}
async function render(){const run=++state.run,ys=years();state.rankings.clear();$('progressFill').style.width='0%';$('status').textContent='Preparing '+ys.length+' seasons…';$('thead').innerHTML='<tr><th class="teamhead">Team</th>'+ys.map((y,i)=>'<th>'+(i?((y-1)+' → '+y):y+' baseline')+'</th>').join('')+'</tr>';$('tbody').innerHTML=state.teams.map(t=>'<tr><td class="team"><div class="teamrow"><img class="logo" src="'+esc(t.logo)+'" alt=""><span>'+esc(t.name)+'</span></div></td>'+ys.map(()=>'<td><button class="cell na" disabled>…</button></td>').join('')+'</tr>').join('');
 let done=0;await pool(ys,2,async y=>{await buildSeason(y);done++;$('progressFill').style.width=Math.round(done/ys.length*100)+'%';$('status').textContent='Loaded '+done+' of '+ys.length+' seasons…'});if(run!==state.run)return;
 for(let yi=1;yi<ys.length;yi++){const vals=state.teams.map(t=>{const a=state.data.get(t.id+'-'+ys[yi-1])||[],b=state.data.get(t.id+'-'+ys[yi])||[];if(!a.length||!b.length)return{tid:t.id,p:null};const c=compare(a,b);return{tid:t.id,p:Math.round(c.kept.length/a.length*100)}}).filter(x=>x.p!=null).sort((a,b)=>b.p-a.p);const ranks=new Map();let rank=0,last=null;vals.forEach((x,i)=>{if(x.p!==last)rank=i+1;ranks.set(x.tid,{rank,p:x.p});last=x.p});state.rankings.set(ys[yi],ranks)}
 const rows=[...$('tbody').rows];state.teams.forEach((t,ri)=>ys.forEach((y,yi)=>{const btn=rows[ri].cells[yi+1].querySelector('button');if(!yi){btn.textContent='—';return}const a=state.data.get(t.id+'-'+ys[yi-1])||[],b=state.data.get(t.id+'-'+y)||[];if(!a.length||!b.length){btn.textContent='N/A';return}const c=compare(a,b),p=Math.round(c.kept.length/a.length*100),rank=state.rankings.get(y)?.get(t.id)?.rank;btn.disabled=false;btn.className='cell';btn.style.background=color(p);btn.dataset.p=p;btn.dataset.rank=rank||'';btn.dataset.detail=c.kept.length+' / '+a.length+' retained';btn.onclick=()=>openModal(t,ys[yi-1],y,a,b)}));updateMode();$('progressFill').style.width='100%';$('status').textContent='Matrix loaded · saved locally in IndexedDB.'}
function updateMode(){const mode=$('mode').value;$('tbody').querySelectorAll('.cell:not(.na)').forEach(btn=>{if(btn.disabled||!btn.dataset.p)return;btn.innerHTML=mode==='rank'?'#'+btn.dataset.rank+'<small>'+btn.dataset.p+'% retention</small>':btn.dataset.p+'%<small>'+btn.dataset.detail+'</small>'})}
function openModal(t,aYear,bYear,a,b){const c=compare(a,b),p=Math.round(c.kept.length/a.length*100);state.modal={t,aYear,bYear,c,p,base:a.length};state.tab='kept';$('mtitle').textContent=t.name+' · '+aYear+' → '+bYear;$('msub').textContent=p+'% retained · '+c.kept.length+' of '+a.length+' prior-season players';$('modal').classList.remove('hide');renderPlayers()}
function renderPlayers(){const d=state.modal;if(!d)return;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));const arr=d.c[state.tab]||[],label={kept:'Retained',incoming:'Incoming',outgoing:'Outgoing'}[state.tab],cl={kept:'kept',incoming:'in',outgoing:'out'}[state.tab];$('players').innerHTML=arr.length?'<div class="grid">'+arr.sort((a,b)=>(a.pos||'').localeCompare(b.pos||'')||a.name.localeCompare(b.name)).map(p=>'<button class="player playerbtn" data-player="'+esc(p.id)+'"><img class="face" src="'+esc(p.head)+'" alt=""><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.pos)+(p.jersey?' · #'+esc(p.jersey):'')+'</div></div><span class="badge '+cl+'">'+label+'</span></button>').join('')+'</div>':'<div class="empty">No players in this group.</div>';$('players').querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>openPlayer(b.dataset.player))}
async function openPlayer(id){$('playerModal').classList.remove('hide');$('ptitle').textContent='Loading player…';$('psub').textContent='ESPN career season statistics';$('pbody').innerHTML='<div class="empty">Loading player profile and yearly stats…</div>';let profile=null;try{profile=await hydratePlayer({id,name:'Player '+id,pos:'',jersey:'',head:'https://a.espncdn.com/i/headshots/nfl/players/full/'+id+'.png'})}catch{}$('ptitle').textContent=profile?.name||('Player '+id);$('psub').textContent=[profile?.pos,profile?.jersey?'#'+profile.jersey:''].filter(Boolean).join(' · ')+' · Yearly NFL stats';
 const ys=years(),results=await pool(ys,5,async y=>{try{const j=await json('https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/'+y+'/types/2/athletes/'+id+'/statistics?lang=en&region=us');return{y,j}}catch{return null}});
 const rows=[];for(const x of results.filter(Boolean)){const cats=x.j?.splits?.categories||x.j?.categories||[];const vals=[];for(const c of cats)for(const st of c?.stats||[])if(Number(st?.value)!==0&&['gamesPlayed','completions','passingYards','passingTouchdowns','interceptions','rushingAttempts','rushingYards','rushingTouchdowns','receptions','receivingYards','receivingTouchdowns','totalTackles','soloTackles','sacks','interceptions','fieldGoalsMade','fieldGoalPct','punts','puntingYards'].includes(st?.name))vals.push({n:st?.shortDisplayName||st?.abbreviation||st?.name,v:st?.displayValue??st?.value});if(vals.length)rows.push({y:x.y,vals:vals.slice(0,10)})}
 $('pbody').innerHTML=rows.length?rows.map(r=>'<section><h3>'+r.y+'</h3><div class="statsgrid">'+r.vals.map(v=>'<div class="statcard"><span class="muted">'+esc(v.n)+'</span><b>'+esc(v.v)+'</b></div>').join('')+'</div></section>').join(''):'<div class="empty">No yearly stat splits were returned for this player in the selected year range.</div>'}
for(let y=current;y>=2005;y--){$('from').insertAdjacentHTML('beforeend','<option value="'+y+'">'+y+'</option>');$('to').insertAdjacentHTML('beforeend','<option value="'+y+'">'+y+'</option>')}$('from').value=String(Math.max(2005,current-9));$('to').value=String(current);
$('pclose').onclick=()=>$('playerModal').classList.add('hide');$('playerModal').onclick=e=>{if(e.target===$('playerModal'))$('playerModal').classList.add('hide')};$('reload').onclick=render;$('mode').onchange=updateMode;$('close').onclick=()=>$('modal').classList.add('hide');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hide')};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderPlayers()});
(async()=>{try{$('status').textContent='Loading teams…';await loadTeams();await render()}catch(e){$('status').textContent='Load failed: '+e.message}})();
</script></body></html>
