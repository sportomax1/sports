<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standings Lab</title><style>:root{--bg:#07101b;--p:#0e1928;--p2:#132238;--line:#263a55;--muted:#91a4bd;--gold:#f4b400}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:#fff;font:14px system-ui}h1{margin:0}button,select,input{background:var(--p2);color:#fff;border:1px solid #345;border-radius:8px;padding:9px;margin:3px}button{cursor:pointer}button.active{background:var(--gold);color:#111}.tabs,.controls{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:10px 0}.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.muted{color:var(--muted)}.hidden{display:none}.wrap{overflow:auto;max-height:72vh}table{width:100%;border-collapse:separate;border-spacing:0;background:var(--p)}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{position:sticky;top:0;background:var(--p2);z-index:3}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#101d2e;z-index:2}.team{display:flex;align-items:center;gap:8px;cursor:pointer}.team:hover b{text-decoration:underline;color:#ffd45c}.team img{width:28px;height:28px;object-fit:contain}.heat{text-align:center!important;font-weight:800}.error{color:#ff9b96}.good{color:#7ee787}.bad{color:#ff7b72}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:100;padding:18px}.modal.open{display:flex}.modalbox{width:min(850px,100%);max-height:90vh;overflow:auto;background:#0d1928;border:1px solid #3a526f;border-radius:16px;padding:18px;box-shadow:0 20px 80px #000}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.hero{display:flex;gap:16px;align-items:center}.hero img{width:88px;height:88px;object-fit:contain}.x{font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0}.stat{background:#101f31;border:1px solid var(--line);border-radius:10px;padding:10px}.stat b{font-size:19px;display:block}.profiletable td:first-child{position:static;background:transparent}.badge{display:inline-block;border:1px solid #49627f;border-radius:999px;padding:4px 8px;margin:2px}.legend{display:flex;gap:8px;align-items:center}.gradient{width:160px;height:12px;border-radius:8px;background:linear-gradient(90deg,#922c2c,#88721f,#257942)}</style></head><body><h1>Standings Lab</h1><div class="muted">NFL · NBA · MLB · NHL — standings, history, playoffs, streaks + team profiles</div><div id="sports" class="tabs"></div><div class="tabs" id="tabs"><button data-view="standings" class="active">Standings</button><button data-view="history">League History</button><button data-view="playoffs">Playoffs</button><button data-view="streaks">Streaks</button></div><section id="view-standings"><div class="controls"><label>Season <select id="season"></select></label><label>Scope <select id="scope"><option value="division">Division</option><option value="conference">Conference</option><option value="league">League</option></select></label><input id="filter" placeholder="Filter team"><button id="refresh">Refresh</button></div><div id="status" class="muted"></div><div id="standOut" class="wrap"></div></section><section id="view-history" class="hidden"><div class="card"><div class="controls"><label>From <select id="hFrom"></select></label><label>To <select id="hTo"></select></label><label>Metric <select id="hMetric"><option value="rank">League Rank</option><option value="pct">Win / Points %</option><option value="wins">Wins</option><option value="diff">Differential</option></select></label><button id="historyBtn">Build History</button></div><div class="legend">Worse <div class="gradient"></div> Better</div></div><div id="histStatus" class="muted"></div><div id="histOut" class="wrap"></div></section><section id="view-playoffs" class="hidden"><div class="card"><div class="controls"><label>From <select id="pFrom"></select></label><label>To <select id="pTo"></select></label><button id="playBtn">Load Playoff Records</button></div></div><div id="playStatus" class="muted"></div><div id="playOut" class="wrap"></div></section><section id="view-streaks" class="hidden"><div class="card"><div class="controls"><label>From <select id="sFrom"></select></label><label>To <select id="sTo"></select></label><label>Games <select id="sType"><option value="both">Regular + Playoffs</option><option value="2">Regular only</option><option value="3">Playoffs only</option></select></label><label>Streak <select id="sKind"><option value="both">Wins + Losses</option><option value="W">Wins</option><option value="L">Losses</option></select></label><label>Minimum <input id="sMin" type="number" min="2" value="5" style="width:65px"></label><button id="streakBtn">Find Streaks</button></div></div><div id="streakStatus" class="muted"></div><div id="streakOut" class="wrap"></div></section><div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><div id="modalHero"></div><button id="closeModal" class="x">×</button></div><div id="modalBody"></div></div></div><script>'use strict';const LG={NFL:['football','nfl'],NBA:['basketball','nba'],MLB:['baseball','mlb'],NHL:['hockey','nhl']},$=x=>document.getElementById(x);let sport=localStorage.standingsSport||'NFL',stand=[],cache=new Map();function cur(sp=sport){let d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;return sp==='MLB'?y:(m<7?y-1:y)}function lab(y,sp=sport){return sp==='NBA'||sp==='NHL'?y+'-'+String(y+1).slice(-2):String(y)}function years(){let a=[];for(let y=cur();y>=2002;y--)a.push(y);return a}async function json(u){let r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function sm(e){let m={};for(let s of e.stats||[]){m[s.name]=s.displayValue??s.value;m['_'+s.name]=Number(s.value);if(s.abbreviation)m[s.abbreviation]=s.displayValue??s.value}return m}function n(m,k,d=0){let v=m['_'+k];if(Number.isFinite(v))return v;v=parseFloat(m[k]);return Number.isFinite(v)?v:d}function flat(x,path=[]){let a=[];if(x?.standings?.entries)for(let e of x.standings.entries)a.push({e,path:[...path]});for(let c of x.children||[])a.push(...flat(c,path.concat(c.name||c.abbreviation||'Group')));return a}async function seasonData(sp,y){let k='s'+sp+y;if(cache.has(k))return cache.get(k);let [c,l]=LG[sp],j=await json(`https://site.api.espn.com/apis/v2/sports/${c}/${l}/standings?season=${y}`),v=flat({children:j.children||[]});cache.set(k,v);return v}function pct(r,sp=sport){let m=sm(r.e);if(sp==='NHL'){let p=n(m,'pointsPercentage',NaN);if(Number.isFinite(p))return p;let gp=n(m,'gamesPlayed',n(m,'wins')+n(m,'losses')+n(m,'otLosses'));return n(m,'points')/Math.max(1,gp*2)}let p=n(m,'winPercent',NaN);if(Number.isFinite(p))return p;let w=n(m,'wins'),l=n(m,'losses'),t=n(m,'ties');return(w+.5*t)/Math.max(1,w+l+t)}function dif(r){let m=sm(r.e);return n(m,'pointDifferential',n(m,'differential',n(m,'pointsFor')-n(m,'pointsAgainst')))}function sortFn(sp=sport){return(a,b)=>{let A=sm(a.e),B=sm(b.e);return sp==='NHL'?n(B,'points')-n(A,'points')||pct(b,sp)-pct(a,sp)||n(B,'regulationWins')-n(A,'regulationWins')||n(B,'wins')-n(A,'wins')||dif(b)-dif(a):pct(b,sp)-pct(a,sp)||dif(b)-dif(a)}}function heat(v){return`background:hsl(${Math.max(0,Math.min(1,v))*120} 55% 30%);color:white`}function group(r,s){let p=r.path||[];return s==='league'?sport:s==='division'?(p.at(-1)||'Division'):(p[0]||'Conference')}function cols(){if(sport==='NHL')return[['GP','gamesPlayed'],['W','wins'],['L','losses'],['OTL','otLosses'],['PTS','points'],['P%','pointsPercentage'],['RW','regulationWins'],['ROW','regulationOvertimeWins'],['GF','pointsFor'],['GA','pointsAgainst'],['DIFF','differential'],['STRK','streak']];if(sport==='NFL')return[['W','wins'],['L','losses'],['T','ties'],['PCT','winPercent'],['PF','pointsFor'],['PA','pointsAgainst'],['DIFF','pointDifferential'],['STRK','streak']];if(sport==='NBA')return[['W','wins'],['L','losses'],['PCT','winPercent'],['GB','gamesBehind'],['HOME','home'],['AWAY','road'],['PPG','avgPointsFor'],['OPP','avgPointsAgainst'],['DIFF','differential'],['STRK','streak']];return[['W','wins'],['L','losses'],['PCT','winPercent'],['GB','gamesBehind'],['HOME','home'],['AWAY','road'],['RS','pointsFor'],['RA','pointsAgainst'],['DIFF','differential'],['L10','lastTenGames'],['STRK','streak']]}function controls(){let h=years().map(y=>`<option value="${y}">${lab(y)}</option>`).join('');for(let id of ['season','hFrom','hTo','pFrom','pTo','sFrom','sTo'])$(id).innerHTML=h;let f=Math.max(2002,cur()-9);for(let id of ['hFrom','pFrom','sFrom'])$(id).value=f;for(let id of ['hTo','pTo','sTo'])$(id).value=cur()}function sports(){$('sports').innerHTML=Object.keys(LG).map(s=>`<button data-s="${s}" class="${s===sport?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.standingsSport=sport;sports();controls();load()})}async function load(){$('status').textContent='Loading…';try{stand=await seasonData(sport,+$('season').value);render();$('status').textContent=stand.length+' teams loaded'}catch(e){$('status').innerHTML='<span class="error">'+e.message+'</span>'}}function teamHTML(t,extra=''){return`<div class="team" data-team="${t.id}" ${extra}><img src="${t.logos?.[0]?.href||t.logo||''}" alt=""><b>${t.displayName||t.name}</b></div>`}function bindTeams(root=document){root.querySelectorAll('[data-team]').forEach(el=>el.onclick=()=>openProfile(el.dataset.team))}function render(){let s=$('scope').value,q=$('filter').value.toLowerCase(),gs={};for(let r of stand){if(!(r.e.team.displayName||'').toLowerCase().includes(q))continue;(gs[group(r,s)]??=[]).push(r)}let cs=cols();$('standOut').innerHTML=Object.entries(gs).map(([g,rs])=>{rs.sort(sortFn());return`<h2>${g}</h2><table><thead><tr><th>Team</th><th>Rank</th>${cs.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rs.map((r,i)=>{let m=sm(r.e),v=rs.length>1?1-i/(rs.length-1):1;return`<tr><td>${teamHTML(r.e.team)}</td><td class="heat" style="${heat(v)}">${i+1}/${rs.length}</td>${cs.map(c=>`<td>${m[c[1]]??m[c[0]]??'—'}</td>`).join('')}</tr>`}).join('')}</tbody></table>`}).join('');bindTeams($('standOut'))}function span(a,b){a=+a;b=+b;if(a>b)[a,b]=[b,a];let z=[];for(let y=a;y<=b;y++)z.push(y);return z}async function history(){let ys=span($('hFrom').value,$('hTo').value),metric=$('hMetric').value;$('histStatus').textContent='Loading…';try{let packs=await Promise.all(ys.map(y=>seasonData(sport,y))),teams=new Map(),maps=packs.map(p=>{let r=[...p].sort(sortFn()),m=new Map();r.forEach((x,i)=>{let id=String(x.e.team.id);teams.set(id,x.e.team);m.set(id,{x,rank:i+1,total:r.length,norm:r.length>1?1-i/(r.length-1):1})});return m});let ids=[...teams.keys()].sort((a,b)=>avg(b)-avg(a));function avg(id){let z=maps.map(m=>m.get(id)).filter(Boolean);return z.reduce((s,x)=>s+x.norm,0)/Math.max(1,z.length)}$('histOut').innerHTML=`<table><thead><tr><th>Team</th>${ys.map(y=>`<th>${lab(y)}</th>`).join('')}<th>Avg %ile</th></tr></thead><tbody>${ids.map(id=>{let t=teams.get(id),zs=maps.map(m=>m.get(id));return`<tr><td>${teamHTML(t)}</td>${zs.map(z=>{if(!z)return'<td>—</td>';let m=sm(z.x.e),v=metric==='rank'?z.rank+'/'+z.total:metric==='pct'?(pct(z.x)*100).toFixed(1)+'%':metric==='wins'?n(m,'wins'):Math.round(dif(z.x));return`<td class="heat" style="${heat(z.norm)}">${v}</td>`}).join('')}<td class="heat" style="${heat(avg(id))}">${Math.round(avg(id)*100)}%</td></tr>`}).join('')}</tbody></table>`;bindTeams($('histOut'));$('histStatus').textContent='Loaded'}catch(e){$('histStatus').textContent='Failed: '+e.message}}function range(sp,y,type){if(sp==='MLB')return type===2?[`${y}0320`,`${y}1005`]:[`${y}1001`,`${y}1201`];return type===2?[`${y}0901`,`${y+1}0501`]:[`${y+1}0401`,`${y+1}0701`]}function parseEvents(es,y,type){return es.filter(e=>e.status?.type?.completed).map(e=>{let c=e.competitions?.[0]?.competitors||[];if(c.length<2)return null;let A=c[0],B=c[1],as=+A.score,bs=+B.score;return{id:e.id,date:new Date(e.date),season:y,type,teams:[{id:String(A.team.id),name:A.team.displayName,logo:A.team.logo||'',score:as,res:as>bs?'W':as<bs?'L':'T',opp:B.team.displayName},{id:String(B.team.id),name:B.team.displayName,logo:B.team.logo||'',score:bs,res:bs>as?'W':bs<as?'L':'T',opp:A.team.displayName}]}}).filter(Boolean)}async function games(sp,y,type){let k=`g:${sp}:${y}:${type}`;if(cache.has(k))return cache.get(k);let [c,l]=LG[sp],es=[];if(sp==='NFL'){for(let w=1;w<=(type===2?18:5);w++){let j=await json(`https://site.api.espn.com/apis/site/v2/sports/${c}/${l}/scoreboard?season=${y}&seasontype=${type}&week=${w}&limit=100`);es.push(...(j.events||[]))}}else{let [a,b]=range(sp,y,type),j=await json(`https://site.api.espn.com/apis/site/v2/sports/${c}/${l}/scoreboard?dates=${a}-${b}&seasontype=${type}&limit=1000`);es=j.events||[]}let v=parseEvents(es,y,type);cache.set(k,v);return v}async function playoffs(){let ys=span($('pFrom').value,$('pTo').value);$('playStatus').textContent='Loading…';try{let packs=await Promise.all(ys.map(y=>games(sport,y,3))),m=new Map();for(let gs of packs)for(let g of gs)for(let t of g.teams){let x=m.get(t.id)||{id:t.id,name:t.name,logo:t.logo,w:0,l:0,g:0,pf:0,pa:0};let o=g.teams.find(z=>z.id!==t.id);x.g++;x.pf+=t.score;x.pa+=o.score;if(t.res==='W')x.w++;if(t.res==='L')x.l++;m.set(t.id,x)}let rows=[...m.values()].sort((a,b)=>b.w-a.w||a.l-b.l);$('playOut').innerHTML=`<table><thead><tr><th>Team</th><th>G</th><th>W</th><th>L</th><th>Win%</th><th>PF/G</th><th>PA/G</th><th>Diff/G</th></tr></thead><tbody>${rows.map(x=>`<tr><td><div class="team" data-team="${x.id}"><img src="${x.logo}"><b>${x.name}</b></div></td><td>${x.g}</td><td>${x.w}</td><td>${x.l}</td><td>${(x.w/Math.max(1,x.g)*100).toFixed(1)}%</td><td>${(x.pf/x.g).toFixed(1)}</td><td>${(x.pa/x.g).toFixed(1)}</td><td>${((x.pf-x.pa)/x.g).toFixed(1)}</td></tr>`).join('')}</tbody></table>`;bindTeams($('playOut'));$('playStatus').textContent=rows.length+' teams'}catch(e){$('playStatus').textContent='Failed: '+e.message}}async function streaks(){let ys=span($('sFrom').value,$('sTo').value),types=$('sType').value==='both'?[2,3]:[+$('sType').value],kind=$('sKind').value,min=Math.max(2,+$('sMin').value||5);$('streakStatus').textContent='Loading…';try{let req=[];for(let y of ys)for(let t of types)req.push(games(sport,y,t));let all=(await Promise.all(req)).flat().sort((a,b)=>a.date-b.date),tm=new Map();for(let g of all)for(let t of g.teams){let a=tm.get(t.id)||{name:t.name,logo:t.logo,g:[]};a.g.push({...t,date:g.date,season:g.season,type:g.type});tm.set(t.id,a)}let out=[];for(let [id,t] of tm){let run=null;for(let g of t.g){if(g.res==='T'){if(run&&run.len>=min)out.push({...run,id,name:t.name,logo:t.logo});run=null;continue}if(run&&run.kind===g.res){run.len++;run.end=g.date;run.endSeason=g.season;run.lastOpp=g.opp}else{if(run&&run.len>=min)out.push({...run,id,name:t.name,logo:t.logo});run={kind:g.res,len:1,start:g.date,end:g.date,startSeason:g.season,endSeason:g.season,firstOpp:g.opp,lastOpp:g.opp}}}if(run&&run.len>=min)out.push({...run,id,name:t.name,logo:t.logo})}out=out.filter(x=>kind==='both'||x.kind===kind).sort((a,b)=>b.len-a.len);$('streakOut').innerHTML=`<table><thead><tr><th>Team</th><th>Type</th><th>Games</th><th>Start</th><th>End</th><th>Cross-season</th><th>First Opp</th><th>Last Opp</th></tr></thead><tbody>${out.map(x=>`<tr><td><div class="team" data-team="${x.id}"><img src="${x.logo}"><b>${x.name}</b></div></td><td class="${x.kind==='W'?'good':'bad'}">${x.kind==='W'?'WIN':'LOSS'}</td><td><b>${x.len}</b></td><td>${x.start.toLocaleDateString()}</td><td>${x.end.toLocaleDateString()}</td><td>${x.startSeason!==x.endSeason?'YES':'—'}</td><td>${x.firstOpp}</td><td>${x.lastOpp}</td></tr>`).join('')}</tbody></table>`;bindTeams($('streakOut'));$('streakStatus').textContent=out.length+' streaks'}catch(e){$('streakStatus').textContent='Failed: '+e.message}}async function openProfile(id){$('modal').classList.add('open');$('modalHero').innerHTML='<h2>Loading team…</h2>';$('modalBody').innerHTML='';try{let y=+$('season').value,pack=await seasonData(sport,y),row=pack.find(r=>String(r.e.team.id)===String(id));if(!row){for(let yy=cur();yy>=Math.max(2002,cur()-10)&&!row;yy--){let p=await seasonData(sport,yy);row=p.find(r=>String(r.e.team.id)===String(id));if(row)y=yy}}if(!row)throw Error('Team profile unavailable');let t=row.e.team,m=sm(row.e),ranked=[...pack].sort(sortFn()),rank=ranked.findIndex(r=>String(r.e.team.id)===String(id))+1;$('modalHero').innerHTML=`<div class="hero"><img src="${t.logos?.[0]?.href||''}"><div><h2>${t.displayName}</h2><div class="muted">${sport} · ${lab(y)}${rank?` · League rank #${rank}`:''}</div></div></div>`;let wanted=cols().map(c=>[c[0],m[c[1]]??m[c[0]]??'—']);$('modalBody').innerHTML=`<div class="grid">${wanted.slice(0,8).map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><h3>Season details</h3><table class="profiletable"><tbody>${wanted.map(x=>`<tr><td>${x[0]}</td><td><b>${x[1]}</b></td></tr>`).join('')}</tbody></table><div class="card muted">Profile uses the selected/historical standings season available from ESPN. Click any team in Standings, League History, Playoffs or Streaks to open this profile.</div>`}catch(e){$('modalHero').innerHTML='<h2>Team Profile</h2>';$('modalBody').innerHTML='<div class="error">'+e.message+'</div>'}}$('closeModal').onclick=()=> $('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open')});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));for(let v of ['standings','history','playoffs','streaks'])$('view-'+v).classList.toggle('hidden',v!==b.dataset.view)});$('season').onchange=load;$('scope').onchange=render;$('filter').oninput=render;$('refresh').onclick=()=>{cache.delete('s'+sport+$('season').value);load()};$('historyBtn').onclick=history;$('playBtn').onclick=playoffs;$('streakBtn').onclick=streaks;sports();controls();load();</script></body></html>
