.mapbox{position:relative;height:520px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#08111f}.leaflet-container{background:#08111f;font-family:inherit}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#101c2b;color:#f4f7fb}.leaflet-popup-content{margin:10px 12px}.teammarker{background:#f4b400;border:2px solid #08111f;border-radius:50%;box-shadow:0 2px 8px #0008}.routelegend{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;font-size:11px;color:var(--muted)}.travelrow{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #1d2b3d}.travelrow img{width:25px;height:25px;object-fit:contain}.sortable{cursor:pointer;user-select:none}.sortable:hover{color:#fff}.sortmark{color:#f4b400;margin-left:3px}.statsbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.statsbar select,.statsbar input{background:#101c2b;border:1px solid var(--line);border-radius:9px;padding:8px 10px}.statsbar input{min-width:210px}.statRank{color:#ffd45c;font-weight:900;margin-right:5px}@media(max-width:650px){.statsbar{flex-wrap:nowrap;overflow-x:auto;margin:0 -10px 10px;padding:0 10px 5px}.statsbar>*{flex:0 0 auto}.statsbar input{min-width:170px}}

<body>
<main class="shell">
  <div class="topbar">
    <div class="titleline">
      <div class="brand"><div class="ball">🏈</div><div><h1>NCAA Football Hub</h1><div class="sub">FBS games · box scores · stats · weekly leaders · ESPN data</div></div></div>
      <div class="spacer"></div><a class="btn" href="./index.html" style="text-decoration:none">Sports Home</a>
    </div>
    <div class="controls">
      <label>Season <select id="season"></select></label>
      <label>Type <select id="seasonType"><option value="2">Regular Season</option><option value="3">Postseason</option></select></label>
      <label>Week <select id="week"></select></label>
      <label>Conference <select id="conference"><option value="">All FBS</option></select></label>
      <input id="search" placeholder="Search team / game">
      <button class="btn primary" id="refresh">Refresh</button>
    </div>
    <div class="progress"><i id="progress"></i></div>
  </div>

  <nav class="tabs"><button data-view="games" class="active">Games</button><button data-view="standings">Conference Standings</button><button data-view="map">Conference Map + Travel</button><button data-view="teamstats">Team Stats</button><button data-view="leaders">Weekly Leaders</button></nav>
  <div class="uxbar" id="uxbar">
    <div class="weeknav"><button id="prevWeek" title="Previous week">‹</button><button id="nextWeek" title="Next week">›</button></div>
    <button class="chip" data-qf="live">Live</button>
    <button class="chip" data-qf="close">Close</button>
    <button class="chip" data-qf="redzone">Red Zone</button>
    <button class="chip" data-qf="ranked">Ranked</button><button class="chip" data-qf="top25">Top 25</button>
    <button class="chip" data-qf="favorites">★ Favorites</button>
    <select id="sortGames" title="Sort games"><option value="time">Sort: Kickoff</option><option value="close">Sort: Closest</option><option value="ranked">Sort: Ranked</option></select>
    <button class="chip" id="density">Compact</button>
    <button class="chip" id="autoRefresh">Auto Refresh</button>
    <button class="chip" id="resetFilters">Reset</button>
  </div>
  <section id="metrics" class="metrics"></section>
  <div id="status" class="status"></div>
  <section id="content"></section>
</main>

<div id="modal" class="modal"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle">Game</h2><button id="closeModal" class="close">Close</button></div><div id="modalBody" class="dialogbody"></div></div></div>
<div id="entityModal" class="modal" style="z-index:120"><div class="dialog" style="width:min(900px,100%)"><div class="dialoghead"><h2 id="entityTitle">Profile</h2><button id="closeEntity" class="close">Close</button></div><div id="entityBody" class="dialogbody"></div></div></div>

<script>
'use strict';
const BASE='https://site.api.espn.com/apis/site/v2/sports/football/college-football';
const V2='https://site.api.espn.com/apis/v2/sports/football/college-football';
const CORE='https://sports.core.api.espn.com/v2/sports/football/leagues/college-football';
const FBS_GROUP=80;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={view:'games',games:[],filtered:[],summaryCache:new Map(),weeklyRows:[],leaderMetric:'passYds',loadToken:0,playerCache:new Map(),teamCache:new Map(),playerContext:new Map(),teamContext:new Map(),quickFilter:'',sort:'time',favorites:new Set(JSON.parse(localStorage.getItem('ncaafFavTeams')||'[]')),compact:localStorage.getItem('ncaafCompact')==='1',autoRefresh:false,autoTimer:null,standingsCache:new Map(),top25:new Set(),mapTeams:new Map(),teamStatSort:{key:'',dir:-1},teamStatsRows:[],teamStatsLoading:false,teamStatsSort:{key:'pointsFor',dir:-1},teamStatsScope:'all'};
const confIds={ACC:'1','American':'151','Big 12':'4','Big Ten':'5','Conference USA':'12','MAC':'15','Mountain West':'17','Pac-12':'9','SEC':'8','Sun Belt':'37','Independents':'18'};
const confTeamSets=new Map();
const leaderDefs={
  passYds:{label:'Passing Yards',cat:['passing'],stat:['YDS']},
  passTD:{label:'Passing TD',cat:['passing'],stat:['TD']},
  rushYds:{label:'Rushing Yards',cat:['rushing'],stat:['YDS']},
  rushTD:{label:'Rushing TD',cat:['rushing'],stat:['TD']},
  recYds:{label:'Receiving Yards',cat:['receiving'],stat:['YDS']},
  recTD:{label:'Receiving TD',cat:['receiving'],stat:['TD']},
  receptions:{label:'Receptions',cat:['receiving'],stat:['REC']},
  tackles:{label:'Tackles',cat:['defensive','defense'],stat:['TOT','TOTAL']},
  sacks:{label:'Sacks',cat:['defensive','defense'],stat:['SACKS','SACK']},
  interceptions:{label:'Interceptions',cat:['interceptions','defensive','defense'],stat:['INT']}
};
function currentSeason(){const d=new Date();return d.getMonth()<6?d.getFullYear()-1:d.getFullYear()}
function init(){
  const now=currentSeason(),savedSeason=localStorage.getItem('ncaafSeason')||String(now);
  $('season').innerHTML=Array.from({length:27},(_,i)=>now-i).map(y=>'<option '+(String(y)===savedSeason?'selected':'')+'>'+y+'</option>').join('');
  $('week').innerHTML=Array.from({length:18},(_,i)=>'<option value="'+(i+1)+'">Week '+(i+1)+'</option>').join('');
  $('week').value=localStorage.getItem('ncaafWeek')||guessWeek();
  $('conference').innerHTML='<option value="">All FBS</option>'+Object.entries(confIds).map(([n,id])=>'<option value="'+id+'">'+esc(n)+'</option>').join('');
  document.body.classList.toggle('compact',state.compact);$('density').classList.toggle('active',state.compact);bind();Promise.all([loadConferenceTeams(),loadTop25()]).finally(()=>loadGames());
}
function guessWeek(){const d=new Date(),y=d.getFullYear(),start=new Date(y,7,22);return String(Math.max(1,Math.min(18,Math.floor((d-start)/604800000)+1)))}
function bind(){
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render();if(state.view==='leaders'&&!state.weeklyRows.length)loadWeeklyLeaders();if(state.view==='standings')loadStandings();if(state.view==='map')loadConferenceMap();if(state.view==='teamstats')loadTeamStats()});
  $('season').onchange=async()=>{localStorage.setItem('ncaafSeason',$('season').value);state.weeklyRows=[];await Promise.all([loadConferenceTeams(),loadTop25()]);loadGames()};
  $('seasonType').onchange=()=>{state.weeklyRows=[];loadGames()};
  $('week').onchange=()=>{localStorage.setItem('ncaafWeek',$('week').value);state.weeklyRows=[];loadGames()};
  $('conference').onchange=()=>{applyFilters();if(state.view==='standings')loadStandings();if(state.view==='map')loadConferenceMap();if(state.view==='teamstats')loadTeamStats(true)};$('search').oninput=applyFilters;$('refresh').onclick=()=>{state.summaryCache.clear();state.weeklyRows=[];loadGames(true)};
  $('closeModal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
  $('closeEntity').onclick=()=>$('entityModal').classList.remove('open');$('entityModal').onclick=e=>{if(e.target===$('entityModal'))$('entityModal').classList.remove('open')};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('entityModal').classList.contains('open'))$('entityModal').classList.remove('open');else $('modal').classList.remove('open')}});
  document.body.addEventListener('click',e=>{
    const fav=e.target.closest('[data-fav]');if(fav){e.preventDefault();e.stopPropagation();toggleFavorite(fav.dataset.fav);return}
    const entity=e.target.closest('[data-player],[data-team]');if(!entity)return;e.preventDefault();e.stopPropagation();if(entity.dataset.player)openPlayer(entity.dataset.player);else if(entity.dataset.team)openTeam(entity.dataset.team)
  });
  document.querySelectorAll('[data-qf]').forEach(b=>b.onclick=()=>{state.quickFilter=state.quickFilter===b.dataset.qf?'':b.dataset.qf;syncQuickFilterButtons();applyFilters()});
  $('sortGames').onchange=()=>{state.sort=$('sortGames').value;render()};
  $('density').onclick=()=>{state.compact=!state.compact;localStorage.setItem('ncaafCompact',state.compact?'1':'0');document.body.classList.toggle('compact',state.compact);$('density').classList.toggle('active',state.compact)};
  $('prevWeek').onclick=()=>changeWeek(-1);$('nextWeek').onclick=()=>changeWeek(1);
  $('resetFilters').onclick=resetFilters;
  $('autoRefresh').onclick=toggleAutoRefresh;
  document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='/'){e.preventDefault();$('search').focus()}else if(e.key==='ArrowLeft')changeWeek(-1);else if(e.key==='ArrowRight')changeWeek(1)});
}
async function api(url,force=false){const key='ncaaf:'+url;try{if(!force){const c=JSON.parse(sessionStorage.getItem(key)||'null');if(c&&Date.now()-c.t<300000)return c.v}}catch{}const r=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw Error('ESPN HTTP '+r.status);const j=await r.json();try{sessionStorage.setItem(key,JSON.stringify({t:Date.now(),v:j}))}catch{}return j}
async function loadTop25(){
  try{
    const j=await api(BASE+'/rankings?dates='+encodeURIComponent($('season').value));
    const poll=(j.rankings||[]).find(x=>/ap/i.test(x.name||x.shortName||''))||(j.rankings||[])[0];
    state.top25=new Set((poll?.ranks||[]).filter(x=>Number(x.current)<=25).map(x=>String(x.team?.id)).filter(Boolean))
  }catch{state.top25=new Set()}
}
async function loadConferenceTeams(){
  const season=$('season').value;
  await Promise.all(Object.entries(confIds).map(async([name,id])=>{
    let teams=[];
    try{
      const j=await api('https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/teams?groups='+encodeURIComponent(id)+'&groupType=conference&enable=groups&limit=200&season='+encodeURIComponent(season));
      teams=j.sports?.[0]?.leagues?.[0]?.teams||j.teams||[];
    }catch{}
    if(!teams.length){
      try{
        const j=await api(BASE+'/teams?limit=700');
        const all=j.sports?.[0]?.leagues?.[0]?.teams||j.teams||[];
        teams=all.filter(x=>String((x.team||x).conferenceId||'')===String(id))
      }catch{}
    }
    const ids=teams.map(x=>String((x.team||x).id)).filter(Boolean);
    confTeamSets.set(String(id),new Set(ids))
  }))
}
function scoreboardUrl(){return BASE+'/scoreboard?groups='+FBS_GROUP+'&limit=200&dates='+$('season').value+'&seasontype='+$('seasonType').value+'&week='+$('week').value}
async function loadWeekByDates(force=false){
  const season=$('season').value,week=$('week').value,type=$('seasonType').value;
  let cal=null;
  try{cal=await api(BASE+'/calendar?dates='+encodeURIComponent(season)+'&seasontype='+encodeURIComponent(type),force)}catch{}
  let start,end;
  const items=Array.isArray(cal)?cal:(cal?.calendar||cal?.leagues?.[0]?.calendar||[]);
  const match=items.find(x=>Number(x.value||x.week?.number||x.number)===Number(week));
  if(match){start=new Date(match.startDate||match.start);end=new Date(match.endDate||match.end)}
  if(!start||isNaN(start)){const base=new Date(Number(season),7,20);start=new Date(base.getTime()+(Number(week)-1)*7*86400000);end=new Date(start.getTime()+8*86400000)}
  if(!end||isNaN(end))end=new Date(start.getTime()+8*86400000);
  start=new Date(start.getTime()-86400000);end=new Date(end.getTime()+86400000);
  const days=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))days.push(new Date(d));
  const queue=[...days],events=[];
  const worker=async()=>{while(queue.length){const d=queue.shift(),ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');try{const j=await api(BASE+'/scoreboard?groups='+FBS_GROUP+'&limit=200&dates='+ds,force);events.push(...(j.events||[]))}catch{}}};
  await Promise.all(Array.from({length:Math.min(6,queue.length)},worker));
  return events
}
async function loadGames(force=false){
  const token=++state.loadToken;$('status').textContent='Loading complete FBS week from ESPN…';$('progress').style.width='18%';showSkeletons();
  try{
    const [weekly,dateEvents]=await Promise.all([api(scoreboardUrl(),force),loadWeekByDates(force)]);
    if(token!==state.loadToken)return;
    let events=dedupeEvents([...(weekly.events||[]),...dateEvents]);
    $('progress').style.width='65%';
    const missing=await supplementWeekEvents(events,force);
    if(token!==state.loadToken)return;
    events=dedupeEvents([...events,...missing]);
    state.games=events.map(normalizeGame).filter(Boolean).sort((a,b)=>a.date-b.date);
    $('progress').style.width='100%';setTimeout(()=>$('progress').style.width='0',350);applyFilters();
    $('status').textContent='ESPN · '+state.games.length+' FBS games loaded for '+$('season').value+' Week '+$('week').value+' · complete week scan.';
    if(state.view==='leaders')loadWeeklyLeaders();if(state.view==='standings')loadStandings()
  }catch(e){$('progress').style.width='0';$('status').innerHTML='<span class="error">Could not load ESPN scoreboard: '+esc(e.message)+'</span>';$('content').innerHTML='<div class="empty">No games available.</div>'}
}
function dedupeEvents(events){const m=new Map();for(const e of events){if(e?.id)m.set(String(e.id),e)}return [...m.values()]}
async function supplementWeekEvents(existing,force=false){
  const season=$('season').value,week=Number($('week').value),type=Number($('seasonType').value);
  const existingIds=new Set(existing.map(e=>String(e.id)));
  const allTeamIds=new Set([...confTeamSets.values()].flatMap(s=>[...s]));
  const queue=[...allTeamIds],found=[];
  const worker=async()=>{while(queue.length){const id=queue.shift();try{
    const j=await api(BASE+'/teams/'+encodeURIComponent(id)+'/schedule?season='+encodeURIComponent(season),force);
    for(const e of j.events||[]){
      const wk=Number(e.week?.number||e.week||e.competitions?.[0]?.week?.number||0);
      const st=Number(e.season?.type||e.seasonType||e.competitions?.[0]?.season?.type||2);
      if(wk===week&&st===type&&!existingIds.has(String(e.id))){existingIds.add(String(e.id));found.push(e)}
    }
  }catch{}}};
  await Promise.all(Array.from({length:Math.min(12,queue.length)},worker));
  return found
}
function normalizeGame(e){
  const c=e.competitions?.[0],comps=c?.competitors;if(!c||!comps?.length)return null;const home=comps.find(x=>x.homeAway==='home')||comps[0],away=comps.find(x=>x.homeAway==='away')||comps[1];
  const team=x=>({id:x.team?.id,name:x.team?.displayName||x.team?.name,short:x.team?.shortDisplayName||x.team?.name,abbr:x.team?.abbreviation,logo:x.team?.logo,score:Number(x.score||0),winner:!!x.winner,rank:x.curatedRank?.current<99?x.curatedRank.current:null,records:(x.records||[]).find(r=>r.type==='total')?.summary||'',conferenceId:String(x.team?.conferenceId||'')});
  const sit=c.situation||{},period=Number(e.status?.period||c.status?.period||0),clock=e.status?.displayClock||c.status?.displayClock||'',possessionId=String(sit.possession||sit.possessionId||'');
  return{id:e.id,name:e.name,date:new Date(e.date),status:e.status?.type?.state||'',statusDetail:e.status?.type?.shortDetail||e.status?.type?.detail||'',completed:!!e.status?.type?.completed,home:team(home),away:team(away),venue:c.venue?.fullName||'',city:[c.venue?.address?.city,c.venue?.address?.state].filter(Boolean).join(', '),broadcast:(c.broadcasts||[]).flatMap(x=>x.names||[]).join(', '),neutral:!!c.neutralSite,situation:sit,period,clock,possessionId,isRedZone:!!sit.isRedZone};
}
function applyFilters(){
  const q=$('search').value.trim().toLowerCase(),cid=$('conference').value;
  state.filtered=state.games.filter(g=>{
    if(q&&![g.name,g.home.name,g.away.name,g.home.abbr,g.away.abbr].join(' ').toLowerCase().includes(q))return false;
    if(cid){const members=confTeamSets.get(String(cid));const membershipMatch=members?.size&&(members.has(String(g.home.id))||members.has(String(g.away.id)));const embeddedMatch=g.home.conferenceId===cid||g.away.conferenceId===cid;if(!membershipMatch&&!embeddedMatch)return false;}
    if(state.quickFilter==='live'&&g.status!=='in')return false;
    if(state.quickFilter==='close'&&!(g.status==='in'&&Math.abs(g.home.score-g.away.score)<=8))return false;
    if(state.quickFilter==='redzone'&&!(g.status==='in'&&g.isRedZone))return false;
    if(state.quickFilter==='ranked'&&!(g.home.rank||g.away.rank))return false;
    if(state.quickFilter==='top25'&&!state.top25.has(String(g.home.id))&&!state.top25.has(String(g.away.id)))return false;
    if(state.quickFilter==='favorites'&&!state.favorites.has(String(g.home.id))&&!state.favorites.has(String(g.away.id)))return false;
    return true
  });
  render();
}
function metrics(){
  const a=state.filtered,live=a.filter(g=>g.status==='in').length,done=a.filter(g=>g.completed).length,up=a.length-done-live;
  const ranked=a.filter(g=>g.home.rank||g.away.rank).length;
  $('metrics').innerHTML=[['Games',a.length],['Live',live],['Final',done],['Upcoming',up],['Ranked Matchups',ranked]].map(([k,v])=>'<div class="metric"><b>'+v+'</b><span>'+k+'</span></div>').join('');
}
function render(){metrics();if(state.view==='games')renderGames();else if(state.view==='leaders')renderLeaders();else if(state.view==='standings')renderStandingsLoading();else if(state.view==='map')renderMapLoading();else renderTeamStats()
function logo(t){return t.logo?'<img src="'+esc(t.logo)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'<span></span>'}
function rankName(t){return (t.rank?'#'+t.rank+' ':'')+esc(t.short||t.name)}
function playerHead(a){const id=a?.id||a?.uid||'';return a?.headshot?.href||(id?'https://a.espncdn.com/i/headshots/college-football/players/full/'+encodeURIComponent(id)+'.png':'')}
function rememberTeam(t){if(t?.id)state.teamContext.set(String(t.id),t);return t}
function rememberPlayer(a,team){if(a?.id||a?.uid){state.playerContext.set(String(a.id||a.uid),{...a,_team:team||a._team})}return a}
function gameFlags(g){
  if(g.status!=='in')return '';
  const diff=Math.abs(g.home.score-g.away.score),flags=[];
  if(g.isRedZone)flags.push('<span class="flag redzone">🔴 RED ZONE</span>');
  if(diff<=3)flags.push('<span class="flag close">🔥 CLOSE</span>');
  else if(diff<=8)flags.push('<span class="flag close">⚡ ONE SCORE</span>');
  const sec=parseClockSeconds(g.clock);
  if((g.period===2||g.period===4)&&sec>=0&&sec<=120)flags.push('<span class="flag twomin">⏱ 2-MIN</span>');
  if(g.period>4)flags.push('<span class="flag ot">OT</span>');
  return flags.length?'<div class="gameflags">'+flags.join('')+'</div>':'';
}
function parseClockSeconds(clock){const m=String(clock||'').match(/(\d+):(\d+)/);return m?Number(m[1])*60+Number(m[2]):-1}
function gameCard(g){
  const cls=g.status==='in'?' live':'',status=g.status==='in'?'<span class="livepill">● '+esc(g.statusDetail)+'</span>':g.completed?'<span class="finalpill">FINAL</span>':esc(g.statusDetail);
  const row=t=>{rememberTeam(t);const hasPoss=g.status==='in'&&g.possessionId&&String(t.id)===String(g.possessionId),fav=state.favorites.has(String(t.id));return '<div class="team entityLink '+(t.winner?'winner':'')+(g.completed&&!t.winner?' loser':'')+'" data-team="'+esc(t.id)+'">'+logo(t)+'<div class="teamname"><strong>'+rankName(t)+(hasPoss?' <span class="poss" title="Possession"></span>':'')+'</strong><span>'+esc(t.records)+'</span></div><div style="display:flex;align-items:center;gap:4px"><button class="favbtn '+(fav?'on':'')+'" data-fav="'+esc(t.id)+'" title="'+(fav?'Remove favorite':'Favorite team')+'">★</button><div class="score">'+((g.status==='pre'&&!g.completed)?'–':t.score)+'</div></div></div>'};
  return '<article class="game'+cls+'" data-game="'+g.id+'"><div class="gamehead"><span>'+fmtDate(g.date)+'</span>'+status+'</div>'+row(g.away)+row(g.home)+gameFlags(g)+'<div class="gamefoot"><span>'+esc(g.broadcast||'')+'</span><span>'+esc(g.venue||'')+'</span></div></article>';
}
function sortedGames(){
  const a=[...state.filtered];
  if(state.sort==='close')a.sort((x,y)=>Math.abs(x.home.score-x.away.score)-Math.abs(y.home.score-y.away.score)||x.date-y.date);
  else if(state.sort==='ranked')a.sort((x,y)=>Math.min(x.home.rank||99,x.away.rank||99)-Math.min(y.home.rank||99,y.away.rank||99)||x.date-y.date);
  else a.sort((x,y)=>x.date-y.date);
  return a
}

  $('entityTitle').textContent=name;
  return '<div class="profileHero player">'+(head?'<img src="'+esc(head)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'<div></div>')+'<div><h2>'+esc(name)+'</h2><div class="sub">'+esc([pos,jersey?'#'+jersey:''].filter(Boolean).join(' · '))+'</div><div class="profileMeta">'+(team?.id?'<span class="pill entityLink" data-team="'+esc(team.id)+'">'+esc(team.displayName||team.shortDisplayName||team.name||team.abbreviation||'Team')+'</span>':'')+(year?'<span class="pill">'+esc(year)+'</span>':'')+'</div></div></div>'+
  '<div class="profileGrid">'+[['Position',pos],['Jersey',jersey?('#'+jersey):''],['Height',height],['Weight',weight],['Hometown',hometown],['Status',a.status?.name||a.status?.type||'']].map(([k,v])=>'<div class="profileCard"><span>'+k+'</span><b>'+esc(profileValue(v))+'</b></div>').join('')+'</div>'+
  (loading?'<div class="sub">Loading additional ESPN player data…</div>':'')
}
async function openTeam(id){
  if(!id)return;const base=state.teamContext.get(String(id))||findTeamContext(id)||{};
  $('entityModal').classList.add('open');$('entityTitle').textContent=base.displayName||base.name||base.short||'Team Profile';$('entityBody').innerHTML=renderTeamProfile(base,null,true);
  try{
    let data=state.teamCache.get(String(id));
    if(!data){const season=$('season').value;const [profile,roster]=await Promise.all([
      firstJson([BASE+'/teams/'+encodeURIComponent(id)]).catch(()=>null),
      firstJson([BASE+'/teams/'+encodeURIComponent(id)+'/roster?season='+encodeURIComponent(season)]).catch(()=>null)
    ]);data={profile,roster};state.teamCache.set(String(id),data)}
    $('entityBody').innerHTML=renderTeamProfile(base,data,false);wireTeamRosterContext(data?.roster,base)
  }catch(e){$('entityBody').innerHTML=renderTeamProfile(base,null,false)+'<div class="sub" style="margin-top:10px">Additional ESPN team details were not available.</div>'}
}
function findTeamContext(id){for(const g of state.games){if(String(g.home.id)===String(id))return g.home;if(String(g.away.id)===String(id))return g.away}return null}
function renderTeamProfile(base,data,loading){
  const p=data?.profile?.team||data?.profile||base||{},logoUrl=p.logos?.[0]?.href||p.logo||base.logo||'',name=p.displayName||p.name||base.name||base.short||'Team',abbr=p.abbreviation||base.abbr||'',record=base.records||p.record?.items?.[0]?.summary||'',location=p.location||'',nickname=p.nickname||'',color=p.color?'#'+String(p.color).replace('#',''):'',roster=data?.roster?.athletes||[];
  $('entityTitle').textContent=name;
  let games=state.games.filter(g=>String(g.home.id)===String(base.id||p.id)||String(g.away.id)===String(base.id||p.id));
  return '<div class="profileHero">'+(logoUrl?'<img src="'+esc(logoUrl)+'" alt="">':'<div></div>')+'<div><h2>'+esc(name)+'</h2><div class="sub">'+esc([location,nickname,abbr].filter(Boolean).join(' · '))+'</div><div class="profileMeta">'+(record?'<span class="pill">'+esc(record)+'</span>':'')+(color?'<span class="pill">Team color '+esc(color)+'</span>':'')+'</div></div></div>'+
  '<div class="profileGrid">'+[['Record',record],['Abbreviation',abbr],['Conference',p.conference?.name||p.conferenceName||''],['Roster',roster.length?roster.length+' players':''],['Week',$('week').value],['Games this view',games.length]].map(([k,v])=>'<div class="profileCard"><span>'+k+'</span><b>'+esc(profileValue(v))+'</b></div>').join('')+'</div>'+
  (roster.length?'<div class="section"><h3>Roster</h3><div class="grid">'+roster.slice(0,80).map(x=>{const a=x.athlete||x,head=playerHead(a);rememberPlayer(a,p);return '<div class="metric entityLink" data-player="'+esc(a.id||a.uid||'')+'"><div class="ath">'+(head?'<img src="'+esc(head)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'')+'<div><b style="font-size:13px">'+esc(a.displayName||a.fullName||a.shortName||'Player')+'</b><div class="sub">'+esc([a.position?.abbreviation,a.jersey?'#'+a.jersey:''].filter(Boolean).join(' · '))+'</div></div></div></div>'}).join('')+'</div></div>':'')+
  (loading?'<div class="sub">Loading team profile and roster…</div>':'')
}
function wireTeamRosterContext(roster,base){for(const x of roster?.athletes||[]){const a=x.athlete||x;rememberPlayer(a,roster.team||base)}}
init();
</script>
