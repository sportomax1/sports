<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Depth Chart Lab</title>
<style>:root{color-scheme:dark;--bg:#07101b;--card:#0e1928;--card2:#132238;--line:#263a55;--muted:#91a4bd;--gold:#f4b400;--green:#3fb950;--red:#ff7b72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px system-ui,-apple-system,sans-serif}.shell{max-width:1350px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}h1{margin:0;font-size:34px}.muted{color:var(--muted)}.tabs,.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0}button,select,input{border:1px solid #345;background:var(--card2);color:#fff;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}button.active{background:var(--gold);color:#111;font-weight:900}.status{padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}.ok{color:#7ee787}.error{color:var(--red)}.hero{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}.hero img{width:64px;height:64px;object-fit:contain}.hero h2{margin:0 0 3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:10px}.group{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.group>h3{margin:0;padding:11px;background:var(--card2)}.position{padding:10px;border-top:1px solid var(--line)}.position-title{font-weight:900;color:#ffd45c;margin-bottom:6px}.player{display:grid;grid-template-columns:30px 42px 1fr auto;gap:8px;align-items:center;background:#091421;border-radius:8px;padding:6px;margin:5px 0}.player img{width:38px;height:38px;border-radius:50%;object-fit:cover}.rank{font-weight:900;text-align:center}.starter{color:#7ee787}.badge{font-size:10px;border:1px solid #40516a;border-radius:15px;padding:3px 6px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #345;border-radius:10px}.debug{font-size:11px;word-break:break-all;margin:8px 0;color:#7890ad}details{margin:10px 0;background:#0b1522;border:1px solid var(--line);border-radius:10px;padding:9px}summary{cursor:pointer;font-weight:800}</style></head>
<body><main class="shell"><div class="top"><div><h1>Depth Chart Lab</h1><div class="muted">ESPN depth charts with automatic host failover and roster fallback.</div></div><button id="clear">Reset saved settings</button></div>
<div id="sports" class="tabs"></div><div class="controls"><label>Team <select id="team"><option>Loading…</option></select></label><input id="filter" placeholder="Filter player / position"><button id="reload">Reload</button></div>
<div id="status" class="status muted">Starting…</div><div id="hero"></div><details><summary>API diagnostics</summary><div id="debug" class="debug"></div></details><div id="out"></div></main>
<script>
'use strict';
const CFG={NFL:{sport:'football',league:'nfl'},NBA:{sport:'basketball',league:'nba'},MLB:{sport:'baseball',league:'mlb'},NHL:{sport:'hockey',league:'nhl'}};
const HOSTS=['https://site.web.api.espn.com','https://site.api.espn.com'];
const NFL=[['22','ARI','Arizona Cardinals'],['1','ATL','Atlanta Falcons'],['33','BAL','Baltimore Ravens'],['2','BUF','Buffalo Bills'],['29','CAR','Carolina Panthers'],['3','CHI','Chicago Bears'],['4','CIN','Cincinnati Bengals'],['5','CLE','Cleveland Browns'],['6','DAL','Dallas Cowboys'],['7','DEN','Denver Broncos'],['8','DET','Detroit Lions'],['9','GB','Green Bay Packers'],['34','HOU','Houston Texans'],['11','IND','Indianapolis Colts'],['30','JAX','Jacksonville Jaguars'],['12','KC','Kansas City Chiefs'],['13','LV','Las Vegas Raiders'],['24','LAC','Los Angeles Chargers'],['14','LAR','Los Angeles Rams'],['15','MIA','Miami Dolphins'],['16','MIN','Minnesota Vikings'],['17','NE','New England Patriots'],['18','NO','New Orleans Saints'],['19','NYG','New York Giants'],['20','NYJ','New York Jets'],['21','PHI','Philadelphia Eagles'],['23','PIT','Pittsburgh Steelers'],['25','SF','San Francisco 49ers'],['26','SEA','Seattle Seahawks'],['27','TB','Tampa Bay Buccaneers'],['10','TEN','Tennessee Titans'],['28','WSH','Washington Commanders']].map(x=>({id:x[0],abbreviation:x[1],displayName:x[2],logos:[{href:`https://a.espncdn.com/i/teamlogos/nfl/500/${x[1].toLowerCase()}.png`}]}));
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sport=localStorage.getItem('depthSportV3')||'NFL',teams=[],model=null,lastAttempts=[];
function log(s){lastAttempts.push(s);$('debug').innerHTML=lastAttempts.map(esc).join('<br>')}
async function fetchJSON(url){log('GET '+url);let r;try{r=await fetch(url,{cache:'no-store',credentials:'omit'})}catch(e){log('FETCH ERROR: '+e.message);throw e}log('HTTP '+r.status);if(!r.ok)throw Error('HTTP '+r.status);const text=await r.text();try{return JSON.parse(text)}catch(e){throw Error('Invalid JSON response')}}
async function espnPath(path){let errors=[];for(const host of HOSTS){const url=host+path;try{return{json:await fetchJSON(url),url}}catch(e){errors.push(host+': '+e.message)}}throw Error(errors.join(' | '))}
function extractTeams(j){const src=j?.sports?.[0]?.leagues?.[0]?.teams||j?.teams||[];return src.map(x=>x?.team||x).filter(x=>x?.id)}
function parseDepth(j){let charts=[];if(Array.isArray(j?.depthCharts))charts=j.depthCharts;else if(Array.isArray(j?.items))charts=j.items;else if(j?.positions)charts=[j];const groups=[];for(const ch of charts){const raw=ch?.positions||{};const posList=Array.isArray(raw)?raw:Object.values(raw);const positions=[];for(const p of posList){let items=p?.athletes||p?.items||[];if(!Array.isArray(items))items=Object.values(items||{});items=items.filter(Boolean);if(items.length)positions.push({name:p?.position?.name||p?.name||p?.position?.abbreviation||'Position',abbr:p?.position?.abbreviation||p?.abbreviation||'',items})}if(positions.length)groups.push({name:ch?.name||ch?.displayName||'Depth Chart',positions})}return groups}
function parseRoster(j){const src=Array.isArray(j?.athletes)?j.athletes:Array.isArray(j?.items)?j.items:[];const map=new Map();for(const g of src){if(Array.isArray(g?.items)){const name=typeof g.position==='string'?g.position:(g?.position?.name||g?.name||g?.abbreviation||'Roster');for(const a of g.items){if(!map.has(name))map.set(name,[]);map.get(name).push(a)}}else{const name=g?.position?.abbreviation||g?.position?.name||'Roster';if(!map.has(name))map.set(name,[]);map.get(name).push(g)}}return [...map].map(([name,items])=>({name,items}))}
function athlete(x){const a=x?.athlete||x?.player||x||{};return{id:a.id||'',name:a.displayName||a.fullName||a.shortName||'Unknown',jersey:a.jersey||'',pos:a.position?.abbreviation||a.position?.name||'',head:a.headshot?.href||a.headshot||'',rank:Number(x?.rank??x?.pos_rank??a?.rank??0)}}
function playerHTML(x,i,isDepth){const a=athlete(x),rank=isDepth?(a.rank||i+1):0;const head=a.head||(a.id?`https://a.espncdn.com/i/headshots/${CFG[sport].league}/players/full/${a.id}.png`:'');return `<div class="player"><div class="rank ${rank===1?'starter':''}">${isDepth?rank:'•'}</div><img src="${esc(head)}" alt="" onerror="this.style.opacity=.12"><div><b>${esc(a.name)}</b><div class="muted">${a.jersey?'#'+esc(a.jersey)+' · ':''}${esc(a.pos)}</div></div><span class="badge">${isDepth?(rank===1?'Starter':'Depth '+rank):'Roster'}</span></div>`}
function render(){if(!model)return;const q=$('filter').value.trim().toLowerCase();if(model.kind==='depth'){const gs=model.groups.map(g=>({...g,positions:g.positions.map(p=>({...p,items:p.items.filter(x=>!q||p.name.toLowerCase().includes(q)||p.abbr.toLowerCase().includes(q)||athlete(x).name.toLowerCase().includes(q))})).filter(p=>p.items.length)})).filter(g=>g.positions.length);$('out').innerHTML=gs.length?`<div class="grid">${gs.map(g=>`<section class="group"><h3>${esc(g.name)}</h3>${g.positions.map(p=>`<div class="position"><div class="position-title">${esc(p.abbr||p.name)} · ${esc(p.name)}</div>${[...p.items].sort((a,b)=>(athlete(a).rank||99)-(athlete(b).rank||99)).map((x,i)=>playerHTML(x,i,true)).join('')}</div>`).join('')}</section>`).join('')}</div>`:'<div class="empty">No matching players.</div>'}else{const gs=model.groups.map(g=>({...g,items:g.items.filter(x=>!q||g.name.toLowerCase().includes(q)||athlete(x).name.toLowerCase().includes(q))})).filter(g=>g.items.length);$('out').innerHTML=gs.length?`<div class="grid">${gs.map(g=>`<section class="group"><h3>${esc(g.name)}</h3><div class="position">${g.items.map((x,i)=>playerHTML(x,i,false)).join('')}</div></section>`).join('')}</div>`:'<div class="empty">No matching players.</div>'}}
function renderTabs(){$('sports').innerHTML=Object.keys(CFG).map(s=>`<button data-s="${s}" class="${s===sport?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.setItem('depthSportV3',sport);renderTabs();loadTeams()})}
function installTeams(list){teams=[...list].sort((a,b)=>(a.displayName||a.name||'').localeCompare(b.displayName||b.name||''));$('team').innerHTML=teams.map(t=>`<option value="${esc(t.id)}">${esc(t.displayName||t.name||t.abbreviation||t.id)}</option>`).join('');const saved=localStorage.getItem('depthTeamV3:'+sport);if(saved&&teams.some(t=>String(t.id)===saved))$('team').value=saved;loadTeam()}
async function loadTeams(){lastAttempts=[];model=null;$('debug').innerHTML='';$('out').innerHTML='';$('hero').innerHTML='';$('status').textContent='Loading '+sport+' teams…';if(sport==='NFL'){log('Using built-in verified ESPN NFL team IDs.');installTeams(NFL);return}const c=CFG[sport];try{const r=await espnPath(`/apis/site/v2/sports/${c.sport}/${c.league}/teams?limit=100`),list=extractTeams(r.json);if(!list.length)throw Error('No teams in response');log('Team source succeeded: '+r.url);installTeams(list)}catch(e){$('team').innerHTML='<option>Unavailable</option>';$('status').innerHTML=`<span class="error">Could not load ${sport} teams.</span> Open API diagnostics for exact attempts.`}}
async function loadTeam(){const id=$('team').value;if(!id||id==='Unavailable')return;lastAttempts=[];$('debug').innerHTML='';model=null;$('out').innerHTML='';const c=CFG[sport],t=teams.find(x=>String(x.id)===String(id));localStorage.setItem('depthTeamV3:'+sport,String(id));$('hero').innerHTML=`<div class="hero"><img src="${esc(t?.logos?.[0]?.href||'')}" alt=""><div><h2>${esc(t?.displayName||t?.name||'Team')}</h2><div class="muted">${sport} · ESPN ID ${esc(id)}</div></div></div>`;$('status').textContent='Checking ESPN depth chart…';
try{const r=await espnPath(`/apis/site/v2/sports/${c.sport}/${c.league}/teams/${id}/depthcharts`),groups=parseDepth(r.json);if(groups.length){model={kind:'depth',groups};$('status').innerHTML=`<span class="ok">True ESPN depth chart loaded.</span> ${esc(groups.length)} chart group(s).`;log('DEPTH SUCCESS: '+r.url);render();return}log('Depth response had no usable positions.')}catch(e){log('Depth endpoint failed: '+e.message)}
if(sport==='NFL'){const years=[new Date().getFullYear(),new Date().getFullYear()-1];for(const y of years){const url=`https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/${y}/teams/${id}/depthcharts?limit=100`;try{const j=await fetchJSON(url),groups=parseDepth(j);if(groups.length){model={kind:'depth',groups};$('status').innerHTML=`<span class="ok">ESPN Core depth chart loaded (${y}).</span>`;log('CORE DEPTH SUCCESS: '+url);render();return}}catch(e){log('Core '+y+' failed: '+e.message)}}}
$('status').textContent='No usable depth chart; trying ESPN roster fallback…';try{const r=await espnPath(`/apis/site/v2/sports/${c.sport}/${c.league}/teams/${id}/roster`),groups=parseRoster(r.json);if(!groups.length)throw Error('Roster had no players');model={kind:'roster',groups};$('status').textContent='ESPN roster loaded. This is grouped by position, not true depth order.';log('ROSTER SUCCESS: '+r.url);render()}catch(e){$('status').innerHTML='<span class="error">ESPN requests failed from this browser.</span> Open API diagnostics below.';log('Roster endpoint failed: '+e.message)}}
$('team').onchange=loadTeam;$('reload').onclick=loadTeam;$('filter').oninput=render;$('clear').onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith('depth')).forEach(k=>localStorage.removeItem(k));location.reload()};renderTabs();loadTeams();
</script></body></html>
