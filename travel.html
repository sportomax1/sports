<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Travel Lab</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{color-scheme:dark;--bg:#07101c;--p:#0e1b2d;--p2:#13253b;--line:#263b55;--text:#f5f8fc;--muted:#91a5bd;--a:#59a8ff;--good:#39d98a;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101c,#091727);color:var(--text);font:14px/1.4 system-ui,sans-serif}.wrap{max-width:1550px;margin:auto;padding:18px}header{position:sticky;top:0;z-index:10;background:#07101cf2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}h1{margin:0;font-size:25px}.sub,.muted{color:var(--muted)}.top,.controls,.tabs{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.controls{margin-top:12px}button,select{background:var(--p);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 11px}button{cursor:pointer}button.active,button:hover{border-color:var(--a);background:#112d4c}.status{margin-top:9px;font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:16px 0}.stat,.panel{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:12px}.stat b{display:block;font-size:21px}.stat span{font-size:9px;text-transform:uppercase;color:var(--muted)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:1000px;background:var(--p)}th,td{padding:9px 10px;border-bottom:1px solid #1d3048;text-align:left}th{position:sticky;top:0;background:#11243a;color:#a9bad0;font-size:10px;text-transform:uppercase}tr:hover td{background:#10243c}.team{display:flex;align-items:center;gap:8px;font-weight:800}.logo{width:28px;height:28px;object-fit:contain}.rank{font-weight:900;color:var(--warn)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px}.game{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:11px}.game .route{font-size:17px;font-weight:900}.game .miles{color:var(--a);font-weight:900}.mapPanel{margin:14px 0;background:var(--p);border:1px solid var(--line);border-radius:13px;padding:12px}.mapHead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.mapBox{margin-top:10px;height:470px;border-radius:11px;overflow:hidden;border:1px solid #27415f;background:#091625}.leaflet-container{background:#091625}.nflIcon{background:transparent;border:0}.nflIcon img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 2px 3px #000)}.travelerIcon img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 0 8px #fff)}.mapControls{display:flex;gap:6px;align-items:center}.legList{display:flex;gap:6px;overflow:auto;margin-top:8px}.legChip{white-space:nowrap;font-size:10px;padding:5px 7px;background:#0b1728;border:1px solid var(--line);border-radius:8px}.heat td{text-align:center;font-weight:800}.heat .sticky{position:sticky;left:0;background:#0e1b2d;z-index:1;text-align:left}.heatbox{min-width:52px}.sectionTitle{margin:18px 0 8px}.analysisGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:10px}.metricPanel{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:12px}.metricPanel h3{margin:0 0 9px}.miniRow{display:grid;grid-template-columns:32px 1fr auto;gap:7px;align-items:center;padding:5px 0;border-bottom:1px solid #1d3048}.miniRow img{width:25px;height:25px;object-fit:contain}.weekControl{display:flex;gap:9px;align-items:center;margin:9px 0}.weekControl input{flex:1}.modal{display:none;position:fixed;inset:0;z-index:9999;background:#000b;padding:5vh 4vw}.modal.open{display:grid;place-items:center}.modalCard{width:min(1100px,96vw);height:min(720px,88vh);background:#07101c;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 70px #000}.modalHead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#0b1728}.modalLogs{height:auto!important;flex:1;font-size:11px!important}.console{margin-top:14px;background:#030914;border:1px solid var(--line);border-radius:12px;overflow:hidden}.console h3{font-size:10px;margin:0;padding:8px 10px;background:#0b1728}.logs{height:145px;overflow:auto;padding:8px 10px;font:10px/1.5 ui-monospace,monospace;color:#a9bad0}.ok{color:#75e6a5}.err{color:#ff8b8b}.api{color:#78b9ff}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div class="wrap"><div class="top"><div><h1>NFL Travel Lab</h1><div class="sub">Season travel mileage · road trips · time-zone changes · league comparison</div></div><div class="tabs"><button id="dashBtn" class="active">League Dashboard</button><button id="detailBtn">Team Detail</button><button id="flightBtn">League Flight Map</button><button id="weekBtn">Team × Week</button><button id="historyBtn">10-Year Grid</button><button id="analysisBtn">Travel Analysis</button></div></div>
<div class="controls"><select id="season"></select><select id="seasonType"><option value="2">Regular Season</option><option value="3">Postseason</option><option value="1">Preseason</option></select><select id="team"><option value="">All teams</option></select><button id="load">Load Season</button><button id="consoleBtn">Diagnostics</button></div><div id="status" class="status">Ready</div></div></header>
<main class="wrap"><section class="stats"><div class="stat"><b id="teams">—</b><span>Teams</span></div><div class="stat"><b id="games">—</b><span>Games</span></div><div class="stat"><b id="miles">—</b><span>League travel miles</span></div><div class="stat"><b id="avg">—</b><span>Avg / team</span></div><div class="stat"><b id="max">—</b><span>Most travel</span></div><div class="stat"><b id="tz">—</b><span>Time-zone changes</span></div></section><div id="content"></div>
<div id="consoleModal" class="modal"><div class="modalCard"><div class="modalHead"><div><b>Travel Lab Diagnostics</b><div class="muted">ESPN requests, calculations and load status</div></div><button id="consoleClose">✕ Close</button></div><div id="logs" class="logs modalLogs"></div></div></div></main>
<script>
const $=x=>document.getElementById(x), state={games:[],teams:new Map(),summary:[],view:'dash',playTimer:null,playIndex:0,history:new Map()};
const SCORE='https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
let dbp=null;function db(){return dbp||(dbp=new Promise((res,rej)=>{const q=indexedDB.open('nfl-travel-lab',1);q.onupgradeneeded=()=>q.result.createObjectStore('weeks');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))}
async function cacheGet(k){try{const d=await db();return await new Promise(r=>{const q=d.transaction('weeks').objectStore('weeks').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch{return null}}
async function cachePut(k,v){try{const d=await db();d.transaction('weeks','readwrite').objectStore('weeks').put({ts:Date.now(),data:v},k)}catch(e){log('IndexedDB write failed: '+e.message,'err')}}
const VENUES={
'ARI':[33.5276,-112.2626,-7],'ATL':[33.7554,-84.4008,-5],'BAL':[39.278,-76.6227,-5],'BUF':[42.7738,-78.7868,-5],'CAR':[35.2258,-80.8528,-5],'CHI':[41.8623,-87.6167,-6],'CIN':[39.0955,-84.5161,-5],'CLE':[41.5061,-81.6995,-5],'DAL':[32.7473,-97.0945,-6],'DEN':[39.7439,-105.0201,-7],'DET':[42.34,-83.0456,-5],'GB':[44.5013,-88.0622,-6],'HOU':[29.6847,-95.4107,-6],'IND':[39.7601,-86.1639,-5],'JAX':[30.3239,-81.6373,-5],'KC':[39.0489,-94.4839,-6],'LV':[36.0909,-115.1833,-8],'LAC':[33.9535,-118.3392,-8],'LAR':[33.9535,-118.3392,-8],'MIA':[25.958,-80.2389,-5],'MIN':[44.9736,-93.2575,-6],'NE':[42.0909,-71.2643,-5],'NO':[29.9511,-90.0812,-6],'NYG':[40.8135,-74.0745,-5],'NYJ':[40.8135,-74.0745,-5],'PHI':[39.9008,-75.1675,-5],'PIT':[40.4468,-80.0158,-5],'SEA':[47.5952,-122.3316,-8],'SF':[37.403,-121.97,-8],'TB':[27.9759,-82.5033,-5],'TEN':[36.1665,-86.7713,-6],'WSH':[38.9078,-76.8645,-5]
};
function log(s,c=''){let d=document.createElement('div');d.className=c;d.textContent='['+new Date().toLocaleTimeString()+'] '+s;$('logs').append(d);$('logs').scrollTop=$('logs').scrollHeight;console.log('[NFL Travel]',s)}
function hav(a,b){const R=3958.8,r=x=>x*Math.PI/180,dlat=r(b[0]-a[0]),dlon=r(b[1]-a[1]);const q=Math.sin(dlat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function teamLogo(abbr){return 'https://a.espncdn.com/i/teamlogos/nfl/500/'+abbr.toLowerCase()+'.png'}
async function fetchWeek(year,st,week){const u=SCORE+'?limit=1000&dates='+year+'&seasontype='+st+'&week='+week,k=year+'-'+st+'-'+week,cached=await cacheGet(k),historical=year<new Date().getFullYear();if(cached&&(historical||Date.now()-cached.ts<21600000)){log('CACHE HIT '+k+' · IndexedDB','ok');return cached.data}log('GET '+u,'api');const t=performance.now(),r=await fetch(u);log('HTTP '+r.status+' · '+Math.round(performance.now()-t)+'ms · week '+week,r.ok?'ok':'err');if(!r.ok)throw Error(r.status);const data=await r.json();await cachePut(k,data);return data}
function parseEvent(e,fallbackWeek){const comp=e.competitions?.[0];if(!comp)return null;const cs=comp.competitors||[],home=cs.find(x=>x.homeAway==='home'),away=cs.find(x=>x.homeAway==='away');if(!home||!away)return null;const addr=comp.venue?.address||{};return {id:e.id,date:e.date,week:e.week?.number||fallbackWeek,home:home.team.abbreviation,away:away.team.abbreviation,homeName:home.team.displayName,awayName:away.team.displayName,venue:comp.venue?.fullName||'',city:addr.city||'',country:addr.country||'',neutral:!!comp.neutralSite}}
async function load(){const y=+$('season').value,st=+$('seasonType').value;$('logs').innerHTML='';log('=== LOAD '+y+' · season type '+st+' ===');$('status').textContent='Loading ESPN schedule…';let all=[];const max=st===2?18:st===1?4:6;const results=await Promise.all(Array.from({length:max},(_,i)=>fetchWeek(y,st,i+1).catch(e=>{log('Week '+(i+1)+' failed: '+e.message,'err');return {events:[]}})));results.forEach((x,i)=>all.push(...(x.events||[]).map(e=>parseEvent(e,i+1)).filter(Boolean)));state.games=[...new Map(all.map(g=>[g.id,g])).values()].sort((a,b)=>new Date(a.date)-new Date(b.date));calculate();render();$('status').textContent='Loaded '+state.games.length+' games from ESPN · mileage uses stadium-to-stadium great-circle distance';log('=== COMPLETE · '+state.games.length+' unique games ===','ok')}
function calculate(){state.teams=new Map();state.games.forEach(g=>[g.home,g.away].forEach((a,i)=>{if(!state.teams.has(a))state.teams.set(a,{abbr:a,name:i?g.awayName:g.homeName,games:[],legs:[],miles:0,road:0,tz:0,longest:0});state.teams.get(a).games.push(g)}));for(const t of state.teams.values()){const home=VENUES[t.abbr];if(!home)continue;t.games.sort((a,b)=>new Date(a.date)-new Date(b.date));for(const g of t.games){if(g.away!==t.abbr)continue;const dest=VENUES[g.home];if(!dest)continue;const out=hav(home,dest),back=hav(dest,home);t.road++;t.miles+=out+back;t.longest=Math.max(t.longest,out,back);if(home[2]!==dest[2])t.tz+=2;t.legs.push({from:t.abbr,to:g.home,miles:out,week:g.week,type:'out',date:g.date,opponent:g.home,neutral:g.neutral,country:g.country,venue:g.venue});t.legs.push({from:g.home,to:t.abbr,miles:back,week:g.week,type:'home',date:g.date,opponent:g.home,neutral:g.neutral,country:g.country,venue:g.venue})}log(t.abbr+' → '+t.road+' road games · '+t.legs.length+' travel legs INCLUDING RETURN HOME · '+Math.round(t.miles)+' mi','ok')}state.summary=[...state.teams.values()].sort((a,b)=>b.miles-a.miles);state.summary.forEach((t,i)=>t.rank=i+1);buildTeam();stats()}
function stats(){const s=state.summary,total=s.reduce((x,t)=>x+t.miles,0),tz=s.reduce((x,t)=>x+t.tz,0);$('teams').textContent=s.length;$('games').textContent=state.games.length;$('miles').textContent=Math.round(total).toLocaleString();$('avg').textContent=s.length?Math.round(total/s.length).toLocaleString():'—';$('max').textContent=s[0]?s[0].abbr+' '+Math.round(s[0].miles).toLocaleString():'—';$('tz').textContent=tz}
function buildTeam(){const old=$('team').value;$('team').innerHTML='<option value="">All teams</option>'+[...state.teams.values()].sort((a,b)=>a.name.localeCompare(b.name)).map(t=>'<option value="'+t.abbr+'">'+t.name+'</option>').join('');$('team').value=old}
function dashboard(){return '<div class="muted" style="margin-bottom:7px">Click any column heading to sort.</div><div class="tablewrap"><table id="dashTable"><thead><tr><th data-sort="num">Rank ↕</th><th data-sort="text">Team ↕</th><th data-sort="num">Travel miles ↕</th><th data-sort="num">Road games ↕</th><th data-sort="num">Avg / road game ↕</th><th data-sort="num">Longest leg ↕</th><th data-sort="num">Time-zone changes ↕</th></tr></thead><tbody>'+state.summary.map(t=>'<tr><td class="rank">#'+t.rank+'</td><td><div class="team"><img class="logo" src="'+teamLogo(t.abbr)+'">'+t.name+'</div></td><td><b>'+Math.round(t.miles).toLocaleString()+'</b></td><td>'+t.road+'</td><td>'+Math.round(t.miles/Math.max(t.road,1)).toLocaleString()+'</td><td>'+Math.round(t.longest).toLocaleString()+'</td><td>'+t.tz+'</td></tr>').join('')+'</tbody></table></div>'}
let travelMap=null,routeLayer=null,travelMarker=null;
function iconFor(abbr,big=false){return L.divIcon({className:big?'travelerIcon':'nflIcon',html:'<img src="'+teamLogo(abbr)+'">',iconSize:[big?40:32,big?40:32],iconAnchor:[big?20:16,big?20:16]})}
function mapHTML(t){return '<div class="mapPanel"><div class="mapHead"><div><b>Interactive Season Travel Map</b><div class="muted">Real OpenStreetMap basemap · blue outbound · green return home · pan/zoom enabled</div></div><div class="mapControls"><button id="playMap">▶ Play travel</button><button id="resetMap">Reset</button></div></div><div id="mapBox" class="mapBox"></div><div class="legList">'+t.legs.map((l,i)=>'<span class="legChip">#'+(i+1)+' W'+(l.week||'?')+' '+l.from+' → '+l.to+' · '+Math.round(l.miles).toLocaleString()+' mi</span>').join('')+'</div></div>'}
function detail(abbr){const t=state.teams.get(abbr)||state.summary[0];if(!t)return '';let cum=0;const cards=t.legs.map((l,i)=>{cum+=l.miles;return '<div class="game"><div class="muted">Travel leg '+(i+1)+' · Week '+(l.week||'?')+'</div><div class="route">'+l.from+' → '+l.to+'</div><div class="miles">'+Math.round(l.miles).toLocaleString()+' mi</div><div class="muted">'+(l.type==='home'?'Return home':'Travel to road game')+' · cumulative '+Math.round(cum).toLocaleString()+'</div></div>'}).join('');return '<div class="panel"><div class="team"><img class="logo" src="'+teamLogo(t.abbr)+'"><h2>'+t.name+'</h2></div><div class="muted">#'+t.rank+' league travel · '+Math.round(t.miles).toLocaleString()+' estimated miles · '+t.road+' road games · '+t.tz+' time-zone crossings · RETURN HOME INCLUDED</div></div>'+mapHTML(t)+'<div class="cards">'+cards+'</div>'}
function initMap(t){if(!window.L)return log('Leaflet failed to load','err');if(travelMap){travelMap.remove();travelMap=null}travelMap=L.map('mapBox',{zoomControl:true});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(travelMap);routeLayer=L.layerGroup().addTo(travelMap);const used=new Set([t.abbr]);t.legs.forEach(l=>{used.add(l.from);used.add(l.to);const a=VENUES[l.from],b=VENUES[l.to];if(a&&b)L.polyline([[a[0],a[1]],[b[0],b[1]]],{color:l.type==='home'?'#39d98a':'#59a8ff',weight:3,opacity:.72}).bindTooltip('W'+(l.week||'?')+' '+l.from+' → '+l.to+' · '+Math.round(l.miles)+' mi').addTo(routeLayer)});[...used].forEach(a=>{const v=VENUES[a];if(v)L.marker([v[0],v[1]],{icon:iconFor(a)}).bindPopup('<b>'+a+'</b>').addTo(routeLayer)});const coords=[...used].map(a=>VENUES[a]).filter(Boolean).map(v=>[v[0],v[1]]);if(coords.length)travelMap.fitBounds(coords,{padding:[35,35],maxZoom:5});setTimeout(()=>travelMap.invalidateSize(),50)}
function animateMap(t){clearInterval(state.playTimer);state.playIndex=0;if(!travelMap||!t.legs.length)return;if(travelMarker)travelMap.removeLayer(travelMarker);const first=VENUES[t.legs[0].from];travelMarker=L.marker([first[0],first[1]],{icon:iconFor(t.abbr,true),zIndexOffset:1000}).addTo(travelMap);const move=()=>{if(state.playIndex>=t.legs.length){clearInterval(state.playTimer);return}const l=t.legs[state.playIndex++],b=VENUES[l.to];travelMarker.setLatLng([b[0],b[1]]);travelMap.panTo([b[0],b[1]],{animate:true,duration:1});log('PLAY '+state.playIndex+'/'+t.legs.length+' · '+l.from+' → '+l.to+' · '+Math.round(l.miles)+' mi','ok')};move();state.playTimer=setInterval(move,1500)}
function wireMap(){const t=state.teams.get($('team').value)||state.summary[0];setTimeout(()=>initMap(t),0);if($('playMap'))$('playMap').onclick=()=>animateMap(t);if($('resetMap'))$('resetMap').onclick=()=>{clearInterval(state.playTimer);initMap(t)}}

function leagueFlightHTML(){return '<div class="mapPanel"><div class="mapHead"><div><b>League Flight Map — ALL 32 TEAMS</b><div class="muted">Intentionally busy. Every road trip + return home. Use week slider to tame the chaos.</div></div></div><div class="weekControl"><span>Through week</span><input id="leagueWeek" type="range" min="1" max="18" value="18"><b id="leagueWeekVal">18</b></div><div id="mapBox" class="mapBox"></div></div>'}
function initLeagueMap(maxWeek=18){if(!window.L)return;if(travelMap){travelMap.remove();travelMap=null}travelMap=L.map('mapBox').setView([38,-96],4);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(travelMap);state.summary.forEach((t,ti)=>{const hue=(ti*137.5)%360,color='hsl('+hue+' 80% 60%)';t.legs.filter(l=>(l.week||99)<=maxWeek).forEach(l=>{const a=VENUES[l.from],b=VENUES[l.to];if(a&&b)L.polyline([[a[0],a[1]],[b[0],b[1]]],{color,weight:1.5,opacity:.38}).bindTooltip(t.abbr+' W'+l.week+' '+l.from+' → '+l.to).addTo(travelMap)});const h=VENUES[t.abbr];if(h)L.marker([h[0],h[1]],{icon:iconFor(t.abbr)}).bindTooltip(t.name).addTo(travelMap)});setTimeout(()=>travelMap.invalidateSize(),30)}
function heatColor(v,max){if(!v)return 'rgba(255,255,255,.015)';const x=Math.max(0,Math.min(1,v/max)),h=120*(1-x);return 'hsla('+h+',72%,36%,.72)'}
function weekGrid(){const weeks=Array.from({length:18},(_,i)=>i+1),max=Math.max(1,...state.summary.flatMap(t=>weeks.map(w=>t.legs.filter(l=>l.week===w).reduce((s,l)=>s+l.miles,0))));return '<h2>Team × Week Travel Grid</h2><div class="muted">Miles include outbound + return-home legs assigned to each road-game week.</div><div class="tablewrap"><table class="heat"><thead><tr><th class="sticky" data-sort="text">Team ↕</th>'+weeks.map(w=>'<th data-sort="num">W'+w+'</th>').join('')+'<th data-sort="num">Total ↕</th></tr></thead><tbody>'+state.summary.map(t=>'<tr><td class="sticky"><img class="logo" src="'+teamLogo(t.abbr)+'"> '+t.abbr+'</td>'+weeks.map(w=>{const n=t.legs.filter(l=>l.week===w).reduce((s,l)=>s+l.miles,0),alpha=n?(.15+.65*n/max):0;return '<td class="heatbox" style="background:'+heatColor(n,max)+'">'+(n?Math.round(n).toLocaleString():'·')+'</td>'}).join('')+'<td><b>'+Math.round(t.miles).toLocaleString()+'</b></td></tr>').join('')+'</tbody></table></div>'}
async function loadHistory(){const end=+$('season').value,years=Array.from({length:10},(_,i)=>end-9+i);$('content').innerHTML='<div class="panel">Loading 10 seasons × 18 weeks…</div>';state.history=new Map();for(const y of years){log('HISTORY '+y+' loading…','api');let all=[];const rs=await Promise.all(Array.from({length:18},(_,i)=>fetchWeek(y,2,i+1).catch(()=>({events:[]}))));rs.forEach((x,i)=>all.push(...(x.events||[]).map(e=>parseEvent(e,i+1)).filter(Boolean)));const games=[...new Map(all.map(g=>[g.id,g])).values()],m=new Map();games.forEach(g=>{const a=VENUES[g.away],h=VENUES[g.home];if(a&&h)m.set(g.away,(m.get(g.away)||0)+2*hav(a,h))});state.history.set(y,m);log('HISTORY '+y+' → '+games.length+' games','ok')}renderHistory()}
function renderHistory(){const years=[...state.history.keys()],teams=[...new Set(years.flatMap(y=>[...state.history.get(y).keys()]))].sort(),mx=Math.max(1,...years.flatMap(y=>[...state.history.get(y).values()]));$('content').innerHTML='<h2>10-Year Travel Grid</h2><div class="muted">Rows = teams · columns = seasons · cell = estimated round-trip road mileage. Historical franchise/stadium moves remain an approximation with the current venue dictionary.</div><div class="tablewrap"><table class="heat"><thead><tr><th class="sticky" data-sort="text">Team ↕</th>'+years.map(y=>'<th data-sort="num">'+y+'</th>').join('')+'</tr></thead><tbody>'+teams.map(t=>'<tr><td class="sticky"><img class="logo" src="'+teamLogo(t)+'"> '+t+'</td>'+years.map(y=>{const n=state.history.get(y).get(t)||0;return '<td style="background:'+heatColor(n,mx)+'">'+(n?Math.round(n).toLocaleString():'—')+'</td>'}).join('')+'</tr>').join('')+'</tbody></table></div>'}
function analysis(){const divs={AFC:{West:['DEN','KC','LV','LAC'],East:['BUF','MIA','NE','NYJ'],North:['BAL','CIN','CLE','PIT'],South:['HOU','IND','JAX','TEN']},NFC:{West:['ARI','LAR','SF','SEA'],East:['DAL','NYG','PHI','WSH'],North:['CHI','DET','GB','MIN'],South:['ATL','CAR','NO','TB']}};let division=[];Object.entries(divs).forEach(([conf,ds])=>Object.entries(ds).forEach(([d,as])=>{const ts=state.summary.filter(t=>as.includes(t.abbr)),n=ts.reduce((s,t)=>s+t.miles,0);division.push({name:conf+' '+d,n})}));division.sort((a,b)=>b.n-a.n);const opp=new Map();state.summary.forEach(t=>t.legs.filter(l=>l.type==='out').forEach(l=>opp.set(l.opponent,(opp.get(l.opponent)||0)+l.miles*2)));const opps=[...opp].sort((a,b)=>b[1]-a[1]);const b2b=state.summary.map(t=>{let count=0,saved=0;const aw=t.games.filter(g=>g.away===t.abbr).sort((a,b)=>new Date(a.date)-new Date(b.date));for(let i=1;i<aw.length;i++){if((aw[i].week||0)===(aw[i-1].week||0)+1){count++;const h=VENUES[t.abbr],a=VENUES[aw[i-1].home],b=VENUES[aw[i].home];if(h&&a&&b)saved+=Math.max(0,hav(a,h)+hav(h,b)-hav(a,b))}}return {t,count,saved}}).sort((a,b)=>b.count-a.count);const neutral=state.games.filter(g=>g.neutral||g.country&&g.country!=='USA'&&g.country!=='United States');const rest=state.summary.map(t=>{const gs=[...t.games].sort((a,b)=>new Date(a.date)-new Date(b.date));let short=0;for(let i=1;i<gs.length;i++){const days=(new Date(gs[i].date)-new Date(gs[i-1].date))/86400000;if(days<6&&gs[i].away===t.abbr)short++}return {t,short}}).sort((a,b)=>b.short-a.short);const rows=(arr,val)=>arr.slice(0,12).map(x=>'<div class="miniRow"><img src="'+teamLogo(x.t?.abbr||x[0]||'nfl')+'"><span>'+(x.t?.abbr||x[0])+'</span><b>'+val(x)+'</b></div>').join('');return '<h2>Travel Analysis</h2><div class="analysisGrid"><div class="metricPanel"><h3>Back-to-back road weeks</h3>'+rows(b2b,x=>x.count+' · '+Math.round(x.saved).toLocaleString()+' potential stay mi')+'</div><div class="metricPanel"><h3>Division travel totals</h3>'+division.map(x=>'<div class="miniRow"><span></span><span>'+x.name+'</span><b>'+Math.round(x.n).toLocaleString()+'</b></div>').join('')+'</div><div class="metricPanel"><h3>Opponent geography impact</h3>'+opps.slice(0,12).map(x=>'<div class="miniRow"><img src="'+teamLogo(x[0])+'"><span>'+x[0]+'</span><b>'+Math.round(x[1]).toLocaleString()+' mi</b></div>').join('')+'</div><div class="metricPanel"><h3>Neutral / international games</h3>'+(neutral.length?neutral.map(g=>'<div class="miniRow"><img src="'+teamLogo(g.away)+'"><span>'+g.away+' @ '+g.home+' · '+(g.venue||'venue')+'</span><b>W'+g.week+'</b></div>').join(''):'<div class="muted">None detected in loaded schedule.</div>')+'</div><div class="metricPanel"><h3>Short-rest + travel</h3>'+rows(rest,x=>x.short+' short-rest road game'+(x.short===1?'':'s'))+'</div></div>'}
function wireSort(){document.querySelectorAll('table th[data-sort]').forEach((th,idx)=>th.onclick=()=>{const tb=th.closest('table').tBodies[0],rows=[...tb.rows],asc=th.dataset.asc!=='1';th.dataset.asc=asc?'1':'0';rows.sort((a,b)=>{let x=a.cells[idx]?.innerText.trim()||'',y=b.cells[idx]?.innerText.trim()||'';if(th.dataset.sort==='num'){x=parseFloat(x.replace(/[^0-9.-]/g,''))||0;y=parseFloat(y.replace(/[^0-9.-]/g,''))||0;return asc?x-y:y-x}return asc?x.localeCompare(y):y.localeCompare(x)});rows.forEach(r=>tb.appendChild(r))})}
function setTab(id,view){state.view=view;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id===id));if(view!=='detail')$('team').value='';render()}
function render(){const pick=$('team').value;if(pick)state.view='detail';if(state.view==='dash')$('content').innerHTML=dashboard();else if(state.view==='detail'){$('content').innerHTML=detail(pick);wireMap()}else if(state.view==='flight'){$('content').innerHTML=leagueFlightHTML();setTimeout(()=>initLeagueMap(18),0);setTimeout(()=>{const r=$('leagueWeek');if(r)r.oninput=()=>{$('leagueWeekVal').textContent=r.value;initLeagueMap(+r.value)}},30)}else if(state.view==='week')$('content').innerHTML=weekGrid();else if(state.view==='analysis')$('content').innerHTML=analysis();wireSort()}
function init(){const y=new Date().getFullYear();$('season').innerHTML=Array.from({length:27},(_,i)=>'<option value="'+(y-i)+'">'+(y-i)+' season</option>').join('');$('dashBtn').onclick=()=>setTab('dashBtn','dash');$('detailBtn').onclick=()=>setTab('detailBtn','detail');$('flightBtn').onclick=()=>setTab('flightBtn','flight');$('weekBtn').onclick=()=>setTab('weekBtn','week');$('historyBtn').onclick=()=>{state.view='history';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id==='historyBtn'));loadHistory()};$('analysisBtn').onclick=()=>setTab('analysisBtn','analysis');$('team').onchange=()=>{if($('team').value){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id==='detailBtn'));state.view='detail'}render()};$('consoleBtn').onclick=()=>$('consoleModal').classList.add('open');$('consoleClose').onclick=()=>$('consoleModal').classList.remove('open');$('consoleModal').onclick=e=>{if(e.target===$('consoleModal'))$('consoleModal').classList.remove('open')};$('load').onclick=load;$('season').onchange=load;$('seasonType').onchange=load;load()}init();
</script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script></body></html>
