if(token!==S.request)return;S.players=payload.map(function(p){return normalizePlayer(p,p.position)}).filter(Boolean);S.generatedAt=updated||S.generatedAt;S.source=source;renderPositions();renderPlayers();renderTeamHeader(t,S.players.length,source,updated);if(!$('status').classList.contains('bad'))setStatus(source+' · updated '+formatDate(updated),'good')}

function renderPositions(){var old=$('position').value;var positions=Array.from(new Set(S.players.map(function(p){return p.position}).filter(Boolean))).sort();$('position').innerHTML='<option value="">All positions</option>'+positions.map(function(p){return '<option value="'+safe(p)+'">'+safe(p)+'</option>'}).join('');$('position').value=positions.includes(old)?old:''}
function numeric(n){if(!/^\d+$/.test(n))return 9999;return Number(n)}
function keyCmp(a,b){var sort=$('sort').value;if(sort==='name')return a.name.localeCompare(b.name);if(sort==='position')return a.position.localeCompare(b.position)||numeric(a.jersey)-numeric(b.jersey);if(sort==='numberDesc')return numeric(b.jersey)-numeric(a.jersey)||a.name.localeCompare(b.name);return numeric(a.jersey)-numeric(b.jersey)||a.name.localeCompare(b.name)}
function rosterCard(p){var face=p.head||'https://a.espncdn.com/i/headshots/'+leagues[S.league].photo+'/players/full/'+encodeURIComponent(p.id)+'.png';return '<button type="button" class="player" data-player="'+safe(p.id)+'" title="View '+safe(p.name)+' stats"><span class="number '+(!p.jersey?'none':'')+'">'+safe(p.jersey||'—')+'</span><span><span class="name">'+safe(p.name)+'</span><span class="detail">'+safe(p.position)+(p.status&&p.status!=='Active'?' · '+safe(p.status):'')+'</span></span><span class="facebox"><img class="face" src="'+safe(safeUrl(face))+'" alt="" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="fallback" hidden>♟</span><img class="teammini" src="'+safe(safeUrl(S.team.logo))+'" alt="" loading="lazy" onerror="this.hidden=true"></span></button>'}
function renderPlayers(){if(!S.team)return;var q=$('query').value.trim().toLocaleLowerCase(),pos=$('position').value;var arr=S.players.filter(function(p){return (!pos||pos===p.position)&&(!q||[p.name,p.jersey,p.position].join(' ').toLocaleLowerCase().includes(q))});arr.sort(keyCmp);$('players').className='players'+(S.compact?' list':'');$('view').classList.toggle('active',S.compact);$('view').setAttribute('aria-pressed',String(S.compact));$('group').classList.toggle('active',S.group);$('group').setAttribute('aria-pressed',String(S.group));$('view').textContent=S.compact?'Cards':'Compact';$('shown').textContent=arr.length+' of '+S.players.length+' players';
if(!arr.length){$('players').innerHTML='<div class="loading">No matching players.</div>';return}
if(!S.group){$('players').innerHTML=arr.map(rosterCard).join('');return}
var map=new Map();arr.forEach(function(p){var key=p.position||'Unassigned';if(!map.has(key))map.set(key,[]);map.get(key).push(p)});var keys=Array.from(map.keys()).sort();$('players').innerHTML=keys.map(function(k){return '<div class="poshead">'+safe(k)+' · '+map.get(k).length+'</div>'+map.get(k).map(rosterCard).join('')}).join('')}
function bioField(name,value){return value&&value!=='undefined'?'<span>'+safe(name)+': <b>'+safe(value)+'</b></span>':''}
function getStatGroups(j){var raw=j&&j.categories||j&&j.statCategories||[];if(!Array.isArray(raw))raw=Object.values(raw);return raw.map(function(g){var labels=g.labels||g.abbreviations||[],values=g.totals||g.stats||[];if(!Array.isArray(values)&&values&&typeof values==='object')values=values.stats||[];var cols=labels.map(function(k,i){var v=values[i];return {label:text(k),value:text(typeof v==='object'?v.displayValue||v.value:v)}}).filter(function(s){return s.label&&s.value&&!/^(-|N\/A|null)$/i.test(s.value)});return {name:text(g.displayName||g.name||'Statistics'),items:cols}}).filter(function(g){return g.items.length})}
function groupHTML(g){return '<div class="modallabel"><h2>'+safe(g.name)+'</h2></div><div class="statgrid">'+g.items.map(function(s){return '<div class="stat"><b>'+safe(s.value)+'</b><span title="'+safe(s.label)+'">'+safe(s.label)+'</span></div>'}).join('')+'</div>'}
function renderPlayerTop(p){var face=p.head||'https://a.espncdn.com/i/headshots/'+leagues[S.league].photo+'/players/full/'+encodeURIComponent(p.id)+'.png';var t=S.team;var bio=bioField('Position',p.position)+bioField('Height',p.height)+bioField('Weight',p.weight)+bioField('Age',p.age)+bioField('College',p.college)+bioField('Experience',p.experience==null?'':p.experience+' yrs')+bioField('Status',p.status);return '<div class="modalhead"><img class="bigface" src="'+safe(safeUrl(face))+'" alt="" onerror="this.style.opacity=\'.15\'"><div class="modalinfo"><h2 class="modalname">'+safe(p.name)+'</h2><div class="modalsub"><img src="'+safe(safeUrl(t.logo))+'" alt="">'+safe(t.name)+' · '+safe(p.position)+'</div></div><span class="hugejersey">#'+safe(p.jersey||'—')+'</span><button class="close" id="closeModal" aria-label="Close dialog">×</button></div><div class="modalbody"><div class="bio">'+bio+'</div><div id="statArea"><div class="loading">Loading season statistics…</div></div><div class="actionsrow"><span class="tiny">Statistics subject to source availability</span><a id="playerESPN" class="link" target="_blank" rel="noopener noreferrer" hidden>View on ESPN ↗</a></div></div>'}
async function showPlayer(id){var p=S.players.find(function(x){return x.id===id});if(!p)return;var dlg=$('playerDialog'),seq=++S.modalReq;dlg.style.setProperty('--team',S.team.color||'#496783');$('dialogContent').innerHTML=renderPlayerTop(p);dlg.showModal();$('closeModal').addEventListener('click',function(){dlg.close()});var url=(p.links||[]).find(function(l){return l&&safeUrl(l.href)&&/espn\.com/.test(l.href)})?.href||'';if(url){$('playerESPN').href=url;$('playerESPN').hidden=false}
var year=localStorage.getItem('jersey.season.'+S.league)||'';var endpoint=apiWeb()+'/athletes/'+encodeURIComponent(p.id)+'/stats'+(year?'?season='+encodeURIComponent(year):'');var ckey='stats:'+S.league+':'+p.id+':'+year;var cached=await cacheGet(ckey),j=null,stale=false;
if(cached&&Date.now()-cached.saved<12*3600000)j=cached.payload;else{try{j=await requestESPN(endpoint);await cachePut(ckey,j)}catch(e){if(cached){j=cached.payload;stale=true}}}
if(seq!==S.modalReq||!dlg.open)return;var area=$('statArea');if(!j){area.innerHTML='<div class="modallabel"><h2>Season statistics</h2></div><div class="empty">Season stats are not available for this player from the current ESPN endpoint. Roster details above are still available.</div>';return}
var groups=getStatGroups(j);if(!groups.length){area.innerHTML='<div class="modallabel"><h2>Season statistics</h2></div><div class="empty">No populated season statistics were returned for this player.</div>';return}
var preferred=statkeys[S.league]||[];var main=[];groups.forEach(function(g){g.items.forEach(function(x){if(preferred.includes(x.label.toUpperCase())&&!main.some(function(y){return y.label===x.label}))main.push(x)})});main.sort(function(a,b){return preferred.indexOf(a.label.toUpperCase())-preferred.indexOf(b.label.toUpperCase())});if(main.length>12)main=main.slice(0,12);
area.innerHTML='<div class="modallabel"><h2>Season statistics</h2><span class="sublabel">'+safe(j.season&&j.season.displayName||'ESPN season')+(stale?' · cached':'')+'</span></div>'+(main.length?'<div class="statgrid">'+main.map(function(s){return '<div class="stat"><b>'+safe(s.value)+'</b><span>'+safe(s.label)+'</span></div>'}).join('')+'</div>':'')+groups.map(groupHTML).join('')}
function wireEvents(){ $('leagues').addEventListener('click',function(e){var b=e.target.closest('[data-league]');if(!b||S.league===b.dataset.league)return;S.league=b.dataset.league;localStorage.setItem('jersey.league',S.league);$('query').value='';$('position').innerHTML='<option value="">All positions</option>';loadLeague()});
$('teamSelect').addEventListener('change',function(){var t=S.teams.find(function(x){return x.id===$('teamSelect').value});if(t){S.team=t;S.players=[];$('position').innerHTML='<option value="">All positions</option>';loadTeam(false)}});
$('query').addEventListener('input',renderPlayers);$('position').addEventListener('change',renderPlayers);$('sort').addEventListener('change',renderPlayers);
$('group').addEventListener('click',function(){S.group=!S.group;renderPlayers()});$('view').addEventListener('click',function(){S.compact=!S.compact;renderPlayers()});
$('refresh').addEventListener('click',function(){if(S.team)loadTeam(true);else loadLeague()});
$('players').addEventListener('click',function(e){var b=e.target.closest('[data-player]');if(b)showPlayer(b.dataset.player)});
$('playerDialog').addEventListener('close',function(){S.modalReq++});$('playerDialog').addEventListener('click',function(e){if(e.target===$('playerDialog'))$('playerDialog').close()});
}
wireEvents();loadLeague();
})();
</script></body></html>
