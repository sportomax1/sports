<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth Chart Lab</title><style>body{margin:0;background:#07101b;color:#fff;font:14px system-ui}.shell{max-width:1300px;margin:auto;padding:20px}.muted{color:#91a4bd}.error{color:#ff8d87}.tabs,.ctl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0}button,select,input{background:#132238;color:#fff;border:1px solid #345;border-radius:8px;padding:10px}button.active{background:#f4b400;color:#111;font-weight:800}.hero{display:flex;gap:14px;align-items:center;background:#0e1928;border:1px solid #263a55;border-radius:13px;padding:13px;margin:10px 0}.hero img{width:65px;height:65px;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.group{background:#0e1928;border:1px solid #263a55;border-radius:12px;overflow:hidden}.group h3{margin:0;padding:11px;background:#132238}.position{padding:10px;border-top:1px solid #263a55}.position>b{color:#ffd45c}.player{display:grid;grid-template-columns:30px 40px 1fr;gap:8px;align-items:center;padding:6px;margin-top:5px;background:#091421;border-radius:8px}.player img{width:38px;height:38px;border-radius:50%;object-fit:cover}.rank{text-align:center;font-weight:900}.empty{padding:20px;border:1px dashed #345;border-radius:10px;color:#91a4bd}</style></head><body><main class="shell"><h1>Depth Chart Lab</h1><div class="muted">NFL true depth order when ESPN supplies it. NBA, MLB and NHL use positional roster views when true depth data is unavailable.</div><div id="sports" class="tabs"></div><div class="ctl"><select id="team"></select><input id="filter" placeholder="Filter player / position"><button id="reload">Reload</button></div><div id="status" class="muted"></div><div id="hero"></div><div id="out"></div></main><script>
'use strict';
const CFG={NFL:{sport:'football',league:'nfl'},NBA:{sport:'basketball',league:'nba'},MLB:{sport:'baseball',league:'mlb'},NHL:{sport:'hockey',league:'nhl'}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sport=localStorage.getItem('dcSport')||'NFL',teams=[],model=null;
async function get(url){const r=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);const t=await r.text();try{return JSON.parse(t)}catch{throw Error('ESPN returned non-JSON')}}
function teamRows(j){return (j?.sports?.[0]?.leagues?.[0]?.teams||j?.teams||[]).map(x=>x.team||x).filter(x=>x?.id)}
function tabs(){$('sports').innerHTML=Object.keys(CFG).map(s=>`<button data-s="${s}" class="${s===sport?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.setItem('dcSport',sport);tabs();loadTeams()})}
async function loadTeams(){model=null;$('out').innerHTML='';$('hero').innerHTML='';$('status').textContent='Loading teams…';try{const c=CFG[sport],j=await get(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams?limit=100`);teams=teamRows(j).sort((a,b)=>(a.displayName||'').localeCompare(b.displayName||''));if(!teams.length)throw Error('No teams returned');$('team').innerHTML=teams.map(t=>`<option value="${esc(t.id)}">${esc(t.displayName||t.name)}</option>`).join('');const saved=localStorage.getItem('dcTeam:'+sport);if(saved&&teams.some(t=>String(t.id)===saved))$('team').value=saved;await loadTeam()}catch(e){$('status').innerHTML=`<span class="error">Teams failed: ${esc(e.message)}</span>`}}
function depthGroups(j){const charts=Array.isArray(j?.depthCharts)?j.depthCharts:Array.isArray(j?.items)?j.items:[];return charts.map(ch=>{const p=ch?.positions||{},arr=Array.isArray(p)?p:Object.values(p);return{name:ch?.name||ch?.displayName||'Depth Chart',positions:arr.map(x=>({name:x?.position?.name||x?.position?.abbreviation||'Position',abbr:x?.position?.abbreviation||'',items:Array.isArray(x?.athletes)?x.athletes:[]})).filter(x=>x.items.length)}}).filter(x=>x.positions.length)}
function rosterGroups(j){const src=Array.isArray(j?.athletes)?j.athletes:Array.isArray(j?.items)?j.items:[],out=[];for(const x of src){if(Array.isArray(x?.items)&&x.items.length)out.push({name:x.position||x.name||x.abbreviation||'Roster',items:x.items});else if(x?.displayName||x?.fullName)out.push({name:x?.position?.abbreviation||x?.position?.name||'Roster',items:[x]})}return out}
function athlete(x){const a=x?.athlete||x||{};return{id:a.id||'',name:a.displayName||a.fullName||a.shortName||'Unknown',jersey:a.jersey||'',pos:a.position?.abbreviation||a.position?.name||'',head:a.headshot?.href||a.headshot||'',rank:Number(x?.rank??x?.pos_rank??0)}}
function player(x,i,depth){const a=athlete(x),r=depth?(a.rank||i+1):'',head=a.head||(a.id?`https://a.espncdn.com/i/headshots/${CFG[sport].league}/players/full/${a.id}.png`:'');return`<div class="player"><div class="rank">${depth?r:'•'}</div><img src="${esc(head)}" alt="" onerror="this.style.visibility='hidden'"><div><b>${esc(a.name)}</b><div class="muted">${a.jersey?'#'+esc(a.jersey)+' · ':''}${esc(a.pos)}${depth?' · '+(r===1?'Starter':'Depth '+r):''}</div></div></div>`}
function render(){const q=$('filter').value.trim().toLowerCase();if(!model)return;if(model.kind==='depth'){const gs=model.groups.map(g=>({...g,positions:g.positions.map(p=>({...p,items:p.items.filter(x=>!q||p.name.toLowerCase().includes(q)||athlete(x).name.toLowerCase().includes(q))})).filter(p=>p.items.length)})).filter(g=>g.positions.length);$('out').innerHTML=gs.length?`<div class="grid">${gs.map(g=>`<section class="group"><h3>${esc(g.name)}</h3>${g.positions.map(p=>`<div class="position"><b>${esc(p.abbr||p.name)}</b>${[...p.items].sort((a,b)=>(athlete(a).rank||99)-(athlete(b).rank||99)).map((x,i)=>player(x,i,true)).join('')}</div>`).join('')}</section>`).join('')}</div>`:'<div class="empty">No matches.</div>'}else{const gs=model.groups.map(g=>({...g,items:g.items.filter(x=>!q||g.name.toLowerCase().includes(q)||athlete(x).name.toLowerCase().includes(q))})).filter(g=>g.items.length);$('out').innerHTML=gs.length?`<div class="grid">${gs.map(g=>`<section class="group"><h3>${esc(g.name)}</h3><div class="position">${g.items.map((x,i)=>player(x,i,false)).join('')}</div></section>`).join('')}</div>`:'<div class="empty">No matches.</div>'}}
async function loadTeam(){const id=$('team').value;if(!id)return;localStorage.setItem('dcTeam:'+sport,id);const c=CFG[sport],t=teams.find(x=>String(x.id)===String(id));$('hero').innerHTML=`<div class="hero"><img src="${esc(t?.logos?.[0]?.href||'')}" alt=""><div><h2>${esc(t?.displayName||'')}</h2><div class="muted">${sport}</div></div></div>`;$('status').textContent='Loading player data…';$('out').innerHTML='';const errors=[];if(sport==='NFL'){const year=new Date().getFullYear();const urls=[`https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/${id}/depthcharts`,`https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/${year}/teams/${id}/depthcharts`];for(const u of urls){try{const j=await get(u),g=depthGroups(j);if(g.length){model={kind:'depth',groups:g};render();$('status').textContent='ESPN NFL depth chart loaded.';return}}catch(e){errors.push(e.message)}}}try{const j=await get(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams/${id}/roster`),g=rosterGroups(j);if(!g.length)throw Error('Roster returned no players');model={kind:'roster',groups:g};render();$('status').textContent=sport==='NFL'?'Depth endpoint unavailable; ESPN roster fallback loaded.':`${sport} ESPN positional roster loaded.`}catch(e){errors.push(e.message);$('status').innerHTML=`<span class="error">Player load failed (${esc(errors.join(' / '))})</span>`}}
$('team').onchange=loadTeam;$('reload').onclick=loadTeam;$('filter').oninput=render;tabs();loadTeams();
</script></body></html>
