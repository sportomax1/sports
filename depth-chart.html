<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth Chart Lab</title><style>:root{color-scheme:dark;--bg:#07101b;--p:#0e1928;--p2:#132238;--line:#263a55;--muted:#91a4bd;--gold:#f4b400;--green:#238636}*{box-sizing:border-box}body{margin:0;background:#07101b;color:#fff;font:14px system-ui}.shell{max-width:1250px;margin:auto;padding:22px 14px}h1{margin:0;font-size:36px}.muted{color:var(--muted)}.tabs,.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0}button,select,input{background:var(--p2);color:#fff;border:1px solid #345;border-radius:9px;padding:10px}button{cursor:pointer}.active{background:var(--gold)!important;color:#111!important;font-weight:800}.hero{display:flex;gap:14px;align-items:center;background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.hero img{width:70px;height:70px;object-fit:contain}.hero h2{margin:0;font-size:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}.unit{background:var(--p);border:1px solid var(--line);border-radius:12px;overflow:hidden}.unit h3{margin:0;padding:11px;background:var(--p2)}.pos{padding:10px;border-top:1px solid var(--line)}.posname{font-weight:900;color:#ffd45c;font-size:11px;text-transform:uppercase;margin-bottom:6px}.player{display:grid;grid-template-columns:28px 38px 1fr auto;gap:7px;align-items:center;padding:6px;margin:4px 0;background:#091421;border-radius:8px}.rank{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#23354d;font-weight:900}.rank.one{background:var(--green)}.head{width:36px;height:36px;border-radius:50%;object-fit:cover}.name{font-weight:800}.meta{font-size:11px;color:var(--muted)}.badge{font-size:10px;border:1px solid #40516a;border-radius:20px;padding:3px 6px}.error{color:#ff8d87}.empty{padding:25px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}#search{min-width:220px}</style></head><body><main class="shell"><h1>Depth Chart Lab</h1><div class="muted">NFL true depth charts + NBA / MLB / NHL roster position views</div><div id="sports" class="tabs"></div><div class="controls"><label>Team <select id="team"></select></label><input id="search" placeholder="Filter player / position"><button id="refresh">Refresh</button></div><div id="status" class="muted"></div><div id="hero"></div><div id="out"></div></main><script>'use strict';const L={NFL:['football','nfl'],NBA:['basketball','nba'],MLB:['baseball','mlb'],NHL:['hockey','nhl']},$=x=>document.getElementById(x);let sport=localStorage.depthSport||'NFL',teams=[],data=null,mode='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function teamList(j){return(j?.sports?.[0]?.leagues?.[0]?.teams||j?.teams||[]).map(x=>x.team||x).filter(Boolean)}function buttons(){$('sports').innerHTML=Object.keys(L).map(x=>`<button data-s="${x}" class="${x===sport?'active':''}">${x}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.depthSport=sport;buttons();loadTeams()})}async function loadTeams(){$('status').textContent='Loading teams…';$('out').innerHTML='';try{const [cat,lg]=L[sport],j=await get(`https://site.api.espn.com/apis/site/v2/sports/${cat}/${lg}/teams?limit=100`);teams=teamList(j).sort((a,b)=>(a.displayName||'').localeCompare(b.displayName||''));if(!teams.length)throw Error('ESPN returned no teams');$('team').innerHTML=teams.map(t=>`<option value="${esc(t.id)}">${esc(t.displayName)}</option>`).join('');const saved=localStorage.getItem('depthTeam:'+sport);if(saved&&teams.some(t=>String(t.id)===saved))$('team').value=saved;await load()}catch(e){$('status').innerHTML=`<span class="error">Team load failed: ${esc(e.message)}</span>`}}function showHero(t){$('hero').innerHTML=t?`<div class="hero"><img src="${esc(t.logos?.[0]?.href||'')}" alt=""><div><div class="muted">${sport} · ${esc(t.abbreviation||'')}</div><h2>${esc(t.displayName)}</h2><div class="muted">${sport==='NFL'?'ESPN depth chart':'Roster-derived positional view'}</div></div></div>`:''}async function load(){const id=$('team').value;if(!id)return;localStorage.setItem('depthTeam:'+sport,id);const t=teams.find(x=>String(x.id)===String(id)),[cat,lg]=L[sport];showHero(t);$('status').textContent='Loading…';$('out').innerHTML='';if(sport==='NFL'){try{const j=await get(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/${id}/depthcharts`);if(!depthGroups(j).length)throw Error('No positions returned');data=j;mode='depth';render();$('status').textContent='Live ESPN NFL depth chart.';return}catch(e){console.warn('NFL depth chart failed',e);$('status').textContent='NFL depth chart unavailable; loading roster fallback…'}}try{const j=await get(`https://site.api.espn.com/apis/site/v2/sports/${cat}/${lg}/teams/${id}/roster`);data=j;mode='roster';render();$('status').textContent=sport==='NFL'?'NFL roster fallback.':`${sport}: ESPN roster grouped by position.`}catch(e){$('status').innerHTML=`<span class="error">Load failed: ${esc(e.message)}</span>`}}function depthGroups(j){let charts=j?.depthCharts||j?.items||[];if(!Array.isArray(charts))charts=Object.values(charts||{});const out=[];for(const c of charts){let ps=c?.positions||{};if(Array.isArray(ps))ps=Object.fromEntries(ps.map((p,i)=>[p?.position?.abbreviation||String(i),p]));const positions=[];for(const [key,p] of Object.entries(ps)){let arr=p?.athletes||[];if(!Array.isArray(arr))arr=Object.values(arr||{});if(arr.length)positions.push({name:p?.position?.name||key,abbr:p?.position?.abbreviation||key.toUpperCase(),items:arr})}if(positions.length)out.push({name:c?.name||c?.displayName||'Depth Chart',positions})}return out}function athlete(a){const x=a?.athlete||a||{};return{id:x.id||a?.id,name:x.displayName||x.fullName||x.shortName||'Unknown',head:x.headshot?.href||x.headshot||'',jersey:x.jersey||'',position:x.position?.abbreviation||x.position?.name||'',rank:Number(a?.rank??a?.pos_rank??x.rank)||0}}function card(a,i,trueDepth){const p=athlete(a),r=trueDepth?(p.rank||i+1):i+1,head=p.head||(p.id?`https://a.espncdn.com/i/headshots/${L[sport][1]}/players/full/${encodeURIComponent(p.id)}.png`:'');return`<div class="player"><span class="rank ${trueDepth&&r===1?'one':''}">${trueDepth?r:'•'}</span><img class="head" src="${esc(head)}" alt="" onerror="this.style.visibility='hidden'"><div><div class="name">${esc(p.name)}</div><div class="meta">${p.jersey?'#'+esc(p.jersey)+' · ':''}${esc(p.position)}</div></div><span class="badge">${trueDepth?(r===1?'Starter':'Depth '+r):'Roster'}</span></div>`}function rosterGroups(j){const src=j?.athletes||j?.items||[],m=new Map();if(Array.isArray(src)){for(const g of src){if(Array.isArray(g?.items)){const n=g.position||g.name||g.abbreviation||'Roster';for(const a of g.items){if(!m.has(n))m.set(n,[]);m.get(n).push(a)}}else{const n=g?.position?.name||g?.position?.abbreviation||'Roster';if(!m.has(n))m.set(n,[]);m.get(n).push(g)}}}return[...m].map(([name,items])=>({name,items}))}function render(){const q=$('search').value.trim().toLowerCase();if(mode==='depth'){const gs=depthGroups(data).map(g=>({...g,positions:g.positions.map(p=>({...p,items:p.items.filter(a=>!q||p.name.toLowerCase().includes(q)||p.abbr.toLowerCase().includes(q)||athlete(a).name.toLowerCase().includes(q))})).filter(p=>p.items.length)})).filter(g=>g.positions.length);$('out').innerHTML=gs.length?`<div class="grid">${gs.map(g=>`<section class="unit"><h3>${esc(g.name)}</h3>${g.positions.map(p=>`<div class="pos"><div class="posname">${esc(p.abbr)} · ${esc(p.name)}</div>${[...p.items].sort((a,b)=>(athlete(a).rank||99)-(athlete(b).rank||99)).map((a,i)=>card(a,i,true)).join('')}</div>`).join('')}</section>`).join('')}</div>`:'<div class="empty">No matches.</div>'}else{const gs=rosterGroups(data).map(g=>({...g,items:g.items.filter(a=>!q||g.name.toLowerCase().includes(q)||athlete(a).name.toLowerCase().includes(q))})).filter(g=>g.items.length);$('out').innerHTML=gs.length?`<div class="grid">${gs.map(g=>`<section class="unit"><h3>${esc(g.name)} <span class="muted">(${g.items.length})</span></h3><div class="pos">${g.items.map((a,i)=>card(a,i,false)).join('')}</div></section>`).join('')}</div>`:'<div class="empty">No roster data or matches.</div>'}}$('team').onchange=load;$('refresh').onclick=load;$('search').oninput=()=>{if(data)render()};buttons();loadTeams();</script></body></html>
