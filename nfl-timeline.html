<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Timeline — Last 5 Seasons</title>
<style>
:root{--bg:#090d12;--panel:#111823;--panel2:#172131;--line:#28364a;--txt:#f3f6fa;--mut:#8d9caf;--blue:#4da3ff;--pw:274px;--rh:43px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:12px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
header{height:78px;background:#0c1119;border-bottom:1px solid var(--line);padding:5px 7px;position:relative;z-index:30}
.row{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow-x:auto;margin-bottom:4px}.brand{font-size:14px;font-weight:900}
button,input,select,label.chip{height:29px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--txt);padding:0 7px}
button{font-weight:750;cursor:pointer}.primary{background:#1676d2;border-color:#1676d2}.chip{display:flex;align-items:center;gap:4px}.mut{color:var(--mut)}
#status{margin-left:auto;color:var(--mut)}#prog{position:absolute;bottom:0;left:0;right:0;height:2px;background:#172131}#prog i{display:block;height:100%;width:0;background:var(--blue)}
main{height:calc(100vh - 78px);overflow:auto;position:relative}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{height:var(--rh);padding:2px 4px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:78px;background:var(--bg)}
th{height:29px;position:sticky;top:0;z-index:10;background:var(--panel2);font-size:10px}.player{position:sticky!important;left:0;z-index:12!important;width:var(--pw);min-width:var(--pw);max-width:var(--pw);text-align:left;border-right:2px solid #40536e}
thead .player{z-index:15!important;background:var(--panel2)}.pb{display:grid;grid-template-columns:32px 1fr auto;gap:6px;align-items:center}.photo{width:32px;height:32px;border-radius:50%;object-fit:contain;background:#172131}
.nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta,.metrics{font-size:9px;color:var(--mut)}.metrics{text-align:right}.metrics b{display:block;color:var(--blue);font-size:11px}
.logos{display:flex;justify-content:center;align-items:center;gap:2px}.logo{width:28px;height:28px;object-fit:contain}.dot{color:#33445a}.empty{padding:60px;text-align:center;color:var(--mut)}.yr{font-weight:800}
</style>
</head>
<body>
<header>
<div class="row">
<b class="brand">NFL TIMELINE — LAST 5</b>
<button class="primary" id="scan">Load 2026 → 2022</button><button id="pause" disabled>Pause</button>
<select id="speed"><option value="20">Safe 20</option><option value="36" selected>Fast 36</option><option value="50">Turbo 50</option></select>
<label class="chip"><input type="checkbox" id="refresh"> Refresh loaded years</label>
<input id="q" placeholder="Player…"><select id="pos"><option value="">All pos</option></select><select id="team"><option value="">All teams</option></select>
<select id="teamMode"><option value="ever">Ever team</option><option value="current">2026 team</option><option value="year">Team in selected year</option></select>
<span id="status">Initializing…</span>
</div>
<div class="row">
<select id="year"><option value="">Any year</option></select>
<label class="chip"><input type="checkbox" id="present"> Present in selected year</label>
<label class="chip"><input type="checkbox" id="current"> 2026 active only</label>
<select id="teamN"><option value="">Teams: any</option><option value="1">1 only</option><option value="2">2+</option><option value="3">3+</option></select>
<select id="sort"><option value="name">Name</option><option value="teams">Most teams</option><option value="years">Most seasons</option><option value="last">Most recent</option></select>
<button id="clear">Clear filters</button><button id="reset">Reset cache</button>
<span class="mut">2026 = ESPN active players • 2025–2022 = ESPN season players who played, resolved from that exact season</span>
</div><div id="prog"><i></i></div>
</header>

<main id="main">
<table><thead id="head"></thead><tbody id="body"></tbody></table>
<div class="empty" id="empty">Click <b>Load 2026 → 2022</b>. 2026 appears first, then 2025, 2024, 2023, and 2022 are added independently.</div>
</main>

<script>
const CORE='https://sports.core.api.espn.com/v2/sports/football/leagues/nfl';
const V3='https://sports.core.api.espn.com/v3/sports/football/nfl';
const SITE='https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const DB='nflTimelineV8', DBV=1;
const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
let CURRENT=2026, YEARS=[2026,2025,2024,2023,2022], P=new Map(), TEAMS=new Map(), view=[], running=false, paused=false, renderRAF=0;

function refId(v){return String(v||'').match(/\/(\d+)(?:\?.*)?$/)?.[1]||''}
function https(v){return String(v||'').replace(/^http:/,'https:')}
async function get(url,tries=2){
 for(let i=0;i<=tries;i++){try{let r=await fetch(https(url),{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);return await r.json()}
 catch(e){if(i===tries)throw e;await sleep(250*2**i)}}
}
async function collection(url){
 let first=await get(url), items=[...(first.items||[])], pages=Math.max(1,+first.pageCount||1);
 if(pages>1){
  let rest=await Promise.all(Array.from({length:pages-1},(_,i)=>get(url+(url.includes('?')?'&':'?')+'page='+(i+2),1)));
  for(const x of rest)items.push(...(x.items||[]))
 }
 return {items,count:+first.count||items.length,pages}
}
async function pool(items,limit,fn){
 let idx=0,done=0,errors=0;
 async function worker(){while(!paused){let i=idx++;if(i>=items.length)return;try{await fn(items[i],i)}catch(e){errors++;console.warn(e)}done++;if(done%25===0||done===items.length)progressDetail(done,items.length)}}
 await Promise.all(Array.from({length:Math.min(limit,items.length||1)},worker));
 return {done,errors}
}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,DBV);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('players'))d.createObjectStore('players',{keyPath:'id'});if(!d.objectStoreNames.contains('done'))d.createObjectStore('done',{keyPath:'year'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function dbAll(s){let d=await openDB();return new Promise(ok=>{let r=d.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result)})}
async function dbGet(s,k){let d=await openDB();return new Promise(ok=>{let r=d.transaction(s).objectStore(s).get(k);r.onsuccess=()=>ok(r.result)})}
async function dbPut(s,o){let d=await openDB();return new Promise(ok=>{let x=d.transaction(s,'readwrite');x.objectStore(s).put(o);x.oncomplete=ok})}
async function dbPutMany(s,a){if(!a.length)return;let d=await openDB();return new Promise(ok=>{let x=d.transaction(s,'readwrite'),os=x.objectStore(s);a.forEach(o=>os.put(o));x.oncomplete=ok})}

function blank(id){return{id:String(id),name:`Player ${id}`,pos:'',head:`https://a.espncdn.com/i/headshots/nfl/players/full/${id}.png`,active2026:false,seasons:{}}}
function clearYear(y){for(const [id,p] of P){delete p.seasons[y];if(y===CURRENT)p.active2026=false;if(!Object.keys(p.seasons).length)P.delete(id)}}
function applyAthlete(a,y,current=false){
 let id=String(a.id||refId(a.$ref));if(!id)return false;
 let tid=String(a.team?.id||refId(a.team?.$ref));if(!tid)return false;
 let p=P.get(id)||blank(id);
 p.name=a.displayName||a.fullName||[a.firstName,a.lastName].filter(Boolean).join(' ')||p.name;
 p.pos=a.position?.abbreviation||p.pos;
 p.head=a.headshot?.href||p.head;
 p.seasons[y]=[tid];
 if(current)p.active2026=true;
 P.set(id,p);return true
}
function yearsOf(p){return YEARS.filter(y=>p.seasons?.[y])}
function teamCount(p){return new Set(YEARS.flatMap(y=>p.seasons?.[y]||[])).size}
function teamFor(p,y){return p.seasons?.[y]?.[0]||''}

async function resolveCurrent(){
 try{let d=await get(CORE,1),y=+(d.season?.year||refId(d.season?.$ref));if(y>=2022&&y<2100)CURRENT=y}catch{}
 YEARS=Array.from({length:5},(_,i)=>CURRENT-i)
 $('#scan').textContent=`Load ${YEARS[0]} → ${YEARS[4]}`
}
async function loadTeams(){
 try{
  let d=await get(`${SITE}/teams?limit=40`,1),arr=d.sports?.[0]?.leagues?.[0]?.teams||[];
  for(const x of arr){let t=x.team||x,id=String(t.id||'');if(id)TEAMS.set(id,{id,abbr:t.abbreviation||'',name:t.displayName||t.name||id,logo:t.logos?.[0]?.href||''})}
 }catch(e){console.warn('team metadata',e)}
}
function teamObj(id){return TEAMS.get(String(id))||{id:String(id),abbr:String(id),name:String(id),logo:''}}

async function loadCurrentYear(y){
 clearYear(y);
 $('#status').textContent=`${y}: loading active players…`;
 let d=await collection(`${V3}/athletes?active=true&limit=2000`);
 if(d.count>4000)throw Error(`Unexpected active-player count ${d.count}`);
 let kept=0;
 for(const a of d.items)if(applyAthlete(a,y,true))kept++;
 if(!kept){
  const list=await collection(`${CORE}/seasons/${y}/athletes?active=true&limit=1000`);
  let details=[];
  let r=await pool(list.items,+$('#speed').value,async x=>{let a=(x.displayName||x.fullName)?x:await get(x.$ref,1);if(applyAthlete(a,y,true))details.push(P.get(String(a.id||refId(a.$ref))))});
  if(r.errors)throw Error(`${r.errors} player detail requests failed`);
 }
 await dbPutMany('players',[...P.values()]);
 await dbPut('done',{year:y,at:Date.now(),mode:'active-current'});
 return [...P.values()].filter(p=>p.seasons[y]).length
}
async function loadHistoricalYear(y){
 clearYear(y);
 $('#status').textContent=`${y}: finding players who played…`;
 let list=await collection(`${CORE}/seasons/${y}/athletes?played=true&limit=1000`);
 if(list.count>4000)throw Error(`Unexpected season-player count ${list.count}`);
 let changed=new Set(),resolved=0;
 let r=await pool(list.items,+$('#speed').value,async x=>{
  let a=(x.displayName||x.fullName)&&x.team?x:await get(x.$ref,1);
  if(applyAthlete(a,y,false)){changed.add(String(a.id||refId(a.$ref)));resolved++}
 });
 if(paused)return {resolved,errors:r.errors,partial:true};
 if(r.errors)throw Error(`${r.errors} of ${list.items.length} season-player requests failed`);
 await dbPutMany('players',[...changed].map(id=>P.get(id)).filter(Boolean));
 await dbPut('done',{year:y,at:Date.now(),mode:'season-played',count:resolved});
 return {resolved,errors:0}
}
function progressDetail(done,total){$('#status').textContent=`${window._loadingYear}: resolving ${done.toLocaleString()}/${total.toLocaleString()} players`;$('#prog i').style.width=`${Math.round(done/Math.max(1,total)*100)}%`;if(done%100===0){refreshControls();applyFilters(false)}}

async function scan(){
 if(running)return;running=true;paused=false;$('#scan').disabled=true;$('#pause').disabled=false;
 for(let yi=0;yi<YEARS.length&&!paused;yi++){
  let y=YEARS[yi],cached=await dbGet('done',y);
  if(cached&&!$('#refresh').checked){$('#status').textContent=`${y}: cached ✓`;continue}
  window._loadingYear=y;$('#prog i').style.width='0%';
  try{
   if(y===CURRENT){let n=await loadCurrentYear(y);$('#status').textContent=`${y}: ${n.toLocaleString()} active players ✓`}
   else{let r=await loadHistoricalYear(y);if(r.partial)break;$('#status').textContent=`${y}: ${r.resolved.toLocaleString()} players ✓`}
   refreshControls();applyFilters(false)
  }catch(e){console.error(y,e);$('#status').textContent=`${y}: FAILED — ${e.message}`;break}
 }
 running=false;$('#scan').disabled=false;$('#pause').disabled=true;
 if(paused)$('#status').textContent='Paused — press Start / Resume to continue'
}

function refreshControls(){
 let oy=$('#year').value,op=$('#pos').value,ot=$('#team').value;
 $('#year').innerHTML='<option value="">Any year</option>'+YEARS.map(y=>`<option value="${y}" ${String(y)===oy?'selected':''}>${y}</option>`).join('');
 $('#pos').innerHTML='<option value="">All pos</option>'+[...new Set([...P.values()].map(p=>p.pos).filter(Boolean))].sort().map(x=>`<option ${x===op?'selected':''}>${x}</option>`).join('');
 let tids=[...new Set([...P.values()].flatMap(p=>YEARS.flatMap(y=>p.seasons?.[y]||[])))];
 $('#team').innerHTML='<option value="">All teams</option>'+tids.sort((a,b)=>teamObj(a).name.localeCompare(teamObj(b).name)).map(id=>`<option value="${id}" ${id===ot?'selected':''}>${teamObj(id).abbr||teamObj(id).name}</option>`).join('')
}
function applyFilters(reset=true){
 let q=$('#q').value.trim().toLowerCase(),pos=$('#pos').value,tid=$('#team').value,mode=$('#teamMode').value,y=+$('#year').value||0,present=$('#present').checked,current=$('#current').checked,tn=$('#teamN').value;
 view=[...P.values()].filter(p=>{
  let ys=yearsOf(p),tc=teamCount(p);if(q&&!p.name.toLowerCase().includes(q)||pos&&p.pos!==pos||current&&!p.active2026||present&&y&&!p.seasons[y])return false;
  if(tid){let ever=YEARS.some(yr=>p.seasons?.[yr]?.includes(tid));if(mode==='current'&&teamFor(p,CURRENT)!==tid||mode==='ever'&&!ever||mode==='year'&&(!y||teamFor(p,y)!==tid))return false}
  if(tn&&(+tn===1?tc!==1:tc<+tn))return false;return true
 });
 let s=$('#sort').value;view.sort((a,b)=>s==='teams'?teamCount(b)-teamCount(a):s==='years'?yearsOf(b).length-yearsOf(a).length:s==='last'?(Math.max(...yearsOf(b),0)-Math.max(...yearsOf(a),0)):a.name.localeCompare(b.name));
 render(reset)
}
function render(reset=false){
 if(reset)$('#main').scrollTop=0;let m=$('#main'),rh=43,start=Math.max(0,Math.floor(Math.max(0,m.scrollTop-29)/rh)-10),end=Math.min(view.length,start+Math.ceil(m.clientHeight/rh)+22);
 $('#head').innerHTML=`<tr><th class="player">Player (${view.length.toLocaleString()})</th>${YEARS.map(y=>`<th class="yr">${y}</th>`).join('')}</tr>`;
 let rows=`<tr><td colspan="${YEARS.length+1}" style="height:${start*rh}px;padding:0;border:0"></td></tr>`;
 for(let i=start;i<end;i++){let p=view[i],ys=yearsOf(p);rows+=`<tr><td class="player"><div class="pb"><img class="photo" loading="lazy" src="${p.head}" onerror="this.style.visibility='hidden'"><div><div class="nm">${p.name}</div><div class="meta">${p.pos||'—'} • ${p.active2026?'2026 ACTIVE':'HISTORICAL'} • ${ys.length} of 5 seasons</div></div><div class="metrics"><b>${teamCount(p)}T</b>${ys.length} yr</div></div></td>${YEARS.map(y=>{let ids=p.seasons?.[y]||[];return `<td>${ids.length?`<div class="logos">${ids.map(id=>{let t=teamObj(id);return t.logo?`<img class="logo" loading="lazy" title="${t.name}" src="${t.logo}">`:`<b title="${t.name}">${t.abbr||id}</b>`}).join('')}</div>`:'<span class="dot">·</span>'}</td>`}).join('')}</tr>`}
 rows+=`<tr><td colspan="${YEARS.length+1}" style="height:${Math.max(0,(view.length-end)*rh)}px;padding:0;border:0"></td></tr>`;$('#body').innerHTML=rows;$('#empty').style.display=P.size?'none':'block'
}

$('#main').onscroll=()=>{cancelAnimationFrame(renderRAF);renderRAF=requestAnimationFrame(()=>render(false))};
for(const id of ['q','pos','team','teamMode','year','present','current','teamN','sort'])$('#'+id).addEventListener(id==='q'?'input':'change',()=>applyFilters());
$('#scan').onclick=scan;$('#pause').onclick=()=>{paused=true;$('#pause').disabled=true};
$('#clear').onclick=()=>{for(const id of ['q','pos','team','year','teamN'])$('#'+id).value='';$('#teamMode').value='ever';$('#sort').value='name';$('#present').checked=$('#current').checked=false;applyFilters()};
$('#reset').onclick=()=>{if(confirm('Delete the clean 5-year cache and reload?')){indexedDB.deleteDatabase(DB);location.reload()}};

(async()=>{
 await resolveCurrent();await loadTeams();
 for(const p of await dbAll('players'))P.set(p.id,p);
 refreshControls();applyFilters();
 let done=(await dbAll('done')).map(x=>x.year).sort((a,b)=>b-a);
 $('#status').textContent=`Ready • ${P.size.toLocaleString()} cached players • ${done.length}/5 years loaded`
})();
</script>
</body>
</html>
