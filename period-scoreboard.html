<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111d"><title>Period Scoreboard</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#101824;--panel2:#151f2e;--line:#26354a;--text:#f7f9fc;--muted:#91a0b5;--accent:#f4b400;--live:#52d273}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}body{background:radial-gradient(circle at 50% -10%,#183457 0,transparent 34%),var(--bg)}button,input{font:inherit}.app{max-width:980px;margin:auto;padding:0 12px 36px}.top{position:sticky;top:0;z-index:20;padding:10px 0 8px;background:linear-gradient(#070b12 82%,transparent)}.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand h1{font-size:20px;margin:0}.brand a{color:var(--muted);font-size:12px;text-decoration:none}.leagues{display:flex;gap:6px;overflow:auto;padding:10px 0 8px;scrollbar-width:none}.leagues::-webkit-scrollbar{display:none}.league{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 11px;font-weight:800;font-size:11px}.league.on{background:var(--accent);border-color:var(--accent);color:#111}.datebar{display:grid;grid-template-columns:44px 1fr 44px;gap:7px}.datebar button,.datebox{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;min-height:42px}.datebar button{font-size:24px;font-weight:900}.datebox{display:flex;align-items:center;justify-content:center;gap:9px;padding:0 8px}.datebox input{width:128px;border:0;background:transparent;color:var(--text);font-weight:800}.today{border:0;background:transparent;color:var(--accent);font-size:10px;font-weight:900;padding:4px}.status{padding:10px 2px;color:var(--muted);font-size:11px}.games{display:grid;gap:10px}.game{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 7px 20px #0004}.gamehead{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}.live{color:var(--live);font-weight:900}.final{font-weight:800;color:#dce5f1}.tablewrap{overflow-x:auto;overscroll-behavior-x:contain}.scoregrid{display:grid;width:100%;min-width:0;grid-template-columns:minmax(88px,1.45fr) repeat(var(--cols),minmax(29px,.62fr)) minmax(38px,.72fr)}.cell{min-height:42px;display:flex;align-items:center;justify-content:center;border-right:1px solid #26354a88;border-bottom:1px solid #26354a88;font-size:13px}.hdr{min-height:28px;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase;background:#0b121d}.team{position:sticky;left:0;z-index:4;justify-content:flex-start;gap:5px;padding:0 6px;background:#111a27;font-weight:850}.hdr.team{z-index:5;background:#0b121d}.team img{width:23px;height:23px;object-fit:contain}.team .rank{font-size:9px;color:var(--accent)}.teamname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}.winner{background:#172333}.total{font-size:17px;font-weight:950;background:#0d1520}.winner.total{color:var(--accent)}.empty{padding:42px 18px;text-align:center;border:1px dashed var(--line);border-radius:13px;color:var(--muted)}.error{color:#ff8b8b}.views{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:7px 0}.view{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;padding:7px;font-weight:900;font-size:10px}.view.on{background:#243248;color:var(--text)}.snapshotControls{display:none;gap:6px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}.snapshotControls.show{display:flex}.snapshotControls::-webkit-scrollbar{display:none}.segment{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:10px;font-weight:900}.segment.on{background:var(--accent);border-color:var(--accent);color:#111}.seasonbar{display:none;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;padding:7px 9px;border:1px solid var(--line);background:var(--panel);border-radius:9px}.seasonbar.show{display:flex}.seasonbar label{font-size:10px;color:var(--muted);font-weight:900}.seasonbar select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-weight:900}.analysisTabs{display:none;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}.analysisTabs.show{display:grid}.analysisTabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 3px;font-size:9px;font-weight:900}.analysisTabs button.on{background:#243248;color:var(--text)}.sorts{display:none;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}.sorts.show{display:grid}.sorts button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:7px 3px;font-size:9px;font-weight:900}.sorts button.on{color:#111;background:var(--accent)}.snaprow{display:grid;grid-template-columns:minmax(88px,1.45fr) repeat(var(--metrics,3),minmax(42px,.65fr));align-items:center;border-bottom:1px solid #26354a88;min-height:43px}.snaprow.head{min-height:28px;background:#0b121d;color:var(--muted);font-size:9px;font-weight:900}.snapteam{display:flex;align-items:center;gap:6px;padding:0 7px;font-weight:850;min-width:0}.snapteam img{width:24px;height:24px;object-fit:contain}.teamopen{cursor:pointer}.teamopen:hover{background:#1a2637}.teamopen:focus{outline:2px solid var(--accent);outline-offset:-2px}.modal{border:1px solid var(--line);border-radius:14px;background:#0c1420;color:var(--text);width:min(94vw,720px);max-height:82vh;padding:0;box-shadow:0 20px 60px #000b}.modal::backdrop{background:#000b}.modalhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;background:#0c1420;border-bottom:1px solid var(--line)}.modalteam{display:flex;align-items:center;gap:9px;font-weight:900}.modalteam img{width:34px;height:34px;object-fit:contain}.modalclose{bor </style></head><body><main class="app"><header class="top"><div class="brand"><h1>Period Scoreboard</h1><a href="./index.html">Sports Tools</a></div><div id="leagues" class="leagues"></div><div class="views"><button class="view on" data-view="games">GAMES</button><button class="view" data-view="snapshot">SEASON ASSESSMENT</button></div><div class="datebar"><button id="prev" aria-label="Previous game day">‹</button><div class="datebox"><input id="date" type="date"><button class="today" id="today">TODAY</button></div><button id="next" aria-label="Next game day">›</button></div></header><div id="seasonbar" class="seasonbar"><label>SEASON ASSESSMENT</label><select id="season"></select></div><div id="analysisTabs" class="analysisTabs"><button class="on" data-analysis="period">PERIOD SCORING</button><button data-analysis="close">CLOSE GAMES</button><button data-analysis="leads">LEAD CHANGES</button></div><div id="snapshotControls" class="snapshotControls"></div><div id="sorts" class="sorts"><button data-sort="pf" class="on">PF AVG ↓</button><button data-sort="pa">PA AVG</button><button data-sort="diff">DIFF</button></div><div id="status" class="status"></div><section id="games" class="games"></section><div class="hint">Swipe a scoring grid sideways for every period / inning. Team names stay pinned.</div></main><dialog id="teamModal" class="modal"><div class="modalhead"><div id="modalTeam" class="modalteam"></div><button id="modalClose" class="modalclose" aria-label="Close">×</button></div><div id="modalBody" class="modalbody"></div></dialog>
<script>
(()=>{'use strict';
const L=[
 {id:'nfl',label:'NFL',sport:'football',league:'nfl',kind:'quarter'},
 {id:'nba',label:'NBA',sport:'basketball',league:'nba',kind:'quarter'},
 {id:'mlb',label:'MLB',sport:'baseball',league:'mlb',kind:'inning'},
 {id:'nhl',label:'NHL',sport:'hockey',league:'nhl',kind:'period'},
 {id:'ncaaf',label:'NCAAF',sport:'football',league:'college-football',kind:'quarter',college:true,groups:'80'},
 {id:'ncaam',label:'NCAAM',sport:'basketball',league:'mens-college-basketball',kind:'half',college:true,groups:'50'}
],E=id=>document.getElementById(id),els={leagues:E('leagues'),date:E('date'),prev:E('prev'),next:E('next'),today:E('today'),status:E('status'),games:E('games')};
let league=L[0],cache=new Map(),token=0,view='games',analysis='period',snapPeriod=1,snapSort='pf',snapDir=-1,seasonData=null;
const localDate=()=>{let d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,10)},ymd=s=>s.replaceAll('-',''),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
els.date.value=localDate();
const currentYear=+localDate().slice(0,4);E('season').innerHTML=Array.from({length:8},(_,i)=>'<option value="'+(currentYear-i)+'">'+(currentYear-i)+'</option>').join('');
els.leagues.innerHTML=L.map(x=>'<button class="league'+(x===league?' on':'')+'" data-id="'+x.id+'">'+x.label+'</button>').join('');
els.leagues.onclick=e=>{let b=e.target.closest('[data-id]');if(!b)return;league=L.find(x=>x.id===b.dataset.id);snapPeriod=1;document.querySelectorAll('.league').forEach(x=>x.classList.toggle('on',x===b));renderSegments();load()};
document.querySelector('.views').onclick=e=>{let b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x===b));E('analysisTabs').classList.toggle('show',view==='snapshot');E('snapshotControls').classList.toggle('show',view==='snapshot'&&analysis==='period');E('seasonbar').classList.toggle('show',view==='snapshot');E('sorts').classList.toggle('show',view==='snapshot'&&analysis==='period');document.querySelector('.datebar').style.display=view==='snapshot'?'none':'grid';renderSegments();load()};
function segmentCount(){return league.kind==='inning'?9:league.kind==='period'?3:league.kind==='half'?2:4}
function renderSegments(){let n=segmentCount(),labs=labels(league.kind,n);if(snapPeriod>n)snapPeriod=1;E('snapshotControls').innerHTML=labs.slice(0,n).map((x,i)=>'<button class="segment'+(snapPeriod===i+1?' on':'')+'" data-period="'+(i+1)+'">'+x+'</button>').join('')}
E('analysisTabs').onclick=e=>{let b=e.target.closest('[data-analysis]');if(!b)return;analysis=b.dataset.analysis;document.querySelectorAll('#analysisTabs button').forEach(x=>x.classList.toggle('on',x===b));E('snapshotControls').classList.toggle('show',analysis==='period');E('sorts').classList.toggle('show',analysis==='period');load()};
E('snapshotControls').onclick=e=>{let b=e.target.closest('[data-period]');if(!b)return;snapPeriod=+b.dataset.period;renderSegments();load()};E('season').onchange=load;
E('sorts').onclick=e=>{let b=e.target.closest('[data-sort]');if(!b)return;if(snapSort===b.dataset.sort)snapDir*=-1;else{snapSort=b.dataset.sort;snapDir=-1}document.querySelectorAll('#sorts button').forEach(x=>{x.classList.toggle('on',x.dataset.sort===snapSort);x.textContent=x.dataset.sort.toUpperCase()+(x.dataset.sort===snapSort?(snapDir<0?' AVG ↓':' AVG ↑'):'')});load()};
function apiUrl(d){return 'https://site.api.espn.com/apis/site/v2/sports/'+league.sport+'/'+league.league+'/scoreboard?dates='+ymd(d)+'&limit='+(league.college?500:100)+(league.groups?'&groups='+league.groups:'')}
function seasonUrl(y){return 'https://site.api.espn.com/apis/site/v2/sports/'+league.sport+'/'+league.league+'/scoreboard?dates='+y+'&limit='+(league.college?1000:500)+(league.groups?'&groups='+league.groups:'')}
async function get(u){if(cache.has(u))return cache.get(u);let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('ESPN HTTP '+r.status);let j=await r.json();cache.set(u,j);return j}
async function move(n){let mine=++token,d=new Date(els.date.value+'T12:00:00');els.prev.disabled=true;els.next.disabled=true;els.status.textContent='Finding '+(n<0?'previous':'next')+' '+league.label+' game day…';try{for(let i=0;i<60;i++){d.setDate(d.getDate()+n);let ds=d.toISOString().slice(0,10),j=await get(apiUrl(ds));if(mine!==token)return;if((j.events||[]).length){els.date.value=ds;renderDay(j);return}}els.status.textContent='No '+league.label+' games found within 60 days.'}catch(e){if(mine!==token)return;els.status.innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{els.prev.disabled=false;els.next.disabled=false}}
els.prev.onclick=()=>move(-1);els.next.onclick=()=>move(1);els.today.onclick=()=>{els.date.value=localDate();load()};els.date.onchange=load;
function scoreVal(x){let v=x?.score?.value??x?.score;return Number.isFinite(+v)?+v:0}
function lines(c){let a=c?.linescores||[];return a.map((x,i)=>({p:+(x.period??i+1),v:Number.isFinite(+(x.value??x.displayValue))?+(x.value??x.displayValue):0}))}
function maxPeriod(comp,teams){let p=+(comp?.status?.period||0);for(let t of teams)for(let x of lines(t))p=Math.max(p,x.p);return p}
function labels(kind,n){if(kind==='inning')return Array.from({length:Math.max(9,n)},(_,i)=>String(i+1));if(kind==='half')return n<=2?['H1','H2']:Array.from({length:n},(_,i)=>i<2?'H'+(i+1):'OT'+(i-1));if(kind==='period')return Array.from({length:Math.max(3,n)},(_,i)=>i<3?'P'+(i+1):i===3?'OT':'SO');return Array.from({length:Math.max(4,n)},(_,i)=>i<4?'Q'+(i+1):'OT'+(i-3))}
function valueAt(t,p){let x=lines(t).find(z=>z.p===p);return x?x.v:'–'}
function logo(t){return t?.team?.logo||t?.team?.logos?.[0]?.href||''}
function teamId(t){return String(t?.team?.id||t?.id||'')}
function teamButton(team,id,rankText=''){return '<div class="snapteam teamopen" role="button" tabindex="0" data-team="'+esc(id)+'">'+(team.logo?'<img src="'+esc(team.logo)+'" alt="">':'')+'<span>'+rankText+esc(team.abbreviation||team.shortDisplayName||team.displayName||'Team')+'</span></div>'}
function openTeamLog(id){if(!seasonData)return;let games=[];let tm=null;for(let ev of seasonData.events||[]){let c=ev.competitions?.[0],ts=c?.competitors||[],t=ts.find(x=>teamId(x)===id);if(!t)continue;tm=t.team||tm;let opp=ts.find(x=>x!==t),complete=!!c?.status?.type?.completed,pf=scoreVal(t),pa=scoreVal(opp),margin=pf-pa,res=complete?(margin>0?'W':margin<0?'L':'T'):'–',date=new Date(ev.date||c.date||0),d=Number.isNaN(+date)?'':date.toLocaleDateString(undefined,{month:'short',day:'numeric'}),close=complete&&Math.abs(margin)<=closeLimit();games.push({date:d,opp:opp?.team||{},home:t.homeAway==='home',pf,pa,res,margin,close,status:c?.status?.type?.shortDetail||''})}games.sort((a,b)=>0);let title=tm?.displayName||tm?.shortDisplayName||'Team';E('modalTeam').innerHTML=(tm?.logo?'<img src="'+esc(tm.logo)+'" alt="">':'')+'<div>'+esc(title)+'<div style="font-size:10px;color:var(--muted);font-weight:700">'+esc(E('season').value)+' season · '+games.length+' games</div></div>';E('modalBody').innerHTML=games.length?'<div class="logrow head"><div>DATE</div><div>OPP</div><div>R</div><div>SCORE</div><div>MARG</div></div>'+games.map(g=>'<div class="logrow"><div>'+esc(g.date)+'</div><div>'+(g.home?'vs ':'@ ')+esc(g.opp.abbreviation||g.opp.shortDisplayName||'Opponent')+(g.close?' · CLOSE':'')+'</div><div class="wl '+(g.res==='W'?'w':g.res==='L'?'l':'')+'">'+g.res+'</div><div>'+g.pf+'-'+g.pa+'</div><div>'+(g.margin>0?'+':'')+g.margin+'</div></div>').join(''):'<div class="empty">No games found for this season.</div>';E('teamModal').showModal()}
E('modalClose').onclick=()=>E('teamModal').close();E('teamModal').onclick=e=>{if(e.target===E('teamModal'))E('teamModal').close()};els.games.addEventListener('click',e=>{let b=e.target.closest('[data-team]');if(b)openTeamLog(b.dataset.team)});els.games.addEventListener('keydown',e=>{let b=e.target.closest('[data-team]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTeamLog(b.dataset.team)}});
function rank(t){if(!league.college)return'';let r=+(t?.curatedRank?.current||0);return r>=1&&r<=25?r:''}
function gameCard(ev){
 let c=ev.competitions?.[0]||{},teams=(c.competitors||[]).slice().sort((a,b)=>(a.homeAway==='away'?0:1)-(b.homeAway==='away'?0:1)),mp=maxPeriod(c,teams),labs=labels(league.kind,mp),st=c.status||ev.status||{},state=st.type?.state||'',detail=st.type?.shortDetail||st.type?.detail||'',complete=!!st.type?.completed;
 let scores=teams.map(scoreVal),mx=Math.max(...scores),tie=scores.length>1&&scores.every(x=>x===scores[0]);
 let head='<div class="gamehead"><span>'+esc(ev.shortName||ev.name||league.label)+'</span><span class="'+(state==='in'?'live':complete?'final':'')+'">'+esc(detail)+'</span></div>';
 let h='<div class="tablewrap"><div class="scoregrid" style="--cols:'+labs.length+'"><div class="cell hdr team">TEAM</div>'+labs.map(x=>'<div class="cell hdr">'+x+'</div>').join('')+'<div class="cell hdr">FINAL</div>';
 for(let t of teams){let win=complete&&!tie&&scoreVal(t)===mx,tm=t.team||{},r=rank(t);h+='<div class="cell team'+(win?' winner':'')+'">'+(logo(t)?'<img src="'+esc(logo(t))+'" alt="">':'')+'<span class="teamname">'+(r?'<span class="rank">#'+r+' </span>':'')+esc(tm.abbreviation||tm.shortDisplayName||tm.displayName||'Team')+'</span></div>'+labs.map((_,i)=>'<div class="cell">'+valueAt(t,i+1)+'</div>').join('')+'<div class="cell total'+(win?' winner':'')+'">'+scoreVal(t)+'</div>'}
 return '<article class="game">'+head+h+'</div></div></article>'
}
function periodName(){let a=labels(league.kind,snapPeriod);return a[snapPeriod-1]||('OT'+snapPeriod)}
function snapshotEvents(j){let rows=new Map();for(let ev of j.events||[]){let comp=ev.competitions?.[0],ts=comp?.competitors||[];if(ts.length<2)continue;for(let t of ts){let opp=ts.find(x=>x!==t),ls=lines(t).find(x=>x.p===snapPeriod),os=lines(opp).find(x=>x.p===snapPeriod);if(!ls||!os)continue;let id=String(t.team?.id||t.id||''),r=rows.get(id)||{id,team:t.team||{},rank:rank(t),pf:0,pa:0,g:0};r.pf+=ls.v;r.pa+=os.v;r.g++;rows.set(id,r)}}return[...rows.values()].map(r=>({...r,pf:r.pf/r.g,pa:r.pa/r.g,diff:(r.pf-r.pa)/r.g})).sort((a,b)=>(a[snapSort]-b[snapSort])*snapDir)}

function closeLimit(){return league.id==='nfl'||league.id==='ncaaf'?8:league.id==='nba'||league.id==='ncaam'?5:1}
function closeRows(j){let map=new Map(),lim=closeLimit();for(let ev of j.events||[]){let c=ev.competitions?.[0],ts=c?.competitors||[];if(!c?.status?.type?.completed||ts.length<2)continue;let a=scoreVal(ts[0]),b=scoreVal(ts[1]),margin=Math.abs(a-b);if(margin>lim)continue;for(let t of ts){let id=String(t.team?.id||t.id||''),opp=ts.find(x=>x!==t),r=map.get(id)||{team:t.team||{},g:0,w:0,l:0,t:0,pf:0,pa:0,margin:0};let pf=scoreVal(t),pa=scoreVal(opp);r.g++;r.pf+=pf;r.pa+=pa;r.margin+=Math.abs(pf-pa);if(pf>pa)r.w++;else if(pf<pa)r.l++;else r.t++;map.set(id,r)}}return[...map.values()].sort((a,b)=>(b.w/Math.max(1,b.g))-(a.w/Math.max(1,a.g))||b.g-a.g)}
function renderClose(j){let rows=closeRows(j),lim=closeLimit(),unit=league.id==='nhl'?'goal':league.id==='mlb'?'run':'point';els.status.textContent=league.label+' · '+E('season').value+' · close games ≤ '+lim+' '+unit+(lim===1?'':'s');els.games.innerHTML=rows.length?'<article class="game"><div class="snaprow head" style="--metrics:5"><div class="snapteam">TEAM</div><div class="metric">REC</div><div class="metric">WIN%</div><div class="metric">PF</div><div class="metric">PA</div><div class="metric">MARG</div></div>'+rows.map(r=>'<div class="snaprow" style="--metrics:5">'+teamButton(r.team,String(r.team.id||''))<div class="metric">'+r.w+'-'+r.l+(r.t?'-'+r.t:'')+'</div><div class="metric">'+(100*r.w/r.g).toFixed(0)+'%</div><div class="metric">'+(r.pf/r.g).toFixed(1)+'</div><div class="metric">'+(r.pa/r.g).toFixed(1)+'</div><div class="metric">'+(r.margin/r.g).toFixed(1)+'</div></div>').join('')+'</article>':'<div class="empty">No qualifying close games found.</div>'}
function summaryUrl(id){return 'https://site.api.espn.com/apis/site/v2/sports/'+league.sport+'/'+league.league+'/summary?event='+id}
function leaderFromPlay(p){let h=+(p.homeScore??p.homeScoreValue),a=+(p.awayScore??p.awayScoreValue);if(!Number.isFinite(h)||!Number.isFinite(a))return null;return h===a?0:h>a?1:-1}
function countLeadChanges(plays){let last=0,n=0;for(let p of plays||[]){let lead=leaderFromPlay(p);if(!lead)continue;if(last&&lead!==last)n++;last=lead}return n}
async function renderLeads(j,mine){let events=(j.events||[]).filter(ev=>ev.competitions?.[0]?.status?.type?.completed),map=new Map(),covered=0,total=events.length,idx=0,workers=Math.min(12,total||1);async function worker(){while(idx<total){let ev=events[idx++];try{let s=await get(summaryUrl(ev.id));if(mine!==token)return;let plays=s.plays||s.scoringPlays||[],n=countLeadChanges(plays);if(!plays.length)continue;covered++;let ts=ev.competitions?.[0]?.competitors||[];for(let t of ts){let id=String(t.team?.id||t.id||''),r=map.get(id)||{team:t.team||{},g:0,total:0,max:0,five:0,ten:0};r.g++;r.total+=n;r.max=Math.max(r.max,n);if(n>=5)r.five++;if(n>=10)r.ten++;map.set(id,r)}}catch(_){}}}await Promise.all(Array.from({length:workers},worker));if(mine!==token)return;let rows=[...map.values()].sort((a,b)=>(b.total/b.g)-(a.total/a.g));els.status.textContent=league.label+' · '+E('season').value+' · lead changes · coverage '+covered+'/'+total+' completed games';els.games.innerHTML=rows.length?'<article class="game"><div class="snaprow head" style="--metrics:5"><div class="snapteam">TEAM</div><div class="metric">G</div><div class="metric">TOTAL</div><div class="metric">AVG</div><div class="metric">MAX</div><div class="metric">5+</div></div>'+rows.map(r=>'<div class="snaprow" style="--metrics:5">'+teamButton(r.team,String(r.team.id||''))<div class="metric">'+r.g+'</div><div class="metric">'+r.total+'</div><div class="metric">'+(r.total/r.g).toFixed(1)+'</div><div class="metric">'+r.max+'</div><div class="metric">'+r.five+'</div></div>').join('')+'</article>':'<div class="empty">No usable play-by-play lead data found for this season.</div>'}

function renderSnapshot(j){let rows=snapshotEvents(j),season=E('season').value;els.status.textContent=league.label+' · '+season+' season · '+periodName()+' averages · '+rows.length+' teams';els.games.innerHTML=rows.length?'<article class="game"><div class="snaprow head"><div class="snapteam">TEAM</div><div class="metric">PF</div><div class="metric">PA</div><div class="metric">DIFF</div></div>'+rows.map(r=>'<div class="snaprow">'+teamButton(r.team,r.id,r.rank?'#'+r.rank+' ':'')<div class="metric">'+r.pf.toFixed(1)+'</div><div class="metric">'+r.pa.toFixed(1)+'</div><div class="metric diff '+(r.diff>=0?'pos':'neg')+'">'+(r.diff>0?'+':'')+r.diff.toFixed(1)+'</div></div>').join('')+'</article>':'<div class="empty">No completed '+periodName()+' scoring data on this date.</div>'}
function renderDay(j){if(view==='snapshot'){if(analysis==='close')renderClose(j);else if(analysis==='period')renderSnapshot(j);return}let ev=j.events||[];els.status.textContent=league.label+' · '+els.date.value+' · '+ev.length+' game'+(ev.length===1?'':'s');els.games.innerHTML=ev.length?ev.map(gameCard).join(''):'<div class="empty">No '+league.label+' games on this date.<br>Use ← or → to jump to a game day.</div>'}
async function load(){let mine=++token;els.status.textContent='Loading '+league.label+(view==='snapshot'?' '+E('season').value+' season':' · '+els.date.value)+'…';els.games.innerHTML='';try{let j=await get(view==='snapshot'?seasonUrl(E('season').value):apiUrl(els.date.value));if(mine!==token)return;if(view==='snapshot')seasonData=j;if(view==='snapshot'&&analysis==='leads'){els.status.textContent='Analyzing lead changes across completed games…';await renderLeads(j,mine)}else renderDay(j)}catch(e){if(mine!==token)return;els.status.innerHTML='<span class="error">'+esc(e.message)+'</span>';els.games.innerHTML='<div class="empty error">Could not load ESPN scoreboard data.</div>'}}
renderSegments();
load();
})();
</script></body></html>
