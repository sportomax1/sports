<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Timeline v5</title></head><body><main id="app"></main><script>
/* NFL Timeline v5: season-first, team-level resume, single global request queue. */
const LEAGUE='https://sports.core.api.espn.com/v2/sports/football/leagues/nfl',DB='nflTimelineV5',START=1920,$=s=>document.querySelector(s),sleep=m=>new Promise(r=>setTimeout(r,m));let P=new Map,T=new Map,stop=false,running=false,Q;
const css=`:root{--b:#090d12;--p:#111823;--p2:#172131;--l:#28364a;--t:#f3f6fa;--m:#8d9caf;--a:#4da3ff}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:12px system-ui}header{position:sticky;top:0;z-index:9;background:#0c1119;padding:6px;border-bottom:1px solid var(--l)}.r{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:5px}button,input,select,label{height:29px;background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:6px;padding:5px}button{cursor:pointer;font-weight:700}.go{background:#1676d2}.mut{color:var(--m)}#status{margin-left:auto}.bar{height:2px;background:#172131}.bar i{display:block;height:100%;background:var(--a);width:0}.wrap{height:calc(100vh - 82px);overflow:auto}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}th,td{height:42px;min-width:48px;padding:3px;border-right:1px solid var(--l);border-bottom:1px solid var(--l);text-align:center}th{position:sticky;top:0;background:var(--p2);z-index:3}.pl{position:sticky;left:0;z-index:4;background:var(--b);min-width:260px;text-align:left;border-right:2px solid #40536e}.ph{z-index:6;background:var(--p2)}.pb{display:grid;grid-template-columns:32px 1fr auto;gap:6px;align-items:center}.pic{width:32px;height:32px;border-radius:50%;object-fit:contain}.name{font-weight:800}.meta{font-size:9px;color:var(--m)}.logo{width:26px;height:26px;object-fit:contain}.logos{display:flex;justify-content:center;gap:2px}`;document.head.insertAdjacentHTML('beforeend',`<style>${css}</style>`);
$('#app').innerHTML=`<header><div class="r"><b>NFL TIMELINE v5</b><button class="go" id="go">Start / Resume</button><button id="pause" disabled>Pause</button><select id="speed"><option value="12">Safe 12</option><option value="24" selected>Fast 24</option><option value="40">Turbo 40</option></select><label><input type="checkbox" id="force"> Refresh cached</label><select id="from"></select>→<select id="to"></select><input id="q" placeholder="Player"><select id="pos"><option value="">All pos</option></select><select id="team"><option value="">All teams</option></select><span id="status">Initializing…</span></div><div class="r"><select id="year"><option value="">Any year</option></select><label><input type="checkbox" id="present"> Present in year</label><label><input type="checkbox" id="current"> Current only</label><select id="teamN"><option value="">Teams: any</option><option value="1">1 only</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option><option value="5">5+</option></select><select id="sort"><option value="name">Name</option><option value="teams">Most teams</option><option value="years">Most seasons</option><option value="last">Most recent</option></select><button id="all">All years</button><button id="clear">Clear filters</button><button id="reset">Reset cache</button></div><div class="bar"><i id="bar"></i></div></header><div class="wrap" id="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>`;
function rid(x){return String(x||'').match(/\/(\d+)(?:\?.*)?$/)?.[1]||''}async function get(u,n=2){for(let i=0;i<=n;i++)try{let r=await fetch(String(u).replace(/^http:/,'https:'));if(!r.ok)throw Error(r.status);return await r.json()}catch(e){if(i===n)throw e;await sleep(250*2**i)}}function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{for(let [n,k] of [['p','id'],['t','key'],['d','key']])if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:k})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function all(s){let d=await db();return new Promise(ok=>{let r=d.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result)})}async function one(s,k){let d=await db();return new Promise(ok=>{let r=d.transaction(s).objectStore(s).get(k);r.onsuccess=()=>ok(r.result)})}async function put(s,o){let d=await db();return new Promise(ok=>{let x=d.transaction(s,'readwrite');x.objectStore(s).put(o);x.oncomplete=ok})}async function puts(s,a){if(!a.length)return;let d=await db();return new Promise(ok=>{let x=d.transaction(s,'readwrite'),z=x.objectStore(s);a.forEach(o=>z.put(o));x.oncomplete=ok})}
class Queue{constructor(n){this.n=n;this.a=0;this.q=[]}add(fn){return new Promise((res,rej)=>{this.q.push({fn,res,rej});this.pump()})}pump(){while(!stop&&this.a<this.n&&this.q.length){let x=this.q.shift();this.a++;Promise.resolve().then(x.fn).then(x.res,x.rej).finally(()=>{this.a--;this.pump()})}}}
let seasons=[],cur=0,showAll=false,view=[];function tk(y,id){return y+':'+id}function nt(x,y){let id=String(x.id||rid(x.$ref));if(!id)return;let old=T.get(tk(y,id))||{};let t={key:tk(y,id),id,year:y,abbr:x.abbreviation||old.abbr||'',name:x.displayName||x.name||old.name||'',logo:x.logos?.[0]?.href||x.logo||old.logo||''};T.set(t.key,t);return t}function up(a,y,t,isCur){let id=String(a.id||rid(a.$ref));if(!id)return;let p=P.get(id)||{id,name:'Player '+id,pos:'',head:`https://a.espncdn.com/i/headshots/nfl/players/full/${id}.png`,current:false,currentTeam:'',seasons:{}};p.name=a.displayName||a.fullName||p.name;p.pos=a.position?.abbreviation||p.pos;p.head=a.headshot?.href||p.head;if(isCur){p.current=true;p.currentTeam=t?.id||p.currentTeam}if(t){let z=p.seasons[y]||[];if(!z.includes(t.id))z.push(t.id);p.seasons[y]=z}P.set(id,p);return p}
async function initSeasons(){try{let d=await get(LEAGUE),y=+(d.season?.year||rid(d.season?.$ref));cur=y||new Date().getFullYear()}catch{cur=new Date().getFullYear()}try{let d=await get(LEAGUE+'/seasons?limit=200');seasons=(d.items||[]).map(x=>+(x.year||rid(x.$ref))).filter(y=>y>=START&&y<=cur).sort((a,b)=>b-a)}catch{seasons=Array.from({length:cur-START+1},(_,i)=>cur-i)}if(!seasons.includes(cur))seasons.unshift(cur)}
async function seasonTeams(y){let d=await get(`${LEAGUE}/seasons/${y}/teams?limit=100`),out=[];await Promise.all((d.items||[]).map(x=>Q.add(async()=>{let a=x.id&&x.displayName?x:await get(x.$ref||x,1),t=nt(a,y);if(t){out.push(t);await put('t',t)}})));return out}
async function roster(y,t){let key=tk(y,t.id);if(!$('#force').checked&&await one('d',key))return 0;let d=await get(`${LEAGUE}/seasons/${y}/teams/${t.id}/athletes?limit=200`),ps=[];await Promise.all((d.items||[]).map(x=>Q.add(async()=>{let a=x.displayName||x.fullName?x:await get(x.$ref||x,1),p=up(a,y,t,y===cur);if(p)ps.push(p)})));if(stop)return 0;await puts('p',[...new Map(ps.map(p=>[p.id,p])).values()]);await put('d',{key,year:y,team:t.id,at:Date.now()});return ps.length}
async function scanYear(y){let ts=await seasonTeams(y),done=0,total=0,fail=0;for(const t of ts){if(stop)break;try{total+=await roster(y,t)}catch(e){fail++;console.warn(y,t.id,e)}done++;$('#bar').style.width=(100*done/Math.max(1,ts.length))+'%';$('#status').textContent=`${y}: ${done}/${ts.length} teams • ${total} fetched${fail?' • '+fail+' failed':''}`;filters();await sleep(0)}if(!stop&&!fail)await put('d',{key:'season:'+y,complete:true,at:Date.now()})}
async function scan(){if(running)return;running=true;stop=false;Q=new Queue(+$ ('#speed').value||24);$('#go').disabled=true;$('#pause').disabled=false;for(const p of P.values()){p.current=false;p.currentTeam=''}let hi=+$('#from').value,lo=+$('#to').value;if(hi<lo)[hi,lo]=[lo,hi];for(const y of seasons.filter(y=>y<=hi&&y>=lo)){if(stop)break;if(!$('#force').checked&&(await one('d','season:'+y))?.complete){$('#status').textContent=y+': cached ✓';continue}try{await scanYear(y)}catch(e){console.warn(y,e);$('#status').textContent=y+': failed, not cached'}filters()}await puts('p',[...P.values()]);running=false;$('#go').disabled=false;$('#pause').disabled=true;$('#status').textContent=stop?'Paused — exact team resume':'Complete ✓'}
function ys(p){return Object.keys(p.seasons).map(Number).sort((a,b)=>a-b)}function tc(p){return new Set(Object.values(p.seasons).flat()).size}function controls(){let oy=$('#year').value,op=$('#pos').value,ot=$('#team').value,Y=[...new Set([...P.values()].flatMap(ys))].sort((a,b)=>b-a);$('#year').innerHTML='<option value="">Any year</option>'+Y.map(y=>`<option ${y==oy?'selected':''}>${y}</option>`).join('');$('#pos').innerHTML='<option value="">All pos</option>'+[...new Set([...P.values()].map(p=>p.pos).filter(Boolean))].sort().map(x=>`<option ${x==op?'selected':''}>${x}</option>`).join('');let u=new Map;for(const t of T.values())u.set(t.id,t);$('#team').innerHTML='<option value="">All teams</option>'+[...u.values()].sort((a,b)=>(a.name||a.abbr).localeCompare(b.name||b.abbr)).map(t=>`<option value="${t.id}" ${t.id==ot?'selected':''}>${t.abbr||t.name}</option>`).join('')}
function filters(){controls();let q=$('#q').value.toLowerCase(),pos=$('#pos').value,tid=$('#team').value,y=$('#year').value,pres=$('#present').checked,curr=$('#current').checked,n=$('#teamN').value;view=[...P.values()].filter(p=>{if(q&&!p.name.toLowerCase().includes(q)||pos&&p.pos!==pos||curr&&!p.current||pres&&y&&!p.seasons[y])return false;if(tid&&!Object.values(p.seasons).flat().includes(tid))return false;let c=tc(p);if(n&&(+n===1?c!==1:c<+n))return false;return true});let s=$('#sort').value;view.sort((a,b)=>s==='teams'?tc(b)-tc(a):s==='years'?ys(b).length-ys(a).length:s==='last'?Math.max(0,...ys(b))-Math.max(0,...ys(a)):a.name.localeCompare(b.name));render()}
function render(){let Y=[...new Set([...P.values()].flatMap(ys))].sort((a,b)=>b-a);if(!showAll)Y=Y.slice(0,15);$('#head').innerHTML=`<tr><th class="pl ph">Player (${view.length})</th>${Y.map(y=>`<th>${y}</th>`).join('')}</tr>`;let w=$('#wrap'),rh=42,start=Math.max(0,Math.floor(w.scrollTop/rh)-10),end=Math.min(view.length,start+Math.ceil(w.clientHeight/rh)+20),rows=`<tr><td colspan="${Y.length+1}" style="height:${start*rh}px;border:0"></td></tr>`;for(let i=start;i<end;i++){let p=view[i],py=ys(p);rows+=`<tr><td class="pl"><div class="pb"><img class="pic" loading="lazy" src="${p.head}"><div><div class="name">${p.name}</div><div class="meta">${p.pos||'—'} • ${p.current?'CURRENT':'HISTORICAL'} • ${py[0]||'—'}–${py.at(-1)||'—'}</div></div><b>${tc(p)}T</b></div></td>${Y.map(y=>`<td><div class="logos">${(p.seasons[y]||[]).map(id=>{let t=T.get(tk(y,id))||{abbr:id};return t.logo?`<img class="logo" src="${t.logo}" title="${t.name||t.abbr}">`:`<small>${t.abbr}</small>`}).join('')}</div></td>`).join('')}</tr>`}rows+=`<tr><td colspan="${Y.length+1}" style="height:${Math.max(0,(view.length-end)*rh)}px;border:0"></td></tr>`;$('#body').innerHTML=rows}
for(const id of ['q','pos','team','year','present','current','teamN','sort'])$('#'+id).addEventListener(id==='q'?'input':'change',filters);$('#go').onclick=scan;$('#pause').onclick=()=>{stop=true;$('#pause').disabled=true};$('#all').onclick=()=>{showAll=!showAll;$('#all').textContent=showAll?'Recent 15':'All years';render()};$('#clear').onclick=()=>{for(const id of ['q','pos','team','year','teamN'])$('#'+id).value='';$('#present').checked=$('#current').checked=false;filters()};$('#reset').onclick=()=>confirm('Delete local timeline cache?')&&indexedDB.deleteDatabase(DB)&&location.reload();$('#wrap').onscroll=()=>requestAnimationFrame(render);
(async()=>{await initSeasons();for(const id of ['from','to'])$('#'+id).innerHTML=seasons.map(y=>`<option>${y}</option>`).join('');$('#from').value=cur;$('#to').value=seasons.at(-1);for(const t of await all('t'))T.set(t.key,t);for(const p of await all('p'))P.set(p.id,p);filters();$('#status').textContent=`Ready • ${P.size} cached players`})()
</script></body></html>
