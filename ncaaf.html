<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>NCAA Football Hub</title>
<style>
:root{color-scheme:dark;--bg:#060b12;--panel:#0d1623;--panel2:#121e2e;--line:#24344b;--text:#f4f7fb;--muted:#91a2b8;--accent:#f4b400;--green:#35d07f;--red:#ff6b6b;--blue:#59a7ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{background:radial-gradient(circle at 10% 0,#183a6550,transparent 35%),var(--bg)}
button,select,input{font:inherit;color:inherit}.shell{width:min(1500px,calc(100% - 24px));margin:auto;padding:18px 0 40px}
.topbar{position:sticky;top:0;z-index:20;margin:-18px -12px 14px;padding:14px 12px 10px;background:#060b12ee;backdrop-filter:blur(14px);border-bottom:1px solid #182538}
.titleline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px}.ball{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#a74b21,#6c2d14);display:grid;place-items:center;font-size:19px}.titleline h1{font-size:25px;margin:0}.sub{color:var(--muted);font-size:12px}.spacer{flex:1}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.controls select,.controls input,.btn{background:#101c2b;border:1px solid var(--line);border-radius:9px;padding:8px 10px}.controls input{min-width:190px}.btn{cursor:pointer}.btn:hover{border-color:#48617e}.btn.active{background:var(--accent);color:#101010;border-color:var(--accent);font-weight:800}.btn.primary{background:var(--accent);border-color:var(--accent);color:#111;font-weight:900}
.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 10px}.tabs button{border:1px solid var(--line);background:#0e1723;border-radius:999px;padding:8px 13px;white-space:nowrap;cursor:pointer}.tabs button.active{background:#f4b400;color:#111;border-color:#f4b400;font-weight:900}.uxbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 10px}.chip{border:1px solid var(--line);background:#0e1723;color:#c9d5e5;border-radius:999px;padding:7px 10px;font-size:11px;cursor:pointer}.chip.active{background:#f4b400;color:#111;border-color:#f4b400;font-weight:900}.uxbar select{background:#101c2b;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:11px}.daygroup{margin:14px 0 18px}.dayhead{display:flex;align-items:center;gap:10px;margin:0 0 8px;color:#d9e3f0;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}.dayhead:after{content:"";height:1px;background:#203049;flex:1}.weeknav{display:inline-flex;align-items:center;gap:5px}.weeknav button{width:32px;height:32px;padding:0;border:1px solid var(--line);background:#101c2b;border-radius:8px;cursor:pointer}.favbtn{border:0;background:transparent;color:#697b92;font-size:15px;cursor:pointer;padding:2px 5px;border-radius:6px}.favbtn:hover{background:#1a283b;color:#ffd45c}.favbtn.on{color:#ffd45c}.skeleton{position:relative;overflow:hidden;background:#111d2b;border:1px solid var(--line);border-radius:13px;height:126px}.skeleton:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#ffffff0a,transparent);animation:shimmer 1.2s infinite}@keyframes shimmer{100%{transform:translateX(100%)}}body.compact .game{padding:8px}body.compact .team{padding:3px 0}body.compact .team img{width:23px;height:23px}body.compact .score{font-size:17px}body.compact .gamefoot{margin-top:5px;padding-top:5px}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:4px 0 12px}.metric{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:11px}.metric b{font-size:21px}.metric span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.status{min-height:22px;color:var(--muted);font-size:12px;padding:3px 1px}.error{color:#ff8c87}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.game{background:linear-gradient(180deg,#121e2e,#0c1521);border:1px solid var(--line);border-radius:13px;padding:11px;cursor:pointer;transition:.14s}.game:hover{transform:translateY(-1px);border-color:#405675}.game.live{border-color:#2a8156;box-shadow:0 0 0 1px #35d07f20 inset}.gamehead{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;margin-bottom:8px}.livepill{color:#69eaa1;font-weight:900}.finalpill{color:#aebbd0}.team{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:5px 0}.team img{width:27px;height:27px;object-fit:contain}.teamname{min-width:0}.teamname strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.teamname span{font-size:10px;color:var(--muted)}.score{font-size:20px;font-weight:900}.winner .teamname strong,.winner .score{color:#fff}.loser{opacity:.72}.gamefoot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #1d2a3d;margin-top:7px;padding-top:7px;color:var(--muted);font-size:10px}.gameflags{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 2px}.flag{display:inline-flex;align-items:center;gap:4px;border:1px solid #33465e;background:#111d2b;color:#c9d5e5;border-radius:999px;padding:3px 6px;font-size:9px;font-weight:900;letter-spacing:.03em}.flag.redzone{border-color:#a33;background:#3a1115;color:#ff9b9b;animation:redPulse 1.15s ease-in-out infinite}.flag.close{border-color:#9a6d19;background:#2f2510;color:#ffd45c}.flag.twomin{border-color:#376a9d;background:#10243a;color:#8cc7ff}.flag.ot{border-color:#7b4da9;background:#241333;color:#d6a7ff}.poss{width:6px;height:6px;border-radius:50%;background:#35d07f;box-shadow:0 0 0 3px #35d07f20}@keyframes redPulse{0%,100%{box-shadow:0 0 0 0 #ff4d4d20}50%{box-shadow:0 0 0 5px #ff4d4d12}}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:9px 10px;border-bottom:1px solid #1d2b3d;text-align:right;white-space:nowrap;font-size:12px}th{position:sticky;top:0;background:#111c2a;color:#afbdd0;font-size:10px;text-transform:uppercase;letter-spacing:.04em}th:first-child,td:first-child{text-align:left}.rank{font-weight:900;color:#ffd45c}.ath{display:flex;align-items:center;gap:8px}.ath img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#162334;border:1px solid #2d4059}.teamchip{display:inline-flex;align-items:center;gap:5px}.teamchip img{width:20px;height:20px;object-fit:contain}.entityLink{cursor:pointer;border-radius:8px;transition:.12s}.entityLink:hover{background:#1a283b}.ath.entityLink{padding:3px 5px;margin:-3px -5px}.team.entityLink:hover{background:#172538}.teamchip.entityLink{padding:4px 6px;margin:-4px -6px}.profileHero{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;padding:8px 0 16px}.profileHero img{width:96px;height:96px;object-fit:contain;background:#111c2a;border:1px solid var(--line);border-radius:16px}.profileHero.player img{border-radius:50%;object-fit:cover}.profileHero h2{margin:0 0 4px;font-size:25px}.profileMeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid var(--line);background:#101b29;border-radius:999px;padding:5px 8px;font-size:11px;color:#c7d3e3}.profileGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}.profileCard{border:1px solid var(--line);background:#0f1a28;border-radius:11px;padding:10px}.profileCard span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.profileCard b{display:block;margin-top:3px;font-size:14px}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed #33455f;border-radius:12px}
.modal{position:fixed;inset:0;z-index:100;background:#02060bd9;display:none;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.dialog{width:min(1160px,100%);max-height:94vh;overflow:hidden;background:#0a121e;border:1px solid #33465f;border-radius:16px;box-shadow:0 24px 80px #000a;display:flex;flex-direction:column}.dialoghead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.dialoghead h2{font-size:17px;margin:0}.close{margin-left:auto;border:1px solid var(--line);background:#111d2b;border-radius:8px;padding:6px 10px;cursor:pointer}.dialogbody{padding:13px;overflow:auto}.scorehero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:10px 4px 16px}.heroTeam{display:flex;align-items:center;gap:10px}.heroTeam.right{justify-content:flex-end;text-align:right}.heroTeam img{width:54px;height:54px;object-fit:contain}.bigscore{font-size:34px;font-weight:950;text-align:center}.detailtabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.detailtabs button{padding:7px 10px;border:1px solid var(--line);background:#0f1b29;border-radius:8px;cursor:pointer;white-space:nowrap}.detailtabs button.active{background:#f4b400;color:#111;border-color:#f4b400;font-weight:900}.section{margin:12px 0}.section h3{font-size:13px;margin:0 0 7px;color:#dce6f5}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{border:1px solid var(--line);border-radius:10px;overflow:auto}.mini table{min-width:540px}.leadersbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.leadersbar button{background:#101c2b;border:1px solid var(--line);padding:7px 9px;border-radius:8px;cursor:pointer}.leadersbar button.active{background:#f4b400;color:#111;font-weight:900}.progress{height:3px;background:#192536;overflow:hidden;border-radius:99px;margin:5px 0}.progress>i{display:block;height:100%;background:#f4b400;width:0;transition:.2s}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.shell{width:100%;padding:8px 10px 28px}.topbar{margin:-8px -10px 8px;padding:10px}.titleline h1{font-size:18px}.brand .sub{display:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px}.controls label{font-size:10px}.controls select{width:100%;display:block;margin-top:3px}.controls input,.controls #refresh{grid-column:1/-1;width:100%;min-width:0}.tabs,.uxbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tabs button,.uxbar>*{flex:0 0 auto}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr);gap:5px}.metric{padding:8px}.metric b{font-size:17px}.twocol{grid-template-columns:1fr}.scorehero{gap:6px}.heroTeam img{width:34px;height:34px}.bigscore{font-size:23px}.dialog{width:100%;height:100dvh;max-height:100dvh;border-radius:0}.modal{padding:0}.tablewrap{margin:0 -10px;border-radius:0}.extraControls{overflow-x:auto;flex-wrap:nowrap!important}.mapFrame{height:58vh!important}}.extraControls{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.extraControls select,.extraControls input{background:#101c2b;border:1px solid var(--line);border-radius:9px;padding:8px}.mapFrame{width:100%;height:560px;border:1px solid var(--line);border-radius:12px;background:#0d1623}.sorthead{cursor:pointer}.sorthead:hover{color:#fff}

/* Readability pass */
body{font-size:15px}.sub,.status{font-size:13px}.controls label{font-size:12px}.controls select,.controls input,.btn{font-size:14px}
.tabs button{font-size:13px}.chip,.uxbar select{font-size:12px}.gamehead,.gamefoot{font-size:12px}.teamname strong{font-size:15px}.teamname span{font-size:12px}
.flag{font-size:10px}.metric span{font-size:11px}th{font-size:11px}td{font-size:13px}.profileCard span{font-size:10px}.profileCard b{font-size:15px}.pill{font-size:12px}
.playerDataTabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px}.playerDataTabs button{border:1px solid var(--line);background:#101c2b;border-radius:8px;padding:8px 11px;white-space:nowrap;cursor:pointer}.playerDataTabs button.active{background:var(--accent);color:#111;font-weight:900}
.playerSeasonBar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.playerSeasonBar select{background:#101c2b;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
@media(max-width:650px){body{font-size:15px}.sub,.status{font-size:12px}.teamname strong{font-size:15px}.teamname span,.gamehead,.gamefoot{font-size:11px}td{font-size:13px}th{font-size:11px}.chip{font-size:12px;padding:8px 11px}.tabs button{font-size:13px;padding:9px 13px}.profileGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="shell">
  <div class="topbar">
    <div class="titleline">
      <div class="brand"><div class="ball">🏈</div><div><h1>NCAA Football Hub</h1><div class="sub">FBS games · box scores · stats · weekly leaders · ESPN data</div></div></div>
      <div class="spacer"></div><a class="btn" href="./index.html" style="text-decoration:none">Sports Home</a>
    </div>
    <div class="controls">
      <label>Season <select id="season"></select></label>
      <label>Type <select id="seasonType"><option value="2">Regular Season</option><option value="3">Postseason</option></select></label>
      <label>Week <select id="week"></select></label>
      <label>Conference <select id="conference"><option value="">All FBS</option></select></label>
      <input id="search" placeholder="Search team / game">
      <button class="btn primary" id="refresh">Refresh</button>
    </div>
    <div class="progress"><i id="progress"></i></div>
  </div>

  <nav class="tabs"><button data-view="games" class="active">Games</button><button data-view="standings">Standings</button><button data-view="teamcompare">Team Stats</button><button data-view="travel">Conference Map</button><button data-view="leaders">Weekly Leaders</button></nav>
  <div class="uxbar" id="uxbar">
    <div class="weeknav"><button id="prevWeek" title="Previous week">‹</button><button id="nextWeek" title="Next week">›</button></div>
    <button class="chip" data-qf="live">Live</button>
    <button class="chip" data-qf="close">Close</button>
    <button class="chip" data-qf="redzone">Red Zone</button>
    <button class="chip" data-qf="ranked">Ranked</button><button class="chip" data-qf="top25">Top 25</button>
    <button class="chip" data-qf="favorites">★ Favorites</button>
    <select id="sortGames" title="Sort games"><option value="time">Sort: Kickoff</option><option value="close">Sort: Closest</option><option value="ranked">Sort: Ranked</option></select>
    <button class="chip" id="currentWeek">Current Week</button><button class="chip" id="density">Compact</button>
    <button class="chip" id="autoRefresh">Auto Refresh</button>
    <button class="chip" id="resetFilters">Reset</button>
  </div>
  <section id="metrics" class="metrics"></section>
  <div id="status" class="status"></div>
  <section id="content"></section>
</main>

<div id="modal" class="modal"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle">Game</h2><button id="closeModal" class="close">Close</button></div><div id="modalBody" class="dialogbody"></div></div></div>
<div id="entityModal" class="modal" style="z-index:120"><div class="dialog" style="width:min(900px,100%)"><div class="dialoghead"><h2 id="entityTitle">Profile</h2><button id="closeEntity" class="close">Close</button></div><div id="entityBody" class="dialogbody"></div></div></div>

<script>
'use strict';
const BASE='https://site.api.espn.com/apis/site/v2/sports/football/college-football';
const FBS_GROUP=80;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={view:'games',games:[],filtered:[],summaryCache:new Map(),weeklyRows:[],leaderMetric:'passYds',loadToken:0,playerCache:new Map(),teamCache:new Map(),playerContext:new Map(),teamContext:new Map(),quickFilter:'',sort:'time',favorites:new Set(JSON.parse(localStorage.getItem('ncaafFavTeams')||'[]')),compact:localStorage.getItem('ncaafCompact')==='1',autoRefresh:false,autoTimer:null,extraCache:new Map(),teamCompareRows:[],extraLoading:false};
const confIds={ACC:'1','American':'151','Big 12':'4','Big Ten':'5','Conference USA':'12','MAC':'15','Mountain West':'17','Pac-12':'9','SEC':'8','Sun Belt':'37','Independents':'18'};
const leaderDefs={
  passYds:{label:'Passing Yards',cat:['passing'],stat:['YDS']},
  passTD:{label:'Passing TD',cat:['passing'],stat:['TD']},
  rushYds:{label:'Rushing Yards',cat:['rushing'],stat:['YDS']},
  rushTD:{label:'Rushing TD',cat:['rushing'],stat:['TD']},
  recYds:{label:'Receiving Yards',cat:['receiving'],stat:['YDS']},
  recTD:{label:'Receiving TD',cat:['receiving'],stat:['TD']},
  receptions:{label:'Receptions',cat:['receiving'],stat:['REC']},
  tackles:{label:'Tackles',cat:['defensive','defense'],stat:['TOT','TOTAL']},
  sacks:{label:'Sacks',cat:['defensive','defense'],stat:['SACKS','SACK']},
  interceptions:{label:'Interceptions',cat:['interceptions','defensive','defense'],stat:['INT']}
};
function currentSeason(){const d=new Date();return d.getMonth()<6?d.getFullYear()-1:d.getFullYear()}
function init(){
  const now=currentSeason(),savedSeason=localStorage.getItem('ncaafSeason')||String(now);
  $('season').innerHTML=Array.from({length:27},(_,i)=>now-i).map(y=>'<option '+(String(y)===savedSeason?'selected':'')+'>'+y+'</option>').join('');
  $('week').innerHTML=Array.from({length:18},(_,i)=>'<option value="'+(i+1)+'">Week '+(i+1)+'</option>').join('');
  $('week').value=localStorage.getItem('ncaafWeek')||guessWeek();
  $('conference').innerHTML='<option value="">All FBS</option>'+Object.entries(confIds).map(([n,id])=>'<option value="'+id+'">'+esc(n)+'</option>').join('');
  document.body.classList.toggle('compact',state.compact);$('density').classList.toggle('active',state.compact);bind();loadGames();
}
function guessWeek(){const d=new Date(),y=d.getFullYear(),start=new Date(y,7,22);return String(Math.max(1,Math.min(18,Math.floor((d-start)/604800000)+1)))}
function bind(){
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render();if(state.view==='leaders'&&!state.weeklyRows.length)loadWeeklyLeaders();if(['standings','teamcompare','travel'].includes(state.view))loadExtraView()});
  $('season').onchange=()=>{localStorage.setItem('ncaafSeason',$('season').value);state.weeklyRows=[];loadGames()};
  $('seasonType').onchange=()=>{state.weeklyRows=[];loadGames()};
  $('week').onchange=()=>{localStorage.setItem('ncaafWeek',$('week').value);state.weeklyRows=[];loadGames()};
  $('conference').onchange=applyFilters;$('search').oninput=applyFilters;$('refresh').onclick=()=>{state.summaryCache.clear();state.weeklyRows=[];loadGames(true)};
  $('closeModal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
  $('closeEntity').onclick=()=>$('entityModal').classList.remove('open');$('entityModal').onclick=e=>{if(e.target===$('entityModal'))$('entityModal').classList.remove('open')};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('entityModal').classList.contains('open'))$('entityModal').classList.remove('open');else $('modal').classList.remove('open')}});
  document.body.addEventListener('click',e=>{
    const fav=e.target.closest('[data-fav]');if(fav){e.preventDefault();e.stopPropagation();toggleFavorite(fav.dataset.fav);return}
    const entity=e.target.closest('[data-player],[data-team]');if(!entity)return;e.preventDefault();e.stopPropagation();if(entity.dataset.player)openPlayer(entity.dataset.player);else if(entity.dataset.team)openTeam(entity.dataset.team)
  });
  document.querySelectorAll('[data-qf]').forEach(b=>b.onclick=()=>{state.quickFilter=state.quickFilter===b.dataset.qf?'':b.dataset.qf;syncQuickFilterButtons();applyFilters()});
  $('sortGames').onchange=()=>{state.sort=$('sortGames').value;render()};
  $('density').onclick=()=>{state.compact=!state.compact;localStorage.setItem('ncaafCompact',state.compact?'1':'0');document.body.classList.toggle('compact',state.compact);$('density').classList.toggle('active',state.compact)};
  $('prevWeek').onclick=()=>changeWeek(-1);$('nextWeek').onclick=()=>changeWeek(1);$('currentWeek').onclick=jumpCurrentWeek;
  $('resetFilters').onclick=resetFilters;
  $('autoRefresh').onclick=toggleAutoRefresh;
  document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='/'){e.preventDefault();$('search').focus()}else if(e.key==='ArrowLeft')changeWeek(-1);else if(e.key==='ArrowRight')changeWeek(1)});
}
async function api(url,force=false){const key='ncaaf:'+url;try{if(!force){const c=JSON.parse(sessionStorage.getItem(key)||'null');if(c&&Date.now()-c.t<300000)return c.v}}catch{}const r=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw Error('ESPN HTTP '+r.status);const j=await r.json();try{sessionStorage.setItem(key,JSON.stringify({t:Date.now(),v:j}))}catch{}return j}
function scoreboardUrl(){return BASE+'/scoreboard?groups='+FBS_GROUP+'&limit=1000&dates='+$('season').value+'&seasontype='+$('seasonType').value+'&week='+$('week').value}
async function loadGames(force=false){
  const token=++state.loadToken;$('status').textContent='Loading all FBS games from ESPN…';$('progress').style.width='30%';showSkeletons();
  try{const j=await api(scoreboardUrl(),force);if(token!==state.loadToken)return;state.games=(j.events||[]).map(normalizeGame).filter(Boolean).sort((a,b)=>a.date-b.date);$('progress').style.width='100%';setTimeout(()=>$('progress').style.width='0',350);applyFilters();$('status').textContent='ESPN · '+state.games.length+' FBS games loaded for '+$('season').value+' Week '+$('week').value+'.';if(state.view==='leaders')loadWeeklyLeaders()}
  catch(e){$('progress').style.width='0';$('status').innerHTML='<span class="error">Could not load ESPN scoreboard: '+esc(e.message)+'</span>';$('content').innerHTML='<div class="empty">No games available.</div>'}
}
function normalizeGame(e){
  const c=e.competitions?.[0],comps=c?.competitors;if(!c||!comps?.length)return null;const home=comps.find(x=>x.homeAway==='home')||comps[0],away=comps.find(x=>x.homeAway==='away')||comps[1];
  const team=x=>({id:x.team?.id,name:x.team?.displayName||x.team?.name,short:x.team?.shortDisplayName||x.team?.name,abbr:x.team?.abbreviation,logo:x.team?.logo,score:Number(x.score||0),winner:!!x.winner,rank:x.curatedRank?.current<99?x.curatedRank.current:null,records:(x.records||[]).find(r=>r.type==='total')?.summary||'',conferenceId:String(x.team?.conferenceId||'')});
  const sit=c.situation||{},period=Number(e.status?.period||c.status?.period||0),clock=e.status?.displayClock||c.status?.displayClock||'',possessionId=String(sit.possession||sit.possessionId||'');

}
function applyFilters(){
  const q=$('search').value.trim().toLowerCase(),cid=$('conference').value;
  state.filtered=state.games.filter(g=>{
    if(q&&![g.name,g.home.name,g.away.name,g.home.abbr,g.away.abbr].join(' ').toLowerCase().includes(q))return false;
    if(cid&&g.home.conferenceId!==cid&&g.away.conferenceId!==cid)return false;
    if(state.quickFilter==='live'&&g.status!=='in')return false;
    if(state.quickFilter==='close'&&!(g.status==='in'&&Math.abs(g.home.score-g.away.score)<=8))return false;
    if(state.quickFilter==='redzone'&&!(g.status==='in'&&g.isRedZone))return false;
    if(state.quickFilter==='ranked'&&!(g.home.rank||g.away.rank))return false;if(state.quickFilter==='top25'&&!((g.home.rank&&g.home.rank<=25)||(g.away.rank&&g.away.rank<=25)))return false;
    if(state.quickFilter==='favorites'&&!state.favorites.has(String(g.home.id))&&!state.favorites.has(String(g.away.id)))return false;
    return true
  });
  render();
}

}

function gameFlags(g){

  if(g.isRedZone)flags.push('<span class="flag redzone">🔴 RED ZONE</span>');

  else if(diff<=8)flags.push('<span class="flag close">⚡ ONE SCORE</span>');
  const sec=parseClockSeconds(g.clock);
  if((g.period===2||g.period===4)&&sec>=0&&sec<=120)flags.push('<span class="flag twomin">⏱ 2-MIN</span>');

function norm(s){return String(s||'').toLowerCase().replace(/[^a-z]/g,'')}
function num(v){if(v==null)return 0;const s=String(v).replace(/,/g,'');if(s.includes('/'))return Number(s.split('/')[0])||0;const m=s.match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):0}
function statIndex(labels,wants){const n=labels.map(x=>String(x).toUpperCase().replace(/[^A-Z]/g,''));for(const w of wants){const x=String(w).toUpperCase().replace(/[^A-Z]/g,'');let i=n.indexOf(x);if(i>=0)return i}return -1}
function extractLeaderRows(summary){
  const out=[];for(const tp of summary.boxscore?.players||[]){const team=tp.team||{};for(const cat of tp.statistics||[]){const c=norm(cat.name||cat.displayName);for(const [metric,d] of Object.entries(leaderDefs)){if(!d.cat.some(x=>c.includes(norm(x))))continue;const idx=statIndex(cat.labels||[],d.stat);if(idx<0)continue;for(const a of cat.athletes||[]){const value=num(a.stats?.[idx]);if(value<=0)continue;const ath=rememberPlayer(a.athlete||{},team);rememberTeam(team);out.push({metric,value,id:ath?.id||ath?.uid||ath?.displayName,name:ath?.displayName||ath?.shortName||'Unknown',head:playerHead(ath),position:ath?.position?.abbreviation||'',teamId:team.id||'',team:team.abbreviation||team.shortDisplayName||team.displayName||'',teamLogo:team.logo||''})}}}}return out
}
async function loadWeeklyLeaders(){
  const completed=state.games.filter(g=>g.completed);if(!completed.length){state.weeklyRows=[];renderLeaders();$('status').textContent='No completed games yet for this week, so weekly leaders cannot be calculated.';return}
  const token=state.loadToken;$('status').textContent='Calculating weekly leaders from '+completed.length+' completed ESPN box scores…';const agg=new Map();let done=0;const queue=[...completed];
  const worker=async()=>{while(queue.length){const g=queue.shift();try{const s=await getSummary(g.id);for(const r of extractLeaderRows(s)){const k=r.metric+'|'+r.id;const old=agg.get(k);if(old){old.value+=r.value;old.games++}else agg.set(k,{...r,games:1})}}catch{}done++;$('progress').style.width=Math.round(done/completed.length*100)+'%'}};
  await Promise.all(Array.from({length:Math.min(10,completed.length)},worker));if(token!==state.loadToken)return;state.weeklyRows=[...agg.values()];$('progress').style.width='100%';setTimeout(()=>$('progress').style.width='0',350);$('status').textContent='Weekly leaders calculated from '+done+' completed FBS games · '+state.weeklyRows.length+' player/category rows.';renderLeaders();
}
async function hydrateVisiblePlayerImages(){
  const imgs=[...document.querySelectorAll('img[data-athlete-img]')];
  if(!imgs.length)return;
  const queue=imgs.filter(img=>!img.dataset.hydrated);
  const worker=async()=>{while(queue.length){const img=queue.shift();if(!img)continue;img.dataset.hydrated='1';const id=img.dataset.athleteImg;if(!id)continue;
    const current=state.playerContext.get(String(id))||{};
    const usable=current?.headshot?.href;
    if(usable){img.src=usable;img.style.visibility='visible';continue}
    try{
      let data=state.playerCache.get(String(id));
      if(!data){data=await firstJson([
        'https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/athletes/'+encodeURIComponent(id),
        'https://site.web.api.espn.com/apis/common/v3/sports/football/college-football/athletes/'+encodeURIComponent(id)
      ]);state.playerCache.set(String(id),data)}
      const a=data?.athlete||data||{},url=a.headshot?.href||a.headshot||a.images?.[0]?.href||'';
      if(url){img.src=url;img.style.visibility='visible';rememberPlayer({...current,...a},current._team)}
    }catch{}
  }};
  await Promise.all(Array.from({length:Math.min(8,queue.length)},worker))
}

async function jumpCurrentWeek(){
  const now=new Date(),season=currentSeason();
  if(String($('season').value)!==String(season)){$('season').value=String(season);localStorage.setItem('ncaafSeason',String(season))}
  $('seasonType').value='2';$('status').textContent='Finding the current ESPN week…';
  let week=Number(guessWeek());

    const cal=await api(BASE+'/calendar?dates='+season+'&seasontype=2',true);
    const items=Array.isArray(cal)?cal:(cal.calendar||cal.leagues?.[0]?.calendar||[]);
    const hit=items.find(x=>{const a=new Date(x.startDate||x.start),b=new Date(x.endDate||x.end);return !isNaN(a)&&!isNaN(b)&&now>=a&&now<=b});
    const n=Number(hit?.value||hit?.week?.number||hit?.number);if(n>=1&&n<=18)week=n

}

function renderPlayerProfile(base,data,loading){
  const sb=data?.seasonBio||{},a=data?.athlete||data||base||{},team=base._team||sb.team||a.team||{},name=sb.displayName||a.displayName||a.fullName||base.displayName||'Player',head=playerHead({...base,...a,...sb});
  const pos=sb.position?.displayName||sb.position?.abbreviation||a.position?.displayName||a.position?.abbreviation||base.position?.displayName||base.position?.abbreviation||'',jersey=sb.jersey||a.jersey||base.jersey||'',height=sb.displayHeight||a.displayHeight||a.height||'',weight=sb.displayWeight||a.displayWeight||a.weight||'',exp=sb.experience||a.experience||{},year=exp.displayValue||exp.name||exp.abbreviation||sb.class||a.class||a.year||'',bp=sb.birthPlace||a.birthPlace||{},hometown=[bp.city,bp.state,bp.country].filter(Boolean).join(', ');
  if(team?.id)rememberTeam(team);
  $('entityTitle').textContent=name;
  return '<div class="profileHero player">'+(head?'<img src="'+esc(head)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'<div></div>')+'<div><h2>'+esc(name)+'</h2><div class="sub">'+esc([pos,jersey?'#'+jersey:''].filter(Boolean).join(' · '))+'</div><div class="profileMeta">'+(team?.id?'<span class="pill entityLink" data-team="'+esc(team.id)+'">'+esc(team.displayName||team.shortDisplayName||team.name||team.abbreviation||'Team')+'</span>':'')+(year?'<span class="pill">'+esc(year)+'</span>':'')+'</div></div></div>'+
  '<div class="profileGrid">'+[['Position',pos],['Year',year],['Hometown',hometown],['Jersey',jersey?('#'+jersey):''],['Height',height],['Weight',weight],['Status',sb.status?.name||sb.status?.type||a.status?.name||a.status?.type||'']].map(([k,v])=>'<div class="profileCard"><span>'+k+'</span><b>'+esc(profileValue(v))+'</b></div>').join('')+'</div>'+
  (loading?'<div class="sub">Loading additional ESPN player data…</div>':'')
}
async function fetchAllPlayerEvents(id,season){
  const base='https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/'+season+'/athletes/'+encodeURIComponent(id)+'/eventlog';
  const first=await api(base+'?limit=100&page=1');
  const ev=first.events||first,items=[...(ev.items||[])],pages=Number(ev.pageCount||first.pageCount||1);
  for(let p=2;p<=pages;p++){try{const j=await api(base+'?limit=100&page='+p),x=j.events||j;items.push(...(x.items||[]))}catch{}}
  return {items,count:Number(ev.count||first.count||items.length)}
}
function playerDataShell(id,season){
  const opts=Array.from({length:6},(_,i)=>season-i).map(y=>'<option value="'+y+'">'+y+'</option>').join('');
  return '<div class="section"><div class="playerSeasonBar"><b>Season</b><select id="playerSeason">'+opts+'</select></div><div class="playerDataTabs"><button class="active" data-pview="gamelog">Game Log</button><button data-pview="stats">Season Stats</button><button data-pview="history">Prior Seasons</button></div><div id="playerDataPane"><div class="empty">Loading player game log…</div></div></div>'
}
function wirePlayerData(id,season){
  const sel=$('playerSeason');if(sel)sel.value=String(season);
  let view='gamelog';
  const load=async()=>{document.querySelectorAll('[data-pview]').forEach(b=>b.classList.toggle('active',b.dataset.pview===view));await loadPlayerData(id,Number(sel?.value||season),view)};
  document.querySelectorAll('[data-pview]').forEach(b=>b.onclick=()=>{view=b.dataset.pview;load()});
  if(sel)sel.onchange=load;load()
}
async function loadPlayerData(id,season,view){
  const pane=$('playerDataPane');if(!pane)return;pane.innerHTML='<div class="empty">Loading '+esc(String(season))+' '+esc(view)+'…</div>';
  try{
    if(view==='gamelog'){
      let j=await api('https://site.web.api.espn.com/apis/common/v3/sports/football/college-football/athletes/'+encodeURIComponent(id)+'/gamelog?season='+season);
      const webRows=Array.isArray(j?.events)?j.events:Object.values(j?.events||{});if(!webRows.length){const all=await fetchAllPlayerEvents(id,season);j={items:all.items}}
      pane.innerHTML=renderPlayerGamelog(j)
    }else if(view==='stats'){
      const j=await firstJson([
        'https://site.web.api.espn.com/apis/common/v3/sports/football/college-football/athletes/'+encodeURIComponent(id)+'/stats?season='+season+'&seasontype=2',
        'https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/'+season+'/athletes/'+encodeURIComponent(id)+'/statistics'
      ]);
      pane.innerHTML=renderPlayerSeasonStats(j)
    }else{
      const years=Array.from({length:5},(_,i)=>season-i),blocks=[];
      for(const y of years){try{const j=await firstJson([
        'https://site.web.api.espn.com/apis/common/v3/sports/football/college-football/athletes/'+encodeURIComponent(id)+'/stats?season='+y+'&seasontype=2',
        'https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/'+y+'/athletes/'+encodeURIComponent(id)+'/statistics'
      ]);blocks.push('<div class="section"><h3>'+y+'</h3>'+renderPlayerSeasonStats(j)+'</div>')}catch{}}
      pane.innerHTML=blocks.join('')||'<div class="empty">No prior-season statistics were returned by ESPN.</div>'
    }
  }catch(e){pane.innerHTML='<div class="empty">No '+esc(view)+' data was returned for '+season+'.</div>'}
}
function renderPlayerGamelog(j){
  const labels=j.labels||j.names||[],events=j.events||{},cats=j.categories||[];
  let rows=j.seasonTypes?.flatMap(x=>x.categories||[]).flatMap(x=>x.events||[])||j.games||j.items||[];
  if(!rows.length&&events&&typeof events==='object')rows=Object.entries(events).map(([id,e])=>({...e,id}));
  if(!rows.length)return '<div class="empty">No game log was returned for this season.</div>';
  const cols=labels.length?labels.slice(0,12):['Opponent','Result','Stats'];
  return '<div class="tablewrap"><table><thead><tr><th>Game</th>'+cols.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map((r,i)=>{const vals=r.stats||r.statistics||r.values||[];const opp=r.opponent?.displayName||r.opponent?.abbreviation||r.opponent||r.name||r.event?.name||('Game '+(i+1));return '<tr><td><b>'+esc(opp)+'</b></td>'+cols.map((x,k)=>'<td>'+esc(vals[k]?.displayValue??vals[k]?.value??vals[k]??'—')+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'
}
function collectStatCategories(j){
  const out=[];const walk=x=>{if(!x||typeof x!=='object')return;if(Array.isArray(x)){x.forEach(walk);return}if((x.stats||x.statistics)&&x.displayName)out.push(x);for(const [k,v] of Object.entries(x))if(!['athlete','team'].includes(k))walk(v)};walk(j);return out
}
function renderPlayerSeasonStats(j){
  const cats=collectStatCategories(j);if(!cats.length)return '<div class="empty">No season statistics were returned.</div>';
  return cats.slice(0,8).map(cat=>{const stats=cat.stats||cat.statistics||[];return '<div class="section"><h3>'+esc(cat.displayName||cat.name||'Stats')+'</h3><div class="tablewrap"><table><thead><tr>'+stats.map(s=>'<th>'+esc(s.abbreviation||s.shortDisplayName||s.name)+'</th>').join('')+'</tr></thead><tbody><tr>'+stats.map(s=>'<td>'+esc(s.displayValue??s.value??'—')+'</td>').join('')+'</tr></tbody></table></div></div>'}).join('')
}
async function openTeam(id){
  if(!id)return;const base=state.teamContext.get(String(id))||findTeamContext(id)||{};
  $('entityModal').classList.add('open');$('entityTitle').textContent=base.displayName||base.name||base.short||'Team Profile';$('entityBody').innerHTML=renderTeamProfile(base,null,true);
  try{
    let data=state.teamCache.get(String(id));
    if(!data){const season=$('season').value;const [profile,roster]=await Promise.all([
      firstJson([BASE+'/teams/'+encodeURIComponent(id)]).catch(()=>null),
      firstJson([BASE+'/teams/'+encodeURIComponent(id)+'/roster?season='+encodeURIComponent(season)]).catch(()=>null)
    ]);data={profile,roster};state.teamCache.set(String(id),data)}
    $('entityBody').innerHTML=renderTeamProfile(base,data,false);wireTeamRosterContext(data?.roster,base)
  }catch(e){$('entityBody').innerHTML=renderTeamProfile(base,null,false)+'<div class="sub" style="margin-top:10px">Additional ESPN team details were not available.</div>'}
}
function findTeamContext(id){for(const g of state.games){if(String(g.home.id)===String(id))return g.home;if(String(g.away.id)===String(id))return g.away}return null}
function renderTeamProfile(base,data,loading){
  const p=data?.profile?.team||data?.profile||base||{},logoUrl=p.logos?.[0]?.href||p.logo||base.logo||'',name=p.displayName||p.name||base.name||base.short||'Team',abbr=p.abbreviation||base.abbr||'',record=base.records||p.record?.items?.[0]?.summary||'',location=p.location||'',nickname=p.nickname||'',color=p.color?'#'+String(p.color).replace('#',''):'',roster=data?.roster?.athletes||[];
  $('entityTitle').textContent=name;
  let games=state.games.filter(g=>String(g.home.id)===String(base.id||p.id)||String(g.away.id)===String(base.id||p.id));
  return '<div class="profileHero">'+(logoUrl?'<img src="'+esc(logoUrl)+'" alt="">':'<div></div>')+'<div><h2>'+esc(name)+'</h2><div class="sub">'+esc([location,nickname,abbr].filter(Boolean).join(' · '))+'</div><div class="profileMeta">'+(record?'<span class="pill">'+esc(record)+'</span>':'')+(color?'<span class="pill">Team color '+esc(color)+'</span>':'')+'</div></div></div>'+
  '<div class="profileGrid">'+[['Record',record],['Abbreviation',abbr],['Conference',p.conference?.name||p.conferenceName||''],['Roster',roster.length?roster.length+' players':''],['Week',$('week').value],['Games this view',games.length]].map(([k,v])=>'<div class="profileCard"><span>'+k+'</span><b>'+esc(profileValue(v))+'</b></div>').join('')+'</div>'+
  (roster.length?'<div class="section"><h3>Roster</h3><div class="grid">'+roster.slice(0,80).map(x=>{const a=x.athlete||x,head=playerHead(a);rememberPlayer(a,p);return '<div class="metric entityLink" data-player="'+esc(a.id||a.uid||'')+'"><div class="ath">'+(head?'<img src="'+esc(head)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'')+'<div><b style="font-size:13px">'+esc(a.displayName||a.fullName||a.shortName||'Player')+'</b><div class="sub">'+esc([a.position?.abbreviation,a.jersey?'#'+a.jersey:''].filter(Boolean).join(' · '))+'</div></div></div></div>'}).join('')+'</div></div>':'')+
  (loading?'<div class="sub">Loading team profile and roster…</div>':'')
}
function wireTeamRosterContext(roster,base){for(const x of roster?.athletes||[]){const a=x.athlete||x;rememberPlayer(a,roster.team||base)}}

function renderExtraShell(){
  if(state.extraLoading){$('content').innerHTML='<div class="empty">Loading '+esc(state.view)+' data…</div>';return}
  if(!state.teamCompareRows.length){$('content').innerHTML='<div class="empty">Open this view to load season data. It is isolated from the main scoreboard so a failed request cannot break the app.</div>';return}
  if(state.view==='standings')renderSeasonStandings();
  else if(state.view==='teamcompare')renderTeamCompare();
  else if(state.view==='travel')renderTravelMap();
}
async function getConferenceTeamsSafe(cid){
  const key='conf:'+cid+':'+$('season').value;if(state.extraCache.has(key))return state.extraCache.get(key);
  let teams=[];
  const urls=[
    BASE+'/teams?groups='+encodeURIComponent(cid)+'&limit=200',
    'https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/teams?groups='+encodeURIComponent(cid)+'&limit=200'
  ];
  for(const u of urls){try{const j=await api(u);teams=j.sports?.[0]?.leagues?.[0]?.teams||j.teams||[];teams=teams.map(x=>x.team||x).filter(x=>x?.id);if(teams.length)break}catch{}}
  state.extraCache.set(key,teams);return teams
}
async function loadExtraView(force=false){
  if(state.extraLoading)return;state.extraLoading=true;renderExtraShell();
  const cid=$('conference').value||'4',season=$('season').value;
  try{
    let teams=[];
    if($('conference').value)teams=await getConferenceTeamsSafe(cid);
    else{
      const seen=new Map();
      for(const id of Object.values(confIds)){for(const t of await getConferenceTeamsSafe(id))seen.set(String(t.id),t)}
      teams=[...seen.values()]
    }
    if(!teams.length)throw Error('ESPN returned no teams');
    const queue=[...teams],rows=[];let done=0;
    const worker=async()=>{while(queue.length){const t=queue.shift();try{
      const j=await api(BASE+'/teams/'+encodeURIComponent(t.id)+'/schedule?season='+encodeURIComponent(season),force);
      const events=j.events||[];let w=0,l=0,pf=0,pa=0,yf=0,ya=0,away=0,home=0,neutral=0;
      const opponents=[];
      for(const e of events){const comp=e.competitions?.[0],cs=comp?.competitors||[],me=cs.find(x=>String(x.team?.id)===String(t.id)),op=cs.find(x=>String(x.team?.id)!==String(t.id));if(!me||!op)continue;
        if(me.homeAway==='away')away++;else if(comp.neutralSite)neutral++;else home++;
        opponents.push({name:op.team?.displayName||op.team?.name||'',abbr:op.team?.abbreviation||'',away:me.homeAway==='away',date:e.date});
        if(comp.status?.type?.completed){const ms=Number(me.score?.value??me.score??0)||0,os=Number(op.score?.value??op.score??0)||0;pf+=ms;pa+=os;if(ms>os)w++;else l++}
      }
      rows.push({id:String(t.id),name:t.displayName||t.shortDisplayName||t.name||'',abbr:t.abbreviation||'',logo:t.logos?.[0]?.href||t.logo||'',w,l,pf,pa,ppg:(w+l)?pf/(w+l):0,papg:(w+l)?pa/(w+l):0,diff:pf-pa,home,away,neutral,opponents,venue:t.venue||null})
    }catch{}finally{done++;$('progress').style.width=Math.round(done/teams.length*100)+'%'}}};
    await Promise.all(Array.from({length:Math.min(8,teams.length)},worker));
    state.teamCompareRows=rows;$('status').textContent=rows.length+' teams loaded from ESPN season schedules · '+seasonLabel();state.extraLoading=false;$('progress').style.width='0';renderExtraShell()
  }catch(e){state.extraLoading=false;$('content').innerHTML='<div class="empty error">This view could not load: '+esc(e.message)+'</div>'}
}
function renderSeasonStandings(){
  const rows=[...state.teamCompareRows].sort((a,b)=>b.w-a.w||a.l-b.l||b.diff-a.diff);
  $('content').innerHTML='<div class="tablewrap"><table><thead><tr><th>Team</th><th>W</th><th>L</th><th>PF</th><th>PA</th><th>Diff</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td><span class="teamchip entityLink" data-team="'+esc(r.id)+'">'+(r.logo?'<img src="'+esc(r.logo)+'" alt="">':'')+'<b><span class="rank">#'+(i+1)+'</span> '+esc(r.name)+'</b></span></td><td>'+r.w+'</td><td>'+r.l+'</td><td>'+r.pf+'</td><td>'+r.pa+'</td><td>'+r.diff+'</td></tr>').join('')+'</tbody></table></div>'
}
function renderTeamCompare(){
  let rows=[...state.teamCompareRows],sort='ppg',dir=-1;
  $('content').innerHTML='<div class="extraControls"><input id="tcSearch" placeholder="Search teams"><select id="tcSort"><option value="ppg">Points/Game</option><option value="papg">Points Allowed/Game</option><option value="diff">Point Differential</option><option value="w">Wins</option><option value="away">Away Games</option></select></div><div id="tcTable"></div>';
  const draw=()=>{const q=($('tcSearch')?.value||'').toLowerCase();sort=$('tcSort')?.value||sort;rows=[...state.teamCompareRows].filter(r=>(r.name+' '+r.abbr).toLowerCase().includes(q)).sort((a,b)=>(Number(b[sort])-Number(a[sort]))*Math.abs(dir));$('tcTable').innerHTML='<div class="tablewrap"><table><thead><tr><th>Team</th><th>W-L</th><th>PF</th><th>PA</th><th>PPG</th><th>PA/G</th><th>Diff</th><th>Home</th><th>Away</th><th>Neutral</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td><span class="teamchip entityLink" data-team="'+esc(r.id)+'">'+(r.logo?'<img src="'+esc(r.logo)+'" alt="">':'')+'<b><span class="rank">#'+(i+1)+'</span> '+esc(r.name)+'</b></span></td><td>'+r.w+'-'+r.l+'</td><td>'+r.pf+'</td><td>'+r.pa+'</td><td><b>'+fmtVal(r.ppg)+'</b></td><td>'+fmtVal(r.papg)+'</td><td>'+r.diff+'</td><td>'+r.home+'</td><td>'+r.away+'</td><td>'+r.neutral+'</td></tr>').join('')+'</tbody></table></div>'};
  $('tcSearch').oninput=draw;$('tcSort').onchange=draw;draw()
}
function renderTravelMap(){
  const rows=state.teamCompareRows;
  const places=rows.map(r=>encodeURIComponent((r.name||'')+' football stadium')).join('|');
  const q=encodeURIComponent((rows[0]?.name||'college football')+' stadium');
  $('content').innerHTML='<div class="section"><h3>Conference Geography + Travel</h3><div class="sub">Real OpenStreetMap view. Use the table below for each team’s road schedule.</div></div><iframe class="mapFrame" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=-125%2C24%2C-66%2C50&layer=mapnik"></iframe><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Team</th><th>Away</th><th>Home</th><th>Neutral</th><th>Road Schedule</th></tr></thead><tbody>'+rows.sort((a,b)=>b.away-a.away).map(r=>'<tr><td><span class="teamchip entityLink" data-team="'+esc(r.id)+'">'+(r.logo?'<img src="'+esc(r.logo)+'" alt="">':'')+esc(r.name)+'</span></td><td><b>'+r.away+'</b></td><td>'+r.home+'</td><td>'+r.neutral+'</td><td>'+r.opponents.filter(x=>x.away).map(x=>esc(x.abbr||x.name)).join(' → ')+'</td></tr>').join('')+'</tbody></table></div>'
}
function seasonLabel(){return $('season').value+' season'}
init();
</script>
