<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Zone Lab</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui}.w{max-width:1400px;margin:auto;padding:18px}.muted{color:#91a3ba}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}select,button,input{padding:8px;background:#101d31;color:#fff;border:1px solid #31445f;border-radius:8px}button{background:#b42336;font-weight:900}.box,.progress{background:#0e192a;border:1px solid #26364d;border-radius:10px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #26364d;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.hot{color:#ff8795;font-weight:900}.err{color:#ff8b8b}.progress{display:none;padding:10px;margin:10px 0}.progress.on{display:block}.track{height:8px;background:#17243a;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#b42336,#ff8795);width:0;transition:width .25s}.spin{display:inline-block;width:13px;height:13px;border:2px solid #704652;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class=w><h1>🔴 Red Zone Lab</h1><div class=muted>Analyze scoring-area opportunities by week, season, or multi-year range, with selectable 20/10/5-yard zones.</div><div class=controls><select id=scope><option value=season>Season</option><option value=week>Single Week</option><option value=range>Year Range</option></select><select id=year></select><select id=endYear style="display:none"></select><select id=type><option value=2>Regular</option><option value=3>Postseason</option><option value=ALL>Reg + Post</option></select><select id=week style="display:none"></select><select id=zone><option value=20>Inside 20</option><option value=10>Inside 10</option><option value=5>Inside 5</option></select><select id=sort><option value=opp>Opportunities</option><option value=td>Touchdowns</option><option value=rate>TD Rate</option><option value=targets>Targets</option><option value=carries>Carries</option></select><button id=go>Scan</button><input id=q placeholder="Filter player/team"></div><div id=progress class=progress><span class=spin></span> <span id=phase>Preparing…</span><div class=track><div id=fill class=fill></div></div></div><div id=status class=muted>Ready.</div><div class=box style="margin-top:12px"><table id=tbl></table></div></div><script>'use strict';const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl',E=x=>document.getElementById(x),scope=E('scope'),year=E('year'),endYear=E('endYear'),type=E('type'),week=E('week'),zone=E('zone'),sort=E('sort'),go=E('go'),q=E('q'),status=E('status'),tbl=E('tbl'),progress=E('progress'),phase=E('phase'),fill=E('fill');for(let y=new Date().getFullYear();y>=1999;y--){year.add(new Option(y,y));endYear.add(new Option(y,y))}for(let w=1;w<=18;w++)week.add(new Option('Week '+w,w));let rows=[];async function J(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}function prog(t,n=0,d=1){progress.classList.add('on');phase.textContent=t;fill.style.width=`${Math.min(100,100*n/d)}%`}const clean=s=>String(s||'').replace(/^\d+-/,'').replace(/\s+/g,' ').trim(),normTeam=t=>({WAS:'WSH',LA:'LAR',JAC:'JAX'}[String(t||'').toUpperCase()]||String(t||'').toUpperCase());function allPlays(s){let m=new Map,i=0,add=p=>{if(p){let k=String(p.id||p.sequenceNumber||`x${i++}:${p.text||''}`);if(!m.has(k))m.set(k,p)}};for(const d of s.drives?.previous||[])for(const p of d.plays||[])add(p);if(s.drives?.current)for(const p of s.drives.current.plays||[])add(p);for(const p of s.plays||[])add(p);return[...m.values()]}function distanceToGoal(p,off){let d=Number(p.start?.distanceToEndzone);if(Number.isFinite(d))return d;let m=String(p.start?.text||p.start?.yardLine||'').toUpperCase().match(/(?:AT\s+)?([A-Z]{2,4})\s+(\d{1,2})\b/);if(!m)return null;let side=normTeam(m[1]),yard=+m[2];return yard>=0&&yard<=50?(side===off?100-yard:yard):null}function parts(p){let out=[];for(const x of p.participants||p.players||[]){let a=x.athlete||x,n=a.displayName||a.fullName||x.displayName||'';if(n)out.push({name:clean(n),type:String(x.type||x.role||x.participantType||'').toLowerCase()})}return out}function classify(p){let text=clean(p.text),ps=parts(p),td=/touchdown/i.test(text),rush=/\b(rush|scramble|up the middle|left (?:end|tackle|guard)|right (?:end|tackle|guard))\b/i.test(text)&&!/pass/i.test(text),pass=/\bpass\b/i.test(text),complete=pass&&!/incomplete|intercept/i.test(text),name='';if(rush)name=ps.find(x=>/rusher|rush/.test(x.type))?.name||clean((text.match(/^(.+?)\s+(?:up the middle|left (?:end|tackle|guard)|right (?:end|tackle|guard)|rushes|scrambles)/i)||[])[1]);else if(pass)name=ps.find(x=>/receiver|target/.test(x.type))?.name||clean((text.match(/\b(?:pass\s+)?to\s+(.+?)\s+(?:for|is incomplete|at\b|to the\b)/i)||[])[1]);return name?{name,kind:rush?'rush':'target',complete,td}:null}function add(m,name,team,k,complete,td){if(!name||name.length>60)return;let key=team+'|'+name,x=m.get(key)||{name,team,carries:0,targets:0,catches:0,td:0,opp:0};if(k==='rush')x.carries++;else{x.targets++;if(complete)x.catches++}x.opp++;if(td)x.td++;m.set(key,x)}function render(){let s=q.value.toLowerCase(),a=rows.filter(x=>(x.name+' '+x.team).toLowerCase().includes(s)),metric=x=>sort.value==='td'?x.td:sort.value==='rate'?(x.opp?x.td/x.opp:0):sort.value==='targets'?x.targets:sort.value==='carries'?x.carries:x.opp;a.sort((x,y)=>metric(y)-metric(x));tbl.innerHTML='<tr><th>Player</th><th>Team</th><th>Carries</th><th>Targets</th><th>Catches</th><th>TD</th><th>Opps</th><th>TD/Opp</th></tr>'+a.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.team}</td><td>${x.carries}</td><td>${x.targets}</td><td>${x.catches}</td><td class=hot>${x.td}</td><td>${x.opp}</td><td>${x.opp?(100*x.td/x.opp).toFixed(1):'0.0'}%</td></tr>`).join('')}go.onclick=async()=>{go.disabled=true;let m=new Map,unknown=0,unattr=0,fail=0;try{let ys=scope.value==='range'?Array.from({length:Math.abs(+endYear.value-+year.value)+1},(_,i)=>Math.min(+year.value,+endYear.value)+i):[+year.value],types=type.value==='ALL'?[2,3]:[+type.value],tasks=[];for(const y of ys)for(const t of types){let max=t===2?(y>=2021?18:17):5,ws=scope.value==='week'?[+week.value]:Array.from({length:max},(_,i)=>i+1);for(const w of ws)tasks.push({y,t,w})}let events=[];for(let i=0;i<tasks.length;i++){let z=tasks[i];prog(`${z.y} ${z.t===2?'week':'post'} ${z.w}`,i,tasks.length);let s=await J(`${B}/scoreboard?limit=100&dates=${z.y}&seasontype=${z.t}&week=${z.w}`);events.push(...(s.events||[]).filter(e=>e.status?.type?.completed&&+e.season?.year===z.y&&+e.season?.type===z.t))}events=[...new Map(events.map(e=>[e.id,e])).values()];for(let d=0;d<events.length;d++){prog(`Scanning game ${d+1}/${events.length}`,d,events.length);let sm;try{sm=await J(`${B}/summary?event=${events[d].id}`)}catch{fail++;continue}for(const p of allPlays(sm)){let team=normTeam(p.team?.abbreviation||''),dist=distanceToGoal(p,team);if(dist==null){unknown++;continue}if(dist<0||dist>+zone.value)continue;let c=classify(p);if(!c){unattr++;continue}add(m,c.name,team,c.kind,c.complete,c.td)}}rows=[...m.values()];render();prog('Complete',1,1);status.textContent=`${rows.length} players • ${events.length-fail}/${events.length} games • inside ${zone.value} • ${unattr} unattributed • ${unknown} unknown field-position plays`;setTimeout(()=>progress.classList.remove('on'),700)}catch(e){status.innerHTML=`<span class=err>Failed: ${e.message}</span>`;progress.classList.remove('on')}finally{go.disabled=false}};scope.onchange=()=>{week.style.display=scope.value==='week'?'':'none';endYear.style.display=scope.value==='range'?'':'none'};q.oninput=render;sort.onchange=render;</script></body></html>
