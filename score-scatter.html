<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101a"><title>Score Scatter</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#101824;--panel2:#151f2e;--line:#27364b;--text:#f7f9fc;--muted:#8f9db1;--accent:#f4b400;--win:#52d273;--loss:#ff7d7d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}.app{max-width:900px;margin:auto;padding:10px 10px 36px}.head{position:sticky;top:0;z-index:20;padding-bottom:9px;background:linear-gradient(var(--bg) 88%,transparent)}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{margin:0;font-size:21px}.brand a{color:var(--muted);font-size:12px;text-decoration:none}.leagues{display:flex;gap:6px;overflow:auto;padding:10px 0 8px;scrollbar-width:none}.leagues::-webkit-scrollbar{display:none}.league{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900}.league.on{background:var(--accent);border-color:var(--accent);color:#111}.datebar{display:grid;grid-template-columns:48px 1fr 48px;gap:7px}.datebar>button,.datebox{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text)}.datebar>button{font-size:26px;font-weight:950}.datebox{display:flex;align-items:center;justify-content:center;gap:8px}.datebox input{width:130px;border:0;background:transparent;color:var(--text);font-weight:850}.today{border:0;background:transparent;color:var(--accent);font-size:11px;font-weight:900}.status{padding:9px 2px;color:var(--muted);font-size:12px}.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#111b29,#0d1520);overflow:hidden}.legend{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}.legend strong{color:var(--text)}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:7px;border-bottom:1px solid var(--line)}.tools button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 5px;font-size:10px;font-weight:900}.tools button.on{background:#243248;color:var(--text);border-color:#445a78}.tools button:disabled{opacity:.35}.chartwrap{position:relative;width:100%;aspect-ratio:1.05/1;min-height:330px}.chartwrap svg{display:block;width:100%;height:100%}.gridline{stroke:#2a394d;stroke-width:1}.diag{stroke:#66758a;stroke-width:1.5;stroke-dasharray:5 5}.axis{stroke:#8290a2;stroke-width:1.2}.tick{fill:#8f9db1;font-size:12px;font-weight:700}.axislabel{fill:#dbe4ef;font-size:14px;font-weight:900}.zone{font-size:11px;font-weight:900;letter-spacing:.08em;opacity:.42}.zoneWin{fill:rgba(82,210,115,.035)}.zoneLoss{fill:rgba(255,125,125,.035)}.gameLink{stroke:#718198;stroke-width:1.2;opacity:.28}.selectLink{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 0 4px rgba(244,180,0,.6))}.selectRing{fill:none;stroke:var(--accent);stroke-width:2.5}.mateRing{fill:none;stroke:#dbe4ef;stroke-width:2}.logoMark{cursor:pointer;transition:opacity .15s}.logoMark.dim{opacity:.2}.logoMark image{filter:drop-shadow(1px 0 0 rgba(255,255,255,.42)) drop-shadow(-1px 0 0 rgba(255,255,255,.42)) drop-shadow(0 1px 0 rgba(255,255,255,.42)) drop-shadow(0 -1px 0 rgba(255,255,255,.42)) drop-shadow(0 4px 5px rgba(0,0,0,.8))}.abbr{fill:#f7f9fc;font-size:10px;font-weight:950;paint-order:stroke;stroke:#07101a;stroke-width:3px;stroke-linejoin:round}.detail{display:none;padding:10px;border-top:1px solid var(--line);font-size:12px}.detail.show{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.detailSide{display:flex;align-items:center;gap:8px;min-width:0}.detailSide.right{justify-content:flex-end;text-align:right}.detail img{width:40px;height:40px;object-fit:contain}.detail .score{font-size:22px;font-weight:950;white-space:nowrap}.detail small{display:block;color:var(--muted);font-size:9px;font-weight:800}.empty{padding:50px 18px;text-align:center;color:var(--muted)}.hint{text-align:center;color:#607086;font-size:10px;margin-top:11px}.error{color:#ff8b8b}@media(max-width:520px){.app{padding-left:6px;padding-right:6px}.brand h1{font-size:19px}.chartwrap{min-height:315px}.tick{font-size:11px}.axislabel{font-size:13px}.legend{font-size:9px;padding:7px}.league{font-size:11px;padding:8px 11px}.tools button{font-size:9px;padding:8px 3px}.detail{gap:5px;padding:8px 6px}.detail img{width:32px;height:32px}.detail .score{font-size:18px}.detailSide{gap:5px}}
</style></head><body><main class="app"><header class="head"><div class="brand"><h1>Score Scatter</h1><a href="./index.html">Sports Tools</a></div><div id="leagues" class="leagues"></div><div class="datebar"><button id="prev" aria-label="Previous game day">‹</button><div class="datebox"><input id="date" type="date"><button id="today" class="today">TODAY</button></div><button id="next" aria-label="Next game day">›</button></div></header><div id="status" class="status"></div><section id="panel" class="panel"><div class="legend"><span><strong>X</strong> = team points</span><span><strong>Y</strong> = opponent points</span><span>tap = matchup arrow</span></div><div class="tools"><button id="links">ALL LINKS</button><button id="labels">TEAM LABELS</button><button id="clear" disabled>CLEAR PICK</button></div><div id="chart" class="chartwrap"></div><div id="detail" class="detail"></div></section><div class="hint">Each game appears twice as mirrored logos. Tap either team to connect it directly to its opponent.</div></main>
<script>
(()=>{'use strict';
const L=[
{id:'nfl',label:'NFL',sport:'football',league:'nfl'},
{id:'nba',label:'NBA',sport:'basketball',league:'nba'},
{id:'mlb',label:'MLB',sport:'baseball',league:'mlb'},
{id:'nhl',label:'NHL',sport:'hockey',league:'nhl'},
{id:'ncaaf',label:'NCAAF',sport:'football',league:'college-football',groups:'80',college:true},
{id:'ncaam',label:'NCAAM',sport:'basketball',league:'mens-college-basketball',groups:'50',college:true}
],E=id=>document.getElementById(id),els={leagues:E('leagues'),date:E('date'),prev:E('prev'),next:E('next'),today:E('today'),status:E('status'),chart:E('chart'),detail:E('detail'),links:E('links'),labels:E('labels'),clear:E('clear')};
let league=L[0],cache=new Map(),token=0,currentJson=null,currentPoints=[],selectedIndex=null,showLinks=false,showLabels=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),localDate=()=>{let d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,10)},ymd=s=>s.replace(/-/g,'');
els.date.value=localDate();els.leagues.innerHTML=L.map(x=>'<button class="league'+(x===league?' on':'')+'" data-id="'+x.id+'">'+x.label+'</button>').join('');
function url(d){return 'https://site.api.espn.com/apis/site/v2/sports/'+league.sport+'/'+league.league+'/scoreboard?dates='+ymd(d)+'&limit='+(league.college?500:100)+(league.groups?'&groups='+league.groups:'')}
async function get(u){if(cache.has(u))return cache.get(u);let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('ESPN HTTP '+r.status);let j=await r.json();cache.set(u,j);return j}
function score(t){let v=t?.score?.value??t?.score;return Number.isFinite(+v)?+v:0}
function logo(t){return t?.team?.logo||t?.team?.logos?.[0]?.href||''}
function teamName(t){return t?.team?.shortDisplayName||t?.team?.displayName||t?.team?.abbreviation||'Team'}
function abbr(t){return t?.team?.abbreviation||teamName(t).slice(0,4).toUpperCase()}
function pointsFrom(j){let out=[];for(let ev of j.events||[]){let c=ev.competitions?.[0],ts=c?.competitors||[];if(ts.length<2)continue;let active=!!c?.status?.type?.completed||c?.status?.type?.state==='in';if(!active)continue;for(let t of ts){let opp=ts.find(x=>x!==t);out.push({id:String(t.team?.id||t.id||''),eventId:String(ev.id||c.id||''),team:t,opp,pf:score(t),pa:score(opp),event:ev,home:t.homeAway==='home'})}}return out}
function niceMax(points){let raw=Math.max(1,...points.flatMap(p=>[p.pf,p.pa]));let rough=raw/5,mag=Math.pow(10,Math.floor(Math.log10(rough))),n=rough/mag,step=(n<=1?1:n<=2?2:n<=5?5:10)*mag;return {step,max:Math.ceil((raw+step*.45)/step)*step}}
function jitter(points){let seen=new Map();return points.map((p,i)=>{let key=p.pf+'|'+p.pa,n=seen.get(key)||0;seen.set(key,n+1);return {...p,j:n,i}})}
function mateOf(p,pts=currentPoints){return pts.find(q=>q.eventId===p.eventId&&q.i!==p.i)}
function edgeLine(a,b,ra=28,rb=30){let dx=b.cx-a.cx,dy=b.cy-a.cy,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;return{x1:a.cx+ux*ra,y1:a.cy+uy*ra,x2:b.cx-ux*rb,y2:b.cy-uy*rb}}
function render(j=currentJson){if(!j)return;currentJson=j;let pts=jitter(pointsFrom(j));currentPoints=pts;if(selectedIndex!==null&& !pts[selectedIndex])selectedIndex=null;if(!pts.length){els.chart.innerHTML='<div class="empty">No live or completed '+league.label+' games on this date.</div>';els.status.textContent=league.label+' · '+els.date.value+' · 0 plotted teams';els.detail.className='detail';els.clear.disabled=true;return}
let scale=niceMax(pts),W=720,H=650,m={l:66,r:26,t:26,b:60},pw=W-m.l-m.r,ph=H-m.t-m.b,x=v=>m.l+(v/scale.max)*pw,y=v=>H-m.b-(v/scale.max)*ph,ticks=[];for(let v=0;v<=scale.max+.0001;v+=scale.step)ticks.push(v);
for(let p of pts){let off=(p.j%5)*5,ang=(p.j%5)*1.2566;p.cx=x(p.pf)+Math.cos(ang)*off;p.cy=y(p.pa)+Math.sin(ang)*off}
let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(league.label+' team points versus opponent points scatter plot')+'"><defs><clipPath id="plotClip"><rect x="'+m.l+'" y="'+m.t+'" width="'+pw+'" height="'+ph+'"/></clipPath><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7 z" fill="#f4b400"/></marker></defs>';
svg+='<polygon class="zoneWin" points="'+m.l+','+(H-m.b)+' '+(W-m.r)+','+(H-m.b)+' '+(W-m.r)+','+m.t+'"/><polygon class="zoneLoss" points="'+m.l+','+(H-m.b)+' '+m.l+','+m.t+' '+(W-m.r)+','+m.t+'"/>';
for(let v of ticks){svg+='<line class="gridline" x1="'+x(v)+'" y1="'+m.t+'" x2="'+x(v)+'" y2="'+(H-m.b)+'"/><line class="gridline" x1="'+m.l+'" y1="'+y(v)+'" x2="'+(W-m.r)+'" y2="'+y(v)+'"/><text class="tick" x="'+x(v)+'" y="'+(H-m.b+22)+'" text-anchor="middle">'+v+'</text><text class="tick" x="'+(m.l-12)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'}
svg+='<line class="diag" x1="'+x(0)+'" y1="'+y(0)+'" x2="'+x(scale.max)+'" y2="'+y(scale.max)+'"/><line class="axis" x1="'+m.l+'" y1="'+(H-m.b)+'" x2="'+(W-m.r)+'" y2="'+(H-m.b)+'"/><line class="axis" x1="'+m.l+'" y1="'+m.t+'" x2="'+m.l+'" y2="'+(H-m.b)+'"/><text class="axislabel" x="'+(m.l+pw/2)+'" y="'+(H-16)+'" text-anchor="middle">TEAM POINTS</text><text class="axislabel" x="18" y="'+(m.t+ph/2)+'" text-anchor="middle" transform="rotate(-90 18 '+(m.t+ph/2)+')">OPPONENT POINTS</text><text class="zone" x="'+(m.l+pw*.79)+'" y="'+(m.t+ph*.88)+'" text-anchor="middle" fill="#52d273">WINS</text><text class="zone" x="'+(m.l+pw*.21)+'" y="'+(m.t+ph*.12)+'" text-anchor="middle" fill="#ff7d7d">LOSSES</text><g clip-path="url(#plotClip)">';
if(showLinks){let seen=new Set();for(let p of pts){if(seen.has(p.eventId))continue;let q=mateOf(p,pts);if(!q)continue;seen.add(p.eventId);svg+='<line class="gameLink" x1="'+p.cx+'" y1="'+p.cy+'" x2="'+q.cx+'" y2="'+q.cy+'"/>'}}
let selected=selectedIndex===null?null:pts[selectedIndex],mate=selected?mateOf(selected,pts):null;
if(selected&&mate){let ln=edgeLine(selected,mate);svg+='<line class="selectLink" x1="'+ln.x1+'" y1="'+ln.y1+'" x2="'+ln.x2+'" y2="'+ln.y2+'" marker-end="url(#arrow)"/><circle class="selectRing" cx="'+selected.cx+'" cy="'+selected.cy+'" r="27"/><circle class="mateRing" cx="'+mate.cx+'" cy="'+mate.cy+'" r="25"/>'}
for(let p of pts){let isSelected=selected&&p.i===selected.i,isMate=mate&&p.i===mate.i,dim=selected&&!isSelected&&!isMate,size=isSelected?46:isMate?44:40,img=logo(p.team);if(!img)continue;svg+='<g class="logoMark'+(dim?' dim':'')+'" data-point="'+p.i+'" tabindex="0" role="button"><title>'+esc(teamName(p.team)+' '+p.pf+' - '+p.pa+' '+teamName(p.opp))+'</title><image href="'+esc(img)+'" x="'+(p.cx-size/2)+'" y="'+(p.cy-size/2)+'" width="'+size+'" height="'+size+'" preserveAspectRatio="xMidYMid meet"/>'+(showLabels?'<text class="abbr" x="'+p.cx+'" y="'+(p.cy+size/2+12)+'" text-anchor="middle">'+esc(abbr(p.team))+'</text>':'')+'</g>'}
svg+='</g></svg>';els.chart.innerHTML=svg;els.status.textContent=league.label+' · '+els.date.value+' · '+(pts.length/2)+' game'+(pts.length===2?'':'s')+' · '+pts.length+' team points';renderDetail()}
function renderDetail(){let p=selectedIndex===null?null:currentPoints[selectedIndex];if(!p){els.detail.className='detail';els.detail.innerHTML='';els.clear.disabled=true;return}let q=mateOf(p);if(!q){els.detail.className='detail';return}els.clear.disabled=false;els.detail.className='detail show';els.detail.innerHTML='<div class="detailSide">'+(logo(p.team)?'<img src="'+esc(logo(p.team))+'" alt="">':'')+'<div><strong>'+esc(teamName(p.team))+'</strong><small>'+(p.home?'HOME':'AWAY')+' · selected</small></div></div><div class="score">'+p.pf+' → '+q.pf+'</div><div class="detailSide right"><div><strong>'+esc(teamName(q.team))+'</strong><small>'+(q.home?'HOME':'AWAY')+' · opponent</small></div>'+(logo(q.team)?'<img src="'+esc(logo(q.team))+'" alt="">':'')+'</div>'}
function selectPoint(i){selectedIndex=+i;render()}
els.chart.addEventListener('click',e=>{let g=e.target.closest?.('[data-point]');if(g)selectPoint(g.dataset.point)});els.chart.addEventListener('keydown',e=>{let g=e.target.closest?.('[data-point]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectPoint(g.dataset.point)}});
els.links.onclick=()=>{showLinks=!showLinks;els.links.classList.toggle('on',showLinks);render()};els.labels.onclick=()=>{showLabels=!showLabels;els.labels.classList.toggle('on',showLabels);render()};els.clear.onclick=()=>{selectedIndex=null;render()};
async function load(){let mine=++token;selectedIndex=null;els.status.textContent='Loading '+league.label+' · '+els.date.value+'…';els.chart.innerHTML='';try{let j=await get(url(els.date.value));if(mine!==token)return;currentJson=j;render(j)}catch(e){if(mine!==token)return;els.status.innerHTML='<span class="error">'+esc(e.message)+'</span>';els.chart.innerHTML='<div class="empty error">Could not load ESPN scoreboard data.</div>'}}
async function move(n){let mine=++token,d=new Date(els.date.value+'T12:00:00');els.prev.disabled=els.next.disabled=true;els.status.textContent='Finding '+(n<0?'previous':'next')+' '+league.label+' game day…';try{for(let i=0;i<60;i++){d.setDate(d.getDate()+n);let ds=d.toISOString().slice(0,10),j=await get(url(ds));if(mine!==token)return;if(pointsFrom(j).length){els.date.value=ds;selectedIndex=null;currentJson=j;render(j);return}}els.status.textContent='No completed/live '+league.label+' games found within 60 days.'}catch(e){if(mine!==token)return;els.status.innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{els.prev.disabled=els.next.disabled=false}}
els.leagues.onclick=e=>{let b=e.target.closest('[data-id]');if(!b)return;league=L.find(x=>x.id===b.dataset.id);selectedIndex=null;document.querySelectorAll('.league').forEach(x=>x.classList.toggle('on',x===b));load()};els.prev.onclick=()=>move(-1);els.next.onclick=()=>move(1);els.today.onclick=()=>{els.date.value=localDate();load()};els.date.onchange=load;load();
})();
</script></body></html>
