<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Depth Chart Lab</title>
<style>
:root{color-scheme:dark;--bg:#08111d;--p:#0e1a29;--p2:#14243a;--line:#293d59;--muted:#93a6bf;--gold:#f4b400;--green:#7ee787;--red:#ff7b72;--blue:#58a6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1450px;margin:auto;padding:18px}h1{margin:0;font-size:36px}.muted{color:var(--muted)}button,select,input{font:inherit;color:#fff;background:var(--p2);border:1px solid #395270;border-radius:10px;padding:10px}button{cursor:pointer}button.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sports{margin:16px 0 10px}.controls{padding:10px;background:var(--p);border:1px solid var(--line);border-radius:14px}.controls label{display:flex;gap:6px;align-items:center;color:var(--muted)}select{min-width:230px}input{flex:1;min-width:220px}.status{margin:10px 0;padding:11px 13px;background:var(--p);border:1px solid var(--line);border-radius:12px}.status.ok{color:#b9f6c2;border-color:#315d3c}.status.warn{color:#ffe08a;border-color:#6c5b28}.status.error{color:#ffb0aa;border-color:#6b3131}.hero{display:flex;align-items:center;gap:14px;background:var(--p);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.hero img{width:64px;height:64px;object-fit:contain}.hero h2{margin:0}.summary{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:9px;margin:10px 0}.stat{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:11px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}.card{background:var(--p);border:1px solid var(--line);border-radius:13px;overflow:hidden}.card h3{margin:0;padding:11px 12px;background:var(--p2)}.pos{border-top:1px solid var(--line)}.pos h4{margin:0;padding:9px 12px;color:#ffd45c;background:#101c2c}.player{display:grid;grid-template-columns:32px 42px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}.player img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#132238}.rank{text-align:center;font-weight:900}.rank.one{color:var(--green)}.badge{font-size:10px;padding:3px 6px;border:1px solid #435976;border-radius:999px;white-space:nowrap}.name{font-weight:800}.meta{font-size:11px;color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted);background:var(--p);border:1px dashed #3a516d;border-radius:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--p)}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--p2);font-size:11px;text-transform:uppercase;color:#b9c8db}.tiny{width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px}.notice{margin:10px 0;padding:10px 12px;border-left:4px solid var(--blue);background:#101d2d;border-radius:10px;color:#cbd8e8}details{margin-top:10px;background:var(--p);border:1px solid var(--line);border-radius:10px;padding:9px}.debug{font:11px/1.45 ui-monospace,Consolas,monospace;color:#8298b5;white-space:pre-wrap;word-break:break-word}.hide{display:none}@media(max-width:700px){.wrap{padding:12px}.summary{grid-template-columns:1fr 1fr}.controls{align-items:stretch}.controls label{width:100%}select,input{width:100%;min-width:0}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<h1>Depth Chart Lab</h1><div class="muted">Standalone single-file SPA. ESPN rosters are the baseline; true depth data is used only when the provider returns it.</div>
<div id="sports" class="row sports"></div>
<div class="row controls"><label>Team <select id="team"></select></label><button data-mode="auto">Best available</button><button data-mode="depth">Depth chart</button><button data-mode="roster">Roster</button><button data-view="cards">Cards</button><button data-view="table">Table</button><input id="filter" placeholder="Filter player / position"><button id="reload">Refresh</button><button id="testApis">Test APIs</button></div>
<div id="status" class="status">Starting…</div><div id="hero"></div><div id="summary" class="summary hide"></div><div id="notice"></div><div id="out"></div><details><summary>Diagnostics</summary><div id="debug" class="debug"></div></details>
</main>
<script>
'use strict';
const LEAGUES={NFL:{sport:'football',league:'nfl'},NBA:{sport:'basketball',league:'nba'},MLB:{sport:'baseball',league:'mlb'},NHL:{sport:'hockey',league:'nhl'}};
const el=id=>document.getElementById(id),clean=v=>String(v??'').trim(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d=''){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const state={sport:store.get('dcSport','NFL'),mode:store.get('dcMode','auto'),view:store.get('dcView','cards'),teams:[],team:null,model:null,request:0,logs:[]};
if(!LEAGUES[state.sport])state.sport='NFL';if(!['auto','depth','roster'].includes(state.mode))state.mode='auto';if(!['cards','table'].includes(state.view))state.view='cards';
function log(m){state.logs.push(m);if(state.logs.length>120)state.logs.shift();el('debug').textContent=state.logs.join('\n')}
function setStatus(m,t=''){el('status').className='status'+(t?' '+t:'');el('status').textContent=m}
async function api(url,timeout=15000){log('GET '+url);const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);try{const r=await fetch(url,{cache:'no-store',mode:'cors',credentials:'omit',signal:ctrl.signal,headers:{Accept:'application/json'}});log('HTTP '+r.status+' '+url);if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}catch(e){log('ERROR '+(e?.name||'Error')+': '+(e?.message||e));throw e}finally{clearTimeout(timer)}}
function parseTeams(j){return (j?.sports?.[0]?.leagues?.[0]?.teams||j?.teams||[]).map(x=>x.team||x).filter(x=>x?.id||x?.abbreviation)}
function norm(raw,pos=''){const p=raw?.athlete||raw?.player||raw||{};return{id:clean(p.id),name:clean(p.displayName||p.fullName||p.shortName||[p.firstName,p.lastName].filter(Boolean).join(' ')||'Unknown'),jersey:clean(p.jersey||p.number),position:clean(p.position?.abbreviation||p.position?.name||pos),head:clean(p.headshot?.href||p.headshot),status:clean(p.status?.name||p.status?.type||p.status)}}
function parseRoster(j){const src=[j?.athletes,j?.items,j?.team?.athletes,j?.team?.roster?.athletes,j?.roster?.athletes,j?.roster].find(Array.isArray)||[],map=new Map();const add=(name,p)=>{const k=clean(name||p.position||'Roster');if(!map.has(k))map.set(k,[]);map.get(k).push(p)};for(const g of src){if(Array.isArray(g?.items)){const n=typeof g.position==='string'?g.position:(g.position?.name||g.name||g.abbreviation||'Roster');for(const x of g.items){const p=norm(x,n);if(p.name!=='Unknown')add(n,p)}}else{const p=norm(g);if(p.name!=='Unknown')add(p.position||'Roster',p)}}return[...map].map(([name,items])=>({name,items}))}
function depthCharts(j){if(Array.isArray(j?.depthCharts))return j.depthCharts;if(Array.isArray(j?.items))return j.items;if(j?.positions)return[j];return[]}
function parseDepth(j){const groups=[];for(const chart of depthCharts(j)){const raw=chart?.positions||{},entries=Array.isArray(raw)?raw.map((x,i)=>[String(i),x]):Object.entries(raw),positions=[];for(const [key,p] of entries){let aa=p?.athletes||p?.items||[];if(!Array.isArray(aa))aa=Object.values(aa||{});const items=aa.map((x,i)=>({rank:Number(x?.rank??x?.order??i+1)||i+1,player:norm(x,p?.position?.abbreviation||p?.abbreviation||key.toUpperCase())})).filter(x=>x.player.name!=='Unknown');if(items.length)positions.push({name:clean(p?.position?.name||p?.name||key),abbr:clean(p?.position?.abbreviation||p?.abbreviation||key.toUpperCase()),items})}if(positions.length)groups.push({name:clean(chart?.name||chart?.displayName||'Depth Chart'),positions})}return groups}
function renderNav(){el('sports').innerHTML=Object.keys(LEAGUES).map(s=>`<button data-sport="${s}" class="${state.sport===s?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{state.sport=b.dataset.sport;store.set('dcSport',state.sport);renderNav();loadTeams()});document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view))}
function head(p){return p.head||(p.id?`https://a.espncdn.com/i/headshots/${LEAGUES[state.sport].league}/players/full/${p.id}.png`:'')}
function showHero(t,src){el('hero').innerHTML=`<div class="hero"><img src="${esc(t?.logos?.[0]?.href||'')}" alt=""><div><h2>${esc(t?.displayName||t?.name||t?.abbreviation||'Team')}</h2><div class="muted">${esc(state.sport)} · ${esc(src||'')}</div></div></div>`}
function flat(){if(!state.model)return[];if(state.model.kind==='depth')return state.model.groups.flatMap(g=>g.positions.flatMap(p=>p.items.map(x=>({group:g.name,position:p.abbr||p.name,rank:x.rank,player:x.player}))));return state.model.groups.flatMap(g=>g.items.map(p=>({group:g.name,position:p.position||g.name,rank:null,player:p})))}
function playerRow(p,rank){return `<div class="player"><div class="rank ${rank===1?'one':''}">${rank??'•'}</div><img src="${esc(head(p))}" alt="" onerror="this.style.opacity=.15"><div><div class="name">${esc(p.name)}</div><div class="meta">${p.jersey?'#'+esc(p.jersey)+' · ':''}${esc(p.position||'')}${p.status?' · '+esc(p.status):''}</div></div><span class="badge">${rank==null?'Roster':rank===1?'Starter':'Depth '+rank}</span></div>`}
function render(){if(!state.model)return;const q=clean(el('filter').value).toLowerCase(),match=(...v)=>!q||v.some(x=>clean(x).toLowerCase().includes(q)),rows=flat().filter(r=>match(r.group,r.position,r.player.name));el('summary').classList.toggle('hide',!rows.length);if(rows.length)el('summary').innerHTML=`<div class="stat"><b>${rows.length}</b><span>Players</span></div><div class="stat"><b>${new Set(rows.map(r=>r.position).filter(Boolean)).size}</b><span>Positions</span></div><div class="stat"><b>${state.model.kind==='depth'?rows.filter(r=>r.rank===1).length:'—'}</b><span>Top slots</span></div>`;if(state.view==='table'){el('out').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>Rank</th><th>Player</th><th>Position</th><th>Group</th><th>Jersey</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.rank??'—'}</td><td><img class="tiny" src="${esc(head(r.player))}" alt=""><b>${esc(r.player.name)}</b></td><td>${esc(r.position)}</td><td>${esc(r.group)}</td><td>${esc(r.player.jersey||'—')}</td><td>${esc(r.player.status||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No matching players.</div>';return}if(state.model.kind==='roster'){const blocks=state.model.groups.map(g=>{const items=g.items.filter(p=>match(g.name,p.name,p.position));return items.length?`<section class="card"><h3>${esc(g.name)}</h3>${items.map(p=>playerRow(p,null)).join('')}</section>`:''}).join('');el('out').innerHTML=blocks?`<div class="grid">${blocks}</div>`:'<div class="empty">No matching players.</div>';return}const blocks=state.model.groups.map(g=>{const ps=g.positions.map(p=>{const items=p.items.filter(x=>match(p.name,p.abbr,x.player.name,x.player.position));return items.length?`<div class="pos"><h4>${esc(p.abbr||p.name)} · ${esc(p.name)}</h4>${items.map(x=>playerRow(x.player,x.rank)).join('')}</div>`:''}).join('');return ps?`<section class="card"><h3>${esc(g.name)}</h3>${ps}</section>`:''}).join('');el('out').innerHTML=blocks?`<div class="grid">${blocks}</div>`:'<div class="empty">No matching players.</div>'}
async function fetchRoster(team){const c=LEAGUES[state.sport],key=team.id||team.abbreviation,urls=[`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams/${encodeURIComponent(key)}/roster`,`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams/${encodeURIComponent(key)}?enable=roster`];let last;for(const url of urls){try{const j=await api(url),groups=parseRoster(j);if(groups.length)return groups;log('PARSE EMPTY '+url)}catch(e){last=e}}throw last||Error('No roster data returned')}
async function fetchDepth(team){const c=LEAGUES[state.sport],key=team.id||team.abbreviation,urls=[`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams/${encodeURIComponent(key)}/depthcharts`,`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams/${encodeURIComponent(key)}/depth-charts`];let last;for(const url of urls){try{const j=await api(url),groups=parseDepth(j);if(groups.length)return groups;log('PARSE EMPTY '+url)}catch(e){last=e}}throw last||Error('No depth data returned')}
async function loadTeams(){const req=++state.request;state.model=null;state.logs=[];el('debug').textContent='';el('out').innerHTML='';el('summary').classList.add('hide');el('notice').innerHTML='';setStatus('Loading '+state.sport+' teams…');const c=LEAGUES[state.sport];try{const j=await api(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams?limit=100`);if(req!==state.request)return;state.teams=parseTeams(j).sort((a,b)=>clean(a.displayName).localeCompare(clean(b.displayName)));if(!state.teams.length)throw Error('No teams returned');el('team').innerHTML=state.teams.map((t,i)=>`<option value="${i}">${esc(t.displayName||t.name||t.abbreviation)}</option>`).join('');const saved=store.get('dcTeam:'+state.sport,'');const idx=state.teams.findIndex(t=>String(t.id)===saved||String(t.abbreviation)===saved);if(idx>=0)el('team').value=String(idx);await loadTeam()}catch(e){if(req!==state.request)return;setStatus('Could not load teams: '+e.message,'error');el('out').innerHTML='<div class="empty">Use Test APIs and open Diagnostics. If every call says Failed to fetch, the browser is blocking the remote API rather than the parser failing.</div>'}}
async function loadTeam(){const team=state.teams[Number(el('team').value)];if(!team)return;const req=++state.request;state.team=team;store.set('dcTeam:'+state.sport,String(team.id||team.abbreviation||''));showHero(team,'Loading…');state.model=null;el('out').innerHTML='';el('summary').classList.add('hide');el('notice').innerHTML='';try{if(state.mode==='roster'){setStatus('Loading roster…');const groups=await fetchRoster(team);if(req!==state.request)return;state.model={kind:'roster',groups};showHero(team,'ESPN roster');setStatus('Roster loaded.','ok');render();return}setStatus('Checking true depth data…');try{const groups=await fetchDepth(team);if(req!==state.request)return;state.model={kind:'depth',groups};showHero(team,'ESPN depth chart');setStatus('Depth chart loaded.','ok');render();return}catch(e){log('DEPTH UNAVAILABLE: '+e.message);if(state.mode==='depth'){if(req!==state.request)return;showHero(team,'No depth feed');setStatus('No usable true depth chart returned.','warn');el('notice').innerHTML='<div class="notice">No ranking was fabricated. Use Best available or Roster for this team.</div>';el('out').innerHTML='<div class="empty">No provider depth data returned.</div>';return}}setStatus('Depth unavailable; loading roster fallback…','warn');const groups=await fetchRoster(team);if(req!==state.request)return;state.model={kind:'roster',groups};showHero(team,'ESPN roster fallback');setStatus('Roster loaded as fallback.','ok');el('notice').innerHTML='<div class="notice">True depth data was unavailable, so the ESPN roster is grouped by position.</div>';render()}catch(e){if(req!==state.request)return;showHero(team,'Load failed');setStatus('Could not load team data: '+e.message,'error');el('out').innerHTML='<div class="empty">Open Diagnostics below for the exact attempted URLs and errors.</div>'}}
async function testApis(){const samples={NFL:'den',NBA:'den',MLB:'col',NHL:'col'};state.logs=[];el('debug').textContent='';setStatus('Testing 8 browser calls…');let ok=0,total=0;for(const [lg,c] of Object.entries(LEAGUES)){for(const url of [`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams?limit=2`,`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams/${samples[lg]}/roster`]){total++;try{await api(url,10000);ok++;log('PASS '+lg)}catch(e){log('FAIL '+lg+' '+e.message)}}}setStatus(`API self-test: ${ok}/${total} calls succeeded.`,ok===total?'ok':ok?'warn':'error')}
el('team').onchange=loadTeam;el('reload').onclick=loadTeam;el('testApis').onclick=testApis;el('filter').oninput=render;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;store.set('dcMode',state.mode);renderNav();loadTeam()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;store.set('dcView',state.view);renderNav();render()});window.addEventListener('error',e=>{try{log('WINDOW ERROR: '+e.message)}catch{};try{setStatus('JavaScript error: '+e.message,'error')}catch{}});renderNav();loadTeams();
</script></body></html>
