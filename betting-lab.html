<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Betting Lab</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui}.w{max-width:1350px;margin:auto;padding:18px}.muted{color:#91a3ba}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}select,button{padding:8px;background:#101d31;color:#fff;border:1px solid #31445f;border-radius:8px}button{background:#1769c2;font-weight:900}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.card,.box{background:#0e192a;border:1px solid #26364d;border-radius:10px;padding:10px}.card b{font-size:20px;display:block}.box{overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #26364d;text-align:center;white-space:nowrap}.win{color:#72dfa2;font-weight:800}.loss{color:#ff8b8b}.push{color:#ffd45c}.err{color:#ff8b8b}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class=w><h1>💰 NFL Betting Lab</h1><div class=muted>Historical closing-line analysis using ESPN odds when available. Team filters recalculate ATS from that team's side of the spread.</div><div class=controls><select id=year></select><select id=type><option value=2>Regular</option><option value=3>Postseason</option><option value=ALL>Reg + Post</option></select><select id=team><option value=ALL>All Teams</option></select><button id=go>Load Betting Results</button></div><div id=status class=muted>Ready.</div><div id=cards class=cards style="margin-top:12px"></div><div class=box><table id=tbl></table></div></div><script>'use strict';const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl',E=x=>document.getElementById(x),year=E('year'),type=E('type'),team=E('team'),go=E('go'),status=E('status'),cards=E('cards'),tbl=E('tbl');for(let y=new Date().getFullYear();y>=1999;y--)year.add(new Option(y,y));let data=[];async function J(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}const norm=t=>({WAS:'WSH',LA:'LAR',JAC:'JAX'}[String(t||'').toUpperCase()]||String(t||'').toUpperCase());function weeks(y,t){return t===2?(y>=2021?18:17):5}function parseLine(od,home,away){let total=Number(od?.overUnder),details=String(od?.details||'').trim(),spread=Number(od?.spread),fav='',favSpread=NaN;if(details){let m=details.match(/^([A-Z]{2,4})\s*([+-]?\d+(?:\.\d+)?)/i);if(m){fav=norm(m[1]);favSpread=Number(m[2])}}if(!fav&&Number.isFinite(spread)&&spread!==0){/* ESPN spread commonly represents home-team line; retain only when explicit numeric data is usable. */fav=spread<0?home:away;favSpread=-Math.abs(spread)}let pts=Number.isFinite(favSpread)?Math.abs(favSpread):NaN;if(![home,away].includes(fav))return {total:Number.isFinite(total)?total:null,details,fav:'',pts:null};return {total:Number.isFinite(total)?total:null,details,fav,pts:Number.isFinite(pts)?pts:null}}function sideResult(g,t){if(!g.fav||g.pts==null)return '—';let isFav=t===g.fav,score=t===g.home?g.hs:g.as,opp=t===g.home?g.as:g.hs,adj=score+(isFav?-g.pts:g.pts);return adj>opp?'W':adj<opp?'L':'P'}function cls(x){return x==='W'||x==='O'?'win':x==='L'||x==='U'?'loss':x==='P'?'push':''}function render(){let selected=team.value,a=selected==='ALL'?data:data.filter(x=>x.away===selected||x.home===selected),atsW=0,atsL=0,atsP=0,ov=0,un=0,ouP=0;for(const x of a){let ar=selected==='ALL'?x.favResult:sideResult(x,selected);if(ar==='W')atsW++;if(ar==='L')atsL++;if(ar==='P')atsP++;if(x.ou==='O')ov++;if(x.ou==='U')un++;if(x.ou==='P')ouP++}cards.innerHTML=`<div class=card><b>${a.length}</b>Games with lines</div><div class=card><b>${atsW}-${atsL}-${atsP}</b>${selected==='ALL'?'Favorite':'Team'} ATS W-L-P</div><div class=card><b>${ov}-${un}-${ouP}</b>Over-Under-Push</div><div class=card><b>${a.filter(x=>x.fav&&x.pts!=null).length}</b>Usable spreads</div><div class=card><b>${a.filter(x=>x.total!=null).length}</b>Usable totals</div>`;tbl.innerHTML='<tr><th>Week</th><th>Game</th><th>Score</th><th>Line</th><th>Total</th><th>ATS Side</th><th>ATS</th><th>O/U</th><th>Actual Total</th></tr>'+a.map(x=>{let side=selected==='ALL'?(x.fav||'—'):selected,ar=selected==='ALL'?x.favResult:sideResult(x,selected);return `<tr><td>${x.seasonType===3?'P':'W'}${x.week}</td><td>${x.away} @ ${x.home}</td><td>${x.as}-${x.hs}</td><td>${x.details|| (x.fav&&x.pts!=null?`${x.fav} -${x.pts}`:'—')}</td><td>${x.total??'—'}</td><td>${side}</td><td class=${cls(ar)}>${ar}</td><td class=${cls(x.ou)}>${x.ou}</td><td>${x.hs+x.as}</td></tr>`}).join('')}go.onclick=async()=>{go.disabled=true;data=[];cards.innerHTML='';tbl.innerHTML='';try{let y=+year.value,types=type.value==='ALL'?[2,3]:[+type.value],teams=new Set,seen=new Set,fail=0;for(const st of types)for(let w=1;w<=weeks(y,st);w++){status.textContent=`Loading ${st===2?'week':'post'} ${w}…`;let s;try{s=await J(`${B}/scoreboard?limit=100&dates=${y}&seasontype=${st}&week=${w}`)}catch{fail++;continue}for(const e of s.events||[]){if(!e.status?.type?.completed||seen.has(e.id)||+e.season?.year!==y||+e.season?.type!==st)continue;seen.add(e.id);let c=e.competitions?.[0],od=c?.odds?.[0],h=c?.competitors?.find(x=>x.homeAway==='home'),a=c?.competitors?.find(x=>x.homeAway==='away');if(!h||!a)continue;let home=norm(h.team?.abbreviation),away=norm(a.team?.abbreviation),hs=Number(h.score),as=Number(a.score);if(!Number.isFinite(hs)||!Number.isFinite(as))continue;if(!od){/* summary can contain odds even when scoreboard omits them */try{let sm=await J(`${B}/summary?event=${e.id}`);od=sm?.odds?.[0]||sm?.header?.competitions?.[0]?.odds?.[0]}catch{}}if(!od)continue;let line=parseLine(od,home,away),actual=hs+as,ou=line.total==null?'—':actual>line.total?'O':actual<line.total?'U':'P',g={week:w,seasonType:st,home,away,hs,as,...line,ou};g.favResult=g.fav?sideResult(g,g.fav):'—';data.push(g);teams.add(home);teams.add(away)}}team.innerHTML='<option value=ALL>All Teams</option>'+[...teams].sort().map(t=>`<option>${t}</option>`).join('');render();status.textContent=`Loaded ${data.length} games with ESPN odds${fail?` • ${fail} scoreboard request failures`:''}. Missing historical lines are excluded, never guessed.`}catch(e){status.innerHTML=`<span class=err>Failed: ${e.message}</span>`}finally{go.disabled=false}};team.onchange=render;</script></body></html>
