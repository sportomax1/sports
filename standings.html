<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standings Lab</title><style>:root{--bg:#07101b;--panel:#0e1928;--line:#263a55;--muted:#91a4bd;--gold:#f4b400}*{box-sizing:border-box}body{font-family:system-ui;background:var(--bg);color:#fff;margin:0;padding:20px}button,select,input{padding:10px;margin:4px;background:#132238;color:#fff;border:1px solid #345;border-radius:8px}button.active{background:var(--gold);color:#111}.tabs,.controls{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:15px}.wrap{overflow:auto;max-height:72vh}table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel)}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#101d2e;z-index:2}th{position:sticky;top:0;background:#132238;z-index:3;cursor:pointer}th:first-child{z-index:4}.team{display:flex;align-items:center;gap:8px}.team img{width:28px;height:28px;object-fit:contain}h1{margin:0 0 5px}.muted{color:var(--muted)}.group{margin-top:25px}.hidden{display:none}.rank{color:#ffd45c;font-weight:800}.heat{font-weight:800;text-align:center!important;min-width:72px}.legend{display:flex;align-items:center;gap:8px;margin:10px 4px;color:var(--muted);font-size:12px}.gradient{width:180px;height:12px;border-radius:6px;background:linear-gradient(90deg,hsl(0 70% 35%),hsl(55 65% 40%),hsl(120 55% 32%))}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}.stat{background:#101d2e;border:1px solid var(--line);padding:10px;border-radius:9px}.stat b{font-size:20px;display:block}</style></head><body><h1>Standings Lab</h1><div class="muted">NFL · NBA · MLB · NHL — current standings and league-history heatmaps</div><div id="sports" class="tabs"></div><div class="tabs"><button data-view="standings" class="active">Season Standings</button><button data-view="history">League History</button><button data-view="cross">Core Four Compare</button></div><section id="standingsView"><div class="controls"><label>Season <select id="season"></select></label><label>View <select id="scope"><option value="division">Division</option><option value="conference">Conference</option><option value="league">League</option></select></label><input id="filter" placeholder="Filter team"><button id="refresh">Refresh</button></div><div id="status" class="muted"></div><div id="out" class="wrap"></div></section><section id="historyView" class="hidden"><div class="card"><div class="controls"><label>From <select id="fromYear"></select></label><label>To <select id="toYear"></select></label><label>Metric <select id="metric"><option value="rank">League Rank</option><option value="pct">Win % / Points %</option><option value="wins">Wins</option><option value="diff">Scoring Differential</option></select></label><label>Teams <select id="teamMode"><option value="all">All teams appearing in span</option><option value="current">Current teams only</option></select></label><button id="compareBtn">Build League History</button></div><div class="legend"><span>Worse</span><div class="gradient"></div><span>Better</span></div><div class="muted">Each row is a franchise and each column is a season. Cell color is normalized within that season so green means near the top of that league and red means near the bottom.</div></div><div id="historyStatus" class="muted"></div><div id="historySummary"></div><div id="historyOut" class="wrap"></div></section><section id="crossView" class="hidden"><div class="card"><div class="controls"><label>Season <select id="crossYear"></select></label><label>Metric <select id="crossMetric"><option value="pct">Winning %</option><option value="rank">League percentile rank</option><option value="diff">Scoring differential / game</option></select></label><button id="crossBtn">Compare All Sports</button></div><div class="legend"><span>Worse</span><div class="gradient"></div><span>Better</span></div></div><div id="crossStatus" class="muted"></div><div id="crossOut" class="wrap"></div></section><script>const S={NFL:'football/nfl',NBA:'basketball/nba',MLB:'baseball/mlb',NHL:'hockey/nhl'};let sport=localStorage.standingsSport||'NFL',data=[],view='standings';const $=x=>document.getElementById(x);function cur(sp=sport){let d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;return(sp==='NFL'||sp==='NBA'||sp==='NHL')&&m<7?y-1:y}function years(sp=sport){let a=[],c=cur(sp);for(let y=c;y>=2002;y--)a.push(y);return a}function seasonLabel(y,sp=sport){return(sp==='NBA'||sp==='NHL')?y+'-'+String(y+1).slice(-2):String(y)}function sportControls(){$('sports').innerHTML=Object.keys(S).map(x=>'<button data-s="'+x+'" class="'+(x===sport?'active':'')+'">'+x+'</button>').join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.standingsSport=sport;sportControls();fillYears();load()})}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));['standings','history','cross'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==view))});function fillYears(){let html=years().map(y=>'<option value="'+y+'">'+seasonLabel(y)+'</option>').join('');$('season').innerHTML=html;$('fromYear').innerHTML=html;$('toYear').innerHTML=html;$('crossYear').innerHTML=years('NFL').map(y=>'<option>'+y+'</option>').join('');$('fromYear').value=Math.max(2002,cur()-9);$('toYear').value=cur()}function flat(n,path=[]){let a=[];if(n?.standings?.entries)n.standings.entries.forEach(e=>a.push({e,g:path.at(-1)||n.name||'League',path:[...path]}));(n.children||[]).forEach(c=>a=a.concat(flat(c,path.concat(c.name||c.abbreviation||'Group'))));return a}function smap(e){let m={};(e.stats||[]).forEach(s=>{m[s.name]=s.displayValue??s.value;m[s.abbreviation]=s.displayValue??s.value;m['_'+s.name]=Number(s.value)});return m}function num(m,n,alt){let v=m['_'+n];if(Number.isFinite(v))return v;let z=parseFloat(m[n]);return Number.isFinite(z)?z:(alt??0)}function pctFor(x,sp=sport){let m=smap(x.e),key=sp==='NHL'&&m.pointsPercentage!=null?'pointsPercentage':'winPercent',v=num(m,key,null);if(v==null){let w=num(m,'wins'),l=num(m,'losses'),t=num(m,'ties'),o=num(m,'otLosses');v=w/Math.max(1,w+l+t+o)}return v}function diff(x){let m=smap(x.e);return num(m,'pointDifferential',num(m,'differential',num(m,'pointsFor')-num(m,'pointsAgainst')))}function cols(){if(sport==='NFL')return[['W','wins'],['L','losses'],['T','ties'],['PCT','winPercent'],['PF','pointsFor'],['PA','pointsAgainst'],['DIFF','pointDifferential'],['HOME','home'],['AWAY','road'],['DIV','vsDiv'],['CONF','vsConf'],['STRK','streak']];if(sport==='NBA')return[['W','wins'],['L','losses'],['PCT','winPercent'],['GB','gamesBehind'],['HOME','home'],['AWAY','road'],['CONF','vsConf'],['DIV','vsDiv'],['PPG','avgPointsFor'],['OPP','avgPointsAgainst'],['DIFF','differential'],['STRK','streak']];if(sport==='MLB')return[['W','wins'],['L','losses'],['PCT','winPercent'],['GB','gamesBehind'],['HOME','home'],['AWAY','road'],['RS','pointsFor'],['RA','pointsAgainst'],['DIFF','differential'],['DIV','vsDiv'],['L10','lastTenGames'],['STRK','streak']];return[['W','wins'],['L','losses'],['OTL','otLosses'],['PTS','points'],['PCT','pointsPercentage'],['GF','pointsFor'],['GA','pointsAgainst'],['DIFF','differential'],['HOME','home'],['AWAY','road'],['DIV','vsDiv'],['STRK','streak']]}async function fetchSeason(sp,y){let r=await fetch('https://site.api.espn.com/apis/v2/sports/'+S[sp]+'/standings?season='+y);if(!r.ok)throw Error(r.status);let j=await r.json();return flat({children:j.children||[],name:j.name})}function heat(v){v=Math.max(0,Math.min(1,v));let hue=120*v;return'background:hsl('+hue+' 55% 30%);color:#fff'}async function load(){$('status').textContent='Loading...';try{data=await fetchSeason(sport,$('season').value);render();$('status').textContent=data.length+' teams loaded'}catch(e){$('out').innerHTML='<p>Could not load standings: '+e.message+'</p>'}}function groupKey(x){let s=$('scope').value;if(s==='league')return sport;if(s==='division')return x.g||'Division';let p=x.path||[];return p.length>1?p[p.length-2]:(p[0]||'Conference')}function render(){let q=$('filter').value.toLowerCase(),cs=cols(),rows=data.filter(x=>(x.e.team.displayName||'').toLowerCase().includes(q)),groups={};rows.forEach(x=>(groups[groupKey(x)]??=[]).push(x));Object.values(groups).forEach(a=>a.sort((x,y)=>pctFor(y)-pctFor(x)));$('out').innerHTML=Object.entries(groups).map(([g,a])=>'<div class="group"><h2>'+g+'</h2><table><thead><tr><th>Team</th><th>Rank</th>'+cs.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+a.map((x,i)=>{let m=smap(x.e),t=x.e.team,score=a.length>1?1-i/(a.length-1):1;return'<tr><td><div class="team"><img src="'+(t.logos?.[0]?.href||'')+'"><b>'+t.displayName+'</b></div></td><td class="heat" style="'+heat(score)+'">'+(i+1)+'</td>'+cs.map(c=>'<td>'+(m[c[1]]??'—')+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>').join('')||'<p>No teams found.</p>'}async function history(){let a=+$('fromYear').value,b=+$('toYear').value;if(a>b)[a,b]=[b,a];let ys=[];for(let y=a;y<=b;y++)ys.push(y);$('historyStatus').textContent='Loading '+ys.length+' complete league seasons...';$('historyOut').innerHTML='';try{let all=await Promise.all(ys.map(y=>fetchSeason(sport,y))),metric=$('metric').value,currentIds=new Set(data.map(x=>String(x.e.team.id))),teams=new Map(),seasonMaps=[];all.forEach((d,yi)=>{let ranked=[...d].sort((x,y)=>pctFor(y)-pctFor(x)),vals=d.map(x=>metric==='wins'?num(smap(x.e),'wins'):metric==='diff'?diff(x):metric==='rank'?0:pctFor(x));let min=Math.min(...vals),max=Math.max(...vals),map=new Map();ranked.forEach((x,idx)=>{let id=String(x.e.team.id),m=smap(x.e),raw=metric==='wins'?num(m,'wins'):metric==='diff'?diff(x):metric==='rank'?idx+1:pctFor(x),norm=metric==='rank'?(ranked.length>1?1-idx/(ranked.length-1):1):(max>min?(raw-min)/(max-min):.5);map.set(id,{raw,norm,rank:idx+1,total:ranked.length,name:x.e.team.displayName,logo:x.e.team.logos?.[0]?.href||''});teams.set(id,{name:x.e.team.displayName,logo:x.e.team.logos?.[0]?.href||''})});seasonMaps.push(map)});let ids=[...teams.keys()].filter(id=>$('teamMode').value==='all'||currentIds.has(id));ids.sort((a,b)=>{let av=seasonMaps.reduce((s,m)=>s+(m.get(a)?.norm??0),0),bv=seasonMaps.reduce((s,m)=>s+(m.get(b)?.norm??0),0);return bv-av});let fmt=x=>metric==='pct'?(x.raw*100).toFixed(1)+'%':metric==='rank'?x.rank+'/'+x.total:Number(x.raw).toFixed(metric==='diff'?0:0);$('historyOut').innerHTML='<div class="group"><h2>'+sport+' League History · '+seasonLabel(a)+'–'+seasonLabel(b)+'</h2><table><thead><tr><th>Team</th>'+ys.map(y=>'<th>'+seasonLabel(y)+'</th>').join('')+'<th>Avg Rank %ile</th></tr></thead><tbody>'+ids.map(id=>{let t=teams.get(id),cells=seasonMaps.map(m=>m.get(id)),valid=cells.filter(Boolean),avg=valid.length?valid.reduce((s,x)=>s+x.norm,0)/valid.length:0;return'<tr><td><div class="team"><img src="'+t.logo+'"><b>'+t.name+'</b></div></td>'+cells.map(x=>x?'<td class="heat" style="'+heat(x.norm)+'" title="League rank '+x.rank+' of '+x.total+'">'+fmt(x)+'</td>':'<td class="heat" style="background:#182536;color:#64748b">—</td>').join('')+'<td class="heat" style="'+heat(avg)+'">'+Math.round(avg*100)+'%</td></tr>'}).join('')+'</tbody></table></div>';let best=[];seasonMaps.forEach((m,i)=>{let x=[...m.values()].sort((a,b)=>a.rank-b.rank)[0];if(x)best.push(seasonLabel(ys[i])+': '+x.name)});$('historySummary').innerHTML='<div class="summary"><div class="stat"><span class="muted">Seasons</span><b>'+ys.length+'</b></div><div class="stat"><span class="muted">Franchises shown</span><b>'+ids.length+'</b></div><div class="stat"><span class="muted">Metric</span><b>'+({rank:'Rank',pct:'Win %',wins:'Wins',diff:'Differential'}[metric])+'</b></div></div>';$('historyStatus').textContent='League history loaded. Hover cells for league-rank context.'}catch(e){$('historyStatus').textContent='League history failed: '+e.message}}async function cross(){let y=+$('crossYear').value,metric=$('crossMetric').value;$('crossStatus').textContent='Loading all four leagues...';try{let sports=Object.keys(S),packs=await Promise.all(sports.map(sp=>fetchSeason(sp,y))),rows=[];sports.forEach((sp,i)=>{let d=packs[i],ranked=[...d].sort((a,b)=>pctFor(b,sp)-pctFor(a,sp));ranked.forEach((x,idx)=>{let m=smap(x.e),p=pctFor(x,sp),df=diff(x),gp=num(m,'gamesPlayed',num(m,'wins')+num(m,'losses')+num(m,'ties')+num(m,'otLosses')),percentile=d.length>1?1-idx/(d.length-1):1;rows.push({sport:sp,team:x.e.team.displayName,logo:x.e.team.logos?.[0]?.href||'',pct:p,rank:idx+1,total:d.length,percentile,diffpg:df/Math.max(1,gp)})})});rows.sort((a,b)=>metric==='rank'?b.percentile-a.percentile:metric==='diff'?b.diffpg-a.diffpg:b.pct-a.pct);let vals=rows.map(r=>metric==='diff'?r.diffpg:metric==='pct'?r.pct:r.percentile),min=Math.min(...vals),max=Math.max(...vals);$('crossOut').innerHTML='<div class="group"><h2>Core Four — '+y+'</h2><table><thead><tr><th>Team</th><th>Sport</th><th>League Rank</th><th>Win %</th><th>Rank Percentile</th><th>Diff/Game</th></tr></thead><tbody>'+rows.map(r=>{let raw=metric==='diff'?r.diffpg:metric==='pct'?r.pct:r.percentile,n=max>min?(raw-min)/(max-min):.5;return'<tr><td><div class="team"><img src="'+r.logo+'"><b>'+r.team+'</b></div></td><td>'+r.sport+'</td><td class="heat" style="'+heat(r.percentile)+'">'+r.rank+' / '+r.total+'</td><td style="'+heat(r.pct)+'">'+(r.pct*100).toFixed(1)+'%</td><td style="'+heat(r.percentile)+'">'+(r.percentile*100).toFixed(1)+'%</td><td style="'+heat(n)+'">'+r.diffpg.toFixed(2)+'</td></tr>'}).join('')+'</tbody></table></div>';$('crossStatus').textContent=rows.length+' teams compared'}catch(e){$('crossStatus').textContent='Cross-sport comparison failed: '+e.message}}sportControls();fillYears();$('season').onchange=load;$('scope').onchange=render;$('filter').oninput=render;$('refresh').onclick=load;$('compareBtn').onclick=history;$('crossBtn').onclick=cross;load();</script></body></html>
