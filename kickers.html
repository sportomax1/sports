<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Special Teams Matrix</title>
<style>
:root{--bg:#071018;--panel:#0d1822;--panel2:#122230;--line:#243545;--text:#edf5fb;--muted:#92a6b7;--green:#7ee787;--blue:#58a6ff;--gold:#ffd166;--red:#ff7b72;--shadow:#0003}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 10% 0,#58a6ff18,transparent 28rem),radial-gradient(circle at 90% 0,#7ee78712,transparent 25rem),var(--bg)}button,select{font:inherit}.top{position:sticky;top:0;z-index:50;background:#071018f2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.bar{max-width:1900px;margin:auto;padding:10px 14px;display:flex;align-items:end;gap:8px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:9px;margin-right:8px}.ball{width:38px;height:38px;border:1px solid #2b4860;border-radius:10px;display:grid;place-items:center;background:#102131}.brand h1{font-size:17px;margin:0}.brand small{font-size:10px;color:var(--muted)}.c{display:grid;gap:3px}.c label{font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.7px}select,button{height:36px;border:1px solid var(--line);border-radius:9px;background:#101c27;color:var(--text);padding:0 10px}button{font-weight:800;cursor:pointer}button.primary{background:var(--green);color:#06110a;border-color:var(--green)}button:disabled{opacity:.55;cursor:progress}.main{max-width:1900px;margin:auto;padding:14px}.status{min-height:24px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px;margin-bottom:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.dot.load{background:var(--gold);animation:pulse 1s infinite}.dot.err{background:var(--red)}@keyframes pulse{50%{opacity:.35}}.error{display:none;white-space:pre-wrap;border:1px solid #ff7b7280;background:#ff7b7210;color:#ffc4bf;padding:9px 11px;border-radius:9px;font-size:11px;margin-bottom:9px}.metrics{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:8px;margin-bottom:10px}.metric{border:1px solid var(--line);background:linear-gradient(#111f2b,#0d1822);border-radius:10px;padding:9px 11px}.metric b{font-size:20px}.metric span{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}.panel{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0d1822}.ph{padding:9px 11px;border-bottom:1px solid var(--line);background:#0d1a25;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.ph b{font-size:13px}.ph small,.chips{color:var(--muted);font-size:10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:3px 7px;background:#101e2a}.wrap{overflow:auto;max-height:calc(100vh - 230px)}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#0d1822;text-align:center}th{position:sticky;top:0;z-index:10;background:var(--panel2);height:38px;padding:6px 8px;color:#b8c8d5;font-size:9px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}td{height:72px;padding:6px 8px}.playercol{position:sticky;left:0;z-index:13;min-width:278px;max-width:278px;text-align:left;background:#0f1c27}.stat{min-width:66px}.player{display:grid;grid-template-columns:54px minmax(0,1fr) 32px;align-items:center;gap:9px}.facebox{width:54px;height:54px;border-radius:10px;overflow:hidden;background:#1a2b39;border:1px solid #2a4052;display:grid;place-items:center}.face{width:100%;height:100%;object-fit:cover;object-position:center top}.fallback{font-weight:900;color:#9ab0c1}.pn{font-size:14px;font-weight:850}.ps,.small{font-size:9px;color:var(--muted)}.team{width:29px;height:29px;object-fit:contain}.big{font-size:16px;font-weight:900}.empty{padding:42px 18px;text-align:center;color:var(--muted)}
</style></head><body>
<header class="top"><div class="bar"><div class="brand"><div class="ball">🏈</div><div><h1>NFL Special Teams Matrix</h1><small>ESPN • weekly or full-year loading • kickers + punters</small></div></div><div class="c"><label>Season</label><select id="season"></select></div><div class="c"><label>Type</label><select id="type"><option value="2">Regular</option><option value="1">Preseason</option><option value="3">Postseason</option></select></div><div class="c"><label>Week</label><select id="week"></select></div><div class="c"><label>API Scope</label><select id="scope"><option value="week">Week only • 1 weekly call</option><option value="through">Through week • weekly calls</option><option value="season">Full season • 1 year call</option></select></div><div class="c"><label>Role</label><select id="role"><option value="kicker">Kickers</option><option value="punter">Punters</option></select></div><button id="load" class="primary">Load</button><button id="csv" disabled>Export CSV</button></div></header>
<main class="main"><div id="status" class="status"><span class="dot"></span><span>Ready.</span></div><div id="error" class="error"></div><section class="metrics"><div class="metric"><b id="m1">—</b><span>Events</span></div><div class="metric"><b id="m2">—</b><span>Games</span></div><div class="metric"><b id="m3">—</b><span>Players</span></div><div class="metric"><b id="m4">—</b><span>Average</span></div><div class="metric"><b id="m5">—</b><span>50+</span></div><div class="metric"><b id="m6">—</b><span>Longest</span></div></section><section class="panel"><div class="ph"><div><b>Special teams data</b> <small>Choose Week, Through Week, or Full Season.</small></div></div><div id="wrap" class="wrap"><div class="empty">Load ESPN data to assess kickers or punters.</div></div></section></main>
<script>
(()=>{'use strict';const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl',E=id=>document.getElementById(id),el={season:E('season'),type:E('type'),week:E('week'),scope:E('scope'),role:E('role'),load:E('load'),csv:E('csv'),status:E('status'),error:E('error'),wrap:E('wrap')};let state={events:[],games:0};function status(t,m=''){el.status.innerHTML=`<span class="dot ${m}"></span><span>${t}</span>`}function weeks(){let n=+el.type.value===1?4:+el.type.value===3?5:18;el.week.innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}">Week ${i+1}</option>`).join('')}async function get(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}function boardURL(y,t,w){return`${B}/scoreboard?dates=${y}&seasontype=${t}&week=${w}&limit=100`}function yearBoardURL(y,t){return`${B}/scoreboard?dates=${y}&seasontype=${t}&limit=1000`}function sumURL(id){return`${B}/summary?event=${id}`}async function load(){let y=+el.season.value,t=+el.type.value,w=+el.week.value,scope=el.scope.value;el.load.disabled=true;status('Loading ESPN…','load');try{let games=[];if(scope==='season'){let b=await get(yearBoardURL(y,t));games=(b.events||[]).map(ev=>({id:String(ev.id),week:+(ev?.week?.number||ev?.competitions?.[0]?.week?.number||0)}))}else{let ws=scope==='through'?Array.from({length:w},(_,i)=>i+1):[w];for(let wk of ws){let b=await get(boardURL(y,t,wk));games.push(...(b.events||[]).map(ev=>({id:String(ev.id),week:wk})))}}games=[...new Map(games.map(g=>[g.id,g])).values()];let summaries=[];for(let i=0;i<games.length;i+=8){let batch=games.slice(i,i+8);summaries.push(...await Promise.all(batch.map(async g=>({g,data:await get(sumURL(g.id))}))));status(`Loading game play-by-play… ${Math.min(i+8,games.length)}/${games.length}`,'load')}state.games=games.length;state.events=summaries;render(scope,y,w);status(`Loaded ${games.length} games • ${scope==='season'?`${y} full season via year API`:scope==='through'?`weeks 1–${w} via weekly APIs`:`week ${w} via weekly API`}`)}catch(e){status(`Load failed: ${e.message}`,'err')}finally{el.load.disabled=false}}function render(scope,y,w){let role=el.role.value;el.wrap.innerHTML=`<div class="empty"><b>${role==='kicker'?'Kicker':'Punter'} assessment data loaded</b><br>${state.games} games available for grading.<br><br><strong>API mode:</strong> ${scope==='season'?'Full-year scoreboard → game summaries':scope==='through'?'Weekly scoreboards through selected week → game summaries':'Selected-week scoreboard → game summaries'}<br><br>The grading/matrix layer uses the same game-summary play-by-play regardless of loading mode.</div>`}for(let y=2026;y>=2000;y--)el.season.add(new Option(y,y));el.season.value='2026';el.type.onchange=weeks;el.scope.onchange=()=>{el.week.disabled=el.scope.value==='season'};el.role.onchange=()=>state.games&&render(el.scope.value,+el.season.value,+el.week.value);el.load.onclick=load;weeks();})();
</script></body></html>
