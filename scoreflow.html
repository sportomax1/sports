async function renderCompare(){const token=++compareToken,k=compareLeagueKey;if(!k){compareNote.textContent="Choose one league to load its teams.";compareLegend.innerHTML="";compareTable.innerHTML='<div class="emptymsg">Select a league above.</div>';drawCompareChart([],[],"nhl",compareChartType,"Game date","Points");return}const metric=compareMetric.value,w=compareWindow(k);compareNote.textContent=`${L[k].name} • ${w.label} • ${compareAggregation==="game"?"Per game":"Monthly average"} • ${compareMetricLabel(metric)}`;compareTable.innerHTML='<div class="emptymsg">Loading trends…</div>';compareLegend.innerHTML="";let ids=[...compareSelected];if(!ids.length){drawCompareChart([],[],k,compareChartType,"Game date",compareMetricLabel(metric));compareTable.innerHTML='<div class="emptymsg">Select team icons, or tap All.</div>';return}try{let teams=await getTeams(k),games=await periodGames(k,w);if(token!==compareToken)return;let built=buildCompareSeries(games,teams,ids,metric,compareAggregation);drawCompareChart(built.series,built.labels,k,compareChartType,built.xTitle,compareMetricLabel(metric));compareLegend.innerHTML=built.series.map((s,i)=>`<div class="compare-legend-item"><span class="compare-legend-dot" style="background:${compareColor(i)}"></span>${s.logo?'<img class="logo" src="'+s.logo+'" alt="">':""}<span>${esc(s.abbr)}</span></div>`).join("");let rows=built.series.map(s=>{let vals=s.values.filter(v=>v!=null),latest=vals[vals.length-1],prior=vals[vals.length-2];return{name:s.name,latest,prior,change:latest!=null&&prior!=null?latest-prior:null}}).sort((a,b)=>(b.latest??-Infinity)-(a.latest??-Infinity));compareTable.innerHTML='<div class="compare-row head"><div>Team</div><div>Latest</div><div>Prior</div><div>Change</div></div>'+rows.map(r=>`<div class="compare-row"><div>${esc(r.name)}</div><div>${formatMetric(r.latest,k)}</div><div>${formatMetric(r.prior,k)}</div><div>${r.change==null?"—":(r.change>=0?"+":"")+formatMetric(r.change,k)}</div></div>`).join("")}catch(e){if(token!==compareToken)return;console.error("ScoreFlow Compare",e);compareTable.innerHTML='<div class="emptymsg">Could not load compare data.</div>';drawCompareChart([],[],k,compareChartType,"Game date",compareMetricLabel(metric))}}
function setCompareControlsEnabled(on){compareRange.disabled=!on;compareMetric.disabled=!on;comparePerGame.disabled=!on;compareMonthly.disabled=!on;compareLine.disabled=!on;barVertical.disabled=!on;barHorizontal.disabled=!on;compareAll.disabled=!on;compareNone.disabled=!on}
function setCompareAggregation(mode){compareAggregation=mode;comparePerGame.classList.toggle("on",mode==="game");compareMonthly.classList.toggle("on",mode==="month");renderCompare()}
function setCompareChartType(type){compareChartType=type;compareLine.classList.toggle("on",type==="line");barVertical.classList.toggle("on",type==="vertical");barHorizontal.classList.toggle("on",type==="horizontal");renderCompare()}
function resetCompare(){compareToken++;compareLeagueKey="";compareSelected.clear();compareTeamsLoadedFor="";compareAggregation="game";compareChartType="line";renderCompareLeagues();comparePicks.innerHTML="";compareLegend.innerHTML="";compareNote.textContent="Choose one league to load its teams.";compareTable.innerHTML='<div class="emptymsg">Select a league above.</div>';setCompareControlsEnabled(false);setCompareAggregation("game");setCompareChartType("line")}
function initCompare(){compareLeagueKey="";renderCompareLeagues();setCompareControlsEnabled(false);comparePicks.innerHTML="";compareNote.textContent="Choose one league to load its teams.";compareTable.innerHTML='<div class="emptymsg">Select a league above.</div>';compareRange.onchange=renderCompare;compareMetric.onchange=renderCompare;compareAll.onclick=async()=>{if(!compareLeagueKey)return;let teams=await getTeams(compareLeagueKey);compareSelected=new Set(teams.map(t=>t.id));renderTeamPicks(teams);renderCompare()};compareNone.onclick=async()=>{if(!compareLeagueKey)return;let teams=await getTeams(compareLeagueKey);compareSelected.clear();renderTeamPicks(teams);renderCompare()};comparePerGame.onclick=()=>setCompareAggregation("game");compareMonthly.onclick=()=>setCompareAggregation("month");compareLine.onclick=()=>setCompareChartType("line");barVertical.onclick=()=>setCompareChartType("vertical");barHorizontal.onclick=()=>setCompareChartType("horizontal")}

document.getElementById("todayBtn").onclick=()=>document.getElementById("day-"+today())?.scrollIntoView({behavior:"smooth",block:"center"});document.getElementById("earlier").onclick=()=>{start=monthKey(addMonths(start+"-01",-3));renderMonths()};document.getElementById("later").onclick=()=>{end=monthKey(addMonths(end+"-01",3));renderMonths()};window.addEventListener("resize",()=>{if(document.getElementById("trendsView").classList.contains("on"))draw([],trendLeagueKey,"Select or refresh trend");if(compareView.classList.contains("on"))renderCompare()});renderFilters();renderTrendLeague();renderMonths();setTimeout(()=>document.getElementById("day-"+today())?.scrollIntoView({block:"center"}),250)})();
