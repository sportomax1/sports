<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Kickers • Field Goal Matrix</title>
<style>
:root{
  --bg:#071018;--panel:#0d1822;--panel2:#122230;--line:#243545;--text:#edf5fb;--muted:#92a6b7;
  --green:#7ee787;--blue:#58a6ff;--gold:#ffd166;--red:#ff7b72;--shadow:#0003
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 10% 0,#58a6ff18,transparent 28rem),radial-gradient(circle at 90% 0,#7ee78712,transparent 25rem),var(--bg)}
button,select{font:inherit}
.top{position:sticky;top:0;z-index:50;background:#071018f2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.bar{max-width:1900px;margin:auto;padding:10px 14px;display:flex;align-items:end;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:8px}.ball{width:38px;height:38px;border:1px solid #2b4860;border-radius:10px;display:grid;place-items:center;background:#102131}
.brand h1{font-size:17px;margin:0}.brand small{font-size:10px;color:var(--muted)}
.c{display:grid;gap:3px}.c label{font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.7px}
select,button{height:36px;border:1px solid var(--line);border-radius:9px;background:#101c27;color:var(--text);padding:0 10px}
button{font-weight:800;cursor:pointer}button.primary{background:var(--green);color:#06110a;border-color:var(--green)}button:disabled{opacity:.55;cursor:progress}
.main{max-width:1900px;margin:auto;padding:14px}.status{min-height:24px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px #7ee787aa}.dot.load{background:var(--gold);animation:pulse 1s infinite}.dot.err{background:var(--red);box-shadow:none}@keyframes pulse{50%{opacity:.35}}
.error{display:none;white-space:pre-wrap;border:1px solid #ff7b7280;background:#ff7b7210;color:#ffc4bf;padding:9px 11px;border-radius:9px;font-size:11px;margin-bottom:9px}
.metrics{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:8px;margin-bottom:10px}.metric{border:1px solid var(--line);background:linear-gradient(#111f2b,#0d1822);border-radius:10px;padding:9px 11px}.metric b{font-size:20px}.metric span{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.panel{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0d1822}.ph{padding:9px 11px;border-bottom:1px solid var(--line);background:#0d1a25;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.ph b{font-size:13px}.ph small,.chips{color:var(--muted);font-size:10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:3px 7px;background:#101e2a}
.wrap{overflow:auto;max-height:calc(100vh - 230px)}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#0d1822;text-align:center}th{position:sticky;top:0;z-index:10;background:var(--panel2);height:38px;padding:6px 8px;color:#b8c8d5;font-size:9px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}td{height:72px;padding:6px 8px}
.playercol{position:sticky;left:0;z-index:13;min-width:278px;max-width:278px;text-align:left;background:#0f1c27;box-shadow:8px 0 14px var(--shadow)}th.playercol{z-index:25;background:#152837}
.stat{min-width:66px}.stickyStat{position:sticky;z-index:12;background:#0d1822}.sMade{left:278px}.sAtt{left:344px}.sPct{left:410px}.sLong{left:476px;box-shadow:8px 0 14px var(--shadow)}th.stickyStat{z-index:22;background:var(--panel2)}
.player{display:grid;grid-template-columns:54px minmax(0,1fr) 32px;align-items:center;gap:9px}.facebox{width:54px;height:54px;border-radius:10px;overflow:hidden;background:#1a2b39;border:1px solid #2a4052;display:grid;place-items:center}.face{width:100%;height:100%;object-fit:cover;object-position:center top}.fallback{font-weight:900;color:#9ab0c1}.pn{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ps{font-size:10px;color:var(--muted);margin-top:3px}.team{width:29px;height:29px;object-fit:contain}.plink{color:inherit;text-decoration:none}.plink:hover .pn{color:var(--blue)}
.big{font-size:16px;font-weight:900}.small{font-size:8px;color:var(--muted);margin-top:2px}
.kickcell{min-width:92px;width:92px;background:#0c1922}.kick{min-height:50px;border:1px solid #264256;border-radius:8px;background:linear-gradient(#132a38,#0f202b);display:grid;align-content:center;gap:2px;padding:4px;color:inherit;text-decoration:none;transition:.12s}.kick:hover{transform:translateY(-1px);filter:brightness(1.08)}.k50{border-color:#7ee78788;background:linear-gradient(#18392f,#10271f)}.k60{border-color:#ffd166aa;background:linear-gradient(#3b321b,#282315)}.dist{font-size:18px;font-weight:900;line-height:1}.dist i{font-style:normal;font-size:8px;color:var(--muted);margin-left:2px}.km{font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yardHead{min-width:58px;width:58px}.yardCell{min-width:58px;width:58px;height:62px;padding:4px;background:#0c1922}.yardBox{min-height:46px;border-radius:8px;border:1px solid #263b4a;background:#10202b;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:3px}.yardBox.perfect{border-color:#7ee78766;background:#10291d}.yardBox.mixed{border-color:#ffd16666;background:#292511}.yardBox.miss{border-color:#ff7b7266;background:#2b1718}.ok{color:var(--green);font-size:12px;font-weight:900;line-height:1.2}.bad{color:var(--red);font-size:12px;font-weight:900;line-height:1.2}
.empty{padding:42px 18px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:4px}
@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.wrap{max-height:calc(100vh - 300px)}}
@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.playercol{min-width:224px;max-width:224px}.sMade{left:224px}.sAtt{left:290px}.sPct{left:356px}.sLong{left:422px}.player{grid-template-columns:44px minmax(0,1fr) 25px}.facebox{width:44px;height:44px}.team{width:24px;height:24px}}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <div class="brand"><div class="ball">🏈</div><div><h1>NFL Kickers • Field Goal Matrix</h1><small>ESPN play-by-play • makes + misses • real player faces</small></div></div>
  <div class="c"><label>Season</label><select id="season"></select></div>
  <div class="c"><label>Type</label><select id="type"><option value="2">Regular</option><option value="1">Preseason</option><option value="3">Postseason</option></select></div>
  <div class="c"><label>Week</label><select id="week"></select></div>
  <div class="c"><label>Scope</label><select id="scope"><option value="through">Season through week</option><option value="week">Selected week only</option></select></div>
  <div class="c"><label>Matrix</label><select id="layout"><option value="list">Kick list • long → short</option><option value="yards">Yardage grid • max → min</option></select></div>
  <div class="c"><label>Sort kickers</label><select id="sort"><option value="long">Longest made FG</option><option value="made">FGs made</option><option value="attempts">Attempts</option><option value="pct">FG%</option><option value="name">Kicker name</option><option value="team">Team</option></select></div>
  <button id="load" class="primary">Load</button><button id="csv" disabled>Export CSV</button>
</div></header>
<main class="main">
  <div id="status" class="status"><span class="dot"></span><span>Ready.</span></div>
  <div id="error" class="error"></div>
  <section class="metrics">
    <div class="metric"><b id="mMade">—</b><span>Made FGs</span></div>
    <div class="metric"><b id="mAttempts">—</b><span>Attempts</span></div>
    <div class="metric"><b id="mKickers">—</b><span>Kickers</span></div>
    <div class="metric"><b id="mPct">—</b><span>FG%</span></div>
    <div class="metric"><b id="m50">—</b><span>50+ Made</span></div>
    <div class="metric"><b id="mLong">—</b><span>Longest Made</span></div>
  </section>
  <section class="panel"><div class="ph"><div><b id="title">Field goals</b> <small id="sub">Loading ESPN data…</small></div><div class="chips" id="chips"></div></div><div id="wrap" class="wrap"><div class="empty"><b>Loading ESPN data…</b></div></div></section>
</main>
<script>
(()=>{'use strict';
const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const E=id=>document.getElementById(id);
const el={season:E('season'),type:E('type'),week:E('week'),scope:E('scope'),layout:E('layout'),sort:E('sort'),load:E('load'),csv:E('csv'),status:E('status'),error:E('error'),wrap:E('wrap'),title:E('title'),sub:E('sub'),chips:E('chips'),mMade:E('mMade'),mAttempts:E('mAttempts'),mKickers:E('mKickers'),mPct:E('mPct'),m50:E('m50'),mLong:E('mLong')};
let state={attempts:[],rows:[]};
const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const norm=(s='')=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const pct=(m,a)=>a?100*m/a:0;
function status(t,m='ok'){el.status.innerHTML=`<span class="dot ${m==='load'?'load':m==='err'?'err':''}"></span><span>${esc(t)}</span>`}
function error(t=''){el.error.style.display=t?'block':'none';el.error.textContent=t}
function weeks(){let n=+el.type.value===1?4:+el.type.value===3?5:18,w=+el.week.value||1;el.week.innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}">Week ${i+1}</option>`).join('');el.week.value=String(Math.min(w,n))}
async function get(u,ms=18000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{cache:'no-store',signal:c.signal});if(!r.ok)throw Error(`HTTP ${r.status}`);return await r.json()}finally{clearTimeout(t)}}
async function pool(a,n,fn,prog){let out=new Array(a.length),i=0,d=0;async function w(){for(;;){let x=i++;if(x>=a.length)return;try{out[x]=await fn(a[x],x)}catch(e){out[x]={__error:e,item:a[x]}}finally{prog?.(++d,a.length)}}}await Promise.all(Array.from({length:Math.min(n,a.length||1)},w));return out}
function team(c){let t=c?.team||{};return{id:String(t.id??c?.id??''),name:t.displayName||t.name||'',abbr:t.abbreviation||'',logo:t.logo||t.logos?.[0]?.href||'',homeAway:c?.homeAway||''}}
function teams(ev){return(ev?.competitions?.[0]?.competitors||[]).map(team)}
function boardURL(y,t,w){return`${B}/scoreboard?dates=${y}&seasontype=${t}&week=${w}&limit=100`}
function sumURL(id){return`${B}/summary?event=${id}`}
function rosterURL(id,y){return`${B}/teams/${id}/roster?season=${y}`}
function shot(id){return id?`https://a.espncdn.com/i/headshots/nfl/players/full/${id}.png`:''}
function logo(t){if(t?.logo)return t.logo;return t?.abbr?`https://a.espncdn.com/i/teamlogos/nfl/500/${String(t.abbr).toLowerCase()}.png`:''}
function athleteCtx(s){let index=new Map(),kByTeam=new Map();for(const g of s?.boxscore?.players||[]){let tm=team({team:g.team});for(const cat of g?.statistics||[]){let kt=/kick|field.?goal|(?:^|\W)fg(?:\W|$)/.test(`${cat?.name||''} ${cat?.displayName||''} ${cat?.label||''}`.toLowerCase());for(const z of cat?.athletes||[]){let a=z?.athlete||{};if(!a.id)continue;let id=String(a.id),p=index.get(id)||{},x={...p,id,name:a.displayName||a.fullName||a.shortName||p.name||'',headshot:a.headshot?.href||p.headshot||'',position:a.position?.abbreviation||p.position||'',team:tm};index.set(id,x);if(tm.id&&(kt||['K','PK'].includes(String(x.position).toUpperCase()))){let q=kByTeam.get(tm.id)||[];if(!q.some(v=>v.id===id))q.push(x);kByTeam.set(tm.id,q)}}}}return{index,kByTeam}}
function participant(p){let x=p?.participants?.[0]||p?.players?.[0],a=x?.athlete||{};return x?{id:String(a.id||x.playerId||x.id||''),name:a.displayName||a.fullName||x.displayName||'',headshot:a.headshot?.href||''}:{}}
function kickerName(p){for(let s of[p?.shortText,p?.text,p?.description].filter(Boolean).map(String)){s=s.replace(/^\s*\([^)]*\)\s*/,'').replace(/^\s*\d{1,2}:\d{2}\s*[-–—]\s*/,'').trim();let m=s.match(/([A-Z][A-Za-z.'-]+(?:\s+[A-Z][A-Za-z.'-]+)+|[A-Z]\.?\s*[A-Za-z.'-]+)\s+(?:made\s+|makes\s+|missed\s+|misses\s+)?\d{1,2}\s*(?:yd|yard(?:s)?)\s+field\s+goal/i);if(m)return m[1].replace(/\s+/g,' ').trim();m=s.match(/field\s+goal\s+(?:by\s+)?(.+?)(?=\s+from\s+\d|\s+\d{1,2}\b|$)/i);if(m)return m[1].trim()}return''}
function match(a,b){if(!a||!b)return false;if(norm(a)===norm(b))return true;let p=String(a).split(/\s+/);return p.length>1&&norm(`${p[0][0]}${p.at(-1)}`)===norm(b)}
function playTeam(p,ath,ts){let r=p?.team||p?.teamInfo;if(r?.id)return ts.find(t=>t.id===String(r.id))||team({team:r});if(ath?.team?.id)return ts.find(t=>t.id===String(ath.team.id))||ath.team;return null}
function resolve(p,ctx,tid=''){let d=participant(p);if(d.id&&ctx.index.has(d.id))return{...ctx.index.get(d.id),...d,team:ctx.index.get(d.id).team};let n=d.name||kickerName(p);if(n)for(const a of ctx.index.values())if(match(a.name,n))return a;if(tid){let q=ctx.kByTeam.get(String(tid))||[];if(n){let z=q.find(v=>match(v.name,n));if(z)return z}if(q.length===1)return q[0]}return{id:d.id||'',name:n||'',headshot:d.headshot||'',team:null}}
function playText(p){return[p?.shortText,p?.text,p?.description,p?.type?.text,p?.type?.abbreviation,p?.playType?.text,p?.playType?.abbreviation].filter(Boolean).join(' ')}
function dist(p){let t=playText(p);for(const r of[/(\d{1,2})\s*(?:yd|yard(?:s)?)\s+(?:field\s+goal|fg)/i,/field\s+goal(?:\s+attempt)?(?:\s+from)?\s+(\d{1,2})/i]){let m=t.match(r);if(m){let d=+m[1];if(d>=15&&d<=80)return d}}return null}
function isFG(p){let t=playText(p).toLowerCase(),a=String(p?.type?.abbreviation||p?.playType?.abbreviation||'').toUpperCase();return /field\s+goal/.test(t)||a==='FG'||a.includes('FIELDGOAL')}
function result(p,source){let t=playText(p).toLowerCase();if(/no\s+good|miss(?:ed|es)?|blocked|failed/.test(t))return false;if(/\bis\s+good\b|\bgood\b|\bmade\b|\bmakes\b|successful/.test(t))return true;if((p?.scoringPlay===true||source==='scoring')&&(+p?.scoreValue===3||source==='scoring'))return true;return null}
function clock(p){return typeof p?.clock==='string'?p.clock:p?.clock?.displayValue||p?.displayClock||''}
function candidatePlays(s){let out=[];const add=(p,source)=>{if(p&&typeof p==='object')out.push({p,source})};for(const p of s?.scoringPlays||[])add(p,'scoring');for(const d of s?.drives?.previous||[])for(const p of d?.plays||[])add(p,'drive');if(s?.drives?.current)for(const p of s.drives.current?.plays||[])add(p,'drive');for(const p of s?.plays||[])add(p,'plays');for(const p of s?.playByPlay?.plays||[])add(p,'pbp');return out}
function extract(s,g){let ts=g.eventTeams||[],ctx=athleteCtx(s),out=[];for(const {p,source} of candidatePlays(s)){if(!isFG(p))continue;let d=dist(p);if(!d)continue;let made=result(p,source);if(made===null)continue;let hint=playTeam(p,null,ts),a=resolve(p,ctx,hint?.id||''),tm=playTeam(p,a,ts),opp=tm?ts.find(t=>t.id!==tm.id):null;out.push({eventId:g.eventId,week:g.week,distance:d,made,kickerId:a.id||'',kickerName:a.name||kickerName(p)||'Unknown kicker',headshot:a.headshot||shot(a.id),team:tm||a.team||null,opponent:opp,period:+p?.period||0,clock:clock(p),text:p?.shortText||p?.text||playText(p),sequence:String(p?.sequenceNumber||p?.id||p?.playId||''),source})}return out}
function rosterKickers(data,tm){let f=new Map(),seen=new Set();function walk(x,d=0){if(!x||d>8)return;if(Array.isArray(x)){x.forEach(v=>walk(v,d+1));return}if(typeof x!=='object'||seen.has(x))return;seen.add(x);let id=x.id!=null?String(x.id):'',name=x.displayName||x.fullName||x.shortName||'',pos=String(x.position?.abbreviation||x.position?.name||x.position||'').toUpperCase();if(id&&name&&(pos==='K'||pos==='PK'||pos.includes('KICKER')))f.set(id,{id,name,headshot:(typeof x.headshot==='string'?x.headshot:x.headshot?.href)||shot(id),team:tm});Object.values(x).forEach(v=>{if(v&&(Array.isArray(v)||typeof v==='object'))walk(v,d+1)})}walk(data);return[...f.values()]}
async function enrich(a,y){let need=new Map();for(const x of a)if(x.team?.id&&(!x.kickerId||x.kickerName==='Unknown kicker'||!x.headshot))need.set(String(x.team.id),x.team);if(!need.size)return;let req=[...need].map(([id,tm])=>({id,tm})),r=await pool(req,8,async z=>({id:z.id,kickers:rosterKickers(await get(rosterURL(z.id,y)),z.tm)}),(d,t)=>status(`Resolving kicker faces… ${d}/${t}`,'load')),m=new Map();r.filter(x=>!x?.__error).forEach(x=>m.set(x.id,x.kickers));for(const x of a){let q=m.get(String(x.team?.id||''))||[],z=x.kickerName!=='Unknown kicker'?q.find(v=>match(v.name,x.kickerName)):null;if(!z&&x.kickerId)z=q.find(v=>v.id===x.kickerId);if(!z&&q.length===1)z=q[0];if(z){x.kickerId=z.id;x.kickerName=z.name;x.headshot=z.headshot}}}
function dedupe(a){let m=new Map();for(const x of a){let id=x.sequence?`${x.eventId}|${x.sequence}`:[x.eventId,x.kickerId||norm(x.kickerName),x.distance,x.period,x.clock].join('|');let prev=m.get(id);if(!prev||(!prev.kickerId&&x.kickerId)||(!prev.headshot&&x.headshot))m.set(id,{...prev,...x});else if(prev.made!==true&&x.made===true)m.set(id,{...prev,...x,made:true})}return[...m.values()]}
function group(a){let m=new Map();for(const x of a){let key=x.kickerId||`${norm(x.kickerName)}|${x.team?.id||''}`;if(!m.has(key))m.set(key,{key,kickerId:x.kickerId,kickerName:x.kickerName,headshot:x.headshot,team:x.team,teams:new Map(x.team?.id?[[String(x.team.id),x.team]]:[]),attempts:[]});let r=m.get(key);r.attempts.push(x);if(!r.headshot)r.headshot=x.headshot;if(x.team){r.team=x.team;r.teams.set(String(x.team.id),x.team)}if(r.kickerName==='Unknown kicker'&&x.kickerName)r.kickerName=x.kickerName}for(const r of m.values()){r.attempts.sort((a,b)=>b.distance-a.distance||b.week-a.week);r.kicks=r.attempts.filter(x=>x.made).sort((a,b)=>b.distance-a.distance||b.week-a.week);let md=r.kicks.map(x=>x.distance);r.made=r.kicks.length;r.att=r.attempts.length;r.missed=r.att-r.made;r.long=md.length?Math.max(...md):0;r.avg=avg(md);r.fifty=md.filter(x=>x>=50).length;r.pct=pct(r.made,r.att)}return[...m.values()]}
function sortRows(a){let s=el.sort.value;return[...a].sort((x,y)=>s==='made'?y.made-x.made||y.long-x.long:s==='attempts'?y.att-x.att||y.made-x.made:s==='pct'?y.pct-x.pct||y.att-x.att:s==='name'?x.kickerName.localeCompare(y.kickerName):s==='team'?(x.team?.abbr||'').localeCompare(y.team?.abbr||'')||x.kickerName.localeCompare(y.kickerName):y.long-x.long||y.made-x.made||y.att-x.att)}
function ptxt(p){let q=+p||0;return q<=4?`Q${q}`:`OT${q===5?'':q-4}`}
function meta(k){let a=[];if(el.scope.value==='through')a.push(`W${k.week}`);let c=[ptxt(k.period),k.clock].filter(Boolean).join(' ');if(c)a.push(c);if(k.opponent?.abbr)a.push(k.team?.homeAway==='away'?`@ ${k.opponent.abbr}`:`vs ${k.opponent.abbr}`);return a.join(' • ')}
function img(src,alt,fb){return src?`<img class="face" src="${esc(src)}" alt="${esc(alt)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="fallback" style="display:none">${esc(fb)}</div>`:`<div class="fallback">${esc(fb)}</div>`}
function playerCell(r,i){let ini=r.kickerName.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'K',face=r.headshot||shot(r.kickerId),tl=logo(r.team),pu=r.kickerId?`https://www.espn.com/nfl/player/_/id/${r.kickerId}`:'',teams=[...r.teams.values()].map(t=>t.abbr).filter(Boolean).join('/');return`<td class="playercol"><div class="player"><div class="facebox">${img(face,r.kickerName,ini)}</div><div>${pu?`<a class="plink" target="_blank" rel="noopener" href="${pu}">`:''}<div class="pn">${i+1}. ${esc(r.kickerName)}</div>${pu?'</a>':''}<div class="ps">${esc(teams||r.team?.abbr||'')} • ${r.made}/${r.att} FG • ${r.pct.toFixed(1)}%</div></div>${tl?`<img class="team" src="${esc(tl)}" alt="${esc(r.team?.abbr||'team')}">`:''}</div></td>`}
function statCells(r){return`<td class="stat stickyStat sMade"><div class="big">${r.made}</div><div class="small">MADE</div></td><td class="stat stickyStat sAtt"><div class="big">${r.att}</div><div class="small">ATT</div></td><td class="stat stickyStat sPct"><div class="big">${r.pct.toFixed(1)}</div><div class="small">FG%</div></td><td class="stat stickyStat sLong"><div class="big">${r.long||'—'}</div><div class="small">LONG</div></td>`}
function renderList(rows){let n=Math.max(0,...rows.map(r=>r.kicks.length)),heads=Array.from({length:n},(_,i)=>`<th>FG ${i+1}${i?'':' • LONG'}</th>`).join(''),body=rows.map((r,i)=>{let cells=Array.from({length:n},(_,j)=>{let k=r.kicks[j];if(!k)return'<td class="kickcell"></td>';let cl=k.distance>=60?'kick k60':k.distance>=50?'kick k50':'kick';return`<td class="kickcell" title="${esc(k.text)}"><a class="${cl}" target="_blank" rel="noopener" href="https://www.espn.com/nfl/game/_/gameId/${k.eventId}"><div class="dist">${k.distance}<i>YD</i></div><div class="km">${esc(meta(k))}</div></a></td>`}).join('');return`<tr>${playerCell(r,i)}${statCells(r)}${cells}</tr>`}).join('');el.wrap.innerHTML=`<table><thead><tr><th class="playercol">Kicker</th><th class="stat stickyStat sMade">Made</th><th class="stat stickyStat sAtt">Att</th><th class="stat stickyStat sPct">FG%</th><th class="stat stickyStat sLong">Long</th>${heads}</tr></thead><tbody>${body}</tbody></table>`;el.chips.innerHTML='<span class="chip">Each cell = one made FG</span><span class="chip">50+ green</span><span class="chip">60+ gold</span><span class="chip">Longest → shortest</span>'}
function renderYards(rows){let all=state.attempts;if(!all.length)return;let mx=Math.max(...all.map(x=>x.distance)),mn=Math.min(...all.map(x=>x.distance)),yards=Array.from({length:mx-mn+1},(_,i)=>mx-i),heads=yards.map(y=>`<th class="yardHead">${y}<br>YD</th>`).join(''),body=rows.map((r,i)=>{let cells=yards.map(y=>{let a=r.attempts.filter(x=>x.distance===y);if(!a.length)return'<td class="yardCell"></td>';let m=a.filter(x=>x.made).length,x=a.length-m,cl=m&&x?'yardBox mixed':x&&!m?'yardBox miss':'yardBox perfect',tip=a.map(k=>`${k.made?'GOOD':'MISS'} • ${meta(k)}${k.text?` • ${k.text}`:''}`).join('\n');return`<td class="yardCell" title="${esc(tip)}"><div class="${cl}">${m?`<span class="ok">✓ ${m}</span>`:''}${x?`<span class="bad">✕ ${x}</span>`:''}</div></td>`}).join('');return`<tr>${playerCell(r,i)}${statCells(r)}${cells}</tr>`}).join('');el.wrap.innerHTML=`<table><thead><tr><th class="playercol">Kicker</th><th class="stat stickyStat sMade">Made</th><th class="stat stickyStat sAtt">Att</th><th class="stat stickyStat sPct">FG%</th><th class="stat stickyStat sLong">Long</th>${heads}</tr></thead><tbody>${body}</tbody></table>`;el.chips.innerHTML=`<span class="chip">${mx} → ${mn} yards</span><span class="chip"><span class="ok">✓</span> made</span><span class="chip"><span class="bad">✕</span> missed / blocked</span><span class="chip">Blank = no attempts</span>`}
function render(){let rows=sortRows(state.rows),made=state.attempts.filter(x=>x.made),md=made.map(x=>x.distance),att=state.attempts.length;state.rows=rows;el.csv.disabled=!rows.length;el.mMade.textContent=made.length||0;el.mAttempts.textContent=att||0;el.mKickers.textContent=rows.length||0;el.mPct.textContent=att?`${pct(made.length,att).toFixed(1)}%`:'—';el.m50.textContent=md.filter(x=>x>=50).length||0;el.mLong.textContent=md.length?`${Math.max(...md)} yd`:'—';let w=el.week.value,typ=el.type.options[el.type.selectedIndex].textContent,sc=el.scope.value==='through'?`through Week ${w}`:`Week ${w}`;el.title.textContent=`${el.season.value} ${typ} • ${sc}`;el.sub.textContent=el.layout.value==='yards'?`${made.length} made / ${att} attempts • every yard from max → min`:`${made.length} made FGs • each kicker longest → shortest`;if(!rows.length){el.wrap.innerHTML='<div class="empty"><b>No field-goal attempts found.</b>Try another week or season.</div>';el.chips.innerHTML='';return}if(el.layout.value==='yards')renderYards(rows);else renderList(rows)}
async function load(){let y=+el.season.value,t=+el.type.value,w=+el.week.value,ws=el.scope.value==='through'?Array.from({length:w},(_,i)=>i+1):[w];el.load.disabled=true;el.csv.disabled=true;error('');status(`Loading ESPN scoreboards… 0/${ws.length}`,'load');try{let wr=await pool(ws,4,async wk=>{let b=await get(boardURL(y,t,wk));return(b?.events||[]).map(ev=>({eventId:String(ev.id),week:wk,eventTeams:teams(ev)}))},(d,n)=>status(`Loading ESPN scoreboards… ${d}/${n}`,'load')),be=wr.filter(x=>x?.__error),games=wr.filter(Array.isArray).flat();if(!games.length&&be.length)throw be[0].__error;if(!games.length){state={attempts:[],rows:[]};render();status('No ESPN games found.');return}let sr=await pool(games,8,async g=>extract(await get(sumURL(g.eventId)),g),(d,n)=>status(`Loading ESPN game play-by-play… ${d}/${n}`,'load')),se=sr.filter(x=>x?.__error),a=dedupe(sr.filter(Array.isArray).flat());await enrich(a,y);state.attempts=a;state.rows=group(a);render();let made=a.filter(x=>x.made).length,unresolved=a.filter(x=>!x.kickerId||x.kickerName==='Unknown kicker').length,warn=[];if(be.length)warn.push(`${be.length} scoreboard request(s) failed`);if(se.length)warn.push(`${se.length} game summary request(s) failed`);if(unresolved)warn.push(`${unresolved} attempt${unresolved===1?'':'s'} unmatched`);if(warn.length){error(`Partial ESPN load: ${warn.join('; ')}.`);status(`Loaded ${made} made FGs / ${a.length} attempts with partial data.`,'err')}else status(`Loaded ${made} made FGs / ${a.length} attempts • ${state.rows.length} kickers • ${new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}.`)}catch(e){console.error(e);state={attempts:[],rows:[]};render();error(`Could not load ESPN data.\n\n${e?.name==='AbortError'?'ESPN request timed out.':e?.message||e}`);status('ESPN load failed.','err')}finally{el.load.disabled=false;el.csv.disabled=!state.rows.length}}
function csv(){if(!state.rows.length)return;let r=sortRows(state.rows),a;if(el.layout.value==='yards'){let mx=Math.max(...state.attempts.map(x=>x.distance)),mn=Math.min(...state.attempts.map(x=>x.distance)),yards=Array.from({length:mx-mn+1},(_,i)=>mx-i);a=[['Kicker','Team','Made','Attempts','FG%','Longest',...yards.map(y=>`${y} yd`)],...r.map(x=>[x.kickerName,[...x.teams.values()].map(t=>t.abbr).join('/'),x.made,x.att,x.pct.toFixed(1),x.long||'',...yards.map(y=>{let z=x.attempts.filter(k=>k.distance===y),m=z.filter(k=>k.made).length,miss=z.length-m;return z.length?`M${m} X${miss}`:''})])]}else{let n=Math.max(...r.map(x=>x.kicks.length));a=[['Kicker','Team','Made','Attempts','FG%','Longest',...Array.from({length:n},(_,i)=>`FG ${i+1}`)],...r.map(x=>[x.kickerName,[...x.teams.values()].map(t=>t.abbr).join('/'),x.made,x.att,x.pct.toFixed(1),x.long||'',...Array.from({length:n},(_,i)=>x.kicks[i]?.distance??'')])]}let s=a.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),u=URL.createObjectURL(new Blob([s],{type:'text/csv'})),q=document.createElement('a');q.href=u;q.download=`nfl-kickers-${el.season.value}-week-${el.week.value}-${el.layout.value}.csv`;q.click();URL.revokeObjectURL(u)}
async function init(){let y=new Date().getFullYear();el.season.innerHTML=Array.from({length:y-2009},(_,i)=>`<option value="${y-i}">${y-i}</option>`).join('');el.season.value=String(Math.min(y,2026));weeks();try{let d=await get(`${B}/scoreboard?limit=100`,9000),sy=+(d?.season?.year||d?.leagues?.[0]?.season?.year||y),st=+(d?.season?.type||d?.leagues?.[0]?.season?.type||2),wk=+(d?.week?.number||d?.week?.value||1);if([...el.season.options].some(o=>+o.value===sy))el.season.value=String(sy);if([1,2,3].includes(st))el.type.value=String(st);weeks();if(wk>0&&wk<=el.week.options.length)el.week.value=String(wk)}catch(e){console.warn('Could not auto-detect current ESPN week',e)}await load()}
el.type.addEventListener('change',weeks);el.load.addEventListener('click',load);el.csv.addEventListener('click',csv);el.sort.addEventListener('change',render);el.layout.addEventListener('change',render);init();
