<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Milestone Lab</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui}.w{max-width:1200px;margin:auto;padding:18px}.muted{color:#91a3ba}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}select,input,button{padding:8px;background:#101d31;color:#fff;border:1px solid #31445f;border-radius:8px}button{background:#1769c2;font-weight:800}.row{display:grid;grid-template-columns:55px 1fr 85px 85px 100px 1fr;gap:8px;padding:9px;border-bottom:1px solid #26364d;align-items:center}.box{background:#0e192a;border:1px solid #26364d;border-radius:10px;overflow:hidden}.rank{font-weight:900;color:#ffd45c}.val{font-size:17px;font-weight:900}.err{color:#ff8b8b}@media(max-width:650px){.row{grid-template-columns:35px 1fr 65px}.hide{display:none}}</style></head><body><div class=w><h1>🏆 NFL Milestone Lab</h1><div class=muted>Find verified single-game statistical thresholds from ESPN box scores.</div><div class=controls><select id=year></select><select id=type><option value=2>Regular</option><option value=3>Postseason</option><option value=ALL>Reg + Post</option></select><select id=metric><option value=passingYards>Passing Yards</option><option value=passingTouchdowns>Passing TDs</option><option value=rushingYards>Rushing Yards</option><option value=rushingTouchdowns>Rushing TDs</option><option value=receivingYards>Receiving Yards</option><option value=receptions>Catches</option><option value=receivingTouchdowns>Receiving TDs</option></select><input id=threshold type=number value=300 min=1><button id=go>Find Milestones</button></div><div id=status class=muted>Ready.</div><div id=out class=box style="margin-top:12px"></div></div><script>'use strict';const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl',E=x=>document.getElementById(x),year=E('year'),type=E('type'),metric=E('metric'),threshold=E('threshold'),go=E('go'),status=E('status'),out=E('out');for(let y=new Date().getFullYear();y>=1999;y--)year.add(new Option(y,y));const num=v=>Number(String(v??0).replace(/,/g,''))||0,norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');async function J(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}function catType(c){let labels=c.labels||[],keys=c.keys||[],s=[c.name,c.displayName,...labels,...keys].join(' ').toLowerCase();return s.includes('pass')?'passing':s.includes('rush')?'rushing':s.includes('receiv')||labels.some(x=>norm(x)==='rec')?'receiving':'other'}function find(c,row,names){let labels=c.labels||[],keys=c.keys||[],st=row.stats||[];for(const z of names){let i=labels.findIndex(x=>norm(x)===norm(z));if(i<0)i=keys.findIndex(x=>norm(x)===norm(z));if(i>=0)return num(st[i])}return 0}function value(c,r,m){let k=catType(c);if(m==='passingYards'&&k==='passing')return find(c,r,['YDS','passingYards']);if(m==='passingTouchdowns'&&k==='passing')return find(c,r,['TD','passingTouchdowns']);if(m==='rushingYards'&&k==='rushing')return find(c,r,['YDS','rushingYards']);if(m==='rushingTouchdowns'&&k==='rushing')return find(c,r,['TD','rushingTouchdowns']);if(m==='receivingYards'&&k==='receiving')return find(c,r,['YDS','receivingYards']);if(m==='receptions'&&k==='receiving')return find(c,r,['REC','receptions']);if(m==='receivingTouchdowns'&&k==='receiving')return find(c,r,['TD','receivingTouchdowns']);return null}function weeks(y,t){return t===2?(y>=2021?18:17):5}async function events(y,t){let all=[];for(let w=1;w<=weeks(y,t);w++){status.textContent=`Loading ${t===2?'regular':'postseason'} week ${w}…`;let s=await J(`${B}/scoreboard?limit=100&dates=${y}&seasontype=${t}&week=${w}`);all.push(...(s.events||[]).filter(e=>e.status?.type?.completed&&+e.season?.year===y&&+e.season?.type===t).map(e=>({...e,__week:w,__type:t})))}return all}go.onclick=async()=>{go.disabled=true;out.innerHTML='';try{let y=+year.value,types=type.value==='ALL'?[2,3]:[+type.value],gs=[];for(const t of types)gs.push(...await events(y,t));gs=[...new Map(gs.map(e=>[e.id,e])).values()];let hits=new Map,fail=0,d=0;for(const e of gs){status.textContent=`Scanning ${++d}/${gs.length} games…`;let s;try{s=await J(`${B}/summary?event=${e.id}`)}catch{fail++;continue}for(const b of s.boxscore?.players||[])for(const c of b.statistics||[])for(const r of c.athletes||[]){let v=value(c,r,metric.value);if(v==null||v<+threshold.value)continue;let id=String(r.athlete?.id||r.athlete?.displayName||''),key=`${e.id}|${id}|${metric.value}`,x={name:r.athlete?.displayName||'Unknown',team:b.team?.abbreviation||'',pos:r.athlete?.position?.abbreviation||'',v,date:String(e.date||'').slice(0,10),week:e.__week,seasonType:e.__type,game:e.shortName||e.name||''},old=hits.get(key);if(!old||v>old.v)hits.set(key,x)}}let a=[...hits.values()].sort((a,b)=>b.v-a.v||a.date.localeCompare(b.date));out.innerHTML=a.map((x,i)=>`<div class=row><span class=rank>#${i+1}</span><b>${x.name}</b><span class=val>${x.v}</span><span class=hide>${x.team} ${x.pos}</span><span class=hide>${x.seasonType===3?'Post ': 'W'}${x.week}</span><span class=hide>${x.game}</span></div>`).join('')||'<div style="padding:20px">No qualifying games.</div>';status.textContent=`${a.length} qualifying performances • ${gs.length-fail}/${gs.length} games scanned${fail?` • ${fail} summary failures`:''}`}catch(e){status.innerHTML=`<span class=err>Failed: ${e.message}</span>`}finally{go.disabled=false}};metric.onchange=()=>threshold.value={passingYards:300,passingTouchdowns:3,rushingYards:100,rushingTouchdowns:2,receivingYards:100,receptions:10,receivingTouchdowns:2}[metric.value];</script></body></html>
