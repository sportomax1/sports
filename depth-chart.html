<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Depth Chart Lab</title>
<style>
:root{color-scheme:dark;--bg:#08111d;--panel:#0e1a29;--panel2:#14243a;--line:#293d59;--text:#f6f8fb;--muted:#93a6bf;--gold:#f4b400;--green:#7ee787;--red:#ff7b72;--blue:#58a6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1450px;margin:auto;padding:18px}h1{margin:0;font-size:36px}.muted{color:var(--muted)}button,select,input{font:inherit;color:#fff;background:var(--panel2);border:1px solid #395270;border-radius:10px;padding:10px}button{cursor:pointer}button.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sports{margin:16px 0 10px}.controls{padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.controls label{display:flex;align-items:center;gap:6px;color:var(--muted)}select{min-width:230px}input{flex:1;min-width:220px}.status{margin:10px 0;padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.status.ok{color:#b9f6c2;border-color:#315d3c}.status.warn{color:#ffe08a;border-color:#6c5b28}.status.error{color:#ffb0aa;border-color:#6b3131}.hero{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.hero img{width:64px;height:64px;object-fit:contain}.hero h2{margin:0}.summary{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:9px;margin:10px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}.card h3{margin:0;padding:11px 12px;background:var(--panel2)}.player{display:grid;grid-template-columns:32px 42px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}.player img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#132238}.rank{text-align:center;font-weight:900}.rank.one{color:var(--green)}.badge{font-size:10px;padding:3px 6px;border:1px solid #435976;border-radius:999px;white-space:nowrap}.name{font-weight:800}.meta{font-size:11px;color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed #3a516d;border-radius:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--panel2);font-size:11px;text-transform:uppercase;color:#b9c8db}.tiny{width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px}.notice{margin:10px 0;padding:10px 12px;border-left:4px solid var(--blue);background:#101d2d;border-radius:10px;color:#cbd8e8}details{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px}.debug{font:11px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:#8298b5;white-space:pre-wrap;word-break:break-word}.hide{display:none}@media(max-width:700px){.wrap{padding:12px}.summary{grid-template-columns:1fr 1fr}.controls{align-items:stretch}.controls label{width:100%}select,input{width:100%;min-width:0}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <h1>Depth Chart Lab</h1>
  <div class="muted">Core Four rosters, plus true depth charts when the provider actually supplies them.</div>
  <div id="sports" class="row sports"></div>
  <div class="row controls">
    <label>Team <select id="team"></select></label>
    <button data-mode="auto">Best available</button>
    <button data-mode="depth">Depth chart</button>
    <button data-mode="roster">Roster</button>
    <button data-view="cards">Cards</button>
    <button data-view="table">Table</button>
    <input id="filter" placeholder="Filter player / position">
    <button id="reload">Refresh</button>
  </div>
  <div id="status" class="status">Starting…</div>
  <div id="hero"></div>
  <div id="summary" class="summary hide"></div>
  <div id="notice"></div>
  <div id="out"></div>
  <details><summary>Diagnostics</summary><div id="debug" class="debug"></div></details>
</main>
<script>
'use strict';
const LEAGUES={NFL:{sport:'football',league:'nfl'},NBA:{sport:'basketball',league:'nba'},MLB:{sport:'baseball',league:'mlb'},NHL:{sport:'hockey',league:'nhl'}};
const el=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const clean=v=>String(v??'').trim();
const state={sport:localStorage.dcSport||'NFL',mode:localStorage.dcMode||'auto',view:localStorage.dcView||'cards',teams:[],team:null,model:null,request:0,logs:[]};
if(!LEAGUES[state.sport])state.sport='NFL';
if(!['auto','depth','roster'].includes(state.mode))state.mode='auto';
if(!['cards','table'].includes(state.view))state.view='cards';
function log(msg){state.logs.push(msg);if(state.logs.length>80)state.logs.shift();el('debug').textContent=state.logs.join('\n')}
function status(msg,type=''){el('status').className='status'+(type?' '+type:'');el('status').textContent=msg}
async function api(url){log('GET '+url);const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),12000);try{const r=await fetch(url,{cache:'no-store',signal:ctrl.signal});log('HTTP '+r.status);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}
function getTeams(j){return (j?.sports?.[0]?.leagues?.[0]?.teams||j?.teams||[]).map(x=>x.team||x).filter(x=>x&&x.id)}
function normalizePlayer(raw,position=''){
  const p=raw?.athlete||raw?.player||raw||{};
  return {id:clean(p.id),name:clean(p.displayName||p.fullName||p.shortName||[p.firstName,p.lastName].filter(Boolean).join(' ')||'Unknown'),jersey:clean(p.jersey),position:clean(p.position?.abbreviation||p.position?.name||position),head:clean(p.headshot?.href||p.headshot),status:clean(p.status?.name||p.status?.type)};
}
function parseRoster(j){
  const groups=[];const src=Array.isArray(j?.athletes)?j.athletes:Array.isArray(j?.items)?j.items:[];
  for(const g of src){
    if(Array.isArray(g?.items)){
      const groupName=clean(typeof g.position==='string'?g.position:(g.position?.name||g.name||g.abbreviation||'Roster'));
      const items=g.items.map(x=>normalizePlayer(x,groupName)).filter(p=>p.name!=='Unknown');
      if(items.length)groups.push({name:groupName,items});
    }else if(g){
      const p=normalizePlayer(g);let group=groups.find(x=>x.name===(p.position||'Roster'));if(!group){group={name:p.position||'Roster',items:[]};groups.push(group)}group.items.push(p);
    }
  }
  return groups;
}
function parseDepth(j){
  const charts=Array.isArray(j?.depthCharts)?j.depthCharts:[];const groups=[];
  for(const chart of charts){
    const positions=[];const raw=chart?.positions||{};
    for(const [key,pos] of Object.entries(raw)){
      const athletes=Array.isArray(pos?.athletes)?pos.athletes:[];
      const items=athletes.map((x,i)=>({rank:Number(x?.rank)||i+1,player:normalizePlayer(x,pos?.position?.abbreviation||key.toUpperCase())})).filter(x=>x.player.name!=='Unknown');
      if(items.length)positions.push({name:clean(pos?.position?.name||key),abbr:clean(pos?.position?.abbreviation||key.toUpperCase()),items});
    }
    if(positions.length)groups.push({name:clean(chart?.name||'Depth Chart'),positions});
  }
  return groups;
}
function playerHead(p){if(p.head)return p.head;return p.id?`https://a.espncdn.com/i/headshots/${LEAGUES[state.sport].league}/players/full/${p.id}.png`:''}
function renderNav(){
  el('sports').innerHTML=Object.keys(LEAGUES).map(s=>`<button data-sport="${s}" class="${state.sport===s?'active':''}">${s}</button>`).join('');
  document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{state.sport=b.dataset.sport;localStorage.dcSport=state.sport;renderNav();loadTeams()});
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
}
function hero(team,source=''){el('hero').innerHTML=`<div class="hero"><img src="${esc(team?.logos?.[0]?.href||'')}" alt=""><div><h2>${esc(team?.displayName||team?.name||'Team')}</h2><div class="muted">${esc(state.sport)}${source?' · '+esc(source):''}</div></div></div>`}
function flatRows(){
  if(!state.model)return[];
  if(state.model.kind==='depth')return state.model.groups.flatMap(g=>g.positions.flatMap(p=>p.items.map(x=>({group:g.name,position:p.abbr||p.name,rank:x.rank,player:x.player}))));
  return state.model.groups.flatMap(g=>g.items.map(p=>({group:g.name,position:p.position||g.name,rank:null,player:p})));
}
function renderSummary(){const rows=flatRows();el('summary').classList.toggle('hide',!rows.length);if(!rows.length)return;const positions=new Set(rows.map(r=>r.position).filter(Boolean));const starters=rows.filter(r=>r.rank===1).length;el('summary').innerHTML=`<div class="stat"><b>${rows.length}</b><span>Players</span></div><div class="stat"><b>${positions.size}</b><span>Positions</span></div><div class="stat"><b>${state.model.kind==='depth'?starters:'—'}</b><span>Top depth slots</span></div>`}
function cardPlayer(p,rank){return `<div class="player"><div class="rank ${rank===1?'one':''}">${rank??'•'}</div><img src="${esc(playerHead(p))}" alt="" onerror="this.style.opacity=.15"><div><div class="name">${esc(p.name)}</div><div class="meta">${p.jersey?'#'+esc(p.jersey)+' · ':''}${esc(p.position||'')}${p.status?' · '+esc(p.status):''}</div></div><span class="badge">${rank==null?'Roster':rank===1?'Starter':'Depth '+rank}</span></div>`}
function renderCards(q){
  if(state.model.kind==='depth'){
    const blocks=state.model.groups.map(g=>{const positions=g.positions.map(p=>{const items=p.items.filter(x=>!q||[p.name,p.abbr,x.player.name,x.player.position].some(v=>clean(v).toLowerCase().includes(q)));return items.length?`<div><h3>${esc(p.abbr||p.name)} · ${esc(p.name)}</h3>${items.map(x=>cardPlayer(x.player,x.rank)).join('')}</div>`:''}).join('');return positions?`<section class="card"><h3>${esc(g.name)}</h3>${positions}</section>`:''}).join('');return blocks?`<div class="grid">${blocks}</div>`:'<div class="empty">No matching players.</div>';
  }
  const blocks=state.model.groups.map(g=>{const items=g.items.filter(p=>!q||[g.name,p.name,p.position].some(v=>clean(v).toLowerCase().includes(q)));return items.length?`<section class="card"><h3>${esc(g.name)}</h3>${items.map(p=>cardPlayer(p,null)).join('')}</section>`:''}).join('');return blocks?`<div class="grid">${blocks}</div>`:'<div class="empty">No matching players.</div>';
}
function renderTable(q){const rows=flatRows().filter(r=>!q||[r.group,r.position,r.player.name].some(v=>clean(v).toLowerCase().includes(q)));if(!rows.length)return'<div class="empty">No matching players.</div>';return `<div class="tablewrap"><table><thead><tr><th>Rank</th><th>Player</th><th>Position</th><th>Group</th><th>Jersey</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.rank??'—'}</td><td><img class="tiny" src="${esc(playerHead(r.player))}" alt="" onerror="this.style.opacity=.15"><b>${esc(r.player.name)}</b></td><td>${esc(r.position||'—')}</td><td>${esc(r.group||'—')}</td><td>${r.player.jersey?'#'+esc(r.player.jersey):'—'}</td><td>${esc(r.player.status||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function render(){if(!state.model)return;const q=clean(el('filter').value).toLowerCase();el('out').innerHTML=state.view==='table'?renderTable(q):renderCards(q);renderSummary()}
async function loadTeams(){const req=++state.request;state.model=null;el('out').innerHTML='';el('summary').classList.add('hide');el('notice').innerHTML='';state.logs=[];el('debug').textContent='';status('Loading '+state.sport+' teams…');const c=LEAGUES[state.sport];try{const j=await api(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams?limit=100`);if(req!==state.request)return;state.teams=getTeams(j).sort((a,b)=>clean(a.displayName).localeCompare(clean(b.displayName)));if(!state.teams.length)throw new Error('No teams returned');el('team').innerHTML=state.teams.map(t=>`<option value="${esc(t.id)}">${esc(t.displayName||t.name)}</option>`).join('');const saved=localStorage.getItem('dcTeam:'+state.sport);if(saved&&state.teams.some(t=>String(t.id)===saved))el('team').value=saved;await loadTeam()}catch(e){if(req===state.request)status('Could not load teams: '+e.message,'error')}}
async function loadTeam(){const id=el('team').value;if(!id)return;const req=++state.request;const c=LEAGUES[state.sport];const team=state.teams.find(t=>String(t.id)===String(id));state.team=team;localStorage.setItem('dcTeam:'+state.sport,id);hero(team);state.model=null;el('out').innerHTML='';el('summary').classList.add('hide');el('notice').innerHTML='';state.logs=[];el('debug').textContent='';
  const roster=async()=>{status('Loading roster…');const j=await api(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams/${id}/roster`);const groups=parseRoster(j);if(!groups.length)throw new Error('Roster response contained no players');if(req!==state.request)return false;state.model={kind:'roster',groups};hero(team,'ESPN roster');status('Roster loaded.','ok');el('notice').innerHTML='<div class="notice">Roster order is not presented as depth order.</div>';render();return true};
  const depth=async()=>{status('Loading depth chart…');const j=await api(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams/${id}/depthcharts`);const groups=parseDepth(j);if(!groups.length)throw new Error('No depth chart data returned');if(req!==state.request)return false;state.model={kind:'depth',groups};hero(team,'ESPN depth chart');status('Depth chart loaded.','ok');el('notice').innerHTML='<div class="notice">Ranks are taken directly from the provider depth-chart response.</div>';render();return true};
  try{
    if(state.mode==='roster'){await roster();return}
    if(state.mode==='depth'){await depth();return}
    try{if(await depth())return}catch(e){log('DEPTH FALLBACK: '+e.message)}
    await roster();
  }catch(e){if(req!==state.request)return;status('Could not load team data: '+e.message,'error');el('out').innerHTML='<div class="empty">This request failed. Open Diagnostics below for the exact endpoint/status.</div>'}
}
el('team').onchange=loadTeam;el('reload').onclick=loadTeam;el('filter').oninput=render;
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;localStorage.dcMode=state.mode;renderNav();loadTeam()});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;localStorage.dcView=state.view;renderNav();render()});
renderNav();loadTeams();
</script>
</body>
</html>
