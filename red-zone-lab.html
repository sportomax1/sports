<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Zone Lab</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui}.w{max-width:1300px;margin:auto;padding:18px}.muted{color:#91a3ba}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}select,button,input{padding:8px;background:#101d31;color:#fff;border:1px solid #31445f;border-radius:8px}button{background:#b42336;font-weight:900}.box{background:#0e192a;border:1px solid #26364d;border-radius:10px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #26364d;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.hot{color:#ff8795;font-weight:900}.err{color:#ff8b8b}</style></head><body><div class=w><h1>🔴 Red Zone Lab</h1><div class=muted>Red-zone opportunities only when ESPN provides a trustworthy distance-to-goal or parseable possession-side field position. Includes rushes, pass targets, completions and TDs.</div><div class=controls><select id=year></select><select id=type><option value=2>Regular</option><option value=3>Postseason</option></select><select id=week><option value=ALL>All Weeks</option></select><button id=go>Scan Red Zone</button><input id=q placeholder="Filter player/team"></div><div id=status class=muted>Ready.</div><div class=box style="margin-top:12px"><table id=tbl></table></div></div><script>'use strict';const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl',E=x=>document.getElementById(x),year=E('year'),type=E('type'),week=E('week'),go=E('go'),q=E('q'),status=E('status'),tbl=E('tbl');for(let y=new Date().getFullYear();y>=1999;y--)year.add(new Option(y,y));for(let w=1;w<=18;w++)week.add(new Option('Week '+w,w));let rows=[];async function J(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}const clean=s=>String(s||'').replace(/^\d+-/,'').replace(/\s+/g,' ').trim(),normTeam=t=>({WAS:'WSH',LA:'LAR',JAC:'JAX'}[String(t||'').toUpperCase()]||String(t||'').toUpperCase());function allPlays(s){let m=new Map,i=0,add=p=>{if(!p)return;let k=String(p.id||p.sequenceNumber||`x${i++}:${p.text||''}`);if(!m.has(k))m.set(k,p)};for(const d of s.drives?.previous||[])for(const p of d.plays||[])add(p);if(s.drives?.current)for(const p of s.drives.current.plays||[])add(p);for(const p of s.plays||[])add(p);return [...m.values()]}function distanceToGoal(p,offTeam){let d=Number(p.start?.distanceToEndzone);if(Number.isFinite(d))return d;let txt=String(p.start?.text||p.start?.yardLine||'').toUpperCase(),m=txt.match(/(?:AT\s+)?([A-Z]{2,4})\s+(\d{1,2})\b/);if(!m)return null;let side=normTeam(m[1]),yard=+m[2];if(yard<0||yard>50)return null;return side===offTeam?100-yard:yard}function participantNames(p){let out=[];for(const x of p.participants||p.players||[]){let a=x.athlete||x;let name=a.displayName||a.fullName||x.displayName||'';if(name)out.push({name:clean(name),type:String(x.type||x.role||x.participantType||'').toLowerCase(),id:String(a.id||x.playerId||x.id||'')})}return out}function classify(p){let text=clean(p.text),low=text.toLowerCase(),parts=participantNames(p),td=/touchdown/i.test(text),rush=/\b(rush|scramble|up the middle|left (?:end|tackle|guard)|right (?:end|tackle|guard))\b/i.test(text)&&!/pass/i.test(text),pass=/\bpass\b/i.test(text),complete=pass&&!/incomplete/i.test(text)&&!/intercept/i.test(text);let name='';if(rush){let structured=parts.find(x=>/rusher|rush/.test(x.type));name=structured?.name||clean((text.match(/^(.+?)\s+(?:up the middle|left (?:end|tackle|guard)|right (?:end|tackle|guard)|rushes|scrambles)/i)||[])[1])}else if(pass){let structured=parts.find(x=>/receiver|target/.test(x.type));name=structured?.name||clean((text.match(/\b(?:pass\s+)?to\s+(.+?)\s+(?:for|is incomplete|at\b|to the\b)/i)||[])[1])}return name?{name,kind:rush?'rush':'target',complete,td}:null}function add(m,name,team,k,complete,td){if(!name||name.length>60)return;let key=team+'|'+name,x=m.get(key)||{name,team,carries:0,targets:0,catches:0,td:0,opp:0};if(k==='rush')x.carries++;else{x.targets++;if(complete)x.catches++}x.opp++;if(td)x.td++;m.set(key,x)}function render(){let s=q.value.toLowerCase(),a=rows.filter(x=>(x.name+' '+x.team).toLowerCase().includes(s));tbl.innerHTML='<tr><th>Player</th><th>Team</th><th>RZ Carries</th><th>RZ Targets</th><th>RZ Catches</th><th>RZ TD</th><th>RZ Opps</th><th>TD/Opp</th></tr>'+a.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.team}</td><td>${x.carries}</td><td>${x.targets}</td><td>${x.catches}</td><td class=hot>${x.td}</td><td>${x.opp}</td><td>${x.opp?(100*x.td/x.opp).toFixed(1):'0.0'}%</td></tr>`).join('')}go.onclick=async()=>{go.disabled=true;let m=new Map,unknownField=0,unattributed=0,fail=0;try{let y=+year.value,t=+type.value,max=t===2?(y>=2021?18:17):5,ws=week.value==='ALL'?Array.from({length:max},(_,i)=>i+1):[+week.value],events=[];for(const w of ws){status.textContent=`Loading ${t===2?'week':'post'} ${w}…`;let s=await J(`${B}/scoreboard?limit=100&dates=${y}&seasontype=${t}&week=${w}`);events.push(...(s.events||[]).filter(e=>e.status?.type?.completed&&+e.season?.year===y&&+e.season?.type===t))}events=[...new Map(events.map(e=>[e.id,e])).values()];let d=0;for(const e of events){status.textContent=`Scanning ${++d}/${events.length} games…`;let s;try{s=await J(`${B}/summary?event=${e.id}`)}catch{fail++;continue}for(const p of allPlays(s)){let team=normTeam(p.team?.abbreviation||''),dist=distanceToGoal(p,team);if(dist==null){unknownField++;continue}if(dist<0||dist>20)continue;let c=classify(p);if(!c){unattributed++;continue}add(m,c.name,team,c.kind,c.complete,c.td)}}rows=[...m.values()].sort((a,b)=>b.opp-a.opp||b.td-a.td);render();status.textContent=`${rows.length} players • ${events.length-fail}/${events.length} games • ${unattributed} red-zone plays not safely attributable • ${unknownField} plays skipped without reliable field position.`}catch(e){status.innerHTML=`<span class=err>Failed: ${e.message}</span>`}finally{go.disabled=false}};q.oninput=render;type.onchange=()=>{let max=+type.value===2?(+year.value>=2021?18:17):5;[...week.options].forEach((o,i)=>{if(i)o.hidden=+o.value>max});if(+week.value>max)week.value='ALL'};</script></body></html>
