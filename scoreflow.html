document.getElementById("todayBtn").onclick=()=>document.getElementById("day-"+today())?.scrollIntoView({behavior:"smooth",block:"center"});document.getElementById("earlier").onclick=()=>{start=monthKey(addMonths(start+"-01",-3));renderMonths()};document.getElementById("later").onclick=()=>{end=monthKey(addMonths(end+"-01",3));renderMonths()};window.addEventListener("resize",()=>{if(document.getElementById("trendsView").classList.contains("on"))renderTrend()});renderFilters();renderMonths();setTimeout(()=>document.getElementById("day-"+today())?.scrollIntoView({block:"center"}),250)})();
