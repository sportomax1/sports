<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Zone Lab</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui}.w{max-width:1250px;margin:auto;padding:18px}.muted{color:#91a3ba}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}select,button,input{padding:8px;background:#101d31;color:#fff;border:1px solid #31445f;border-radius:8px}button{background:#b42336;font-weight:900}.box{background:#0e192a;border:1px solid #26364d;border-radius:10px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #26364d;text-align:right}th:first-child,td:first-child{text-align:left}.hot{color:#ff8795;font-weight:900}</style></head><body><div class=w><h1>🔴 Red Zone Lab</h1><div class=muted>Scans ESPN play-by-play for offensive plays snapped inside the opponent 20 and attributes red-zone carries, targets and TDs when the play text identifies the player.</div><div class=controls><select id=year></select><select id=week><option value=ALL>All Weeks</option></select><button id=go>Scan Red Zone</button><input id=q placeholder="Filter player/team"></div><div id=status class=muted>Ready.</div><div class=box style="margin-top:12px"><table id=tbl></table></div></div><script>const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl';for(let y=new Date().getFullYear();y>=2002;y--)year.add(new Option(y,y));for(let w=1;w<=18;w++)week.add(new Option('Week '+w,w));let rows=[];async function J(u){let r=await fetch(u);return r.json()}function add(m,name,team,k,td){if(!name)return;let key=team+'|'+name,x=m.get(key)||{name,team,carries:0,targets:0,td:0,plays:0};x[k]++;x.plays++;if(td)x.td++;m.set(key,x)}function render(){let s=q.value.toLowerCase(),a=rows.filter(x=>(x.name+' '+x.team).toLowerCase().includes(s));tbl.innerHTML='<tr><th>Player</th><th>Team</th><th>RZ Carries</th><th>RZ Targets</th><th>RZ TD</th><th>RZ Plays</th></tr>'+a.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.team}</td><td>${x.carries}</td><td>${x.targets}</td><td class=hot>${x.td}</td><td>${x.plays}</td></tr>`).join('')}go.onclick=async()=>{go.disabled=true;let m=new Map;try{let ws=week.value==='ALL'?Array.from({length:+year.value>=2021?18:17},(_,i)=>i+1):[+week.value],events=[];for(const w of ws){status.textContent=`Loading week ${w}…`;let s=await J(`${B}/scoreboard?limit=100&dates=${year.value}&seasontype=2&week=${w}`);events.push(...(s.events||[]).filter(e=>e.status?.type?.completed))}events=[...new Map(events.map(e=>[e.id,e])).values()];let d=0;for(const e of events){status.textContent=`Scanning ${++d}/${events.length} games…`;let s=await J(`${B}/summary?event=${e.id}`),plays=[];for(const dr of s.drives?.previous||[])plays.push(...(dr.plays||[]));for(const p of plays){let txt=p.text||'',dist=String(p.start?.yardLine||p.start?.text||'');let rz=(p.start?.distanceToEndzone!=null&&+p.start.distanceToEndzone<=20)||/\b(?:[1-9]|1\d|20)\b/.test(dist)&&/yard/i.test(dist);if(!rz)continue;let team=p.team?.abbreviation||'',td=/touchdown/i.test(txt),mm=txt.match(/^([A-Z][A-Za-z.'’-]+(?:\s+[A-Z][A-Za-z.'’-]+)+)\s+(?:up the middle|left|right|rush|scramble)/i);if(mm)add(m,mm[1],team,'carries',td);let mt=txt.match(/\bto\s+([A-Z][A-Za-z.'’-]+(?:\s+[A-Z][A-Za-z.'’-]+)+?)\s+(?:for|is|at|to)\b/i);if(mt)add(m,mt[1],team,'targets',td)}}rows=[...m.values()].sort((a,b)=>(b.carries+b.targets)-(a.carries+a.targets)||b.td-a.td);render();status.textContent=`${rows.length} players • ${events.length} games scanned. Play-text attribution is best-effort.`}catch(e){status.textContent='Failed: '+e.message}finally{go.disabled=false}};q.oninput=render</script></body></html>
