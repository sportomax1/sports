<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Depth Chart Lab</title><style>:root{color-scheme:dark;--bg:#07101b;--card:#0e1928;--card2:#132238;--line:#263a55;--muted:#91a4bd;--gold:#f4b400;--green:#7ee787;--red:#ff7b72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px system-ui,-apple-system,sans-serif}.shell{max-width:1400px;margin:auto;padding:18px}h1{margin:0;font-size:34px}.muted{color:var(--muted)}.tabs,.controls,.modes{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0}button,select,input{border:1px solid #345;background:var(--card2);color:#fff;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}button.active{background:var(--gold);color:#111;font-weight:900}.mode.active{background:#1f6feb;color:#fff}.status{padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}.ok{color:var(--green)}.warn{color:#ffd45c}.error{color:var(--red)}.hero{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}.hero img{width:64px;height:64px;object-fit:contain}.hero h2{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:10px}.group{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.group>h3{margin:0;padding:11px;background:var(--card2)}.position{padding:10px;border-top:1px solid var(--line)}.position-title{font-weight:900;color:#ffd45c;margin-bottom:6px}.player{display:grid;grid-template-columns:30px 42px 1fr auto;gap:8px;align-items:center;background:#091421;border-radius:8px;padding:6px;margin:5px 0}.player img{width:38px;height:38px;border-radius:50%;object-fit:cover}.rank{font-weight:900;text-align:center}.starter{color:var(--green)}.badge{font-size:10px;border:1px solid #40516a;border-radius:15px;padding:3px 6px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #345;border-radius:10px}.debug{font-size:11px;word-break:break-all;color:#7890ad}details{margin:10px 0;background:#0b1522;border:1px solid var(--line);border-radius:10px;padding:9px}</style></head><body><main class="shell"><h1>Depth Chart Lab</h1><div class="muted">Core Four team explorer. Choose true ESPN Depth Chart mode or complete Roster mode.</div><div id="sports" class="tabs"></div><div class="modes"><button class="mode" data-mode="depth">Depth Chart</button><button class="mode" data-mode="roster">Roster</button></div><div class="controls"><label>Team <select id="team"></select></label><input id="filter" placeholder="Filter player / position"><button id="reload">Reload</button></div><div id="status" class="status muted">Starting…</div><div id="hero"></div><details><summary>API diagnostics</summary><div id="debug" class="debug"></div></details><div id="out"></div></main><script>'use strict';const CFG={NFL:{sport:'football',league:'nfl'},NBA:{sport:'basketball',league:'nba'},MLB:{sport:'baseball',league:'mlb'},NHL:{sport:'hockey',league:'nhl'}};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let sport=localStorage.depthSportV5||'NFL',mode=localStorage.depthModeV5||'depth',teams=[],model=null,logs=[];function log(x){logs.push(x);$('debug').innerHTML=logs.map(esc).join('<br>')}async function json(url){log('GET '+url);let r;try{r=await fetch(url,{cache:'no-store',credentials:'omit'})}catch(e){log('FETCH ERROR '+e.message);throw e}log('HTTP '+r.status);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function teamsFrom(j){return(j?.sports?.[0]?.leagues?.[0]?.teams||j?.teams||[]).map(x=>x.team||x).filter(x=>x?.id)}function parseDepth(j){const charts=Array.isArray(j?.depthCharts)?j.depthCharts:Array.isArray(j?.items)?j.items:(j?.positions?[j]:[]),out=[];for(const c of charts){const raw=c?.positions||{},entries=Array.isArray(raw)?raw.map((p,i)=>[String(i),p]):Object.entries(raw),positions=[];for(const [key,p] of entries){let items=p?.athletes||p?.items||[];if(!Array.isArray(items))items=Object.values(items||{});items=items.filter(Boolean);if(items.length)positions.push({name:p?.position?.name||p?.name||key,abbr:p?.position?.abbreviation||p?.abbreviation||key.toUpperCase(),items})}if(positions.length)out.push({name:c?.name||c?.displayName||'Depth Chart',positions})}return out}function parseRoster(j){const src=Array.isArray(j?.athletes)?j.athletes:Array.isArray(j?.items)?j.items:[],map=new Map();for(const g of src){if(Array.isArray(g?.items)){const n=typeof g.position==='string'?g.position:(g?.position?.name||g?.name||g?.abbreviation||'Roster');for(const a of g.items){if(!map.has(n))map.set(n,[]);map.get(n).push(a)}}else if(g){const n=g?.position?.abbreviation||g?.position?.name||'Roster';if(!map.has(n))map.set(n,[]);map.get(n).push(g)}}return[...map].map(([name,items])=>({name,items}))}function refUrl(x){return String(x?.athlete?.$ref||x?.player?.$ref||x?.$ref||'').replace(/^http:/,'https:')}function embedded(x){const a=x?.athlete||x?.player||x||{};const name=a?.displayName||a?.fullName||a?.shortName||[a?.firstName,a?.lastName].filter(Boolean).join(' ');return name?{id:a.id||'',name,jersey:a.jersey||'',pos:a.position?.abbreviation||a.position?.name||'',head:a.headshot?.href||a.headshot||'',rank:Number(x?.rank??a?.rank??0)}:null}async function resolveOne(x){const e=embedded(x);if(e)return e;const u=refUrl(x);if(!u)return{id:'',name:'Unknown',jersey:'',pos:'',head:'',rank:Number(x?.rank||0)};try{const a=await json(u);return{id:a.id||'',name:a.displayName||a.fullName||a.shortName||[a.firstName,a.lastName].filter(Boolean).join(' ')||'Unknown',jersey:a.jersey||'',pos:a.position?.abbreviation||a.position?.name||'',head:a.headshot?.href||a.headshot||'',rank:Number(x?.rank??a?.rank??0)}}catch{return{id:'',name:'Unknown',jersey:'',pos:'',head:'',rank:Number(x?.rank||0)}}}async function hydrate(groups,depth){const all=[];depth?groups.forEach(g=>g.positions.forEach(p=>p.items.forEach(x=>all.push(x)))):groups.forEach(g=>g.items.forEach(x=>all.push(x)));const vals=await Promise.all(all.map(resolveOne)),m=new Map(all.map((x,i)=>[x,vals[i]]));depth?groups.forEach(g=>g.positions.forEach(p=>p.items=p.items.map(x=>({...x,_player:m.get(x)})))):groups.forEach(g=>g.items=g.items.map(x=>({...x,_player:m.get(x)})));return groups}function ath(x){return x?._player||embedded(x)||{id:'',name:'Unknown',jersey:'',pos:'',head:'',rank:Number(x?.rank||0)}}function row(x,i,d){const a=ath(x),r=d?(a.rank||i+1):0,head=a.head||(a.id?`https://a.espncdn.com/i/headshots/${CFG[sport].league}/players/full/${a.id}.png`:'');return`<div class="player"><div class="rank ${r===1?'starter':''}">${d?r:'•'}</div><img src="${esc(head)}" alt="" onerror="this.style.opacity=.12"><div><b>${esc(a.name)}</b><div class="muted">${a.jersey?'#'+esc(a.jersey)+' · ':''}${esc(a.pos)}</div></div><span class="badge">${d?(r===1?'Starter':'Depth '+r):'Roster'}</span></div>`}function render(){if(!model)return;const q=$('filter').value.toLowerCase().trim();if(model.kind==='depth'){$('out').innerHTML=`<div class="grid">${model.groups.map(g=>`<section class="group"><h3>${esc(g.name)}</h3>${g.positions.map(p=>{const items=p.items.filter(x=>!q||p.name.toLowerCase().includes(q)||p.abbr.toLowerCase().includes(q)||ath(x).name.toLowerCase().includes(q));return items.length?`<div class="position"><div class="position-title">${esc(p.abbr||p.name)} · ${esc(p.name)}</div>${[...items].sort((a,b)=>(ath(a).rank||99)-(ath(b).rank||99)).map((x,i)=>row(x,i,true)).join('')}</div>`:''}).join('')}</section>`).join('')}</div>`}else{$('out').innerHTML=`<div class="grid">${model.groups.map(g=>{const items=g.items.filter(x=>!q||g.name.toLowerCase().includes(q)||ath(x).name.toLowerCase().includes(q));return items.length?`<section class="group"><h3>${esc(g.name)}</h3><div class="position">${items.map((x,i)=>row(x,i,false)).join('')}</div></section>`:''}).join('')}</div>`}}function renderNav(){$('sports').innerHTML=Object.keys(CFG).map(s=>`<button data-s="${s}" class="${s===sport?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.depthSportV5=sport;renderNav();loadTeams()});document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}async function loadTeams(){logs=[];$('debug').innerHTML='';model=null;$('out').innerHTML='';$('status').textContent='Loading '+sport+' teams…';const c=CFG[sport];try{const j=await json(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams?limit=100`);teams=teamsFrom(j).sort((a,b)=>(a.displayName||'').localeCompare(b.displayName||''));if(!teams.length)throw Error('No teams returned');$('team').innerHTML=teams.map(t=>`<option value="${esc(t.id)}">${esc(t.displayName||t.name)}</option>`).join('');const saved=localStorage.getItem('depthTeamV5:'+sport);if(saved&&teams.some(t=>String(t.id)===saved))$('team').value=saved;loadTeam()}catch(e){$('status').innerHTML=`<span class="error">Team list failed: ${esc(e.message)}</span>`}}async function loadTeam(){const id=$('team').value;if(!id)return;logs=[];$('debug').innerHTML='';model=null;$('out').innerHTML='';const c=CFG[sport],t=teams.find(x=>String(x.id)===String(id));localStorage.setItem('depthTeamV5:'+sport,id);$('hero').innerHTML=`<div class="hero"><img src="${esc(t?.logos?.[0]?.href||'')}" alt=""><div><h2>${esc(t?.displayName||t?.name||'Team')}</h2><div class="muted">${sport} · ${mode==='depth'?'Depth Chart':'Roster'} mode · ESPN ID ${esc(id)}</div></div></div>`;if(mode==='roster'){try{$('status').textContent='Loading ESPN roster…';const j=await json(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams/${id}/roster`),g=parseRoster(j);if(!g.length)throw Error('No roster players returned');await hydrate(g,false);model={kind:'roster',groups:g};$('status').innerHTML='<span class="ok">Roster loaded.</span> Complete ESPN roster grouped by position.';render()}catch(e){$('status').innerHTML=`<span class="error">Roster failed: ${esc(e.message)}</span>`}return}try{$('status').textContent='Loading ESPN depth chart…';const j=await json(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams/${id}/depthcharts`),g=parseDepth(j);if(!g.length)throw Error('Endpoint returned no depth-chart positions');await hydrate(g,true);model={kind:'depth',groups:g};$('status').innerHTML='<span class="ok">True ESPN depth chart loaded.</span> Rankings shown are ESPN depth order.';render()}catch(e){$('status').innerHTML=`<span class="warn">No usable ESPN ${sport} depth chart returned.</span> Switch to Roster mode to view the team. <span class="muted">${esc(e.message)}</span>`;log('DEPTH MODE STOPPED: no roster substitution by design.')}}$('team').onchange=loadTeam;$('reload').onclick=loadTeam;$('filter').oninput=render;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;localStorage.depthModeV5=mode;renderNav();loadTeam()});renderNav();loadTeams();</script></body></html>
