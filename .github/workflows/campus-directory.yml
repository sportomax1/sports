name: Campus Basketball Division I Directory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/campus-directory.yml'
      - 'scripts/build-campus-directory.py'
  schedule:
    - cron: '35 11 * * 1'
permissions:
  contents: write
jobs:
  teams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch complete NCAA Division I team directories
        run: python scripts/build-campus-directory.py
      - name: Commit validated team directories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/campus-directory/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NCAA Division I college basketball team directories"
            git push
          fi
