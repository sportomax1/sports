name: College Movement ESPN API smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/college-roster-smoke.yml'
      - 'college-roster-engine.js'
      - 'college-movement.html'
      - 'scripts/test-college-roster.mjs'
      - 'scripts/test-national-college.mjs'
      - 'scripts/test-national-page.mjs'
      - 'college-national-engine.js'
      - 'college-logo-ui.js'
      - 'scripts/test-college-logos.mjs'
      - 'scripts/build-national-college-rosters.mjs'
      - 'scripts/build-college-player-index.mjs'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all college dashboard JavaScript
        run: |
          node --check college-national-engine.js
          node --check college-logo-ui.js
          node --check college-roster-engine.js
          node --check scripts/build-national-college-rosters.mjs
          node --check scripts/build-college-player-index.mjs
      - name: Test national roster inference and real data quality
        run: node scripts/test-national-college.mjs
      - name: Test national dashboard UI against real snapshots
        run: node scripts/test-national-page.mjs
      - name: Test ESPN school logos, logo picker, profile history and fallback
        run: node scripts/test-college-logos.mjs
      - name: Test ESPN season-index and athlete-profile endpoints
        run: node scripts/test-college-roster.mjs
