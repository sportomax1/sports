<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Special Teams Matrix</title>
<style>
:root{
  --bg:#071018;--panel:#0d1822;--panel2:#122230;--line:#243545;--text:#edf5fb;--muted:#92a6b7;
  --green:#7ee787;--blue:#58a6ff;--gold:#ffd166;--red:#ff7b72;--shadow:#0003
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 10% 0,#58a6ff18,transparent 28rem),radial-gradient(circle at 90% 0,#7ee78712,transparent 25rem),var(--bg)}
button,select{font:inherit}
.top{position:sticky;top:0;z-index:50;background:#071018f2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.bar{max-width:1900px;margin:auto;padding:10px 14px;display:flex;align-items:end;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:8px}.ball{width:38px;height:38px;border:1px solid #2b4860;border-radius:10px;display:grid;place-items:center;background:#102131}
.brand h1{font-size:17px;margin:0}.brand small{font-size:10px;color:var(--muted)}
.c{display:grid;gap:3px}.c label{font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.7px}
select,button{height:36px;border:1px solid var(--line);border-radius:9px;background:#101c27;color:var(--text);padding:0 10px}
button{font-weight:800;cursor:pointer}button.primary{background:var(--green);color:#06110a;border-color:var(--green)}button:disabled{opacity:.55;cursor:progress}
.main{max-width:1900px;margin:auto;padding:14px}.status{min-height:24px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px #7ee787aa}.dot.load{background:var(--gold);animation:pulse 1s infinite}.dot.err{background:var(--red);box-shadow:none}@keyframes pulse{50%{opacity:.35}}
.error{display:none;white-space:pre-wrap;border:1px solid #ff7b7280;background:#ff7b7210;color:#ffc4bf;padding:9px 11px;border-radius:9px;font-size:11px;margin-bottom:9px}
.metrics{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:8px;margin-bottom:10px}.metric{border:1px solid var(--line);background:linear-gradient(#111f2b,#0d1822);border-radius:10px;padding:9px 11px}.metric b{font-size:20px}.metric span{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.panel{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#0d1822}.ph{padding:9px 11px;border-bottom:1px solid var(--line);background:#0d1a25;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.ph b{font-size:13px}.ph small,.chips{color:var(--muted);font-size:10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:3px 7px;background:#101e2a}
.wrap{overflow:auto;max-height:calc(100vh - 230px)}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#0d1822;text-align:center}th{position:sticky;top:0;z-index:10;background:var(--panel2);height:38px;padding:6px 8px;color:#b8c8d5;font-size:9px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}td{height:72px;padding:6px 8px}
.playercol{position:sticky;left:0;z-index:13;min-width:278px;max-width:278px;text-align:left;background:#0f1c27;box-shadow:8px 0 14px var(--shadow)}th.playercol{z-index:25;background:#152837}
.stat{min-width:66px}.stickyStat{position:sticky;z-index:12;background:#0d1822}.s1{left:278px}.s2{left:344px}.s3{left:410px}.s4{left:476px;box-shadow:8px 0 14px var(--shadow)}th.stickyStat{z-index:22;background:var(--panel2)}
.player{display:grid;grid-template-columns:54px minmax(0,1fr) 32px;align-items:center;gap:9px}.facebox{width:54px;height:54px;border-radius:10px;overflow:hidden;background:#1a2b39;border:1px solid #2a4052;display:grid;place-items:center}.face{width:100%;height:100%;object-fit:cover;object-position:center top}.fallback{font-weight:900;color:#9ab0c1}.pn{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ps{font-size:10px;color:var(--muted);margin-top:3px}.team{width:29px;height:29px;object-fit:contain}.plink{color:inherit;text-decoration:none}.plink:hover .pn{color:var(--blue)}
.big{font-size:16px;font-weight:900}.small{font-size:8px;color:var(--muted);margin-top:2px}
.kickcell{min-width:92px;width:92px;background:#0c1922}.kick{min-height:50px;border:1px solid #264256;border-radius:8px;background:linear-gradient(#132a38,#0f202b);display:grid;align-content:center;gap:2px;padding:4px;color:inherit;text-decoration:none;transition:.12s}.kick:hover{transform:translateY(-1px);filter:brightness(1.08)}.k50{border-color:#7ee78788;background:linear-gradient(#18392f,#10271f)}.k60{border-color:#ffd166aa;background:linear-gradient(#3b321b,#282315)}.dist{font-size:18px;font-weight:900;line-height:1}.dist i{font-style:normal;font-size:8px;color:var(--muted);margin-left:2px}.km{font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yardHead{min-width:58px;width:58px}.yardCell{min-width:58px;width:58px;height:62px;padding:4px;background:#0c1922}.yardBox{min-height:46px;border-radius:8px;border:1px solid #263b4a;background:#10202b;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:3px}.yardBox.perfect{border-color:#7ee78766;background:#10291d}.yardBox.mixed{border-color:#ffd16666;background:#292511}.yardBox.miss{border-color:#ff7b7266;background:#2b1718}.yardBox.punts{border-color:#58a6ff55;background:#10243a}.ok{color:var(--green);font-size:12px;font-weight:900;line-height:1.2}.bad{color:var(--red);font-size:12px;font-weight:900;line-height:1.2}.count{color:#bcdcff;font-size:16px;font-weight:900;line-height:1}.countLabel{font-size:7px;color:var(--muted);font-weight:800}
.empty{padding:42px 18px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:4px}
@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.wrap{max-height:calc(100vh - 300px)}}
@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.playercol{min-width:224px;max-width:224px}.s1{left:224px}.s2{left:290px}.s3{left:356px}.s4{left:422px}.player{grid-template-columns:44px minmax(0,1fr) 25px}.facebox{width:44px;height:44px}.team{width:24px;height:24px}}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <div class="brand"><div class="ball">🏈</div><div><h1>NFL Special Teams Matrix</h1><small>ESPN play-by-play • kickers + punters • duplicate-safe</small></div></div>
  <div class="c"><label>Season</label><select id="season"></select></div>
  <div class="c"><label>Type</label><select id="type"><option value="2">Regular</option><option value="1">Preseason</option><option value="3">Postseason</option></select></div>
  <div class="c"><label>Week</label><select id="week"></select></div>
  <div class="c"><label>Scope</label><select id="scope"><option value="through">Season through week</option><option value="week">Selected week only</option></select></div>
  <div class="c"><label>Role</label><select id="role"><option value="kicker">Kickers</option><option value="punter">Punters</option></select></div>
  <div class="c"><label>Matrix</label><select id="layout"><option value="list">Kick list • long → short</option><option value="yards">Yardage grid • max → min</option></select></div>
  <div class="c"><label>Sort</label><select id="sort"></select></div>
  <button id="load" class="primary">Load</button><button id="csv" disabled>Export CSV</button>
</div></header>
<main class="main">
  <div id="status" class="status"><span class="dot"></span><span>Ready.</span></div>
  <div id="error" class="error"></div>
  <section class="metrics">
    <div class="metric"><b id="m1">—</b><span id="l1">Made FGs</span></div>
    <div class="metric"><b id="m2">—</b><span id="l2">Attempts</span></div>
    <div class="metric"><b id="m3">—</b><span id="l3">Kickers</span></div>
    <div class="metric"><b id="m4">—</b><span id="l4">FG%</span></div>
    <div class="metric"><b id="m5">—</b><span id="l5">50+ Made</span></div>
    <div class="metric"><b id="m6">—</b><span id="l6">Longest Made</span></div>
  </section>
  <section class="panel"><div class="ph"><div><b id="title">Special teams</b> <small id="sub">Loading ESPN data…</small></div><div class="chips" id="chips"></div></div><div id="wrap" class="wrap"><div class="empty"><b>Loading ESPN data…</b></div></div></section>
</main>
<script>
(()=>{'use strict';
const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const E=id=>document.getElementById(id);
const el={season:E('season'),type:E('type'),week:E('week'),scope:E('scope'),role:E('role'),layout:E('layout'),sort:E('sort'),load:E('load'),csv:E('csv'),status:E('status'),error:E('error'),wrap:E('wrap'),title:E('title'),sub:E('sub'),chips:E('chips'),m:[1,2,3,4,5,6].map(n=>E(`m${n}`)),l:[1,2,3,4,5,6].map(n=>E(`l${n}`))};
let state={fg:[],punts:[],rows:[],games:0};
const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const norm=(s='')=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const pct=(m,a)=>a?100*m/a:0;
function status(t,m='ok'){el.status.innerHTML=`<span class="dot ${m==='load'?'load':m==='err'?'err':''}"></span><span>${esc(t)}</span>`}
function error(t=''){el.error.style.display=t?'block':'none';el.error.textContent=t}
function weeks(){let n=+el.type.value===1?4:+el.type.value===3?5:18,w=+el.week.value||1;el.week.innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}">Week ${i+1}</option>`).join('');el.week.value=String(Math.min(w,n))}
async function get(u,ms=18000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{cache:'no-store',signal:c.signal});if(!r.ok)throw Error(`HTTP ${r.status}`);return await r.json()}finally{clearTimeout(t)}}
async function pool(a,n,fn,prog){let out=new Array(a.length),i=0,d=0;async function w(){for(;;){let x=i++;if(x>=a.length)return;try{out[x]=await fn(a[x],x)}catch(e){out[x]={__error:e,item:a[x]}}finally{prog?.(++d,a.length)}}}await Promise.all(Array.from({length:Math.min(n,a.length||1)},w));return out}
function team(c){let t=c?.team||{};return{id:String(t.id??c?.id??''),name:t.displayName||t.name||'',abbr:t.abbreviation||'',logo:t.logo||t.logos?.[0]?.href||'',homeAway:c?.homeAway||''}}
function teams(ev){return(ev?.competitions?.[0]?.competitors||[]).map(team)}
function boardURL(y,t,w){return`${B}/scoreboard?dates=${y}&seasontype=${t}&week=${w}&limit=100`}
function sumURL(id){return`${B}/summary?event=${id}`}
function rosterURL(id,y){return`${B}/teams/${id}/roster?season=${y}`}
function shot(id){return id?`https://a.espncdn.com/i/headshots/nfl/players/full/${id}.png`:''}
function logo(t){if(t?.logo)return t.logo;return t?.abbr?`https://a.espncdn.com/i/teamlogos/nfl/500/${String(t.abbr).toLowerCase()}.png`:''}
function addRole(x,role){x.roles=x.roles||[];if(!x.roles.includes(role))x.roles.push(role);return x}
function athleteCtx(s){let index=new Map(),byTeam={kicker:new Map(),punter:new Map()};for(const g of s?.boxscore?.players||[]){let tm=team({team:g.team});for(const cat of g?.statistics||[]){let ct=`${cat?.name||''} ${cat?.displayName||''} ${cat?.label||''}`.toLowerCase(),catRole=/punt/.test(ct)?'punter':/field.?goal|\bfg\b|kick/.test(ct)?'kicker':'';for(const z of cat?.athletes||[]){let a=z?.athlete||{};if(!a.id)continue;let id=String(a.id),old=index.get(id)||{},pos=String(a.position?.abbreviation||old.position||'').toUpperCase(),x={...old,id,name:a.displayName||a.fullName||a.shortName||old.name||'',headshot:a.headshot?.href||old.headshot||'',position:pos,team:tm,roles:[...(old.roles||[])]};if(catRole)addRole(x,catRole);if(['K','PK'].includes(pos))addRole(x,'kicker');if(['P','PT'].includes(pos)||pos.includes('PUNTER'))addRole(x,'punter');index.set(id,x);for(const role of x.roles){if(!tm.id)continue;let q=byTeam[role].get(tm.id)||[];let at=q.findIndex(v=>v.id===id);if(at>=0)q[at]=x;else q.push(x);byTeam[role].set(tm.id,q)}}}}return{index,byTeam}}
function roleMatch(a,role){let p=String(a?.position||'').toUpperCase();return(a?.roles||[]).includes(role)||(role==='kicker'&&['K','PK'].includes(p))||(role==='punter'&&(['P','PT'].includes(p)||p.includes('PUNTER')))}
function participant(p,ctx,role){let list=[...(p?.participants||[]),...(p?.players||[])],all=list.map(x=>{let a=x?.athlete||{};return{id:String(a.id||x?.playerId||x?.id||''),name:a.displayName||a.fullName||x?.displayName||'',headshot:a.headshot?.href||''}}).filter(x=>x.id||x.name);if(ctx){let z=all.find(x=>x.id&&ctx.index.has(x.id)&&roleMatch(ctx.index.get(x.id),role));if(z)return z}return all[0]||{id:'',name:'',headshot:''}}
function specialistName(p,role){for(let s of[p?.shortText,p?.text,p?.description].filter(Boolean).map(String)){s=s.replace(/^\s*\([^)]*\)\s*/,'').replace(/^\s*\d{1,2}:\d{2}\s*[-–—]\s*/,'').trim();let m;if(role==='kicker'){m=s.match(/([A-Z][A-Za-z.'-]+(?:\s+[A-Z][A-Za-z.'-]+)+|[A-Z]\.?\s*[A-Za-z.'-]+)\s+(?:made\s+|makes\s+|missed\s+|misses\s+)?\d{1,2}\s*(?:yd|yard(?:s)?)\s+field\s+goal/i);if(m)return m[1].replace(/\s+/g,' ').trim();m=s.match(/field\s+goal\s+(?:by\s+)?(.+?)(?=\s+from\s+\d|\s+\d{1,2}\b|$)/i);if(m)return m[1].trim()}else{m=s.match(/^([A-Z][A-Za-z.'-]+(?:\s+[A-Z][A-Za-z.'-]+)+|[A-Z]\.?\s*[A-Za-z.'-]+)\s+punts?\b/i);if(m)return m[1].replace(/\s+/g,' ').trim();m=s.match(/punt(?:ed)?\s+by\s+([A-Z][A-Za-z.'-]+(?:\s+[A-Z][A-Za-z.'-]+)+|[A-Z]\.?\s*[A-Za-z.'-]+)/i);if(m)return m[1].trim()}}return''}
function match(a,b){if(!a||!b)return false;if(norm(a)===norm(b))return true;let p=String(a).trim().split(/\s+/),q=String(b).trim().split(/\s+/);if(p.length>1&&norm(`${p[0][0]}${p.at(-1)}`)===norm(b))return true;if(q.length>1&&norm(`${q[0][0]}${q.at(-1)}`)===norm(a))return true;return norm(p.at(-1))===norm(q.at(-1))&&(p[0]?.[0]||'').toLowerCase()===(q[0]?.[0]||'').toLowerCase()}
function playTeam(p,ath,ts){let r=p?.team||p?.teamInfo;if(r?.id)return ts.find(t=>t.id===String(r.id))||team({team:r});if(ath?.team?.id)return ts.find(t=>t.id===String(ath.team.id))||ath.team;return null}
function resolve(p,ctx,tid='',role='kicker'){let d=participant(p,ctx,role);if(d.id&&ctx.index.has(d.id)&&roleMatch(ctx.index.get(d.id),role))return{...ctx.index.get(d.id),...d,team:ctx.index.get(d.id).team};let n=d.name||specialistName(p,role);if(n)for(const a of ctx.index.values())if(roleMatch(a,role)&&match(a.name,n))return a;if(tid){let q=ctx.byTeam[role].get(String(tid))||[];if(n){let z=q.find(v=>match(v.name,n));if(z)return z}if(q.length===1)return q[0]}return{id:d.id||'',name:n||'',headshot:d.headshot||'',team:null,position:'',roles:[role]}}
function playText(p){return[p?.shortText,p?.text,p?.description,p?.type?.text,p?.type?.abbreviation,p?.playType?.text,p?.playType?.abbreviation].filter(Boolean).join(' ')}
function noPlay(p){return/\bno\s+play\b|nullified|play\s+nullified/i.test(playText(p))}
function fgDistance(p){let t=playText(p);for(const r of[/(\d{1,2})\s*(?:yd|yard(?:s)?)\s+(?:field\s+goal|fg)/i,/field\s+goal(?:\s+attempt)?(?:\s+from)?\s+(\d{1,2})/i]){let m=t.match(r);if(m){let d=+m[1];if(d>=15&&d<=80)return d}}return null}
function puntDistance(p){let t=playText(p);for(const r of[/\bpunts?\s+(\d{1,3})\s+yards?\b/i,/\bpunt(?:ed)?\s+(\d{1,3})\s+yards?\b/i]){let m=t.match(r);if(m){let d=+m[1];if(d>=0&&d<=100)return d}}return null}
function isFG(p){let t=playText(p).toLowerCase(),a=String(p?.type?.abbreviation||p?.playType?.abbreviation||'').toUpperCase();return/field\s+goal/.test(t)||a==='FG'||a.includes('FIELDGOAL')}
function isPunt(p){let t=playText(p).toLowerCase(),a=String(p?.type?.abbreviation||p?.playType?.abbreviation||'').toUpperCase();return/\bpunts?\b/.test(t)||a==='PUNT'||a.includes('PUNT')}
function fgResult(p,source){let t=playText(p).toLowerCase();if(/no\s+good|miss(?:ed|es)?|blocked|failed/.test(t))return false;if(/\bis\s+good\b|\bgood\b|\bmade\b|\bmakes\b|successful/.test(t))return true;if((p?.scoringPlay===true||source==='scoring')&&(+p?.scoreValue===3||source==='scoring'))return true;return null}
function clock(p){return typeof p?.clock==='string'?p.clock:p?.clock?.displayValue||p?.displayClock||''}
function period(p){return +(typeof p?.period==='object'?p.period?.number||p.period?.value:p?.period)||0}
function candidatePlays(s){let out=[];const add=(p,source,rank)=>{if(p&&typeof p==='object')out.push({p,source,rank})};for(const d of s?.drives?.previous||[])for(const p of d?.plays||[])add(p,'drive',4);if(s?.drives?.current)for(const p of s.drives.current?.plays||[])add(p,'drive',4);for(const p of s?.playByPlay?.plays||[])add(p,'pbp',3);for(const p of s?.plays||[])add(p,'plays',2);for(const p of s?.scoringPlays||[])add(p,'scoring',1);return out}
function extract(s,g){let ts=g.eventTeams||[],ctx=athleteCtx(s),out=[];for(const {p,source,rank} of candidatePlays(s)){if(noPlay(p))continue;let kind=isFG(p)?'kicker':isPunt(p)?'punter':'';if(!kind)continue;let distance=kind==='kicker'?fgDistance(p):puntDistance(p);if(distance===null)continue;let made=kind==='kicker'?fgResult(p,source):null;if(kind==='kicker'&&made===null)continue;let hint=playTeam(p,null,ts),a=resolve(p,ctx,hint?.id||'',kind),tm=playTeam(p,a,ts),opp=tm?ts.find(t=>t.id!==tm.id):null,text=p?.shortText||p?.text||p?.description||playText(p);out.push({kind,eventId:g.eventId,week:g.week,distance,made,playerId:a.id||'',playerName:a.name||specialistName(p,kind)||(kind==='kicker'?'Unknown kicker':'Unknown punter'),headshot:a.headshot||shot(a.id),team:tm||a.team||null,opponent:opp,period:period(p),clock:clock(p),text,sequence:String(p?.sequenceNumber||p?.id||p?.playId||''),source,rank,touchback:kind==='punter'&&/touchback/i.test(text),fairCatch:kind==='punter'&&/fair\s+catch/i.test(text),outOfBounds:kind==='punter'&&/out\s+of\s+bounds/i.test(text)})}return out}
function semanticKey(x){let base=[x.eventId,x.kind,x.period||'',x.clock||'',x.distance];if(x.kind==='kicker')base.push(x.made?'M':'X');if(!x.period&&!x.clock)base.push(x.sequence||norm(x.text).slice(0,80));return base.join('|')}
