name: Sports Name Explorer Data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/name-explorer-data.yml'
      - 'scripts/build-name-rosters.py'
  schedule:
    - cron: '15 11 * * 1'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch roster snapshots
        run: python scripts/build-name-rosters.py
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/name-explorer/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Sports Name Explorer roster snapshots"
            git push
          fi
