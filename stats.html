<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats Lab</title><style>body{margin:0;background:#07101b;color:#fff;font:14px system-ui}.shell{max-width:1400px;margin:auto;padding:20px}.muted{color:#91a4bd}.tabs,.ctl{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center}button,select,input{background:#132238;color:#fff;border:1px solid #345;border-radius:8px;padding:9px}button.active{background:#f4b400;color:#111}.card{background:#0e1928;border:1px solid #263a55;border-radius:12px;padding:12px;margin:10px 0}.wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:8px;border-bottom:1px solid #263a55;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.player{display:flex;align-items:center;gap:7px}.player img{width:34px;height:34px;border-radius:50%;object-fit:cover}.error{color:#ff8d87}.pill{border:1px solid #40516a;border-radius:20px;padding:3px 7px}</style></head><body><main class="shell"><h1>Core Four Stats Lab</h1><div class="muted">NFL · NBA · MLB · NHL player statistics, team views and league leaders by season.</div><div id="sports" class="tabs"></div><div class="card ctl"><label>Season <select id="season"></select></label><label>View <select id="view"><option value="league">League Leaders</option><option value="team">Team Stats</option></select></label><label id="teamWrap">Team <select id="team"></select></label><label>Season type <select id="type"><option value="2">Regular</option><option value="3">Playoffs</option></select></label><label>Category <select id="category"></select></label><input id="search" placeholder="Filter player"><button id="load">Load</button></div><div id="status" class="muted"></div><div id="summary"></div><div id="out" class="wrap"></div></main><script>
const CFG={NFL:['football','nfl'],NBA:['basketball','nba'],MLB:['baseball','mlb'],NHL:['hockey','nhl']};const CATS={NFL:['passing','rushing','receiving','defensive','kicking','punting'],NBA:['general'],MLB:['batting','pitching'],NHL:['skating','goaltending']};const $=x=>document.getElementById(x);let sport=localStorage.statsSport||'NFL',teams=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u){const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function current(){const d=new Date();return sport==='MLB'?d.getFullYear():(d.getMonth()<6?d.getFullYear()-1:d.getFullYear())}function buttons(){$('sports').innerHTML=Object.keys(CFG).map(s=>`<button data-s="${s}" class="${s===sport?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.statsSport=sport;buttons();setup();loadTeams()})}function setup(){const y=current();$('season').innerHTML=Array.from({length:27},(_,i)=>y-i).map(x=>`<option>${x}</option>`).join('');$('category').innerHTML=CATS[sport].map(x=>`<option value="${x}">${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}async function loadTeams(){try{const [cat,lg]=CFG[sport],j=await api(`https://site.api.espn.com/apis/site/v2/sports/${cat}/${lg}/teams?limit=100`);teams=(j?.sports?.[0]?.leagues?.[0]?.teams||[]).map(x=>x.team||x);$('team').innerHTML=teams.sort((a,b)=>a.displayName.localeCompare(b.displayName)).map(t=>`<option value="${t.id}">${esc(t.displayName)}</option>`).join('');run()}catch(e){$('status').innerHTML=`<span class="error">Teams failed: ${esc(e.message)}</span>`}}function athlete(x){return x?.athlete||x?.player||x||{}}function extractLeaderRows(j){const rows=[];const walk=(o,cat='')=>{if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(x=>walk(x,cat));return}const next=o.name||o.displayName||o.abbreviation||cat;if(Array.isArray(o.leaders)){for(const l of o.leaders){const a=athlete(l);rows.push({cat:next,a,value:l.displayValue??l.value??'',rank:l.rank??'',team:l.team?.abbreviation||a.team?.abbreviation||''})}}for(const [k,v] of Object.entries(o)){if(k!=='leaders'&&typeof v==='object')walk(v,next)}};walk(j);return rows}function render(rows){const q=$('search').value.toLowerCase().trim();rows=rows.filter(r=>!q||(r.a.displayName||r.a.fullName||'').toLowerCase().includes(q));$('out').innerHTML=rows.length?`<table><thead><tr><th>Player</th><th>Category</th><th>Rank</th><th>Team</th><th>Value</th></tr></thead><tbody>${rows.map(r=>{const a=r.a,head=a.headshot?.href||'';return`<tr><td><div class="player"><img src="${esc(head)}" onerror="this.style.opacity=.15"><b>${esc(a.displayName||a.fullName||'Unknown')}</b></div></td><td>${esc(r.cat)}</td><td>${esc(r.rank)}</td><td>${esc(r.team)}</td><td><b>${esc(r.value)}</b></td></tr>`}).join('')}</tbody></table>`:'<div class="card muted">No matching statistics returned.</div>'}async function run(){$('status').textContent='Loading statistics…';$('out').innerHTML='';try{const [cat,lg]=CFG[sport],year=$('season').value,type=$('type').value,view=$('view').value,team=$('team').value;let urls=[];if(view==='team')urls=[`https://site.api.espn.com/apis/site/v2/sports/${cat}/${lg}/teams/${team}/leaders?season=${year}&seasontype=${type}`,`https://sports.core.api.espn.com/v2/sports/${cat}/leagues/${lg}/seasons/${year}/types/${type}/teams/${team}/leaders?lang=en&region=us`];else urls=[`https://site.api.espn.com/apis/site/v2/sports/${cat}/${lg}/statistics?season=${year}&seasontype=${type}`,`https://sports.core.api.espn.com/v2/sports/${cat}/leagues/${lg}/seasons/${year}/types/${type}/leaders?lang=en&region=us`];let last;for(const u of urls){try{const j=await api(u),rows=extractLeaderRows(j);if(rows.length){window._rows=rows;render(rows);$('status').textContent=`${sport} ${year} · ${view==='team'?'team':'league'} leaders loaded`;return}}catch(e){last=e}}throw last||Error('No leader rows returned')}catch(e){$('status').innerHTML=`<span class="error">Stats failed: ${esc(e.message)}</span>`}}$('view').onchange=()=>{$('teamWrap').style.display=$('view').value==='team'?'':'none';run()};$('load').onclick=run;$('search').oninput=()=>window._rows&&render(window._rows);$('season').onchange=run;$('type').onchange=run;$('team').onchange=run;buttons();setup();loadTeams();
</script></body></html>
