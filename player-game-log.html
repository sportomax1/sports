<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Game Log Explorer</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui}.w{max-width:1300px;margin:auto;padding:18px}.muted{color:#91a3ba}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}select,input,button{background:#101d31;color:#fff;border:1px solid #31445f;border-radius:8px;padding:8px}button{background:#1769c2;font-weight:800}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.card,.table{background:#0e192a;border:1px solid #26364d;border-radius:10px;padding:10px}.card b{font-size:20px;display:block}.table{overflow:auto;margin-top:10px}table{border-collapse:collapse;width:100%}th,td{padding:7px;border-bottom:1px solid #26364d;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.name{text-align:left!important;font-weight:800}.err{color:#ff8b8b}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class=w><h1>🏈 Player Game Log Explorer</h1><div class=muted>One normalized row per player per game. ESPN box-score categories are merged instead of treated as separate games.</div><div class=bar><select id=year></select><select id=type><option value=2>Regular</option><option value=3>Postseason</option></select><select id=pos><option>ALL</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>FB</option></select><button id=load>Load Season</button><input id=q placeholder="Search player…"><select id=player><option>Load a season first</option></select></div><div id=status class=muted>Ready.</div><div id=summary class=cards></div><div class=table><table id=tbl></table></div></div><script>'use strict';const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl',E=id=>document.getElementById(id),year=E('year'),type=E('type'),pos=E('pos'),load=E('load'),q=E('q'),player=E('player'),status=E('status'),summary=E('summary'),tbl=E('tbl');for(let y=new Date().getFullYear();y>=1999;y--)year.add(new Option(y,y));let logs=new Map,players=[];const num=v=>{let x=Number(String(v??0).replace(/,/g,''));return Number.isFinite(x)?x:0},norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');async function J(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}function weeks(y,t){return t===2?(y>=2021?18:17):5}async function games(y,t){let a=[];for(let w=1;w<=weeks(y,t);w++){status.textContent=`Scoreboards ${w}/${weeks(y,t)}…`;let x=await J(`${B}/scoreboard?limit=100&dates=${y}&seasontype=${t}&week=${w}`);a.push(...(x.events||[]).filter(e=>e.status?.type?.completed&&+e.season?.year===y&&+e.season?.type===t).map(e=>({...e,__week:w})))}return [...new Map(a.map(x=>[x.id,x])).values()]}function category(n,labels,keys){let s=[n,...labels,...keys].join(' ').toLowerCase();return s.includes('pass')?'passing':s.includes('rush')?'rushing':s.includes('receiv')||labels.map(x=>String(x).toLowerCase()).includes('rec')?'receiving':s.includes('fumble')?'fumbles':s.includes('defens')?'defense':s.includes('kick')?'kicking':s.includes('punt')?'punting':'other'}function val(labels,keys,stats,names){for(let z of names){let i=labels.findIndex(x=>norm(x)===norm(z));if(i<0)i=keys.findIndex(x=>norm(x)===norm(z));if(i>=0)return stats[i]}return undefined}function parse(summary,e){let game=new Map;for(const b of summary.boxscore?.players||[]){let team=b.team?.abbreviation||'';for(const c of b.statistics||[]){let labels=c.labels||[],keys=c.keys||[],cat=category(c.name||c.displayName||'',labels,keys);for(const r of c.athletes||[]){let a=r.athlete;if(!a?.id)continue;let k=String(a.id),x=game.get(k)||{id:k,name:a.displayName||a.fullName||'',pos:a.position?.abbreviation||'',team,date:String(e.date||'').slice(0,10),week:e.__week,game:e.shortName||e.name||'',passCmp:0,passAtt:0,passYds:0,passTD:0,int:0,rushAtt:0,rushYds:0,rushTD:0,rec:0,tgt:0,recYds:0,recTD:0};let st=r.stats||[];if(cat==='passing'){let ca=val(labels,keys,st,['C/ATT','CMP/ATT','completions/attempts']);if(String(ca||'').includes('/')){let p=String(ca).split('/');x.passCmp=num(p[0]);x.passAtt=num(p[1])}else{x.passCmp=num(val(labels,keys,st,['CMP','completions']));x.passAtt=num(val(labels,keys,st,['ATT','attempts']))}x.passYds=num(val(labels,keys,st,['YDS','passingYards']));x.passTD=num(val(labels,keys,st,['TD','passingTouchdowns']));x.int=num(val(labels,keys,st,['INT','interceptions']))}if(cat==='rushing'){x.rushAtt=num(val(labels,keys,st,['CAR','ATT','rushingAttempts']));x.rushYds=num(val(labels,keys,st,['YDS','rushingYards']));x.rushTD=num(val(labels,keys,st,['TD','rushingTouchdowns']))}if(cat==='receiving'){x.rec=num(val(labels,keys,st,['REC','receptions']));x.tgt=num(val(labels,keys,st,['TGTS','TGT','receivingTargets']));x.recYds=num(val(labels,keys,st,['YDS','receivingYards']));x.recTD=num(val(labels,keys,st,['TD','receivingTouchdowns']))}game.set(k,x)}}}for(const x of game.values()){let arr=logs.get(x.id)||[];arr.push(x);logs.set(x.id,arr)}}function fillPlayers(){players=[...logs].map(([id,a])=>({id,a:a[0]})).filter(x=>pos.value==='ALL'||x.a.pos===pos.value).sort((a,b)=>a.a.name.localeCompare(b.a.name));player.innerHTML=players.map(x=>`<option value="${x.id}">${x.a.name} — ${x.a.pos||'?'} ${x.a.team}</option>`).join('')||'<option>No players</option>';filterPlayers();render()}function filterPlayers(){let s=q.value.toLowerCase();[...player.options].forEach(o=>o.hidden=s&&!o.text.toLowerCase().includes(s));if(player.selectedOptions[0]?.hidden){let v=[...player.options].find(o=>!o.hidden);if(v)player.value=v.value}}function render(){let a=(logs.get(player.value)||[]).slice().sort((x,y)=>x.week-y.week);if(!a.length){summary.innerHTML='';tbl.innerHTML='';return}let p=a[0],totalTD=a.reduce((s,x)=>s+x.passTD+x.rushTD+x.recTD,0),high=Math.max(...a.map(x=>x.passYds+x.rushYds+x.recYds));summary.innerHTML=`<div class=card><b>${a.length}</b>Games</div><div class=card><b>${a.reduce((s,x)=>s+x.passYds,0)}</b>Pass Yds</div><div class=card><b>${a.reduce((s,x)=>s+x.rushYds,0)}</b>Rush Yds</div><div class=card><b>${a.reduce((s,x)=>s+x.recYds,0)}</b>Rec Yds</div><div class=card><b>${totalTD}</b>Total TD</div>`;tbl.innerHTML='<tr><th>Game</th><th>Team</th><th>Cmp/Att</th><th>Pass Yds</th><th>Pass TD</th><th>INT</th><th>Rush</th><th>Rush Yds</th><th>Rush TD</th><th>Rec</th><th>Tgt</th><th>Rec Yds</th><th>Rec TD</th></tr>'+a.map(x=>`<tr><td class=name>W${x.week} • ${x.game}</td><td>${x.team}</td><td>${x.passCmp}/${x.passAtt}</td><td>${x.passYds}</td><td>${x.passTD}</td><td>${x.int}</td><td>${x.rushAtt}</td><td>${x.rushYds}</td><td>${x.rushTD}</td><td>${x.rec}</td><td>${x.tgt}</td><td>${x.recYds}</td><td>${x.recTD}</td></tr>`).join('')}load.onclick=async()=>{load.disabled=true;logs=new Map;summary.innerHTML='';tbl.innerHTML='';try{let gs=await games(+year.value,+type.value),fail=0,d=0;for(const e of gs){status.textContent=`Box scores ${++d}/${gs.length}…`;try{parse(await J(`${B}/summary?event=${e.id}`),e)}catch{fail++}}fillPlayers();status.textContent=`Loaded ${gs.length-fail}/${gs.length} games • ${logs.size} players${fail?` • ${fail} failed`:''}`}catch(e){status.innerHTML=`<span class=err>Failed: ${e.message}</span>`}finally{load.disabled=false}};player.onchange=render;q.oninput=()=>{filterPlayers();render()};pos.onchange=()=>logs.size&&fillPlayers();</script></body></html>
