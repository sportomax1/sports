async function load(){let y=+el.season.value,t=+el.type.value,w=+el.week.value,ws=el.scope.value==='through'?Array.from({length:w},(_,i)=>i+1):[w];el.load.disabled=true;el.csv.disabled=true;error('');status(`Loading ESPN scoreboards… 0/${ws.length}`,'load');try{let wr=await pool(ws,4,async wk=>{let b=await get(boardURL(y,t,wk));return(b?.events||[]).map(ev=>({eventId:String(ev.id),week:wk,eventTeams:teams(ev)}))},(d,n)=>status(`Loading ESPN scoreboards… ${d}/${n}`,'load')),be=wr.filter(x=>x?.__error),games=wr.filter(Array.isArray).flat();if(!games.length&&be.length)throw be[0].__error;if(!games.length){state={kicks:[],rows:[]};render();status('No ESPN games found.');return}let sr=await pool(games,8,async g=>extract(await get(sumURL(g.eventId)),g),(d,n)=>status(`Loading ESPN game summaries… ${d}/${n}`,'load')),se=sr.filter(x=>x?.__error),k=dedupe(sr.filter(Array.isArray).flat());await enrich(k,y);state.kicks=k;state.rows=group(k);render();let unresolved=k.filter(x=>!x.kickerId||x.kickerName==='Unknown kicker').length,warn=[];if(be.length)warn.push(`${be.length} scoreboard request(s) failed`);if(se.length)warn.push(`${se.length} game summary request(s) failed`);if(unresolved)warn.push(`${unresolved} kick${unresolved===1?'':'s'} unmatched`);if(warn.length){error(`Partial ESPN load: ${warn.join('; ')}.`);status(`Loaded ${k.length} made FGs with partial data.`,'err')}else status(`Loaded ${k.length} made FGs • ${state.rows.length} kickers • ${new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}.`)}catch(e){console.error(e);state={kicks:[],rows:[]};render();error(`Could not load ESPN data.\n\n${e?.name==='AbortError'?'ESPN request timed out.':e?.message||e}`);status('ESPN load failed.','err')}finally{el.load.disabled=false;el.csv.disabled=!state.rows.length}}
function csv(){if(!state.rows.length)return;let r=sortRows(state.rows),n=Math.max(...r.map(x=>x.kicks.length)),a=[['Kicker','Team','Made','Longest','Average','50+',...Array.from({length:n},(_,i)=>`FG ${i+1}`)],...r.map(x=>[x.kickerName,[...x.teams.values()].map(t=>t.abbr).join('/'),x.made,x.long,x.avg.toFixed(1),x.fifty,...Array.from({length:n},(_,i)=>x.kicks[i]?.distance??'')])],s=a.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),u=URL.createObjectURL(new Blob([s],{type:'text/csv'})),q=document.createElement('a');q.href=u;q.download=`nfl-kickers-${el.season.value}-week-${el.week.value}.csv`;q.click();URL.revokeObjectURL(u)}async function init(){let y=new Date().getFullYear();el.season.innerHTML=Array.from({length:y-2009},(_,i)=>`<option value="${y-i}">${y-i}</option>`).join('');el.season.value='2026';weeks();try{let d=await get(`${B}/scoreboard?limit=100`,9000),sy=+(d?.season?.year||d?.leagues?.[0]?.season?.year||y),st=+(d?.season?.type||d?.leagues?.[0]?.season?.type||2),wk=+(d?.week?.number||d?.week?.value||1);if([...el.season.options].some(o=>+o.value===sy))el.season.value=String(sy);if([1,2,3].includes(st))el.type.value=String(st);weeks();el.week.value=String(Math.max(1,Math.min(+el.week.options.length,wk)))}catch{}await load()}el.type.onchange=weeks;el.sort.onchange=render;el.load.onclick=load;el.csv.onclick=csv;init()})();
