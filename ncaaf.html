html,body{max-width:100%;overflow-x:hidden}

<body>
<main class="shell">
  <div class="topbar">
    <div class="titleline">
      <div class="brand"><div class="ball">🏈</div><div><h1>NCAA Football Hub</h1><div class="sub">FBS games · box scores · stats · weekly leaders · ESPN data</div></div></div>
      <div class="spacer"></div><a class="btn" href="./index.html" style="text-decoration:none">Sports Home</a>
    </div>
    <div class="controls">
      <label>Season <select id="season"></select></label>
      <label>Type <select id="seasonType"><option value="2">Regular Season</option><option value="3">Postseason</option></select></label>
      <label>Week <select id="week"></select></label>
      <label>Conference <select id="conference"><option value="">All FBS</option></select></label>
      <input id="search" placeholder="Search team / game">
      <button class="btn primary" id="refresh">Refresh</button>
    </div>
    <div class="progress"><i id="progress"></i></div>
  </div>

  <nav class="tabs"><button data-view="games" class="active">Games</button><button data-view="standings">Standings</button><button data-view="teamcompare">Team Stats</button><button data-view="travel">Conference Map</button><button data-view="rankings">Rankings</button><button data-view="leaders">Weekly Leaders</button></nav>
  <div class="uxbar" id="uxbar">
    <div class="weeknav"><button id="prevWeek" title="Previous week">‹</button><button id="nextWeek" title="Next week">›</button></div>
    <button class="chip" data-qf="live">Live</button>
    <button class="chip" data-qf="close">Close</button>
    <button class="chip" data-qf="redzone">Red Zone</button>
    <button class="chip" data-qf="ranked">Ranked</button><button class="chip" data-qf="top25">Top 25</button>
    <button class="chip" data-qf="favorites">★ Favorites</button>
    <select id="sortGames" title="Sort games"><option value="time">Sort: Kickoff</option><option value="close">Sort: Closest</option><option value="ranked">Sort: Ranked</option></select>
    <button class="chip" id="currentWeek">Current Week</button><button class="chip" id="density">Compact</button>
    <button class="chip" id="autoRefresh">Auto Refresh</button>
    <button class="chip" id="resetFilters">Reset</button>
  </div>
  <section id="metrics" class="metrics"></section>
  <div id="status" class="status"></div>
  <section id="content"></section>
</main>

<div id="modal" class="modal"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle">Game</h2><button id="closeModal" class="close">Close</button></div><div id="modalBody" class="dialogbody"></div></div></div>
<div id="entityModal" class="modal" style="z-index:120"><div class="dialog" style="width:min(900px,100%)"><div class="dialoghead"><h2 id="entityTitle">Profile</h2><button id="closeEntity" class="close">Close</button></div><div id="entityBody" class="dialogbody"></div></div></div>

<script>
'use strict';
const BASE='https://site.api.espn.com/apis/site/v2/sports/football/college-football';
const FBS_GROUP=80;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function currentSeason(){const d=new Date();return d.getMonth()<6?d.getFullYear()-1:d.getFullYear()}
function init(){
  const now=currentSeason(),savedSeason=localStorage.getItem('ncaafSeason')||String(now);

function guessWeek(){const d=new Date(),y=d.getFullYear(),start=new Date(y,7,22);return String(Math.max(1,Math.min(18,Math.floor((d-start)/604800000)+1)))}

  });

  $('density').onclick=()=>{state.compact=!state.compact;localStorage.setItem('ncaafCompact',state.compact?'1':'0');document.body.classList.toggle('compact',state.compact);$('density').classList.toggle('active',state.compact)};
  $('prevWeek').onclick=()=>changeWeek(-1);$('nextWeek').onclick=()=>changeWeek(1);$('currentWeek').onclick=jumpCurrentWeek;

  document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='/'){e.preventDefault();$('search').focus()}else if(e.key==='ArrowLeft')changeWeek(-1);else if(e.key==='ArrowRight')changeWeek(1)});

async function api(url,force=false){const key='ncaaf:'+url;try{if(!force){const c=JSON.parse(sessionStorage.getItem(key)||'null');if(c&&Date.now()-c.t<300000)return c.v}}catch{}const r=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw Error('ESPN HTTP '+r.status);const j=await r.json();try{sessionStorage.setItem(key,JSON.stringify({t:Date.now(),v:j}))}catch{}return j}
function scoreboardUrl(){return BASE+'/scoreboard?groups='+FBS_GROUP+'&limit=1000&dates='+$('season').value+'&seasontype='+$('seasonType').value+'&week='+$('week').value}
async function loadGames(force=false){
  const token=++state.loadToken;$('status').textContent='Loading all FBS games from ESPN…';$('progress').style.width='30%';showSkeletons();
  try{const j=await api(scoreboardUrl(),force);if(token!==state.loadToken)return;state.games=(j.events||[]).map(normalizeGame).filter(Boolean).sort((a,b)=>a.date-b.date);$('progress').style.width='100%';setTimeout(()=>$('progress').style.width='0',350);applyFilters();$('status').textContent='ESPN · '+state.games.length+' FBS games loaded for '+$('season').value+' Week '+$('week').value+'.';if(state.view==='leaders')loadWeeklyLeaders()}
  catch(e){$('progress').style.width='0';$('status').innerHTML='<span class="error">Could not load ESPN scoreboard: '+esc(e.message)+'</span>';$('content').innerHTML='<div class="empty">No games available.</div>'}
}
function normalizeGame(e){
  const c=e.competitions?.[0],comps=c?.competitors;if(!c||!comps?.length)return null;const home=comps.find(x=>x.homeAway==='home')||comps[0],away=comps.find(x=>x.homeAway==='away')||comps[1];
  const team=x=>({id:x.team?.id,name:x.team?.displayName||x.team?.name,short:x.team?.shortDisplayName||x.team?.name,abbr:x.team?.abbreviation,logo:x.team?.logo,score:Number(x.score||0),winner:!!x.winner,rank:x.curatedRank?.current<99?x.curatedRank.current:null,records:(x.records||[]).find(r=>r.type==='total')?.summary||'',conferenceId:String(x.team?.conferenceId||'')});
  const sit=c.situation||{},period=Number(e.status?.period||c.status?.period||0),clock=e.status?.displayClock||c.status?.displayClock||'',possessionId=String(sit.possession||sit.possessionId||'');
  return{id:e.id,name:e.name,date:new Date(e.date),status:e.status?.type?.state||'',statusDetail:e.status?.type?.shortDetail||e.status?.type?.detail||'',completed:!!e.status?.type?.completed,home:team(home),away:team(away),venue:c.venue?.fullName||'',city:[c.venue?.address?.city,c.venue?.address?.state].filter(Boolean).join(', '),broadcast:(c.broadcasts||[]).flatMap(x=>x.names||[]).join(', '),neutral:!!c.neutralSite,situation:sit,period,clock,possessionId,isRedZone:!!sit.isRedZone};
}
function applyFilters(){
  const q=$('search').value.trim().toLowerCase(),cid=$('conference').value;
  state.filtered=state.games.filter(g=>{
    if(q&&![g.name,g.home.name,g.away.name,g.home.abbr,g.away.abbr].join(' ').toLowerCase().includes(q))return false;
    if(cid&&g.home.conferenceId!==cid&&g.away.conferenceId!==cid)return false;
    if(state.quickFilter==='live'&&g.status!=='in')return false;
    if(state.quickFilter==='close'&&!(g.status==='in'&&Math.abs(g.home.score-g.away.score)<=8))return false;
    if(state.quickFilter==='redzone'&&!(g.status==='in'&&g.isRedZone))return false;
    if(state.quickFilter==='ranked'&&!(g.home.rank||g.away.rank))return false;if(state.quickFilter==='top25'&&!((g.home.rank&&g.home.rank<=25)||(g.away.rank&&g.away.rank<=25)))return false;
    if(state.quickFilter==='favorites'&&!state.favorites.has(String(g.home.id))&&!state.favorites.has(String(g.away.id)))return false;
    return true
  });
  render();
}
function metrics(){
  const a=state.filtered,live=a.filter(g=>g.status==='in').length,done=a.filter(g=>g.completed).length,up=a.length-done-live;
  const ranked=a.filter(g=>g.home.rank||g.away.rank).length;
  $('metrics').innerHTML=[['Games',a.length],['Live',live],['Final',done],['Upcoming',up],['Ranked Matchups',ranked]].map(([k,v])=>'<div class="metric"><b>'+v+'</b><span>'+k+'</span></div>').join('');
}
function render(){metrics();if(state.view==='games')renderGames();else if(state.view==='leaders')renderLeaders();else if(state.view==='rankings')renderRankings();else renderExtraShell()}
function logo(t){return t.logo?'<img src="'+esc(t.logo)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'<span></span>'}
function rankName(t){return (t.rank?'#'+t.rank+' ':'')+esc(t.short||t.name)}
function playerHead(a){const id=a?.id||a?.uid||'';return a?.headshot?.href||(id?'https://a.espncdn.com/i/headshots/college-football/players/full/'+encodeURIComponent(id)+'.png':'')}
function rememberTeam(t){if(t?.id)state.teamContext.set(String(t.id),t);return t}
function rememberPlayer(a,team){if(a?.id||a?.uid){state.playerContext.set(String(a.id||a.uid),{...a,_team:team||a._team})}return a}
function gameFlags(g){
  if(g.status!=='in')return '';
  const diff=Math.abs(g.home.score-g.away.score),flags=[];
  if(g.isRedZone)flags.push('<span class="flag redzone">🔴 RED ZONE</span>');
  if(diff<=3)flags.push('<span class="flag close">🔥 CLOSE</span>');
  else if(diff<=8)flags.push('<span class="flag close">⚡ ONE SCORE</span>');
  const sec=parseClockSeconds(g.clock);
  if((g.period===2||g.period===4)&&sec>=0&&sec<=120)flags.push('<span class="flag twomin">⏱ 2-MIN</span>');
  if(g.period>4)flags.push('<span class="flag ot">OT</span>');
  return flags.length?'<div class="gameflags">'+flags.join('')+'</div>':'';
}
function parseClockSeconds(clock){const m=String(clock||'').match(/(\d+):(\d+)/);return m?Number(m[1])*60+Number(m[2]):-1}
function gameCard(g){
  const cls=g.status==='in'?' live':'',status=g.status==='in'?'<span class="livepill">● '+esc(g.statusDetail)+'</span>':g.completed?'<span class="finalpill">FINAL</span>':esc(g.statusDetail);
  const row=t=>{rememberTeam(t);const hasPoss=g.status==='in'&&g.possessionId&&String(t.id)===String(g.possessionId),fav=state.favorites.has(String(t.id));return '<div class="team entityLink '+(t.winner?'winner':'')+(g.completed&&!t.winner?' loser':'')+'" data-team="'+esc(t.id)+'">'+logo(t)+'<div class="teamname"><strong>'+rankName(t)+(hasPoss?' <span class="poss" title="Possession"></span>':'')+'</strong><span>'+esc(t.records)+'</span></div><div style="display:flex;align-items:center;gap:4px"><button class="favbtn '+(fav?'on':'')+'" data-fav="'+esc(t.id)+'" title="'+(fav?'Remove favorite':'Favorite team')+'">★</button><div class="score">'+((g.status==='pre'&&!g.completed)?'–':t.score)+'</div></div></div>'};
  return '<article class="game'+cls+'" data-game="'+g.id+'"><div class="gamehead"><span>'+fmtDate(g.date)+'</span>'+status+'</div>'+row(g.away)+row(g.home)+gameFlags(g)+'<div class="gamefoot"><span>'+esc(g.broadcast||'')+'</span><span>'+esc(g.venue||'')+'</span></div></article>';
}
function sortedGames(){
  const a=[...state.filtered];
  if(state.sort==='close')a.sort((x,y)=>Math.abs(x.home.score-x.away.score)-Math.abs(y.home.score-y.away.score)||x.date-y.date);
  else if(state.sort==='ranked')a.sort((x,y)=>Math.min(x.home.rank||99,x.away.rank||99)-Math.min(y.home.rank||99,y.away.rank||99)||x.date-y.date);
  else a.sort((x,y)=>x.date-y.date);

}
function renderGames(){

  const groups=new Map();for(const g of a){const k=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(g.date);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(g)}

function fmtDate(d){return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(d)}
async function getSummary(id){if(state.summaryCache.has(id))return state.summaryCache.get(id);const j=await api(BASE+'/summary?event='+encodeURIComponent(id));state.summaryCache.set(id,j);return j}

function scoringDrives(s){

  if(drives.length)return '<div class="tablewrap"><table><thead><tr><th>Drive</th><th>Result</th><th>Plays</th><th>Yards</th><th>Time</th></tr></thead><tbody>'+drives.map(d=>'<tr><td>'+esc(d.team?.abbreviation||'')+'</td><td>'+esc(d.displayResult||d.result)+'</td><td>'+esc(d.plays)+'</td><td>'+esc(d.yards)+'</td><td>'+esc(d.timeElapsed?.displayValue||'')+'</td></tr>').join('')+'</tbody></table></div>';

function renderLeaders(){
  const buttons=Object.entries(leaderDefs).map(([k,d])=>'<button data-leader="'+k+'" class="'+(state.leaderMetric===k?'active':'')+'">'+d.label+'</button>').join('');

    ]);data={profile,roster,schedule};state.teamCache.set(teamKey,data)}

  }catch(e){$('entityBody').innerHTML=renderTeamProfile(base,null,false)+'<div class="sub" style="margin-top:10px">Additional ESPN team details were not available.</div>'}
}
function findTeamContext(id){for(const g of state.games){if(String(g.home.id)===String(id))return g.home;if(String(g.away.id)===String(id))return g.away}return null}
function renderTeamProfile(base,data,loading){
  const p=data?.profile?.team||data?.profile||base||{},logoUrl=p.logos?.[0]?.href||p.logo||base.logo||'',name=p.displayName||p.name||base.name||base.short||'Team',abbr=p.abbreviation||base.abbr||'',record=base.records||p.record?.items?.[0]?.summary||'',location=p.location||'',nickname=p.nickname||'',color=p.color?'#'+String(p.color).replace('#',''):'',roster=data?.roster?.athletes||[];
  $('entityTitle').textContent=name;
  let games=state.games.filter(g=>String(g.home.id)===String(base.id||p.id)||String(g.away.id)===String(base.id||p.id));
  return '<div class="profileHero">'+(logoUrl?'<img src="'+esc(logoUrl)+'" alt="">':'<div></div>')+'<div><h2>'+esc(name)+'</h2><div class="sub">'+esc([location,nickname,abbr].filter(Boolean).join(' · '))+'</div><div class="profileMeta">'+(record?'<span class="pill">'+esc(record)+'</span>':'')+(color?'<span class="pill">Team color '+esc(color)+'</span>':'')+'</div></div></div>'+
  '<div class="profileGrid">'+[['Record',record],['Abbreviation',abbr],['Conference',p.conference?.name||p.conferenceName||''],['Roster',roster.length?roster.length+' players':''],['Week',$('week').value],['Games this view',games.length]].map(([k,v])=>'<div class="profileCard"><span>'+k+'</span><b>'+esc(profileValue(v))+'</b></div>').join('')+'</div>'+
  (roster.length?'<div class="section"><h3>Roster</h3><div class="grid">'+roster.slice(0,80).map(x=>{const a=x.athlete||x,head=playerHead(a);rememberPlayer(a,p);return '<div class="metric entityLink" data-player="'+esc(a.id||a.uid||'')+'"><div class="ath">'+(head?'<img src="'+esc(head)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'')+'<div><b style="font-size:13px">'+esc(a.displayName||a.fullName||a.shortName||'Player')+'</b><div class="sub">'+esc([a.position?.abbreviation,a.jersey?'#'+a.jersey:''].filter(Boolean).join(' · '))+'</div></div></div></div>'}).join('')+'</div></div>':'')+
  (loading?'<div class="sub">Loading team profile and roster…</div>':'')+renderTeamSchedule(data?.schedule,base.id||p.id)
}
function renderTeamSchedule(schedule,teamId){
  const events=schedule?.events||[];if(!events.length)return '';
  return '<div class="section"><h3>Full Season Schedule</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Opponent</th><th>Site</th><th>Result</th><th>Score</th></tr></thead><tbody>'+events.map(e=>{const c=e.competitions?.[0],cs=c?.competitors||[],me=cs.find(x=>String(x.team?.id)===String(teamId)),op=cs.find(x=>String(x.team?.id)!==String(teamId))||{},ms=Number(me?.score?.value??me?.score??0),os=Number(op?.score?.value??op?.score??0),done=c?.status?.type?.completed,res=done?(ms>os?'W':'L'):'',logo=op.team?.logo||op.team?.logos?.[0]?.href||'';return '<tr><td>'+esc(new Date(e.date).toLocaleDateString())+'</td><td><span class="teamchip entityLink" data-team="'+esc(op.team?.id||'')+'">'+(logo?'<img src="'+esc(logo)+'" alt="">':'')+'<b>'+esc(op.team?.displayName||op.team?.shortDisplayName||'Opponent')+'</b></span></td><td>'+esc(c?.neutralSite?'Neutral':me?.homeAway==='away'?'Away':'Home')+'</td><td><b>'+res+'</b></td><td>'+esc(done?(ms+'–'+os):(c?.status?.type?.shortDetail||''))+'</td></tr>'}).join('')+'</tbody></table></div></div>'
}
function wireTeamRosterContext(roster,base){for(const x of roster?.athletes||[]){const a=x.athlete||x;rememberPlayer(a,roster.team||base)}}

function rankWeek(delta){const cur=Number($('week').value),next=Math.max(1,Math.min(18,cur+delta));if(next===cur)return;$('week').value=String(next);localStorage.setItem('ncaafWeek',String(next));state.rankingsData=null;loadRankings(true)}
async function loadRankings(force=false){
  if(state.rankingsLoading)return;state.rankingsLoading=true;renderRankings();
  const season=$('season').value,week=$('week').value,type=$('seasonType').value;
  try{state.rankingsData=await api(BASE+'/rankings?season='+encodeURIComponent(season)+'&week='+encodeURIComponent(week)+'&seasontype='+encodeURIComponent(type),force);$('status').textContent='ESPN rankings · requested '+season+' Week '+week}
  catch(e){state.rankingsData={error:e.message}}finally{state.rankingsLoading=false;renderRankings()}
}
function renderRankings(){
  if(state.rankingsLoading){$('content').innerHTML='<div class="empty">Loading rankings…</div>';return}
  const j=state.rankingsData;if(!j){$('content').innerHTML='<div class="empty">Open Rankings to load the selected season/week polls.</div>';return}
  if(j.error){$('content').innerHTML='<div class="empty error">'+esc(j.error)+'</div>';return}
  const polls=j.rankings||[];if(!polls.length){$('content').innerHTML='<div class="empty">ESPN returned no rankings for this selection.</div>';return}
  $('content').innerHTML='<div class="extraControls"><button class="chip" id="rankPrev">← Prior Week</button><button class="chip" id="rankNext">Next Week →</button><button class="chip" id="rankReload">Reload</button></div>'+polls.map(p=>'<div class="section"><h3>'+esc(p.name||p.shortName||'Poll')+' · '+esc(p.occurrence?.displayValue||('Week '+$('week').value))+'</h3><div class="tablewrap"><table><thead><tr><th>Rank</th><th>Team</th><th>Record</th><th>Previous</th><th>Change</th><th>Points</th><th>1st</th></tr></thead><tbody>'+(p.ranks||[]).map(x=>{const t=x.team||{},chg=Number(x.previous||x.current)-Number(x.current);return '<tr><td><b class="rank">#'+esc(x.current)+'</b></td><td><span class="teamchip entityLink" data-team="'+esc(t.id||'')+'">'+(t.logo?'<img src="'+esc(t.logo)+'" alt="">':'')+'<b>'+esc(t.displayName||t.name)+'</b></span></td><td>'+esc(t.record?.summary||x.record?.summary||'')+'</td><td>'+esc(x.previous||'—')+'</td><td>'+esc(chg>0?'▲ '+chg:chg<0?'▼ '+Math.abs(chg):'—')+'</td><td>'+esc(x.points??'—')+'</td><td>'+esc(x.firstPlaceVotes??'—')+'</td></tr>'}).join('')+'</tbody></table></div></div>').join('');
  $('rankPrev').onclick=()=>rankWeek(-1);$('rankNext').onclick=()=>rankWeek(1);$('rankReload').onclick=()=>loadRankings(true)
}
function renderExtraShell(){
  if(state.extraLoading){$('content').innerHTML='<div class="empty">Loading '+esc(state.view)+' data…</div>';return}
  if(!state.teamCompareRows.length){$('content').innerHTML='<div class="empty">Open this view to load season data. It is isolated from the main scoreboard so a failed request cannot break the app.</div>';return}
  if(state.view==='standings')renderSeasonStandings();
  else if(state.view==='teamcompare')renderTeamCompare();
  else if(state.view==='travel')renderTravelMap();
}
async function getConferenceTeamsSafe(cid){
  const key='conf:'+cid+':'+$('season').value;if(state.extraCache.has(key))return state.extraCache.get(key);
  let teams=[];
  const urls=[
    BASE+'/teams?groups='+encodeURIComponent(cid)+'&limit=200',
    'https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/teams?groups='+encodeURIComponent(cid)+'&limit=200'
  ];
  for(const u of urls){try{const j=await api(u);teams=j.sports?.[0]?.leagues?.[0]?.teams||j.teams||[];teams=teams.map(x=>x.team||x).filter(x=>x?.id);if(teams.length)break}catch{}}
  state.extraCache.set(key,teams);return teams
}
async function loadExtraView(force=false){
  if(state.extraLoading)return;state.extraLoading=true;renderExtraShell();
  const cid=$('conference').value||'4',season=$('season').value;
  try{
    let teams=[];
    if($('conference').value)teams=await getConferenceTeamsSafe(cid);
    else{
      const seen=new Map();
      for(const id of Object.values(confIds)){for(const t of await getConferenceTeamsSafe(id))seen.set(String(t.id),t)}
      teams=[...seen.values()]
    }
    if(!teams.length)throw Error('ESPN returned no teams');
    const queue=[...teams],rows=[];let done=0;
    const worker=async()=>{while(queue.length){const t=queue.shift();try{
      const j=await api(BASE+'/teams/'+encodeURIComponent(t.id)+'/schedule?season='+encodeURIComponent(season),force);
      const events=j.events||[];let w=0,l=0,pf=0,pa=0,yf=0,ya=0,away=0,home=0,neutral=0;
      const opponents=[];
      for(const e of events){const comp=e.competitions?.[0],cs=comp?.competitors||[],me=cs.find(x=>String(x.team?.id)===String(t.id)),op=cs.find(x=>String(x.team?.id)!==String(t.id));if(!me||!op)continue;
        if(me.homeAway==='away')away++;else if(comp.neutralSite)neutral++;else home++;
        opponents.push({name:op.team?.displayName||op.team?.name||'',abbr:op.team?.abbreviation||'',away:me.homeAway==='away',date:e.date});
        if(comp.status?.type?.completed){const ms=Number(me.score?.value??me.score??0)||0,os=Number(op.score?.value??op.score??0)||0;pf+=ms;pa+=os;if(ms>os)w++;else l++}
      }
      rows.push({id:String(t.id),name:t.displayName||t.shortDisplayName||t.name||'',abbr:t.abbreviation||'',logo:t.logos?.[0]?.href||t.logo||'',w,l,pf,pa,ppg:(w+l)?pf/(w+l):0,papg:(w+l)?pa/(w+l):0,diff:pf-pa,home,away,neutral,opponents,venue:t.venue||null})
    }catch{}finally{done++;$('progress').style.width=Math.round(done/teams.length*100)+'%'}}};
    await Promise.all(Array.from({length:Math.min(8,teams.length)},worker));
    state.teamCompareRows=rows;$('status').textContent=rows.length+' teams loaded from ESPN season schedules · '+seasonLabel();state.extraLoading=false;$('progress').style.width='0';renderExtraShell()
  }catch(e){state.extraLoading=false;$('content').innerHTML='<div class="empty error">This view could not load: '+esc(e.message)+'</div>'}
}
function renderSeasonStandings(){
  const rows=[...state.teamCompareRows].sort((a,b)=>b.w-a.w||a.l-b.l||b.diff-a.diff);
  $('content').innerHTML='<div class="tablewrap"><table><thead><tr><th>Team</th><th>W</th><th>L</th><th>PF</th><th>PA</th><th>Diff</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td><span class="teamchip entityLink" data-team="'+esc(r.id)+'">'+(r.logo?'<img src="'+esc(r.logo)+'" alt="">':'')+'<b><span class="rank">#'+(i+1)+'</span> '+esc(r.name)+'</b></span></td><td>'+r.w+'</td><td>'+r.l+'</td><td>'+r.pf+'</td><td>'+r.pa+'</td><td>'+r.diff+'</td></tr>').join('')+'</tbody></table></div>'
}
function renderTeamCompare(){
  let rows=[...state.teamCompareRows],sort='ppg',dir=-1;
  $('content').innerHTML='<div class="extraControls"><input id="tcSearch" placeholder="Search teams"><select id="tcSort"><option value="ppg">Points/Game</option><option value="papg">Points Allowed/Game</option><option value="diff">Point Differential</option><option value="w">Wins</option><option value="away">Away Games</option></select></div><div id="tcTable"></div>';
  const draw=()=>{const q=($('tcSearch')?.value||'').toLowerCase();sort=$('tcSort')?.value||sort;rows=[...state.teamCompareRows].filter(r=>(r.name+' '+r.abbr).toLowerCase().includes(q)).sort((a,b)=>(Number(b[sort])-Number(a[sort]))*Math.abs(dir));$('tcTable').innerHTML='<div class="tablewrap"><table><thead><tr><th>Team</th><th>W-L</th><th>PF</th><th>PA</th><th>PPG</th><th>PA/G</th><th>Diff</th><th>Home</th><th>Away</th><th>Neutral</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td><span class="teamchip entityLink" data-team="'+esc(r.id)+'">'+(r.logo?'<img src="'+esc(r.logo)+'" alt="">':'')+'<b><span class="rank">#'+(i+1)+'</span> '+esc(r.name)+'</b></span></td><td>'+r.w+'-'+r.l+'</td><td>'+r.pf+'</td><td>'+r.pa+'</td><td><b>'+fmtVal(r.ppg)+'</b></td><td>'+fmtVal(r.papg)+'</td><td>'+r.diff+'</td><td>'+r.home+'</td><td>'+r.away+'</td><td>'+r.neutral+'</td></tr>').join('')+'</tbody></table></div>'};
  $('tcSearch').oninput=draw;$('tcSort').onchange=draw;draw()
}
function renderTravelMap(){
  const rows=state.teamCompareRows;
  const places=rows.map(r=>encodeURIComponent((r.name||'')+' football stadium')).join('|');
  const q=encodeURIComponent((rows[0]?.name||'college football')+' stadium');
  $('content').innerHTML='<div class="section"><h3>Conference Geography + Travel</h3><div class="sub">Real OpenStreetMap view. Use the table below for each team’s road schedule.</div></div><iframe class="mapFrame" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=-125%2C24%2C-66%2C50&layer=mapnik"></iframe><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Team</th><th>Away</th><th>Home</th><th>Neutral</th><th>Road Schedule</th></tr></thead><tbody>'+rows.sort((a,b)=>b.away-a.away).map(r=>'<tr><td><span class="teamchip entityLink" data-team="'+esc(r.id)+'">'+(r.logo?'<img src="'+esc(r.logo)+'" alt="">':'')+esc(r.name)+'</span></td><td><b>'+r.away+'</b></td><td>'+r.home+'</td><td>'+r.neutral+'</td><td>'+r.opponents.filter(x=>x.away).map(x=>esc(x.abbr||x.name)).join(' → ')+'</td></tr>').join('')+'</tbody></table></div>'
}
function seasonLabel(){return $('season').value+' season'}
init();
</script>
</body></html>
