<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101a"><title>Betting Buddy</title>
<style>
:root{color-scheme:dark;--bg:#050a11;--panel:#0d1623;--panel2:#121e2e;--line:#26364b;--text:#f6f8fb;--muted:#91a3b8;--green:#5ee09a;--red:#ff7474;--gold:#ffc857;--blue:#62a8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#17365c 0,transparent 35%),var(--bg);color:var(--text);font:13px Inter,system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:16px}.top{display:flex;align-items:end;justify-content:space-between;gap:10px}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}h1{margin:3px 0;font-size:32px}.muted{color:var(--muted)}.daybar{display:grid;grid-template-columns:42px 1fr 42px;gap:7px;margin:14px 0}.daybar button,.datebox,.league button,.filters button{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:11px;min-height:42px;font-weight:800}.datebox{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px}.datebox input{background:transparent;border:0;color:#fff;font:inherit;font-weight:800}.league{display:flex;gap:6px;overflow:auto;padding-bottom:5px}.league button{padding:8px 12px;white-space:nowrap;min-height:36px}.league button.on{background:#1b4e86;border-color:#4e91d9}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.filters button{padding:7px 10px;min-height:34px}.filters button.on{background:#263b58}.status{padding:10px 0}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0 12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px}.stat b{font-size:19px;display:block}.games{display:grid;gap:9px}.game{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;overflow:hidden}.gamehead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px}.team{display:flex;gap:8px;align-items:center;font-weight:900;font-size:15px}.team.right{justify-content:flex-end;text-align:right}.team img{width:31px;height:31px;object-fit:contain}.at{color:var(--muted);font-weight:800}.edgebar{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.edge{padding:9px;text-align:center;border-right:1px solid var(--line)}.edge:last-child{border:0}.edge small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:900}.edge b{font-size:14px}.lean{color:var(--green)}.avoid{color:var(--muted)}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.box{background:#08111d;border:1px solid #1d2b3e;border-radius:9px;padding:9px}.box h3{font-size:10px;text-transform:uppercase;color:var(--muted);margin:0 0 7px}.row{display:flex;justify-content:space-between;gap:8px;margin:4px 0}.confidence{height:5px;background:#1d2a3c;border-radius:9px;overflow:hidden;margin-top:7px}.confidence i{display:block;height:100%;background:var(--green)}.note{padding:0 10px 10px;color:var(--muted);font-size:10px}.empty{text-align:center;padding:40px;color:var(--muted)}.spin{display:inline-block;width:12px;height:12px;border:2px solid #52657d;border-top-color:white;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:650px){.shell{padding:11px}.top{align-items:start}.summary{grid-template-columns:repeat(2,1fr)}.details{grid-template-columns:1fr}.gamehead{padding:10px 8px}.team{font-size:12px}.team img{width:26px;height:26px}.edge{padding:8px 3px}.edge b{font-size:12px}h1{font-size:27px}}
</style></head><body><main class="shell"><div class="top"><div><div class="eyebrow">Sports Lab · Zero-key ESPN data</div><h1>🎯 Betting Buddy</h1><div class="muted">Form + scoring model versus available spread, total, and moneyline markets.</div></div><a href="./index.html" style="color:#9fb3ca;text-decoration:none">Tools</a></div>
<div class="daybar"><button id="prev">‹</button><label class="datebox"><span>📅</span><input id="date" type="date"></label><button id="next">›</button></div>
<div class="league" id="leagues"></div><div class="filters"><button class="on" data-filter="all">All games</button><button data-filter="edge">Best edges</button><button data-filter="total">Totals</button><button data-filter="spread">Spreads</button></div>
<div id="status" class="status muted">Ready.</div><section id="summary" class="summary"></section><section id="games" class="games"></section></main>
<script>
'use strict';
const L=[
{id:'nfl',label:'NFL',sport:'football',league:'nfl'},
{id:'nba',label:'NBA',sport:'basketball',league:'nba'},
{id:'mlb',label:'MLB',sport:'baseball',league:'mlb'},
{id:'nhl',label:'NHL',sport:'hockey',league:'nhl'},
{id:'ncaaf',label:'NCAAF',sport:'football',league:'college-football',college:true},
{id:'ncaam',label:'NCAAM',sport:'basketball',league:'mens-college-basketball',college:true}
], E=id=>document.getElementById(id), date=E('date'), status=E('status'), games=E('games'), summary=E('summary'), leagues=E('leagues');
let active='all',filter='all',token=0,cache=new Map;
const today=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}, ymd=s=>s.replaceAll('-',''), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
date.value=today();
L.forEach(x=>{let b=document.createElement('button');b.textContent=x.label;b.dataset.id=x.id;b.onclick=()=>{active=active===x.id?'all':x.id;drawLeague();load()};leagues.append(b)});function drawLeague(){[...leagues.children].forEach(b=>b.classList.toggle('on',b.dataset.id===active))}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b));render(last)});
E('prev').onclick=()=>move(-1);E('next').onclick=()=>move(1);date.onchange=load;function move(n){let d=new Date(date.value+'T12:00:00');d.setDate(d.getDate()+n);date.value=d.toISOString().slice(0,10);load()}
async function J(u){if(cache.has(u))return cache.get(u);let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status+' '+r.statusText);let j=await r.json();cache.set(u,j);return j}
const base=l=>`https://site.api.espn.com/apis/site/v2/sports/${l.sport}/${l.league}`;
async function slate(l){let extra=l.college?'&limit=500&groups=50':'&limit=100';let j=await J(`${base(l)}/scoreboard?dates=${ymd(date.value)}${extra}`);return (j.events||[]).map(e=>({l,e}))}
function comp(e,ha){return e.competitions?.[0]?.competitors?.find(x=>x.homeAway===ha)}
function odds(e){let o=e.competitions?.[0]?.odds?.[0];if(!o)return{};let hp=Number(o.homeTeamOdds?.moneyLine),ap=Number(o.awayTeamOdds?.moneyLine),total=Number(o.overUnder),spread=Number(o.spread);return{details:o.details||'',total:Number.isFinite(total)?total:null,spread:Number.isFinite(spread)?spread:null,homeML:Number.isFinite(hp)?hp:null,awayML:Number.isFinite(ap)?ap:null,provider:o.provider?.name||''}}
async function history(l,teamId,seasonYear,before){let key=`hist|${l.id}|${teamId}|${seasonYear}`;let arr=cache.get(key);if(!arr){let urls=[`${base(l)}/teams/${teamId}/schedule?season=${seasonYear}`,`${base(l)}/teams/${teamId}/schedule?season=${seasonYear}&seasontype=2`,`${base(l)}/teams/${teamId}/schedule?season=${seasonYear}&seasontype=3`];let all=[];for(const u of urls){try{let j=await J(u);all.push(...(j.events||[]))}catch{}}let seen=new Set;arr=all.filter(e=>!seen.has(e.id)&&seen.add(e.id));cache.set(key,arr)}return arr.filter(e=>e.status?.type?.completed&&new Date(e.date)<before).map(e=>{let c=e.competitions?.[0],me=c?.competitors?.find(x=>String(x.team?.id)===String(teamId)),op=c?.competitors?.find(x=>String(x.team?.id)!==String(teamId));if(!me||!op)return null;let pf=+me.score,pa=+op.score;if(!Number.isFinite(pf)||!Number.isFinite(pa))return null;return{pf,pa,margin:pf-pa,total:pf+pa,date:new Date(e.date),home:me.homeAway==='home'}}).filter(Boolean)}
function weighted(games,now,seasonWeight){let sw=0,pf=0,pa=0,m=0,t=0;for(const g of games){let days=Math.max(1,(now-g.date)/86400000),recent=days<=30?1.45:days<=75?1.2:1,w=seasonWeight*recent;sw+=w;pf+=g.pf*w;pa+=g.pa*w;m+=g.margin*w;t+=g.total*w}return sw?{pf:pf/sw,pa:pa/sw,margin:m/sw,total:t/sw,n:games.length,w:sw}:null}
function combine(a,b){if(!a&&!b)return null;if(!a)return b;if(!b)return a;let w=a.w+b.w;return{pf:(a.pf*a.w+b.pf*b.w)/w,pa:(a.pa*a.w+b.pa*b.w)/w,margin:(a.margin*a.w+b.margin*b.w)/w,total:(a.total*a.w+b.total*b.w)/w,n:a.n+b.n,w}}
function americanProb(x){if(x==null)return null;return x<0?(-x)/((-x)+100):100/(x+100)}
function pct(x){return x==null?'—':(100*x).toFixed(1)+'%'}
function rank(c){let r=Number(c?.curatedRank?.current||c?.rank);return Number.isFinite(r)&&r>0&&r<=25?r:null}
async function analyze(item){let {l,e}=item,c=e.competitions?.[0],h=comp(e,'home'),a=comp(e,'away');if(!h||!a)return null;let before=new Date(e.date),sy=Number(e.season?.year)||before.getFullYear(),ids=[h.team.id,a.team.id];let [hc,hp,ac,ap]=await Promise.all([history(l,ids[0],sy,before),history(l,ids[0],sy-1,before),history(l,ids[1],sy,before),history(l,ids[1],sy-1,before)]);let H=combine(weighted(hc,before,1),weighted(hp,before,.32)),A=combine(weighted(ac,before,1),weighted(ap,before,.32));let o=odds(e),homeAdj={nfl:1.7,nba:2.2,mlb:.12,nhl:.12,ncaaf:2.5,ncaam:3}[l.id]||0;if(!H||!A)return{l,e,h,a,o,insufficient:true};
let predH=(H.pf+A.pa)/2+homeAdj/2,predA=(A.pf+H.pa)/2-homeAdj/2;
let hr=rank(h),ar=rank(a);if(l.college&&hr&&ar){let rd=Math.max(-15,Math.min(15,(ar-hr)*.18));predH+=rd/2;predA-=rd/2}else if(l.college&&hr){predH+=1.2}else if(l.college&&ar){predA+=1.2}
let total=predH+predA,margin=predH-predA,totalEdge=o.total==null?null:total-o.total;
// ESPN spread sign can vary by representation; details is the safest displayed market. Infer home line from details abbreviation when possible.
let homeLine=null,m=String(o.details||'').match(/^([A-Za-z0-9]+)\s*([+-]?\d+(?:\.\d+)?)/),hab=h.team.abbreviation,aab=a.team.abbreviation;if(m){let fav=m[1].toUpperCase(),n=Number(m[2]);if(fav===String(hab).toUpperCase())homeLine=n;else if(fav===String(aab).toUpperCase())homeLine=-n}else if(o.spread!=null)homeLine=o.spread;
let spreadEdge=homeLine==null?null:margin+homeLine,homeProb=1/(1+Math.exp(-margin/({nfl:7,nba:8.5,mlb:1.5,nhl:1.4,ncaaf:9,ncaam:9}[l.id]||8))),marketHome=americanProb(o.homeML),mlEdge=marketHome==null?null:homeProb-marketHome;
let sample=H.n+A.n,conf=Math.min(92,38+Math.min(34,sample*.65)+(o.total!=null?6:0)+(o.details?6:0));
return{l,e,h,a,o,H,A,predH,predA,total,margin,totalEdge,spreadEdge,homeLine,homeProb,marketHome,mlEdge,conf,hr,ar}}
let last=[];
async function load(){let my=++token,ls=active==='all'?L:L.filter(x=>x.id===active);status.innerHTML='<span class="spin"></span> Loading slate…';games.innerHTML='';summary.innerHTML='';try{let sl=(await Promise.all(ls.map(x=>slate(x).catch(()=>[])))).flat();if(my!==token)return;if(!sl.length){status.textContent='No games found for this date.';last=[];render(last);return}status.innerHTML=`<span class="spin"></span> Analyzing ${sl.length} games and team history…`;let out=[];let workers=10,i=0;async function work(){while(i<sl.length){let x=sl[i++];try{let r=await analyze(x);if(r)out.push(r)}catch{}}}await Promise.all(Array.from({length:Math.min(workers,sl.length)},work));if(my!==token)return;last=out.sort((a,b)=>edgeScore(b)-edgeScore(a));status.textContent=`${out.length} games analyzed · current season weighted most, prior season 32% · recent 30 days boosted · ESPN lines only where available.`;render(last)}catch(e){status.textContent='Load failed: '+e.message}}
function edgeScore(x){return Math.max(Math.abs(x.totalEdge||0)/3,Math.abs(x.spreadEdge||0)/2,Math.abs(x.mlEdge||0)*20)}
function totalLean(x){if(x.totalEdge==null)return['No total','avoid'];return[Math.abs(x.totalEdge)<2?'PASS':x.totalEdge>0?'OVER':'UNDER',Math.abs(x.totalEdge)>=3?'lean':'avoid']}
function spreadLean(x){if(x.spreadEdge==null)return['No spread','avoid'];return[Math.abs(x.spreadEdge)<1.5?'PASS':x.spreadEdge>0?x.h.team.abbreviation:x.a.team.abbreviation,Math.abs(x.spreadEdge)>=2?'lean':'avoid']}
function mlLean(x){if(x.mlEdge==null)return['No ML','avoid'];let side=x.mlEdge>0?x.h.team.abbreviation:x.a.team.abbreviation;return[Math.abs(x.mlEdge)<.04?'PASS':side,Math.abs(x.mlEdge)>=.06?'lean':'avoid']}
function render(arr){let shown=arr.filter(x=>filter==='all'||filter==='edge'&&edgeScore(x)>=1||filter==='total'&&x.totalEdge!=null||filter==='spread'&&x.spreadEdge!=null);let strong=arr.filter(x=>edgeScore(x)>=1).length,lines=arr.filter(x=>x.o?.details||x.o?.total!=null).length;summary.innerHTML=`<div class=stat><b>${arr.length}</b>Games</div><div class=stat><b>${lines}</b>With markets</div><div class=stat><b>${strong}</b>Model edges</div><div class=stat><b>${active==='all'?'6':active.toUpperCase()}</b>League scope</div>`;games.innerHTML=shown.length?shown.map(card).join(''):'<div class=empty>No games match this view.</div>'}
function card(x){let h=x.h.team,a=x.a.team,tl=totalLean(x),sl=spreadLean(x),ml=mlLean(x),time=new Date(x.e.date).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if(x.insufficient)return`<article class=game><div class=gamehead><div class=team><img src="${a.logo||''}">${esc(a.displayName)}</div><div class=at>@</div><div class="team right">${esc(h.displayName)}<img src="${h.logo||''}"></div></div><div class=note>${x.l.label} · ${time} · Not enough prior completed-game data to model.</div></article>`;
return`<article class=game>
<div class=gamehead><div class=team><img src="${a.logo||''}"><span>${x.ar?'#'+x.ar+' ':''}${esc(a.displayName)}</span></div><div class=at>@<br><small>${time}</small></div><div class="team right"><span>${x.hr?'#'+x.hr+' ':''}${esc(h.displayName)}</span><img src="${h.logo||''}"></div></div>
<div class=edgebar><div class=edge><small>Total lean</small><b class="${tl[1]}">${tl[0]}</b><small>${x.totalEdge==null?'':(x.totalEdge>0?'+':'')+x.totalEdge.toFixed(1)+' pts'}</small></div><div class=edge><small>Spread lean</small><b class="${sl[1]}">${sl[0]}</b><small>${x.spreadEdge==null?'':(x.spreadEdge>0?'+':'')+x.spreadEdge.toFixed(1)+' pts'}</small></div><div class=edge><small>Moneyline lean</small><b class="${ml[1]}">${ml[0]}</b><small>${x.mlEdge==null?'':(x.mlEdge*100).toFixed(1)+'% edge'}</small></div></div>
<div class=details><div class=box><h3>Market · ${esc(x.o.provider||'ESPN')}</h3><div class=row><span>Spread</span><b>${esc(x.o.details||'—')}</b></div><div class=row><span>Total</span><b>${x.o.total??'—'}</b></div><div class=row><span>Moneyline</span><b>${x.o.awayML??'—'} / ${x.o.homeML??'—'}</b></div></div>
<div class=box><h3>Buddy model</h3><div class=row><span>Projected score</span><b>${a.abbreviation} ${x.predA.toFixed(1)} · ${h.abbreviation} ${x.predH.toFixed(1)}</b></div><div class=row><span>Projected total</span><b>${x.total.toFixed(1)}</b></div><div class=row><span>Home win model</span><b>${pct(x.homeProb)}</b></div><div class=row><span>History sample</span><b>${x.A.n} + ${x.H.n} games</b></div><div class=confidence><i style="width:${x.conf}%"></i></div><div class=muted style="font-size:9px;margin-top:4px">Data confidence ${x.conf.toFixed(0)}%</div></div></div>
<div class=note>${x.l.label} · Model blends each team's scoring/allowing, recent form, current season, prior season, home advantage${x.l.college?' and Top-25 rank context':''}. “Lean” means model/market disagreement, not a predicted certainty.</div></article>`}
load();
</script></body></html>
