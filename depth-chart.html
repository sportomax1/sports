<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth Chart Lab</title>
<style>
:root{color-scheme:dark;--bg:#07101b;--p:#0e1928;--p2:#132238;--line:#263a55;--muted:#91a4bd;--gold:#f4b400;--green:#7ee787;--red:#ff7b72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px system-ui}.shell{max-width:1450px;margin:auto;padding:18px}h1{margin:0;font-size:36px}.muted{color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}button,select,input{background:var(--p2);color:#fff;border:1px solid #345;border-radius:9px;padding:9px;font:inherit}button{cursor:pointer}button.active{background:var(--gold);color:#111;font-weight:800}.status,.hero,.card,.stat,details{background:var(--p);border:1px solid var(--line);border-radius:12px}.status{padding:10px 12px}.ok{color:var(--green)}.error{color:var(--red)}.warn{color:#ffd45c}.hero{display:flex;gap:12px;align-items:center;padding:12px}.hero img{width:60px;height:60px;object-fit:contain}.hero h2{margin:0}.summary{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:8px}.stat{padding:10px}.stat b{display:block;font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}.card{overflow:hidden}.card h3,.pos h4{margin:0;padding:10px 12px;background:var(--p2)}.pos h4{color:#ffd45c;border-top:1px solid var(--line)}.player{display:grid;grid-template-columns:32px 42px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}.player img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#17253a}.rank{text-align:center;font-weight:900}.rank.one{color:var(--green)}.badge{font-size:10px;border:1px solid #456;border-radius:999px;padding:3px 6px}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed #345;border-radius:10px}.tablewrap{overflow:auto}.tablewrap table{width:100%;border-collapse:collapse;min-width:700px}.tablewrap th,.tablewrap td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.tablewrap th{background:var(--p2)}.tiny{width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:7px}.debug{white-space:pre-wrap;word-break:break-word;font:11px monospace;color:#8298b5}.hide{display:none}@media(max-width:700px){.shell{padding:12px}.summary{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell">
<h1>Depth Chart Lab</h1><div class="muted">Core-only standalone SPA · ESPN sports.core.api.espn.com</div>
<div id="sports" class="row"></div>
<div class="row"><label>ESPN season key <input id="season" type="number" min="2000" max="2100" style="width:95px"></label><span id="seasonLabel" class="muted"></span><label>Team <select id="team"></select></label><button data-mode="depth">Depth chart</button><button data-mode="roster">Roster</button><button data-view="cards">Cards</button><button data-view="table">Table</button><input id="filter" placeholder="Filter player / position"><button id="reload">Refresh</button><button id="test">Test Colorado URLs</button></div>
<div id="status" class="status">Starting…</div><div id="hero"></div><div id="summary" class="summary hide"></div><div id="out"></div><details><summary>Diagnostics</summary><div id="debug" class="debug"></div></details>
</main><script>
'use strict';
const CFG={NFL:{sport:'football',league:'nfl'},NBA:{sport:'basketball',league:'nba'},MLB:{sport:'baseball',league:'mlb'},NHL:{sport:'hockey',league:'nhl'}};
const COLORADO={NFL:{id:'7',name:'Denver Broncos'},NBA:{id:'7',name:'Denver Nuggets'},MLB:{id:'27',name:'Colorado Rockies'},NHL:{id:'17',name:'Colorado Avalanche'}};
const $=id=>document.getElementById(id),clean=v=>String(v??'').trim(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d=''){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const state={sport:store.get('coreDepthSport','NFL'),mode:store.get('coreDepthMode','depth'),view:store.get('coreDepthView','cards'),teams:[],model:null,logs:[],token:0};
if(!CFG[state.sport])state.sport='NFL';
function defaultSeason(sport,date=new Date()){const y=date.getFullYear(),m=date.getMonth()+1;if(sport==='NBA'||sport==='NHL')return m>=7?y+1:y;return y}
function seasonText(sport,key){const y=Number(key);return (sport==='NBA'||sport==='NHL')?`${y-1}-${String(y).slice(-2)} season`:`${y} season`}
function setDefaultSeason(){const saved=Number(store.get('coreDepthSeason:'+state.sport,''));const expected=defaultSeason(state.sport);$('season').value=(saved>=2000&&saved<=2100)?saved:expected;updateSeasonLabel()}
function updateSeasonLabel(){$('seasonLabel').textContent=seasonText(state.sport,$('season').value)}
function log(x){state.logs.push(x);if(state.logs.length>150)state.logs.shift();$('debug').textContent=state.logs.join('\n')}
function status(x,t=''){$('status').className='status '+t;$('status').textContent=x}
function httpsRef(x){return clean(x?.$ref||x?.athlete?.$ref||x?.team?.$ref).replace(/^http:/,'https:')}
async function api(url,timeout=15000){log('GET '+url);const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{cache:'no-store',mode:'cors',credentials:'omit',signal:c.signal,headers:{Accept:'application/json'}});log('HTTP '+r.status+' '+url);if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}catch(e){log('ERROR '+(e?.name||'Error')+': '+(e?.message||e));throw e}finally{clearTimeout(timer)}}
async function mapLimit(items,limit,fn){const out=new Array(items.length);let next=0;async function worker(){for(;;){const i=next++;if(i>=items.length)return;try{out[i]=await fn(items[i],i)}catch{out[i]=null}}}await Promise.all(Array.from({length:Math.min(limit,items.length||1)},worker));return out}
function teamFromCore(t){return{id:clean(t?.id),name:clean(t?.displayName||t?.name||t?.shortDisplayName||t?.abbreviation||'Team'),abbr:clean(t?.abbreviation),logo:clean(t?.logos?.[0]?.href||t?.logos?.[0]?.url)}}
function playerFromCore(p,pos=''){return{id:clean(p?.id),name:clean(p?.displayName||p?.fullName||p?.shortName||[p?.firstName,p?.lastName].filter(Boolean).join(' ')||'Unknown'),jersey:clean(p?.jersey||p?.number),position:clean(p?.position?.abbreviation||p?.position?.name||pos),head:clean(p?.headshot?.href||p?.headshot),status:clean(p?.status?.name||p?.status?.type||p?.status),active:p?.active!==false}}
async function resolveTeamRef(x){const u=httpsRef(x);if(!u)return null;return teamFromCore(await api(u))}
async function resolveAthleteRef(x,pos=''){const u=httpsRef(x);if(!u){const p=playerFromCore(x,pos);return p.name==='Unknown'?null:p}return playerFromCore(await api(u),pos)}
function coreBase(){const c=CFG[state.sport],y=$('season').value;return `https://sports.core.api.espn.com/v2/sports/${c.sport}/leagues/${c.league}/seasons/${y}`}
async function loadTeams(){const token=++state.token;state.logs=[];$('debug').textContent='';state.model=null;$('out').innerHTML='';$('summary').classList.add('hide');status('Loading '+state.sport+' teams from ESPN Core…');try{const j=await api(coreBase()+'/teams?limit=100');const raw=Array.isArray(j?.items)?j.items:[];let teams=raw.length&&raw.some(x=>httpsRef(x))?(await mapLimit(raw,8,resolveTeamRef)).filter(Boolean):raw.map(teamFromCore).filter(x=>x.id);if(token!==state.token)return;teams.sort((a,b)=>a.name.localeCompare(b.name));state.teams=teams;if(!teams.length)throw Error('No teams returned');$('team').innerHTML=teams.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('');const co=COLORADO[state.sport],idx=teams.findIndex(t=>t.id===co.id);if(idx>=0)$('team').value=String(idx);await loadTeam()}catch(e){if(token!==state.token)return;status('Team list failed: '+e.message,'error');$('out').innerHTML='<div class="empty">The sports.core team request failed. Open Diagnostics for the exact URL/error.</div>'}}
async function fetchDepth(team){const url=coreBase()+`/teams/${encodeURIComponent(team.id)}/depthcharts?lang=en&region=us`;const j=await api(url);const charts=Array.isArray(j?.items)?j.items:Array.isArray(j?.depthCharts)?j.depthCharts:[];const groups=[];for(const chart of charts){const positions=[];for(const [key,p] of Object.entries(chart?.positions||{})){const aa=Array.isArray(p?.athletes)?p.athletes:[];const hydrated=await mapLimit(aa,8,x=>resolveAthleteRef(x,p?.position?.abbreviation||key.toUpperCase()));const items=hydrated.map((player,i)=>player&&player.active?{rank:Number(aa[i]?.rank)||i+1,player}:null).filter(Boolean);if(items.length)positions.push({name:clean(p?.position?.name||key),abbr:clean(p?.position?.abbreviation||key.toUpperCase()),items})}if(positions.length)groups.push({name:clean(chart?.name||chart?.displayName||'Depth Chart'),positions})}if(!groups.length)throw Error('Depth endpoint returned no usable active positions');return groups}
async function fetchRoster(team){const url=coreBase()+`/teams/${encodeURIComponent(team.id)}/athletes?active=true&limit=200`;const j=await api(url);const raw=Array.isArray(j?.items)?j.items:[];const players=(await mapLimit(raw,10,x=>resolveAthleteRef(x))).filter(p=>p&&p.active),map=new Map();for(const p of players){const k=p.position||'Roster';if(!map.has(k))map.set(k,[]);map.get(k).push(p)}const groups=[...map].map(([name,items])=>({name,items}));if(!groups.length)throw Error('Athletes endpoint returned no usable active players');return groups}
function flat(){if(!state.model)return[];if(state.model.kind==='depth')return state.model.groups.flatMap(g=>g.positions.flatMap(p=>p.items.map(x=>({group:g.name,position:p.abbr||p.name,rank:x.rank,player:x.player}))));return state.model.groups.flatMap(g=>g.items.map(p=>({group:g.name,position:p.position||g.name,rank:null,player:p})))}
function head(p){return p.head||(p.id?`https://a.espncdn.com/i/headshots/${CFG[state.sport].league}/players/full/${p.id}.png`:'')}
function render(){if(!state.model)return;const q=clean($('filter').value).toLowerCase(),match=(...v)=>!q||v.some(x=>clean(x).toLowerCase().includes(q)),rows=flat().filter(r=>match(r.group,r.position,r.player.name));$('summary').classList.toggle('hide',!rows.length);if(rows.length)$('summary').innerHTML=`<div class="stat"><b>${rows.length}</b><span>Players</span></div><div class="stat"><b>${new Set(rows.map(r=>r.position).filter(Boolean)).size}</b><span>Positions</span></div><div class="stat"><b>${state.model.kind==='depth'?rows.filter(r=>r.rank===1).length:'—'}</b><span>Top slots</span></div>`;if(state.view==='table'){$('out').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>Rank</th><th>Player</th><th>Position</th><th>Group</th><th>Jersey</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.rank??'—'}</td><td><img class="tiny" src="${esc(head(r.player))}" alt=""><b>${esc(r.player.name)}</b></td><td>${esc(r.position)}</td><td>${esc(r.group)}</td><td>${esc(r.player.jersey||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No matching players.</div>';return}if(state.model.kind==='roster'){const blocks=state.model.groups.map(g=>{const items=g.items.filter(p=>match(g.name,p.name,p.position));return items.length?`<section class="card"><h3>${esc(g.name)}</h3>${items.map(p=>`<div class="player"><div class="rank">•</div><img src="${esc(head(p))}" alt=""><div><b>${esc(p.name)}</b><div class="muted">${p.jersey?'#'+esc(p.jersey)+' · ':''}${esc(p.position)}</div></div><span class="badge">Roster</span></div>`).join('')}</section>`:''}).join('');$('out').innerHTML=blocks?`<div class="grid">${blocks}</div>`:'<div class="empty">No matching active players.</div>';return}const blocks=state.model.groups.map(g=>{const ps=g.positions.map(p=>{const items=p.items.filter(x=>match(p.name,p.abbr,x.player.name));return items.length?`<div class="pos"><h4>${esc(p.abbr||p.name)} · ${esc(p.name)}</h4>${items.map(x=>`<div class="player"><div class="rank ${x.rank===1?'one':''}">${x.rank}</div><img src="${esc(head(x.player))}" alt=""><div><b>${esc(x.player.name)}</b><div class="muted">${x.player.jersey?'#'+esc(x.player.jersey)+' · ':''}${esc(x.player.position)}</div></div><span class="badge">${x.rank===1?'Starter':'Depth '+x.rank}</span></div>`).join('')}</div>`:''}).join('');return ps?`<section class="card"><h3>${esc(g.name)}</h3>${ps}</section>`:''}).join('');$('out').innerHTML=blocks?`<div class="grid">${blocks}</div>`:'<div class="empty">No matching active players.</div>'}
async function loadTeam(){const team=state.teams[Number($('team').value)];if(!team)return;const token=++state.token;state.model=null;$('out').innerHTML='';$('summary').classList.add('hide');$('hero').innerHTML=`<div class="hero">${team.logo?`<img src="${esc(team.logo)}" alt="">`:''}<div><h2>${esc(team.name)}</h2><div class="muted">${state.sport} · ESPN ID ${esc(team.id)} · ${esc(seasonText(state.sport,$('season').value))} · key ${esc($('season').value)}</div></div></div>`;try{status('Loading '+(state.mode==='depth'?'Core depth chart':'Core active roster')+'…');const groups=state.mode==='depth'?await fetchDepth(team):await fetchRoster(team);if(token!==state.token)return;state.model={kind:state.mode,groups};status((state.mode==='depth'?'Depth chart':'Active roster')+' loaded.','ok');render()}catch(e){if(token!==state.token)return;status('Load failed: '+e.message,'error');$('out').innerHTML='<div class="empty">Open Diagnostics for the exact sports.core request and failure.</div>'}}
function renderNav(){$('sports').innerHTML=Object.keys(CFG).map(s=>`<button data-sport="${s}" class="${state.sport===s?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{state.sport=b.dataset.sport;store.set('coreDepthSport',state.sport);setDefaultSeason();renderNav();loadTeams()});document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view))}
async function testColorado(){state.logs=[];$('debug').textContent='';let ok=0;for(const [s,cfg] of Object.entries(CFG)){const t=COLORADO[s],y=defaultSeason(s),url=`https://sports.core.api.espn.com/v2/sports/${cfg.sport}/leagues/${cfg.league}/seasons/${y}/teams/${t.id}/depthcharts?lang=en&region=us`;try{const j=await api(url,12000),n=Array.isArray(j?.items)?j.items.length:0;log(`TEST ${s} ${seasonText(s,y)}: ${n} chart item(s)`);if(n)ok++}catch(e){log(`TEST ${s}: FAIL ${e.message}`)}}status(`Colorado depth test: ${ok}/4 returned chart items.` ,ok===4?'ok':'warn')}
$('team').onchange=loadTeam;$('reload').onclick=loadTeam;$('test').onclick=testColorado;$('filter').oninput=render;$('season').onchange=()=>{store.set('coreDepthSeason:'+state.sport,$('season').value);updateSeasonLabel();loadTeams()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;store.set('coreDepthMode',state.mode);renderNav();loadTeam()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;store.set('coreDepthView',state.view);renderNav();render()});setDefaultSeason();renderNav();loadTeams();
</script></body></html>
