<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f">
<title>Best Games</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#101824;--panel2:#151f2d;--line:#263449;--text:#f7f9fc;--muted:#91a0b5;--accent:#f4b400;--good:#38d996}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}.shell{max-width:780px;margin:auto;padding:14px 12px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.title{font-size:22px;font-weight:900}.sub{font-size:11px;color:var(--muted)}button,input{font:inherit}.iconbtn,.chip,.settingsBtn{border:1px solid var(--line);background:#111a27;color:var(--text);border-radius:11px;min-height:44px;padding:0 13px;font-weight:800}.settingsBtn{min-width:44px;padding:0}.datebar{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;margin-bottom:10px}.datebox{position:relative;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;place-items:center;text-align:center;font-weight:900}.datebox small{display:block;color:var(--muted);font-size:10px;font-weight:700}.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.filters{display:flex;gap:6px;overflow:auto;padding:1px 0 10px;scrollbar-width:none}.chip{min-height:34px;padding:0 11px;font-size:11px;white-space:nowrap}.chip.active{background:var(--accent);border-color:var(--accent);color:#111}.status{font-size:11px;color:var(--muted);min-height:18px;margin:2px 2px 8px}.games{display:grid;gap:9px}.game{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:15px;padding:12px}.gameTop{display:flex;align-items:center;gap:8px;margin-bottom:10px}.rank{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:#0a1019;font-size:12px;font-weight:900}.leagueLogo{width:24px;height:24px;object-fit:contain}.meta{min-width:0;flex:1}.league{font-size:10px;font-weight:900;letter-spacing:.08em}.time{font-size:10px;color:var(--muted);margin-top:2px}.rating{text-align:right}.rating b{font-size:20px}.rating small{display:block;font-size:8px;color:var(--muted);font-weight:800}.teams{display:grid;gap:7px}.team{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center}.team img{width:36px;height:36px;object-fit:contain}.teamName{font-size:14px;font-weight:850}.record{font-size:11px;color:#c9d3e2;margin-top:2px}.score{font-size:18px;font-weight:900;color:#aeb9c9}.why{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:9px;border-top:1px solid #223047}.reason{font-size:9px;font-weight:800;color:#cbd5e1;background:#0b121d;padding:5px 7px;border-radius:999px}.empty{border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}dialog{width:min(520px,calc(100% - 24px));border:1px solid var(--line);border-radius:16px;background:#101824;color:var(--text);padding:16px}dialog::backdrop{background:#000a}.setting{margin:14px 0}.setting label{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:7px}.setting input[type=range]{width:100%}.dialogActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hint{font-size:10px;color:var(--muted);line-height:1.45}.error{color:#ff8e8e}@media(min-width:700px){.shell{padding-top:24px}.game{padding:15px}.teamName{font-size:15px}}
</style></head>
<body><main class="shell">
<div class="top"><div><div class="title">Best Games</div><div class="sub">Pregame matchup desirability across six leagues</div></div><button class="settingsBtn" id="settingsBtn" aria-label="Settings">⚙</button></div>
<div class="datebar"><button class="iconbtn" id="prev" aria-label="Previous day">‹</button><div class="datebox"><div id="dateLabel"></div><input id="date" type="date" aria-label="Choose date"></div><button class="iconbtn" id="next" aria-label="Next day">›</button></div>
<div class="filters" id="filters"></div><div class="status" id="status"></div><section class="games" id="games"></section>
</main>
<dialog id="settings"><h3 style="margin:0">Ranking Settings</h3><p class="hint">Ratings use information available going into the game. Game results and scores never affect desirability.</p>
<div class="setting"><label>Current-season strength <span id="wCurrentV"></span></label><input id="wCurrent" type="range" min="0" max="100" value="60"></div>
<div class="setting"><label>Previous-season carryover <span id="wPriorV"></span></label><input id="wPrior" type="range" min="0" max="100" value="25"></div>
<div class="setting"><label>Program/team prestige <span id="wPrestigeV"></span></label><input id="wPrestige" type="range" min="0" max="100" value="15"></div>
<div class="setting"><label><span>College ranking bonus</span><span id="rankBonusV"></span></label><input id="rankBonus" type="range" min="0" max="25" value="15"></div>
<div class="dialogActions"><button class="iconbtn" id="reset">Reset</button><button class="chip active" id="done">Done</button></div></dialog>
<script>
const LEAGUES=[
 {id:'nfl',label:'NFL',sport:'football',slug:'nfl',logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png'},
 {id:'nba',label:'NBA',sport:'basketball',slug:'nba',logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png'},
 {id:'mlb',label:'MLB',sport:'baseball',slug:'mlb',logo:'https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png'},
 {id:'nhl',label:'NHL',sport:'hockey',slug:'nhl',logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nhl.png'},
 {id:'ncaaf',label:'CFB',sport:'football',slug:'college-football',group:'80',college:true,logo:'https://a.espncdn.com/i/teamlogos/leagues/500/college-football.png'},
 {id:'ncaam',label:'CBB',sport:'basketball',slug:'mens-college-basketball',group:'50',college:true,logo:'https://a.espncdn.com/i/teamlogos/leagues/500/mens-college-basketball.png'}
];
const $=id=>document.getElementById(id), state={date:localDate(new Date()),league:'all',games:[],load:0};
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function compactDate(){return state.date.replaceAll('-','')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v,d=0){v=Number(v);return Number.isFinite(v)?v:d}
function pct(v){return Math.max(0,Math.min(1,num(v)))}
function settings(){let a=num($('wCurrent').value),b=num($('wPrior').value),c=num($('wPrestige').value),sum=a+b+c||1;return {current:a/sum,prior:b/sum,prestige:c/sum,rankBonus:num($('rankBonus').value)}}
function syncSettings(){['wCurrent','wPrior','wPrestige'].forEach(id=>$(id+'V').textContent=$(id).value+'%');$('rankBonusV').textContent=$('rankBonus').value+' pts'}
function teamLogo(t){return t?.logo||t?.logos?.[0]?.href||''}
function parseRecord(c){let r=(c.records||[]).find(x=>x.type==='total')||(c.records||[])[0];let s=r?.summary||'';let p=s.split('-').map(Number);let w=num(p[0]),l=num(p[1]),ties=num(p[2]);let gp=w+l+ties;return {text:s||'0-0',w,l,t:ties,gp,pct:gp?(w+.5*ties)/gp:.5}}
function prestige(team,league){let id=String(team?.id||'');let ab=(team?.abbreviation||'').toUpperCase();const elite={
 nfl:['KC','BAL','BUF','PHI','SF','GB','DAL','PIT','NE'],nba:['BOS','LAL','GS','DEN','OKC','MIL','NY'],mlb:['NYY','LAD','BOS','ATL','HOU','PHI','CHC'],nhl:['MTL','TOR','BOS','NYR','DET','COL','EDM','FLA','VGK'],
 ncaaf:['ALA','UGA','OSU','MICH','TEX','OU','ND','LSU','PSU','CLEM','ORE','USC'],ncaam:['DUKE','UNC','KU','UK','UCONN','MSU','UCLA','GONZ','ARIZ','IU']
 };return elite[league]?.includes(ab)?1:.45}
function rankMap(data){let m=new Map;for(const poll of data?.rankings||[]){for(const r of poll.ranks||[]){let id=String(r.team?.id||'');if(id&&!m.has(id))m.set(id,num(r.current))}if(m.size)break}return m}
async function get(url){let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('ESPN '+r.status);return r.json()}
async function leagueData(l){let base='https://site.api.espn.com/apis/site/v2/sports/'+l.sport+'/'+l.slug;let q='?dates='+compactDate()+'&limit=1000'+(l.group?'&groups='+l.group:'');let sb=await get(base+'/scoreboard'+q),ranks=new Map;if(l.college){try{ranks=rankMap(await get(base+'/rankings?limit=100'))}catch{}}return (sb.events||[]).map(e=>makeGame(e,l,ranks))}
function makeGame(e,l,ranks){let comp=e.competitions?.[0]||{},cs=comp.competitors||[];let away=cs.find(x=>x.homeAway==='away')||cs[0],home=cs.find(x=>x.homeAway==='home')||cs[1];if(!away||!home)return null;let ar=parseRecord(away),hr=parseRecord(home);return {id:e.id,league:l,event:e,comp,away,home,ar,hr,awayRank:ranks.get(String(away.team?.id)),homeRank:ranks.get(String(home.team?.id))}}
function scoreGame(g){let s=settings(),a=g.ar,h=g.hr;let games=Math.max(a.gp,h.gp);let seasonConfidence=Math.min(1,games/(g.league.id==='nfl'||g.league.id==='ncaaf'?7:20));let current=(a.pct+h.pct)/2;let balance=1-Math.abs(a.pct-h.pct);let currentQuality=.72*current+.28*balance;
 let prior=.58,prest=(prestige(g.away.team,g.league.id)+prestige(g.home.team,g.league.id))/2;
 let base=100*(s.current*(seasonConfidence*currentQuality+(1-seasonConfidence)*.58)+s.prior*(1-seasonConfidence*.75)*prior+s.prestige*(1-seasonConfidence*.7)*prest);
 let rb=0;if(g.league.college){for(const r of [g.awayRank,g.homeRank])if(r)rb+=s.rankBonus*Math.max(0,(26-r)/25);if(g.awayRank&&g.homeRank)rb+=5}
 let recordBonus=Math.min(10,(a.gp+h.gp)*.3)*current;return Math.round(Math.max(0,Math.min(100,base+rb+recordBonus)))}
function reasons(g){let r=[];if(g.awayRank&&g.homeRank)r.push('#'+g.awayRank+' vs #'+g.homeRank);else if(g.awayRank||g.homeRank)r.push('Ranked team');let avg=(g.ar.pct+g.hr.pct)/2;if(avg>=.7)r.push('Elite records');else if(avg>=.58)r.push('Strong records');if(Math.abs(g.ar.pct-g.hr.pct)<.1&&g.ar.gp+g.hr.gp>4)r.push('Even matchup');if(prestige(g.away.team,g.league.id)+prestige(g.home.team,g.league.id)>=1.8)r.push('Premier brands');if(!r.length)r.push('Pregame record model');return r.slice(0,3)}
function dateLabel(){let [y,m,d]=state.date.split('-').map(Number),dt=new Date(y,m-1,d);$('dateLabel').innerHTML=dt.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+'<small>'+y+'</small>';$('date').value=state.date}
function renderFilters(){$('filters').innerHTML=[{id:'all',label:'ALL'},...LEAGUES].map(l=>'<button class="chip '+(state.league===l.id?'active':'')+'" data-l="'+l.id+'">'+l.label+'</button>').join('');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{state.league=b.dataset.l;renderFilters();render()})}
function render(){let rows=state.games.filter(g=>state.league==='all'||g.league.id===state.league).map(g=>({...g,rating:scoreGame(g)})).sort((a,b)=>b.rating-a.rating);if(!rows.length){$('games').innerHTML='<div class="empty">No games found for this date and league selection.</div>';return}
 $('games').innerHTML=rows.map((g,i)=>{let st=g.event.status?.type||{},started=st.state!=='pre',final=st.completed;let when=new Date(g.event.date).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});let venue=g.comp.venue?.fullName;return '<article class="game"><div class="gameTop"><div class="rank">'+(i+1)+'</div><img class="leagueLogo" src="'+esc(g.league.logo)+'" alt=""><div class="meta"><div class="league">'+g.league.label+'</div><div class="time">'+esc(final?'FINAL':started?st.shortDetail:when)+(venue?' · '+esc(venue):'')+'</div></div><div class="rating"><b>'+g.rating+'</b><small>WATCH SCORE</small></div></div><div class="teams">'+teamRow(g.away,g.ar,g.awayRank,started)+teamRow(g.home,g.hr,g.homeRank,started)+'</div><div class="why">'+reasons(g).map(x=>'<span class="reason">'+esc(x)+'</span>').join('')+'</div></article>'}).join('')}
function teamRow(c,r,rank,showScore){return '<div class="team"><img src="'+esc(teamLogo(c.team))+'" alt=""><div><div class="teamName">'+(rank?'<span style="color:#f4b400">#'+rank+'</span> ':'')+esc(c.team?.shortDisplayName||c.team?.displayName)+'</div><div class="record">'+esc(r.text)+' entering game</div></div><div class="score">'+(showScore?esc(c.score||''):'')+'</div></div>'}
async function load(){let my=++state.load;dateLabel();$('status').textContent='Loading all six leagues…';$('status').className='status';$('games').innerHTML='';let settled=await Promise.allSettled(LEAGUES.map(leagueData));if(my!==state.load)return;state.games=settled.flatMap(x=>x.status==='fulfilled'?x.value.filter(Boolean):[]);let failed=settled.filter(x=>x.status==='rejected').length;$('status').textContent=state.games.length+' games loaded'+(failed?' · '+failed+' league'+(failed>1?'s':'')+' unavailable':'')+' · ranked by pregame context';if(failed)$('status').classList.add('error');render()}
function move(n){let [y,m,d]=state.date.split('-').map(Number),dt=new Date(y,m-1,d+n);state.date=localDate(dt);load()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('date').onchange=e=>{if(e.target.value){state.date=e.target.value;load()}};$('settingsBtn').onclick=()=>$('settings').showModal();$('done').onclick=()=>{$('settings').close();render()};$('reset').onclick=()=>{$('wCurrent').value=60;$('wPrior').value=25;$('wPrestige').value=15;$('rankBonus').value=15;syncSettings();render()};['wCurrent','wPrior','wPrestige','rankBonus'].forEach(id=>$(id).oninput=()=>{syncSettings();render()});syncSettings();renderFilters();load();
</script></body></html>
