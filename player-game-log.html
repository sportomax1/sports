<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Game Log Explorer</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui}.w{max-width:1400px;margin:auto;padding:18px}.muted{color:#91a3ba}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}select,input,button{background:#101d31;color:#fff;border:1px solid #31445f;border-radius:8px;padding:8px}button{background:#1769c2;font-weight:800}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.card,.table,.progress{background:#0e192a;border:1px solid #26364d;border-radius:10px;padding:10px}.card b{font-size:20px;display:block}.table{overflow:auto;margin-top:10px}table{border-collapse:collapse;width:100%}th,td{padding:7px;border-bottom:1px solid #26364d;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.name{text-align:left!important;font-weight:800}.err{color:#ff8b8b}.progress{display:none;margin:10px 0}.progress.on{display:block}.track{height:8px;background:#17243a;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#1769c2,#65b8ff);transition:width .25s}.spin{display:inline-block;width:13px;height:13px;border:2px solid #55708f;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class=w><h1>🏈 Player Game Log Explorer</h1><div class=muted>Explore one week, a season, a year range, or a player's career-style history from normalized ESPN game box scores.</div><div class=bar><select id=scope><option value=season>Season</option><option value=week>Single Week</option><option value=range>Year Range</option></select><select id=year></select><select id=endYear style="display:none"></select><select id=type><option value=2>Regular</option><option value=3>Postseason</option><option value=ALL>Reg + Post</option></select><select id=week style="display:none"></select><select id=pos><option>ALL</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>FB</option></select><button id=load>Load Data</button><input id=q placeholder="Search player…"><select id=player><option>Load data first</option></select></div><div id=progress class=progress><div><span class=spin></span><span id=phase>Preparing…</span></div><div class=track style="margin-top:8px"><div id=fill class=fill></div></div></div><div id=status class=muted>Ready.</div><div id=summary class=cards></div><div class=table><table id=tbl></table></div></div><script>'use strict';const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl',E=x=>document.getElementById(x),scope=E('scope'),year=E('year'),endYear=E('endYear'),type=E('type'),week=E('week'),pos=E('pos'),load=E('load'),q=E('q'),player=E('player'),status=E('status'),summary=E('summary'),tbl=E('tbl'),progress=E('progress'),phase=E('phase'),fill=E('fill');for(let y=new Date().getFullYear();y>=1999;y--){year.add(new Option(y,y));endYear.add(new Option(y,y))}for(let w=1;w<=18;w++)week.add(new Option('Week '+w,w));let logs=new Map,players=[];const num=v=>{let x=Number(String(v??0).replace(/,/g,''));return Number.isFinite(x)?x:0},norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');async function J(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}function prog(text,n=0,d=1){progress.classList.add('on');phase.textContent=text;fill.style.width=`${Math.min(100,100*n/d)}%`}function weeks(y,t){return t===2?(y>=2021?18:17):5}async function games(y,t,onlyWeek){let a=[],ws=onlyWeek?[+onlyWeek]:Array.from({length:weeks(y,t)},(_,i)=>i+1);for(let i=0;i<ws.length;i++){let w=ws[i];prog(`${y} ${t===2?'regular':'postseason'} week ${w}`,i,ws.length);let x=await J(`${B}/scoreboard?limit=100&dates=${y}&seasontype=${t}&week=${w}`);a.push(...(x.events||[]).filter(e=>e.status?.type?.completed&&+e.season?.year===y&&+e.season?.type===t).map(e=>({...e,__week:w,__year:y,__type:t}))}return [...new Map(a.map(x=>[x.id,x])).values()]}function category(n,l,k){let s=[n,...l,...k].join(' ').toLowerCase();return s.includes('pass')?'passing':s.includes('rush')?'rushing':s.includes('receiv')||l.some(x=>norm(x)==='rec')?'receiving':'other'}function val(l,k,s,names){for(const z of names){let i=l.findIndex(x=>norm(x)===norm(z));if(i<0)i=k.findIndex(x=>norm(x)===norm(z));if(i>=0)return s[i]}return undefined}function parse(sm,e){let game=new Map;for(const b of sm.boxscore?.players||[])for(const c of b.statistics||[]){let l=c.labels||[],k=c.keys||[],cat=category(c.name||c.displayName||'',l,k);for(const r of c.athletes||[]){let a=r.athlete;if(!a?.id)continue;let id=String(a.id),x=game.get(id)||{id,name:a.displayName||'',pos:a.position?.abbreviation||'',team:b.team?.abbreviation||'',date:String(e.date||'').slice(0,10),year:e.__year,type:e.__type,week:e.__week,game:e.shortName||'',passCmp:0,passAtt:0,passYds:0,passTD:0,int:0,rushAtt:0,rushYds:0,rushTD:0,rec:0,tgt:0,recYds:0,recTD:0},st=r.stats||[];if(cat==='passing'){let ca=val(l,k,st,['C/ATT','CMP/ATT']);if(String(ca||'').includes('/')){let p=String(ca).split('/');x.passCmp=num(p[0]);x.passAtt=num(p[1])}else{x.passCmp=num(val(l,k,st,['CMP','completions']));x.passAtt=num(val(l,k,st,['ATT','attempts']))}x.passYds=num(val(l,k,st,['YDS','passingYards']));x.passTD=num(val(l,k,st,['TD','passingTouchdowns']));x.int=num(val(l,k,st,['INT','interceptions']))}if(cat==='rushing'){x.rushAtt=num(val(l,k,st,['CAR','ATT','rushingAttempts']));x.rushYds=num(val(l,k,st,['YDS','rushingYards']));x.rushTD=num(val(l,k,st,['TD','rushingTouchdowns']))}if(cat==='receiving'){x.rec=num(val(l,k,st,['REC','receptions']));x.tgt=num(val(l,k,st,['TGTS','TGT','receivingTargets']));x.recYds=num(val(l,k,st,['YDS','receivingYards']));x.recTD=num(val(l,k,st,['TD','receivingTouchdowns']))}game.set(id,x)}}for(const x of game.values()){let a=logs.get(x.id)||[];a.push(x);logs.set(x.id,a)}}function fillPlayers(){players=[...logs].map(([id,a])=>({id,a:a[0]})).filter(x=>pos.value==='ALL'||x.a.pos===pos.value).sort((a,b)=>a.a.name.localeCompare(b.a.name));player.innerHTML=players.map(x=>`<option value="${x.id}">${x.a.name} — ${x.a.pos||'?'} ${x.a.team}</option>`).join('')||'<option>No players</option>';filterPlayers();render()}function filterPlayers(){let s=q.value.toLowerCase();[...player.options].forEach(o=>o.hidden=s&&!o.text.toLowerCase().includes(s));if(player.selectedOptions[0]?.hidden){let v=[...player.options].find(o=>!o.hidden);if(v)player.value=v.value}}function render(){let a=(logs.get(player.value)||[]).slice().sort((x,y)=>x.year-y.year||x.type-y.type||x.week-y.week);if(!a.length){summary.innerHTML='';tbl.innerHTML='';return}let totalTD=a.reduce((s,x)=>s+x.passTD+x.rushTD+x.recTD,0),touches=a.reduce((s,x)=>s+x.rushAtt+x.rec,0);summary.innerHTML=`<div class=card><b>${a.length}</b>Games</div><div class=card><b>${a.reduce((s,x)=>s+x.passYds,0)}</b>Pass Yds</div><div class=card><b>${a.reduce((s,x)=>s+x.rushYds,0)}</b>Rush Yds</div><div class=card><b>${a.reduce((s,x)=>s+x.recYds,0)}</b>Rec Yds</div><div class=card><b>${totalTD}</b>Total TD</div><div class=card><b>${touches}</b>Rush + Catches</div>`;tbl.innerHTML='<tr><th>Game</th><th>Team</th><th>Cmp/Att</th><th>Pass Yds</th><th>Pass TD</th><th>INT</th><th>Rush</th><th>Rush Yds</th><th>Rush TD</th><th>Rec</th><th>Tgt</th><th>Rec Yds</th><th>Rec TD</th></tr>'+a.map(x=>`<tr><td class=name>${x.year} ${x.type===3?'P':'W'}${x.week} • ${x.game}</td><td>${x.team}</td><td>${x.passCmp}/${x.passAtt}</td><td>${x.passYds}</td><td>${x.passTD}</td><td>${x.int}</td><td>${x.rushAtt}</td><td>${x.rushYds}</td><td>${x.rushTD}</td><td>${x.rec}</td><td>${x.tgt}</td><td>${x.recYds}</td><td>${x.recTD}</td></tr>`).join('')}load.onclick=async()=>{load.disabled=true;logs=new Map;summary.innerHTML='';tbl.innerHTML='';try{let ys=scope.value==='range'?Array.from({length:Math.abs(+endYear.value-+year.value)+1},(_,i)=>Math.min(+year.value,+endYear.value)+i):[+year.value],types=type.value==='ALL'?[2,3]:[+type.value],gs=[];for(const y of ys)for(const t of types)gs.push(...await games(y,t,scope.value==='week'?week.value:null));gs=[...new Map(gs.map(x=>[x.id,x])).values()];let fail=0;for(let i=0;i<gs.length;i++){prog(`Reading box scores ${i+1}/${gs.length}`,i,gs.length);try{parse(await J(`${B}/summary?event=${gs[i].id}`),gs[i])}catch{fail++}}prog('Complete',1,1);fillPlayers();status.textContent=`Loaded ${gs.length-fail}/${gs.length} games • ${logs.size} players${fail?` • ${fail} failed`:''}`;setTimeout(()=>progress.classList.remove('on'),700)}catch(e){status.innerHTML=`<span class=err>Failed: ${e.message}</span>`;progress.classList.remove('on')}finally{load.disabled=false}};scope.onchange=()=>{week.style.display=scope.value==='week'?'':'none';endYear.style.display=scope.value==='range'?'':'none'};player.onchange=render;q.oninput=()=>{filterPlayers();render()};pos.onchange=()=>logs.size&&fillPlayers();</script></body></html>
