<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Fieldboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#050906;color:#fff;font:13px system-ui}.app{max-width:1000px;margin:auto;padding:10px}.top{position:sticky;top:0;z-index:4;background:#050906ee;padding:8px 0}.head,.nav,.tabs{display:flex;align-items:center;gap:7px}.head{justify-content:space-between}h1{font-size:21px;margin:0}.nav{margin:9px 0}.nav input,.nav button,.tabs button{background:#111b14;color:#fff;border:1px solid #304033;border-radius:9px;height:38px;font-weight:800}.nav input{flex:1;padding:0 8px}.nav button{width:44px}.tabs button{flex:1;height:32px}.tabs .on{background:#fff;color:#07110a}.status,.meta{color:#9cab9e;padding:7px 2px}.games{display:grid;gap:9px}.game{background:#0d1510;border:1px solid #263329;border-radius:13px;padding:8px}.match{display:grid;grid-template-columns:66px 1fr 66px;align-items:center;gap:7px}.team{text-align:center;font-weight:900}.logo{position:relative;width:60px;height:60px;margin:auto;display:grid;place-items:center}.logo img{width:56px;height:56px;object-fit:contain}.score{position:absolute;inset:0;display:grid;place-items:center;font-size:25px;font-weight:1000;text-shadow:0 2px 5px #000,0 0 5px #000}.field{height:86px;position:relative;overflow:hidden;border:2px solid #e8f3e9;border-radius:8px;background:repeating-linear-gradient(90deg,#236b35 0,#236b35 9.7%,#ffffff88 9.8%,#ffffff88 10%,#236b35 10.1%)}.field:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#173e24 0 9%,transparent 9% 91%,#173e24 91%)}.clock{position:absolute;top:5px;left:50%;transform:translateX(-50%);background:#061109dd;padding:3px 6px;border-radius:5px;font-size:10px;font-weight:900;white-space:nowrap}.ball{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:11px;background:#7b431f;border:1px solid #edcfaf;border-radius:50%;box-shadow:0 0 0 3px #fff3}.spot{position:absolute;bottom:4px;transform:translateX(-50%);background:#061109dd;padding:2px 4px;border-radius:4px;font-size:9px;white-space:nowrap}.final{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:9px;font-size:22px;font-weight:1000;text-shadow:0 2px 4px #000}.final img{width:30px;height:30px;object-fit:contain}.meta{text-align:center;font-size:10px}@media(max-width:550px){.match{grid-template-columns:53px 1fr 53px;gap:4px}.logo{width:49px;height:49px}.logo img{width:46px;height:46px}.score{font-size:20px}.field{height:76px}}
</style><main class="app"><header class="top"><div class="head"><div><h1>🏈 Football Fieldboard</h1><small>Live field position · NFL + NCAAF</small></div><a href="./index.html" style="color:#b8c9ba">Tools</a></div><div class="nav"><button id="prev">‹</button><input id="date" type="date"><button id="next">›</button></div><div class="tabs"><button class="on" data-l="all">All</button><button data-l="nfl">NFL</button><button data-l="college-football">College</button></div></header><div id="status" class="status"></div><section id="games" class="games"></section></main><script>
'use strict';const E=x=>document.getElementById(x),D=E('date'),G=E('games'),S=E('status');let lg='all',cache=new Map;D.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);const leagues=()=>lg==='all'?['nfl','college-football']:[lg],ymd=s=>s.replaceAll('-','');
async function J(u){if(cache.has(u))return cache.get(u);let r=await fetch(u);if(!r.ok)throw Error(r.status);let j=await r.json();cache.set(u,j);return j}
async function day(d){let z=await Promise.all(leagues().map(async l=>{try{let j=await J('https://site.api.espn.com/apis/site/v2/sports/football/'+l+'/scoreboard?dates='+ymd(d)+'&limit=500'+(l==='college-football'?'&groups=80':''));return(j.events||[]).map(e=>({e,l}))}catch{return[]}}));return z.flat()}
const teams=e=>{let a=e.competitions?.[0]?.competitors||[];return[a.find(x=>x.homeAway==='away'),a.find(x=>x.homeAway==='home')]},score=x=>Number(x?.score?.value??x?.score)||0;
async function summary(x){try{return await J('https://site.api.espn.com/apis/site/v2/sports/football/'+x.l+'/summary?event='+x.e.id)}catch{return null}}
function play(s){let d=s?.drives?.current||(s?.drives?.previous||[]).at(-1);return d?.plays?.at(-1)||(s?.plays||[]).at(-1)}
function pos(p){let y=Number(p?.end?.yardLine??p?.start?.yardLine);if(!Number.isFinite(y))return null;return Math.max(4,Math.min(96,y))}
function team(x){return '<div class="team"><div class="logo"><img src="'+(x?.team?.logo||'')+'"><span class="score">'+score(x)+'</span></div><small>'+(x?.team?.abbreviation||'')+'</small></div>'}
function field(x,s){let e=x.e,[a,h]=teams(e),st=e.status?.type||{};if(st.completed)return '<div class="field"><div class="final"><img src="'+(a?.team?.logo||'')+'">'+score(a)+' <span>FINAL</span> '+score(h)+'<img src="'+(h?.team?.logo||'')+'"></div></div>';let p=play(s),q=pos(p),clock=e.status?.displayClock||p?.clock?.displayValue||'',per=e.status?.period||p?.period?.number||'',spot=p?.end?.text||p?.start?.text||'';return '<div class="field"><div class="clock">'+(per?'Q'+per+' · ':'')+(clock||st.shortDetail||'')+'</div>'+(q!=null?'<span class="ball" style="left:'+q+'%"></span><span class="spot" style="left:'+q+'%">'+(spot||'Ball')+'</span>':'')+'</div>'}
async function load(pre){let a=pre||await day(D.value);S.textContent=a.length?a.length+' football games':'No games this day.';G.innerHTML='';for(let x of a){let s=await summary(x),[away,home]=teams(x.e),el=document.createElement('article');el.className='game';el.innerHTML='<div class="match">'+team(away)+field(x,s)+team(home)+'</div><div class="meta">'+(x.l==='nfl'?'NFL':'NCAAF')+' · '+(x.e.status?.type?.shortDetail||'')+'</div>';G.append(el)}}
async function jump(dir){let d=new Date(D.value+'T12:00:00');S.textContent='Finding '+(dir<0?'previous':'next')+' football day…';for(let i=0;i<45;i++){d.setDate(d.getDate()+dir);let v=d.toISOString().slice(0,10),a=await day(v);if(a.length){D.value=v;load(a);return}}S.textContent='No games found within 45 days.'}
E('prev').onclick=()=>jump(-1);E('next').onclick=()=>jump(1);D.onchange=()=>load();document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{lg=b.dataset.l;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));load()});load();
</script>
