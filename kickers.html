function list(rows){let p=el.role.value==='punter',n=Math.max(0,...rows.map(r=>(p?r.punts:r.kicks).length)),heads=Array.from({length:n},(_,i)=>`<th>${p?'Punt':'FG'} ${i+1}</th>`).join(''),body=rows.map(r=>`<tr>${img(r)}${stats(r)}${Array.from({length:n},(_,i)=>{let x=(p?r.punts:r.kicks)[i];return x?`<td><a class="kick" target="_blank" href="https://www.espn.com/nfl/game/_/gameId/${x.event}" title="${esc(x.text)}"><div class="d">${x.distance} yd</div><div class="m">${esc(meta(x))}</div></a></td>`:'<td></td>'}).join('')}</tr>`).join('');el.wrap.innerHTML=`<table><thead><tr><th class="playercol">${p?'Punter':'Kicker'}</th><th>Punts</th><th>${p?'Avg':'Att'}</th><th>${p?'50+':'FG%'}</th><th>Long</th>${heads}</tr></thead><tbody>${body}</tbody></table>`;el.chips.innerHTML='<span class="chip">Longest → shortest</span>'}function yards(rows){let p=el.role.value==='punter',all=p?S.punts:S.fg,mx=Math.max(...all.map(x=>x.distance)),mn=Math.min(...all.map(x=>x.distance)),ys=Array.from({length:mx-mn+1},(_,i)=>mx-i),body=rows.map(r=>`<tr>${img(r)}${stats(r)}${ys.map(y=>{let z=(p?r.punts:r.attempts).filter(x=>x.distance===y);if(!z.length)return'<td class="y"></td>';if(p)return`<td class="y"><div class="box"><b>${z.length}</b></div></td>`;let m=z.filter(x=>x.made).length,x=z.length-m;return`<td class="y"><div class="box">${m?`<span class="ok">✓${m}</span>`:''}${x?`<span class="bad">✕${x}</span>`:''}</div></td>`}).join('')}</tr>`).join('');el.wrap.innerHTML=`<table><thead><tr><th class="playercol">${p?'Punter':'Kicker'}</th><th>${p?'Punts':'Made'}</th><th>${p?'Avg':'Att'}</th><th>${p?'50+':'FG%'}</th><th>Long</th>${ys.map(y=>`<th class="y">${y}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;el.chips.innerHTML='<span class="chip">Exact-yard grid</span>'}function buckets(rows){let p=el.role.value==='punter',all=p?S.punts:S.fg;if(!all.length)return;let hi=Math.floor(Math.max(...all.map(x=>x.distance))/10)*10,lo=Math.floor(Math.min(...all.map(x=>x.distance))/10)*10,bs=[];for function grade(rows){let n=Math.max(0,...rows.map(r=>r.punts.length)),body=rows.map(r=>{let q=[...r.punts].sort((a,b)=>b.grade-a.grade);return`<tr>${img(r)}<td><div class="big">${Math.round(r.puntPlus)}</div><div class="small">PUNT+</div></td><td><div class="grade ${gh(r.grade)}">${Math.round(r.grade)}</div><div class="small">GRADE</div></td><td><div class="big">${r.netAbove>=0?'+':''}${r.netAbove.toFixed(1)}</div><div class="small">NET VS EXP</div></td><td><div class="big">${r.oppStart?r.oppStart.toFixed(1):'—'}</div><div class="small">OPP START</div></td>${Array.from({length:n},(_,i)=>{let x=q[i];return x?`<td><a class="kick" target="_blank" href="https://www.espn.com/nfl/game/_/gameId/${x.event}" title="${esc(x.text)}"><div class="grade ${gh(x.grade)}">${Math.round(x.grade)}</div><div class="m">${Math.round(x.puntPlus)} P+ • ${x.distance}yd</div><div class="m">${x.netAbove>=0?'+':''}${x.netAbove?.toFixed(1)??'—'} vs exp • OPP ${x.oppStart??'?'}</div></a></td>`:'<td></td>'}).join('')}</tr>`}).join('');el.wrap.innerHTML=`<table><thead><tr><th class="playercol">Punter</th><th>Punt+</th><th>Grade</th><th>Net vs Exp</th><th>Opp Start</th>${Array.from({length:n},(_,i)=>`<th>Punt ${i+1}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;el.chips.innerHTML='<span class="chip">100 Punt+ = loaded-scope average</span><span class="chip">Adjusts for field available, returns, touchbacks and pins</span>'}function field(rows){let bins=[[90,99],[80,89],[70,79],[60,69],[50,59],[40,49],[30,39],[20,29]],body=rows.map(r=>`<tr>${img(r)}${stats(r)}${bins.map(([a,b])=>{let z=r.punts.filter(x=>x.available>=a&&x.available<=b&&x.netAbove!=null);if(!z.length)return'<td class="y"></td>';let g=avg(z.map(x=>x.grade));return`<td class="y"><div class="box"><span class="grade ${gh(g)}">${Math.round(g)}</span><span class="small">${z.length} punts</span></div></td>`}).join('')}</tr>`).join('');el.wrap.innerHTML=`<table><thead><tr><th class="playercol">Punter</th><th>Punts</th><th>Avg</th><th>50+</th><th>Long</th>${bins.map(x=>`<th class="y">${x[0]}–${x[1]}<br>avail</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;el.chips.innerHTML='<span class="chip">Columns = yards available to goal line</span>'}
function metrics(){let p=el.role.value==='punter',a=p?S.punts:S.fg,v;if(p){let g=a.filter(x=>x.netAbove!=null);v=[[a.length,'Punts'],[S.rows.length,'Punters'],[g.length?Math.round(avg(g.map(x=>x.puntPlus))):'—','Avg Punt+'],[g.length?Math.round(avg(g.map(x=>x.grade))):'—','Avg Grade'],[g.length?avg(g.map(x=>x.netAbove)).toFixed(1)+' yd':'—','Net vs Exp'],[a.filter(x=>x.touchback).length,'Touchbacks']]}else{let m=a.filter(x=>x.made),d=m.map(x=>x.distance);v=[[m.length,'Made FGs'],[a.length,'Attempts'],[S.rows.length,'Kickers'],[a.length?(100*m.length/a.length).toFixed(1)+'%':'—','FG%'],[d.filter(x=>x>=50).length,'50+ Made'],[d.length?Math.max(...d)+' yd':'—','Longest']]}el.metrics.innerHTML=v.map(x=>`<div class="metric"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}function render(){let rows=sorted(),p=el.role.value==='punter';metrics();el.title.textContent=`${el.season.value} ${el.type.options[el.type.selectedIndex].text} • ${scope()} • ${p?'Punters':'Kickers'}`;el.sub.textContent=`${S.games} games • ${S.dupes} duplicate play copies collapsed`;if(!rows.length){el.wrap.innerHTML='<div class="empty">No matching plays found.</div>';return}if(p&&el.view.value==='grade')grade(rows);else if(p&&el.view.value==='field')field(rows);else if(el.view.value==='buckets')buckets(rows);else if(el.view.value==='yards')yards(rows);else list(rows)}
async function load(){let y=+el.season.value,t=+el.type.value,w=+el.week.value;el.load.disabled=true;error('');try{let games=[];if(el.scope.value==='season'){st('Loading typed full-season API…');let b=await get(year(y,t));games=(b.items||b.events||[]).map(ev=>({id:coreEventId(ev),week:+(ev?.week?.number||0),teams:eventTeams(ev)})).filter(g=>g.id)}else{let ws=el.scope.value==='through'?Array.from({length:w},(_,i)=>i+1):[w],br=await pool(ws,4,async wk=>{let b=await get(board(y,t,wk));return(b.events||[]).map(ev=>({id:String(ev.id),week:wk,teams:eventTeams(ev)}))},(d,n)=>st(`Loading scoreboards ${d}/${n}…`));games=br.filter(Array.isArray).flat()}games=[...new Map(games.map(g=>[g.id,g])).values()];if(!games.length)throw Error('No ESPN games found for this selection.');let sr=await pool(games,8,async g=>{let d=await get(summary(g.id));if(!g.teams?.length)g.teams=summaryTeams(d);if(!g.week)g.week=+(d?.header?.week?.number||d?.header?.competitions?.[0]?.week?.number||0);return extract(d,g)},(d,n)=>st(`Loading game play-by-play ${d}/${n}…`)),fails=sr.filter(x=>x?.err).length,raw=sr.filter(Array.isArray).flat(),all=dedupe(raw);S={fg:all.filter(x=>x.kind==='kicker'),punts:all.filter(x=>x.kind==='punter'),rows:[],games:games.length,dupes:raw.length-all.length};group();render();st(`Loaded ${games.length} games • ${S.fg.length} FG attempts • ${S.punts.length} punts • ${scope()}${fails?` • ${fails} summaries failed`:''}`,fails);if(fails)error('Partial ESPN load: some game-summary requests failed.')}catch(e){console.error(e);error(e.message||String(e));st('Load failed.',1)}finally{el.load.disabled=false}}

async function init(){let y=new Date().getFullYear();el.season.innerHTML=Array.from({length:y-2009},(_,i)=>`<option>${y-i}</option>`).join('');el.season.value=String(Math.min(y,2026));weeks();configure();try{let d=await get(`${B}/scoreboard?limit=100`,8000),sy=+(d?.season?.year||y),stp=+(d?.season?.type||2),wk=+(d?.week?.number||1);if([...el.season.options].some(o=>+o.value===sy))el.season.value=sy;if([1,2,3].includes(stp))el.type.value=stp;weeks();if(wk<=el.week.options.length)el.week.value=wk}catch{}sync();await load()}el.type.onchange=weeks;el.scope.onchange=sync;el.role.onchange=()=>{configure();group();render()};el.view.onchange=render;el.sort.onchange=render;el.load.onclick=load;el.csv.onclick=csv;init();})();
