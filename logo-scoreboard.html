<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b12"><title>Logo Scoreboard</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#101824;--line:#26354a;--text:#f7f9fc;--muted:#91a0b5;--accent:#f4b400}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}.app{max-width:760px;margin:auto;padding:10px 10px 36px}.head{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 88%,transparent);padding-bottom:9px}.title{display:flex;align-items:center;justify-content:space-between}.title h1{margin:0;font-size:21px}.title a{font-size:12px;color:var(--muted);text-decoration:none}.leagues{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}.leagues::-webkit-scrollbar{display:none}.league{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900}.league.on{background:var(--accent);border-color:var(--accent);color:#111}.datebar{display:grid;grid-template-columns:48px 1fr 48px;gap:7px}.datebar>button,.datebox{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#151f2e;color:var(--text)}.datebar>button{font-size:26px;font-weight:950}.datebox{display:flex;align-items:center;justify-content:center;gap:8px}.datebox input{width:130px;border:0;background:transparent;color:var(--text);font-weight:850}.today{border:0;background:transparent;color:var(--accent);font-size:11px;font-weight:900}.status{padding:9px 2px;color:var(--muted);font-size:12px}.games{display:grid;gap:9px}.game{position:relative;display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;min-height:168px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#151f2e,#0d1520);overflow:hidden;padding:10px}.side{height:148px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0}.logoFrame{display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.11) 0 46%,rgba(255,255,255,.045) 47% 61%,rgba(0,0,0,.28) 62% 70%,transparent 71%);transition:width .2s,height .2s}.logo{display:block;object-fit:contain;width:82%;height:82%;max-width:100%;max-height:118px;filter:drop-shadow(0 0 1px rgba(255,255,255,.98)) drop-shadow(0 0 2.5px rgba(0,0,0,.95)) drop-shadow(0 7px 10px rgba(0,0,0,.8));transition:width .2s,height .2s}.score{font-size:22px;line-height:1;font-weight:950;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}.vs{text-align:center;color:#637289;font-size:10px;font-weight:950;letter-spacing:.08em}.state{position:absolute;top:7px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;color:var(--muted);white-space:nowrap}.state.live{color:#52d273}.empty{padding:50px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.hint{text-align:center;color:#607086;font-size:10px;margin-top:12px}.error{color:#ff8b8b}@media(max-width:480px){.app{padding-left:6px;padding-right:6px}.game{min-height:156px;padding:7px}.side{height:136px}.logo{max-height:108px}.score{font-size:20px}.title h1{font-size:19px}}
</style></head><body><main class="app"><header class="head"><div class="title"><h1>Logo Scoreboard</h1><a href="./index.html">Sports Tools</a></div><div id="leagues" class="leagues"></div><div class="datebar"><button id="prev" aria-label="Previous game day">‹</button><div class="datebox"><input id="date" type="date"><button id="today" class="today">TODAY</button></div><button id="next" aria-label="Next game day">›</button></div></header><div id="status" class="status"></div><section id="games" class="games"></section><div class="hint">Away left · Home right · Logo size shows the margin: winner grows, loser shrinks, normalized by each league's scoring level. Scores are shown for testing.</div></main>
<script>
(()=>{'use strict';
const L=[
{id:'all',label:'ALL'},
{id:'nfl',label:'NFL',sport:'football',league:'nfl',avg:22.5},
{id:'nba',label:'NBA',sport:'basketball',league:'nba',avg:114},
{id:'mlb',label:'MLB',sport:'baseball',league:'mlb',avg:4.5},
{id:'nhl',label:'NHL',sport:'hockey',league:'nhl',avg:3.1},
{id:'ncaaf',label:'NCAAF',sport:'football',league:'college-football',groups:'80',college:true,avg:27.5},
{id:'ncaam',label:'NCAAM',sport:'basketball',league:'mens-college-basketball',groups:'50',college:true,avg:74}
],E=id=>document.getElementById(id),els={leagues:E('leagues'),date:E('date'),prev:E('prev'),next:E('next'),today:E('today'),status:E('status'),games:E('games')};
let league=L[0],cache=new Map(),token=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),localDate=()=>{let d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,10)},ymd=s=>s.replace(/-/g,'');
els.date.value=localDate();els.leagues.innerHTML=L.map(x=>'<button class="league'+(x===league?' on':'')+'" data-id="'+x.id+'">'+x.label+'</button>').join('');
function url(l,d){return 'https://site.api.espn.com/apis/site/v2/sports/'+l.sport+'/'+l.league+'/scoreboard?dates='+ymd(d)+'&limit='+(l.college?500:100)+(l.groups?'&groups='+l.groups:'')}
async function get(u){if(cache.has(u))return cache.get(u);let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('ESPN HTTP '+r.status);let j=await r.json();cache.set(u,j);return j}
async function dayData(d){let use=league.id==='all'?L.slice(1):[league],sets=await Promise.all(use.map(async l=>({l,j:await get(url(l,d))})));return sets.flatMap(({l,j})=>(j.events||[]).map(ev=>({ev,l})))}
function score(t){let v=t?.score?.value??t?.score;return Number.isFinite(+v)?+v:0}
function logo(t){return t?.team?.logo||t?.team?.logos?.[0]?.href||''}
function logoSizes(l,a,b,started){let base=82;if(!started)return[base,base];let as=score(a),bs=score(b),diff=Math.abs(as-bs);if(!diff)return[base,base];let avg=l.avg||20,norm=diff/avg,p=Math.pow(norm,1.6),strength=p/(p+.28),delta=Math.min(58,58*strength),big=Math.round(base+delta),small=Math.round(Math.max(22,base-delta));return as>bs?[big,small]:[small,big]}
function gameCard(x){let ev=x.ev,l=x.l,c=ev.competitions?.[0]||{},ts=c.competitors||[],away=ts.find(t=>t.homeAway==='away')||ts[0],home=ts.find(t=>t.homeAway==='home')||ts[1],st=c.status||ev.status||{},state=st.type?.state||'',started=state==='in'||!!st.type?.completed,[awaySize,homeSize]=logoSizes(l,away,home,started),detail=st.type?.shortDetail||st.type?.detail||l.label;return '<article class="game" title="'+esc(l.label+' · '+(away?.team?.displayName||'Away')+' at '+(home?.team?.displayName||'Home'))+'"><div class="state '+(state==='in'?'live':'')+'">'+esc(l.label+' · '+detail)+'</div><div class="side">'+(logo(away)?'<div class="logoFrame" style="width:'+awaySize+'px;height:'+awaySize+'px"><img class="logo" src="'+esc(logo(away))+'" alt="'+esc(away?.team?.displayName||'Away')+'"></div>':'')+(started?'<div class="score">'+score(away)+'</div>':'')+'</div><div class="vs">VS</div><div class="side">'+(logo(home)?'<div class="logoFrame" style="width:'+homeSize+'px;height:'+homeSize+'px"><img class="logo" src="'+esc(logo(home))+'" alt="'+esc(home?.team?.displayName||'Home')+'"></div>':'')+(started?'<div class="score">'+score(home)+'</div>':'')+'</div></article>'}
async function load(){let mine=++token;els.status.textContent='Loading '+league.label+' · '+els.date.value+'…';els.games.innerHTML='';try{let rows=await dayData(els.date.value);if(mine!==token)return;els.status.textContent=league.label+' · '+els.date.value+' · '+rows.length+' game'+(rows.length===1?'':'s');els.games.innerHTML=rows.length?rows.map(gameCard).join(''):'<div class="empty">No games on this date. Use ← or → to jump to a game day.</div>'}catch(e){if(mine!==token)return;els.status.innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
async function move(n){let mine=++token,d=new Date(els.date.value+'T12:00:00');els.prev.disabled=els.next.disabled=true;els.status.textContent='Finding '+(n<0?'previous':'next')+' game day…';try{for(let i=0;i<60;i++){d.setDate(d.getDate()+n);let ds=d.toISOString().slice(0,10),rows=await dayData(ds);if(mine!==token)return;if(rows.length){els.date.value=ds;els.status.textContent=league.label+' · '+ds+' · '+rows.length+' games';els.games.innerHTML=rows.map(gameCard).join('');return}}els.status.textContent='No games found within 60 days.'}catch(e){if(mine!==token)return;els.status.innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{els.prev.disabled=els.next.disabled=false}}
els.leagues.onclick=e=>{let b=e.target.closest('[data-id]');if(!b)return;league=L.find(x=>x.id===b.dataset.id);document.querySelectorAll('.league').forEach(x=>x.classList.toggle('on',x===b));load()};els.prev.onclick=()=>move(-1);els.next.onclick=()=>move(1);els.today.onclick=()=>{els.date.value=localDate();load()};els.date.onchange=load;load();
})();
</script></body></html>
