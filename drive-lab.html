function renderTeams(ds){var ids=new Set(ds.map(function(d){return d.teamId})),rows=state.teams.filter(function(t){return ids.has(t.id)}).map(function(t){var own=ds.filter(function(d){return d.teamId===t.id}),a=agg(own);return Object.assign({},t,a)});sortTeams(rows);content.innerHTML='<div class="tablewrap"><table><thead><tr><th>Team</th><th>Drives</th><th>Pts/D</th><th>Yds/D</th><th>Plays/D</th><th>TD%</th><th>FG%</th><th>Punt%</th><th>TO%</th><th>3&O%</th><th>RZ Reach</th><th>RZ Finish</th><th>50+ yd</th><th>Avg Start</th></tr></thead><tbody>'+rows.map(function(t,i){return'<tr><td>'+logoCell(t,i+1)+'</td><td>'+t.n+'</td><td class="'+(t.ppd>=2.2?'good':'')+'">'+f1(t.ppd)+'</td><td>'+f1(t.ypd)+'</td><td>'+f1(t.plays)+'</td><td>'+f1(t.tdRate)+'%</td><td>'+f1(t.fgRate)+'%</td><td>'+f1(t.puntRate)+'%</td><td class="'+(t.toRate>=15?'bad':'')+'">'+f1(t.toRate)+'%</td><td>'+f1(t.threeRate)+'%</td><td>'+f1(t.rzRate)+'%</td><td class="'+(t.rzFinish>=60?'good':'')+'">'+f1(t.rzFinish)+'%</td><td>'+f1(t.expRate)+'%</td><td>Own '+f1(t.start)+'</td></tr>'}).join('')+'</tbody></table></div>'}
function renderGames(ds){var by=new Map;ds.forEach(function(d){if(!by.has(d.eventId))by.set(d.eventId,[]);by.get(d.eventId).push(d)});var games=state.games.filter(function(g){return by.has(g.id)});content.innerHTML='<div class="games">'+games.map(function(g){var gd=by.get(g.id)||[],lines=g.teams.map(function(t){var a=agg(gd.filter(function(d){return d.teamId===t.id}));return'<div class="teamLine">'+logoCell(t)+'<div class="mini"><b>'+f1(a.ppd)+'</b><span>Pts/D</span></div><div class="mini"><b>'+f1(a.ypd)+'</b><span>Yds/D</span></div><div class="mini hidePhone"><b>'+f1(a.tdRate)+'%</b><span>TD%</span></div><div class="mini hideMob hidePhone"><b>'+f1(a.threeRate)+'%</b><span>3&O</span></div><div class="mini hideMob"><b>'+f1(a.rzFinish)+'%</b><span>RZ Finish</span></div><div class="mini"><b class="score">'+t.score+'</b><span>Score</span></div></div>'}).join(''),tl=gd.map(function(d){return'<span class="seg '+d.result+'" data-tip="'+esc(d.abbr+' '+d.resultRaw+' · '+d.plays+' plays · '+d.yards+' yds')+'"></span>'}).join('');return'<article class="game"><div class="gamehead"><div><div class="matchup">'+esc(g.name)+'</div><div class="gameMeta">'+esc(new Date(g.date).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))+' · '+esc(g.status)+'</div></div></div>'+lines+'<div class="timeline">'+tl+'</div><div class="legend"><span><i style="background:#2fcf72"></i>TD</span><span><i style="background:#d7b33c"></i>FG</span><span><i style="background:#526158"></i>Punt</span><span><i style="background:#dc5b5b"></i>Turnover</span><span><i style="background:#d68445"></i>Downs</span></div></article>'}).join('')+'</div>'}
function renderDrives(ds){var arr=[...ds].sort(function(a,b){return new Date(b.date)-new Date(a.date)});content.innerHTML='<div class="driveGrid">'+arr.map(function(d){var s=Number.isFinite(d.start)?d.start:0,e=Number.isFinite(d.end)?d.end:s,left=Math.min(s,e),width=Math.max(3,Math.abs(e-s));return'<article class="driveCard"><div class="driveTop"><div class="driveTeam">'+(d.logo?'<img src="'+esc(d.logo)+'" alt="">':'')+esc(d.abbr)+'</div><span class="badge '+d.result+'">'+esc(d.resultRaw||d.result)+'</span></div><div class="driveRoute"><span class="routeFill" style="left:'+clamp(left,0,97)+'%;width:'+clamp(width,3,100-left)+'%"></span></div><div class="driveNums"><div><b>'+d.plays+'</b><span>Plays</span></div><div><b>'+d.yards+'</b><span>Yards</span></div><div><b>'+fmtTime(d.duration)+'</b><span>Time</span></div><div><b>'+d.points+'</b><span>Std Pts</span></div></div><div class="driveFoot">'+esc(d.startText||('Own '+f1(d.start)))+' → '+esc(d.endText||f1(d.end))+' · vs '+esc(d.oppAbbr) +(d.rz?' · RZ':'')+(d.three?' · 3&O':'')+(d.explosive?' · 50+':'')+'</div></article>'}).join('')+'</div>'}
function bucketRows(ds,buckets,fn){return buckets.map(function(b){var x=ds.filter(function(d){return fn(d,b)}),a=agg(x);return{name:b.name,n:x.length,ppd:a.ppd,td:a.tdRate,to:a.toRate,three:a.threeRate,rz:a.rzFinish}})}
function simpleTable(title,rows){return'<section class="section"><h3>'+title+'</h3><div class="tablewrap"><table><thead><tr><th>Situation</th><th>Drives</th><th>Pts/D</th><th>TD%</th><th>TO%</th><th>3&O%</th><th>RZ Finish</th></tr></thead><tbody>'+rows.map(function(r){return'<tr><td>'+esc(r.name)+'</td><td>'+r.n+'</td><td>'+f1(r.ppd)+'</td><td>'+f1(r.td)+'%</td><td>'+f1(r.to)+'%</td><td>'+f1(r.three)+'%</td><td>'+f1(r.rz)+'%</td></tr>'}).join('')+'</tbody></table></div></section>'}
function renderSituations(ds){var field=[{name:'Own 1-20',a:0,b:20},{name:'Own 21-40',a:20,b:40},{name:'Own 41-50',a:40,b:50},{name:'Opp 49-21',a:50,b:80},{name:'Red Zone Start',a:80,b:101}],length=[{name:'1-3 plays',a:1,b:3},{name:'4-6 plays',a:4,b:6},{name:'7-9 plays',a:7,b:9},{name:'10+ plays',a:10,b:999}],yards=[{name:'Negative / zero',a:-999,b:0},{name:'1-24 yards',a:1,b:24},{name:'25-49 yards',a:25,b:49},{name:'50-74 yards',a:50,b:74},{name:'75+ yards',a:75,b:999}];var fr=bucketRows(ds,field,function(d,b){return Number.isFinite(d.start)&&d.start>=b.a&&d.start<b.b}),lr=bucketRows(ds,length,function(d,b){return d.plays>=b.a&&d.plays<=b.b}),yr=bucketRows(ds,yards,function(d,b){return d.yards>=b.a&&d.yards<=b.b}),outcomes=['td','fg','punt','turnover','downs','missedfg','other'].map(function(k){return{name:k.toUpperCase(),n:ds.filter(function(d){return d.result===k}).length}}),mx=Math.max(1,...outcomes.map(function(x){return x.n}));content.innerHTML='<div class="situations">'+simpleTable('By Starting Field Position',fr)+simpleTable('By Drive Length',lr)+simpleTable('By Net Yards',yr)+'<section class="section"><h3>Outcome Distribution</h3><div class="bars">'+outcomes.map(function(r){return'<div class="barrow"><span>'+esc(r.name)+'</span><div class="bar"><i style="width:'+pct(r.n,mx)+'%"></i></div><b>'+r.n+'</b></div>'}).join('')+'</div></section></div>'}
function render(){if(!state.drives.length){metrics.innerHTML='';content.innerHTML='<div class="empty">No drive data loaded yet.</div>';return}var ds=filteredDrives();metricCards(ds);if(!ds.length){content.innerHTML='<div class="empty">No drives match the current filters.</div>';return}if(state.view==='teams')renderTeams(ds);else if(state.view==='games')renderGames(ds);else if(state.view==='drives')renderDrives(ds);else renderSituations(ds)}
function populateTeams(){var old=teamFilter.value;teamFilter.innerHTML='<option value="all">All teams</option>'+state.teams.sort(function(a,b){return a.name.localeCompare(b.name)}).map(function(t){return'<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>'}).join('');if([...teamFilter.options].some(function(o){return o.value===old}))teamFilter.value=old}
async function loadEvents(){var ws=weeksToScan(),all=[];var res=await mapLimit(ws,4,async function(w){var s=await J(scoreUrl(w));return(s.events||[]).map(function(e){if(!e.week)e.week={number:w};return e})},function(n,d){setProgress('Loading scoreboards '+n+'/'+d,n,d)});res.forEach(function(x){if(Array.isArray(x))all=all.concat(x)});var m=new Map;all.forEach(function(e){if(e&&e.id)m.set(String(e.id),e)});return[...m.values()]}
async function run(){if(state.loading)return;state.loading=true;scan.disabled=true;cache.clear();state.games=[];state.drives=[];state.teams=[];metrics.innerHTML='';content.innerHTML='<div class="empty">Loading drive summaries…</div>';status.textContent='Loading '+(league.value==='nfl'?'NFL':'NCAAF FBS')+' games…';try{var events=await loadEvents();state.events=events;if(!events.length)throw Error('No games found for this selection.');var errors=0,parsed=await mapLimit(events,+workers.value,async function(e){var sm=await J(summaryUrl(e.id));return parseGame(e,sm)},function(n,d){setProgress('Scanning game summaries '+n+'/'+d,n,d)});parsed.forEach(function(g){if(g&&g.error)errors++;else if(g&&g.drives&&g.drives.length){state.games.push(g);state.drives=state.drives.concat(g.drives)}});buildTeams();populateTeams();status.textContent=state.drives.length+' drives · '+state.games.length+'/'+events.length+' games with drive data · '+state.teams.length+' teams'+(errors?' · '+errors+' summary failures':'')+' · '+season.value+' '+(scope.value==='week'?'week '+week.value:'full season');render();finishProgress()}catch(e){status.innerHTML='<span class="error">Failed: '+esc(e.message)+'</span>';content.innerHTML='<div class="empty">Drive scan failed. Change the season/week or retry.</div>';$('progressWrap').classList.remove('on')}finally{state.loading=false;scan.disabled=false}}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){state.view=b.dataset.view;document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});render()}})
;[teamFilter,outcomeFilter,sort].forEach(function(x){x.onchange=render});search.oninput=render;scan.onclick=run;league.onchange=refreshWeeks;season.onchange=refreshWeeks;seasonType.onchange=refreshWeeks;scope.onchange=refreshWeeks;refreshWeeks();
})();
