<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>ScoreFlow</title><style>
:root{color-scheme:dark;--bg:#07101d;--panel:#0e1a2b;--panel2:#132238;--text:#f6f8fb;--muted:#93a4ba;--line:#23344d;--nhl:#7dc7ff;--nba:#ffb86b;--mlb:#7ee0a7;--nfl:#d69cff;--ncaab:#ffd86b;--wnba:#ff8acb;--ncaaf:#8bd8c7}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#07101d;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(1180px,100%);margin:auto;padding-bottom:max(24px,env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:30;background:rgba(7,16,29,.94);backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12;padding:max(10px,env(safe-area-inset-top)) 10px 9px}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}.title h1{font-size:1.12rem;margin:0}.title p{font-size:.73rem;color:var(--muted);margin:2px 0 0}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;min-height:36px;padding:0 10px;cursor:pointer}.filters{display:flex;gap:6px;overflow-x:auto;padding-top:9px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid var(--line);background:#0b1524;color:var(--muted);padding:6px 8px;border-radius:999px;font-size:.69rem;font-weight:850;cursor:pointer}.filter.on{color:#fff;background:#1a2b42}.calendar{padding:10px}.month{margin:0 0 18px;scroll-margin-top:98px}.month-head{position:sticky;top:93px;z-index:12;background:rgba(7,16,29,.95);padding:8px 2px 7px;font-weight:900;font-size:.98rem}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekdays{margin-bottom:5px;color:var(--muted);font-size:.66rem;font-weight:800;text-align:center;text-transform:uppercase}.cell{min-height:118px;border:1px solid #ffffff12;background:linear-gradient(180deg,#111e31,#0c1727);border-radius:12px;padding:6px;overflow:hidden}.cell.blank{background:transparent;border-color:transparent}.cell.today{outline:2px solid #7dc7ff88;outline-offset:1px}.daynum{font-size:.78rem;font-weight:900;margin-bottom:5px;color:#dce6f2}.chips{display:flex;flex-direction:column;gap:3px}.chip{display:flex;align-items:center;justify-content:space-between;gap:4px;width:100%;border:1px solid #ffffff12;background:#ffffff08;border-radius:7px;padding:4px 5px;font-size:.62rem;font-weight:850;cursor:pointer;min-width:0}.chip .l{white-space:nowrap}.chip .v{font-variant-numeric:tabular-nums;white-space:nowrap}.chip .g{font-size:.55rem;opacity:.7;white-space:nowrap}.chip.nhl{color:var(--nhl)}.chip.nba{color:var(--nba)}.chip.mlb{color:var(--mlb)}.chip.nfl{color:var(--nfl)}.chip.ncaab{color:var(--ncaab)}.chip.wnba{color:var(--wnba)}.chip.ncaaf{color:var(--ncaaf)}.chip.empty{opacity:.35;cursor:default}.more{color:var(--muted);font-size:.58rem;text-align:center;padding-top:2px}.load{width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:10px;font-weight:800;cursor:pointer;margin:0 0 12px}.modalback{position:fixed;inset:0;z-index:60;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:12px}.modalback.open{display:flex}.modal{width:min(640px,100%);max-height:82vh;overflow:auto;background:#0d1828;border:1px solid #293a52;border-radius:20px 20px 14px 14px}.mh{position:sticky;top:0;background:#0d1828f4;backdrop-filter:blur(14px);display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px;border-bottom:1px solid #ffffff12}.mh h2{margin:0;font-size:1rem}.mh p{margin:2px 0 0;font-size:.72rem;color:var(--muted)}.close{width:36px;height:36px;border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:10px;font-size:1.1rem}.games{padding:6px 12px 14px}.game{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff0e}.teams{display:grid;gap:6px}.team{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:7px;align-items:center;font-weight:750;font-size:.84rem}.team img{width:24px;height:24px;object-fit:contain}.score{font-weight:900}.meta{font-size:.68rem;color:var(--muted);text-align:right}.emptymsg{text-align:center;color:var(--muted);padding:24px}
@media(max-width:760px){.calendar{padding:7px}.weekdays,.grid{gap:3px}.cell{min-height:108px;padding:4px;border-radius:9px}.daynum{font-size:.7rem;margin-bottom:3px}.chip{padding:3px 4px;font-size:.56rem}.chip .g{font-size:.49rem}.month-head{top:96px}.filter{font-size:.64rem;padding:5px 7px}}
@media(max-width:520px){.cell{min-height:98px}.chip{display:grid;grid-template-columns:1fr auto;gap:1px}.chip .g{grid-column:1/3;text-align:left}.title p{display:none}.month-head{top:88px}.filter{font-size:.6rem}.weekdays{font-size:.58rem}}
</style></head><body><div class="app"><header class="top"><div class="bar"><div class="title"><h1>ScoreFlow</h1><p>Average team scoring by calendar date</p></div><button class="btn" id="todayBtn">Today</button></div><div class="filters" id="filters"></div></header><main class="calendar"><button class="load" id="earlier">Load previous months</button><div id="months"></div><button class="load" id="later">Load next months</button></main></div><div class="modalback" id="modalBack"><section class="modal"><div class="mh"><div><h2 id="modalTitle">Scores</h2><p id="modalSub"></p></div><button class="close" id="modalClose">×</button></div><div class="games" id="modalGames"></div></section></div><script>
(()=>{const L={nhl:{name:"NHL",sport:"hockey",league:"nhl",d:2},nba:{name:"NBA",sport:"basketball",league:"nba",d:1},mlb:{name:"MLB",sport:"baseball",league:"mlb",d:2},nfl:{name:"NFL",sport:"football",league:"nfl",d:1},ncaab:{name:"NCAAB",sport:"basketball",league:"mens-college-basketball",d:1},wnba:{name:"WNBA",sport:"basketball",league:"wnba",d:1},ncaaf:{name:"NCAAF",sport:"football",league:"college-football",d:1}},DEFAULT=["nhl","nba","mlb","nfl"],C=new Map(),months=document.getElementById("months"),filters=document.getElementById("filters"),modalBack=document.getElementById("modalBack"),modalTitle=document.getElementById("modalTitle"),modalSub=document.getElementById("modalSub"),modalGames=document.getElementById("modalGames");let enabled=new Set(JSON.parse(localStorage.getItem("scoreflowLeagues")||"null")||DEFAULT),start=monthKey(addMonths(today(),-2)),end=monthKey(addMonths(today(),2));
function ymd(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}function today(){return ymd(new Date)}function date(s){let[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c,12)}function monthKey(s){return s.slice(0,7)}function addMonths(s,n){let d=date(s);d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d)}function fmt(s,o){return date(s).toLocaleDateString(undefined,o)}function url(k,s){let l=L[k];return `https://site.api.espn.com/apis/site/v2/sports/${l.sport}/${l.league}/scoreboard?dates=${s.replaceAll("-","")}&limit=300`}
async function get(k,s){let ck=k+":"+s;if(C.has(ck))return C.get(ck);let r=await fetch(url(k,s));if(!r.ok)throw Error(r.status);let j=await r.json(),games=(j.events||[]).map(e=>{let c=e.competitions?.[0]||{},cs=c.competitors||[],a=cs.find(x=>x.homeAway==="away")||cs[0]||{},h=cs.find(x=>x.homeAway==="home")||cs[1]||{},st=c.status?.type||e.status?.type||{},final=!!st.completed||st.state==="post";return{final,status:st.shortDetail||st.detail||"",away:team(a),home:team(h),as:Number(a.score)||0,hs:Number(h.score)||0}}),finals=games.filter(g=>g.final),scores=finals.flatMap(g=>[g.as,g.hs]),avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null,d={games,finals,avg};C.set(ck,d);return d}
function team(c){return{name:c.team?.shortDisplayName||c.team?.displayName||c.team?.abbreviation||"Team",logo:c.team?.logo||c.team?.logos?.[0]?.href||""}}function n(v,k){return v==null?"—":v.toFixed(L[k].d).replace(/\.00$/,"").replace(/(\.\d)0$/,"$1")}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function renderFilters(){filters.innerHTML=Object.keys(L).map(k=>`<button class="filter ${enabled.has(k)?"on":""}" data-k="${k}">${L[k].name}</button>`).join("");filters.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{let k=b.dataset.k;enabled.has(k)?enabled.delete(k):enabled.add(k);if(!enabled.size)enabled.add(k);localStorage.setItem("scoreflowLeagues",JSON.stringify([...enabled]));renderFilters();renderMonths()})}
function monthRange(){let out=[],m=start;while(m<=end){out.push(m);m=monthKey(addMonths(m+"-01",1))}return out}
let observer=null;function renderMonths(){if(observer)observer.disconnect();months.innerHTML="";monthRange().forEach(m=>months.appendChild(makeMonth(m)));observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.loaded){e.target.dataset.loaded="1";hydrateMonth(e.target.id.replace("month-",""))}}),{rootMargin:"500px 0px"});months.querySelectorAll(".month").forEach(m=>observer.observe(m))}
function makeMonth(m){let [y,mo]=m.split("-").map(Number),first=new Date(y,mo-1,1,12),daysIn=new Date(y,mo,0).getDate(),wrap=document.createElement("section");wrap.className="month";wrap.id="month-"+m;let head=document.createElement("div");head.className="month-head";head.textContent=first.toLocaleDateString(undefined,{month:"long",year:"numeric"});wrap.appendChild(head);let wd=document.createElement("div");wd.className="weekdays";wd.innerHTML=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>"<div>"+x+"</div>").join("");wrap.appendChild(wd);let grid=document.createElement("div");grid.className="grid";for(let i=0;i<first.getDay();i++){let b=document.createElement("div");b.className="cell blank";grid.appendChild(b)}for(let d=1;d<=daysIn;d++){let s=ymd(new Date(y,mo-1,d,12)),c=document.createElement("div");c.className="cell"+(s===today()?" today":"");c.id="day-"+s;c.innerHTML=`<div class="daynum">${d}</div><div class="chips">${[...enabled].map(k=>`<button class="chip ${k}" data-k="${k}" data-date="${s}"><span class="l">${L[k].name}</span><span class="v">…</span><span class="g">…</span></button>`).join("")}</div>`;grid.appendChild(c)}wrap.appendChild(grid);wrap.querySelectorAll(".chip").forEach(b=>b.onclick=()=>openModal(b.dataset.date,b.dataset.k));return wrap}
async function hydrateDay(s){let cell=document.getElementById("day-"+s);if(!cell)return;await Promise.all([...enabled].map(async k=>{let b=cell.querySelector('[data-k="'+k+'"]');if(!b)return;try{let d=await get(k,s);b.querySelector(".v").textContent=n(d.avg,k);b.querySelector(".g").textContent=d.finals.length+"g";if(d.avg==null)b.classList.add("empty")}catch(e){b.querySelector(".v").textContent="!";b.querySelector(".g").textContent=""}}))}
function hydrateMonth(m){let [y,mo]=m.split("-").map(Number),cnt=new Date(y,mo,0).getDate();for(let d=1;d<=cnt;d++)hydrateDay(ymd(new Date(y,mo-1,d,12)))}
async function openModal(s,k){modalBack.classList.add("open");modalTitle.textContent=L[k].name+" • "+fmt(s,{weekday:"short",month:"short",day:"numeric",year:"numeric"});modalSub.textContent="Loading…";modalGames.innerHTML="";try{let d=await get(k,s);modalSub.textContent=d.finals.length?(n(d.avg,k)+" avg/team • "+d.finals.length+" games considered"):"No completed games";modalGames.innerHTML=d.games.length?d.games.map(g=>`<div class="game"><div class="teams"><div class="team">${g.away.logo?'<img src="'+g.away.logo+'" alt="">':"<span></span>"}<span>${esc(g.away.name)}</span><span class="score">${g.as}</span></div><div class="team">${g.home.logo?'<img src="'+g.home.logo+'" alt="">':"<span></span>"}<span>${esc(g.home.name)}</span><span class="score">${g.hs}</span></div></div><div class="meta">${esc(g.status)}</div></div>`).join(""):'<div class="emptymsg">No games scheduled.</div>'}catch(e){modalSub.textContent="Unavailable";modalGames.innerHTML='<div class="emptymsg">Score data could not be loaded.</div>'}}
function close(){modalBack.classList.remove("open")}document.getElementById("modalClose").onclick=close;modalBack.onclick=e=>{if(e.target===modalBack)close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});document.getElementById("todayBtn").onclick=()=>document.getElementById("day-"+today())?.scrollIntoView({behavior:"smooth",block:"center"});document.getElementById("earlier").onclick=()=>{start=monthKey(addMonths(start+"-01",-3));renderMonths()};document.getElementById("later").onclick=()=>{end=monthKey(addMonths(end+"-01",3));renderMonths()};renderFilters();renderMonths();setTimeout(()=>document.getElementById("day-"+today())?.scrollIntoView({block:"center"}),250)})();
</script></body></html>
