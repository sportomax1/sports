<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>ScoreFlow</title>
<style>
:root{color-scheme:dark;--bg:#07101d;--panel:#0e1a2b;--panel2:#132238;--text:#f6f8fb;--muted:#93a4ba;--line:#23344d;--nhl:#7dc7ff;--nba:#ffb86b;--mlb:#7ee0a7;--nfl:#d69cff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#08111f,#07101d);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(760px,100%);margin:auto;padding-bottom:max(28px,env(safe-area-inset-bottom))}.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(18px);background:rgba(7,16,29,.9);border-bottom:1px solid rgba(255,255,255,.07);padding:max(10px,env(safe-area-inset-top)) 12px 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:1.12rem;margin:0}.sub{font-size:.76rem;color:var(--muted);margin-top:2px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;min-height:38px;padding:0 11px;cursor:pointer}.legend{display:flex;gap:7px;overflow:auto;padding-top:9px;scrollbar-width:none}.legend::-webkit-scrollbar{display:none}.legend span{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:.71rem;font-weight:700}.feed{padding:10px 8px 0}.month{position:sticky;top:94px;z-index:8;width:max-content;margin:14px 0 7px 2px;padding:5px 9px;border-radius:999px;background:rgba(7,16,29,.94);border:1px solid rgba(255,255,255,.07);color:#c8d4e4;font-weight:800;font-size:.76rem;text-transform:uppercase}.day{border:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(18,33,54,.96),rgba(12,23,39,.96));border-radius:16px;margin-bottom:8px}.day.today{outline:2px solid rgba(125,199,255,.55);outline-offset:1px}.day-head{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:center;padding:10px}.dow{color:var(--muted);text-transform:uppercase;font-size:.67rem;font-weight:800;letter-spacing:.08em}.dom{font-size:1.5rem;font-weight:900;margin-top:4px;letter-spacing:-.05em}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:7px 9px;font-size:.78rem;font-weight:850;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);font-variant-numeric:tabular-nums;cursor:pointer}.tag:hover{background:rgba(255,255,255,.09)}.tag .league{font-size:.64rem;letter-spacing:.05em}.tag.nhl{color:var(--nhl)}.tag.nba{color:var(--nba)}.tag.mlb{color:var(--mlb)}.tag.nfl{color:var(--nfl)}.tag.empty{opacity:.4;cursor:default}.tag.loading{opacity:.7}.load{width:100%;border:1px dashed var(--line);color:var(--muted);background:transparent;border-radius:13px;padding:11px;margin:2px 0 10px;cursor:pointer;font-weight:700}
.modalback{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.67);display:none;align-items:flex-end;justify-content:center;padding:14px}.modalback.open{display:flex}.modal{width:min(600px,100%);max-height:min(80vh,720px);overflow:auto;background:#0d1828;border:1px solid #293a52;border-radius:20px 20px 14px 14px;box-shadow:0 30px 80px #0009}.modalhead{position:sticky;top:0;background:rgba(13,24,40,.96);backdrop-filter:blur(16px);display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid rgba(255,255,255,.07)}.modalhead h2{margin:0;font-size:1rem}.modalhead p{margin:3px 0 0;color:var(--muted);font-size:.76rem}.close{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:white;font-size:1.15rem;cursor:pointer}.games{padding:8px 12px 14px}.game{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.06)}.teams{display:grid;gap:7px}.team{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;font-weight:750}.team img{width:26px;height:26px;object-fit:contain}.score{font-weight:900;font-size:1.06rem}.meta{text-align:right;color:var(--muted);font-size:.7rem}.emptymsg{text-align:center;color:var(--muted);padding:24px 8px}
@media(min-width:700px){.modalback{align-items:center}.modal{border-radius:20px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="row"><div><h1>ScoreFlow</h1><div class="sub">Daily average team scoring across the core four</div></div><button class="btn" id="todayBtn">Today</button></div><div class="legend"><span>NHL goals/team</span><span>NBA points/team</span><span>MLB runs/team</span><span>NFL points/team</span></div></header>
<main class="feed"><button class="load" id="loadEarlier">Load earlier dates</button><div id="days"></div><button class="load" id="loadLater">Load later dates</button></main>
</div>
<div class="modalback" id="modalBack" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true"><div class="modalhead"><div><h2 id="modalTitle">Scores</h2><p id="modalSub"></p></div><button class="close" id="modalClose" aria-label="Close">×</button></div><div class="games" id="modalGames"></div></section></div>
<script>
(()=>{const L={nhl:{name:"NHL",sport:"hockey",league:"nhl",d:2},nba:{name:"NBA",sport:"basketball",league:"nba",d:1},mlb:{name:"MLB",sport:"baseball",league:"mlb",d:2},nfl:{name:"NFL",sport:"football",league:"nfl",d:1}},C=new Map(),days=document.getElementById("days"),modalBack=document.getElementById("modalBack"),modalTitle=document.getElementById("modalTitle"),modalSub=document.getElementById("modalSub"),modalGames=document.getElementById("modalGames");let start=add(today(),-21),end=add(today(),7);
function ymd(x){return [x.getFullYear(),String(x.getMonth()+1).padStart(2,"0"),String(x.getDate()).padStart(2,"0")].join("-")}function today(){return ymd(new Date)}function date(s){let[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c,12)}function add(s,n){let x=date(s);x.setDate(x.getDate()+n);return ymd(x)}function fmtDate(s,o){return date(s).toLocaleDateString(undefined,o)}function dates(a,b){let r=[];for(let x=a;x<=b;x=add(x,1))r.push(x);return r}function url(k,s){let l=L[k];return `https://site.api.espn.com/apis/site/v2/sports/${l.sport}/${l.league}/scoreboard?dates=${s.replaceAll("-","")}&limit=200`}
async function get(k,s){let ck=k+":"+s;if(C.has(ck))return C.get(ck);let r=await fetch(url(k,s));if(!r.ok)throw Error(r.status);let j=await r.json(),games=(j.events||[]).map(e=>{let c=e.competitions?.[0]||{},cs=c.competitors||[],a=cs.find(x=>x.homeAway==="away")||cs[0]||{},h=cs.find(x=>x.homeAway==="home")||cs[1]||{},st=c.status?.type||e.status?.type||{},final=!!st.completed||st.state==="post";return{final,status:st.shortDetail||st.detail||"",date:e.date,away:team(a),home:team(h),as:Number(a.score)||0,hs:Number(h.score)||0}}),finals=games.filter(g=>g.final),scores=finals.flatMap(g=>[g.as,g.hs]),avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null,d={avg,finals,games};C.set(ck,d);return d}
function team(c){return{name:c.team?.shortDisplayName||c.team?.displayName||c.team?.abbreviation||"Team",abbr:c.team?.abbreviation||"",logo:c.team?.logo||c.team?.logos?.[0]?.href||""}}
function num(v,k){return v==null?"—":v.toFixed(L[k].d).replace(/\.00$/,"").replace(/(\.\d)0$/,"$1")}
function shell(s,month){let p=date(s),w=document.createElement("div");if(month){let m=document.createElement("div");m.className="month";m.textContent=fmtDate(s,{month:"long",year:"numeric"});w.appendChild(m)}let d=document.createElement("section");d.className="day"+(s===today()?" today":"");d.id="day-"+s;d.innerHTML=`<div class="day-head"><div><div class="dow">${fmtDate(s,{weekday:"short"})}</div><div class="dom">${p.getDate()}</div></div><div class="tags">${Object.keys(L).map(k=>`<button class="tag ${k} loading" data-k="${k}"><span class="league">${L[k].name}</span><span class="value">…</span></button>`).join("")}</div></div>`;d.querySelectorAll(".tag").forEach(b=>b.onclick=e=>{e.stopPropagation();openModal(s,b.dataset.k)});w.appendChild(d);return w}
async function hydrate(s){let d=document.getElementById("day-"+s),ks=Object.keys(L),rs=await Promise.allSettled(ks.map(k=>get(k,s)));rs.forEach((r,i)=>{let k=ks[i],b=d.querySelector('[data-k="'+k+'"]'),v=b.querySelector(".value");b.classList.remove("loading");if(r.status!=="fulfilled"){v.textContent="!";return}v.textContent=num(r.value.avg,k);if(r.value.avg==null){b.classList.add("empty");b.disabled=true}})}
function render(){days.innerHTML="";let last="",f=document.createDocumentFragment();dates(start,end).forEach(s=>{let m=s.slice(0,7);f.appendChild(shell(s,m!==last));last=m});days.appendChild(f);dates(start,end).forEach(hydrate)}
async function openModal(s,k){modalTitle.textContent=L[k].name+" • "+fmtDate(s,{weekday:"short",month:"short",day:"numeric"});modalSub.textContent="Loading game scores…";modalGames.innerHTML="";modalBack.classList.add("open");modalBack.setAttribute("aria-hidden","false");try{let d=await get(k,s);modalSub.textContent=d.finals.length?num(d.avg,k)+" average per team • "+d.finals.length+" final"+(d.finals.length===1?"":"s"):"No completed games";modalGames.innerHTML=d.games.length?d.games.map(g=>`<div class="game"><div class="teams"><div class="team">${g.away.logo?'<img src="'+g.away.logo+'" alt="">':"<span></span>"}<span>${esc(g.away.name)}</span><span class="score">${g.as}</span></div><div class="team">${g.home.logo?'<img src="'+g.home.logo+'" alt="">':"<span></span>"}<span>${esc(g.home.name)}</span><span class="score">${g.hs}</span></div></div><div class="meta">${esc(g.status)}</div></div>`).join(""):'<div class="emptymsg">No '+L[k].name+' games scheduled.</div>'}catch(e){modalSub.textContent="Could not load scores";modalGames.innerHTML='<div class="emptymsg">Score data unavailable.</div>'}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function close(){modalBack.classList.remove("open");modalBack.setAttribute("aria-hidden","true")}document.getElementById("modalClose").onclick=close;modalBack.onclick=e=>{if(e.target===modalBack)close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});document.getElementById("todayBtn").onclick=()=>document.getElementById("day-"+today())?.scrollIntoView({behavior:"smooth",block:"center"});
document.getElementById("loadEarlier").onclick=()=>{let old=start;start=add(start,-15);let f=document.createDocumentFragment(),last="";dates(start,add(old,-1)).forEach(s=>{let m=s.slice(0,7);f.appendChild(shell(s,m!==last));last=m});days.insertBefore(f,days.firstChild);dates(start,add(old,-1)).forEach(hydrate)};
document.getElementById("loadLater").onclick=()=>{let old=end;end=add(end,15);let f=document.createDocumentFragment(),last=old.slice(0,7);dates(add(old,1),end).forEach(s=>{let m=s.slice(0,7);f.appendChild(shell(s,m!==last));last=m});days.appendChild(f);dates(add(old,1),end).forEach(hydrate)};
render();setTimeout(()=>document.getElementById("day-"+today())?.scrollIntoView({block:"center"}),200)})();
</script>
</body>
</html>
