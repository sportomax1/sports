<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circle of Life Lab</title><style>
:root{color-scheme:dark;--bg:#07101b;--card:#101b29;--line:#26364a;--text:#eef5ff;--muted:#8fa3ba;--accent:#72d5ff}*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:var(--bg);color:var(--text)}header{padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#07101bf2;z-index:5}h1{margin:0;font-size:22px}.sub{color:var(--muted);margin-top:3px}.controls{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px}.controls select,.controls button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font-weight:700}button{cursor:pointer}.active{border-color:var(--accent)!important;color:var(--accent)!important}.status{padding:0 20px 10px;color:var(--muted)}main{padding:0 20px 30px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:10px}.stage{min-height:520px;background:radial-gradient(circle at center,#122237,#08111d 70%);border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden}svg{width:100%;height:600px}.node text{fill:var(--text);font-size:11px;font-weight:800;text-anchor:middle}.node circle{fill:#172a40;stroke:var(--accent);stroke-width:2}.edge{stroke:#637d98;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.edgeLabel{fill:#a9bad0;font-size:10px;text-anchor:middle}.empty{display:grid;place-items:center;height:520px;color:var(--muted);text-align:center;padding:30px}.legend{color:var(--muted);padding:10px 2px}.games{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.games h3{margin:0 0 8px}.game{padding:7px 0;border-top:1px solid var(--line)}@media(max-width:600px){header,.controls,main{padding-left:10px;padding-right:10px}svg{height:520px}.stage{min-height:460px}}
</style></head><body><header><h1>⭕ Circle of Life Lab</h1><div class="sub">Find closed chains where every team beat the next team, and the final team beat the first.</div></header>
<div class="controls"><select id="league"></select><select id="year"></select><select id="season"><option value="">All games</option><option value="2">Regular season</option><option value="3">Postseason</option></select><button id="small" class="active">Smallest Circle</button><button id="big">Biggest Circle</button><button id="go">Find Circle</button></div>
<div id="status" class="status">Choose a league and season.</div><main><div id="stats" class="stats"></div><div id="stage" class="stage"><div class="empty">Load a season to find a win cycle.</div></div><div class="legend">An arrow A → B means A defeated B at least once during the selected season. Ties are excluded.</div><div id="games"></div></main>
<script>
const L={nfl:['NFL','football','nfl',1920],nba:['NBA','basketball','nba',1946],mlb:['MLB','baseball','mlb',1903],nhl:['NHL','hockey','nhl',1917],wnba:['WNBA','basketball','wnba',1997],ncaaf:['NCAAF','football','college-football',1869],ncaam:['NCAAM','basketball','mens-college-basketball',1939],ncaaw:['NCAAW','basketball','womens-college-basketball',1982]};
const $=s=>document.querySelector(s), now=new Date().getFullYear();
const leagueEl=$('#league'),yearEl=$('#year'),seasonEl=$('#season'),smallEl=$('#small'),bigEl=$('#big'),goEl=$('#go'),statusEl=$('#status'),stageEl=$('#stage'),statsEl=$('#stats'),gamesEl=$('#games');
let mode='small',games=[],teams=new Map(),edgeGames=new Map();
leagueEl.innerHTML=Object.entries(L).map(([k,v])=>'<option value="'+k+'">'+v[0]+'</option>').join('');
function years(){let s=L[leagueEl.value][3];yearEl.innerHTML=Array.from({length:now-s+1},(_,i)=>now-i).map(y=>'<option>'+y+'</option>').join('')}years();leagueEl.onchange=years;
smallEl.onclick=()=>setMode('small');bigEl.onclick=()=>setMode('big');function setMode(m){mode=m;smallEl.classList.toggle('active',m==='small');bigEl.classList.toggle('active',m==='big')}
const key=(a,b)=>a+'>'+b;
async function load(){let [,,lg]=L[leagueEl.value],sport=L[leagueEl.value][1],y=yearEl.value;statusEl.textContent='Loading '+L[leagueEl.value][0]+' '+y+'…';let u='https://site.api.espn.com/apis/site/v2/sports/'+sport+'/'+lg+'/scoreboard?dates='+y+'&limit=10000'+(seasonEl.value?'&seasontype='+seasonEl.value:'');let d=await fetch(u).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});games=[];teams.clear();edgeGames.clear();
for(const e of d.events||[]){if(!e.status?.type?.completed)continue;let c=e.competitions?.[0]?.competitors||[];if(c.length<2)continue;let a=c[0],b=c[1],sa=+a.score,sb=+b.score;if(sa===sb||!Number.isFinite(sa)||!Number.isFinite(sb))continue;games.push(e);let w=sa>sb?a:b,l=sa>sb?b:a;for(const x of [w,l])teams.set(x.team.id,{id:x.team.id,name:x.team.shortDisplayName||x.team.displayName,abbr:x.team.abbreviation,logo:x.team.logo});let k=key(w.team.id,l.team.id);if(!edgeGames.has(k))edgeGames.set(k,[]);edgeGames.get(k).push({name:e.name,date:e.date,ws:Math.max(sa,sb),ls:Math.min(sa,sb)})}statusEl.textContent='Loaded '+games.length+' games';return find()}
function graph(){let g=new Map();for(const k of edgeGames.keys()){let [a,b]=k.split('>');if(!g.has(a))g.set(a,new Set);g.get(a).add(b)}return g}
function shortest(g){let best=null;for(const start of g.keys()){let q=[[start,[start]]],seen=new Map([[start,0]]);while(q.length){let [v,p]=q.shift();for(const n of g.get(v)||[]){if(n===start&&p.length>=2){let c=[...p];if(!best||c.length<best.length)best=c;continue}if(p.length>=(best?.length||Infinity)-1)continue;if(!seen.has(n)||seen.get(n)>p.length){seen.set(n,p.length);q.push([n,[...p,n]])}}}}return best}
function longest(g){let best=null,nodes=[...g.keys()],deadline=performance.now()+1200;nodes.sort((a,b)=>(g.get(b)?.size||0)-(g.get(a)?.size||0));const dfs=(start,v,path,used)=>{if(performance.now()>deadline)return;let next=[...(g.get(v)||[])].sort((a,b)=>(g.get(b)?.size||0)-(g.get(a)?.size||0));for(const n of next){if(n===start&&path.length>=2){if(!best||path.length>best.length)best=[...path];continue}if(used.has(n))continue;used.add(n);path.push(n);dfs(start,n,path,used);path.pop();used.delete(n);if(performance.now()>deadline)return}};for(const s of nodes){dfs(s,s,[s],new Set([s]));if(best?.length===teams.size||performance.now()>deadline)break}return best||shortest(g)}
function find(){let g=graph(),c=mode==='small'?shortest(g):longest(g);if(!c){stageEl.innerHTML='<div class="empty">No closed win cycle found.</div>';statsEl.innerHTML='';return}render(c)}
function render(c){statusEl.textContent=(mode==='small'?'Smallest':'Biggest found')+' circle: '+c.length+' teams'+(mode==='big'?' · optimized search':'');statsEl.innerHTML='<div class="stat"><b>'+c.length+'</b> teams in circle</div><div class="stat"><b>'+teams.size+'</b> teams loaded</div><div class="stat"><b>'+edgeGames.size+'</b> winner→loser links</div>';let w=900,h=600,cx=w/2,cy=h/2,r=Math.min(w,h)*.36,pts=c.map((id,i)=>{let a=-Math.PI/2+i*2*Math.PI/c.length;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a),id}});let edges='',nodes='';for(let i=0;i<c.length;i++){let a=pts[i],b=pts[(i+1)%c.length],n=edgeGames.get(key(a.id,b.id))?.length||0;edges+='<path class="edge" d="M '+a.x+' '+a.y+' L '+b.x+' '+b.y+'"/><text class="edgeLabel" x="'+((a.x+b.x)/2)+'" y="'+((a.y+b.y)/2)+'">'+n+' win'+(n===1?'':'s')+'</text>'}for(const p of pts){let t=teams.get(p.id);nodes+='<g class="node"><circle cx="'+p.x+'" cy="'+p.y+'" r="27"/><image href="'+(t.logo||'')+'" x="'+(p.x-18)+'" y="'+(p.y-18)+'" width="36" height="36"/><text x="'+p.x+'" y="'+(p.y+43)+'">'+t.abbr+'</text></g>'}stageEl.innerHTML='<svg viewBox="0 0 '+w+' '+h+'"><defs><marker id="arrow" viewBox="0 0 10 10" refX="24" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#637d98"/></marker></defs>'+edges+nodes+'</svg>';let rows='';for(let i=0;i<c.length;i++){let a=c[i],b=c[(i+1)%c.length],eg=edgeGames.get(key(a,b))||[];rows+='<div class="game"><b>'+teams.get(a).name+' → '+teams.get(b).name+'</b> · '+eg.length+' win'+(eg.length===1?'':'s')+'<br><span style="color:var(--muted)">'+eg.slice(0,3).map(x=>new Date(x.date).toLocaleDateString()+' '+x.ws+'–'+x.ls).join(' · ')+'</span></div>'}gamesEl.innerHTML='<div class="games"><h3>Proof games</h3>'+rows+'</div>'}
goEl.onclick=()=>load().catch(e=>{statusEl.textContent='Could not load season: '+e.message;stageEl.innerHTML='<div class="empty">ESPN season data could not be loaded.</div>'});
</script></body></html>
