<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Milestone Lab</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui}.w{max-width:1250px;margin:auto;padding:18px}.muted{color:#91a3ba}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}select,input,button{padding:8px;background:#101d31;color:#fff;border:1px solid #31445f;border-radius:8px}button{background:#1769c2;font-weight:800}.row{display:grid;grid-template-columns:55px 1fr 85px 85px 105px 1fr;gap:8px;padding:9px;border-bottom:1px solid #26364d;align-items:center}.box,.progress{background:#0e192a;border:1px solid #26364d;border-radius:10px;overflow:hidden}.rank{font-weight:900;color:#ffd45c}.val{font-size:17px;font-weight:900}.err{color:#ff8b8b}.progress{display:none;padding:10px;margin:10px 0}.progress.on{display:block}.track{height:8px;background:#17243a;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#1769c2,#ffd45c);width:0;transition:width .25s}.spin{display:inline-block;width:13px;height:13px;border:2px solid #55708f;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:650px){.row{grid-template-columns:35px 1fr 65px}.hide{display:none}}</style></head><body><div class=w><h1>🏆 NFL Milestone Lab</h1><div class=muted>Find verified thresholds by week, season, or across a multi-year/career-style range.</div><div class=controls><select id=scope><option value=season>Season</option><option value=week>Single Week</option><option value=range>Year Range</option></select><select id=year></select><select id=endYear style="display:none"></select><select id=type><option value=2>Regular</option><option value=3>Postseason</option><option value=ALL>Reg + Post</option></select><select id=week style="display:none"></select><select id=metric><option value=passingYards>Passing Yards</option><option value=passingTouchdowns>Passing TDs</option><option value=rushingYards>Rushing Yards</option><option value=rushingTouchdowns>Rushing TDs</option><option value=receivingYards>Receiving Yards</option><option value=receptions>Catches</option><option value=receivingTouchdowns>Receiving TDs</option></select><input id=threshold type=number value=300 min=1><button id=go>Find Milestones</button></div><div id=progress class=progress><span class=spin></span> <span id=phase>Preparing…</span><div class=track><div id=fill class=fill></div></div></div><div id=status class=muted>Ready.</div><div id=out class=box style="margin-top:12px"></div></div><script>'use strict';const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl',E=x=>document.getElementById(x),scope=E('scope'),year=E('year'),endYear=E('endYear'),type=E('type'),week=E('week'),metric=E('metric'),threshold=E('threshold'),go=E('go'),status=E('status'),out=E('out'),progress=E('progress'),phase=E('phase'),fill=E('fill');for(let y=new Date().getFullYear();y>=1999;y--){year.add(new Option(y,y));endYear.add(new Option(y,y))}for(let w=1;w<=18;w++)week.add(new Option('Week '+w,w));const num=v=>Number(String(v??0).replace(/,/g,''))||0,norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');async function J(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return r.json()}function prog(t,n=0,d=1){progress.classList.add('on');phase.textContent=t;fill.style.width=`${Math.min(100,100*n/d)}%`}function catType(c){let l=c.labels||[],k=c.keys||[],s=[c.name,c.displayName,...l,...k].join(' ').toLowerCase();return s.includes('pass')?'passing':s.includes('rush')?'rushing':s.includes('receiv')||l.some(x=>norm(x)==='rec')?'receiving':'other'}function find(c,r,names){let l=c.labels||[],k=c.keys||[],st=r.stats||[];for(const z of names){let i=l.findIndex(x=>norm(x)===norm(z));if(i<0)i=k.findIndex(x=>norm(x)===norm(z));if(i>=0)return num(st[i])}return 0}function value(c,r,m){let k=catType(c);if(m==='passingYards'&&k==='passing')return find(c,r,['YDS','passingYards']);if(m==='passingTouchdowns'&&k==='passing')return find(c,r,['TD','passingTouchdowns']);if(m==='rushingYards'&&k==='rushing')return find(c,r,['YDS','rushingYards']);if(m==='rushingTouchdowns'&&k==='rushing')return find(c,r,['TD','rushingTouchdowns']);if(m==='receivingYards'&&k==='receiving')return find(c,r,['YDS','receivingYards']);if(m==='receptions'&&k==='receiving')return find(c,r,['REC','receptions']);if(m==='receivingTouchdowns'&&k==='receiving')return find(c,r,['TD','receivingTouchdowns']);return null}function weeks(y,t){return t===2?(y>=2021?18:17):5}async function events(y,t,only){let all=[],ws=only?[+only]:Array.from({length:weeks(y,t)},(_,i)=>i+1);for(let i=0;i<ws.length;i++){let w=ws[i];prog(`${y} ${t===2?'regular':'post'} week ${w}`,i,ws.length);let s=await J(`${B}/scoreboard?limit=100&dates=${y}&seasontype=${t}&week=${w}`);all.push(...(s.events||[]).filter(e=>e.status?.type?.completed&&+e.season?.year===y&&+e.season?.type===t).map(e=>({...e,__week:w,__type:t,__year:y}))}return all}go.onclick=async()=>{go.disabled=true;out.innerHTML='';try{let ys=scope.value==='range'?Array.from({length:Math.abs(+endYear.value-+year.value)+1},(_,i)=>Math.min(+year.value,+endYear.value)+i):[+year.value],types=type.value==='ALL'?[2,3]:[+type.value],gs=[];for(const y of ys)for(const t of types)gs.push(...await events(y,t,scope.value==='week'?week.value:null));gs=[...new Map(gs.map(e=>[e.id,e])).values()];let hits=new Map,fail=0;for(let d=0;d<gs.length;d++){let e=gs[d];prog(`Scanning game ${d+1}/${gs.length}`,d,gs.length);let s;try{s=await J(`${B}/summary?event=${e.id}`)}catch{fail++;continue}for(const b of s.boxscore?.players||[])for(const c of b.statistics||[])for(const r of c.athletes||[]){let v=value(c,r,metric.value);if(v==null||v<+threshold.value)continue;let id=String(r.athlete?.id||r.athlete?.displayName||''),key=`${e.id}|${id}|${metric.value}`,x={name:r.athlete?.displayName||'Unknown',team:b.team?.abbreviation||'',pos:r.athlete?.position?.abbreviation||'',v,date:String(e.date||'').slice(0,10),week:e.__week,seasonType:e.__type,year:e.__year,game:e.shortName||e.name||''},old=hits.get(key);if(!old||v>old.v)hits.set(key,x)}}let a=[...hits.values()].sort((a,b)=>b.v-a.v||b.year-a.year);out.innerHTML=a.map((x,i)=>`<div class=row><span class=rank>#${i+1}</span><b>${x.name}</b><span class=val>${x.v}</span><span class=hide>${x.team} ${x.pos}</span><span class=hide>${x.year} ${x.seasonType===3?'P':'W'}${x.week}</span><span class=hide>${x.game}</span></div>`).join('')||'<div style="padding:20px">No qualifying games.</div>';prog('Complete',1,1);status.textContent=`${a.length} qualifying performances • ${gs.length-fail}/${gs.length} games scanned${fail?` • ${fail} failures`:''}`;setTimeout(()=>progress.classList.remove('on'),700)}catch(e){status.innerHTML=`<span class=err>Failed: ${e.message}</span>`;progress.classList.remove('on')}finally{go.disabled=false}};scope.onchange=()=>{week.style.display=scope.value==='week'?'':'none';endYear.style.display=scope.value==='range'?'':'none'};metric.onchange=()=>threshold.value={passingYards:300,passingTouchdowns:3,rushingYards:100,rushingTouchdowns:2,receivingYards:100,receptions:10,receivingTouchdowns:2}[metric.value];</script></body></html>
