<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth Chart Lab</title><style>body{margin:0;background:#07101b;color:#fff;font:14px system-ui}.shell{max-width:1300px;margin:auto;padding:20px}.muted{color:#91a4bd}.error{color:#ff8d87}.ok{color:#7ee787}.tabs,.ctl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0}button,select,input{background:#132238;color:#fff;border:1px solid #345;border-radius:8px;padding:10px}button.active{background:#f4b400;color:#111;font-weight:800}.hero{display:flex;gap:14px;align-items:center;background:#0e1928;border:1px solid #263a55;border-radius:13px;padding:13px;margin:10px 0}.hero img{width:65px;height:65px;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.group{background:#0e1928;border:1px solid #263a55;border-radius:12px;overflow:hidden}.group h3{margin:0;padding:11px;background:#132238}.position{padding:10px;border-top:1px solid #263a55}.position>b{color:#ffd45c}.player{display:grid;grid-template-columns:30px 40px 1fr;gap:8px;align-items:center;padding:6px;margin-top:5px;background:#091421;border-radius:8px}.player img{width:38px;height:38px;border-radius:50%;object-fit:cover}.rank{text-align:center;font-weight:900}.empty{padding:20px;border:1px dashed #345;border-radius:10px;color:#91a4bd}.source{font-size:11px;margin:8px 0 14px}</style></head><body><main class="shell"><h1>Depth Chart Lab</h1><div class="muted">NFL true ESPN depth charts. Other leagues attempt ESPN depth data, then clearly labeled roster fallback.</div><div id="sports" class="tabs"></div><div class="ctl"><label>Team <select id="team"></select></label><input id="filter" placeholder="Filter player / position"><button id="reload">Reload</button></div><div id="status" class="muted"></div><div id="source" class="source muted"></div><div id="hero"></div><div id="out"></div></main><script>'use strict';const CFG={NFL:{s:'football',l:'nfl'},NBA:{s:'basketball',l:'nba'},MLB:{s:'baseball',l:'mlb'},NHL:{s:'hockey',l:'nhl'}};const NFL=[['22','ARI','Arizona Cardinals'],['1','ATL','Atlanta Falcons'],['33','BAL','Baltimore Ravens'],['2','BUF','Buffalo Bills'],['29','CAR','Carolina Panthers'],['3','CHI','Chicago Bears'],['4','CIN','Cincinnati Bengals'],['5','CLE','Cleveland Browns'],['6','DAL','Dallas Cowboys'],['7','DEN','Denver Broncos'],['8','DET','Detroit Lions'],['9','GB','Green Bay Packers'],['34','HOU','Houston Texans'],['11','IND','Indianapolis Colts'],['30','JAX','Jacksonville Jaguars'],['12','KC','Kansas City Chiefs'],['13','LV','Las Vegas Raiders'],['24','LAC','Los Angeles Chargers'],['14','LAR','Los Angeles Rams'],['15','MIA','Miami Dolphins'],['16','MIN','Minnesota Vikings'],['17','NE','New England Patriots'],['18','NO','New Orleans Saints'],['19','NYG','New York Giants'],['20','NYJ','New York Jets'],['21','PHI','Philadelphia Eagles'],['23','PIT','Pittsburgh Steelers'],['25','SF','San Francisco 49ers'],['26','SEA','Seattle Seahawks'],['27','TB','Tampa Bay Buccaneers'],['10','TEN','Tennessee Titans'],['28','WSH','Washington Commanders']].map(x=>({id:x[0],abbreviation:x[1],displayName:x[2],logos:[{href:`https://a.espncdn.com/i/teamlogos/nfl/500/${x[1].toLowerCase()}.png`}]}));const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let sport=localStorage.dcSport||'NFL',teams=[],model=null;async function api(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function extractTeams(j){return(j?.sports?.[0]?.leagues?.[0]?.teams||j?.teams||[]).map(x=>x.team||x).filter(x=>x?.id)}function dg(j){let cs=Array.isArray(j?.depthCharts)?j.depthCharts:Array.isArray(j?.items)?j.items:[];return cs.map(c=>{let ps=c.positions||{},arr=Array.isArray(ps)?ps:Object.values(ps);return{name:c.name||'Depth Chart',positions:arr.map(p=>({name:p?.position?.name||p?.name||'Position',abbr:p?.position?.abbreviation||'',items:Array.isArray(p?.athletes)?p.athletes:[]})).filter(p=>p.items.length)}}).filter(g=>g.positions.length)}function rg(j){let src=Array.isArray(j?.athletes)?j.athletes:Array.isArray(j?.items)?j.items:[],m=new Map;src.forEach(g=>{if(Array.isArray(g?.items))g.items.forEach(a=>{let n=g.position||g.name||'Roster';if(!m.has(n))m.set(n,[]);m.get(n).push(a)});else{let n=g?.position?.abbreviation||g?.position?.name||'Roster';if(!m.has(n))m.set(n,[]);m.get(n).push(g)}});return[...m].map(([name,items])=>({name,items}))}function ath(x){let a=x?.athlete||x||{};return{id:a.id||'',name:a.displayName||a.fullName||'Unknown',jersey:a.jersey||'',pos:a.position?.abbreviation||'',head:a.headshot?.href||'',rank:+(x.rank||0)}}function row(x,i,d){let a=ath(x),r=d?(a.rank||i+1):'',head=a.head||(a.id?`https://a.espncdn.com/i/headshots/${CFG[sport].l}/players/full/${a.id}.png`:'');return`<div class="player"><div class="rank">${d?r:'•'}</div><img src="${esc(head)}" onerror="this.style.opacity=.1"><div><b>${esc(a.name)}</b><div class="muted">${a.jersey?'#'+esc(a.jersey)+' · ':''}${esc(a.pos)}${d?' · '+(r===1?'Starter':'Depth '+r):''}</div></div></div>`}function render(){if(!model)return;let q=$('filter').value.toLowerCase();if(model.kind==='depth')$('out').innerHTML='<div class="grid">'+model.groups.map(g=>`<section class="group"><h3>${esc(g.name)}</h3>${g.positions.map(p=>{let a=p.items.filter(x=>!q||p.name.toLowerCase().includes(q)||ath(x).name.toLowerCase().includes(q));return a.length?`<div class="position"><b>${esc(p.abbr||p.name)}</b>${a.sort((x,y)=>(ath(x).rank||99)-(ath(y).rank||99)).map((x,i)=>row(x,i,true)).join('')}</div>`:''}).join('')}</section>`).join('')+'</div>';else $('out').innerHTML='<div class="grid">'+model.groups.map(g=>`<section class="group"><h3>${esc(g.name)}</h3><div class="position">${g.items.filter(x=>!q||ath(x).name.toLowerCase().includes(q)).map((x,i)=>row(x,i,false)).join('')}</div></section>`).join('')+'</div>'}function tabs(){$('sports').innerHTML=Object.keys(CFG).map(s=>`<button data-s="${s}" class="${s===sport?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.dcSport=sport;tabs();loadTeams()})}function setTeams(list,source){teams=list.sort((a,b)=>(a.displayName||'').localeCompare(b.displayName||''));$('team').innerHTML=teams.map(t=>`<option value="${t.id}">${esc(t.displayName)}</option>`).join('');let saved=localStorage.getItem('dcTeam:'+sport);if(saved&&teams.some(t=>String(t.id)===saved))$('team').value=saved;$('source').textContent=source;loadTeam()}async function loadTeams(){model=null;$('out').innerHTML='';$('hero').innerHTML='';$('status').textContent='Loading '+sport+' teams…';if(sport==='NFL'){setTeams(NFL,'Team list: built-in ESPN NFL IDs (avoids team-list request failure).');return}let c=CFG[sport];try{let j=await api(`https://site.api.espn.com/apis/site/v2/sports/${c.s}/${c.l}/teams?limit=100`),a=extractTeams(j);if(!a.length)throw Error('No teams returned');setTeams(a,'Team list: ESPN Site API.')}catch(e){$('status').innerHTML=`<span class="error">${sport} team list request failed: ${esc(e.message)}. NFL remains usable without this request.</span>`}}async function loadTeam(){let id=$('team').value;if(!id)return,c=CFG[sport],t=teams.find(x=>String(x.id)===id);localStorage.setItem('dcTeam:'+sport,id);$('hero').innerHTML=`<div class="hero"><img src="${esc(t?.logos?.[0]?.href||'')}"><div><h2>${esc(t?.displayName||'')}</h2><div class="muted">${sport}</div></div></div>`;$('status').textContent='Loading player data…';let depth=`https://site.api.espn.com/apis/site/v2/sports/${c.s}/${c.l}/teams/${id}/depthcharts`;try{let j=await api(depth),g=dg(j);if(g.length){model={kind:'depth',groups:g};$('status').innerHTML='<span class="ok">ESPN depth chart loaded.</span>';$('source').textContent='Depth source: '+depth;render();return}}catch(e){}try{let u=`https://site.api.espn.com/apis/site/v2/sports/${c.s}/${c.l}/teams/${id}/roster`,j=await api(u),g=rg(j);if(!g.length)throw Error('No roster players');model={kind:'roster',groups:g};$('status').textContent='No usable depth chart returned; showing ESPN roster by position.';$('source').textContent='Roster source: '+u;render()}catch(e){$('status').innerHTML=`<span class="error">Player load failed: ${esc(e.message)}</span>`}}$('team').onchange=loadTeam;$('reload').onclick=loadTeam;$('filter').oninput=render;tabs();loadTeams();</script></body></html>
