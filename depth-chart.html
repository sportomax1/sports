<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth Chart Lab</title><style>body{margin:0;background:#07101b;color:#fff;font:14px system-ui}.shell{max-width:1250px;margin:auto;padding:20px}button,select,input{background:#132238;color:#fff;border:1px solid #345;border-radius:8px;padding:10px;margin:3px}button.active{background:#f4b400;color:#111}.tabs{margin:10px 0}.hero,.box{background:#0e1928;border:1px solid #263a55;border-radius:12px;padding:12px;margin:10px 0}.hero{display:flex;align-items:center;gap:12px}.hero img{width:64px;height:64px;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.pos{background:#0e1928;border:1px solid #263a55;border-radius:12px;overflow:hidden}.pos h3{margin:0;padding:10px;background:#132238}.player{display:grid;grid-template-columns:28px 42px 1fr;align-items:center;gap:8px;padding:7px;border-top:1px solid #1c2c40}.player img{width:38px;height:38px;border-radius:50%;object-fit:cover}.rank{font-weight:900;text-align:center}.muted{color:#91a4bd}.error{color:#ff8d87}</style></head><body><main class="shell"><h1>Depth Chart Lab</h1><div class="muted">NFL depth charts; NBA, MLB and NHL positional rosters when true depth order is unavailable.</div><div id="sports" class="tabs"></div><select id="team"></select><input id="filter" placeholder="Filter player / position"><button id="reload">Reload</button><div id="status" class="muted"></div><div id="hero"></div><div id="out"></div></main><script>
const CFG={NFL:['football','nfl'],NBA:['basketball','nba'],MLB:['baseball','mlb'],NHL:['hockey','nhl']};const $=x=>document.getElementById(x);let sport=localStorage.dcSport||'NFL',teams=[],payload=null,isDepth=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();return j}
function renderSports(){$('sports').innerHTML=Object.keys(CFG).map(s=>`<button class="${s===sport?'active':''}" data-s="${s}">${s}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.dcSport=sport;renderSports();loadTeams()})}
function extractTeams(j){let a=j?.sports?.[0]?.leagues?.[0]?.teams||j?.teams||[];return a.map(x=>x.team||x).filter(x=>x&&x.id)}
async function loadTeams(){$('status').textContent='Loading '+sport+' teams…';$('out').innerHTML='';try{const [cat,lg]=CFG[sport];let j=await api(`https://site.api.espn.com/apis/site/v2/sports/${cat}/${lg}/teams?limit=100`);teams=extractTeams(j);if(!teams.length)throw new Error('No teams returned');teams.sort((a,b)=>(a.displayName||'').localeCompare(b.displayName||''));$('team').innerHTML=teams.map(t=>`<option value="${t.id}">${esc(t.displayName||t.name)}</option>`).join('');let save=localStorage.getItem('dcTeam'+sport);if(save&&teams.some(t=>String(t.id)===save))$('team').value=save;await loadTeam()}catch(e){$('status').innerHTML=`<span class="error">Team load failed: ${esc(e.message)}</span>`}}
function depthGroups(j){const out=[];for(const chart of (j?.depthCharts||[])){const ps=chart.positions||{};const arr=Array.isArray(ps)?ps:Object.values(ps);const positions=[];for(const p of arr){const athletes=Array.isArray(p?.athletes)?p.athletes:[];if(athletes.length)positions.push({name:p?.position?.name||p?.position?.abbreviation||'Position',abbr:p?.position?.abbreviation||'',items:athletes})}if(positions.length)out.push({name:chart.name||'Depth Chart',positions})}return out}
function rosterGroups(j){const groups=[];for(const g of (j?.athletes||[])){if(Array.isArray(g?.items)&&g.items.length)groups.push({name:g.position||g.name||g.abbreviation||'Roster',items:g.items})}if(groups.length)return groups;const map={};for(const a of (j?.items||[])){const k=a?.position?.abbreviation||a?.position?.name||'Roster';(map[k]??=[]).push(a)}return Object.entries(map).map(([name,items])=>({name,items}))}
function athlete(x){const a=x?.athlete||x||{};return{id:a.id||'',name:a.displayName||a.fullName||a.shortName||'Unknown',head:a.headshot?.href||a.headshot||'',jersey:a.jersey||'',pos:a.position?.abbreviation||a.position?.name||'',rank:Number(x?.rank)||0}}
function player(x,i,depth){const a=athlete(x),rank=depth?(a.rank||i+1):'';const head=a.head||(a.id?`https://a.espncdn.com/i/headshots/${CFG[sport][1]}/players/full/${a.id}.png`:'');return`<div class="player"><div class="rank">${depth?rank:'•'}</div><img src="${esc(head)}" onerror="this.style.opacity=.15"><div><b>${esc(a.name)}</b><div class="muted">${a.jersey?'#'+esc(a.jersey)+' · ':''}${esc(a.pos)}${depth?' · '+(rank===1?'Starter':'Depth '+rank):''}</div></div></div>`}
async function loadTeam(){const id=$('team').value;if(!id)return;localStorage.setItem('dcTeam'+sport,id);const t=teams.find(x=>String(x.id)===String(id));$('hero').innerHTML=`<div class="hero"><img src="${esc(t?.logos?.[0]?.href||'')}"><div><h2>${esc(t?.displayName||'')}</h2><div class="muted">${sport}</div></div></div>`;$('status').textContent='Loading player data…';const [cat,lg]=CFG[sport];try{if(sport==='NFL'){try{const d=await api(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/${id}/depthcharts`);if(depthGroups(d).length){payload=d;isDepth=true;render();$('status').textContent='NFL ESPN depth chart loaded.';return}}catch(e){console.warn(e)}}const r=await api(`https://site.api.espn.com/apis/site/v2/sports/${cat}/${lg}/teams/${id}/roster`);payload=r;isDepth=false;render();$('status').textContent=sport==='NFL'?'NFL roster fallback loaded.':sport+' positional roster loaded.'}catch(e){$('status').innerHTML=`<span class="error">Player data failed: ${esc(e.message)}</span>`}}
function render(){const q=$('filter').value.toLowerCase().trim();if(isDepth){const gs=depthGroups(payload);$('out').innerHTML=`<div class="grid">${gs.map(g=>`<section class="pos"><h3>${esc(g.name)}</h3>${g.positions.map(p=>{const a=p.items.filter(x=>!q||p.name.toLowerCase().includes(q)||athlete(x).name.toLowerCase().includes(q));return a.length?`<div class="box"><b>${esc(p.abbr||p.name)}</b>${a.sort((x,y)=>(athlete(x).rank||99)-(athlete(y).rank||99)).map((x,i)=>player(x,i,true)).join('')}</div>`:''}).join('')}</section>`).join('')}</div>`}else{const gs=rosterGroups(payload).map(g=>({...g,items:g.items.filter(x=>!q||g.name.toLowerCase().includes(q)||athlete(x).name.toLowerCase().includes(q))})).filter(g=>g.items.length);$('out').innerHTML=`<div class="grid">${gs.map(g=>`<section class="pos"><h3>${esc(g.name)}</h3>${g.items.map((x,i)=>player(x,i,false)).join('')}</section>`).join('')}</div>`}}
$('team').onchange=loadTeam;$('reload').onclick=loadTeam;$('filter').oninput=()=>payload&&render();renderSports();loadTeams();
</script></body></html>
