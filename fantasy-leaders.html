<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1220"><title>Fantasy Leaders | Sports Tools</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,Inter,system-ui,sans-serif;color-scheme:dark;--bg:#09111d;--card:#142135;--line:#293c53;--text:#f2f6fd;--muted:#9cb0c8;--accent:#56d7bb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;color:inherit}header{position:sticky;top:0;z-index:5;background:#09111df2;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.wrap{max-width:1050px;margin:auto;padding:14px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:23px;margin:0}small,.muted{color:var(--muted)}.controls{display:grid;gap:10px;margin-top:14px}.segments,.pills{display:flex;gap:5px;flex-wrap:wrap}.segments button,.pills button,.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}.segments button.active,.pills button.active{background:#195747;border-color:var(--accent);color:white}.nav{display:flex;align-items:center;gap:8px}.nav strong{flex:1;text-align:center;font-size:14px}.nav button{min-width:40px}.field{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px;min-width:0}.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.filters select{flex:1;min-width:130px}.status{font-size:13px;color:var(--muted);padding:12px 0}.list{display:grid;gap:8px;padding-bottom:80px}.player{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px}.player:active{transform:scale(.995)}.face{width:48px;height:48px;object-fit:contain;border-radius:50%;background:#26344a;flex-shrink:0}.logo{width:24px;height:24px;object-fit:contain}.identity{flex:1;min-width:0}.identity b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;margin-top:4px}.score{text-align:right;min-width:65px}.score strong{display:block;font-size:21px;font-variant-numeric:tabular-nums}.score small{font-size:10px}.sub{font-size:11px;color:var(--muted);margin-top:4px}.empty{text-align:center;padding:55px 12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:18px;background:#101d2d;color:var(--text);width:min(95vw,620px);max-height:88dvh;overflow:auto;padding:20px}dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.settingsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.settingsgrid label{display:grid;gap:5px;font-size:12px;color:var(--muted)}.settingsgrid input{width:100%}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--muted)}.tablewrap{overflow-x:auto}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.chip{padding:4px 7px;background:#243c50;border-radius:6px;font-size:11px}.warning{color:#ffd28b}@media(min-width:750px){.controls{grid-template-columns:1fr 1fr}.list{grid-template-columns:repeat(2,minmax(0,1fr))}.face{width:60px;height:60px}}@media(max-width:430px){.wrap{padding:12px}.segments button,.pills button{padding:8px 10px;font-size:12px}.player{gap:7px}.face{width:43px;height:43px}.logo{width:20px;height:20px}}
</style></head><body>
<header><div class="wrap"><div class="top"><div><h1>Fantasy Leaders</h1><small>NFL + NCAA football · Live player leaderboard</small></div><button class="btn" id="settingsBtn" aria-label="Scoring settings">⚙ Scoring</button></div><div class="controls"><div class="segments" id="leagues"><button data-value="nfl" class="active">NFL</button><button data-value="college-football">NCAA</button><button data-value="both">Both</button></div><div class="segments" id="modes"><button data-value="day">Day</button><button data-value="week" class="active">Week</button><button data-value="season">Season</button></div><div class="nav"><button class="btn" id="prev" aria-label="Previous period">‹</button><strong id="periodLabel">Loading…</strong><button class="btn" id="next" aria-label="Next period">›</button><input class="field" id="jump" type="date" aria-label="Jump to date"></div><div class="pills" id="positions"><button class="active" data-value="QB">QB</button><button class="active" data-value="RB">RB</button><button class="active" data-value="WR">WR</button><button class="active" data-value="TE">TE</button><button class="active" data-value="K">K</button></div></div></div></header>
<main class="wrap"><div class="filters"><select class="field" id="gameStatus"><option value="all">All games</option><option value="scheduled">Scheduled</option><option value="live">Live</option><option value="finished">Finished</option></select><select class="field" id="sort"><option value="points">Fantasy points ↓</option><option value="yards">Total yards ↓</option><option value="td">Total TDs ↓</option></select><input class="field" id="search" placeholder="Search player / team" aria-label="Search players" style="flex:2;min-width:150px"><button class="btn" id="refresh">↻</button></div><div class="status" id="status">Loading schedule…</div><div class="list" id="list"></div></main>
<dialog id="settings"><div class="modalhead"><h2>Fantasy scoring</h2><button class="btn" data-close="settings">✕</button></div><p class="muted">Custom values are stored on this device. Kicker scoring uses ESPN field-goal distance categories when available.</p><div class="row"><button class="btn" data-preset="standard">Standard</button><button class="btn" data-preset="half">Half PPR</button><button class="btn" data-preset="ppr">Full PPR</button></div><div class="settingsgrid" id="scoringFields"></div><p><button class="btn" id="saveSettings">Save & recalculate</button></p></dialog>
<dialog id="detail"><div class="modalhead"><h2 id="detailTitle">Player</h2><button class="btn" data-close="detail">✕</button></div><div id="detailBody"></div></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sports={nfl:'nfl','college-football':'college-football'};
const base='https://site.api.espn.com/apis/site/v2/sports/football/';
const defaultSc={passYds:0.04,passTd:4,interception:-2,rushYds:0.1,recYds:0.1,rec:0.5,rushTd:6,recTd:6,fumbles:-2,fg0:3,fg40:4,fg50:5,xp:1};
let scoring={...defaultSc};try{Object.assign(scoring,JSON.parse(localStorage.getItem('fantasy-leaders-scoring')||'{}'))}catch{}
let state={league:'nfl',mode:'week',date:new Date(),positions:new Set(['QB','RB','WR','TE','K']),status:'all',sort:'points',search:''};
let games=[],players=[],scheduleCache=new Map(),statsCache=new Map(),loadId=0;
const format=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const dateFrom=s=>{const d=new Date(s);return isNaN(+d)?new Date():d};
const year=d=>d.getFullYear();
const startWeek=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+5)%7));return x};
const weekEnd=d=>{const x=startWeek(d);x.setDate(x.getDate()+6);return x};
function interval(){let a=new Date(state.date),b=new Date(state.date);if(state.mode==='week'){a=startWeek(a);b=weekEnd(a)}if(state.mode==='season'){a=new Date(year(a),0,1);b=new Date(year(a),11,31)}a.setHours(0,0,0,0);b.setHours(23,59,59,999);return[a,b]}
function label(){const [a,b]=interval();$('periodLabel').textContent=state.mode==='day'?format(a):state.mode==='season'?String(year(a)):format(a)+' – '+format(b)}
const json=async(url)=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),14000);try{const r=await fetch(url,{signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}};
function statusGame(e){const s=e.status?.type||{};return s.completed?'finished':s.state==='in'?'live':'scheduled'}
function gameTime(e){return dateFrom(e.date)}
function parseGames(j,league){return(j.events||[]).map(e=>{const c=e.competitions?.[0]||{},cs=c.competitors||[];return{id:e.id,league,date:gameTime(e),status:statusGame(e),home:cs.find(x=>x.homeAway==='home')?.team||{},away:cs.find(x=>x.homeAway==='away')?.team||{},raw:e}})}
async function schedule(league,y){const key=league+':'+y;if(scheduleCache.has(key))return scheduleCache.get(key);
const ranges=league==='nfl'?[[y+'0801',y+'1231'],[(y+1)+'0101',(y+1)+'0301']]:[[y+'0801',y+'1231'],[(y+1)+'0101',(y+1)+'0301']];
const out=[];for(const [a,b] of ranges){try{const j=await json(base+league+'/scoreboard?dates='+a+'-'+b+'&limit=1000');out.push(...parseGames(j,league))}catch(e){if(!out.length&&a===ranges.at(-1)[0])throw e}}
const g=[...new Map(out.map(x=>[x.id,x])).values()];scheduleCache.set(key,g);return g}
async function selectedGames(){
const [start,end]=interval(),leagues=state.league==='both'?['nfl','college-football']:[state.league];
const dates=[];if(state.mode==='season'){const y=start.getFullYear();for(const league of leagues){for(let w=1;w<=(league==='nfl'?22:17);w++)dates.push({league,url:base+league+'/scoreboard?dates='+y+'&seasontype=2&week='+w+'&limit=500'})}}
else{for(const league of leagues){for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('');dates.push({league,url:base+league+'/scoreboard?dates='+date+'&limit=500'})}}}
const results=[];let failures=0;for(let i=0;i<dates.length;i+=8){const batch=await Promise.allSettled(dates.slice(i,i+8).map(async item=>parseGames(await json(item.url),item.league)));for(const x of batch){if(x.status==='fulfilled')results.push(...x.value);else failures++}}
const games=[...new Map(results.map(g=>[g.league+':'+g.id,g])).values()].filter(g=>g.date>=start&&g.date<=end);
return {games,errors:failures?[{reason:new Error(failures+' ESPN schedule requests failed')}]:[]}
}
const findNumber=(obj,keys)=>{for(const k of keys){if(obj[k]!==undefined&&obj[k]!==null){const n=Number(obj[k]);if(Number.isFinite(n))return n}}return 0};
function extractStats(raw){const r={};for(const group of raw||[]){const labels=group.labels||group.names||[];const values=group.stats||[];labels.forEach((label,i)=>{r[String(label).toLowerCase().replace(/[^a-z0-9]/g,'')]=values[i]})}return r}
function parseLine(groups){const s=extractStats(groups);const number=(...keys)=>findNumber(s,keys);const pair=v=>{const m=String(v||'').match(/^(\d+)\s*\/\s*(\d+)$/);return m?[+m[1],+m[2]]:[0,0]};
const pass=pair(s.catt||s.completionsattempts),rush=s.rushing||'',rec=s.receiving||'';
return{passYds:number('yds','passingyards','passyards'),passTd:number('td','passingtd','passingtds'),interception:number('int','interceptions'),rushYds:number('rushyds','rushingyards'),recYds:number('recyds','receivingyards'),rec:number('rec','receptions'),rushTd:number('rushingtd','rushtd'),recTd:number('receivingtd','rectd'),fumbles:number('fumbleslost','fumlost'),fg0:number('fg0','fieldgoalsmade'),fg40:number('fg40'),fg50:number('fg50'),xp:number('xp','extrapointsmade'),raw:s}}
function athleteRows(box,g){const out=[];const sections=box.boxscore?.players||[];for(const team of sections){for(const section of team.statistics||[]){const labels=section.labels||[];const keys=section.keys||[];const name=(section.name||'').toLowerCase();for(const a of section.athletes||[]){const values=a.stats||[];const raw={};labels.forEach((l,i)=>raw[String(l).toLowerCase().replace(/[^a-z0-9]/g,'')]=values[i]);keys.forEach((l,i)=>raw[String(l).toLowerCase().replace(/[^a-z0-9]/g,'')]=values[i]);const n=(...k)=>findNumber(raw,k),p=v=>{const m=String(v||'').match(/^(\d+)\s*\/\s*(\d+)$/);return m?[+m[1],+m[2]]:[0,0]};
let line={passYds:0,passTd:0,interception:0,rushYds:0,recYds:0,rec:0,rushTd:0,recTd:0,fumbles:0,fg0:0,fg40:0,fg50:0,xp:0};
if(name.includes('pass')){line.passYds=n('yds','passingyards');line.passTd=n('td','passingtds');line.interception=n('int');}
else if(name.includes('rush')){line.rushYds=n('yds','rushingyards');line.rushTd=n('td');}
else if(name.includes('receiv')){line.recYds=n('yds','receivingyards');line.rec=n('rec');line.recTd=n('td');}
else if(name.includes('kick')){line.fg0=n('fg','fgm','fieldgoalsmade');if(!line.fg0)line.fg0=p(raw.fg||raw.fgmadeattempted)[0];line.xp=n('xp','xpm');if(!line.xp)line.xp=p(raw.xp||raw.xpmadeattempted)[0];}
else continue;
const athlete=a.athlete||{},id=String(athlete.id||athlete.uid||athlete.displayName||'');if(!id)continue;
const pos=(athlete.position?.abbreviation||athlete.position?.name||'').toUpperCase();const position=pos|| (name.includes('kick')?'K':name.includes('pass')?'QB':name.includes('rush')?'RB':name.includes('receiv')?'WR':'');
out.push({id,name:athlete.displayName||athlete.fullName||'Unknown',position,head:athlete.headshot?.href||'',team:team.team||{},game:g,line});}}}return out}
async function gamePlayers(g){const key=g.league+':'+g.id;if(statsCache.has(key)&&g.status==='finished')return statsCache.get(key);const j=await json(base+g.league+'/summary?event='+encodeURIComponent(g.id));const rows=athleteRows(j,g);if(g.status==='finished')statsCache.set(key,rows);return rows}
function pts(l){return l.passYds*scoring.passYds+l.passTd*scoring.passTd+l.interception*scoring.interception+l.rushYds*scoring.rushYds+l.recYds*scoring.recYds+l.rec*scoring.rec+l.rushTd*scoring.rushTd+l.recTd*scoring.recTd+l.fumbles*scoring.fumbles+l.fg0*scoring.fg0+l.fg40*scoring.fg40+l.fg50*scoring.fg50+l.xp*scoring.xp}
function aggregate(rows){const map=new Map();for(const r of rows){const key=r.game.league+':'+r.id+':'+r.game.id;let x=map.get(key);if(!x){x={...r,line:{...r.line}};map.set(key,x)}else{for(const k of Object.keys(r.line))x.line[k]+=(r.line[k]||0);if(!x.position&&r.position)x.position=r.position}}
const combined=new Map();for(const r of map.values()){const key=r.game.league+':'+r.id;let x=combined.get(key);if(!x){x={...r,line:{...r.line},logs:[r]};combined.set(key,x)}else{for(const k of Object.keys(r.line))x.line[k]+=(r.line[k]||0);x.logs.push(r);if(r.game.date>x.game.date)x.game=r.game}}
return [...combined.values()].map(x=>({...x,points:pts(x.line),yards:x.line.passYds+x.line.rushYds+x.line.recYds,td:x.line.passTd+x.line.rushTd+x.line.recTd}))}
function logo(team){return team.logo||team.logos?.[0]?.href||''}
function opponent(p){const t=String(p.team.id||'');return String(p.game.home.id)===t?p.game.away:p.game.home}
function img(url,cls){return url?'<img class="'+cls+'" src="'+esc(url)+'" loading="lazy" alt="">':'<span class="'+cls+'"></span>'}
function render(){let arr=players.filter(p=>state.positions.has(p.position)&&(!state.search||[p.name,p.team.displayName,p.team.abbreviation].join(' ').toLowerCase().includes(state.search)));arr.sort((a,b)=>b[state.sort]-a[state.sort]);$('status').textContent=arr.length+' players · '+games.length+' games · '+(state.mode==='season'?'Season totals':'Period totals')+(state.status==='scheduled'?' · Scheduled games have no actual stats':'');$('list').innerHTML=arr.length?arr.map((p,i)=>'<button class="player" data-i="'+i+'">'+img(p.head,'face')+'<div class="identity"><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.position)+' · '+img(logo(p.team),'logo')+esc(p.team.abbreviation||'')+' vs '+img(logo(opponent(p)),'logo')+esc(opponent(p).abbreviation||'')+'</div><div class="sub">'+Math.round(p.yards)+' YDS · '+p.td+' TD · '+p.logs.length+' game(s)</div></div><div class="score"><strong>'+p.points.toFixed(1)+'</strong><small>FPTS</small></div></button>').join(''):'<div class="empty">No player statistics found for these filters.<br>Try a finished game, another date, or different positions.</div>';document.querySelectorAll('.player').forEach((b)=>b.onclick=()=>showPlayer(arr[+b.dataset.i]))}
function showPlayer(p){$('detailTitle').textContent=p.name;const logs=[...p.logs].sort((a,b)=>b.game.date-a.game.date);$('detailBody').innerHTML='<p class="muted">'+esc(p.position)+' · '+esc(p.team.displayName||'')+' · '+p.points.toFixed(1)+' fantasy points in selected period</p><h3>Game-by-game log</h3><div class="tablewrap"><table><thead><tr><th>Date / Opponent</th><th>Pass</th><th>Rush</th><th>Rec</th><th>TD</th><th>FP</th></tr></thead><tbody>'+logs.map(x=>'<tr><td>'+esc(format(x.game.date))+' · '+esc(opponent(x).abbreviation||'')+'</td><td>'+x.line.passYds+'</td><td>'+x.line.rushYds+'</td><td>'+x.line.recYds+'</td><td>'+x.line.passTd+x.line.rushTd+x.line.recTd+'</td><td>'+pts(x.line).toFixed(1)+'</td></tr>').join('')+'</tbody></table></div><p class="muted">Season and career browsing: change the year using the main date picker. This panel shows game logs for the selected period.</p>';$('detail').showModal()}
async function load(){const token=++loadId;label();$('status').textContent='Loading schedules…';$('list').innerHTML='';try{const r=await selectedGames();if(token!==loadId)return;games=r.games.filter(g=>state.status==='all'||g.status===state.status);if(!games.length){players=[];render();$('status').textContent=r.errors.length?'Schedule request failed: '+r.errors[0].reason.message:'No games in this period';return}const playable=games.filter(g=>g.status!=='scheduled');$('status').textContent='Loading '+playable.length+' game box scores…';const results=[];let failed=0;for(let i=0;i<playable.length;i+=6){const batch=await Promise.allSettled(playable.slice(i,i+6).map(gamePlayers));if(token!==loadId)return;for(const x of batch){if(x.status==='fulfilled')results.push(...x.value);else failed++}$('status').textContent='Loaded '+Math.min(i+6,playable.length)+' / '+playable.length+' games…'}players=aggregate(results);render();if(failed)$('status').textContent+=' · '+failed+' box scores unavailable';if(r.errors.length)$('status').textContent+=' · '+r.errors.length+' schedule requests failed'}catch(e){if(token===loadId){$('status').textContent='Data unavailable: '+e.message;$('list').innerHTML='<div class="empty">Try another date or refresh. ESPN endpoints can be temporarily unavailable or block browser requests.</div>'}}}
function activate(container,key,val){document.querySelectorAll('#'+container+' button').forEach(b=>b.classList.toggle('active',b.dataset.value===val))}
$('leagues').onclick=e=>{const b=e.target.closest('button');if(!b)return;state.league=b.dataset.value;activate('leagues','league',state.league);load()};
$('modes').onclick=e=>{const b=e.target.closest('button');if(!b)return;state.mode=b.dataset.value;activate('modes','mode',state.mode);load()};
$('positions').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=b.dataset.value;state.positions.has(p)?state.positions.delete(p):state.positions.add(p);b.classList.toggle('active');render()};
$('jump').value=iso(state.date);$('jump').onchange=e=>{if(!e.target.value)return;state.date=new Date(e.target.value+'T12:00:00');load()};
async function move(direction){let d=new Date(state.date);for(let n=0;n<20;n++){if(state.mode==='day')d.setDate(d.getDate()+direction);else if(state.mode==='week')d.setDate(d.getDate()+7*direction);else d.setFullYear(d.getFullYear()+direction);const[a,b]=(()=>{const saved=state.date;state.date=d;const result=interval();state.date=saved;return result})();try{const leagues=state.league==='both'?['nfl','college-football']:[state.league];const results=await Promise.allSettled(leagues.flatMap(l=>[year(d)-1,year(d)].map(y=>schedule(l,y))));if(results.some(x=>x.status==='fulfilled'&&x.value.some(g=>g.date>=a&&g.date<=b))){state.date=new Date(d);$('jump').value=iso(d);load();return}}catch(e){break}}$('status').textContent='No additional game periods found in the available schedule.'}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
$('gameStatus').onchange=e=>{state.status=e.target.value;load()};$('sort').onchange=e=>{state.sort=e.target.value;render()};$('search').oninput=e=>{state.search=e.target.value.toLowerCase().trim();render()};$('refresh').onclick=()=>{scheduleCache.clear();statsCache.clear();load()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());$('settingsBtn').onclick=()=>$('settings').showModal();
const labels={passYds:'Passing yards / point',passTd:'Passing TD',interception:'Interception',rushYds:'Rushing yards / point',recYds:'Receiving yards / point',rec:'Reception',rushTd:'Rushing TD',recTd:'Receiving TD',fumbles:'Fumble lost',fg0:'Field goal',fg40:'FG 40–49 bonus',fg50:'FG 50+ bonus',xp:'Extra point'};
function fields(){$('scoringFields').innerHTML=Object.keys(defaultSc).map(k=>'<label>'+labels[k]+'<input class="field" data-key="'+k+'" type="number" step="any" value="'+scoring[k]+'"></label>').join('')}
fields();document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{scoring={...defaultSc,rec:b.dataset.preset==='ppr'?1:b.dataset.preset==='half'?.5:0};fields()});
$('saveSettings').onclick=()=>{document.querySelectorAll('[data-key]').forEach(el=>{const n=Number(el.value);if(Number.isFinite(n))scoring[el.dataset.key]=n});localStorage.setItem('fantasy-leaders-scoring',JSON.stringify(scoring));players=players.map(p=>({...p,points:pts(p.line)}));$('settings').close();render()};
load();
})();
</script></body></html>
