<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Matchup Edge | Sports</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#141e2d;--line:#2a3a4e;--text:#f4f7fc;--muted:#9aaac0;--a:#6bb7e7;--b:#e8af70;--good:#73d5ae}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:12px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:7px 8px 28px}header{position:sticky;top:0;background:#0b1220f5;z-index:5;padding:5px 0 7px;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;gap:8px;justify-content:space-between}.top h1{font-size:17px;letter-spacing:-.4px;margin:0;white-space:nowrap}.leagues{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:7px}.leagues button,.ctrl button,.ctrl select,.ctrl input{background:#192638;border:1px solid var(--line);border-radius:7px;color:var(--text);padding:6px 9px;white-space:nowrap}.leagues button img{width:15px;height:15px;object-fit:contain;vertical-align:middle;margin-right:4px}.leagues button.on{background:#dce9f8;color:#102035;font-weight:800}.ctrl{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:6px}.ctrl input{width:118px;min-width:0}.ctrl select{max-width:105px}.ctrl .spacer{flex:1}.ctrl{flex-wrap:nowrap}.ctrl button{flex:0 0 30px;padding:6px 5px}.ctrl input{flex:1 1 112px;width:0;min-width:95px}.ctrl select{flex:1 1 76px;min-width:0;width:0;padding:6px 3px}.ctrl #refresh{flex:0 0 30px}.status{color:var(--muted);font-size:10px;min-height:16px;padding:4px 1px}.games{display:grid;gap:5px}.game{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 9px;min-height:111px}.gamehead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}.gamehead small{color:var(--muted);font-size:10px}.teams{display:grid;grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr);align-items:center;gap:6px}.team{display:flex;align-items:center;gap:5px;min-width:0}.team:last-child{justify-content:flex-end}.team img{width:22px;height:22px;object-fit:contain}.team strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vs{text-align:center;color:var(--muted);font-size:9px}.yardmetrics{margin-top:6px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.yardmetrics .metric{min-width:0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}.metric{min-width:0}.metriclabel{display:flex;justify-content:space-between;gap:4px;color:var(--muted);font-size:9px;margin-bottom:2px}.track{display:flex;height:7px;border-radius:5px;background:#263448;overflow:hidden;gap:2px}.track span{height:100%;display:block}.track .away{background:var(--a)}.track .home{background:var(--b)}.pick{font-size:10px;font-weight:800;color:var(--good)}.pick.wait{color:var(--muted)}.details{margin-top:5px;display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:9px}.details button{background:none;border:0;color:#a6d6f8;padding:0;font-size:10px}.history{display:none;margin-top:7px;border-top:1px solid var(--line);padding-top:7px;line-height:1.8}.game.expanded .history{display:block}.histrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.histrow div{min-width:0}.histrow p{margin:2px 0;color:#b9c8da}.error{color:#ff9999}.empty{padding:30px;text-align:center;color:var(--muted)}@media(min-width:800px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}.game{min-height:130px;padding:11px}.team strong{font-size:14px}.team img{width:30px;height:30px}}@media(max-width:390px){.ctrl{gap:3px}.ctrl button{flex-basis:26px}.ctrl #refresh{flex-basis:26px}.ctrl input{min-width:90px}.ctrl select{font-size:11px}.top h1{font-size:15px}.leagues button{padding:5px 7px}.game{padding:6px 7px;min-height:105px}.team strong{font-size:11px}}
.comparison{margin-top:7px;border-top:1px solid #26364a;padding-top:5px}.comparehead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;color:#8294ad;font-size:9px;font-weight:700;margin-bottom:3px}.comparehead span:last-child{text-align:right}.compare{display:grid;grid-template-columns:49px minmax(0,1fr) 49px;gap:7px;align-items:center;margin:4px 0}.compare .num{font-variant-numeric:tabular-nums;font-size:12px;font-weight:750;color:#cbd7e6}.compare .num:last-child{text-align:right}.compare .num.better{color:#91e0bb}.compare .middle{min-width:0;text-align:center}.compare .middle label{display:block;color:#aebdd0;font-size:10px;margin-bottom:2px}.compare .mini{height:5px;display:flex;gap:2px;background:#233146;border-radius:4px;overflow:hidden}.compare .mini i{display:block;height:100%;background:#69aee0}.compare .mini i:last-child{background:#e5ae74}.extra{display:none;margin-top:5px;padding-top:5px;border-top:1px dashed #314055}.game.expanded .extra{display:block}.explain{font-size:9px;color:#8498b1;margin-top:5px}.details{margin-top:6px}.details span{font-size:10px}.pick{font-size:11px}.game{padding:8px 10px}.games{gap:6px}.comparehead strong{color:#b8c8db}.top h1{font-size:16px}.status{font-size:10px}.team strong{font-size:12px}.league-symbol{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:3px;background:#dce7f7;color:#243650;font-size:7px;font-weight:900;margin-right:4px}.leagues button.on .league-symbol{background:#203247;color:#fff}@media(min-width:800px){.compare{grid-template-columns:65px minmax(0,1fr) 65px}}</style></head><body><main class="shell"><header><div class="top"><h1>Matchup Edge</h1><span style="display:flex;gap:10px"><a href="./football-weather.html" style="color:#a8cdec;text-decoration:none;font-size:10px">Weather ↗</a><a href="./index.html" style="color:#9aaac0;text-decoration:none;font-size:10px">Tools ↗</a></span></div><nav class="leagues" id="leagues" aria-label="League"></nav><div class="ctrl"><button id="prev" aria-label="Previous day">‹</button><input id="date" type="date" aria-label="Schedule date"><button id="next" aria-label="Next day">›</button><select id="window" aria-label="History sample"><option value="3">Last 3</option><option value="5" selected>Last 5</option><option value="10">Last 10</option><option value="99">Season</option></select><select id="sort" aria-label="Sort games"><option value="time">Time</option><option value="edge">Largest edge</option><option value="total">Most scoring</option></select><button id="refresh" title="Refresh cached data">↻</button></div></header><div id="status" class="status"></div><section class="games" id="games"></section></main>
<script>
(()=>{'use strict';
const L=[{id:'ncaaf',sport:'football',slug:'college-football',groups:'80'},{id:'nfl',sport:'football',slug:'nfl'},{id:'nba',sport:'basketball',slug:'nba'},{id:'ncaam',sport:'basketball',slug:'mens-college-basketball',groups:'50'},{id:'mlb',sport:'baseball',slug:'mlb'},{id:'nhl',sport:'hockey',slug:'nhl'}],$=id=>document.getElementById(id);
const state={league:L[0],date:new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),window:5,rows:[],token:0};
const memory=new Map(),pending=new Map();let dbPromise;
function db(){return dbPromise??=new Promise(resolve=>{try{const r=indexedDB.open('matchup-edge-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('json');r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)}catch{resolve(null)}})}
async function readCache(k){if(memory.has(k))return memory.get(k);let d=await db();if(!d)return null;return new Promise(resolve=>{let t=d.transaction('json','readonly').objectStore('json').get(k);t.onsuccess=()=>{if(t.result)memory.set(k,t.result);resolve(t.result||null)};t.onerror=()=>resolve(null)})}
async function saveCache(k,v){memory.set(k,v);let d=await db();if(d){try{d.transaction('json','readwrite').objectStore('json').put(v,k)}catch{}}}
async function api(url,ttl=3600000){if(pending.has(url))return pending.get(url);let p=(async()=>{let c=await readCache(url);if(c&&Date.now()-c.time<ttl)return c.value;try{let r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);let v=await r.json();await saveCache(url,{time:Date.now(),value:v});return v}catch(e){if(c)return c.value;throw e}})();pending.set(url,p);try{return await p}finally{pending.delete(url)}}
const base=l=>'https://site.api.espn.com/apis/site/v2/sports/'+l.sport+'/'+l.slug;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const score=c=>{let raw=c?.score;let n=Number(raw?.value??raw?.displayValue??raw?.score??raw);return Number.isFinite(n)?n:null};
const teamId=c=>String(c?.team?.id||'');
const name=c=>c?.team?.shortDisplayName||c?.team?.abbreviation||c?.team?.displayName||'Unknown';
const logo=c=>c?.team?.logo||c?.team?.logos?.[0]?.href||'';
const getSides=ev=>{let c=ev?.competitions?.[0]?.competitors||[];return[c.find(x=>x.homeAway==='away')||c[0],c.find(x=>x.homeAway==='home')||c[1]]};
function scoreEvents(events,id,cutoff){return(events||[]).filter(ev=>(ev.status?.type?.completed||ev.competitions?.[0]?.status?.type?.completed||ev.status?.type?.state==='post')&&new Date(ev.date)<cutoff).map(ev=>{let [a,b]=getSides(ev);if(!a||!b)return null;let mine=teamId(a)===id?a:teamId(b)===id?b:null,opp=mine===a?b:a;if(!mine||score(mine)===null||score(opp)===null)return null;return{date:ev.date,for:score(mine),against:score(opp),opponent:name(opp),id:ev.id,teamId:id}}).filter(Boolean).sort((a,b)=>new Date(b.date)-new Date(a.date))}
async function history(l,id,cutoff,n){let year=cutoff.getFullYear(),years=[year,year-1];let lists=await Promise.all(years.map(async y=>{for(let suffix of ['?season='+y,'?season='+y+'&seasontype=2']){try{let j=await api(base(l)+'/teams/'+id+'/schedule'+suffix,86400000);if(j.events?.length)return j.events}catch{}}return[]}));let games=scoreEvents(lists.flat(),id,cutoff),seen=new Set();games=games.filter(g=>{if(seen.has(g.id))return false;seen.add(g.id);return true});if(games.length>=Math.min(n,3))return games.slice(0,n);
// Fallback: ESPN's team schedule may omit completed scores or return partial schedules.
// Search recent league scoreboards, whose completed-game score fields are more consistent.
let found=[...games],days=l.sport==='football'?140:55,seenDays=0;for(let offset=1;offset<=days&&found.length<n;offset++){let d=new Date(cutoff);d.setDate(d.getDate()-offset);let date=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');try{let j=await api(base(l)+'/scoreboard?dates='+date+'&limit=500'+(l.groups?'&groups='+l.groups:''),86400000);let more=scoreEvents(j.events||[],id,cutoff);for(let g of more){if(!seen.has(g.id)){seen.add(g.id);found.push(g)}}}catch{}if(++seenDays>=days)break}return found.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,n)}

async function addYards(l,games){if(l.sport!=='football')return games;return Promise.all(games.map(async g=>{try{let j=await api(base(l)+'/summary?event='+encodeURIComponent(g.id),86400000),t=(j.boxscore?.teams||[]).find(x=>String(x.team?.id)===String(g.teamId));if(!t)return g;let stats=t.statistics||[];let other=(j.boxscore?.teams||[]).find(x=>String(x.team?.id)!==String(g.teamId));function val(names,items=stats){let x=items.find(z=>names.includes(String(z.name||z.label||'').toLowerCase()));let m=String(x?.displayValue??x?.value??'').match(/\d+(?:\.\d+)?/);return m?+m[0]:null}let pass=val(['netpassingyards','passingyards','net passing yards','passing yards']),rush=val(['rushingyards','rushing yards']),yards=val(['totalyards','total yards']);let os=other?.statistics||[],allowed=val(['totalyards','total yards'],os),passAllowed=val(['netpassingyards','passingyards','net passing yards','passing yards'],os),rushAllowed=val(['rushingyards','rushing yards'],os);return {...g,yards:yards??(pass!=null&&rush!=null?pass+rush:null),pass,rush,allowed:allowed??(passAllowed!=null&&rushAllowed!=null?passAllowed+rushAllowed:null),passAllowed,rushAllowed}}catch{return g}}))}
const avg=(xs,k)=>xs.length?xs.reduce((s,x)=>s+x[k],0)/xs.length:null;
function fixed(v){return v==null?'—':v.toFixed(1)}
function edge(a,b){if(a.pf==null||a.pa==null||b.pf==null||b.pa==null)return null;return ((a.pf+b.pa)-(b.pf+a.pa))/2}
function comparison(label,x,y,lower=false){let valid=x!=null&&y!=null,m=Math.max(x||0,y||0,1),leftBetter=valid&&(lower?x<y:x>y),rightBetter=valid&&(lower?y<x:y>x);return '<div class="compare"><span class="num '+(leftBetter?'better':'')+'">'+fixed(x)+'</span><div class="middle"><label>'+label+'</label><div class="mini"><i style="width:'+(x==null?0:100*x/m)+'%"></i><i style="width:'+(y==null?0:100*y/m)+'%"></i></div></div><span class="num '+(rightBetter?'better':'')+'">'+fixed(y)+'</span></div>'}
function card(r,i){let a=r.a,b=r.b,A=r.A,B=r.B,d=r.edge,football=state.league.sport==='football',unit=state.league.id==='mlb'?'Runs':state.league.id==='nhl'?'Goals':'Points';let winner=d==null?'No scoring estimate':Math.abs(d)<.05?'Even matchup':(d>0?name(a):name(b))+' by '+Math.abs(d).toFixed(1)+' pts';let logoA=logo(a),logoB=logo(b);return '<article class="game" data-i="'+i+'"><div class="gamehead"><small>'+esc(new Date(r.ev.date).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}))+' · '+esc(state.league.id.toUpperCase())+'</small><span class="pick '+(d==null?'wait':'')+'">'+esc(winner)+'</span></div><div class="teams"><div class="team">'+(logoA?'<img loading="lazy" src="'+esc(logoA)+'" alt="">':'')+'<strong>'+esc(name(a))+'</strong></div><div class="vs">AT</div><div class="team"><strong>'+esc(name(b))+'</strong>'+(logoB?'<img loading="lazy" src="'+esc(logoB)+'" alt="">':'')+'</div></div><div class="comparison"><div class="comparehead"><span>Away</span><strong>PER GAME · LAST '+Math.min(A.games.length,B.games.length)+'</strong><span>Home</span></div>'+comparison(unit+' scored',A.pf,B.pf)+comparison(unit+' allowed',A.pa,B.pa,true)+(football?comparison('Yards gained',A.yards,B.yards)+comparison('Yards allowed',A.allowed,B.allowed,true):'')+'</div>'+(football?'<div class="extra">'+comparison('Pass gained',A.pass,B.pass)+comparison('Pass allowed',A.passAllowed,B.passAllowed,true)+comparison('Rush gained',A.rush,B.rush)+comparison('Rush allowed',A.rushAllowed,B.rushAllowed,true)+'</div>':'')+'<div class="details"><span>'+esc(football?'Green = stronger offense / fewer yards allowed':'Green = more scored / fewer allowed')+'</span><button data-expand="'+i+'">'+(football?'Pass / Rush + History ▾':'Game history ▾')+'</button></div><div class="history"><div class="histrow">'+[A,B].map((t,j)=>'<div><b>'+esc(name(j?b:a))+'</b><p>'+t.games.map(g=>esc(g.opponent)+' · '+g.for+'–'+g.against).join('<br>')||'No completed games'+'</p></div>').join('')+'</div><div class="explain">Scoring estimate = average of each team\'s scoring offense and opposing defense; yardage is not included in the estimate.</div></div></article>'}
function render(){let rows=[...state.rows];if($('sort').value==='edge')rows.sort((a,b)=>Math.abs(b.edge||0)-Math.abs(a.edge||0));if($('sort').value==='total')rows.sort((a,b)=>(b.A.pf||0)+(b.B.pf||0)-(a.A.pf||0)-(a.B.pf||0));$('games').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">No scheduled games on this date.</div>';let n=rows.filter(r=>r.edge!=null).length;$('status').textContent=rows.length+' matchups · '+n+' with projections · based on prior completed games, not records'}
async function load(){let token=++state.token,l=state.league;state.rows=[];$('games').innerHTML='';$('status').textContent='Loading schedule…';let u=base(l)+'/scoreboard?dates='+state.date.replaceAll('-','')+'&limit=500'+(l.groups?'&groups='+l.groups:'');try{let j=await api(u,300000);if(token!==state.token)return;let events=(j.events||[]).filter(e=>getSides(e).every(Boolean));$('status').textContent='Analyzing '+events.length+' matchups…';let cutoff=new Date(state.date+'T00:00:00');let ids=[...new Set(events.flatMap(e=>getSides(e).map(teamId)))];let histories=new Map();let next=0;async function worker(){while(next<ids.length){let id=ids[next++];let games=await addYards(l,await history(l,id,cutoff,state.window));histories.set(id,{games,pf:avg(games,'for'),pa:avg(games,'against'),yards:avg(games.filter(g=>g.yards!=null),'yards'),pass:avg(games.filter(g=>g.pass!=null),'pass'),rush:avg(games.filter(g=>g.rush!=null),'rush'),allowed:avg(games.filter(g=>g.allowed!=null),'allowed'),passAllowed:avg(games.filter(g=>g.passAllowed!=null),'passAllowed'),rushAllowed:avg(games.filter(g=>g.rushAllowed!=null),'rushAllowed')});if(token!==state.token)return}}await Promise.all(Array.from({length:Math.min(12,ids.length)},worker));if(token!==state.token)return;state.rows=events.map(ev=>{let[a,b]=getSides(ev),A=histories.get(teamId(a))||{games:[]},B=histories.get(teamId(b))||{games:[]};return{ev,a,b,A,B,edge:edge(A,B)}});render()}catch(e){if(token===state.token){$('status').innerHTML='<span class="error">'+esc(e.message)+'</span>'; $('games').innerHTML='<div class="empty">Unable to load schedule. Try another date or refresh.</div>'}}}
$('leagues').innerHTML=L.map(l=>'<button data-league="'+l.id+'" class="'+(l.id===state.league.id?'on':'')+'"><img alt="" src="'+(l.id.startsWith('ncaa')?'https://a.espncdn.com/i/teamlogos/leagues/500/ncaa.png':'https://a.espncdn.com/i/teamlogos/leagues/500/'+l.id+'.png')+'" onerror="this.style.display=\'none\'">'+l.id.toUpperCase()+'</button>').join('');$('date').value=state.date;
$('leagues').onclick=e=>{let b=e.target.closest('[data-league]');if(!b)return;state.league=L.find(l=>l.id===b.dataset.league);$('leagues').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));load()};
$('date').onchange=e=>{state.date=e.target.value;load()};for(let [id,n] of [['prev',-1],['next',1]])$(id).onclick=()=>{let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()+n);state.date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');$('date').value=state.date;load()};
$('window').onchange=e=>{state.window=+e.target.value;load()};$('sort').onchange=render;$('refresh').onclick=()=>{memory.clear();load()};
$('games').onclick=e=>{let b=e.target.closest('[data-expand]');if(!b)return;let card=b.closest('.game');card.classList.toggle('expanded');b.textContent=card.classList.contains('expanded')?'Less ▴':(state.league.sport==='football'?'Pass / Rush + History ▾':'Game history ▾')};
load();
})();
</script></body></html>
