<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Milestone Lab</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui}.w{max-width:1200px;margin:auto;padding:18px}.muted{color:#91a3ba}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}select,input,button{padding:8px;background:#101d31;color:#fff;border:1px solid #31445f;border-radius:8px}button{background:#1769c2;font-weight:800}.row{display:grid;grid-template-columns:55px 1fr 100px 110px 90px;gap:8px;padding:9px;border-bottom:1px solid #26364d;align-items:center}.box{background:#0e192a;border:1px solid #26364d;border-radius:10px;overflow:hidden}.rank{font-weight:900;color:#ffd45c}.val{font-size:17px;font-weight:900}@media(max-width:650px){.row{grid-template-columns:35px 1fr 75px}.hide{display:none}}</style></head><body><div class=w><h1>🏆 NFL Milestone Lab</h1><div class=muted>Find every single-game threshold performance in a season.</div><div class=controls><select id=year></select><select id=metric><option value="passingYards">Passing Yards</option><option value="passingTouchdowns">Passing TDs</option><option value="rushingYards">Rushing Yards</option><option value="rushingTouchdowns">Rushing TDs</option><option value="receivingYards">Receiving Yards</option><option value="receptions">Catches</option><option value="receivingTouchdowns">Receiving TDs</option></select><input id=threshold type=number value=300 min=1><button id=go>Find Milestones</button></div><div id=status class=muted>Ready.</div><div id=out class=box style="margin-top:12px"></div></div><script>const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl';for(let y=new Date().getFullYear();y>=2002;y--)year.add(new Option(y,y));const num=v=>Number(String(v??0).replace(/,/g,''))||0;function metricVal(cat,labels,stats,m){let n=(cat||'').toLowerCase(),find=x=>{let i=labels.findIndex(l=>String(l).toLowerCase()===x);return i<0?0:num(stats[i])};if(m==='passingYards'&&n.includes('pass'))return find('yds');if(m==='passingTouchdowns'&&n.includes('pass'))return find('td');if(m==='rushingYards'&&n.includes('rush'))return find('yds');if(m==='rushingTouchdowns'&&n.includes('rush'))return find('td');if(m==='receivingYards'&&n.includes('receiv'))return find('yds');if(m==='receptions'&&n.includes('receiv'))return find('rec');if(m==='receivingTouchdowns'&&n.includes('receiv'))return find('td');return 0}async function J(u){let r=await fetch(u);return r.json()}go.onclick=async()=>{go.disabled=true;out.innerHTML='';try{let gs=[];for(let w=1;w<=(+year.value>=2021?18:17);w++){status.textContent=`Loading week ${w}…`;let x=await J(`${B}/scoreboard?limit=100&dates=${year.value}&seasontype=2&week=${w}`);gs.push(...(x.events||[]).filter(e=>e.status?.type?.completed))}gs=[...new Map(gs.map(e=>[e.id,e])).values()];let hits=[],d=0;for(const e of gs){status.textContent=`Scanning ${++d}/${gs.length} games…`;let s=await J(`${B}/summary?event=${e.id}`);for(const b of s.boxscore?.players||[])for(const c of b.statistics||[])for(const r of c.athletes||[]){let v=metricVal(c.name,c.labels||[],r.stats||[],metric.value);if(v>=+threshold.value)hits.push({name:r.athlete?.displayName||'Unknown',team:b.team?.abbreviation||'',v,date:e.date?.slice(0,10),game:e.shortName||''})}}hits.sort((a,b)=>b.v-a.v);out.innerHTML=hits.map((x,i)=>`<div class=row><span class=rank>#${i+1}</span><b>${x.name}</b><span class=val>${x.v}</span><span class=hide>${x.team}</span><span class=hide>${x.date}</span></div>`).join('')||'<div style="padding:20px">No qualifying games.</div>';status.textContent=`${hits.length} performances reached ${threshold.value}+ • ${gs.length} games scanned`}catch(e){status.textContent='Failed: '+e.message}finally{go.disabled=false}};metric.onchange=()=>threshold.value={passingYards:300,passingTouchdowns:3,rushingYards:100,rushingTouchdowns:2,receivingYards:100,receptions:10,receivingTouchdowns:2}[metric.value]</script></body></html>
