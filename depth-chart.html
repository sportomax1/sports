<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Depth Chart Lab</title>
<style>:root{color-scheme:dark;--bg:#07101b;--card:#0e1928;--card2:#132238;--line:#263a55;--muted:#91a4bd;--gold:#f4b400;--green:#3fb950;--red:#ff7b72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px system-ui,-apple-system,sans-serif}.shell{max-width:1350px;margin:auto;padding:18px}h1{margin:0;font-size:34px}.muted{color:var(--muted)}.tabs,.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0}button,select,input{border:1px solid #345;background:var(--card2);color:#fff;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}button.active{background:var(--gold);color:#111;font-weight:900}.status{padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0}.ok{color:#7ee787}.error{color:var(--red)}.hero{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}.hero img{width:64px;height:64px;object-fit:contain}.hero h2{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:10px}.group{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.group>h3{margin:0;padding:11px;background:var(--card2)}.position{padding:10px;border-top:1px solid var(--line)}.position-title{font-weight:900;color:#ffd45c;margin-bottom:6px}.player{display:grid;grid-template-columns:30px 42px 1fr auto;gap:8px;align-items:center;background:#091421;border-radius:8px;padding:6px;margin:5px 0}.player img{width:38px;height:38px;border-radius:50%;object-fit:cover}.rank{font-weight:900;text-align:center}.starter{color:#7ee787}.badge{font-size:10px;border:1px solid #40516a;border-radius:15px;padding:3px 6px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #345;border-radius:10px}.debug{font-size:11px;word-break:break-all;color:#7890ad}details{margin:10px 0;background:#0b1522;border:1px solid var(--line);border-radius:10px;padding:9px}</style></head><body><main class="shell"><h1>Depth Chart Lab</h1><div class="muted">ESPN depth charts with player-reference resolution and roster fallback.</div><div id="sports" class="tabs"></div><div class="controls"><label>Team <select id="team"></select></label><input id="filter" placeholder="Filter player / position"><button id="reload">Reload</button></div><div id="status" class="status muted">Starting…</div><div id="hero"></div><details><summary>API diagnostics</summary><div id="debug" class="debug"></div></details><div id="out"></div></main><script>
'use strict';
const CFG={NFL:{sport:'football',league:'nfl'},NBA:{sport:'basketball',league:'nba'},MLB:{sport:'baseball',league:'mlb'},NHL:{sport:'hockey',league:'nhl'}};
const NFL=[['22','ARI','Arizona Cardinals'],['1','ATL','Atlanta Falcons'],['33','BAL','Baltimore Ravens'],['2','BUF','Buffalo Bills'],['29','CAR','Carolina Panthers'],['3','CHI','Chicago Bears'],['4','CIN','Cincinnati Bengals'],['5','CLE','Cleveland Browns'],['6','DAL','Dallas Cowboys'],['7','DEN','Denver Broncos'],['8','DET','Detroit Lions'],['9','GB','Green Bay Packers'],['34','HOU','Houston Texans'],['11','IND','Indianapolis Colts'],['30','JAX','Jacksonville Jaguars'],['12','KC','Kansas City Chiefs'],['13','LV','Las Vegas Raiders'],['24','LAC','Los Angeles Chargers'],['14','LAR','Los Angeles Rams'],['15','MIA','Miami Dolphins'],['16','MIN','Minnesota Vikings'],['17','NE','New England Patriots'],['18','NO','New Orleans Saints'],['19','NYG','New York Giants'],['20','NYJ','New York Jets'],['21','PHI','Philadelphia Eagles'],['23','PIT','Pittsburgh Steelers'],['25','SF','San Francisco 49ers'],['26','SEA','Seattle Seahawks'],['27','TB','Tampa Bay Buccaneers'],['10','TEN','Tennessee Titans'],['28','WSH','Washington Commanders']].map(x=>({id:x[0],abbreviation:x[1],displayName:x[2],logos:[{href:`https://a.espncdn.com/i/teamlogos/nfl/500/${x[1].toLowerCase()}.png`}]}));
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let sport=localStorage.depthSportV4||'NFL',teams=[],model=null,logs=[];
function log(x){logs.push(x);$('debug').innerHTML=logs.map(esc).join('<br>')}
async function json(url){log('GET '+url);const r=await fetch(url,{cache:'no-store',credentials:'omit'});log('HTTP '+r.status);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function teamsFrom(j){return(j?.sports?.[0]?.leagues?.[0]?.teams||j?.teams||[]).map(x=>x.team||x).filter(x=>x?.id)}
function groupsDepth(j){let charts=Array.isArray(j?.depthCharts)?j.depthCharts:Array.isArray(j?.items)?j.items:(j?.positions?[j]:[]);return charts.map(c=>{const raw=c?.positions||{},ps=Array.isArray(raw)?raw:Object.values(raw);return{name:c?.name||c?.displayName||'Depth Chart',positions:ps.map(p=>({name:p?.position?.name||p?.name||'Position',abbr:p?.position?.abbreviation||p?.abbreviation||'',items:Array.isArray(p?.athletes)?p.athletes:Object.values(p?.athletes||p?.items||{})})).filter(p=>p.items.length)}}).filter(g=>g.positions.length)}
function groupsRoster(j){const src=Array.isArray(j?.athletes)?j.athletes:Array.isArray(j?.items)?j.items:[],out=[];for(const g of src){if(Array.isArray(g?.items)&&g.items.length)out.push({name:typeof g.position==='string'?g.position:(g?.position?.name||g?.name||'Roster'),items:g.items});}return out}
function refUrl(x){let r=x?.athlete?.$ref||x?.player?.$ref||x?.$ref||'';return r?String(r).replace(/^http:/,'https:'):''}
function embedded(x){const a=x?.athlete||x?.player||x||{};return a?.displayName||a?.fullName||a?.shortName?{id:a.id||'',name:a.displayName||a.fullName||a.shortName,jersey:a.jersey||'',pos:a.position?.abbreviation||a.position?.name||'',head:a.headshot?.href||a.headshot||'',rank:Number(x?.rank??a?.rank??0)}:null}
async function resolveOne(x){const e=embedded(x);if(e)return e;const u=refUrl(x);if(!u)return{id:'',name:'Unknown',jersey:'',pos:'',head:'',rank:Number(x?.rank||0)};try{const a=await json(u);return{id:a.id||'',name:a.displayName||a.fullName||a.shortName||[a.firstName,a.lastName].filter(Boolean).join(' ')||'Unknown',jersey:a.jersey||'',pos:a.position?.abbreviation||a.position?.name||'',head:a.headshot?.href||a.headshot||'',rank:Number(x?.rank??a?.rank??0)}}catch{return{id:'',name:'Unknown',jersey:'',pos:'',head:'',rank:Number(x?.rank||0)}}}
async function hydrate(groups,depth){const all=[];if(depth)groups.forEach(g=>g.positions.forEach(p=>p.items.forEach(x=>all.push(x))));else groups.forEach(g=>g.items.forEach(x=>all.push(x)));const resolved=await Promise.all(all.map(resolveOne));const map=new Map(all.map((x,i)=>[x,resolved[i]]));if(depth)groups.forEach(g=>g.positions.forEach(p=>p.items=p.items.map(x=>({...x,_player:map.get(x)}))));else groups.forEach(g=>g.items=g.items.map(x=>({...x,_player:map.get(x)})));return groups}
function ath(x){return x?._player||embedded(x)||{id:'',name:'Unknown',jersey:'',pos:'',head:'',rank:Number(x?.rank||0)}}
function row(x,i,d){const a=ath(x),r=d?(a.rank||i+1):0,head=a.head||(a.id?`https://a.espncdn.com/i/headshots/${CFG[sport].league}/players/full/${a.id}.png`:'');return`<div class="player"><div class="rank ${r===1?'starter':''}">${d?r:'•'}</div><img src="${esc(head)}" alt="" onerror="this.style.opacity=.12"><div><b>${esc(a.name)}</b><div class="muted">${a.jersey?'#'+esc(a.jersey)+' · ':''}${esc(a.pos)}</div></div><span class="badge">${d?(r===1?'Starter':'Depth '+r):'Roster'}</span></div>`}
function render(){if(!model)return;const q=$('filter').value.toLowerCase().trim();$('out').innerHTML=`<div class="grid">${model.groups.map(g=>`<section class="group"><h3>${esc(g.name)}</h3>${model.kind==='depth'?g.positions.map(p=>{const a=p.items.filter(x=>!q||p.name.toLowerCase().includes(q)||ath(x).name.toLowerCase().includes(q));return a.length?`<div class="position"><div class="position-title">${esc(p.abbr||p.name)} · ${esc(p.name)}</div>${a.sort((x,y)=>(ath(x).rank||99)-(ath(y).rank||99)).map((x,i)=>row(x,i,true)).join('')}</div>`:''}).join(''):`<div class="position">${g.items.filter(x=>!q||ath(x).name.toLowerCase().includes(q)).map((x,i)=>row(x,i,false)).join('')}</div>`}</section>`).join('')}</div>`}
function tabs(){$('sports').innerHTML=Object.keys(CFG).map(s=>`<button data-s="${s}" class="${s===sport?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.depthSportV4=sport;tabs();loadTeams()})}
function install(list){teams=[...list].sort((a,b)=>(a.displayName||'').localeCompare(b.displayName||''));$('team').innerHTML=teams.map(t=>`<option value="${t.id}">${esc(t.displayName||t.name)}</option>`).join('');loadTeam()}
async function loadTeams(){logs=[];$('debug').innerHTML='';$('status').textContent='Loading teams…';if(sport==='NFL')return install(NFL);const c=CFG[sport];try{const j=await json(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams?limit=100`),t=teamsFrom(j);if(!t.length)throw Error('No teams');install(t)}catch(e){$('status').innerHTML=`<span class="error">Teams failed: ${esc(e.message)}</span>`}}
async function loadTeam(){const id=$('team').value;if(!id)return;logs=[];$('debug').innerHTML='';model=null;$('out').innerHTML='';const c=CFG[sport],t=teams.find(x=>String(x.id)===String(id));$('hero').innerHTML=`<div class="hero"><img src="${esc(t?.logos?.[0]?.href||'')}" alt=""><div><h2>${esc(t?.displayName||'Team')}</h2><div class="muted">${sport} · ESPN ${id}</div></div></div>`;$('status').textContent='Loading depth chart and resolving players…';try{const j=await json(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams/${id}/depthcharts`),g=groupsDepth(j);if(g.length){await hydrate(g,true);model={kind:'depth',groups:g};$('status').innerHTML='<span class="ok">ESPN depth chart loaded with player names.</span>';render();return}}catch(e){log('Depth failed: '+e.message)}try{const j=await json(`https://site.api.espn.com/apis/site/v2/sports/${c.sport}/${c.league}/teams/${id}/roster`),g=groupsRoster(j);if(!g.length)throw Error('No roster');await hydrate(g,false);model={kind:'roster',groups:g};$('status').textContent='Roster fallback loaded.';render()}catch(e){$('status').innerHTML=`<span class="error">Player data failed: ${esc(e.message)}</span>`}}
$('team').onchange=loadTeam;$('reload').onclick=loadTeam;$('filter').oninput=render;tabs();loadTeams();
</script></body></html>
