function close(){modalBack.classList.remove("open")}document.getElementById("modalClose").onclick=close;modalBack.onclick=e=>{if(e.target===modalBack)close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
function renderTrendLeague(){let old=trendLeague.value,keys=[...enabled];trendLeague.innerHTML=keys.map(k=>`<option value="${k}">${L[k].name}</option>`).join("");trendLeague.value=keys.includes(old)?old:(keys[0]||"nhl");loadTeamOptions()}async function loadTeamOptions(){if(trendScope.value!=="team"){trendTeam.style.display="none";return}trendTeam.style.display="";trendTeam.innerHTML='<option>Loading teams…</option>';try{let teams=await getTeams(trendLeague.value);trendTeam.innerHTML=teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");if(teams.length)renderTrend()}catch(e){trendTeam.innerHTML='<option value="">Teams unavailable</option>'}}renderTrendLeague();
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");let v=b.dataset.view;document.getElementById("calendarView").classList.toggle("off",v!=="calendar");document.getElementById("trendsView").classList.toggle("on",v==="trends");compareView.classList.toggle("on",v==="compare");document.getElementById("todayBtn").style.display=v==="calendar"?"":"none";if(v==="trends")renderTrend();if(v==="compare")renderCompare()});document.querySelectorAll(".trend-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".trend-btn").forEach(x=>x.classList.remove("on"));b.classList.add("on");trendMode=b.dataset.range;renderTrend()});trendLeague.onchange=async()=>{await loadTeamOptions();if(trendScope.value==="league")renderTrend()};trendScope.onchange=()=>{loadTeamOptions();renderTrend()};trendTeam.onchange=renderTrend;
function buildPeriods(k,mode){let t=date(today()),ty=t.getFullYear(),tm=t.getMonth();if(mode==="30d"){let out=[];for(let i=29;i>=0;i--){let s=addDays(today(),-i);out.push({label:fmt(s,{month:"short",day:"numeric"}),start:s,end:s})}return out}if(mode==="monthly"){let out=[];for(let i=11;i>=0;i--){let s=addMonths(today(),-i).slice(0,7)+"-01",d=date(s),full=ymd(new Date(d.getFullYear(),d.getMonth()+1,0,12)),current=d.getFullYear()===ty&&d.getMonth()===tm;out.push({label:fmt(s,{month:"short",year:"2-digit"})+(current?" MTD":""),start:s,end:current?today():full})}return out}if(mode==="yearly"){let out=[];for(let i=4;i>=0;i--){let yy=ty-i,current=yy===ty;out.push({label:String(yy)+(current?" YTD":""),start:yy+"-01-01",end:current?today():yy+"-12-31"})}return out}return seasonPeriods(k)}
function seasonPeriods(k){let y=date(today()).getFullYear(),out=[];for(let i=4;i>=0;i--){let sy=y-i,start,end,label,current=false;if(["nba","nhl","ncaab"].includes(k)){start=sy+"-08-01";let natural=(sy+1)+"-07-31";current=today()>=start&&today()<=natural;end=current?today():natural;label=sy+"-"+String(sy+1).slice(2)+(current?" to date":"")}else{start=sy+"-01-01";let natural=sy+"-12-31";current=sy===y;end=current?today():natural;label=String(sy)+(current?" to date":"")}out.push({label,start,end})}return out}
function monthChunks(a,b){let out=[],s=a;while(s<=b){let d=date(s),monthEnd=ymd(new Date(d.getFullYear(),d.getMonth()+1,0,12)),e=monthEnd<b?monthEnd:b;out.push({start:s,end:e});s=addDays(e,1)}return out}
async function periodGames(k,p){if(p.start===p.end){let d=await get(k,p.start);return d.finals.map(g=>({...g,day:p.start}))}let monthsNeeded=[],m=monthKey(p.start);while(m<=monthKey(p.end)){monthsNeeded.push(m);m=monthKey(addMonths(m+"-01",1))}let parts=await mapLimit(monthsNeeded,4,async ym=>{let d=await getMonth(k,ym);return d.finals.filter(g=>{let day=g.eventDay||ymd(new Date(g.eventDate));return day>=p.start&&day<=p.end}).map(g=>({...g,day:g.eventDay||ymd(new Date(g.eventDate))}))});return parts.flatMap(x=>x.__error?[]:x)}
function aggregateGames(games,k,scope,teamId){let points=0,allowed=0,apps=0,high=null,days=new Map();for(const g of games){if(scope==="league"){points+=g.as+g.hs;apps+=2;let a=days.get(g.day)||{points:0,apps:0};a.points+=g.as+g.hs;a.apps+=2;days.set(g.day,a)}else{let own=null,opp=null;if(g.away.id===teamId){own=g.as;opp=g.hs}else if(g.home.id===teamId){own=g.hs;opp=g.as}else continue;points+=own;allowed+=opp;apps++;let a=days.get(g.day)||{points:0,apps:0};a.points+=own;a.apps++;days.set(g.day,a);if(!high||own>high.value)high={date:g.day,value:own}}}if(scope==="league"){for(const [day,a] of days){let v=a.apps?a.points/a.apps:null;if(v!=null&&(!high||v>high.value))high={date:day,value:v}}}return{avg:apps?points/apps:null,allowed:scope==="team"&&apps?allowed/apps:null,games:scope==="team"?apps:games.length,high}}
async function renderTrend(){const token=++trendToken,k=trendLeague.value,scope=trendScope.value,teamId=scope==="team"?trendTeam.value:"";if(scope==="team"&&!teamId)return;trendAvg.textContent=trendGames.textContent=trendChange.textContent=trendHigh.textContent=trendAllowed.textContent="…";trendList.innerHTML='<div class="emptymsg">Loading trend data…</div>';draw([],k,"Loading…");let identity=null;if(scope==="team"){identity=(await getTeams(k)).find(t=>t.id===teamId);trendIdentity.innerHTML=identity?`<div class="team-badge"><img src="${identity.logo}" alt=""><span>${esc(identity.name)}</span></div>`:""}else trendIdentity.innerHTML="";let periods=buildPeriods(k,trendMode),rows=[];for(const p of periods){let games=await periodGames(k,p);if(token!==trendToken)return;rows.push({...p,...aggregateGames(games,k,scope,teamId)})}let valid=rows.filter(r=>r.avg!=null),latest=valid[valid.length-1],prev=valid[valid.length-2];trendAvg.textContent=latest?n(latest.avg,k):"—";trendGames.textContent=latest?latest.games:"—";trendChange.textContent=latest&&prev&&prev.avg?(((latest.avg-prev.avg)/prev.avg)*100).toFixed(1)+"%":"—";trendHigh.textContent=latest?.high?(n(latest.high.value,k)+" · "+fmt(latest.high.date,{month:"short",day:"numeric"})):"—";trendAllowed.textContent=scope==="team"&&latest?n(latest.allowed,k):"—";draw(rows,k);trendList.innerHTML='<div class="trend-row head"><div>Period</div><div>Avg</div><div>Games</div><div>High</div></div>'+rows.map(r=>`<div class="trend-row"><div><strong>${esc(r.label)}</strong></div><div>${n(r.avg,k)}</div><div>${r.games}</div><div class="muted">${r.high?n(r.high.value,k)+" · "+fmt(r.high.date,{month:"short",day:"numeric"}):"—"}</div></div>`).join("")}
function draw(rows,k,message=""){let r=chart.getBoundingClientRect(),dpr=Math.max(1,Math.min(2,devicePixelRatio||1));chart.width=Math.max(1,Math.floor(r.width*dpr));chart.height=Math.max(1,Math.floor(r.height*dpr));let c=chart.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,r.width,r.height);if(message){c.fillStyle="#93a4ba";c.font="13px system-ui";c.textAlign="center";c.fillText(message,r.width/2,r.height/2);return}let v=rows.filter(x=>x.avg!=null);if(!v.length){c.fillStyle="#93a4ba";c.font="13px system-ui";c.textAlign="center";c.fillText("No completed games in this range.",r.width/2,r.height/2);return}let min=Math.min(...v.map(x=>x.avg)),max=Math.max(...v.map(x=>x.avg));if(min===max){min-=1;max+=1}let ex=(max-min)*.15;min=Math.max(0,min-ex);max+=ex;let p={l:42,r:12,t:18,b:34},w=r.width-p.l-p.r,h=r.height-p.t-p.b,x=i=>p.l+(rows.length===1?w/2:(i/(rows.length-1))*w),y=val=>p.t+(max-val)/(max-min)*h;c.strokeStyle="#ffffff15";c.fillStyle="#93a4ba";c.font="10px system-ui";c.textAlign="right";for(let i=0;i<4;i++){let q=i/3,val=max-q*(max-min),yy=p.t+q*h;c.beginPath();c.moveTo(p.l,yy);c.lineTo(r.width-p.r,yy);c.stroke();c.fillText(n(val,k),p.l-6,yy+3)}c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--"+k).trim()||"#7dc7ff";c.lineWidth=2;c.beginPath();let begun=false;rows.forEach((row,i)=>{if(row.avg==null){begun=false;return}let xx=x(i),yy=y(row.avg);if(!begun){c.moveTo(xx,yy);begun=true}else c.lineTo(xx,yy)});c.stroke();c.fillStyle="#f6f8fb";rows.forEach((row,i)=>{if(row.avg==null)return;c.beginPath();c.arc(x(i),y(row.avg),3,0,Math.PI*2);c.fill()});let every=Math.max(1,Math.ceil(rows.length/(r.width<560?4:7)));c.fillStyle="#93a4ba";c.textAlign="center";rows.forEach((row,i)=>{if(i%every!==0&&i!==rows.length-1)return;c.fillText(row.label,x(i),r.height-12)})}

function compareWindow(k){let r=compareRange.value;if(r==="30d")return{start:addDays(today(),-29),end:today(),label:"Last 30 days"};if(r==="90d")return{start:addDays(today(),-89),end:today(),label:"Last 90 days"};if(r==="year"){let y=date(today()).getFullYear();return{start:y+"-01-01",end:today(),label:y+" YTD"}}let ps=seasonPeriods(k),p=ps[ps.length-1];return{start:p.start,end:p.end,label:p.label}}
function metricValue(a,m){if(m==="allowed")return a.allowed;if(m==="diff")return a.avg!=null&&a.allowed!=null?a.avg-a.allowed:null;return a.avg}
function leagueBuckets(k){let w=compareWindow(k),out=[];if(compareRange.value==="30d"){for(let s=w.start;s<=w.end;s=addDays(s,1))out.push({label:fmt(s,{month:"short",day:"numeric"}),start:s,end:s});return out}if(compareRange.value==="90d"){for(let s=w.start;s<=w.end;){let e=addDays(s,6);if(e>w.end)e=w.end;out.push({label:fmt(s,{month:"short",day:"numeric"}),start:s,end:e});s=addDays(e,1)}return out}for(let s=w.start;s<=w.end;){let d=date(s),e=ymd(new Date(d.getFullYear(),d.getMonth()+1,0,12));if(e>w.end)e=w.end;out.push({label:fmt(s,{month:"short",year:"2-digit"}),start:s,end:e});s=addDays(e,1)}return out}
async function loadCompareTeams(){let k=compareLeague.value,teams=[];try{teams=await getTeams(k)}catch(e){comparePicks.innerHTML='<div class="emptymsg">Could not load teams.</div>';return}comparePicks.style.display=compareMode==="team"?"flex":"none";if(compareMode!=="team"){comparePicks.innerHTML="";return}comparePicks.innerHTML=`<button class="pick ${compareAllTeams?"on":""}" data-all="1">All Teams</button>`+teams.map(t=>`<button class="pick ${!compareAllTeams&&compareSelected.has(t.id)?"on":""}" data-id="${t.id}">${t.logo?'<img src="'+t.logo+'" alt="">':""}${esc(t.name)}</button>`).join("");comparePicks.querySelector('[data-all="1"]').onclick=()=>{compareAllTeams=true;compareSelected.clear();loadCompareTeams();renderCompare()};comparePicks.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{compareAllTeams=false;let id=b.dataset.id;compareSelected.has(id)?compareSelected.delete(id):compareSelected.add(id);b.classList.toggle("on",compareSelected.has(id));comparePicks.querySelector('[data-all="1"]').classList.remove("on");renderCompare()})}
function drawBars(items,k,orientation){let desired=orientation==="horizontal"?Math.max(430,items.filter(x=>x.value!=null).length*27+36):430;compareChart.parentElement.style.height=desired+"px";let r=compareChart.getBoundingClientRect(),dpr=Math.max(1,Math.min(2,devicePixelRatio||1));compareChart.width=Math.max(1,Math.floor(r.width*dpr));compareChart.height=Math.max(1,Math.floor(r.height*dpr));let c=compareChart.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,r.width,r.height);let valid=items.filter(x=>x.value!=null&&Number.isFinite(x.value));if(!valid.length){c.fillStyle="#93a4ba";c.font="13px system-ui";c.textAlign="center";c.fillText("No completed-game data.",r.width/2,r.height/2);return}let min=Math.min(0,...valid.map(x=>x.value)),max=Math.max(0,...valid.map(x=>x.value));if(min===max)max=min+1;c.font="10px system-ui";c.fillStyle="#93a4ba";c.strokeStyle="#ffffff15";if(orientation==="horizontal"){let left=Math.min(150,Math.max(72,r.width*.28)),right=46,top=8,bottom=8,h=r.height-top-bottom,row=h/valid.length,plotW=r.width-left-right,zero=left+((0-min)/(max-min))*plotW;valid.forEach((it,i)=>{let y=top+i*row+row*.18,bh=Math.max(3,row*.64),xv=left+((it.value-min)/(max-min))*plotW,x=Math.min(zero,xv),w=Math.abs(xv-zero);c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--"+k).trim()||"#7dc7ff";c.fillRect(x,y,w,bh);c.fillStyle="#dce6f2";c.textAlign="right";c.fillText((it.abbr||it.label).slice(0,18),left-6,y+bh*.7);c.textAlign=xv>=zero?"left":"right";c.fillText(formatMetric(it.value,k),xv+(xv>=zero?5:-5),y+bh*.7)});c.strokeStyle="#ffffff28";c.beginPath();c.moveTo(zero,top);c.lineTo(zero,r.height-bottom);c.stroke()}else{let left=42,right=10,top=12,bottom=58,w=r.width-left-right,col=w/valid.length,plotH=r.height-top-bottom,zero=top+((max)/(max-min))*plotH;valid.forEach((it,i)=>{let xv=left+i*col+col*.16,bw=Math.max(3,col*.68),yv=top+((max-it.value)/(max-min))*plotH,y=Math.min(zero,yv),h=Math.abs(yv-zero);c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--"+k).trim()||"#7dc7ff";c.fillRect(xv,y,bw,h);c.fillStyle="#dce6f2";c.textAlign="center";c.save();c.translate(xv+bw/2,r.height-8);c.rotate(valid.length>12?-.8:-.45);c.fillText((it.abbr||it.label).slice(0,12),0,0);c.restore();c.fillText(formatMetric(it.value,k),xv+bw/2,yv+(it.value>=0?-5:12))});c.strokeStyle="#ffffff28";c.beginPath();c.moveTo(left,zero);c.lineTo(r.width-right,zero);c.stroke()}}
function formatMetric(v,k){return v==null?"—":Number(v).toFixed(L[k].d===2?2:1).replace(/\.00$/,"").replace(/(\.\d)0$/,"$1")}
async function renderCompare(){const token=++compareToken,k=compareLeague.value,metric=compareMetric.value,w=compareWindow(k);compareNote.textContent=compareMode==="league"?`${L[k].name} scoring by time bucket • ${w.label}`:`${L[k].name} team ranking • ${w.label}`;compareTable.innerHTML='<div class="emptymsg">Loading comparison…</div>';let items=[];try{if(compareMode==="league"){compareMetric.value="scored";compareMetric.disabled=true;let buckets=leagueBuckets(k);let rows=await mapLimit(buckets,4,async p=>{let games=await periodGames(k,p);let a=aggregateGames(games,k,"league","");return{label:p.label,abbr:p.label,value:a.avg,games:a.games}});if(token!==compareToken)return;items=rows.filter(x=>!x.__error&&x.value!=null).sort((a,b)=>b.value-a.value)}else{compareMetric.disabled=false;let teams=await getTeams(k),ids=compareAllTeams?teams.map(t=>t.id):[...compareSelected];if(!ids.length){compareTable.innerHTML='<div class="emptymsg">Select teams or choose All Teams.</div>';drawBars([],k,barOrientation);return}let games=await periodGames(k,w);if(token!==compareToken)return;items=ids.map(id=>{let t=teams.find(x=>x.id===id),a=aggregateGames(games,k,"team",id);return t?{label:t.name,abbr:t.abbr||t.name,value:metricValue(a,metric),games:a.games,allowed:a.allowed}:null}).filter(Boolean).filter(x=>x.value!=null).sort((a,b)=>b.value-a.value)}if(token!==compareToken)return;drawBars(items,k,barOrientation);compareTable.innerHTML='<div class="compare-row head"><div>'+ (compareMode==="team"?"Team":"Period") +'</div><div>Value</div><div>Games</div><div>Rank</div></div>'+items.map((x,i)=>`<div class="compare-row"><div>${esc(x.label)}</div><div>${formatMetric(x.value,k)}</div><div>${x.games??"—"}</div><div>${i+1}</div></div>`).join("")}catch(e){if(token!==compareToken)return;console.error("ScoreFlow Compare",e);compareTable.innerHTML='<div class="emptymsg">Comparison data failed to load. Try a shorter range or another league.</div>';drawBars([],k,barOrientation)}}
function initCompare(){compareLeague.innerHTML=Object.keys(L).map(k=>`<option value="${k}">${L[k].name}</option>`).join("");compareLeague.value=[...enabled][0]||"nhl";document.querySelectorAll(".compare-subtab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".compare-subtab").forEach(x=>x.classList.remove("on"));b.classList.add("on");compareMode=b.dataset.cmode;compareAllTeams=true;compareSelected.clear();if(compareMode==="team"){barOrientation="horizontal";barHorizontal.classList.add("on");barVertical.classList.remove("on")}loadCompareTeams();renderCompare()});compareLeague.onchange=()=>{compareAllTeams=true;compareSelected.clear();loadCompareTeams();renderCompare()};compareRange.onchange=renderCompare;compareMetric.onchange=renderCompare;barVertical.onclick=()=>{barOrientation="vertical";barVertical.classList.add("on");barHorizontal.classList.remove("on");renderCompare()};barHorizontal.onclick=()=>{barOrientation="horizontal";barHorizontal.classList.add("on");barVertical.classList.remove("on");renderCompare()};loadCompareTeams();renderCompare()}
initCompare();
