<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101b"><title>NFL Roster Retention Lab</title>
<style>
:root{color-scheme:dark;--bg:#07101b;--p:#0e1928;--p2:#132238;--line:#263a55;--muted:#91a4bd;--gold:#f4b400;--green:#7ee787;--red:#ff7b72;--blue:#58a6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px Inter,system-ui,sans-serif}.shell{max-width:1500px;margin:auto;padding:18px}h1{margin:0;font-size:36px}.sub,.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:14px 0}.control{display:grid;gap:4px}.control span{font-size:10px;text-transform:uppercase;font-weight:900;color:var(--muted)}button,select,input{min-height:40px;background:var(--p2);color:#fff;border:1px solid #345;border-radius:9px;padding:8px;font:inherit}button{cursor:pointer}button.active{background:var(--gold);color:#111;font-weight:900}.status,.hero,.stat,.panel,.player{background:var(--p);border:1px solid var(--line);border-radius:12px}.status{padding:10px 12px;margin:10px 0}.ok{color:var(--green)}.error{color:var(--red)}.hero{display:flex;align-items:center;gap:14px;padding:13px;margin:10px 0}.hero img{width:64px;height:64px;object-fit:contain}.hero h2{margin:0;font-size:24px}.stats{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px;margin:10px 0}.stat{padding:11px}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.panel{padding:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:920px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{position:sticky;top:0;background:var(--p2);font-size:11px}th.sort{cursor:pointer}.face{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#17253a;vertical-align:middle;margin-right:8px}.badge{display:inline-block;border:1px solid #456;border-radius:999px;padding:3px 7px;font-size:10px}.kept{color:var(--green)}.left{color:var(--red)}.new{color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:9px}.player{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;padding:9px}.player img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#17253a}.bar{height:9px;background:#17253a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:7px}.yearbox{background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:9px}.yearbox b{font-size:18px}.empty{padding:28px;text-align:center;color:var(--muted)}details{margin-top:12px}.debug{white-space:pre-wrap;word-break:break-word;font:11px monospace;color:#8298b5}.heatwrap{overflow:auto}.heat{border-collapse:separate;border-spacing:4px;min-width:1000px}.heat th{position:sticky;top:0;background:var(--p);z-index:2}.heat td{padding:0;border:0}.heat button{width:100%;min-width:72px;min-height:54px;border:1px solid #ffffff22;font-weight:900}.heat .teamcell{background:var(--p2);padding:8px;white-space:nowrap;font-weight:800}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{width:min(900px,96vw);max-height:88vh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:14px;padding:16px}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.modalhead h2{margin:0}.modal .tabs{position:sticky;top:0;background:var(--p);padding:8px 0;z-index:2}.modal.hide{display:none}.hide{display:none}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.shell{padding:11px}h1{font-size:30px}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="shell">
<div class="muted">SPORTOMAX SPORTS · NFL HISTORY</div><h1>Roster Retention Lab</h1><div class="sub">Explore NFL rosters by season and measure retention as returning ESPN athlete IDs ÷ the prior season roster. Historical membership is rebuilt from ESPN game-by-game competitor rosters.</div>
<div class="toolbar">
<label class="control"><span>Team</span><select id="team"></select></label>
<label class="control"><span>Season</span><select id="year"></select></label>
<label class="control"><span>Compare to</span><select id="compare"></select></label>
<label class="control"><span>Position</span><select id="pos"><option value="">All positions</option></select></label>
<label class="control"><span>Find player</span><input id="q" placeholder="Name / # / position"></label>
<button id="load">Load</button><button id="statsBtn">Load player stats</button>
</div>
<div id="status" class="status">Starting…</div><div id="hero"></div><div id="summary" class="stats hide"></div>
<div class="tabs" aria-label="Scope"><button data-tab="dashboard">🏈 All Teams</button><button data-tab="roster" class="active">👤 Team Detail</button></div><div class="tabs" id="teamSubtabs" aria-label="Team analysis"><button data-subtab="roster" class="active">Roster</button><button data-subtab="changes">Year-over-year</button><button data-subtab="history">Retention history</button><button data-view="table" class="active">Table</button><button data-view="cards">Cards</button></div>
<div id="out"></div><div id="modal" class="modal hide" role="dialog" aria-modal="true"><div class="modalbox"><div class="modalhead"><div><h2 id="modalTitle"></h2><div id="modalSub" class="muted"></div></div><button id="modalClose">Close</button></div><div class="tabs"><button data-mtab="kept" class="active">Carry over</button><button data-mtab="left">Leaving</button><button data-mtab="added">Joining</button></div><div id="modalOut"></div></div></div><details><summary>Diagnostics</summary><div id="debug" class="debug"></div></details>
</main><script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={teams:[],a:[],b:[],tab:'roster',view:'table',stats:new Map(),token:0,logs:[]};
const cache=new Map(); const current=new Date().getFullYear();
function log(x){state.logs.push(x);if(state.logs.length>100)state.logs.shift();$('debug').textContent=state.logs.join('\n')}
function status(x,c=''){$('status').className='status '+c;$('status').textContent=x}
async function api(u){if(cache.has(u))return cache.get(u);log('GET '+u);const r=await fetch(u,{cache:'no-store'});log('HTTP '+r.status);if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();cache.set(u,j);return j}
async function mapLimit(a,n,fn){let i=0,out=new Array(a.length);async function w(){while(i<a.length){const k=i++;try{out[k]=await fn(a[k],k)}catch{out[k]=null}}}await Promise.all(Array.from({length:Math.min(n,a.length||1)},w));return out}
function ref(x){return String(x?.$ref||'').replace(/^http:/,'https:')}
function idFromRef(x){const m=ref(x).match(/\/athletes\/(\d+)/);return m?.[1]||String(x?.id||'')}
function player(p){return{id:String(p?.id||''),name:p?.displayName||p?.fullName||'Unknown',pos:p?.position?.abbreviation||p?.position?.name||'—',jersey:p?.jersey||'',head:p?.headshot?.href||'',exp:p?.experience?.years??'',age:p?.age??'',college:p?.college?.name||'',stats:null}}
function head(p){return p.head||`https://a.espncdn.com/i/headshots/nfl/players/full/${p.id}.png`}
async function teams(){status('Loading NFL teams…');const j=await api(`https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/${current}/teams?limit=40`);const refs=j?.items||[];state.teams=(await mapLimit(refs,10,async x=>{const u=ref(x);if(!u)return null;const t=await api(u);return{id:String(t?.id||''),displayName:t?.displayName||t?.name||'Team',abbreviation:t?.abbreviation||'',logos:t?.logos||[]}})).filter(Boolean).sort((a,b)=>a.displayName.localeCompare(b.displayName));$('team').innerHTML=state.teams.map((t,i)=>`<option value="${i}">${esc(t.displayName)}</option>`).join('');const den=state.teams.findIndex(t=>String(t.id)==='7');if(den>=0)$('team').value=den;await load()}
async function roster(teamId,year){const key=teamId+'-'+year;if(cache.has('R'+key))return cache.get('R'+key);
  // IMPORTANT: ESPN's season/team/athletes collection can resolve to the current
  // team membership for historical years. Build historical rosters from actual
  // game competitor rosters instead. This makes the season membership auditable.
  const evIndex=await api(`https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/${year}/teams/${teamId}/events?limit=100`);
  const eventRefs=evIndex?.items||[];
  const eventIds=[...new Set(eventRefs.map(x=>{const m=ref(x).match(/\/events\/(\d+)/);return m?.[1]}).filter(Boolean))];
  if(!eventIds.length){cache.set('R'+key,[]);return []}
  const gameRosters=await mapLimit(eventIds,6,async eid=>{
    try{return await api(`https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/${eid}/competitions/${eid}/competitors/${teamId}/roster`)}
    catch(e){log(`Roster unavailable ${year} event ${eid}: ${e.message}`);return null}
  });
  const byId=new Map();
  for(const gr of gameRosters)for(const e of gr?.entries||[]){
    const id=String(e?.playerId||idFromRef(e?.athlete)||''); if(!id)continue;
    const prior=byId.get(id)||{};
    byId.set(id,{id,name:prior.name||'',pos:e?.position?.abbreviation||e?.position?.name||prior.pos||'—',jersey:e?.jersey||prior.jersey||'',head:prior.head||'',exp:'',age:'',college:'',stats:null,appearances:(prior.appearances||0)+1,starter:prior.starter||!!e?.starter,athleteRef:ref(e?.athlete)||prior.athleteRef||''});
  }
  const ps=(await mapLimit([...byId.values()],12,async p=>{
    if(!p.athleteRef)return p;
    try{const d=player(await api(p.athleteRef));return{...p,...d,pos:p.pos!=='—'?p.pos:d.pos,jersey:p.jersey||d.jersey,appearances:p.appearances,starter:p.starter}}
    catch{return p}
  })).filter(x=>x&&x.id);
  ps.sort((a,b)=>(a.pos||'').localeCompare(b.pos||'')||(a.name||'').localeCompare(b.name||''));
  cache.set('R'+key,ps);return ps}
function setPositions(){const cur=$('pos').value;const ps=[...new Set([...state.a,...state.b].map(x=>x.pos).filter(Boolean))].sort();$('pos').innerHTML='<option value="">All positions</option>'+ps.map(p=>`<option>${esc(p)}</option>`).join('');if(ps.includes(cur))$('pos').value=cur}
function filtered(a){const q=$('q').value.trim().toLowerCase(),p=$('pos').value;return a.filter(x=>(!p||x.pos===p)&&(!q||[x.name,x.pos,x.jersey,x.college].join(' ').toLowerCase().includes(q)))}
function changes(){const A=new Map(state.a.map(x=>[x.id,x])),B=new Map(state.b.map(x=>[x.id,x]));return{kept:state.a.filter(x=>B.has(x.id)),left:state.a.filter(x=>!B.has(x.id)),added:state.b.filter(x=>!A.has(x.id))}}
function pct(n,d){return d?Math.round(n/d*100):0}
function heatColor(p){const h=Math.max(0,Math.min(120,p*1.2));return `hsl(${h} 65% 35%)`}
function compareRosters(a,b){a=Array.isArray(a)?a:[];b=Array.isArray(b)?b:[];const A=new Map(a.map(x=>[x.id,x])),B=new Map(b.map(x=>[x.id,x]));return{kept:a.filter(x=>B.has(x.id)),left:a.filter(x=>!B.has(x.id)),added:b.filter(x=>!A.has(x.id))}}
async function dashboard(){const token=++state.token,statusEl=$('status');status('Building all-team retention dashboard…');const end=+$('compare').value,start=Math.max(2002,end-9),yrs=[];for(let y=start;y<=end;y++)yrs.push(y);$('out').innerHTML='<div class="panel"><div class="empty">Loading 32 teams × historical seasons…</div></div>';
 const rows=await mapLimit(state.teams,3,async t=>{const rs=await mapLimit(yrs,3,async y=>{try{return await roster(t.id,y)}catch(e){log(`Dashboard ${t.displayName} ${y}: ${e.message}`);return []}});return{t,rs}});
 if(token!==state.token||state.tab!=='dashboard')return;
 let html='<div class="panel heatwrap"><h3>League retention heatmap</h3><div class="muted">Each cell = players from the prior season who appeared on the next season roster. Click any cell for Carry over / Leaving / Joining.</div><table class="heat"><thead><tr><th>Team</th>'+yrs.map((y,i)=>i?'<th>'+y+'</th>':'<th>'+y+' baseline</th>').join('')+'</tr></thead><tbody>';
 rows.forEach(({t,rs},ri)=>{const logo=t.logos?.[0]?.href||'';html+='<tr><td class="teamcell">'+(logo?'<img src="'+esc(logo)+'" alt="" style="width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:7px">':'')+esc(t.displayName)+'</td>';rs.forEach((r,i)=>{if(!i){html+='<td><button disabled>—</button></td>';return}const prev=rs[i-1];if(!Array.isArray(prev)||!prev.length||!Array.isArray(r)||!r.length){html+='<td><button disabled title="Roster data unavailable">N/A</button></td>';return}const c=compareRosters(prev,r),p=pct(c.kept.length,prev.length);html+=`<td><button class="heatcell" data-ri="${ri}" data-yi="${i}" style="background:${heatColor(p)}" title="${esc(t.displayName)} ${yrs[i-1]}→${yrs[i]}: ${p}%">${p}%<br><small>${c.kept.length}/${prev.length}</small></button></td>`});html+='</tr>'});html+='</tbody></table></div>';$('out').innerHTML=html;
 $('out').querySelectorAll('.heatcell').forEach(b=>b.onclick=()=>{const ri=+b.dataset.ri,i=+b.dataset.yi;openRetentionModal(rows[ri].t,yrs[i-1],yrs[i],rows[ri].rs[i-1],rows[ri].rs[i])});status('League retention dashboard loaded.','ok')}
let modalData=null,modalTab='kept';
function openRetentionModal(t,y1,y2,a,b){modalData={t,y1,y2,c:compareRosters(a,b)};modalTab='kept';$('modalTitle').textContent=t.displayName+' · '+y1+' → '+y2;$('modalSub').textContent=pct(modalData.c.kept.length,a.length)+'% retained · '+modalData.c.kept.length+'/'+a.length+' from prior roster';$('modal').classList.remove('hide');renderModal()}
function renderModal(){if(!modalData)return;document.querySelectorAll('[data-mtab]').forEach(x=>x.classList.toggle('active',x.dataset.mtab===modalTab));const labels={kept:'Carry over',left:'Leaving',added:'Joining'},a=modalData.c[modalTab];$('modalOut').innerHTML='<div class="grid">'+a.map(p=>`<div class="player"><img src="${esc(head(p))}" alt=""><div><b>${esc(p.name)}</b><div class="muted">${esc(p.pos)} ${p.jersey?'· #'+esc(p.jersey):''}</div></div><span class="badge ${modalTab==='added'?'new':modalTab}">${labels[modalTab]}</span></div>`).join('')+'</div>'}
function summary(){const c=changes(),rate=pct(c.kept.length,state.a.length);$('summary').classList.remove('hide');$('summary').innerHTML=`<div class="stat"><b>${state.a.length}</b><span>${$('year').value} roster</span></div><div class="stat"><b>${state.b.length}</b><span>${$('compare').value} roster</span></div><div class="stat"><b>${rate}%</b><span>retained · ${c.kept.length}/${state.a.length}</span></div><div class="stat"><b class="kept">${c.kept.length}</b><span>returning</span></div><div class="stat"><b class="new">${c.added.length}</b><span>new next roster</span></div><div class="stat"><b class="left">${c.left.length}</b><span>departed</span></div>`}
function statText(p){const s=state.stats.get(p.id);if(!s)return '—';const cats=s?.splits?.categories||[];const vals=[];for(const c of cats)for(const x of c.stats||[])if(['passingYards','rushingYards','receivingYards','totalTackles','sacks','interceptions','fieldGoalsMade','punts'].includes(x.name)&&Number(x.value)>0)vals.push((x.abbreviation||x.shortDisplayName||x.name)+': '+x.displayValue);return vals.slice(0,3).join(' · ')||'Stats loaded'}
function rowsHtml(arr,label=''){return arr.map(p=>`<tr><td><img class="face" src="${esc(head(p))}" alt=""><b>${esc(p.name)}</b></td><td>${esc(p.pos)}</td><td>${p.jersey?'#'+esc(p.jersey):'—'}</td><td>${p.age||'—'}</td><td>${p.exp!==''?p.exp:'—'}</td><td>${esc(p.college||'—')}</td><td>${label?`<span class="badge ${label}">${label}</span>`:'—'}</td><td>${esc(statText(p))}</td></tr>`).join('')}
function table(arr,label=''){$('out').innerHTML=`<div class="panel tablewrap"><table><thead><tr><th>Player</th><th>Pos</th><th>#</th><th>Age*</th><th>Exp*</th><th>College</th><th>Status</th><th>Season stats</th></tr></thead><tbody>${rowsHtml(filtered(arr),label)}</tbody></table><div class="muted" style="padding:8px">*Age/experience reflect ESPN's season-scoped athlete payload when available.</div></div>`}
function cards(arr,label=''){$('out').innerHTML=`<div class="grid">${filtered(arr).map(p=>`<div class="player"><img src="${esc(head(p))}" alt=""><div><b>${esc(p.name)}</b><div class="muted">${esc(p.pos)} ${p.jersey?'· #'+esc(p.jersey):''}</div><small>${esc(statText(p))}</small></div>${label?`<span class="badge ${label}">${label}</span>`:''}</div>`).join('')}</div>`}
function render(){if(state.tab==='dashboard'){dashboard();return}if(!state.a.length&&!state.b.length)return;if(state.tab==='roster'){state.view==='table'?table(state.a):cards(state.a);return}if(state.tab==='changes'){const c=changes();const blocks=[['kept','Returning',c.kept],['new','New',c.added],['left','Departed',c.left]];$('out').innerHTML=blocks.map(([cl,title,a])=>`<section class="panel" style="margin-bottom:10px"><h3 class="${cl}">${title} · ${a.length}</h3>${state.view==='table'?'<div class="tablewrap"><table><thead><tr><th>Player</th><th>Pos</th><th>#</th><th>Age*</th><th>Exp*</th><th>College</th><th>Status</th><th>Season stats</th></tr></thead><tbody>'+rowsHtml(filtered(a),cl)+'</tbody></table></div>':'<div class="grid">'+filtered(a).map(p=>`<div class="player"><img src="${esc(head(p))}"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.pos)}</div></div><span class="badge ${cl}">${title}</span></div>`).join('')+'</div>'}</section>`).join('');return}history()}
async function history(){const t=state.teams[+$('team').value];if(!t)return;const end=+$('compare').value,start=Math.max(2002,end-9);status('Building 10-season retention history…');const yrs=[];for(let y=start;y<=end;y++)yrs.push(y);const rs=await mapLimit(yrs,3,y=>roster(t.id,y));const boxes=[];for(let i=0;i<yrs.length;i++){if(i===0){boxes.push({y:yrs[i],n:rs[i].length,r:null});continue}const prev=new Set(rs[i-1].map(x=>x.id)),keep=rs[i].filter(x=>prev.has(x.id)).length;boxes.push({y:yrs[i],n:rs[i].length,r:pct(keep,rs[i-1].length),keep})}$('out').innerHTML=`<div class="panel"><h3>Year-to-year retention</h3><div class="years">${boxes.map(x=>`<div class="yearbox"><b>${x.y}</b><div class="muted">${x.n} players</div>${x.r==null?'<div>Baseline</div>':`<div><strong>${x.r}%</strong> retained</div><div class="bar"><i style="width:${x.r}%"></i></div><small>${x.keep} returners</small>`}</div>`).join('')}</div></div>`;status('Retention history loaded.','ok')}
async function load(){const t=state.teams[+$('team').value];if(!t)return;const y=+$('year').value,b=+$('compare').value,token=++state.token;status(`Loading ${t.displayName} ${y} and ${b} rosters…`);$('hero').innerHTML=`<div class="hero"><img src="${esc(t.logos?.[0]?.href||'')}" alt=""><div><h2>${esc(t.displayName)}</h2><div class="muted">${y} → ${b} · ESPN game-roster-derived season comparison</div></div></div>`;try{const [a,bb]=await Promise.all([roster(t.id,y),roster(t.id,b)]);if(token!==state.token)return;state.a=a;state.b=bb;state.stats.clear();setPositions();summary();render();status('Rosters loaded from actual game competitor rosters.','ok')}catch(e){status('Load failed: '+e.message,'error')}}
async function loadStats(){const y=+$('year').value,ps=filtered(state.a);status(`Loading ${y} stats for ${ps.length} visible players…`);await mapLimit(ps,8,async p=>{const u=`https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/${y}/athletes/${p.id}/statistics`;try{state.stats.set(p.id,await api(u))}catch{state.stats.set(p.id,{})}});render();status('Player stats loaded for visible roster.','ok')}
for(let y=current;y>=2002;y--){$('year').insertAdjacentHTML('beforeend',`<option value="${y}">${y}</option>`);$('compare').insertAdjacentHTML('beforeend',`<option value="${y}">${y}</option>`)}$('year').value=String(current-1);$('compare').value=String(current);
$('load').onclick=load;$('statsBtn').onclick=loadStats;$('team').onchange=load;$('year').onchange=()=>{if(+$('compare').value<=+$('year').value)$('compare').value=String(Math.min(current,+$('year').value+1));load()};$('compare').onchange=load;$('q').oninput=render;$('pos').onchange=render;
$('modalClose').onclick=()=>$('modal').classList.add('hide');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hide')};document.querySelectorAll('[data-mtab]').forEach(b=>b.onclick=()=>{modalTab=b.dataset.mtab;renderModal()});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const scope=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('teamSubtabs').classList.toggle('hide',scope==='dashboard');state.tab=scope==='dashboard'?'dashboard':(state.teamTab||'roster');render()});document.querySelectorAll('[data-subtab]').forEach(b=>b.onclick=()=>{state.teamTab=b.dataset.subtab;state.tab=state.teamTab;document.querySelectorAll('[data-subtab]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});
teams();
</script></body></html>
