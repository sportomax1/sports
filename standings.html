<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standings Lab</title>
<style>
:root{--bg:#07101b;--panel:#0e1928;--panel2:#132238;--line:#263a55;--muted:#91a4bd;--gold:#f4b400;--good:#257942;--bad:#922c2c}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:#fff;font:14px system-ui,-apple-system,sans-serif}h1{margin:0}h2{margin:18px 0 8px}.muted{color:var(--muted)}button,select,input{background:var(--panel2);color:#fff;border:1px solid #345;border-radius:8px;padding:9px;margin:3px}button{cursor:pointer}button.active{background:var(--gold);color:#111;border-color:var(--gold)}.tabs,.controls{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:10px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.hidden{display:none}.wrap{overflow:auto;max-height:72vh}table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel)}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{position:sticky;top:0;background:var(--panel2);z-index:3}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#101d2e;z-index:2}th:first-child{z-index:4}.team{display:flex;align-items:center;gap:7px}.team img{width:26px;height:26px;object-fit:contain}.heat{text-align:center!important;font-weight:800}.legend{display:flex;align-items:center;gap:8px;color:var(--muted)}.gradient{width:160px;height:12px;border-radius:9px;background:linear-gradient(90deg,var(--bad),#88721f,var(--good))}.good{color:#7ee787}.bad{color:#ff7b72}.summary{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.stat{background:#101d2e;border:1px solid var(--line);border-radius:9px;padding:9px 12px}.stat b{display:block;font-size:18px}.error{color:#ff9b96}
</style></head><body>
<h1>Standings Lab</h1><div class="muted">NFL · NBA · MLB · NHL — standings, history, playoffs and streaks</div>
<div id="sports" class="tabs"></div>
<div id="tabs" class="tabs"><button data-view="standings" class="active">Standings</button><button data-view="history">League History</button><button data-view="playoffs">Playoffs</button><button data-view="streaks">Streaks</button></div>
<section id="view-standings"><div class="controls"><label>Season <select id="season"></select></label><label>Scope <select id="scope"><option value="division">Division</option><option value="conference">Conference</option><option value="league">League</option></select></label><input id="filter" placeholder="Filter team"><button id="refresh">Refresh</button></div><div id="status" class="muted"></div><div id="standOut" class="wrap"></div></section>
<section id="view-history" class="hidden"><div class="card"><div class="controls"><label>From <select id="hFrom"></select></label><label>To <select id="hTo"></select></label><label>Metric <select id="hMetric"><option value="rank">League Rank</option><option value="pct">Win / Points %</option><option value="wins">Wins</option><option value="diff">Differential</option></select></label><button id="historyBtn">Build History</button></div><div class="legend">Worse <div class="gradient"></div> Better</div></div><div id="histStatus" class="muted"></div><div id="histOut" class="wrap"></div></section>
<section id="view-playoffs" class="hidden"><div class="card"><div class="controls"><label>From <select id="pFrom"></select></label><label>To <select id="pTo"></select></label><button id="playBtn">Load Playoff Records</button></div><div class="muted">Calculated from completed ESPN postseason game results.</div></div><div id="playStatus" class="muted"></div><div id="playOut" class="wrap"></div></section>
<section id="view-streaks" class="hidden"><div class="card"><div class="controls"><label>From <select id="sFrom"></select></label><label>To <select id="sTo"></select></label><label>Games <select id="sType"><option value="both">Regular + Playoffs</option><option value="2">Regular only</option><option value="3">Playoffs only</option></select></label><label>Streak <select id="sKind"><option value="both">Wins + Losses</option><option value="W">Wins</option><option value="L">Losses</option></select></label><label>Minimum <input id="sMin" type="number" min="2" value="5" style="width:65px"></label><button id="streakBtn">Find Streaks</button></div><div class="muted">Chronological results are joined across selected seasons, so a run may cross the regular season, playoffs, and offseason.</div></div><div id="streakStatus" class="muted"></div><div id="streakOut" class="wrap"></div></section>
<script>
'use strict';
const LEAGUES={NFL:{cat:'football',league:'nfl'},NBA:{cat:'basketball',league:'nba'},MLB:{cat:'baseball',league:'mlb'},NHL:{cat:'hockey',league:'nhl'}};
const $=id=>document.getElementById(id);let sport=localStorage.getItem('standingsSport')||'NFL',standings=[],cache=new Map();
function currentSeason(sp=sport){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;if(sp==='MLB')return y;return m<7?y-1:y}
function seasonLabel(y,sp=sport){return sp==='NBA'||sp==='NHL'?`${y}-${String(y+1).slice(-2)}`:String(y)}
function seasons(sp=sport){const a=[];for(let y=currentSeason(sp);y>=2002;y--)a.push(y);return a}
function stats(entry){const m={};for(const s of entry.stats||[]){m[s.name]=s.displayValue??s.value;m['_'+s.name]=Number(s.value);if(s.abbreviation)m[s.abbreviation]=s.displayValue??s.value}return m}
function num(m,k,d=0){const raw=m['_'+k];if(Number.isFinite(raw))return raw;const v=parseFloat(m[k]);return Number.isFinite(v)?v:d}
function flatten(node,path=[]){let out=[];if(node&&node.standings&&Array.isArray(node.standings.entries))for(const e of node.standings.entries)out.push({e,path:[...path]});for(const c of node.children||[])out=out.concat(flatten(c,path.concat(c.name||c.abbreviation||'Group')));return out}
async function fetchJSON(url){const r=await fetch(url);if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
async function seasonData(sp,y){const key=`stand:${sp}:${y}`;if(cache.has(key))return cache.get(key);const x=LEAGUES[sp],j=await fetchJSON(`https://site.api.espn.com/apis/v2/sports/${x.cat}/${x.league}/standings?season=${y}`),v=flatten({children:j.children||[]});cache.set(key,v);return v}
function pct(row,sp=sport){const m=stats(row.e);if(sp==='NHL'){const p=num(m,'pointsPercentage',NaN);if(Number.isFinite(p))return p;const gp=num(m,'gamesPlayed',num(m,'wins')+num(m,'losses')+num(m,'otLosses'));return num(m,'points')/Math.max(1,gp*2)}const p=num(m,'winPercent',NaN);if(Number.isFinite(p))return p;const w=num(m,'wins'),l=num(m,'losses'),t=num(m,'ties');return(w+.5*t)/Math.max(1,w+l+t)}
function diff(row){const m=stats(row.e);return num(m,'pointDifferential',num(m,'differential',num(m,'pointsFor')-num(m,'pointsAgainst')))}
function sorter(sp=sport){return(a,b)=>{const A=stats(a.e),B=stats(b.e);if(sp==='NHL')return num(B,'points')-num(A,'points')||pct(b,sp)-pct(a,sp)||num(B,'regulationWins')-num(A,'regulationWins')||num(B,'regulationOvertimeWins')-num(A,'regulationOvertimeWins')||num(B,'wins')-num(A,'wins')||diff(b)-diff(a);return pct(b,sp)-pct(a,sp)||diff(b)-diff(a)}}
function heat(v){v=Math.max(0,Math.min(1,v));return`background:hsl(${v*120} 55% 30%);color:#fff`}
function group(row,scope){const p=row.path||[];if(scope==='league')return sport;if(scope==='division')return p.length?p[p.length-1]:'Division';return p.length?p[0]:'Conference'}
function columns(){if(sport==='NHL')return[['GP','gamesPlayed'],['W','wins'],['L','losses'],['OTL','otLosses'],['PTS','points'],['P%','pointsPercentage'],['RW','regulationWins'],['ROW','regulationOvertimeWins'],['GF','pointsFor'],['GA','pointsAgainst'],['DIFF','differential'],['STRK','streak']];if(sport==='NFL')return[['W','wins'],['L','losses'],['T','ties'],['PCT','winPercent'],['PF','pointsFor'],['PA','pointsAgainst'],['DIFF','pointDifferential'],['STRK','streak']];if(sport==='NBA')return[['W','wins'],['L','losses'],['PCT','winPercent'],['GB','gamesBehind'],['HOME','home'],['AWAY','road'],['PPG','avgPointsFor'],['OPP','avgPointsAgainst'],['DIFF','differential'],['STRK','streak']];return[['W','wins'],['L','losses'],['PCT','winPercent'],['GB','gamesBehind'],['HOME','home'],['AWAY','road'],['RS','pointsFor'],['RA','pointsAgainst'],['DIFF','differential'],['L10','lastTenGames'],['STRK','streak']]}
function fillControls(){const h=seasons().map(y=>`<option value="${y}">${seasonLabel(y)}</option>`).join('');for(const id of ['season','hFrom','hTo','pFrom','pTo','sFrom','sTo'])$(id).innerHTML=h;const from=Math.max(2002,currentSeason()-9);for(const id of ['hFrom','pFrom','sFrom'])$(id).value=from;for(const id of ['hTo','pTo','sTo'])$(id).value=currentSeason()}
function drawSportButtons(){$('sports').innerHTML=Object.keys(LEAGUES).map(s=>`<button data-sport="${s}" class="${s===sport?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-sport]').forEach(b=>b.addEventListener('click',()=>{sport=b.dataset.sport;localStorage.setItem('standingsSport',sport);drawSportButtons();fillControls();loadStandings()}))}
async function loadStandings(){$('status').textContent='Loading…';$('standOut').innerHTML='';try{standings=await seasonData(sport,Number($('season').value));renderStandings();$('status').textContent=`${standings.length} teams loaded${sport==='NHL'?' · NHL sorted by standings points':''}`}catch(e){$('status').innerHTML=`<span class="error">Standings failed: ${e.message}</span>`}}
function renderStandings(){const scope=$('scope').value,q=$('filter').value.trim().toLowerCase(),groups={};for(const row of standings){if(!(row.e.team.displayName||'').toLowerCase().includes(q))continue;const k=group(row,scope);(groups[k]??=[]).push(row)}const cs=columns();$('standOut').innerHTML=Object.entries(groups).map(([name,rows])=>{rows.sort(sorter());return`<h2>${name}</h2><table><thead><tr><th>Team</th><th>Rank</th>${cs.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>{const m=stats(r.e),t=r.e.team,v=rows.length>1?1-i/(rows.length-1):1;return`<tr><td><div class="team"><img src="${t.logos?.[0]?.href||''}" alt=""><b>${t.displayName}</b></div></td><td class="heat" style="${heat(v)}">${i+1}/${rows.length}</td>${cs.map(c=>`<td>${m[c[1]]??m[c[0]]??'—'}</td>`).join('')}</tr>`}).join('')}</tbody></table>`}).join('')||'<div class="muted">No matching teams.</div>'}
function span(a,b){a=Number(a);b=Number(b);if(a>b)[a,b]=[b,a];const ys=[];for(let y=a;y<=b;y++)ys.push(y);return ys}
async function buildHistory(){const ys=span($('hFrom').value,$('hTo').value),metric=$('hMetric').value;$('histStatus').textContent=`Loading ${ys.length} seasons…`;$('histOut').innerHTML='';try{const packs=await Promise.all(ys.map(y=>seasonData(sport,y))),teams=new Map(),maps=[];for(const pack of packs){const ranked=[...pack].sort(sorter()),map=new Map();ranked.forEach((r,i)=>{const id=String(r.e.team.id);teams.set(id,{name:r.e.team.displayName,logo:r.e.team.logos?.[0]?.href||''});map.set(id,{row:r,rank:i+1,total:ranked.length,norm:ranked.length>1?1-i/(ranked.length-1):1})});maps.push(map)}const ids=[...teams.keys()].sort((a,b)=>avgNorm(b)-avgNorm(a));function avgNorm(id){const z=maps.map(m=>m.get(id)).filter(Boolean);return z.length?z.reduce((s,x)=>s+x.norm,0)/z.length:0}$('histOut').innerHTML=`<table><thead><tr><th>Team</th>${ys.map(y=>`<th>${seasonLabel(y)}</th>`).join('')}<th>Avg %ile</th></tr></thead><tbody>${ids.map(id=>{const t=teams.get(id),zs=maps.map(m=>m.get(id)),avg=avgNorm(id);return`<tr><td><div class="team"><img src="${t.logo}" alt=""><b>${t.name}</b></div></td>${zs.map(z=>{if(!z)return'<td>—</td>';const m=stats(z.row.e),value=metric==='rank'?`${z.rank}/${z.total}`:metric==='pct'?`${(pct(z.row)*100).toFixed(1)}%`:metric==='wins'?num(m,'wins'):Math.round(diff(z.row));return`<td class="heat" style="${heat(z.norm)}" title="Rank ${z.rank}/${z.total}">${value}</td>`}).join('')}<td class="heat" style="${heat(avg)}">${Math.round(avg*100)}%</td></tr>`}).join('')}</tbody></table>`;$('histStatus').textContent='Loaded.'}catch(e){$('histStatus').innerHTML=`<span class="error">History failed: ${e.message}</span>`}}
function scoreboardRange(sp,y,type){if(sp==='NFL')return null;if(sp==='MLB')return type===2?[`${y}0320`,`${y}1005`]:[`${y}1001`,`${y}1201`];const start=type===2?`${y}0901`:`${y+1}0401`,end=type===2?`${y+1}0501`:`${y+1}0701`;return[start,end]}
async function scoreboard(sp,y,type){const key=`games:${sp}:${y}:${type}`;if(cache.has(key))return cache.get(key);const x=LEAGUES[sp];let events=[];if(sp==='NFL'){const maxWeek=type===2?18:5;for(let w=1;w<=maxWeek;w++){const j=await fetchJSON(`https://site.api.espn.com/apis/site/v2/sports/${x.cat}/${x.league}/scoreboard?season=${y}&seasontype=${type}&week=${w}&limit=100`);events.push(...(j.events||[]))}}else{const [a,b]=scoreboardRange(sp,y,type),j=await fetchJSON(`https://site.api.espn.com/apis/site/v2/sports/${x.cat}/${x.league}/scoreboard?dates=${a}-${b}&seasontype=${type}&limit=2000`);events.push(...(j.events||[]))}const seen=new Set(),games=[];for(const e of events){if(seen.has(e.id)||!e.status?.type?.completed)continue;seen.add(e.id);const c=e.competitions?.[0]?.competitors||[];if(c.length!==2)continue;const A=c[0],B=c[1],as=Number(A.score),bs=Number(B.score);if(!Number.isFinite(as)||!Number.isFinite(bs))continue;games.push({id:e.id,date:new Date(e.date),season:y,type,teams:[make(A,B,as,bs),make(B,A,bs,as)]})}function make(a,b,score,oppScore){return{id:String(a.team.id),name:a.team.displayName,logo:a.team.logo||'',score,oppScore,opp:b.team.displayName,result:score>oppScore?'W':score<oppScore?'L':'T'}}games.sort((a,b)=>a.date-b.date);cache.set(key,games);return games}
async function buildPlayoffs(){const ys=span($('pFrom').value,$('pTo').value);$('playStatus').textContent=`Loading ${ys.length} postseasons…`;$('playOut').innerHTML='';try{const packs=await Promise.all(ys.map(y=>scoreboard(sport,y,3))),map=new Map();packs.forEach((games,i)=>games.forEach(g=>g.teams.forEach(t=>{const r=map.get(t.id)||{name:t.name,logo:t.logo,g:0,w:0,l:0,t:0,pf:0,pa:0,seasons:new Set()};r.g++;r.pf+=t.score;r.pa+=t.oppScore;r.seasons.add(ys[i]);if(t.result==='W')r.w++;else if(t.result==='L')r.l++;else r.t++;map.set(t.id,r)})));const rows=[...map.values()].sort((a,b)=>(b.w/Math.max(1,b.g))-(a.w/Math.max(1,a.g))||b.w-a.w);$('playOut').innerHTML=rows.length?`<table><thead><tr><th>Team</th><th>Playoff Seasons</th><th>G</th><th>W</th><th>L</th><th>T</th><th>Win %</th><th>PF/G</th><th>PA/G</th><th>Diff/G</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="team"><img src="${r.logo}" alt=""><b>${r.name}</b></div></td><td>${r.seasons.size}</td><td>${r.g}</td><td>${r.w}</td><td>${r.l}</td><td>${r.t}</td><td>${(100*r.w/Math.max(1,r.g)).toFixed(1)}%</td><td>${(r.pf/r.g).toFixed(1)}</td><td>${(r.pa/r.g).toFixed(1)}</td><td>${((r.pf-r.pa)/r.g).toFixed(1)}</td></tr>`).join('')}</tbody></table>`:'<div class="muted">No completed postseason games found for this range.</div>';$('playStatus').textContent=`${packs.reduce((n,x)=>n+x.length,0)} completed playoff games loaded.`}catch(e){$('playStatus').innerHTML=`<span class="error">Playoffs failed: ${e.message}</span>`}}
async function buildStreaks(){const ys=span($('sFrom').value,$('sTo').value),kind=$('sKind').value,min=Math.max(2,Number($('sMin').value)||5),types=$('sType').value==='both'?[2,3]:[Number($('sType').value)];$('streakStatus').textContent='Loading game results…';$('streakOut').innerHTML='';try{const requests=[];for(const y of ys)for(const type of types)requests.push(scoreboard(sport,y,type));const packs=await Promise.all(requests),byTeam=new Map();packs.flat().forEach(g=>g.teams.forEach(t=>{const arr=byTeam.get(t.id)||[];arr.push({...t,date:g.date,season:g.season,type:g.type});byTeam.set(t.id,arr)}));const streaks=[];for(const games of byTeam.values()){games.sort((a,b)=>a.date-b.date);let run=null;const flush=()=>{if(run&&run.length>=min&&(kind==='both'||kind===run.kind))streaks.push(run);run=null};for(const g of games){if(g.result==='T'){flush();continue}if(!run||run.kind!==g.result){flush();run={team:g.name,logo:g.logo,kind:g.result,length:1,start:g.date,end:g.date,startSeason:g.season,endSeason:g.season,startOpp:g.opp,endOpp:g.opp}}else{run.length++;run.end=g.date;run.endSeason=g.season;run.endOpp=g.opp}}flush()}streaks.sort((a,b)=>b.length-a.length||a.start-b.start);$('streakOut').innerHTML=streaks.length?`<table><thead><tr><th>Team</th><th>Type</th><th>Games</th><th>Start</th><th>End</th><th>Span</th><th>Start Opp</th><th>End Opp</th></tr></thead><tbody>${streaks.map(s=>`<tr><td><div class="team"><img src="${s.logo}" alt=""><b>${s.team}</b></div></td><td class="${s.kind==='W'?'good':'bad'}"><b>${s.kind==='W'?'WIN':'LOSS'}</b></td><td><b>${s.length}</b></td><td>${s.start.toLocaleDateString()}</td><td>${s.end.toLocaleDateString()}</td><td>${seasonLabel(s.startSeason)}${s.startSeason!==s.endSeason?' → '+seasonLabel(s.endSeason):''}</td><td>${s.startOpp}</td><td>${s.endOpp}</td></tr>`).join('')}</tbody></table>`:`<div class="muted">No streaks of ${min}+ games found.</div>`;$('streakStatus').textContent=`${streaks.length} qualifying streaks found.`}catch(e){$('streakStatus').innerHTML=`<span class="error">Streak search failed: ${e.message}</span>`}}
function setView(name){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));for(const n of ['standings','history','playoffs','streaks'])$(`view-${n}`).classList.toggle('hidden',n!==name)}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));$('scope').addEventListener('change',renderStandings);$('filter').addEventListener('input',renderStandings);$('season').addEventListener('change',loadStandings);$('refresh').addEventListener('click',()=>{cache.delete(`stand:${sport}:${$('season').value}`);loadStandings()});$('historyBtn').addEventListener('click',buildHistory);$('playBtn').addEventListener('click',buildPlayoffs);$('streakBtn').addEventListener('click',buildStreaks);
drawSportButtons();fillControls();loadStandings();
</script></body></html>
