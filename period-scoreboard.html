<script>
(()=>{'use strict';
const L=[
 {id:'nfl',label:'NFL',sport:'football',league:'nfl',kind:'quarter',logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png'},
 {id:'nba',label:'NBA',sport:'basketball',league:'nba',kind:'quarter',logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png'},
 {id:'mlb',label:'MLB',sport:'baseball',league:'mlb',kind:'inning',logo:'https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png'},
 {id:'nhl',label:'NHL',sport:'hockey',league:'nhl',kind:'period',logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nhl.png'},
 {id:'ncaaf',label:'NCAAF',sport:'football',league:'college-football',kind:'quarter',college:true,groups:'80',logo:'https://a.espncdn.com/i/espn/misc_logos/500/ncaa.png'},
 {id:'ncaam',label:'NCAAM',sport:'basketball',league:'mens-college-basketball',kind:'half',college:true,groups:'50',logo:'https://a.espncdn.com/i/espn/misc_logos/500/ncaa.png'}
],E=id=>document.getElementById(id),els={leagues:E('leagues'),date:E('date'),prev:E('prev'),next:E('next'),today:E('today'),status:E('status'),games:E('games')};
let league=L[0],selectedLeagues=new Set(['nfl']),cache=new Map(),token=0,view='games',analysis='period',snapPeriod=1,snapSort='pf',snapDir=-1,seasonData=null;
const summaryCache=new Map();let boxRequest=0,boxCurrent=null,boxTeamId='';
try{let saved=JSON.parse(localStorage.getItem('period-scoreboard-leagues')||'null');if(Array.isArray(saved)){let valid=saved.filter(id=>L.some(l=>l.id===id));if(valid.length)selectedLeagues=new Set(valid)}}catch(_){}
const localDate=()=>{let d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,10)},ymd=s=>s.replaceAll('-',''),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function saveLeagues(){try{localStorage.setItem('period-scoreboard-leagues',JSON.stringify([...selectedLeagues]))}catch(_){}}
function drawLeagueFilters(){
 let snapshot=view==='snapshot',allSelected=selectedLeagues.size===L.length;
 els.leagues.innerHTML=(snapshot?'':'<button type="button" class="league leagueAll'+(allSelected?' on':'')+'" data-id="all" aria-pressed="'+allSelected+'" title="Select all six leagues">ALL</button>')+
 L.map(l=>{let on=snapshot?league.id===l.id:selectedLeagues.has(l.id);return '<button type="button" class="league'+(on?' on':'')+'" data-id="'+l.id+'" aria-pressed="'+on+'" title="'+(snapshot?'View '+l.label+' season assessment':'Toggle '+l.label+' scores')+'"><img class="leagueLogo" src="'+esc(l.logo)+'" alt="" loading="lazy" onerror="this.remove()"><span class="leagueLabel">'+l.label+'</span></button>'}).join('');
 E('leagueHint').textContent=snapshot?'Season assessment uses one league at a time. Select a league above.':'Select multiple leagues to combine scores, or choose ALL for every league.';
}
drawLeagueFilters();
els.leagues.onclick=e=>{
 let b=e.target.closest('button[data-id]');if(!b)return;let id=b.dataset.id;
 if(view==='snapshot'){let next=L.find(l=>l.id===id);if(!next||next===league)return;league=next;snapPeriod=1;drawLeagueFilters();renderSegments();load();return}
 if(id==='all'){selectedLeagues=new Set(L.map(l=>l.id))}
 else if(selectedLeagues.has(id)){if(selectedLeagues.size===1)return;selectedLeagues.delete(id)}
 else if(L.some(l=>l.id===id))selectedLeagues.add(id);
 else return;
 league=activeLeagues()[0];saveLeagues();drawLeagueFilters();load();
};

function apiUrl(d,l=league){return 'https://site.api.espn.com/apis/site/v2/sports/'+l.sport+'/'+l.league+'/scoreboard?dates='+ymd(d)+'&limit='+(l.college?500:100)+(l.groups?'&groups='+l.groups:'')}
function seasonUrl(y){return 'https://site.api.espn.com/apis/site/v2/sports/'+league.sport+'/'+league.league+'/scoreboard?dates='+y+'&limit='+(league.college?1000:500)+(league.groups?'&groups='+league.groups:'')}
async function get(u){if(cache.has(u))return cache.get(u);let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('ESPN HTTP '+r.status);let j=await r.json();cache.set(u,j);return j}
async function move(n){
 let mine=++token,d=new Date(els.date.value+'T12:00:00'),selected=activeLeagues();
 els.prev.disabled=true;els.next.disabled=true;
 els.status.textContent='Finding '+(n<0?'previous':'next')+' game day across '+selected.map(l=>l.label).join(', ')+'…';
 try{
  for(let i=0;i<60;i++){
   d.setDate(d.getDate()+n);let ds=d.toISOString().slice(0,10);
   let settled=await Promise.allSettled(selected.map(l=>get(apiUrl(ds,l))));
   if(mine!==token)return;
   let results=selected.map((config,i)=>({config,j:settled[i].status==='fulfilled'?settled[i].value:null,error:settled[i].status==='rejected'?settled[i].reason:null}));
   if(results.some(r=>(r.j?.events||[]).length)){els.date.value=ds;renderGamesDay(results);return}
   if(results.every(r=>r.error)){els.status.innerHTML='<span class="error">Could not reach ESPN for any selected league.</span>';return}
  }
  els.status.textContent='No games found in the selected leagues within 60 days.';
 }catch(e){if(mine!==token)return;els.status.innerHTML='<span class="error">'+esc(e.message)+'</span>'}
 finally{els.prev.disabled=false;els.next.disabled=false}
}
els.prev.onclick=()=>move(-1);els.next.onclick=()=>move(1);els.today.onclick=()=>{els.date.value=localDate();load()};els.date.onchange=load;
function scoreVal(x){let v=x?.score?.value??x?.score;return Number.isFinite(+v)?+v:0}

function maxPeriod(comp,teams){let p=+(comp?.status?.period||0);for(let t of teams)for(let x of lines(t))p=Math.max(p,x.p);return p}
function labels(kind,n){if(kind==='inning')return Array.from({length:Math.max(9,n)},(_,i)=>String(i+1));if(kind==='half')return n<=2?['H1','H2']:Array.from({length:n},(_,i)=>i<2?'H'+(i+1):'OT'+(i-1));if(kind==='period')return Array.from({length:Math.max(3,n)},(_,i)=>i<3?'P'+(i+1):i===3?'OT':'SO');return Array.from({length:Math.max(4,n)},(_,i)=>i<4?'Q'+(i+1):'OT'+(i-3))}

function openTeamLog(id){if(!seasonData)return;let games=[];let tm=null;for(let ev of seasonData.events||[]){let c=ev.competitions?.[0],ts=c?.competitors||[],t=ts.find(x=>teamId(x)===id);if(!t)continue;tm=t.team||tm;let opp=ts.find(x=>x!==t),complete=!!c?.status?.type?.completed,pf=scoreVal(t),pa=scoreVal(opp),margin=pf-pa,res=complete?(margin>0?'W':margin<0?'L':'T'):'–',date=new Date(ev.date||c.date||0),d=Number.isNaN(+date)?'':date.toLocaleDateString(undefined,{month:'short',day:'numeric'}),close=complete&&Math.abs(margin)<=closeLimit();games.push({date:d,opp:opp?.team||{},home:t.homeAway==='home',pf,pa,res,margin,close,status:c?.status?.type?.shortDetail||''})}games.sort((a,b)=>0);let title=tm?.displayName||tm?.shortDisplayName||'Team';E('modalTeam').innerHTML=(tm?.logo?'<img src="'+esc(tm.logo)+'" alt="">':'')+'<div>'+esc(title)+'<div style="font-size:12px;color:var(--muted);font-weight:700">'+esc(E('season').value)+' season · '+games.length+' games</div></div>';E('modalBody').innerHTML=games.length?'<div class="logrow head"><div>DATE</div><div>OPP</div><div>R</div><div>SCORE</div><div>MARG</div></div>'+games.map(g=>'<div class="logrow"><div>'+esc(g.date)+'</div><div class="opponent">'+(g.opp.logo?'<img src="'+esc(g.opp.logo)+'" alt="">':'')+'<span>'+(g.home?'vs ':'@ ')+esc(g.opp.abbreviation||g.opp.shortDisplayName||'Opponent')+(g.close?' · CLOSE':'')+'</span></div><div class="wl '+(g.res==='W'?'w':g.res==='L'?'l':'')+'">'+g.res+'</div><div>'+g.pf+'-'+g.pa+'</div><div>'+(g.margin>0?'+':'')+g.margin+'</div></div>').join(''):'<div class="empty">No games found for this season.</div>';E('teamModal').showModal()}
E('modalClose').onclick=()=>E('teamModal').close();E('teamModal').onclick=e=>{if(e.target===E('teamModal'))E('teamModal').close()};els.games.addEventListener('click',e=>{let b=e.target.closest('[data-team]');if(b)openTeamLog(b.dataset.team)});els.games.addEventListener('keydown',e=>{let b=e.target.closest('[data-team]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTeamLog(b.dataset.team)}});
function rank(t,l=league){if(!l.college)return'';let r=+(t?.curatedRank?.current||0);return r>=1&&r<=25?r:''}
function gameCard(ev,l=league){
 let c=ev.competitions?.[0]||{},teams=(c.competitors||[]).slice().sort((a,b)=>(a.homeAway==='away'?0:1)-(b.homeAway==='away'?0:1)),mp=maxPeriod(c,teams),labs=labels(l.kind,mp),st=c.status||ev.status||{},state=st.type?.state||'',detail=st.type?.shortDetail||st.type?.detail||'',complete=!!st.type?.completed;
 let scores=teams.map(scoreVal),mx=Math.max(...scores),tie=scores.length>1&&scores.every(x=>x===scores[0]);
 let head='<div class="gamehead"><span>'+esc(ev.shortName||ev.name||l.label)+'</span><span class="gameState '+(state==='in'?'live':complete?'final':'')+'">'+esc(detail)+'</span><span class="viewstats">PLAYER STATS ›</span></div>';
 let h='<div class="tablewrap"><div class="scoregrid" style="--cols:'+labs.length+'"><div class="cell hdr team">TEAM</div>'+labs.map(x=>'<div class="cell hdr">'+x+'</div>').join('')+'<div class="cell hdr">FINAL</div>';
 for(let t of teams){let win=complete&&!tie&&scoreVal(t)===mx,tm=t.team||{},r=rank(t,l);h+='<div class="cell team'+(win?' winner':'')+'">'+(logo(t)?'<img src="'+esc(logo(t))+'" alt="">':'')+'<span class="teamname">'+(r?'<span class="rank">#'+r+' </span>':'')+esc(tm.abbreviation||tm.shortDisplayName||tm.displayName||'Team')+'</span></div>'+labs.map((_,i)=>'<div class="cell">'+valueAt(t,i+1)+'</div>').join('')+'<div class="cell total'+(win?' winner':'')+'">'+scoreVal(t)+'</div>'}

}

function gameSummaryUrl(l,eventId){return 'https://site.api.espn.com/apis/site/v2/sports/'+l.sport+'/'+l.league+'/summary?event='+encodeURIComponent(eventId)}
async function getGameSummary(l,eventId,live){
 let u=gameSummaryUrl(l,eventId),entry=summaryCache.get(u),ttl=live?15000:600000;
 if(entry&&Date.now()-entry.time<ttl)return entry.data;
 let response=await fetch(u,{cache:'no-store'});if(!response.ok)throw Error('ESPN HTTP '+response.status);
 let data=await response.json();summaryCache.set(u,{time:Date.now(),data});return data
}
function safePhoto(url){
 try{let u=new URL(url);return u.protocol==='https:'?esc(u.href):''}catch(_){return''}
}
function athletePhoto(a,config){
 let raw=a?.headshot?.href||a?.headshot?.url||a?.headshot||'';
 if(typeof raw!=='string')raw='';
 return safePhoto(raw)
}
function initials(name){let parts=String(name||'?').trim().split(/\s+/);return parts.length>1?(parts[0][0]+parts[parts.length-1][0]).toUpperCase():parts[0].slice(0,2).toUpperCase()}
function playerFace(a){
 let name=a?.displayName||a?.fullName||a?.shortName||a?.name||'Player',url=athletePhoto(a);
 return '<div class="playerFace"><span>'+esc(initials(name))+'</span>'+(url?'<img src="'+url+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</div>';
}
function summaryTeams(s){
 let headerTeams=s?.header?.competitions?.[0]?.competitors||[];
 let scoreTeams=s?.boxscore?.teams||[];
 let playerGroups=s?.boxscore?.players||[];
 let teamMap=new Map();
 for(let c of headerTeams){
  let t=c.team||{},id=String(t.id||c.id||'');
  if(id)teamMap.set(id,{...t,id,logo:t.logo||t.logos?.[0]?.href||'',score:c.score,homeAway:c.homeAway});
 }
 for(let source of [...scoreTeams,...playerGroups]){
  let t=source.team||{},id=String(t.id||'');if(!id)continue;
  let prev=teamMap.get(id)||{};
  teamMap.set(id,{...prev,...t,id,logo:t.logo||t.logos?.[0]?.href||prev.logo||'',score:prev.score??source.score});
 }
 return [...teamMap.values()].sort((a,b)=>(a.homeAway==='away'?0:a.homeAway==='home'?1:2)-(b.homeAway==='away'?0:b.homeAway==='home'?1:2))
}
function boxGroupsForTeam(s,id,teams){
 let groups=s?.boxscore?.players||[],matched=groups.filter(g=>String(g.team?.id||'')===String(id));
 if(!matched.length&&groups.length===teams.length){let i=teams.findIndex(t=>String(t.id)===String(id));if(i>=0)matched=[groups[i]]}
 return matched
}
function statSections(groups){
 let sections=[];
 for(let group of groups){
  let categories=Array.isArray(group.statistics)?group.statistics:[];
  for(let cat of categories){
   let athletes=Array.isArray(cat.athletes)?cat.athletes:[];
   if(!athletes.length)continue;
   let labels=Array.isArray(cat.labels)?cat.labels:Array.isArray(cat.names)?cat.names:[];
   let rows=athletes.map(entry=>{
    let a=entry.athlete||entry.player||{},stat=entry.stats||entry.statistics||[];
    if(!Array.isArray(stat))stat=typeof stat==='object'?Object.values(stat):[];
    return {athlete:a,values:stat.map(v=>v==null?'–':typeof v==='object'?(v.displayValue??v.value??'–'):v),note:entry.didNotPlay?'DNP':entry.starter?'Starter':''}
   });
   let widest=Math.max(labels.length,...rows.map(r=>r.values.length),0);
   if(!widest&&rows.every(r=>!r.values.length))continue;
   let headers=Array.from({length:widest},(_,i)=>labels[i]||('STAT '+(i+1)));
   sections.push({name:cat.displayName||cat.name||cat.type||'Player statistics',headers,rows});
  }

}
function renderBoxTable(section){
 let maxColumns=Math.min(section.headers.length,30);
 let header=section.headers.slice(0,maxColumns).map(h=>'<th scope="col">'+esc(h)+'</th>').join('');
 let body=section.rows.map(({athlete,values,note})=>{
  let n=athlete?.displayName||athlete?.fullName||athlete?.shortName||athlete?.name||'Player';
  let pos=athlete?.position?.abbreviation||athlete?.position?.displayName||'';
  let cells=Array.from({length:maxColumns},(_,i)=>'<td>'+esc(values[i]??'–')+'</td>').join('');
  return '<tr><td><div class="statPlayer">'+playerFace(athlete)+'<div class="statPlayerNames"><strong title="'+esc(n)+'">'+esc(n)+'</strong><small>'+esc(pos||note)+'</small></div></div></td>'+cells+'</tr>';
 }).join('');
 return '<section class="boxCategory"><h3>'+esc(section.name)+' <small>'+section.rows.length+' players</small></h3><div class="statScroll" tabindex="0" aria-label="'+esc(section.name)+' statistics, horizontally scrollable"><table class="statTable"><thead><tr><th scope="col">PLAYER</th>'+header+'</tr></thead><tbody>'+body+'</tbody></table></div></section>';

function renderBox(){
 if(!boxCurrent)return;
 let {summary,config,eventId}=boxCurrent,teams=summaryTeams(summary),players=summary?.boxscore?.players||[];
 let selected=teams.find(t=>String(t.id)===String(boxTeamId))||teams[0];

 E('gameModalTeams').innerHTML=teams.map(t=>{
  let on=String(t.id)===String(boxTeamId);
  return '<button type="button" class="boxTeam'+(on?' on':'')+'" data-box-team="'+esc(t.id)+'" aria-pressed="'+on+'">'+(safePhoto(t.logo)?'<img src="'+safePhoto(t.logo)+'" alt="">':'')+'<span>'+esc(t.displayName||t.shortDisplayName||t.abbreviation||'Team')+'</span></button>';
 }).join('');

async function openBoxStats(eventId,leagueId,live){
 let config=L.find(l=>l.id===leagueId);
 if(!config||!/^\d+$/.test(eventId))return;
 let id=++boxRequest;boxCurrent=null;boxTeamId='';
 E('gameModalTitle').textContent='Player Box Score';E('gameModalSubtitle').textContent=config.label;
 E('gameModalOverview').innerHTML='';E('gameModalTeams').innerHTML='';
 E('gameModalBody').innerHTML='<div class="gameLoading">Loading '+esc(config.label)+' player statistics…</div>';
 if(!E('gameModal').open)E('gameModal').showModal();

  let summary=await getGameSummary(config,eventId,live);
  if(id!==boxRequest||!E('gameModal').open)return;
  boxCurrent={summary,config,eventId};renderBox()

  if(id!==boxRequest||!E('gameModal').open)return;
  E('gameModalBody').innerHTML='<div class="gameLoading gameError">Could not retrieve ESPN player statistics: '+esc(err.message)+'</div>';

function periodName(){let a=labels(league.kind,snapPeriod);return a[snapPeriod-1]||('OT'+snapPeriod)}
function snapshotEvents(j){let rows=new Map();for(let ev of j.events||[]){let comp=ev.competitions?.[0],ts=comp?.competitors||[];if(ts.length<2)continue;for(let t of ts){let opp=ts.find(x=>x!==t),ls=lines(t).find(x=>x.p===snapPeriod),os=lines(opp).find(x=>x.p===snapPeriod);if(!ls||!os)continue;let id=String(t.team?.id||t.id||''),r=rows.get(id)||{id,team:t.team||{},rank:rank(t),pf:0,pa:0,g:0};r.pf+=ls.v;r.pa+=os.v;r.g++;rows.set(id,r)}}return[...rows.values()].map(r=>({...r,pf:r.pf/r.g,pa:r.pa/r.g,diff:(r.pf-r.pa)/r.g})).sort((a,b)=>(a[snapSort]-b[snapSort])*snapDir)}

function closeLimit(){return league.id==='nfl'||league.id==='ncaaf'?8:league.id==='nba'||league.id==='ncaam'?5:1}
function closeRows(j){let map=new Map(),lim=closeLimit();for(let ev of j.events||[]){let c=ev.competitions?.[0],ts=c?.competitors||[];if(!c?.status?.type?.completed||ts.length<2)continue;let a=scoreVal(ts[0]),b=scoreVal(ts[1]),margin=Math.abs(a-b);if(margin>lim)continue;for(let t of ts){let id=String(t.team?.id||t.id||''),opp=ts.find(x=>x!==t),r=map.get(id)||{team:t.team||{},g:0,w:0,l:0,t:0,pf:0,pa:0,margin:0};let pf=scoreVal(t),pa=scoreVal(opp);r.g++;r.pf+=pf;r.pa+=pa;r.margin+=Math.abs(pf-pa);if(pf>pa)r.w++;else if(pf<pa)r.l++;else r.t++;map.set(id,r)}}return[...map.values()].sort((a,b)=>(b.w/Math.max(1,b.g))-(a.w/Math.max(1,a.g))||b.g-a.g)}
function renderClose(j){let rows=closeRows(j),lim=closeLimit(),unit=league.id==='nhl'?'goal':league.id==='mlb'?'run':'point';els.status.textContent=league.label+' · '+E('season').value+' · close games ≤ '+lim+' '+unit+(lim===1?'':'s');els.games.innerHTML=rows.length?'<article class="game"><div class="snaprow head" style="--metrics:5"><div class="snapteam">TEAM</div><div class="metric">REC</div><div class="metric">WIN%</div><div class="metric">PF</div><div class="metric">PA</div><div class="metric">MARG</div></div>'+rows.map(r=>'<div class="snaprow" style="--metrics:5">'+teamButton(r.team,String(r.team.id||''))+'<div class="metric">'+r.w+'-'+r.l+(r.t?'-'+r.t:'')+'</div><div class="metric">'+(100*r.w/r.g).toFixed(0)+'%</div><div class="metric">'+(r.pf/r.g).toFixed(1)+'</div><div class="metric">'+(r.pa/r.g).toFixed(1)+'</div><div class="metric">'+(r.margin/r.g).toFixed(1)+'</div></div>').join('')+'</article>':'<div class="empty">No qualifying close games found.</div>'}
function summaryUrl(id){return 'https://site.api.espn.com/apis/site/v2/sports/'+league.sport+'/'+league.league+'/summary?event='+id}
function leaderFromPlay(p){let h=+(p.homeScore??p.homeScoreValue),a=+(p.awayScore??p.awayScoreValue);if(!Number.isFinite(h)||!Number.isFinite(a))return null;return h===a?0:h>a?1:-1}
function countLeadChanges(plays){let last=0,n=0;for(let p of plays||[]){let lead=leaderFromPlay(p);if(!lead)continue;if(last&&lead!==last)n++;last=lead}return n}
async function renderLeads(j,mine){let events=(j.events||[]).filter(ev=>ev.competitions?.[0]?.status?.type?.completed),map=new Map(),covered=0,total=events.length,idx=0,workers=Math.min(12,total||1);async function worker(){while(idx<total){let ev=events[idx++];try{let s=await get(summaryUrl(ev.id));if(mine!==token)return;let plays=s.plays||s.scoringPlays||[],n=countLeadChanges(plays);if(!plays.length)continue;covered++;let ts=ev.competitions?.[0]?.competitors||[];for(let t of ts){let id=String(t.team?.id||t.id||''),r=map.get(id)||{team:t.team||{},g:0,total:0,max:0,five:0,ten:0};r.g++;r.total+=n;r.max=Math.max(r.max,n);if(n>=5)r.five++;if(n>=10)r.ten++;map.set(id,r)}}catch(_){}}}await Promise.all(Array.from({length:workers},worker));if(mine!==token)return;let rows=[...map.values()].sort((a,b)=>(b.total/b.g)-(a.total/a.g));els.status.textContent=league.label+' · '+E('season').value+' · lead changes · coverage '+covered+'/'+total+' completed games';els.games.innerHTML=rows.length?'<article class="game"><div class="snaprow head" style="--metrics:5"><div class="snapteam">TEAM</div><div class="metric">G</div><div class="metric">TOTAL</div><div class="metric">AVG</div><div class="metric">MAX</div><div class="metric">5+</div></div>'+rows.map(r=>'<div class="snaprow" style="--metrics:5">'+teamButton(r.team,String(r.team.id||''))+'<div class="metric">'+r.g+'</div><div class="metric">'+r.total+'</div><div class="metric">'+(r.total/r.g).toFixed(1)+'</div><div class="metric">'+r.max+'</div><div class="metric">'+r.five+'</div></div>').join('')+'</article>':'<div class="empty">No usable play-by-play lead data found for this season.</div>'}

function renderSnapshot(j){let rows=snapshotEvents(j),season=E('season').value;els.status.textContent=league.label+' · '+season+' season · '+periodName()+' averages · '+rows.length+' teams';els.games.innerHTML=rows.length?'<article class="game"><div class="snaprow head"><div class="snapteam">TEAM</div><div class="metric">PF</div><div class="metric">PA</div><div class="metric">DIFF</div></div>'+rows.map(r=>'<div class="snaprow">'+teamButton(r.team,r.id,r.rank?'#'+r.rank+' ':'')+'<div class="metric">'+r.pf.toFixed(1)+'</div><div class="metric">'+r.pa.toFixed(1)+'</div><div class="metric diff '+(r.diff>=0?'pos':'neg')+'">'+(r.diff>0?'+':'')+r.diff.toFixed(1)+'</div></div>').join('')+'</article>':'<div class="empty">No completed '+periodName()+' scoring data on this date.</div>'}
function renderDay(j){if(view==='snapshot'){if(analysis==='close')renderClose(j);else if(analysis==='period')renderSnapshot(j)}}
function renderGamesDay(results){
 let selected=activeLeagues(),multi=selected.length>1,played=results.reduce((n,r)=>n+(r.j?.events?.length||0),0),failed=results.filter(r=>r.error).length;
 els.status.textContent=(multi?selected.length+' leagues':selected[0].label)+' · '+els.date.value+' · '+played+' game'+(played===1?'':'s')+(failed?' · '+failed+' league'+(failed===1?'':'s')+' unavailable':'');
 els.games.innerHTML=results.map(({config,j,error})=>{
  let events=j?.events||[],header=multi?'<div class="leagueHead"><strong>'+esc(config.label)+'</strong><span>'+(error?'Unavailable':events.length+' game'+(events.length===1?'':'s'))+'</span></div>':'';
  let body=error?'<div class="leagueEmpty leagueError">Could not load '+esc(config.label)+' scores from ESPN.</div>':events.length?events.map(ev=>gameCard(ev,config)).join(''):'<div class="leagueEmpty">No '+esc(config.label)+' games on this date.</div>';
  return '<section class="leagueGroup" aria-label="'+esc(config.label)+' scores">'+header+body+'</section>';
 }).join('');
 if(!played&&!failed)els.status.textContent+=' · No games scheduled';
}
async function load(){
 let mine=++token;els.games.innerHTML='';
 if(view==='games'){
  let selected=activeLeagues();
  els.status.textContent='Loading '+selected.map(l=>l.label).join(', ')+' scores · '+els.date.value+'…';
  let settled=await Promise.allSettled(selected.map(l=>get(apiUrl(els.date.value,l))));
  if(mine!==token)return;
  renderGamesDay(selected.map((config,i)=>({config,j:settled[i].status==='fulfilled'?settled[i].value:null,error:settled[i].status==='rejected'?settled[i].reason:null})));
  return;
 }
 els.status.textContent='Loading '+league.label+' '+E('season').value+' season…';
 try{
  let j=await get(seasonUrl(E('season').value));if(mine!==token)return;seasonData=j;
  if(analysis==='leads'){els.status.textContent='Analyzing lead changes across completed games…';await renderLeads(j,mine)}
  else renderDay(j)
 }catch(e){if(mine!==token)return;els.status.innerHTML='<span class="error">'+esc(e.message)+'</span>';els.games.innerHTML='<div class="empty error">Could not load ESPN scoreboard data.</div>'}
}
renderSegments();
load();
})();
