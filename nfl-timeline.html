<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Player Timeline</title>
<style>
:root{--bg:#090d12;--p:#111823;--p2:#172131;--line:#28364a;--txt:#f3f6fa;--mut:#8d9caf;--blue:#4da3ff;--warn:#ffb454;--pw:272px;--rh:42px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:12px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
header{height:78px;background:#0c1119;border-bottom:1px solid var(--line);padding:5px 7px;position:relative;z-index:30}
.row{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow-x:auto;margin-bottom:4px}.brand{font-size:14px;font-weight:900}
button,input,select,label.chip{height:29px;border:1px solid var(--line);border-radius:6px;background:var(--p);color:var(--txt);padding:0 7px}
button{font-weight:750;cursor:pointer}.primary{background:#1676d2;border-color:#1676d2}.chip{display:flex;align-items:center;gap:4px}.mut{color:var(--mut)}.warn{color:var(--warn)}
#status{margin-left:auto;color:var(--mut)}#prog{position:absolute;bottom:0;left:0;right:0;height:2px;background:#172131}#prog i{display:block;height:100%;width:0;background:var(--blue)}
main{height:calc(100vh - 78px);overflow:auto;position:relative}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{height:var(--rh);padding:2px 4px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:47px;background:var(--bg)}
th{height:29px;position:sticky;top:0;z-index:10;background:var(--p2);font-size:10px}.player{position:sticky!important;left:0;z-index:12!important;width:var(--pw);min-width:var(--pw);max-width:var(--pw);text-align:left;border-right:2px solid #40536e}
thead .player{z-index:15!important;background:var(--p2)}.pb{display:grid;grid-template-columns:32px 1fr auto;gap:6px;align-items:center}.photo{width:32px;height:32px;border-radius:50%;object-fit:contain;background:#172131}
.nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta,.metrics{font-size:9px;color:var(--mut)}.metrics{text-align:right}.metrics b{display:block;color:var(--blue);font-size:11px}
.logos{display:flex;justify-content:center;gap:1px}.logo{width:26px;height:26px;object-fit:contain}.logo.m{width:19px;height:19px}.dot{color:#33445a}.empty{padding:50px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<header>
<div class="row">
<b class="brand">NFL TIMELINE v7</b>
<button class="primary" id="scan">Start / Resume</button><button id="pause" disabled>Pause</button>
<label class="chip"><input type="checkbox" id="force"> Refresh loaded years</label>
<span class="mut">Newest → oldest</span><select id="from"></select><span>→</span><select id="to"></select>
<input id="q" placeholder="Player…"><select id="pos"><option value="">All pos</option></select><select id="team"><option value="">All teams</option></select>
<select id="teamMode"><option value="ever">Ever team</option><option value="current">Current team</option><option value="year">Team in year</option></select>
<span id="status">Initializing…</span>
</div>
<div class="row">
<select id="year"><option value="">Any year</option></select><label class="chip"><input type="checkbox" id="present"> Present in year</label>
<label class="chip"><input type="checkbox" id="current"> Current only</label>
<select id="teamN"><option value="">Teams: any</option><option value="1">1 only</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option><option value="5">5+</option></select>
<select id="seasonN"><option value="">Seasons: any</option><option value="1">1</option><option value="2-4">2–4</option><option value="5-9">5–9</option><option value="10-14">10–14</option><option value="15">15+</option></select>
<select id="sort"><option value="name">Name</option><option value="teams">Most teams</option><option value="years">Most seasons</option><option value="debut">Newest debut</option><option value="last">Most recent</option></select>
<button id="all">All years</button><button id="clear">Clear filters</button><button id="reset">Reset cache</button>
<span class="mut">Source: nflverse rosters (weekly 2002+, season-level 1920–2001) + ESPN team season resolver</span>
</div><div id="prog"><i></i></div>
</header>
<main id="main"><table><thead id="head"></thead><tbody id="body"></tbody></table><div class="empty" id="empty">Loads one NFL season at a time, newest first. No all-player preload.</div></main>
<script>
const ESPN_CORE='https://sports.core.api.espn.com/v2/sports/football/leagues/nfl';
const ROSTER_BASE='https://github.com/nflverse/nflverse-data/releases/download';
const TEAM_CSV='https://raw.githubusercontent.com/nflverse/nflverse-pbp/master/teams_colors_logos.csv';
const DB='nflTimelineV7', DBV=1, START=1920, $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
let P=new Map(), TEAMINFO=new Map(), yearsLoaded=[], currentSeason=new Date().getFullYear(), view=[], displayYears=[], running=false, stop=false, showAll=false, renderRAF=0;

function csvParse(text){
 const out=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){let c=text[i];
  if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}
  else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));out.push(row);row=[];cell=''}else cell+=c
 }
 if(cell.length||row.length){row.push(cell.replace(/\r$/,''));out.push(row)}
 if(!out.length)return[];let h=out[0].map(x=>x.trim());
 return out.slice(1).filter(r=>r.some(x=>x!=='')).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])))
}
async function fetchText(url,tries=2){for(let i=0;i<=tries;i++){try{let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);return await r.text()}catch(e){if(i===tries)throw e;await sleep(350*2**i)}}}
async function fetchJSON(url,tries=1){for(let i=0;i<=tries;i++){try{let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);return await r.json()}catch(e){if(i===tries)throw e;await sleep(350*2**i)}}}

function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,DBV);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('players'))d.createObjectStore('players',{keyPath:'id'});if(!d.objectStoreNames.contains('done'))d.createObjectStore('done',{keyPath:'year'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function dbAll(s){let d=await openDB();return new Promise(ok=>{let r=d.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result)})}
async function dbGet(s,k){let d=await openDB();return new Promise(ok=>{let r=d.transaction(s).objectStore(s).get(k);r.onsuccess=()=>ok(r.result)})}
async function dbPut(s,o){let d=await openDB();return new Promise((ok,no)=>{let tx=d.transaction(s,'readwrite');tx.objectStore(s).put(o);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}
async function dbPutMany(s,a){if(!a.length)return;let d=await openDB();return new Promise((ok,no)=>{let tx=d.transaction(s,'readwrite'),os=tx.objectStore(s);a.forEach(x=>os.put(x));tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}

function norm(v){return String(v??'').trim()}
function num(v){let n=+v;return Number.isFinite(n)?n:null}
function playerKey(r){
 let gs=norm(r.gsis_id),pf=norm(r.pfr_id),ep=norm(r.espn_id),sm=norm(r.smart_id),bd=norm(r.birth_date),nm=norm(r.full_name||r.football_name);
 if(gs&&gs!=='NA')return 'gsis:'+gs;if(pf&&pf!=='NA')return 'pfr:'+pf;if(ep&&ep!=='NA')return 'espn:'+ep;if(sm&&sm!=='NA')return 'smart:'+sm;
 return 'name:'+nm.toLowerCase()+'|'+bd
}
function blank(id){return{id,name:'',pos:'',head:'',espnId:'',birth:'',current:false,currentTeam:'',seasons:{},weeks:{}}}
function impossible(r,y){
 let by=norm(r.birth_date).match(/^(\d{4})/)?.[1];if(by&&y-(+by)<18)return true;
 let entry=num(r.entry_year);if(entry&&entry>y+1)return true;
 return false
}
function upsertRow(r,y,maxWeek,isWeekly){
 if(impossible(r,y))return {skipped:true};
 let id=playerKey(r),p=P.get(id)||blank(id),team=norm(r.team);if(!team)return {skipped:true};
 p.name=norm(r.full_name||r.football_name)||p.name;p.pos=norm(r.position)||p.pos;p.birth=norm(r.birth_date)||p.birth;
 let ep=norm(r.espn_id);if(ep&&ep!=='NA')p.espnId=ep;
 let h=norm(r.headshot_url);if(h&&h!=='NA')p.head=h;else if(!p.head&&p.espnId)p.head=`https://a.espncdn.com/i/headshots/nfl/players/full/${p.espnId}.png`;
 let teams=p.seasons[y]||[];if(!teams.includes(team))teams.push(team);p.seasons[y]=teams;
 if(isWeekly){let w=num(r.week)||0;p.weeks[y]=Math.max(p.weeks[y]||0,w);if(y===currentSeason&&w===maxWeek){p.current=true;p.currentTeam=team}}
 else if(y===currentSeason){p.current=true;p.currentTeam=team}
 P.set(id,p);return {id}
}
function removeYear(y){
 for(const [id,p] of P){delete p.seasons[y];delete p.weeks[y];if(y===currentSeason){p.current=false;p.currentTeam=''}if(!Object.keys(p.seasons).length)P.delete(id)}
}
function yearsOf(p){return Object.keys(p.seasons||{}).map(Number).sort((a,b)=>a-b)}
function teamsOf(p){return new Set(Object.values(p.seasons||{}).flat()).size}
function currentTeamOf(p){return p.currentTeam||(p.seasons?.[currentSeason]?.length===1?p.seasons[currentSeason][0]:'')}

async function resolveCurrentSeason(){
 try{let d=await fetchJSON(ESPN_CORE);let y=+(d.season?.year||String(d.season?.$ref||'').match(/\/(\d+)(?:\?.*)?$/)?.[1]);if(y>=START&&y<2100)currentSeason=y}catch{}
}
async function loadTeamInfo(){
 try{let txt=await fetchText(TEAM_CSV),rows=csvParse(txt);for(const r of rows){let a=norm(r.team_abbr);if(a)TEAMINFO.set(a,{abbr:a,name:norm(r.team_name)||a,logo:norm(r.team_logo_espn||r.team_logo_wikipedia)})}}catch(e){console.warn('team graphics failed',e)}
}
function teamInfo(abbr){return TEAMINFO.get(abbr)||{abbr,name:abbr,logo:''}}

async function loadYear(y){
 let weekly=y>=2002, url=weekly
  ?`${ROSTER_BASE}/weekly_rosters/roster_weekly_${y}.csv`
  :`${ROSTER_BASE}/rosters/roster_${y}.csv`;
 let source=weekly?'weekly':'season';
 let text;
 try{text=await fetchText(url,2)}
 catch(e){
  if(weekly){
   source='season-fallback';weekly=false;url=`${ROSTER_BASE}/rosters/roster_${y}.csv`;text=await fetchText(url,2)
  }else throw e
 }
 let rows=csvParse(text);if(!rows.length)throw Error('empty roster file');
 let maxWeek=weekly?Math.max(0,...rows.map(r=>num(r.week)||0)):0;
 removeYear(y);
 let skipped=0,seen=new Set();
 for(const r of rows){let z=upsertRow(r,y,maxWeek,weekly);if(z.skipped)skipped++;else if(z.id)seen.add(z.id)}
 await dbPutMany('players',[...P.values()]);
 await dbPut('done',{year:y,source,maxWeek,rows:rows.length,players:seen.size,skipped,at:Date.now()});
 return {source,maxWeek,rows:rows.length,players:seen.size,skipped}
}

async function scan(){
 if(running)return;running=true;stop=false;$('#scan').disabled=true;$('#pause').disabled=false;
 let hi=+$('#from').value,lo=+$('#to').value;if(hi<lo)[hi,lo]=[lo,hi];let list=[];for(let y=hi;y>=lo;y--)list.push(y);
 for(let i=0;i<list.length&&!stop;i++){let y=list[i],done=await dbGet('done',y);
  if(done&&!$('#force').checked){$('#status').textContent=`${y}: cached ✓`;$('#prog i').style.width=`${(i+1)/list.length*100}%`;continue}
  $('#status').textContent=`${y}: downloading roster…`;
  try{let r=await loadYear(y);$('#status').textContent=`${y}: ${r.players.toLocaleString()} players • ${r.source}${r.skipped?` • ${r.skipped} impossible rows rejected`:''}`}
  catch(e){console.error(y,e);$('#status').textContent=`${y}: FAILED (${e.message})`;break}
  refreshControls();applyFilters(false);$('#prog i').style.width=`${(i+1)/list.length*100}%`;await sleep(20)
 }
 yearsLoaded=[...(await dbAll('done'))].map(x=>x.year).sort((a,b)=>b-a);
 running=false;$('#scan').disabled=false;$('#pause').disabled=true;if(stop)$('#status').textContent='Paused — resumes at next unfinished year'
}
function refreshControls(){
 let oy=$('#year').value,op=$('#pos').value,ot=$('#team').value;displayYears=[...new Set([...P.values()].flatMap(yearsOf))].sort((a,b)=>b-a);
 $('#year').innerHTML='<option value="">Any year</option>'+displayYears.map(y=>`<option ${String(y)===oy?'selected':''}>${y}</option>`).join('');
 $('#pos').innerHTML='<option value="">All pos</option>'+[...new Set([...P.values()].map(p=>p.pos).filter(Boolean))].sort().map(x=>`<option ${x===op?'selected':''}>${x}</option>`).join('');
 let ts=[...new Set([...P.values()].flatMap(p=>Object.values(p.seasons||{}).flat()))].sort();
 $('#team').innerHTML='<option value="">All teams</option>'+ts.map(a=>`<option value="${a}" ${a===ot?'selected':''}>${teamInfo(a).name||a}</option>`).join('')
}
function applyFilters(reset=true){
 let q=$('#q').value.toLowerCase(),pos=$('#pos').value,tid=$('#team').value,mode=$('#teamMode').value,y=$('#year').value,present=$('#present').checked,current=$('#current').checked,tn=$('#teamN').value,sn=$('#seasonN').value;
 view=[...P.values()].filter(p=>{
  let ys=yearsOf(p),tc=teamsOf(p);if(q&&!p.name.toLowerCase().includes(q)||pos&&p.pos!==pos||current&&!p.current||present&&y&&!p.seasons[y])return false;
  if(tid){let ever=Object.values(p.seasons||{}).flat().includes(tid);if(mode==='current'&&currentTeamOf(p)!==tid||mode==='ever'&&!ever||mode==='year'&&(!y||!p.seasons[y]?.includes(tid)))return false}
  if(tn&&(+tn===1?tc!==1:tc<+tn))return false;if(sn){let n=ys.length;if(sn==='1'&&n!==1||sn==='2-4'&&(n<2||n>4)||sn==='5-9'&&(n<5||n>9)||sn==='10-14'&&(n<10||n>14)||sn==='15'&&n<15)return false}return true
 });
 let s=$('#sort').value;view.sort((a,b)=>s==='teams'?teamsOf(b)-teamsOf(a):s==='years'?yearsOf(b).length-yearsOf(a).length:s==='debut'?(Math.min(...yearsOf(b),9999)-Math.min(...yearsOf(a),9999)):s==='last'?(Math.max(...yearsOf(b),0)-Math.max(...yearsOf(a),0)):a.name.localeCompare(b.name));
 render(reset)
}
function render(reset=false){
 if(reset)$('#main').scrollTop=0;let Y=displayYears.length?displayYears:[currentSeason];if(!showAll)Y=Y.slice(0,15);
 let m=$('#main'),rh=42,scroll=Math.max(0,m.scrollTop-29),start=Math.max(0,Math.floor(scroll/rh)-10),count=Math.ceil(m.clientHeight/rh)+22,end=Math.min(view.length,start+count);
 $('#head').innerHTML=`<tr><th class="player">Player (${view.length.toLocaleString()})</th>${Y.map(y=>`<th>${y}</th>`).join('')}</tr>`;
 let rows=`<tr><td colspan="${Y.length+1}" style="height:${start*rh}px;padding:0;border:0"></td></tr>`;
 for(let i=start;i<end;i++){let p=view[i],py=yearsOf(p),head=p.head||'';rows+=`<tr><td class="player"><div class="pb">${head?`<img class="photo" loading="lazy" src="${head}" onerror="this.style.visibility='hidden'">`:'<div class="photo"></div>'}<div><div class="nm">${p.name}</div><div class="meta">${p.pos||'—'} • ${p.current?'CURRENT':'HISTORICAL'} • ${py[0]||'—'}–${py.at(-1)||'—'}</div></div><div class="metrics"><b>${teamsOf(p)}T</b>${py.length} yr</div></div></td>${Y.map(y=>{let ids=p.seasons[y]||[];return `<td>${ids.length?`<div class="logos">${ids.map(a=>{let t=teamInfo(a);return t.logo?`<img class="logo ${ids.length>1?'m':''}" loading="lazy" title="${t.name}" src="${t.logo}">`:`<small title="${t.name}">${a}</small>`}).join('')}</div>`:'<span class="dot">·</span>'}</td>`}).join('')}</tr>`}
 rows+=`<tr><td colspan="${Y.length+1}" style="height:${Math.max(0,(view.length-end)*rh)}px;padding:0;border:0"></td></tr>`;$('#body').innerHTML=rows;$('#empty').style.display=P.size?'none':'block'
}
$('#main').onscroll=()=>{cancelAnimationFrame(renderRAF);renderRAF=requestAnimationFrame(()=>render(false))};
for(const id of ['q','pos','team','teamMode','year','present','current','teamN','seasonN','sort'])$('#'+id).addEventListener(id==='q'?'input':'change',()=>applyFilters());
$('#scan').onclick=scan;$('#pause').onclick=()=>{stop=true;$('#pause').disabled=true};
$('#all').onclick=()=>{showAll=!showAll;$('#all').textContent=showAll?'Recent 15':'All years';render()};
$('#clear').onclick=()=>{for(const id of ['q','pos','team','year','teamN','seasonN'])$('#'+id).value='';$('#teamMode').value='ever';$('#sort').value='name';$('#present').checked=$('#current').checked=false;applyFilters()};
$('#reset').onclick=()=>{if(confirm('Delete all locally cached NFL timeline data?')){indexedDB.deleteDatabase(DB);location.reload()}};

(async()=>{
 await resolveCurrentSeason();await loadTeamInfo();
 for(const id of ['from','to'])$('#'+id).innerHTML=Array.from({length:currentSeason-START+1},(_,i)=>`<option>${currentSeason-i}</option>`).join('');
 $('#from').value=currentSeason;$('#to').value=START;
 for(const p of await dbAll('players'))P.set(p.id,p);
 yearsLoaded=(await dbAll('done')).map(x=>x.year).sort((a,b)=>b-a);
 refreshControls();applyFilters();$('#status').textContent=`Ready • ${P.size.toLocaleString()} cached players • ${yearsLoaded.length} years`
})();
</script>
</body>
</html>
