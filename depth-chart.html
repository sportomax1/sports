<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Depth Chart Lab</title>
<style>body{margin:0;background:#07101b;color:#fff;font:14px system-ui}.shell{max-width:1300px;margin:auto;padding:20px}.muted{color:#91a4bd}.error{color:#ff8d87}.ok{color:#7ee787}.tabs,.ctl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0}button,select,input{background:#132238;color:#fff;border:1px solid #345;border-radius:8px;padding:10px}button{cursor:pointer}button.active{background:#f4b400;color:#111;font-weight:800}.hero{display:flex;gap:14px;align-items:center;background:#0e1928;border:1px solid #263a55;border-radius:13px;padding:13px;margin:10px 0}.hero img{width:65px;height:65px;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.group{background:#0e1928;border:1px solid #263a55;border-radius:12px;overflow:hidden}.group h3{margin:0;padding:11px;background:#132238}.position{padding:10px;border-top:1px solid #263a55}.position>b{color:#ffd45c}.player{display:grid;grid-template-columns:30px 40px 1fr;gap:8px;align-items:center;padding:6px;margin-top:5px;background:#091421;border-radius:8px}.player img{width:38px;height:38px;border-radius:50%;object-fit:cover}.rank{text-align:center;font-weight:900}.empty{padding:20px;border:1px dashed #345;border-radius:10px;color:#91a4bd}.source{font-size:11px;margin:8px 0 14px}</style></head>
<body><main class="shell"><h1>Depth Chart Lab</h1><div class="muted">Core Four ESPN depth-chart explorer. The app tries ESPN's depth-chart endpoint first for every league and only uses roster fallback when no depth data is returned.</div><div id="sports" class="tabs"></div><div class="ctl"><label>Team <select id="team"></select></label><input id="filter" placeholder="Filter player / position"><button id="reload">Reload</button></div><div id="status" class="muted"></div><div id="source" class="source muted"></div><div id="hero"></div><div id="out"></div></main>
<script>
'use strict';
const CFG={NFL:{s:'football',l:'nfl'},NBA:{s:'basketball',l:'nba'},MLB:{s:'baseball',l:'mlb'},NHL:{s:'hockey',l:'nhl'}};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sport=localStorage.getItem('dcSport')||'NFL',teams=[],model=null;
async function api(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
function extractTeams(j){const a=j?.sports?.[0]?.leagues?.[0]?.teams||j?.teams||[];return a.map(x=>x?.team||x).filter(x=>x?.id)}
function depthGroups(j){let charts=[];if(Array.isArray(j?.depthCharts))charts=j.depthCharts;else if(Array.isArray(j?.items))charts=j.items;else if(j?.positions)charts=[j];const out=[];for(const ch of charts){const raw=ch?.positions||{};const positions=[];const entries=Array.isArray(raw)?raw.map((x,i)=>[String(i),x]):Object.entries(raw);for(const [key,p] of entries){let items=p?.athletes||p?.items||[];if(!Array.isArray(items))items=Object.values(items||{});items=items.filter(Boolean);if(items.length)positions.push({name:p?.position?.name||p?.name||key,abbr:p?.position?.abbreviation||p?.abbreviation||key.toUpperCase(),items})}if(positions.length)out.push({name:ch?.name||ch?.displayName||'Depth Chart',positions})}return out}
function rosterGroups(j){const src=Array.isArray(j?.athletes)?j.athletes:Array.isArray(j?.items)?j.items:[];const map=new Map();for(const g of src){if(Array.isArray(g?.items)){const n=g?.position||g?.name||g?.abbreviation||'Roster';for(const a of g.items){if(!map.has(n))map.set(n,[]);map.get(n).push(a)}}else{const n=g?.position?.abbreviation||g?.position?.name||'Roster';if(!map.has(n))map.set(n,[]);map.get(n).push(g)}}return [...map].map(([name,items])=>({name,items}))}
function athlete(x){const a=x?.athlete||x?.player||x||{};return{id:a.id||'',name:a.displayName||a.fullName||a.shortName||'Unknown',jersey:a.jersey||'',pos:a.position?.abbreviation||a.position?.name||'',head:a.headshot?.href||a.headshot||'',rank:Number(x?.rank??x?.pos_rank??a?.rank??0)}}
function player(x,i,depth){const a=athlete(x),r=depth?(a.rank||i+1):'',head=a.head||(a.id?`https://a.espncdn.com/i/headshots/${CFG[sport].l}/players/full/${a.id}.png`:'');return `<div class="player"><div class="rank">${depth?r:'•'}</div><img src="${esc(head)}" alt="" onerror="this.style.opacity=.12"><div><b>${esc(a.name)}</b><div class="muted">${a.jersey?'#'+esc(a.jersey)+' · ':''}${esc(a.pos)}${depth?' · '+(r===1?'Starter':'Depth '+r):''}</div></div></div>`}
function render(){if(!model)return;const q=$('filter').value.trim().toLowerCase();if(model.kind==='depth'){const gs=model.groups.map(g=>({...g,positions:g.positions.map(p=>({...p,items:p.items.filter(x=>!q||p.name.toLowerCase().includes(q)||p.abbr.toLowerCase().includes(q)||athlete(x).name.toLowerCase().includes(q))})).filter(p=>p.items.length)})).filter(g=>g.positions.length);$('out').innerHTML=gs.length?`<div class="grid">${gs.map(g=>`<section class="group"><h3>${esc(g.name)}</h3>${g.positions.map(p=>`<div class="position"><b>${esc(p.abbr)} · ${esc(p.name)}</b>${[...p.items].sort((a,b)=>(athlete(a).rank||99)-(athlete(b).rank||99)).map((x,i)=>player(x,i,true)).join('')}</div>`).join('')}</section>`).join('')}</div>`:'<div class="empty">No matching players.</div>'}else{const gs=model.groups.map(g=>({...g,items:g.items.filter(x=>!q||g.name.toLowerCase().includes(q)||athlete(x).name.toLowerCase().includes(q))})).filter(g=>g.items.length);$('out').innerHTML=gs.length?`<div class="grid">${gs.map(g=>`<section class="group"><h3>${esc(g.name)}</h3><div class="position">${g.items.map((x,i)=>player(x,i,false)).join('')}</div></section>`).join('')}</div>`:'<div class="empty">No matching players.</div>'}}
function tabs(){$('sports').innerHTML=Object.keys(CFG).map(s=>`<button data-s="${s}" class="${s===sport?'active':''}">${s}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;localStorage.setItem('dcSport',sport);tabs();loadTeams()})}
async function loadTeams(){model=null;$('out').innerHTML='';$('hero').innerHTML='';$('source').textContent='';$('status').textContent='Loading '+sport+' teams…';try{const c=CFG[sport],j=await api(`https://site.api.espn.com/apis/site/v2/sports/${c.s}/${c.l}/teams?limit=100`);teams=extractTeams(j).sort((a,b)=>(a.displayName||a.name||'').localeCompare(b.displayName||b.name||''));if(!teams.length)throw new Error('ESPN returned no teams');$('team').innerHTML=teams.map(t=>`<option value="${esc(t.id)}">${esc(t.displayName||t.name)}</option>`).join('');const saved=localStorage.getItem('dcTeam:'+sport);if(saved&&teams.some(t=>String(t.id)===saved))$('team').value=saved;await loadTeam()}catch(e){$('status').innerHTML=`<span class="error">Team load failed: ${esc(e.message)}</span>`}}
async function loadTeam(){const id=$('team').value;if(!id)return;const c=CFG[sport],t=teams.find(x=>String(x.id)===String(id));localStorage.setItem('dcTeam:'+sport,id);$('hero').innerHTML=`<div class="hero"><img src="${esc(t?.logos?.[0]?.href||'')}" alt=""><div><h2>${esc(t?.displayName||t?.name||'')}</h2><div class="muted">${sport}</div></div></div>`;$('out').innerHTML='';$('source').textContent='';$('status').textContent='Checking ESPN depth chart…';const site=`https://site.api.espn.com/apis/site/v2/sports/${c.s}/${c.l}/teams/${id}/depthcharts`;try{const j=await api(site),groups=depthGroups(j);if(groups.length){model={kind:'depth',groups};$('status').innerHTML='<span class="ok">ESPN depth chart loaded.</span>';$('source').textContent='Source: ESPN Site API /depthcharts';render();return}}catch(e){console.warn('Site depth chart:',e)}
const now=new Date(),years=[now.getFullYear(),now.getFullYear()-1];for(const year of years){const core=`https://sports.core.api.espn.com/v2/sports/${c.s}/leagues/${c.l}/seasons/${year}/teams/${id}/depthcharts?limit=100`;try{const j=await api(core),groups=depthGroups(j);if(groups.length){model={kind:'depth',groups};$('status').innerHTML='<span class="ok">ESPN depth chart loaded.</span>';$('source').textContent=`Source: ESPN Core API /seasons/${year}/teams/${id}/depthcharts`;render();return}}catch(e){console.warn('Core depth chart '+year+':',e)}}
$('status').textContent='No ESPN depth chart returned; loading roster fallback…';try{const roster=`https://site.api.espn.com/apis/site/v2/sports/${c.s}/${c.l}/teams/${id}/roster`,j=await api(roster),groups=rosterGroups(j);if(!groups.length)throw new Error('ESPN roster returned no players');model={kind:'roster',groups};$('status').textContent='Depth data unavailable for this team/league; roster grouped by position.';$('source').textContent='Source: ESPN Site API /roster — this is not labeled as true depth order.';render()}catch(e){$('status').innerHTML=`<span class="error">Player load failed: ${esc(e.message)}</span>`}}
$('team').onchange=loadTeam;$('reload').onclick=loadTeam;$('filter').oninput=render;tabs();loadTeams();
</script></body></html>
