<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111d"><title>Period Scoreboard</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#101824;--panel2:#151f2e;--line:#26354a;--text:#f7f9fc;--muted:#91a0b5;--accent:#f4b400;--live:#52d273}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}body{background:radial-gradient(circle at 50% -10%,#183457 0,transparent 34%),var(--bg)}button,input{font:inherit}.app{max-width:980px;margin:auto;padding:0 12px 36px}.top{position:sticky;top:0;z-index:20;padding:10px 0 8px;background:linear-gradient(#070b12 82%,transparent)}.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand h1{font-size:20px;margin:0}.brand a{color:var(--muted);font-size:12px;text-decoration:none}.leagues{display:flex;gap:6px;overflow:auto;padding:10px 0 8px;scrollbar-width:none}.leagues::-webkit-scrollbar{display:none}.league{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 11px;font-weight:800;font-size:11px}.league.on{background:var(--accent);border-color:var(--accent);color:#111}.datebar{display:grid;grid-template-columns:44px 1fr 44px;gap:7px}.datebar button,.datebox{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;min-height:42px}.datebar button{font-size:24px;font-weight:900}.datebox{display:flex;align-items:center;justify-content:center;gap:9px;padding:0 8px}.datebox input{width:128px;border:0;background:transparent;color:var(--text);font-weight:800}.today{border:0;background:transparent;color:var(--accent);font-size:10px;font-weight:900;padding:4px}.status{padding:10px 2px;color:var(--muted);font-size:11px}.games{display:grid;gap:10px}.game{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 7px 20px #0004}.gamehead{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}.live{color:var(--live);font-weight:900}.final{font-weight:800;color:#dce5f1}.tablewrap{overflow-x:auto;overscroll-behavior-x:contain}.scoregrid{display:grid;width:100%;min-width:560px;grid-template-columns:minmax(128px,1.65fr) repeat(var(--cols),minmax(42px,1fr)) minmax(50px,.8fr)}.cell{min-height:45px;display:flex;align-items:center;justify-content:center;border-right:1px solid #26354a88;border-bottom:1px solid #26354a88;font-size:13px}.hdr{min-height:28px;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase;background:#0b121d}.team{position:sticky;left:0;z-index:4;justify-content:flex-start;gap:8px;padding:0 9px;background:#111a27;font-weight:850}.hdr.team{z-index:5;background:#0b121d}.team img{width:27px;height:27px;object-fit:contain}.team .rank{font-size:9px;color:var(--accent)}.teamname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}.winner{background:#172333}.total{font-size:17px;font-weight:950;background:#0d1520}.winner.total{color:var(--accent)}.empty{padding:42px 18px;text-align:center;border:1px dashed var(--line);border-radius:13px;color:var(--muted)}.error{color:#ff8b8b}.hint{text-align:center;color:#627188;font-size:9px;margin-top:12px}@media(max-width:500px){.app{padding-left:6px;padding-right:6px}.top{padding-top:7px}.scoregrid{min-width:100%;grid-template-columns:minmax(105px,1.5fr) repeat(var(--cols),minmax(38px,1fr)) minmax(46px,.8fr)}.game{border-radius:11px}.cell{min-height:42px;font-size:12px}.hdr{min-height:25px;font-size:8px}.team{gap:5px;padding:0 6px}.team img{width:23px;height:23px}.teamname{max-width:66px}.total{font-size:16px}.brand h1{font-size:18px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><h1>Period Scoreboard</h1><a href="./index.html">Sports Tools</a></div><div id="leagues" class="leagues"></div><div class="datebar"><button id="prev" aria-label="Previous game day">‹</button><div class="datebox"><input id="date" type="date"><button class="today" id="today">TODAY</button></div><button id="next" aria-label="Next game day">›</button></div></header><div id="status" class="status"></div><section id="games" class="games"></section><div class="hint">Swipe a scoring grid sideways for every period / inning. Team names stay pinned.</div></main>
<script>
(()=>{'use strict';
const L=[
 {id:'nfl',label:'NFL',sport:'football',league:'nfl',kind:'quarter'},
 {id:'nba',label:'NBA',sport:'basketball',league:'nba',kind:'quarter'},
 {id:'mlb',label:'MLB',sport:'baseball',league:'mlb',kind:'inning'},
 {id:'nhl',label:'NHL',sport:'hockey',league:'nhl',kind:'period'},
 {id:'ncaaf',label:'NCAAF',sport:'football',league:'college-football',kind:'quarter',college:true,groups:'80'},
 {id:'ncaam',label:'NCAAM',sport:'basketball',league:'mens-college-basketball',kind:'half',college:true,groups:'50'}
],E=id=>document.getElementById(id),els={leagues:E('leagues'),date:E('date'),prev:E('prev'),next:E('next'),today:E('today'),status:E('status'),games:E('games')};
let league=L[0],cache=new Map(),token=0;
const localDate=()=>{let d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,10)},ymd=s=>s.replaceAll('-',''),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
els.date.value=localDate();
els.leagues.innerHTML=L.map(x=>'<button class="league'+(x===league?' on':'')+'" data-id="'+x.id+'">'+x.label+'</button>').join('');
els.leagues.onclick=e=>{let b=e.target.closest('[data-id]');if(!b)return;league=L.find(x=>x.id===b.dataset.id);document.querySelectorAll('.league').forEach(x=>x.classList.toggle('on',x===b));load()};
function apiUrl(d){return 'https://site.api.espn.com/apis/site/v2/sports/'+league.sport+'/'+league.league+'/scoreboard?dates='+ymd(d)+'&limit='+(league.college?500:100)+(league.groups?'&groups='+league.groups:'')}
async function get(u){if(cache.has(u))return cache.get(u);let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('ESPN HTTP '+r.status);let j=await r.json();cache.set(u,j);return j}
async function move(n){let mine=++token,d=new Date(els.date.value+'T12:00:00');els.prev.disabled=true;els.next.disabled=true;els.status.textContent='Finding '+(n<0?'previous':'next')+' '+league.label+' game day…';try{for(let i=0;i<60;i++){d.setDate(d.getDate()+n);let ds=d.toISOString().slice(0,10),j=await get(apiUrl(ds));if(mine!==token)return;if((j.events||[]).length){els.date.value=ds;renderDay(j);return}}els.status.textContent='No '+league.label+' games found within 60 days.'}catch(e){if(mine!==token)return;els.status.innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{els.prev.disabled=false;els.next.disabled=false}}
els.prev.onclick=()=>move(-1);els.next.onclick=()=>move(1);els.today.onclick=()=>{els.date.value=localDate();load()};els.date.onchange=load;
function scoreVal(x){let v=x?.score?.value??x?.score;return Number.isFinite(+v)?+v:0}
function lines(c){let a=c?.linescores||[];return a.map((x,i)=>({p:+(x.period??i+1),v:Number.isFinite(+(x.value??x.displayValue))?+(x.value??x.displayValue):0}))}
function maxPeriod(comp,teams){let p=+(comp?.status?.period||0);for(let t of teams)for(let x of lines(t))p=Math.max(p,x.p);return p}
function labels(kind,n){if(kind==='inning')return Array.from({length:Math.max(9,n)},(_,i)=>String(i+1));if(kind==='half')return n<=2?['H1','H2']:Array.from({length:n},(_,i)=>i<2?'H'+(i+1):'OT'+(i-1));if(kind==='period')return Array.from({length:Math.max(3,n)},(_,i)=>i<3?'P'+(i+1):i===3?'OT':'SO');return Array.from({length:Math.max(4,n)},(_,i)=>i<4?'Q'+(i+1):'OT'+(i-3))}
function valueAt(t,p){let x=lines(t).find(z=>z.p===p);return x?x.v:'–'}
function logo(t){return t?.team?.logo||t?.team?.logos?.[0]?.href||''}
function rank(t){if(!league.college)return'';let r=+(t?.curatedRank?.current||0);return r>=1&&r<=25?r:''}
function gameCard(ev){
 let c=ev.competitions?.[0]||{},teams=(c.competitors||[]).slice().sort((a,b)=>(a.homeAway==='away'?0:1)-(b.homeAway==='away'?0:1)),mp=maxPeriod(c,teams),labs=labels(league.kind,mp),st=c.status||ev.status||{},state=st.type?.state||'',detail=st.type?.shortDetail||st.type?.detail||'',complete=!!st.type?.completed;
 let scores=teams.map(scoreVal),mx=Math.max(...scores),tie=scores.length>1&&scores.every(x=>x===scores[0]);
 let head='<div class="gamehead"><span>'+esc(ev.shortName||ev.name||league.label)+'</span><span class="'+(state==='in'?'live':complete?'final':'')+'">'+esc(detail)+'</span></div>';
 let h='<div class="tablewrap"><div class="scoregrid" style="--cols:'+labs.length+'"><div class="cell hdr team">TEAM</div>'+labs.map(x=>'<div class="cell hdr">'+x+'</div>').join('')+'<div class="cell hdr">FINAL</div>';
 for(let t of teams){let win=complete&&!tie&&scoreVal(t)===mx,tm=t.team||{},r=rank(t);h+='<div class="cell team'+(win?' winner':'')+'">'+(logo(t)?'<img src="'+esc(logo(t))+'" alt="">':'')+'<span class="teamname">'+(r?'<span class="rank">#'+r+' </span>':'')+esc(tm.abbreviation||tm.shortDisplayName||tm.displayName||'Team')+'</span></div>'+labs.map((_,i)=>'<div class="cell">'+valueAt(t,i+1)+'</div>').join('')+'<div class="cell total'+(win?' winner':'')+'">'+scoreVal(t)+'</div>'}
 return '<article class="game">'+head+h+'</div></div></article>'
}
function renderDay(j){let ev=j.events||[];els.status.textContent=league.label+' · '+els.date.value+' · '+ev.length+' game'+(ev.length===1?'':'s');els.games.innerHTML=ev.length?ev.map(gameCard).join(''):'<div class="empty">No '+league.label+' games on this date.<br>Use ← or → to jump to a game day.</div>'}\nasync function load(){let mine=++token;els.status.textContent='Loading '+league.label+' · '+els.date.value+'…';els.games.innerHTML='';try{let j=await get(apiUrl(els.date.value));if(mine!==token)return;renderDay(j)}catch(e){if(mine!==token)return;els.status.innerHTML='<span class="error">'+esc(e.message)+'</span>';els.games.innerHTML='<div class="empty error">Could not load ESPN scoreboard data.</div>'}}
load();
})();
</script></body></html>
