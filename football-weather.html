<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1522"><title>Football Weather Watch</title><style>
:root{color-scheme:dark;--bg:#0c1522;--panel:#172337;--line:#304157;--text:#eef4fb;--muted:#a6b7cc;--accent:#91bde4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui,-apple-system,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:12px}header{position:sticky;top:0;z-index:3;background:#0c1522f5;border-bottom:1px solid var(--line);padding:8px 0}.top,.controls,.tabs,.meta,.teams,.weather,.foot{display:flex;align-items:center;gap:8px}.top{justify-content:space-between}.top h1{margin:0;font-size:19px}.top a{color:var(--accent);text-decoration:none;font-size:11px}.tabs{margin:9px 0;gap:6px}.tabs button,.controls button,.controls select,.controls input{background:#1b2b41;border:1px solid var(--line);border-radius:8px;padding:9px 10px}.tabs button.active{background:#e3eefb;color:#10243b;font-weight:800}.controls{flex-wrap:wrap;gap:5px}.controls input{min-width:0;flex:1 1 120px}.controls select{flex:1 1 145px;min-width:0}.controls button{padding:9px 12px}.status{color:var(--muted);padding:10px 0;font-size:11px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.meta{justify-content:space-between;color:var(--muted);font-size:11px;gap:10px}.risk{font-weight:800;color:#d6e7f8}.teams{justify-content:space-between;font-weight:750;font-size:15px;margin:10px 0 4px}.teams .side{display:flex;align-items:center;gap:5px;min-width:0}.teams .side:last-child{text-align:right}.teams img{width:27px;height:27px;object-fit:contain}.at{font-size:10px;color:var(--muted);font-weight:400}.venue{font-size:11px;color:var(--muted);margin:0 0 10px;overflow-wrap:anywhere}.weather{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.stat{background:#101c2d;border:1px solid #26384e;border-radius:8px;padding:8px 4px;text-align:center}.stat strong{display:block;font-size:18px;font-variant-numeric:tabular-nums}.stat small{color:var(--muted);font-size:10px}.foot{justify-content:space-between;color:var(--muted);font-size:11px;margin-top:9px;gap:5px}.foot span:first-child{flex:1}.foot button{border:0;background:transparent;color:#b5d5f5;padding:2px}.details{display:none;border-top:1px solid var(--line);margin-top:9px;padding-top:9px;color:#c6d4e5;font-size:11px;line-height:1.65}.card.open .details{display:block}.notice{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}.flag{color:#f0c080}.source{font-size:10px;color:var(--muted);margin:14px 0}.source a{color:var(--accent)}@media(max-width:400px){.wrap{padding:8px}.card{padding:10px}.stat strong{font-size:16px}.teams{font-size:13px}}
.score{font-size:20px;font-variant-numeric:tabular-nums;padding:0 5px;color:#fff}.side{min-width:0}dialog{background:#142237;color:#eef4fb;border:1px solid #3a506a;border-radius:12px;width:min(96vw,700px);max-height:86vh;overflow:auto;padding:18px}dialog::backdrop{background:#000b}.stats>div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #2b3c50;padding:5px 0}.stats b{text-align:right}.foot{flex-wrap:wrap}.foot button{white-space:nowrap}.card{cursor:pointer}.card:focus-visible{outline:2px solid #bddaf5}.scoreline{display:flex;justify-content:center;align-items:center;gap:22px;margin:5px 0 10px;font-variant-numeric:tabular-nums}.scoreline strong{font-size:26px}.scoreline span{font-size:10px;color:#a7b9cf;font-weight:800}.rank{display:inline-block;margin-right:4px;color:#f0d18b}.leagueicon{display:inline-grid;place-items:center;background:#e1e9f5;color:#13263b;font-size:8px;font-weight:900;padding:3px 4px;border-radius:4px}.card:hover{border-color:#6684a8}</style></head><body><main class="wrap"><header><div class="top"><h1>Football Weather Watch</h1><a href="./matchup-edge.html">Matchup Edge ↗</a></div><div class="tabs"><button data-league="college-football" class="active">🏈 College</button><button data-league="nfl">🏈 NFL</button><button data-league="both">Both</button></div><div class="controls"><button id="prevweek" title="Previous week">−7d</button><button id="prev" title="Previous day">‹</button><input type="date" id="date" aria-label="Game date"><button id="next" title="Next day">›</button><button id="nextweek" title="Next week">+7d</button><select id="sort" aria-label="Sort games"><option value="impact">Weather impact</option><option value="rain">Precipitation chance</option><option value="wind">Wind speed</option><option value="gust">Wind gusts</option><option value="cold">Coldest</option><option value="hot">Hottest</option><option value="time">Kickoff time</option></select><button id="refresh" title="Refresh forecast">↻</button></div></header><div class="status" id="status">Loading games…</div><section id="games" class="grid"></section><p class="source">Forecast: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · ESPN schedule · Hourly estimates at the venue city near kickoff. Weather risk is an informational heuristic, not a betting prediction. Stadium roofs may be open or closed.</p></main><dialog id="boxmodal"><button id="closebox">Close ✕</button><div id="boxbody"></div></dialog><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const state={date:today(),league:'college-football',games:[],token:0},cache=new Map();
$('date').value=state.date;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function json(url,ttl=900000){let c=cache.get(url);if(c&&Date.now()-c.t<ttl)return c.v;let r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);let v=await r.json();cache.set(url,{t:Date.now(),v});return v}
function ymd(d){return d.toISOString().slice(0,10).replace(/-/g,'')}
const names={'AL':'Alabama','AK':'Alaska','AZ':'Arizona','AR':'Arkansas','CA':'California','CO':'Colorado','CT':'Connecticut','DE':'Delaware','FL':'Florida','GA':'Georgia','HI':'Hawaii','ID':'Idaho','IL':'Illinois','IN':'Indiana','IA':'Iowa','KS':'Kansas','KY':'Kentucky','LA':'Louisiana','ME':'Maine','MD':'Maryland','MA':'Massachusetts','MI':'Michigan','MN':'Minnesota','MS':'Mississippi','MO':'Missouri','MT':'Montana','NE':'Nebraska','NV':'Nevada','NH':'New Hampshire','NJ':'New Jersey','NM':'New Mexico','NY':'New York','NC':'North Carolina','ND':'North Dakota','OH':'Ohio','OK':'Oklahoma','OR':'Oregon','PA':'Pennsylvania','RI':'Rhode Island','SC':'South Carolina','SD':'South Dakota','TN':'Tennessee','TX':'Texas','UT':'Utah','VT':'Vermont','VA':'Virginia','WA':'Washington','WV':'West Virginia','WI':'Wisconsin','WY':'Wyoming'};
function getTeams(e){let c=e.competitions?.[0]?.competitors||[];return[c.find(x=>x.homeAway==='away')||c[0],c.find(x=>x.homeAway==='home')||c[1]]}
function point(c){let z=c?.score,n=Number(z?.value??z?.displayValue??z);return z==null?null:Number.isFinite(n)?n:null}function rank(c){let n=Number(c?.curatedRank?.current??c?.curatedRank?.rank??c?.rank);return Number.isInteger(n)&&n>0&&n<=25?'#'+n+' ':''}function eventRow(e,league){let c=e.competitions?.[0],v=c?.venue||e.venue||{},a=v.address||{},[away,home]=getTeams(e);if(!away||!home)return null;return{id:e.id,league,when:e.date,away:away.team,home:home.team,venue:v.fullName||v.name||'',city:a.city||'',region:a.state||'',country:a.country||'USA',indoor:v.indoor===true||v.indoor==='true',weather:null,reason:'',awayScore:point(away),homeScore:point(home),awayRank:league==='nfl'?'':rank(away),homeRank:league==='nfl'?'':rank(home),status:e.status?.type?.description||'',state:e.status?.type?.state||''}}
async function schedule(league,date){let sport=league==='nfl'?'nfl':'college-football',group=league==='nfl'?'':'&groups=80';let url='https://site.api.espn.com/apis/site/v2/sports/football/'+sport+'/scoreboard?dates='+ymd(new Date(date+'T12:00:00'))+'&limit=500'+group;let j=await json(url,180000);return(j.events||[]).map(e=>eventRow(e,league)).filter(Boolean)}
async function geo(g){if(!g.city)return null;let q=g.city+', '+(names[g.region]||g.region||'United States');let url='https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(g.city)+'&count=20&language=en&format=json';let j=await json(url,30*86400000),rs=j.results||[],target=(names[g.region]||g.region||'').toLowerCase();let m=rs.find(x=>x.country_code==='US'&&(!target||String(x.admin1||'').toLowerCase()===target));if(!m&&g.country!=='USA')m=rs.find(x=>String(x.country||'').toLowerCase()===String(g.country).toLowerCase());return m?{lat:m.latitude,lon:m.longitude,label:m.name+', '+(m.admin1||m.country)}:null}
function impact(w){if(!w)return -1;return Math.min(100,Math.round(Math.max(0,32-w.temp)*.8+Math.max(0,w.temp-92)*.7+w.pop*.18+w.wind*.9+Math.max(0,w.gust-20)*.65+(w.snow>0?18:0)))}
async function forecast(g){if(g.indoor){g.reason='Indoor venue · outdoor weather not applicable';return}let kick=new Date(g.when).getTime(),now=Date.now(),historical=kick<now-3600000;if(kick>now+16*86400000){g.reason='Beyond the 16-day forecast horizon';return}let loc=await geo(g);if(!loc){g.reason='Venue location could not be verified';return}g.location=loc.label;g.historical=historical;let recent=historical&&kick>=now-6*86400000;let archive=historical&&!recent;let endpoint=archive?'https://archive-api.open-meteo.com/v1/archive':'https://api.open-meteo.com/v1/forecast';let variables='temperature_2m,precipitation,snowfall,wind_speed_10m,wind_gusts_10m,weather_code'+(archive?'':',precipitation_probability');let u=endpoint+'?latitude='+loc.lat+'&longitude='+loc.lon+'&hourly='+variables+'&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timeformat=unixtime';if(archive){let d=new Date(kick).toISOString().slice(0,10);u+='&start_date='+d+'&end_date='+d}else{u+='&forecast_days=16'+(recent?'&past_days=7':'')}let j=await json(u,historical?7*86400000:30*60000),h=j.hourly;if(!h?.time?.length){g.reason='Weather data unavailable';return}let i=h.time.reduce((best,t,k)=>Math.abs(t*1000-kick)<Math.abs(h.time[best]*1000-kick)?k:best,0);if(Math.abs(h.time[i]*1000-kick)>5400000){g.reason='Kickoff hour not covered';return}let num=key=>h[key]?.[i]==null?null:Number.isFinite(Number(h[key][i]))?Number(h[key][i]):null;g.weather={temp:num('temperature_2m'),pop:num('precipitation_probability'),precip:num('precipitation'),snow:num('snowfall'),wind:num('wind_speed_10m'),gust:num('wind_gusts_10m'),code:num('weather_code'),hour:new Date(h.time[i]*1000).toISOString()};g.weather.impact=impact(g.weather)}
function fmt(v,unit=''){return v==null?'—':Math.round(v)+unit}
function scoreLabel(w){if(!w)return'No forecast';if(w.impact>=60)return'High impact';if(w.impact>=30)return'Moderate impact';return'Low impact'}
function icon(w){if(!w)return'—';if(w.snow>0)return'❄️';if(w.pop>=60)return'🌧️';if(w.wind>=20)return'💨';if(w.temp<=32)return'🥶';if(w.code>=3)return'☁️';return'⛅'}
function card(g,i){let w=g.weather,at=new Date(g.when).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),logo=t=>t?.logo||t?.logos?.[0]?.href||'',team=t=>esc(t?.shortDisplayName||t?.displayName||t?.abbreviation||'Unknown');let live=g.state==='in',done=g.state==='post',hasScore=g.awayScore!=null&&g.homeScore!=null;let score=hasScore?'<div class="scoreline"><strong>'+g.awayScore+'</strong><span>'+esc(done?'FINAL':live?'LIVE':'SCORE')+'</span><strong>'+g.homeScore+'</strong></div>':'';return '<article class="card" role="button" tabindex="0" data-id="'+esc(g.id)+'"><div class="meta"><span><span class="leagueicon">'+(g.league==='nfl'?'NFL':'NCAA')+'</span> '+esc(at)+' · '+esc(g.status)+'</span><span class="risk">'+icon(w)+' '+scoreLabel(w)+'</span></div><div class="teams"><span class="side">'+(logo(g.away)?'<img src="'+esc(logo(g.away))+'" alt="">':'')+'<span>'+(g.awayRank?'<b class="rank">'+esc(g.awayRank)+'</b>':'')+team(g.away)+'</span></span><span class="at">AT</span><span class="side"><span>'+(g.homeRank?'<b class="rank">'+esc(g.homeRank)+'</b>':'')+team(g.home)+'</span>'+(logo(g.home)?'<img src="'+esc(logo(g.home))+'" alt="">':'')+'</span></div>'+score+'<p class="venue">'+esc(g.venue||'Venue not listed')+(g.city?' · '+esc(g.city+(g.region?', '+g.region:'')):'')+(g.indoor?' · Indoor':'')+'</p>'+(w?'<div class="weather">'+[['Temperature',fmt(w.temp,'°F')],['Precip. chance',fmt(w.pop,'%')],['Wind',fmt(w.wind,' mph')],['Gusts',fmt(w.gust,' mph')]].map(([l,v])=>'<div class="stat"><strong>'+v+'</strong><small>'+l+'</small></div>').join('')+'</div>':'<div class="notice">'+esc(g.reason||'Checking weather…')+'</div>')+'<div class="foot"><span>'+(w?(g.historical?'Historical conditions':'Kickoff forecast')+' · Precipitation: '+(w.precip==null?'—':w.precip.toFixed(2)+' in')+' · Snow: '+(w.snow==null?'—':w.snow.toFixed(1)+' cm'):'Weather pending or unavailable')+'</span><button data-more="'+esc(g.id)+'">Weather details ▾</button></div><div class="details">'+(g.historical?'Historical hourly weather reconstruction':'Forecast near kickoff')+' at '+esc(g.location||g.city||'unknown location')+'. '+(w?'Temperature '+fmt(w.temp,'°F')+', precipitation probability '+fmt(w.pop,'%')+', sustained wind '+fmt(w.wind,' mph')+', gusts '+fmt(w.gust,' mph')+'. ':'')+'Weather is city-level modeled data, not a stadium observation. Click the card for the game box score and player stats.</div></article>'}
async function boxScore(g){$('boxmodal').showModal();let root=$('boxbody');root.textContent='Loading box score…';try{let url='https://site.api.espn.com/apis/site/v2/sports/football/'+(g.league==='nfl'?'nfl':'college-football')+'/summary?event='+encodeURIComponent(g.id),j=await json(url,60000);let lines=['<h2>'+esc(g.away?.displayName)+' '+(g.awayScore??'')+' – '+(g.homeScore??'')+' '+esc(g.home?.displayName)+'</h2>'];for(let t of j.boxscore?.teams||[]){lines.push('<h3>'+esc(t.team?.displayName)+'</h3><div class="stats">'+(t.statistics||[]).map(x=>'<div><span>'+esc(x.label||x.name)+'</span><b>'+esc(x.displayValue??x.value??'—')+'</b></div>').join('')+'</div>')}for(let p of j.boxscore?.players||[]){lines.push('<h3>'+esc(p.team?.displayName)+'</h3>');for(let stat of p.statistics||[])lines.push('<h4>'+esc(stat.name)+'</h4><div class="stats">'+(stat.athletes||[]).slice(0,15).map(a=>'<div><span>'+esc(a.athlete?.displayName)+'</span><b>'+esc((a.stats||[]).join(' / '))+'</b></div>').join('')+'</div>')}root.innerHTML=lines.join('')}catch(e){root.textContent='Box score unavailable: '+e.message}}
function render(){let sort=$('sort').value,rows=[...state.games];rows.sort((a,b)=>{let x=a.weather,y=b.weather;if(sort==='time')return new Date(a.when)-new Date(b.when);if(!x)return 1;if(!y)return-1;let key={impact:'impact',rain:'pop',wind:'wind',gust:'gust',cold:'temp',hot:'temp'}[sort];return sort==='cold'?(x[key]??999)-(y[key]??999):(y[key]??-1)-(x[key]??-1)});$('games').innerHTML=rows.length?rows.map(card).join(''):'<div class="notice">No games found for this date and league.</div>';let n=rows.filter(g=>g.weather).length;$('status').textContent=rows.length+' games · '+n+' kickoff forecasts · '+rows.filter(g=>g.indoor).length+' indoor · '+(n<rows.length?'Loading or unavailable forecasts':'Forecasts loaded')}
async function load(){let token=++state.token;state.games=[];$('status').textContent='Loading schedule…';$('games').innerHTML='';try{let leagues=state.league==='both'?['college-football','nfl']:[state.league];let sets=await Promise.all(leagues.map(l=>schedule(l,state.date).catch(()=>[])));if(token!==state.token)return;state.games=sets.flat();render();let queue=state.games.filter(g=>!g.indoor),index=0;await Promise.all(Array.from({length:8},async()=>{while(index<queue.length&&token===state.token){let g=queue[index++];try{await forecast(g)}catch{g.reason='Forecast service unavailable'}if(token===state.token)render()}}));if(token===state.token)render()}catch(e){if(token===state.token)$('status').textContent='Unable to load games: '+e.message}}
document.querySelectorAll('[data-league]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-league]').forEach(x=>x.classList.toggle('active',x===b));state.league=b.dataset.league;load()});$('date').onchange=()=>{state.date=$('date').value;load()};function shift(n){let d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()+n);state.date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('date').value=state.date;load()}$('prevweek').onclick=()=>shift(-7);$('nextweek').onclick=()=>shift(7);$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('sort').onchange=render;$('refresh').onclick=()=>{cache.clear();load()};$('games').onclick=e=>{let bb=e.target.closest('[data-box]');if(bb){let g=state.games.find(x=>x.id===bb.dataset.box);if(g)boxScore(g);return}let b=e.target.closest('[data-more]');if(!b){let c=e.target.closest('.card');if(c){let g=state.games.find(x=>x.id===c.dataset.id);if(g)boxScore(g)}return}let card=b.closest('.card');card.classList.toggle('open');b.textContent=card.classList.contains('open')?'Less ▴':'Details ▾'};$('games').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();let g=state.games.find(x=>x.id===e.target.dataset.id);if(g)boxScore(g)}};$('closebox').onclick=()=>$('boxmodal').close();load();
})();
</script></body></html>
