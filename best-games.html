<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f">
<title>Best Games</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#101824;--panel2:#151f2d;--line:#263449;--text:#f7f9fc;--muted:#91a0b5;--accent:#f4b400;--good:#38d996}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}.shell{max-width:780px;margin:auto;padding:14px 12px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.title{font-size:22px;font-weight:900}.sub{font-size:11px;color:var(--muted)}button,input{font:inherit}.iconbtn,.chip,.settingsBtn{border:1px solid var(--line);background:#111a27;color:var(--text);border-radius:11px;min-height:44px;padding:0 13px;font-weight:800}.settingsBtn{min-width:44px;padding:0}.datebar{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;margin-bottom:10px}.datebox{position:relative;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;place-items:center;text-align:center;font-weight:900}.datebox small{display:block;color:var(--muted);font-size:10px;font-weight:700}.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.filters{display:flex;gap:6px;overflow:auto;padding:1px 0 10px;scrollbar-width:none}.chip{min-height:34px;padding:0 11px;font-size:11px;white-space:nowrap}.chip.active{background:var(--accent);border-color:var(--accent);color:#111}.status{font-size:11px;color:var(--muted);min-height:18px;margin:2px 2px 8px}.games{display:grid;gap:9px}.game{border:1px solid var(--line);cursor:pointer;background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:15px;padding:12px}.gameTop{display:flex;align-items:center;gap:8px;margin-bottom:10px}.rank{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:#0a1019;font-size:12px;font-weight:900}.leagueMark{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:#fff}.leagueLogo{max-width:25px;max-height:25px;object-fit:contain}.leagueFallback{font-size:9px;font-weight:950;color:#111}.meta{min-width:0;flex:1}.league{font-size:10px;font-weight:900;letter-spacing:.08em}.time{font-size:10px;color:var(--muted);margin-top:2px}.rating{text-align:right}.rating b{font-size:20px}.rating small{display:block;font-size:8px;color:var(--muted);font-weight:800}.teams{display:grid;gap:7px}.team{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center}.team img{width:36px;height:36px;object-fit:contain}.teamName{font-size:14px;font-weight:850}.record{font-size:11px;color:#c9d3e2;margin-top:2px}.score{font-size:18px;font-weight:900;color:#aeb9c9}.why{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:9px;border-top:1px solid #223047}.reason{font-size:9px;font-weight:800;color:#cbd5e1;background:#0b121d;padding:5px 7px;border-radius:999px}.empty{border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}dialog{width:min(520px,calc(100% - 24px));border:1px solid var(--line);border-radius:16px;background:#101824;color:var(--text);padding:16px}dialog::backdrop{background:#000a}.setting{margin:14px 0}.setting label{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:7px}.setting input[type=range]{width:100%}.dialogActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modalHead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.closeBtn{border:1px solid var(--line);background:#111a27;color:#fff;border-radius:10px;width:42px;height:42px}.boxHero{display:grid;grid-template-columns:1fr 1fr;gap:7px}.boxTeam{background:#0b121d;border-radius:11px;padding:9px;min-width:0}.boxTeam img{width:30px;height:30px;object-fit:contain}.boxTeam b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.boxTabs{display:flex;gap:5px;overflow:auto;margin:10px 0}.boxTabs button{min-height:38px}.statSection{margin:12px 0}.statTitle{font-size:12px;font-weight:900;margin:0 0 5px}.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}.statTable{border-collapse:collapse;width:max-content;min-width:100%;font-size:10px}.statTable th,.statTable td{padding:7px 8px;border-bottom:1px solid #223047;text-align:right;white-space:nowrap}.statTable th:first-child,.statTable td:first-child{text-align:left;position:sticky;left:0;background:#101824;max-width:130px;overflow:hidden;text-overflow:ellipsis}.hint{font-size:10px;color:var(--muted);line-height:1.45}.error{color:#ff8e8e}@media(min-width:700px){.shell{padding-top:24px}.game{padding:15px}.teamName{font-size:15px}}
</style></head>
<body><main class="shell">
<div class="top"><div><div class="title">Best Games</div><div class="sub">Pregame matchup desirability across six leagues</div></div><button class="settingsBtn" id="settingsBtn" aria-label="Settings">⚙</button></div>
<div class="datebar"><button class="iconbtn" id="prev" aria-label="Previous day">‹</button><div class="datebox"><div id="dateLabel"></div><input id="date" type="date" aria-label="Choose date"></div><button class="iconbtn" id="next" aria-label="Next day">›</button></div>
<div class="filters" id="filters"></div><div class="status" id="status"></div><section class="games" id="games"></section>
</main>
<dialog id="settings"><h3 style="margin:0">Ranking Settings</h3><p class="hint">Ratings use information available going into the game. Game results and scores never affect desirability.</p>
<div class="setting"><label>Current-season strength <span id="wCurrentV"></span></label><input id="wCurrent" type="range" min="0" max="100" value="60"></div>
<div class="setting"><label>Prior-season mode <span id="priorModeV">Auto</span></label><select id="priorMode" class="iconbtn" style="width:100%"><option value="auto">Auto decay</option><option value="current">Current season only</option><option value="custom">Custom decay</option></select></div>
<div class="setting" id="priorDecaySetting"><label>Prior year fades after <span id="priorDecayV">20 games</span></label><input id="priorDecay" type="range" min="1" max="60" value="20"></div>
<div class="setting"><label>Previous-season carryover <span id="wPriorV"></span></label><input id="wPrior" type="range" min="0" max="100" value="25"></div>
<div class="setting"><label>Program/team prestige <span id="wPrestigeV"></span></label><input id="wPrestige" type="range" min="0" max="100" value="15"></div>
<div class="setting"><label><span>College ranking bonus</span><span id="rankBonusV"></span></label><input id="rankBonus" type="range" min="0" max="40" value="24"></div>
<div class="dialogActions"><button class="iconbtn" id="reset">Reset</button><button class="chip active" id="done">Done</button></div></dialog>
<dialog id="gameModal"><div class="modalHead"><div><h3 id="gameTitle" style="margin:0">Game</h3><div class="hint" id="gameSub"></div></div><button class="closeBtn" id="gameClose" aria-label="Close">✕</button></div><div id="gameBody"></div></dialog>
<script>
const LEAGUES=[
 {id:'nfl',label:'NFL',sport:'football',slug:'nfl',logo:''},
 {id:'nba',label:'NBA',sport:'basketball',slug:'nba',logo:''},
 {id:'mlb',label:'MLB',sport:'baseball',slug:'mlb',logo:''},
 {id:'nhl',label:'NHL',sport:'hockey',slug:'nhl',logo:''},
 {id:'ncaaf',label:'CFB',sport:'football',slug:'college-football',group:'80',college:true,logo:''},
 {id:'ncaam',label:'CBB',sport:'basketball',slug:'mens-college-basketball',group:'50',college:true,logo:''}
];
const $=id=>document.getElementById(id), state={date:localDate(new Date()),league:'all',games:[],load:0};
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function compactDate(){return state.date.replaceAll('-','')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v,d=0){v=Number(v);return Number.isFinite(v)?v:d}
function pct(v){return Math.max(0,Math.min(1,num(v)))}
function settings(){let a=num($('wCurrent').value),b=num($('wPrior').value),c=num($('wPrestige').value),sum=a+b+c||1;return {current:a/sum,prior:b/sum,prestige:c/sum,rankBonus:num($('rankBonus').value),priorMode:$('priorMode').value,priorDecay:num($('priorDecay').value,20)}}
function syncSettings(){['wCurrent','wPrior','wPrestige'].forEach(id=>$(id+'V').textContent=$(id).value+'%');$('rankBonusV').textContent=$('rankBonus').value+' pts';$('priorDecayV').textContent=$('priorDecay').value+' games';$('priorModeV').textContent=$('priorMode').selectedOptions[0].textContent;$('priorDecaySetting').style.display=$('priorMode').value==='custom'?'block':'none'}
function teamLogo(t){return t?.logo||t?.logos?.[0]?.href||''}
function leagueLogo(l){const logos={nfl:'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png',nba:'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png',mlb:'https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png',nhl:'https://a.espncdn.com/i/teamlogos/leagues/500/nhl.png',ncaaf:'https://a.espncdn.com/i/teamlogos/leagues/500/college-football.png',ncaam:'https://a.espncdn.com/i/teamlogos/leagues/500/mens-college-basketball.png'};return logos[l.id]||''}
function parseRecord(c){let r=(c.records||[]).find(x=>x.type==='total')||(c.records||[])[0];let s=r?.summary||'';let p=s.split('-').map(Number);let w=num(p[0]),l=num(p[1]),ties=num(p[2]);let gp=w+l+ties;return {text:s||'0-0',w,l,t:ties,gp,pct:gp?(w+.5*ties)/gp:.5}}
function prestige(team,league){let id=String(team?.id||'');let ab=(team?.abbreviation||'').toUpperCase();const elite={
 nfl:['KC','BAL','BUF','PHI','SF','GB','DAL','PIT','NE'],nba:['BOS','LAL','GS','DEN','OKC','MIL','NY'],mlb:['NYY','LAD','BOS','ATL','HOU','PHI','CHC'],nhl:['MTL','TOR','BOS','NYR','DET','COL','EDM','FLA','VGK'],
 ncaaf:['ALA','UGA','OSU','MICH','TEX','OU','ND','LSU','PSU','CLEM','ORE','USC'],ncaam:['DUKE','UNC','KU','UK','UCONN','MSU','UCLA','GONZ','ARIZ','IU']
 };return elite[league]?.includes(ab)?1:.45}
function rankMap(data){let m=new Map;for(const poll of data?.rankings||[]){for(const r of poll.ranks||[]){let id=String(r.team?.id||'');if(id&&!m.has(id))m.set(id,num(r.current))}if(m.size)break}return m}
async function get(url){let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('ESPN '+r.status);return r.json()}

function seasonFor(l,date=state.date){let [y,m]=date.split('-').map(Number);if(l.id==='nfl'||l.id==='ncaaf')return m<7?y-1:y;if(l.id==='nba'||l.id==='nhl'||l.id==='ncaam')return m<7?y-1:y;return y}
function priorFade(g){let s=settings(),games=Math.max(g.ar.gp,g.hr.gp);if(s.priorMode==='current')return 0;let cutoff=s.priorMode==='custom'?s.priorDecay:((g.league.id==='nfl'||g.league.id==='ncaaf')?7:(g.league.id==='mlb'?35:20));return Math.max(0,Math.min(1,1-games/cutoff))}
function recordFromEvents(events,teamId){let w=0,loss=0,tie=0;for(let e of events||[]){if(!e.status?.type?.completed)continue;let cs=e.competitions?.[0]?.competitors||[],me=cs.find(x=>String(x.team?.id)===String(teamId)),op=cs.find(x=>String(x.team?.id)!==String(teamId));if(!me||!op)continue;if(me.winner===true)w++;else if(op.winner===true)loss++;else{let ms=num(me.score,NaN),os=num(op.score,NaN);if(Number.isFinite(ms)&&Number.isFinite(os)){if(ms>os)w++;else if(ms<os)loss++;else tie++}}}let gp=w+loss+tie;return gp?{w,l:loss,t:tie,gp,pct:(w+.5*tie)/gp,text:w+'-'+loss+(tie?'-'+tie:'')}:null}
async function priorRecords(l,teams){let season=seasonFor(l)-1,base='https://site.api.espn.com/apis/site/v2/sports/'+l.sport+'/'+l.slug,out=new Map,missing=[...teams];try{let q='?dates='+season+'&limit=1000'+(l.group?'&groups='+l.group:'');let seasonBoard=await get(base+'/scoreboard'+q);for(let t of teams){let r=recordFromEvents(seasonBoard.events,t.id);if(r)out.set(String(t.id),r)}missing=teams.filter(t=>!out.has(String(t.id)))}catch{}await Promise.all(missing.map(async t=>{for(const url of [base+'/teams/'+t.id+'/schedule?season='+season,base+'/teams/'+t.id+'/schedule?season='+season+'&limit=1000']){try{let d=await get(url),r=recordFromEvents(d.events,t.id);if(r){out.set(String(t.id),r);break}}catch{}}}));return out}
async function leagueData(l){let base='https://site.api.espn.com/apis/site/v2/sports/'+l.sport+'/'+l.slug;let q='?dates='+compactDate()+'&limit=1000'+(l.group?'&groups='+l.group:'');let sb=await get(base+'/scoreboard'+q),ranks=new Map;if(l.college){try{ranks=rankMap(await get(base+'/rankings?limit=100&season='+seasonFor(l)))}catch{}}let raw=(sb.events||[]).map(e=>makeGame(e,l,ranks)).filter(Boolean),teams=[...new Map(raw.flatMap(g=>[g.away.team,g.home.team]).map(t=>[String(t.id),t])).values()],priors=await priorRecords(l,teams);raw.forEach(g=>{g.ap=priors.get(String(g.away.team.id));g.hp=priors.get(String(g.home.team.id))});return raw}
function makeGame(e,l,ranks){let comp=e.competitions?.[0]||{},cs=comp.competitors||[];let away=cs.find(x=>x.homeAway==='away')||cs[0],home=cs.find(x=>x.homeAway==='home')||cs[1];if(!away||!home)return null;let ar=parseRecord(away),hr=parseRecord(home);return {id:e.id,league:l,event:e,comp,away,home,ar,hr,awayRank:ranks.get(String(away.team?.id)),homeRank:ranks.get(String(home.team?.id))}}
function playoffInfo(g){let e=g.event||{},c=g.comp||{},s=[e.season?.type?.name,e.season?.type?.abbreviation,e.name,e.shortName,c.notes?.map?.(x=>x.headline).join(' '),c.type?.text].filter(Boolean).join(' ').toLowerCase(),st=num(e.season?.type?.type||e.season?.type||0);let playoff=st===3||/playoff|postseason|wild card|wildcard|championship|finals|final four|elite eight|sweet 16|round of 32|round of 64|college football playoff|cfp|bowl/.test(s);if(!playoff)return {bonus:0,label:''};if(/super bowl|stanley cup final|nba finals|world series|national championship|championship game/.test(s))return {bonus:30,label:'Championship'};if(/conference final|league championship|final four|semifinal|semi-final/.test(s))return {bonus:24,label:'Playoff semifinal'};if(/conference semifinal|division series|elite eight|quarterfinal|quarter-final/.test(s))return {bonus:19,label:'Playoff quarterfinal'};if(/wild card|wildcard|play-in|first round|round of 64|round of 32|sweet 16/.test(s))return {bonus:14,label:'Playoffs'};return {bonus:17,label:'Postseason'}}
function scoreGame(g){let s=settings(),a=g.ar,h=g.hr,games=Math.max(a.gp,h.gp),fade=priorFade(g),current=(a.pct+h.pct)/2,balance=1-Math.abs(a.pct-h.pct),currentQuality=.72*current+.28*balance,prior=((g.ap?.pct??.5)+(g.hp?.pct??.5))/2,prest=(prestige(g.away.team,g.league.id)+prestige(g.home.team,g.league.id))/2;
 let currentShare=1-fade,quality=(currentShare*currentQuality+fade*prior),wc=s.current,wp=s.prior*fade,wpr=s.prestige*(1-.55*currentShare),den=wc+wp+wpr||1,base=100*(wc*quality+wp*prior+wpr*prest)/den;
 let rb=0;if(g.league.college){let ranks=[g.awayRank,g.homeRank].filter(Boolean);for(const r of ranks){let quality=(26-r)/25;rb+=s.rankBonus*(.45+.55*quality);if(r<=10)rb+=3;if(r<=5)rb+=3}if(ranks.length===2){rb+=8;if(Math.max(...ranks)<=10)rb+=5;if(Math.max(...ranks)<=5)rb+=5}}
 let recordBonus=Math.min(8,(a.gp+h.gp)*.25)*current,playoff=playoffInfo(g);return Math.round(Math.max(0,Math.min(100,base+rb+recordBonus+playoff.bonus)))}
function reasons(g){let r=[],po=playoffInfo(g);if(po.label)r.push(po.label);if(g.awayRank&&g.homeRank)r.push('#'+g.awayRank+' vs #'+g.homeRank);else if(g.awayRank||g.homeRank)r.push('Ranked team');let avg=(g.ar.pct+g.hr.pct)/2;if(avg>=.7)r.push('Elite records');else if(avg>=.58)r.push('Strong records');if(Math.abs(g.ar.pct-g.hr.pct)<.1&&g.ar.gp+g.hr.gp>4)r.push('Even matchup');if(prestige(g.away.team,g.league.id)+prestige(g.home.team,g.league.id)>=1.8)r.push('Premier brands');if(priorFade(g)>.05&&(g.ap||g.hp))r.push('Prior year '+Math.round(priorFade(g)*100)+'% active');if(!r.length)r.push('Pregame record model');return r.slice(0,3)}
function dateLabel(){let [y,m,d]=state.date.split('-').map(Number),dt=new Date(y,m-1,d);$('dateLabel').innerHTML=dt.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+'<small>'+y+'</small>';$('date').value=state.date}
function renderFilters(){$('filters').innerHTML=[{id:'all',label:'ALL'},...LEAGUES].map(l=>'<button class="chip '+(state.league===l.id?'active':'')+'" data-l="'+l.id+'">'+l.label+'</button>').join('');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{state.league=b.dataset.l;renderFilters();render()})}
function render(){let rows=state.games.filter(g=>state.league==='all'||g.league.id===state.league).map(g=>({...g,rating:scoreGame(g)})).sort((a,b)=>b.rating-a.rating);if(!rows.length){$('games').innerHTML='<div class="empty">No games found for this date and league selection.</div>';return}
 $('games').innerHTML=rows.map((g,i)=>{let st=g.event.status?.type||{},started=st.state!=='pre',final=st.completed;let when=new Date(g.event.date).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});let venue=g.comp.venue?.fullName;return '<article class="game" data-game="'+esc(g.id)+'"><div class="gameTop"><div class="rank">'+(i+1)+'</div><span class="leagueMark"><img class="leagueLogo" src="'+leagueLogo(g.league)+'" alt="'+esc(g.league.label)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><span class="leagueFallback" style="display:none">'+esc(g.league.label)+'</span></span><div class="meta"><div class="league">'+g.league.label+'</div><div class="time">'+esc(final?'FINAL':started?st.shortDetail:when)+(venue?' · '+esc(venue):'')+'</div></div><div class="rating"><b>'+g.rating+'</b><small>WATCH SCORE</small></div></div><div class="teams">'+teamRow(g.away,g.ar,g.awayRank,started,g.ap,priorFade(g))+teamRow(g.home,g.hr,g.homeRank,started,g.hp,priorFade(g))+'</div><div class="why">'+reasons(g).map(x=>'<span class="reason">'+esc(x)+'</span>').join('')+'</div></article>'}).join('');document.querySelectorAll('[data-game]').forEach(x=>x.onclick=()=>openGame(x.dataset.game))}
function teamRow(c,r,rank,showScore,prior,fade){let priorText=prior&&fade>.05?' · prior '+esc(prior.text):'';return '<div class="team"><img src="'+esc(teamLogo(c.team))+'" alt=""><div><div class="teamName">'+(rank?'<span style="color:#f4b400">#'+rank+'</span> ':'')+esc(c.team?.shortDisplayName||c.team?.displayName)+'</div><div class="record">'+esc(r.text)+' entering game'+priorText+'</div></div><div class="score">'+(showScore?esc(c.score||''):'')+'</div></div>'}

function statNum(v){let n=parseFloat(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:-Infinity}
function primaryIndex(st){let ls=(st.labels||[]).map(x=>String(x).toUpperCase()),n=String(st.name||st.displayName||'').toLowerCase(),w=n.includes('pass')?['YDS','C/ATT']:n.includes('rush')?['YDS','CAR']:n.includes('receiv')?['YDS','REC']:n.includes('def')?['TOT','SOLO']:n.includes('pitch')?['IP','K']:n.includes('bat')?['H','RBI']:n.includes('goal')?['G','PTS']:['PTS','YDS','TOTAL'];for(let q of w){let i=ls.indexOf(q);if(i>=0)return i}return Math.max(0,ls.length-1)}
function statTable(st,rows){let ix=primaryIndex(st);rows.sort((a,b)=>statNum(b.r.stats?.[ix])-statNum(a.r.stats?.[ix]));return '<section class="statSection"><div class="statTitle">'+esc(st.displayName||st.name||'Stats')+'</div><div class="tablewrap"><table class="statTable"><thead><tr><th>Player</th><th>Team</th>'+(st.labels||[]).map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.r.athlete?.shortName||x.r.athlete?.displayName||'Player')+'</td><td>'+esc(x.team?.abbreviation||'')+'</td>'+(x.r.stats||[]).map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section>'}
function boxHtml(boxes,teamId='all'){let cats=new Map;boxes.filter(tp=>teamId==='all'||String(tp.team?.id)===teamId).forEach(tp=>(tp.statistics||[]).forEach(st=>{let k=st.name||st.displayName||'stats',x=cats.get(k)||{name:st.name,displayName:st.displayName,labels:st.labels||[],rows:[]};(st.athletes||[]).forEach(r=>x.rows.push({r,team:tp.team}));cats.set(k,x)}));return [...cats.values()].map(st=>statTable(st,st.rows)).join('')||'<div class="empty">No player box score is available for this game yet.</div>'}
async function openGame(id){let g=state.games.find(x=>String(x.id)===String(id));if(!g)return;$('gameTitle').textContent=(g.away.team?.shortDisplayName||'Away')+' at '+(g.home.team?.shortDisplayName||'Home');$('gameSub').textContent='Box score · tap a team to filter';$('gameBody').innerHTML='<div class="empty">Loading box score…</div>';$('gameModal').showModal();try{let base='https://site.api.espn.com/apis/site/v2/sports/'+g.league.sport+'/'+g.league.slug,d=await get(base+'/summary?event='+encodeURIComponent(id)),cs=d.header?.competitions?.[0]?.competitors||[],boxes=d.boxscore?.players||[];let hero='<div class="boxHero">'+cs.map(x=>'<div class="boxTeam"><img src="'+esc(teamLogo(x.team))+'" alt=""><b>'+esc(x.team?.shortDisplayName||x.team?.displayName)+'</b><span class="score">'+esc(x.score||'')+'</span></div>').join('')+'</div>';let tabs=boxes.length?'<div class="boxTabs"><button class="chip active" data-box="all">Combined</button>'+boxes.map(tp=>'<button class="chip" data-box="'+esc(tp.team?.id)+'">'+esc(tp.team?.abbreviation||tp.team?.shortDisplayName||'Team')+'</button>').join('')+'</div>':'';$('gameBody').innerHTML=hero+tabs+'<div id="boxPane">'+boxHtml(boxes)+'</div>';document.querySelectorAll('[data-box]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-box]').forEach(x=>x.classList.toggle('active',x===b));$('boxPane').innerHTML=boxHtml(boxes,b.dataset.box)})}catch(e){$('gameBody').innerHTML='<div class="empty error">'+esc(e.message)+'</div>'}}
async function load(){let my=++state.load;dateLabel();$('status').textContent='Loading all six leagues…';$('status').className='status';$('games').innerHTML='';let settled=await Promise.allSettled(LEAGUES.map(leagueData));if(my!==state.load)return;state.games=settled.flatMap(x=>x.status==='fulfilled'?x.value.filter(Boolean):[]);let failed=settled.filter(x=>x.status==='rejected').length;$('status').textContent=state.games.length+' games loaded'+(failed?' · '+failed+' league'+(failed>1?'s':'')+' unavailable':'')+' · ranked by pregame context';if(failed)$('status').classList.add('error');render()}
function move(n){let [y,m,d]=state.date.split('-').map(Number),dt=new Date(y,m-1,d+n);state.date=localDate(dt);load()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('date').onchange=e=>{if(e.target.value){state.date=e.target.value;load()}};$('settingsBtn').onclick=()=>$('settings').showModal();$('done').onclick=()=>{$('settings').close();render()};$('reset').onclick=()=>{$('wCurrent').value=60;$('wPrior').value=25;$('wPrestige').value=15;$('rankBonus').value=24;$('priorMode').value='auto';$('priorDecay').value=20;syncSettings();render()};['wCurrent','wPrior','wPrestige','rankBonus','priorDecay'].forEach(id=>$(id).oninput=()=>{syncSettings();render()});$('priorMode').onchange=()=>{syncSettings();render()};$('gameClose').onclick=()=>$('gameModal').close();syncSettings();renderFilters();load();
</script></body></html>
