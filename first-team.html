<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>First Team</title>
<style>
:root{color-scheme:dark;--bg:#07101b;--p:#0e1928;--p2:#132238;--line:#29405d;--muted:#91a4bd;--gold:#f4b400;--bad:#ff8d87}*{box-sizing:border-box}body{margin:0;background:#07101b;color:#fff;font:14px system-ui,-apple-system,sans-serif}.shell{max-width:1450px;margin:auto;padding:18px}h1{margin:0}.muted{color:var(--muted)}.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px}.controls,.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:12px 0}label{display:grid;gap:4px;color:var(--muted);font-size:11px;font-weight:800}button,select,input{background:var(--p2);border:1px solid #395473;border-radius:8px;color:#fff;padding:9px;min-height:38px}button{cursor:pointer;font-weight:800}.primary,.tab.active{background:var(--gold);color:#111;border-color:var(--gold)}.status{margin:8px 0}.bar{height:7px;background:#142238;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px}.player{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;background:var(--p);border:1px solid var(--line);border-radius:11px;padding:9px;cursor:pointer}.player img{width:44px;height:44px;border-radius:50%;object-fit:cover}.pos{color:#ffd45c;font-size:10px;font-weight:900}.score{font-size:19px;font-weight:900}.section{margin:18px 0 8px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px;background:var(--p)}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:9;padding:15px;place-items:center}.modal.open{display:grid}.dialog{width:min(900px,100%);max-height:90vh;overflow:auto;background:#0d1826;border:1px solid #45617f;border-radius:14px;padding:15px}.head{display:flex;justify-content:space-between}.log{white-space:pre-wrap;font:11px ui-monospace,monospace;background:#050a11;padding:10px;border-radius:8px}.error{color:var(--bad)}.warn{color:#fbbf24}.slot{display:grid;grid-template-columns:1fr 80px 45px;gap:6px;margin:6px 0}.weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px}.weight{display:grid;grid-template-columns:1fr 75px;gap:6px;align-items:center}@media(max-width:600px){.shell{padding:11px}}
</style></head><body><main class="shell">
<div class="head"><div><h1>First Team</h1><div class="muted">NFL First, Second & Third Team generator</div></div><button id="diag">Diagnostics <span id="lc">0</span></button></div>
<div class="card controls"><label>Season<select id="season"></select></label><label>Scope<select id="scope"><option value="week">Single Week</option><option value="through">Through Week</option><option value="season">Full Season</option></select></label><label id="ww">Week<select id="week"></select></label><label>Scoring<select id="mode"><option value="composite">Position Composite</option><option value="ppr">PPR</option><option value="half">Half-PPR</option><option value="standard">Standard</option></select></label><button id="settings">⚙ Roster & Scoring</button><button id="go" class="primary">Generate Teams</button></div>
<div id="status" class="status muted">App initialized. Ready.</div><div class="bar"><i id="bar"></i></div>
<div class="tabs"><button class="tab active" data-v="1">First Team</button><button class="tab" data-v="2">Second Team</button><button class="tab" data-v="3">Third Team</button><button class="tab" data-v="rank">Rankings</button><button class="tab" data-v="clubs">Teams</button></div><div id="out" class="card muted">Generate a team to begin.</div>
</main><div id="modal" class="modal"><div class="dialog"><div class="head"><div id="mt"></div><button id="x">✕</button></div><div id="mb"></div></div></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)}, logs=[],players=[],squads={1:[],2:[],3:[]},view='1';
var DEFAULT_SLOTS=[['QB',1],['RB',1],['WR',3],['TE',1],['OT',2],['OG',2],['C',1],['EDGE',2],['DT',2],['LB',2],['CB',2],['S',2],['DEF FLEX',1]];
var ELIG={QB:['QB'],RB:['RB','FB'],WR:['WR'],TE:['TE'],OT:['OT','T','LT','RT'],OG:['OG','G','LG','RG'],C:['C'],EDGE:['DE','EDGE','OLB'],DT:['DT','NT','DL'],LB:['LB','ILB','MLB','OLB'],CB:['CB','DB'],S:['S','FS','SS','DB'],'DEF FLEX':['DE','DT','NT','DL','LB','ILB','MLB','OLB','CB','DB','S','FS','SS']};
var DEFAULT_W={passingYards:.04,passingTouchdowns:4,passingInterceptions:-2,rushingYards:.1,rushingTouchdowns:6,receptions:1,receivingYards:.1,receivingTouchdowns:6,totalTackles:1,sacks:4,tacklesForLoss:2,passesDefended:2,defensiveInterceptions:6,forcedFumbles:4,fumbleRecoveries:3};
function read(k,d){try{var x=JSON.parse(localStorage.getItem(k));return x||d}catch(e){return d}}
var slots=read('ft-slots',DEFAULT_SLOTS.map(function(x){return x.slice()})),weights=read('ft-weights',Object.assign({},DEFAULT_W));
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function log(s){logs.push(new Date().toLocaleTimeString()+' '+s);$('lc').textContent=logs.length;console.log('[FirstTeam]',s)}
function status(s,bad){$('status').className='status '+(bad?'error':'muted');$('status').textContent=s}
function progress(n){$('bar').style.width=Math.max(0,Math.min(100,n))+'%'}
function init(){var y=new Date().getFullYear(),ys='';for(var i=0;i<25;i++)ys+='<option value="'+(y-i)+'">'+(y-i)+'</option>';$('season').innerHTML=ys;var ws='';for(i=1;i<=18;i++)ws+='<option value="'+i+'">'+i+'</option>';$('week').innerHTML=ws;bind();log('INIT OK');status('App initialized. Ready.')}
function bind(){$('go').onclick=generate;$('settings').onclick=openSettings;$('diag').onclick=openDiag;$('x').onclick=close;$('scope').onchange=function(){$('ww').style.display=this.value==='season'?'none':''};document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){view=b.getAttribute('data-v');render()}});$('modal').onclick=function(e){if(e.target===$('modal'))close()}}
function close(){$('modal').classList.remove('open')}
function api(url){log('GET '+url);return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function events(year,week){return api('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=100&dates='+year+'&seasontype=2&week='+week).then(function(j){return (j.events||[]).map(function(e){return e.id})})}
function pool(items,limit,fn){var out=new Array(items.length),next=0,done=0;function worker(){var i=next++;if(i>=items.length)return Promise.resolve();return fn(items[i]).then(function(v){out[i]=v},function(e){out[i]=[];log('WARN '+e.message)}).then(function(){done++;progress(done/items.length*100);return worker()})}var a=[];for(var k=0;k<Math.min(limit,items.length);k++)a.push(worker());return Promise.all(a).then(function(){return out})}
var MAP={C_ATT:'completionsAttempts',YDS:'yards',AVG:'average',TD:'touchdowns',INT:'interceptions',SACKS:'sacks',QBR:'qbr',RTG:'rating',CAR:'carries',REC:'receptions',TGTS:'targets',TOT:'totalTackles',SOLO:'soloTackles',TFL:'tacklesForLoss',PD:'passesDefended',FF:'forcedFumbles',FR:'fumbleRecoveries'};
function norm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9_]/g,'')}
function parseGame(j){var result=[],groups=(j.boxscore&&j.boxscore.players)||[];groups.forEach(function(g){var team=g.team||{};(g.statistics||[]).forEach(function(block){var label=String(block.name||block.displayName||'').toLowerCase(),labels=block.labels||[];(block.athletes||[]).forEach(function(a){var at=a.athlete||{},id=String(at.id||'');if(!id)return;var p=result.find(function(x){return x.id===id});if(!p){p={id:id,name:at.displayName||at.fullName||('Player '+id),head:(at.headshot&&at.headshot.href)||'',team:team.abbreviation||'',pos:(at.position&&(at.position.abbreviation||at.position.name))||'',stats:{},games:1};result.push(p)};(a.stats||[]).forEach(function(v,i){var key=MAP[norm(labels[i])]||norm(labels[i])||('stat'+i),n=parseFloat(String(v).replace(/,/g,''));if(!isFinite(n))return;if(label.indexOf('passing')>=0){if(key==='YARDS'||key==='yards')key='passingYards';if(key==='touchdowns'||key==='TD')key='passingTouchdowns';if(key==='interceptions'||key==='INT')key='passingInterceptions'}else if(label.indexOf('rushing')>=0){if(key==='YARDS'||key==='yards')key='rushingYards';if(key==='touchdowns'||key==='TD')key='rushingTouchdowns'}else if(label.indexOf('receiving')>=0){if(key==='YARDS'||key==='yards')key='receivingYards';if(key==='touchdowns'||key==='TD')key='receivingTouchdowns'}else if(label.indexOf('defensive')>=0&&key==='interceptions')key='defensiveInterceptions';p.stats[key]=(p.stats[key]||0)+n})})})});return result}
function merge(games){var m={};games.forEach(function(game){(game||[]).forEach(function(p){if(!m[p.id])m[p.id]=JSON.parse(JSON.stringify(p));else{Object.keys(p.stats).forEach(function(k){m[p.id].stats[k]=(m[p.id].stats[k]||0)+p.stats[k]});m[p.id].games++}})});return Object.keys(m).map(function(k){return m[k]})}
function getWeek(y,w){return events(y,w).then(function(ids){log('WEEK '+w+' EVENTS '+ids.length);if(!ids.length)return [];return pool(ids,16,function(id){return api('https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event='+id).then(parseGame)}).then(merge)})}
function fantasy(mode){var w={passingYards:.04,passingTouchdowns:4,passingInterceptions:-2,rushingYards:.1,rushingTouchdowns:6,receivingYards:.1,receivingTouchdowns:6};if(mode==='ppr')w.receptions=1;if(mode==='half')w.receptions=.5;return w}
function score(arr){var mode=$('mode').value,w=mode==='composite'?weights:fantasy(mode);arr.forEach(function(p){p.raw=0;Object.keys(w).forEach(function(k){p.raw+=(p.stats[k]||0)*w[k]});p.score=p.raw});if(mode==='composite'){var groups={};arr.forEach(function(p){(groups[p.pos]||(groups[p.pos]=[])).push(p)});Object.keys(groups).forEach(function(k){var g=groups[k],vals=g.map(function(p){return p.raw}),min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);g.forEach(function(p){p.score=max===min?(p.raw?50:0):(p.raw-min)/(max-min)*100})})}return arr}
function eligible(p,slot){return (ELIG[slot]||[slot]).indexOf(p.pos)>=0}
function build(){var used={};squads={1:[],2:[],3:[]};[1,2,3].forEach(function(n){slots.forEach(function(sc){for(var z=0;z<Number(sc[1]);z++){var a=players.filter(function(p){return !used[p.id]&&eligible(p,sc[0])}).sort(function(a,b){return b.score-a.score});if(a[0]){var q=Object.assign({},a[0],{slot:sc[0]});squads[n].push(q);used[q.id]=1}}})})}
function generate(){var btn=$('go');btn.disabled=true;players=[];squads={1:[],2:[],3:[]};progress(0);var y=Number($('season').value),w=Number($('week').value),scope=$('scope').value,weeks=[];if(scope==='week')weeks=[w];else if(scope==='through'){for(var i=1;i<=w;i++)weeks.push(i)}else{for(i=1;i<=18;i++)weeks.push(i)}status('Loading ESPN data for '+weeks.length+' week(s)…');var all=[],chain=Promise.resolve();weeks.forEach(function(week){chain=chain.then(function(){return getWeek(y,week)}).then(function(a){all.push(a)})});chain.then(function(){players=score(merge(all));if(!players.length)throw new Error('ESPN returned no player box-score data for this selection.');build();progress(100);status(players.length+' players loaded · '+weeks.length+' week(s).');render()}).catch(function(e){status('Load failed: '+e.message,true);log('ERROR '+(e.stack||e.message))}).then(function(){btn.disabled=false})}
function pc(p){return '<div class="player" data-id="'+esc(p.id)+'"><img src="'+esc(p.head)+'" alt=""><div><div class="pos">'+esc(p.slot||p.pos)+'</div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.team)+' · '+esc(p.pos)+'</div></div><div class="score">'+Number(p.score||0).toFixed(1)+'</div></div>'}
function render(){document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-v')===view)});if(view==='rank')return ranks();if(view==='clubs')return clubs();var a=squads[Number(view)]||[],off=a.filter(function(p){return ['QB','RB','WR','TE','OT','OG','C'].indexOf(p.slot)>=0}),def=a.filter(function(p){return off.indexOf(p)<0});$('out').className='';$('out').innerHTML='<h3 class="section">Offense · '+off.length+'</h3><div class="grid">'+off.map(pc).join('')+'</div><h3 class="section">Defense · '+def.length+'</h3><div class="grid">'+def.map(pc).join('')+'</div>'+(a.length<slots.reduce(function(n,x){return n+Number(x[1])},0)?'<div class="card warn">Unfilled configured slots indicate ESPN box scores do not expose enough eligible individual data for those positions (especially offensive line).</div>':'');bindPlayers()}
function ranks(){var a=players.slice().sort(function(a,b){return b.score-a.score});$('out').className='wrap';$('out').innerHTML='<table><thead><tr><th>Player</th><th>Pos</th><th>Team</th><th>G</th><th>Score</th><th>Raw</th></tr></thead><tbody>'+a.map(function(p,i){return '<tr data-id="'+esc(p.id)+'"><td><b>'+(i+1)+'. '+esc(p.name)+'</b></td><td>'+esc(p.pos)+'</td><td>'+esc(p.team)+'</td><td>'+p.games+'</td><td>'+p.score.toFixed(1)+'</td><td>'+p.raw.toFixed(1)+'</td></tr>'}).join('')+'</tbody></table>';bindPlayers()}
function clubs(){var m={};[1,2,3].forEach(function(n){squads[n].forEach(function(p){if(!m[p.team])m[p.team]=[0,0,0];m[p.team][n-1]++})});var a=Object.keys(m).sort(function(x,y){return m[y].reduce(sum,0)-m[x].reduce(sum,0)});function sum(a,b){return a+b}$('out').className='wrap';$('out').innerHTML='<table><thead><tr><th>Team</th><th>First</th><th>Second</th><th>Third</th><th>Total</th></tr></thead><tbody>'+a.map(function(t){var v=m[t];return '<tr><td><b>'+esc(t)+'</b></td><td>'+v[0]+'</td><td>'+v[1]+'</td><td>'+v[2]+'</td><td>'+v.reduce(sum,0)+'</td></tr>'}).join('')+'</tbody></table>'}
function bindPlayers(){document.querySelectorAll('[data-id]').forEach(function(el){el.onclick=function(){showPlayer(el.getAttribute('data-id'))}})}
function showPlayer(id){var p=players.find(function(x){return x.id===id});if(!p)return;$('mt').innerHTML='<h2>'+esc(p.name)+'</h2><div class="muted">'+esc(p.team)+' · '+esc(p.pos)+'</div>';var rows=Object.keys(p.stats).sort().map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+p.stats[k]+'</td></tr>'}).join('');$('mb').innerHTML='<p><b>Score '+p.score.toFixed(1)+'</b> · raw '+p.raw.toFixed(1)+'</p><table><tr><th>Stat</th><th>Value</th></tr>'+rows+'</table>';$('modal').classList.add('open')}
function openDiag(){$('mt').innerHTML='<h2>Diagnostics</h2>';$('mb').innerHTML='<div class="log">'+esc(logs.join('\n')||'No logs')+'</div>';$('modal').classList.add('open')}
function openSettings(){var sh=slots.map(function(s,i){return '<div class="slot"><select class="sn" data-i="'+i+'">'+Object.keys(ELIG).map(function(k){return '<option value="'+k+'" '+(k===s[0]?'selected':'')+'>'+k+'</option>'}).join('')+'</select><input class="sc" data-i="'+i+'" type="number" min="0" max="10" value="'+s[1]+'"><button class="sd" data-i="'+i+'">✕</button></div>'}).join(''),wh=Object.keys(weights).map(function(k){return '<label class="weight"><span>'+k+'</span><input class="wg" data-k="'+k+'" type="number" step=".05" value="'+weights[k]+'"></label>'}).join('');$('mt').innerHTML='<h2>Roster & Scoring</h2>';$('mb').innerHTML='<h3>Roster</h3>'+sh+'<div class="row"><button id="add">+ Slot</button><button id="rs">Reset 22</button></div><h3>Composite weights</h3><div class="weights">'+wh+'</div><div class="row"><button id="save" class="primary">Save</button><button id="rw">Reset weights</button></div>';$('modal').classList.add('open');document.querySelectorAll('.sd').forEach(function(b){b.onclick=function(){slots.splice(Number(b.getAttribute('data-i')),1);openSettings()}});$('add').onclick=function(){slots.push(['WR',1]);openSettings()};$('rs').onclick=function(){slots=DEFAULT_SLOTS.map(function(x){return x.slice()});openSettings()};$('rw').onclick=function(){weights=Object.assign({},DEFAULT_W);openSettings()};$('save').onclick=function(){document.querySelectorAll('.sn').forEach(function(e){slots[Number(e.getAttribute('data-i'))][0]=e.value});document.querySelectorAll('.sc').forEach(function(e){slots[Number(e.getAttribute('data-i'))][1]=Math.max(0,Number(e.value)||0)});document.querySelectorAll('.wg').forEach(function(e){weights[e.getAttribute('data-k')]=Number(e.value)||0});localStorage.setItem('ft-slots',JSON.stringify(slots));localStorage.setItem('ft-weights',JSON.stringify(weights));close();if(players.length){score(players);build();render()}}}
window.addEventListener('error',function(e){status('JavaScript error: '+e.message,true);log('JS ERROR '+e.message+' @ '+e.lineno)});init();
})();
</script></body></html>
