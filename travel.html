<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Travel Lab</title>
<style>
:root{color-scheme:dark;--bg:#07101c;--p:#0e1b2d;--p2:#13253b;--line:#263b55;--text:#f5f8fc;--muted:#91a5bd;--a:#59a8ff;--good:#39d98a;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101c,#091727);color:var(--text);font:14px/1.4 system-ui,sans-serif}.wrap{max-width:1550px;margin:auto;padding:18px}header{position:sticky;top:0;z-index:10;background:#07101cf2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}h1{margin:0;font-size:25px}.sub,.muted{color:var(--muted)}.top,.controls,.tabs{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.controls{margin-top:12px}button,select{background:var(--p);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 11px}button{cursor:pointer}button.active,button:hover{border-color:var(--a);background:#112d4c}.status{margin-top:9px;font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:16px 0}.stat,.panel{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:12px}.stat b{display:block;font-size:21px}.stat span{font-size:9px;text-transform:uppercase;color:var(--muted)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:1000px;background:var(--p)}th,td{padding:9px 10px;border-bottom:1px solid #1d3048;text-align:left}th{position:sticky;top:0;background:#11243a;color:#a9bad0;font-size:10px;text-transform:uppercase}tr:hover td{background:#10243c}.team{display:flex;align-items:center;gap:8px;font-weight:800}.logo{width:28px;height:28px;object-fit:contain}.rank{font-weight:900;color:var(--warn)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px}.game{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:11px}.game .route{font-size:17px;font-weight:900}.game .miles{color:var(--a);font-weight:900}.mapPanel{margin:14px 0;background:var(--p);border:1px solid var(--line);border-radius:13px;padding:12px}.mapHead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.mapBox{position:relative;margin-top:10px;aspect-ratio:1.8/1;min-height:330px;border-radius:11px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#183455,#091625 70%);border:1px solid #27415f}.mapBox svg{position:absolute;inset:0;width:100%;height:100%}.mapLogo{position:absolute;width:30px;height:30px;object-fit:contain;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 3px #000);z-index:3}.traveler{position:absolute;width:36px;height:36px;object-fit:contain;transform:translate(-50%,-50%);z-index:5;filter:drop-shadow(0 0 7px #fff8)}.mapControls{display:flex;gap:6px;align-items:center}.legList{display:flex;gap:6px;overflow:auto;margin-top:8px}.legChip{white-space:nowrap;font-size:10px;padding:5px 7px;background:#0b1728;border:1px solid var(--line);border-radius:8px}.console{margin-top:14px;background:#030914;border:1px solid var(--line);border-radius:12px;overflow:hidden}.console h3{font-size:10px;margin:0;padding:8px 10px;background:#0b1728}.logs{height:145px;overflow:auto;padding:8px 10px;font:10px/1.5 ui-monospace,monospace;color:#a9bad0}.ok{color:#75e6a5}.err{color:#ff8b8b}.api{color:#78b9ff}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div class="wrap"><div class="top"><div><h1>NFL Travel Lab</h1><div class="sub">Season travel mileage · road trips · time-zone changes · league comparison</div></div><div class="tabs"><button id="dashBtn" class="active">League Dashboard</button><button id="detailBtn">Team Detail</button></div></div>
<div class="controls"><select id="season"></select><select id="seasonType"><option value="2">Regular Season</option><option value="3">Postseason</option><option value="1">Preseason</option></select><select id="team"><option value="">All teams</option></select><button id="load">Load Season</button></div><div id="status" class="status">Ready</div></div></header>
<main class="wrap"><section class="stats"><div class="stat"><b id="teams">—</b><span>Teams</span></div><div class="stat"><b id="games">—</b><span>Games</span></div><div class="stat"><b id="miles">—</b><span>League travel miles</span></div><div class="stat"><b id="avg">—</b><span>Avg / team</span></div><div class="stat"><b id="max">—</b><span>Most travel</span></div><div class="stat"><b id="tz">—</b><span>Time-zone changes</span></div></section><div id="content"></div>
<div class="console"><h3>LIVE DATA / CALCULATION CONSOLE</h3><div id="logs" class="logs"></div></div></main>
<script>
const $=x=>document.getElementById(x), state={games:[],teams:new Map(),summary:[],view:'dash',playTimer:null,playIndex:0};
const SCORE='https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
const VENUES={
'ARI':[33.5276,-112.2626,-7],'ATL':[33.7554,-84.4008,-5],'BAL':[39.278,-76.6227,-5],'BUF':[42.7738,-78.7868,-5],'CAR':[35.2258,-80.8528,-5],'CHI':[41.8623,-87.6167,-6],'CIN':[39.0955,-84.5161,-5],'CLE':[41.5061,-81.6995,-5],'DAL':[32.7473,-97.0945,-6],'DEN':[39.7439,-105.0201,-7],'DET':[42.34,-83.0456,-5],'GB':[44.5013,-88.0622,-6],'HOU':[29.6847,-95.4107,-6],'IND':[39.7601,-86.1639,-5],'JAX':[30.3239,-81.6373,-5],'KC':[39.0489,-94.4839,-6],'LV':[36.0909,-115.1833,-8],'LAC':[33.9535,-118.3392,-8],'LAR':[33.9535,-118.3392,-8],'MIA':[25.958,-80.2389,-5],'MIN':[44.9736,-93.2575,-6],'NE':[42.0909,-71.2643,-5],'NO':[29.9511,-90.0812,-6],'NYG':[40.8135,-74.0745,-5],'NYJ':[40.8135,-74.0745,-5],'PHI':[39.9008,-75.1675,-5],'PIT':[40.4468,-80.0158,-5],'SEA':[47.5952,-122.3316,-8],'SF':[37.403,-121.97,-8],'TB':[27.9759,-82.5033,-5],'TEN':[36.1665,-86.7713,-6],'WSH':[38.9078,-76.8645,-5]
};
function log(s,c=''){let d=document.createElement('div');d.className=c;d.textContent='['+new Date().toLocaleTimeString()+'] '+s;$('logs').append(d);$('logs').scrollTop=$('logs').scrollHeight;console.log('[NFL Travel]',s)}
function hav(a,b){const R=3958.8,r=x=>x*Math.PI/180,dlat=r(b[0]-a[0]),dlon=r(b[1]-a[1]);const q=Math.sin(dlat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function teamLogo(abbr){return 'https://a.espncdn.com/i/teamlogos/nfl/500/'+abbr.toLowerCase()+'.png'}
async function fetchWeek(year,st,week){const u=SCORE+'?limit=1000&dates='+year+'&seasontype='+st+'&week='+week;log('GET '+u,'api');const t=performance.now(),r=await fetch(u);log('HTTP '+r.status+' · '+Math.round(performance.now()-t)+'ms · week '+week,r.ok?'ok':'err');if(!r.ok)throw Error(r.status);return r.json()}
function parseEvent(e){const comp=e.competitions?.[0];if(!comp)return null;const cs=comp.competitors||[],home=cs.find(x=>x.homeAway==='home'),away=cs.find(x=>x.homeAway==='away');if(!home||!away)return null;return {id:e.id,date:e.date,week:e.week?.number,home:home.team.abbreviation,away:away.team.abbreviation,homeName:home.team.displayName,awayName:away.team.displayName,venue:comp.venue?.fullName||'',neutral:!!comp.neutralSite}}
async function load(){const y=+$('season').value,st=+$('seasonType').value;$('logs').innerHTML='';log('=== LOAD '+y+' · season type '+st+' ===');$('status').textContent='Loading ESPN schedule…';let all=[];const max=st===2?18:st===1?4:6;const results=await Promise.all(Array.from({length:max},(_,i)=>fetchWeek(y,st,i+1).catch(e=>{log('Week '+(i+1)+' failed: '+e.message,'err');return {events:[]}})));results.forEach(x=>all.push(...(x.events||[]).map(parseEvent).filter(Boolean)));state.games=[...new Map(all.map(g=>[g.id,g])).values()].sort((a,b)=>new Date(a.date)-new Date(b.date));calculate();render();$('status').textContent='Loaded '+state.games.length+' games from ESPN · mileage uses stadium-to-stadium great-circle distance';log('=== COMPLETE · '+state.games.length+' unique games ===','ok')}
function calculate(){state.teams=new Map();state.games.forEach(g=>[g.home,g.away].forEach((a,i)=>{if(!state.teams.has(a))state.teams.set(a,{abbr:a,name:i?g.awayName:g.homeName,games:[],legs:[],miles:0,road:0,tz:0,longest:0});state.teams.get(a).games.push(g)}));for(const t of state.teams.values()){const home=VENUES[t.abbr];if(!home)continue;t.games.sort((a,b)=>new Date(a.date)-new Date(b.date));for(const g of t.games){if(g.away!==t.abbr)continue;const dest=VENUES[g.home];if(!dest)continue;const out=hav(home,dest),back=hav(dest,home);t.road++;t.miles+=out+back;t.longest=Math.max(t.longest,out,back);if(home[2]!==dest[2])t.tz+=2;t.legs.push({from:t.abbr,to:g.home,miles:out,week:g.week,type:'out',date:g.date});t.legs.push({from:g.home,to:t.abbr,miles:back,week:g.week,type:'home',date:g.date})}log(t.abbr+' → '+t.road+' road games · '+t.legs.length+' travel legs INCLUDING RETURN HOME · '+Math.round(t.miles)+' mi','ok')}state.summary=[...state.teams.values()].sort((a,b)=>b.miles-a.miles);state.summary.forEach((t,i)=>t.rank=i+1);buildTeam();stats()}
function stats(){const s=state.summary,total=s.reduce((x,t)=>x+t.miles,0),tz=s.reduce((x,t)=>x+t.tz,0);$('teams').textContent=s.length;$('games').textContent=state.games.length;$('miles').textContent=Math.round(total).toLocaleString();$('avg').textContent=s.length?Math.round(total/s.length).toLocaleString():'—';$('max').textContent=s[0]?s[0].abbr+' '+Math.round(s[0].miles).toLocaleString():'—';$('tz').textContent=tz}
function buildTeam(){const old=$('team').value;$('team').innerHTML='<option value="">All teams</option>'+[...state.teams.values()].sort((a,b)=>a.name.localeCompare(b.name)).map(t=>'<option value="'+t.abbr+'">'+t.name+'</option>').join('');$('team').value=old}
function dashboard(){return '<div class="tablewrap"><table><thead><tr><th>Rank</th><th>Team</th><th>Travel miles</th><th>Road games</th><th>Avg / road game</th><th>Longest leg</th><th>Time-zone changes</th></tr></thead><tbody>'+state.summary.map(t=>'<tr><td class="rank">#'+t.rank+'</td><td><div class="team"><img class="logo" src="'+teamLogo(t.abbr)+'">'+t.name+'</div></td><td><b>'+Math.round(t.miles).toLocaleString()+'</b></td><td>'+t.road+'</td><td>'+Math.round(t.miles/Math.max(t.road,1)).toLocaleString()+'</td><td>'+Math.round(t.longest).toLocaleString()+'</td><td>'+t.tz+'</td></tr>').join('')+'</tbody></table></div>'}
function project(v){const lat=v[0],lon=v[1];return {x:(lon+130)/65*100,y:(52-lat)/29*100}}
function mapHTML(t){const pts=new Set([t.abbr]);t.legs.forEach(l=>{pts.add(l.from);pts.add(l.to)});const lines=t.legs.map((l,i)=>{const a=project(VENUES[l.from]),b=project(VENUES[l.to]);return '<line data-leg="'+i+'" x1="'+a.x+'%" y1="'+a.y+'%" x2="'+b.x+'%" y2="'+b.y+'%" stroke="'+(l.type==='home'?'#39d98a':'#59a8ff')+'" stroke-width="2" opacity=".65"/>'}).join('');const logos=[...pts].filter(x=>VENUES[x]).map(x=>{const p=project(VENUES[x]);return '<img class="mapLogo" title="'+x+'" src="'+teamLogo(x)+'" style="left:'+p.x+'%;top:'+p.y+'%">'}).join('');return '<div class="mapPanel"><div class="mapHead"><div><b>Season Travel Map</b><div class="muted">Blue = outbound · green = return home · every road game includes the trip home</div></div><div class="mapControls"><button id="playMap">▶ Play travel</button><button id="resetMap">Reset</button></div></div><div id="mapBox" class="mapBox"><svg>'+lines+'</svg>'+logos+'<img id="traveler" class="traveler" src="'+teamLogo(t.abbr)+'" style="display:none"></div><div class="legList">'+t.legs.map((l,i)=>'<span class="legChip">#'+(i+1)+' W'+(l.week||'?')+' '+l.from+' → '+l.to+' · '+Math.round(l.miles).toLocaleString()+' mi</span>').join('')+'</div></div>'}
function detail(abbr){const t=state.teams.get(abbr)||state.summary[0];if(!t)return '';let cum=0;const cards=t.legs.map((l,i)=>{cum+=l.miles;return '<div class="game"><div class="muted">Travel leg '+(i+1)+' · Week '+(l.week||'?')+'</div><div class="route">'+l.from+' → '+l.to+'</div><div class="miles">'+Math.round(l.miles).toLocaleString()+' mi</div><div class="muted">'+(l.type==='home'?'Return home':'Travel to road game')+' · cumulative '+Math.round(cum).toLocaleString()+'</div></div>'}).join('');return '<div class="panel"><div class="team"><img class="logo" src="'+teamLogo(t.abbr)+'"><h2>'+t.name+'</h2></div><div class="muted">#'+t.rank+' league travel · '+Math.round(t.miles).toLocaleString()+' estimated miles · '+t.road+' road games · '+t.tz+' time-zone crossings · RETURN HOME INCLUDED</div></div>'+mapHTML(t)+'<div class="cards">'+cards+'</div>'}
function animateMap(t){clearInterval(state.playTimer);state.playIndex=0;const el=$('traveler');if(!el||!t.legs.length)return;el.style.display='block';const move=()=>{if(state.playIndex>=t.legs.length){clearInterval(state.playTimer);return}const l=t.legs[state.playIndex],a=project(VENUES[l.from]),b=project(VENUES[l.to]);el.style.transition='none';el.style.left=a.x+'%';el.style.top=a.y+'%';requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transition='left 1.1s linear, top 1.1s linear';el.style.left=b.x+'%';el.style.top=b.y+'%'}));state.playIndex++};move();state.playTimer=setInterval(move,1400)}
function wireMap(){const t=state.teams.get($('team').value)||state.summary[0];if($('playMap'))$('playMap').onclick=()=>animateMap(t);if($('resetMap'))$('resetMap').onclick=()=>{clearInterval(state.playTimer);const e=$('traveler');if(e)e.style.display='none'}}
function render(){const pick=$('team').value;if(pick){state.view='detail';$('dashBtn').classList.remove('active');$('detailBtn').classList.add('active')} $('content').innerHTML=state.view==='dash'?dashboard():detail(pick);if(state.view==='detail')wireMap()}
function init(){const y=new Date().getFullYear();$('season').innerHTML=Array.from({length:27},(_,i)=>'<option value="'+(y-i)+'">'+(y-i)+' season</option>').join('');$('dashBtn').onclick=()=>{state.view='dash';$('team').value='';$('dashBtn').classList.add('active');$('detailBtn').classList.remove('active');render()};$('detailBtn').onclick=()=>{state.view='detail';$('detailBtn').classList.add('active');$('dashBtn').classList.remove('active');render()};$('team').onchange=render;$('load').onclick=load;$('season').onchange=load;$('seasonType').onchange=load;load()}init();
</script></body></html>
