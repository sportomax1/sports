<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Player Timeline</title><style>:root{--bg:#090d12;--p:#111823;--p2:#172131;--line:#28364a;--txt:#f3f6fa;--mut:#8d9caf;--blue:#4da3ff;--pw:258px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:12px system-ui;overflow:hidden}header{height:76px;background:#0c1119;border-bottom:1px solid var(--line);padding:5px 7px}.row{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow-x:auto;margin-bottom:4px}.brand{font-size:14px;font-weight:900}.btn,input,select,.chip{height:29px;border:1px solid var(--line);border-radius:6px;background:var(--p);color:var(--txt);padding:0 7px}.btn{font-weight:750;cursor:pointer}.primary{background:#1676d2}.chip{display:flex;align-items:center;gap:4px}.mut{color:var(--mut)}#status{margin-left:auto;color:var(--mut)}#prog{height:2px;background:#172131}#prog i{display:block;height:100%;width:0;background:var(--blue)}main{height:calc(100vh - 76px);overflow:auto}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}th,td{height:41px;padding:2px 4px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:47px;background:var(--bg)}th{height:29px;position:sticky;top:0;z-index:10;background:var(--p2);font-size:10px}.player{position:sticky!important;left:0;z-index:12!important;width:var(--pw);min-width:var(--pw);max-width:var(--pw);text-align:left;border-right:2px solid #40536e}.pb{display:grid;grid-template-columns:32px 1fr auto;gap:6px;align-items:center}.photo{width:32px;height:32px;border-radius:50%;object-fit:contain}.nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta,.metrics{font-size:9px;color:var(--mut)}.metrics b{display:block;color:var(--blue)}.logos{display:flex;justify-content:center;gap:1px}.logo{width:26px;height:26px;object-fit:contain}.logo.m{width:19px;height:19px}.dot{color:#33445a}.empty{padding:50px;text-align:center;color:var(--mut)}</style></head><body><header><div class="row"><b class="brand">NFL TIMELINE</b><button class="btn primary" id="scan">Start Progressive Load</button><button class="btn" id="current">Current Only</button><button class="btn" id="pause" disabled>Pause</button><select id="speed"><option value="10">Normal 10</option><option value="25">Fast 25</option><option value="50" selected>Turbo 50</option></select><label class="chip"><input type="checkbox" id="force">Rescan</label><span class="mut">Newest → oldest:</span><select id="from"></select><span>→</span><select id="to"></select><input id="q" placeholder="Player…"><select id="pos"><option value="">All pos</option></select><select id="team"><option value="">All teams</option></select><select id="teamMode"><option value="ever">Ever team</option><option value="current">Current team</option><option value="year">Team in year</option></select><span id="status">Ready</span></div><div class="row"><select id="year"><option value="">Any year</option></select><label class="chip"><input type="checkbox" id="played">Active in year</label><select id="teamsN"><option value="">Teams: any</option><option value="1">1 only</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option><option value="5">5+</option></select><select id="seasonsN"><option value="">Seasons: any</option><option value="1">1</option><option value="2-4">2–4</option><option value="5-9">5–9</option><option value="10-14">10–14</option><option value="15">15+</option></select><select id="sort"><option value="name">Name</option><option value="teams">Most teams</option><option value="seasons">Most seasons</option><option value="debut">Newest debut</option><option value="last">Most recent</option></select><label class="chip"><input type="checkbox" id="active">Current only</label><button class="btn" id="recent">15 yrs</button><button class="btn" id="all">All yrs</button><button class="btn" id="clear">Clear</button></div><div id="prog"><i></i></div></header><main id="main"><table><thead id="head"></thead><tbody id="body"></tbody></table><div class="empty" id="empty">Start Progressive Load. Newest season loads first, then prior seasons are added automatically.</div></main><script>const START=1920,NOW=new Date().getFullYear(),BASE='https://sports.core.api.espn.com/v2/sports/football/leagues/nfl';const $=x=>document.querySelector(x),sleep=x=>new Promise(r=>setTimeout(r,x));let P=new Map(),T=new Map(),stop=false,running=false,allYears=false,view=[],years=[];function refId(r){let m=String(r||'').match(/\/(\d+)(?:\?.*)?$/);return m?m[1]:''}function teamObj(t){if(!t)return null;let id=String(t.id||refId(t.$ref));if(!id)return null;let o={id,abbr:t.abbreviation||'',name:t.displayName||t.name||'',logo:t.logos?.[0]?.href||t.logo||''};T.set(id,{...(T.get(id)||{}),...o});return T.get(id)}async function get(u,n=2){for(let i=0;i<=n;i++)try{let r=await fetch(u.replace(/^http:/,'https:'));if(!r.ok)throw Error(r.status);return await r.json()}catch(e){if(i===n)throw e;await sleep(300*(i+1))}}function db(){return new Promise((ok,no)=>{let r=indexedDB.open('nflTimelineV2',2);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('p'))d.createObjectStore('p',{keyPath:'id'});if(!d.objectStoreNames.contains('m'))d.createObjectStore('m',{keyPath:'k'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function save(a){if(!a.length)return;let d=await db();await new Promise(ok=>{let x=d.transaction('p','readwrite'),s=x.objectStore('p');a.forEach(v=>s.put(v));x.oncomplete=ok})}async function loadCache(){let d=await db();return new Promise(ok=>{let r=d.transaction('p').objectStore('p').getAll();r.onsuccess=()=>ok(r.result)})}async function metaGet(k){let d=await db();return new Promise(ok=>{let r=d.transaction('m').objectStore('m').get(k);r.onsuccess=()=>ok(r.result?.v)})}async function metaSet(k,v){let d=await db();return new Promise(ok=>{let x=d.transaction('m','readwrite');x.objectStore('m').put({k,v});x.oncomplete=ok})}function workers(){return +$('#speed').value||25}function upsert(a,y,t){let id=String(a.id||refId(a.$ref));if(!id)return;let p=P.get(id)||{id,name:a.displayName||a.fullName||`Player ${id}`,pos:a.position?.abbreviation||'',head:a.headshot?.href||`https://a.espncdn.com/i/headshots/nfl/players/full/${id}.png`,active:!!a.active,currentTeam:'',seasons:{}};p.name=a.displayName||a.fullName||p.name;p.pos=a.position?.abbreviation||p.pos;if(a.active!=null)p.active=!!a.active;if(t){T.set(t.id,t);let z=p.seasons[y]||[];if(!z.includes(t.id))z.push(t.id);p.seasons[y]=z;if(y===NOW&&p.active)p.currentTeam=t.id}P.set(id,p)}async function pool(items,n,fn){let q=[...items];await Promise.all(Array.from({length:n},async()=>{while(q.length&&!stop)await fn(q.shift())}))}async function teamsNow(){let d=await get('https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams?limit=40');for(let e of d.sports?.[0]?.leagues?.[0]?.teams||[])teamObj(e.team)}async function loadCurrent(){await teamsNow();let d=await get('https://sports.core.api.espn.com/v3/sports/football/nfl/athletes?active=true&limit=2000');for(let a of d.items||[]){let t=teamObj(a.team);upsert(a,NOW,t)}await save([...P.values()]);controls();filter()}async function seasonTeams(y){let d=await get(`${BASE}/seasons/${y}/teams?limit=100`),out=new Map();await pool(d.items||[],Math.min(workers(),32),async r=>{let x=await get(r.$ref||r,1),o=teamObj(x);if(o)out.set(o.id,o)});return out}async function roster(y,t){for(let u of [`${BASE}/seasons/${y}/teams/${t.id}/athletes?limit=100`,`${BASE}/seasons/${y}/types/2/teams/${t.id}/athletes?limit=100`])try{let d=await get(u,1),it=d.items||[];if(!it.length)continue;await pool(it,Math.min(workers(),25),async x=>{try{let a=(x.displayName||x.id)?x:await get(x.$ref,1);upsert(a,y,t)}catch{}});return it.length}catch{}return 0}async function scanSeason(y){if(!$('#force').checked&&await metaGet(`season:${y}`))return;let td=await seasonTeams(y),list=[...td.values()],done=0,total=0;await pool(list,Math.min(workers(),list.length),async t=>{total+=await roster(y,t);done++;$('#prog i').style.width=(done/list.length*100)+'%';$('#status').textContent=`${y}: ${done}/${list.length} teams • ${total} players`;if(done===1||done%4===0){controls();filter();await sleep(0)}});if(!stop){await save([...P.values()].filter(p=>p.seasons[y]));await metaSet(`season:${y}`,{done:true,at:Date.now()})}}async function scan(){if(running)return;running=true;stop=false;$('#scan').disabled=true;$('#pause').disabled=false;let a=+$('#from').value,b=+$('#to').value;if(a<b)[a,b]=[b,a];for(let y=a;y>=b&&!stop;y--){$('#status').textContent=`${y}: starting`;try{await scanSeason(y)}catch(e){console.warn(y,e)}controls();filter();await sleep(20)}running=false;$('#scan').disabled=false;$('#pause').disabled=true;$('#status').textContent=stop?'Paused':'Complete ✓'}function dataYears(){let s=new Set();for(let p of P.values())Object.keys(p.seasons).forEach(y=>s.add(+y));return [...s].sort((a,b)=>b-a)}function controls(){let oy=$('#year').value,ot=$('#team').value,op=$('#pos').value;years=dataYears();$('#year').innerHTML='<option value="">Any year</option>'+years.map(y=>`<option ${y==oy?'selected':''}>${y}</option>`).join('');$('#pos').innerHTML='<option value="">All pos</option>'+[...new Set([...P.values()].map(p=>p.pos).filter(Boolean))].sort().map(x=>`<option ${x===op?'selected':''}>${x}</option>`).join('');$('#team').innerHTML='<option value="">All teams</option>'+[...T.values()].sort((a,b)=>(a.name||a.abbr).localeCompare(b.name||b.abbr)).map(t=>`<option value="${t.id}" ${t.id===ot?'selected':''}>${t.abbr||t.name}</option>`).join('')}function tc(p){return new Set(Object.values(p.seasons).flat()).size}function sy(p){return Object.keys(p.seasons).map(Number).sort((a,b)=>a-b)}function filter(){let q=$('#q').value.toLowerCase(),pos=$('#pos').value,tid=$('#team').value,mode=$('#teamMode').value,y=$('#year').value,tn=$('#teamsN').value,sn=$('#seasonsN').value,act=$('#active').checked,played=$('#played').checked;view=[...P.values()].filter(p=>{let ys=sy(p),n=tc(p);if(q&&!p.name.toLowerCase().includes(q)||pos&&p.pos!==pos||act&&!p.active||played&&y&&!p.seasons[y])return false;if(tid&&((mode==='current'&&p.currentTeam!==tid)||(mode==='ever'&&!Object.values(p.seasons).flat().includes(tid))||(mode==='year'&&(!y||!p.seasons[y]?.includes(tid)))))return false;if(tn&&(+tn===1?n!==1:n<+tn))return false;if(sn){let z=ys.length;if(sn==='1'&&z!==1||sn==='2-4'&&(z<2||z>4)||sn==='5-9'&&(z<5||z>9)||sn==='10-14'&&(z<10||z>14)||sn==='15'&&z<15)return false}return true});let s=$('#sort').value;view.sort((a,b)=>s==='teams'?tc(b)-tc(a):s==='seasons'?sy(b).length-sy(a).length:s==='debut'?Math.min(...sy(b))-Math.min(...sy(a)):s==='last'?Math.max(...sy(b))-Math.max(...sy(a)):a.name.localeCompare(b.name));render()}function render(){let ys=years.length?years:[NOW];if(!allYears)ys=ys.filter(y=>y>=NOW-14);$('#head').innerHTML=`<tr><th class="player">Player (${view.length})</th>${ys.map(y=>`<th>${y}</th>`).join('')}</tr>`;$('#body').innerHTML=view.slice(0,1500).map(p=>{let py=sy(p);return `<tr><td class="player"><div class="pb"><img class="photo" loading="lazy" src="${p.head}"><div><div class="nm">${p.name}</div><div class="meta">${p.pos||'—'} • ${p.active?'CURRENT':'INACTIVE'} • ${py[0]||''}–${py.at(-1)||''}</div></div><div class="metrics"><b>${tc(p)}T</b>${py.length} yr</div></div></td>${ys.map(y=>{let ids=p.seasons[y]||[];return `<td>${ids.length?`<div class="logos">${ids.map(id=>{let t=T.get(id)||{};return t.logo?`<img class="logo ${ids.length>1?'m':''}" title="${t.name||t.abbr}" src="${t.logo}">`:`<small>${t.abbr||id}</small>`}).join('')}</div>`:'<span class="dot">·</span>'}</td>`}).join('')}</tr>`}).join('');$('#status').textContent=`${view.length} matches • ${P.size} cached players`}for(let id of ['q','pos','team','teamMode','year','teamsN','seasonsN','sort','active','played'])$('#'+id).addEventListener(id==='q'?'input':'change',filter);$('#scan').onclick=scan;$('#current').onclick=loadCurrent;$('#pause').onclick=()=>stop=true;$('#recent').onclick=()=>{allYears=false;render()};$('#all').onclick=()=>{allYears=true;render()};$('#clear').onclick=()=>location.reload();for(let id of ['from','to'])$('#'+id).innerHTML=Array.from({length:NOW-START+1},(_,i)=>`<option>${NOW-i}</option>`).join('');$('#from').value=NOW;$('#to').value=START;(async()=>{await teamsNow().catch(()=>{});for(let p of await loadCache())P.set(p.id,p);controls();filter();if(P.size)$('#empty').style.display='none'})();</script></body></html>
