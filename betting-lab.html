<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Betting Lab</title><style>body{margin:0;background:#07101d;color:#eef4ff;font:14px system-ui}.w{max-width:1300px;margin:auto;padding:18px}.muted{color:#91a3ba}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}select,button{padding:8px;background:#101d31;color:#fff;border:1px solid #31445f;border-radius:8px}button{background:#1769c2;font-weight:900}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card,.box{background:#0e192a;border:1px solid #26364d;border-radius:10px;padding:10px}.card b{font-size:20px;display:block}.box{overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #26364d;text-align:center}.win{color:#72dfa2}.loss{color:#ff8b8b}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class=w><h1>💰 NFL Betting Lab</h1><div class=muted>Historical spread and over/under results from odds embedded in ESPN scoreboards. No paid API key required when ESPN supplies the odds.</div><div class=controls><select id=year></select><select id=team><option value=ALL>All Teams</option></select><button id=go>Load Betting Results</button></div><div id=status class=muted>Ready.</div><div id=cards class=cards style="margin-top:12px"></div><div class=box><table id=tbl></table></div></div><script>const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl';for(let y=new Date().getFullYear();y>=2002;y--)year.add(new Option(y,y));let data=[];async function J(u){let r=await fetch(u);return r.json()}function render(){let a=team.value==='ALL'?data:data.filter(x=>x.away===team.value||x.home===team.value),atsW=0,atsL=0,ov=0,un=0,push=0;for(const x of a){if(x.ats==='W')atsW++;if(x.ats==='L')atsL++;if(x.ou==='O')ov++;if(x.ou==='U')un++;if(x.ats==='P'||x.ou==='P')push++}cards.innerHTML=`<div class=card><b>${a.length}</b>Games with odds</div><div class=card><b>${atsW}-${atsL}</b>ATS wins-losses</div><div class=card><b>${ov}-${un}</b>Over-under</div><div class=card><b>${push}</b>Push flags</div>`;tbl.innerHTML='<tr><th>Week</th><th>Game</th><th>Score</th><th>Spread</th><th>Total</th><th>ATS*</th><th>O/U</th></tr>'+a.map(x=>`<tr><td>${x.week}</td><td>${x.away} @ ${x.home}</td><td>${x.as}-${x.hs}</td><td>${x.details||'—'}</td><td>${x.total||'—'}</td><td>${x.ats}</td><td class="${x.ou==='O'?'win':x.ou==='U'?'loss':''}">${x.ou}</td></tr>`).join('')}go.onclick=async()=>{go.disabled=true;data=[];try{let teams=new Set;for(let w=1;w<=(+year.value>=2021?18:17);w++){status.textContent=`Loading week ${w}…`;let s=await J(`${B}/scoreboard?limit=100&dates=${year.value}&seasontype=2&week=${w}`);for(const e of s.events||[]){if(!e.status?.type?.completed)continue;let c=e.competitions?.[0],od=c?.odds?.[0];if(!od)continue;let h=c.competitors?.find(x=>x.homeAway==='home'),a=c.competitors?.find(x=>x.homeAway==='away');if(!h||!a)continue;let hs=+h.score,as=+a.score,total=Number(od.overUnder),details=od.details||'',ou=!isFinite(total)?'—':hs+as>total?'O':hs+as<total?'U':'P';let ats='—';/* ESPN details generally expresses favored team + signed spread. */let mm=details.match(/^([A-Z]{2,4})\s+(-?\d+(?:\.\d+)?)/),fav=mm?.[1],sp=mm?Math.abs(+mm[2]):NaN;if(fav&&isFinite(sp)){let favScore=fav===h.team.abbreviation?hs:fav===a.team.abbreviation?as:null,other=fav===h.team.abbreviation?as:fav===a.team.abbreviation?hs:null;if(favScore!=null){let margin=favScore-other;ats=margin>sp?'W':margin<sp?'L':'P'}}data.push({week:w,home:h.team.abbreviation,away:a.team.abbreviation,hs,as,total,details,ou,ats});teams.add(h.team.abbreviation);teams.add(a.team.abbreviation)}}team.innerHTML='<option value=ALL>All Teams</option>'+[...teams].sort().map(t=>`<option>${t}</option>`).join('');render();status.textContent=`Loaded ${data.length} games with ESPN odds. ATS column is shown from the listed favorite's perspective; team filter currently filters games, not recalculated team-side ATS.`}catch(e){status.textContent='Failed: '+e.message}finally{go.disabled=false}};team.onchange=render</script></body></html>
